<!-- =========================================================
     AI PROMPT LIBRARY
     Novare Nexus / ONESCA
     ---------------------------------------------------------
     Purpose:
     - Dedicated AI Prompt Library landing page.
     - Hero only for Phase 1.
     - Blank content surface below the hero for future modules.
     - No human faces in the hero.
========================================================== -->

<section
  class="ai-prompt-library-page"
  data-page="ai-prompt-library"
  aria-labelledby="ai-prompt-library-title"
>

  <!-- =======================================================
       HERO
       Uses the same semantic contract as other Nexus heroes.
  ======================================================== -->
  <section
    class="ai-prompt-library-hero page-hero"
    data-page-hero
    aria-labelledby="ai-prompt-library-title"
  >
    <div class="ai-prompt-library-hero-media" aria-hidden="true">
      <img
        id="ai-prompt-library-hero-image"
        class="ai-prompt-library-hero-image"
        data-image-key="ai-prompt-library-hero"
        alt=""
        width="2048"
        height="768"
        loading="eager"
        decoding="async"
        fetchpriority="high"
        hidden
      >

      <div
        id="ai-prompt-library-hero-fallback"
        class="image-placeholder ai-prompt-library-hero-fallback"
        data-image-fallback="ai-prompt-library-hero"
        role="img"
        aria-label="AI Prompt Library hero visual unavailable"
        hidden
      ></div>

      <div class="ai-prompt-library-hero-overlay"></div>
    </div>

    <div class="ai-prompt-library-hero-content">
      <div class="ai-prompt-library-hero-copy">

        <p class="ai-prompt-library-eyebrow">
          AI PROMPT LIBRARY
        </p>

        <h1
          id="ai-prompt-library-title"
          data-page-title
          tabindex="-1"
        >
          <span>Smarter Prompts.</span>
          <span><strong>Stronger Outcomes.</strong></span>
        </h1>

        <p class="ai-prompt-library-hero-description">
          Ready-to-use prompt patterns for discovery, proposals,
          solutioning, delivery, and everyday productivity.
        </p>

      </div>
    </div>
  </section>

  <!-- =======================================================
       FUTURE CONTENT AREA
       Intentionally blank for now.
       Do not add cards, headings, buttons, or sample prompts yet.
  ======================================================== -->
  <section
    id="ai-prompt-library-content"
    class="ai-prompt-library-placeholder"
    aria-label="AI Prompt Library content area"
  >
    <div
      class="ai-prompt-library-placeholder-surface"
      aria-hidden="true"
    ></div>
  </section>

</section>
