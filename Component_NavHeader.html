      <header id="nexus-nav-header" class="nexus-nav-header shadow-sm" data-global-nav-header>
        <button id="sidebar-toggle" class="icon-button sidebar-toggle" type="button" aria-label="Open navigation" aria-controls="nexus-sidebar" aria-expanded="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>

        <form id="global-search-form" class="global-search" role="search" novalidate>
          <svg class="global-search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>

          <input id="global-search" type="search" aria-keyshortcuts="Control+k Meta+k" aria-label="Search ONESCA" placeholder="Search knowledge, templates, playbooks, tools, and more..." autocomplete="off">

          <kbd class="search-keycap" aria-hidden="true">Ctrl K</kbd>

          <div id="search-filters" class="search-filters">
            <button id="mobile-filter-trigger" class="mobile-filter-trigger" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="search-filter-options" aria-label="Choose search source">
              <span id="mobile-filter-label" class="mobile-filter-label">All</span>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
            </button>

            <div id="search-filter-options" class="search-filter-options" role="group" aria-label="Search filters">
              <button class="pill filter-chip" type="button" data-filter="all" aria-pressed="true"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#0068F5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 9 9-6 9 6-9 6Zm0 5 9 6 9-6"/></svg>All</button>
              <button class="pill filter-chip" type="button" data-filter="drive" aria-pressed="false"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#16365B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 3 6 0 7 12-3 5H5l-3-5Zm0 0L2 15h20M15 3 8 15l3 5"/></svg>Drive</button>
              <button class="pill filter-chip" type="button" data-filter="docs" aria-pressed="false"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#168BFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h10l4 4v14H5ZM14 3v5h5M8 12h8M8 16h8"/></svg>Docs</button>
              <button class="pill filter-chip" type="button" data-filter="sheets" aria-pressed="false"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#13A765" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h10l4 4v14H5ZM14 3v5h5M8 11h8v7H8Zm4 0v7M8 14h8"/></svg>Sheets</button>
              <button class="pill filter-chip" type="button" data-filter="slides" aria-pressed="false"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FF9A14" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h10l4 4v14H5ZM14 3v5h5M8 11h8v6H8Z"/></svg>Slides</button>
            </div>
          </div>
        </form>

        <div class="nexus-user-view-control" data-user-view-control>
          <div class="user-profile user-profile--header-left is-loading" data-user-profile aria-label="Loading current user" aria-busy="true" aria-expanded="false">
            <div id="user-avatar" class="image-placeholder avatar-placeholder" data-image-key="user-avatar" role="img" aria-label="User avatar">U</div>
            <div class="user-details">
              <span id="user-name" class="user-name">Loading...</span>
              <span id="user-email" class="user-department">Loading email...</span>
            </div>
          </div>

          <div id="nexus-user-view-menu" class="nexus-user-view-menu" role="menu" aria-label="View Nexus as" hidden>
            <div class="nexus-user-view-menu-heading">
              <div class="nexus-user-view-menu-label">View as</div>
              <div class="nexus-user-view-menu-hint">Preview how Nexus behaves for each role</div>
            </div>
            <button class="nexus-user-view-option" type="button" role="menuitemradio" aria-checked="true" data-view-as="admin">
              <span class="nexus-user-view-option-icon" aria-hidden="true">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 19 6v5c0 5-3 8-7 10-4-2-7-5-7-10V6l7-3Z"/><path d="m9 12 2 2 4-4"/></svg>
              </span>
              <span class="nexus-user-view-option-copy"><strong>Admin</strong><small>Manage Nexus resources</small></span>
              <span class="nexus-user-view-option-check" aria-hidden="true">✓</span>
            </button>
            <button class="nexus-user-view-option" type="button" role="menuitemradio" aria-checked="false" data-view-as="user">
              <span class="nexus-user-view-option-icon" aria-hidden="true">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
              </span>
              <span class="nexus-user-view-option-copy"><strong>User</strong><small>Preview the standard experience</small></span>
              <span class="nexus-user-view-option-check" aria-hidden="true">✓</span>
            </button>
          </div>
        </div>

        <div id="nexus-view-as-indicator" class="nexus-view-as-indicator" role="status" hidden>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg>
          <span>Viewing as User</span>
        </div>
      </header>
