        ? value.quickAccess
        : fallback.quickAccess
    };

  function escapeOpportunitiesHtml(value) {

      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  function extractDriveFileId(value) {
    if (!value) return "";
    const text = String(value).trim();
    if (/^[A-Za-z0-9_-]{20,}$/.test(text)) return text;

    const fileMatch = text.match(/\/file\/d\/([A-Za-z0-9_-]+)/);
    if (fileMatch) return fileMatch[1];

    const idMatch = text.match(/[?&]id=([A-Za-z0-9_-]+)/);
    return idMatch ? idMatch[1] : "";
  }

  function getDriveImageCandidates(assetOrUrl, width = 1600) {
    const fileId = typeof assetOrUrl === "object"
      ? (assetOrUrl.fileId || extractDriveFileId(assetOrUrl.viewerUrl))
      : extractDriveFileId(assetOrUrl);

    if (!fileId) return [];

    const encodedId = encodeURIComponent(fileId);
    const safeWidth = Math.max(64, Math.round(Number(width) || 1600));

    // Try more than one Google-hosted image endpoint. Different Workspace /
    // iframe / sharing configurations can behave differently across endpoints.
    return [
      "https://drive.google.com/thumbnail?id=" + encodedId + "&sz=w" + safeWidth,
      "https://lh3.googleusercontent.com/d/" + encodedId + "=w" + safeWidth,
      "https://drive.google.com/uc?export=view&id=" + encodedId
    ];
  }

  function bindImageCandidates(image, fallback, candidates) {
    if (!image) return;

    const key = image.dataset.imageKey || image.alt || "image";
    const cacheKey = "nexus.asset.success." + key;
    let urls = Array.from(new Set((candidates || []).filter(Boolean)));

    try {
      const cachedUrl = window.sessionStorage.getItem(cacheKey);
      if (cachedUrl && urls.includes(cachedUrl)) {
        urls = [cachedUrl].concat(urls.filter(function (url) { return url !== cachedUrl; }));
      }
    } catch (error) {
      // Storage can be unavailable in some iframe/privacy modes; image loading still works without it.
    }

    let index = 0;
    let currentUrl = "";
    let loadTimer = null;

    function clearLoadTimer() {
      if (loadTimer) {
        window.clearTimeout(loadTimer);
        loadTimer = null;
      }
    }

    function showFallback() {
      clearLoadTimer();
      image.dataset.assetState = "error";
      image.hidden = true;
      image.style.visibility = "";
      image.removeAttribute("src");
      if (fallback) fallback.hidden = false;
      console.warn("Nexus asset could not be loaded:", key, urls);
    }

    function tryNext() {
      clearLoadTimer();
      if (index >= urls.length) {
        showFallback();
        return;
      }

      currentUrl = urls[index++];
      image.dataset.assetState = "loading";

      // Do not keep a lazy-loaded image display:none/hidden while assigning src.
      // Browsers may otherwise defer it indefinitely and never fire load/error.
      image.hidden = false;
      image.style.visibility = "hidden";
      if (fallback) fallback.hidden = false;

      image.removeAttribute("src");
      image.src = currentUrl;

      // Prevent a stalled third-party image request from leaving an empty card forever.
      loadTimer = window.setTimeout(function () {
        if (image.dataset.assetState === "loading") tryNext();
      }, 10000);
    }

    function retryAll() {
      index = 0;
      currentUrl = "";
      tryNext();
    }

    image._nexusRetryAsset = retryAll;

    image.onload = function () {
      clearLoadTimer();
      if (!image.naturalWidth) {
        tryNext();
        return;
      }

      image.dataset.assetState = "loaded";
      image.hidden = false;
      image.style.visibility = "visible";
      if (fallback) fallback.hidden = true;

      try {
        if (currentUrl) window.sessionStorage.setItem(cacheKey, currentUrl);
      } catch (error) {
        // Ignore storage failures; successful image display is sufficient.
      }
    };

    image.onerror = function () {
      clearLoadTimer();
      tryNext();
    };

    tryNext();
  }

  function applyOfferingsFilter(pageRoot, filterKey, announce) {
    if (!pageRoot) return;

    const normalizedFilter = String(filterKey || "").toLowerCase();
    const cards = Array.from(pageRoot.querySelectorAll(".core-offering-card"));
    const chips = Array.from(pageRoot.querySelectorAll("[data-offerings-filter]"));

    pageRoot.dataset.activeOfferingFilter = normalizedFilter;

    cards.forEach(function (card) {
      const matches = !normalizedFilter || card.dataset.coe === normalizedFilter;
      card.hidden = !matches;
      card.setAttribute("aria-hidden", String(!matches));
    });

    chips.forEach(function (chip) {
      const selected = chip.dataset.offeringsFilter === normalizedFilter && Boolean(normalizedFilter);
      chip.setAttribute("aria-pressed", String(selected));
      chip.classList.toggle("is-selected", selected);
    });

    const grid = pageRoot.querySelector("#core-offerings-grid");
    if (grid) {
      grid.classList.toggle("is-filtered", Boolean(normalizedFilter));
    }

    if (announce) {
      const activeChip = chips.find(function (chip) {
        return chip.dataset.offeringsFilter === normalizedFilter;
      });

      showOfferingsStatus(
        pageRoot,
        normalizedFilter && activeChip
          ? "Showing " + activeChip.textContent.trim() + " Core Offerings. Select it again to show all."
          : "Showing all Core Offerings."
      );
    }
  }

  function handleOfferingsFilter(pageRoot, chip) {
    const requested = chip.dataset.offeringsFilter || "";
    const current = pageRoot.dataset.activeOfferingFilter || "";
    applyOfferingsFilter(pageRoot, current === requested ? "" : requested, true);
  }

        dot.setAttribute("aria-label", "Show featured item " + (index + 1) + ": " + item.title);
        dot.setAttribute("aria-controls", card.id);
        dot.addEventListener("click", function () {
          card.scrollIntoView({ behavior: getScrollBehavior(), block: "nearest", inline: "start" });
        });
        pagination.appendChild(dot);
      }
    });

    function getCards() {
      return Array.from(track.querySelectorAll(".featured-card"));
    }

    function updateCarouselState() {
      const cards = getCards();
      if (!cards.length) return;
      const trackRect = track.getBoundingClientRect();
      let activeIndex = 0;
      let nearest = Infinity;

      cards.forEach(function (card, index) {
        const distance = Math.abs(card.getBoundingClientRect().left - trackRect.left);
        if (distance < nearest) {
          nearest = distance;
          activeIndex = index;
        }
      });

      if (pagination) {
        Array.from(pagination.querySelectorAll(".featured-dot")).forEach(function (dot, index) {
          const active = index === activeIndex;
          dot.classList.toggle("is-active", active);
          dot.setAttribute("aria-current", active ? "true" : "false");
        });
      }

      const maxScroll = Math.max(0, track.scrollWidth - track.clientWidth);
      if (prev) prev.disabled = track.scrollLeft <= 4;
      if (next) next.disabled = track.scrollLeft >= maxScroll - 4;
    }

    function scrollFeatured(direction) {
      const card = track.querySelector(".featured-card");
      if (!card) return;
      const gap = parseFloat(getComputedStyle(track).gap) || 12;
      track.scrollBy({ left: direction * (card.getBoundingClientRect().width + gap), behavior: getScrollBehavior() });
    }

    if (prev) prev.addEventListener("click", function () { scrollFeatured(-1); });
    if (next) next.addEventListener("click", function () { scrollFeatured(1); });
    track.addEventListener("scroll", updateCarouselState, { passive: true });
    track.addEventListener("keydown", function (event) {
      if (event.key === "ArrowLeft") {
        event.preventDefault();
        scrollFeatured(-1);
      } else if (event.key === "ArrowRight") {
        event.preventDefault();
        scrollFeatured(1);
      }
    });
    window.addEventListener("resize", updateCarouselState);

    if (viewAll) {
      viewAll.addEventListener("click", function () {
        showHomeSectionStatus(pageRoot, "The full Featured content library will be connected in a later phase.");
      });
    }

    track.dataset.rendered = "true";
    requestAnimationFrame(updateCarouselState);
  }

      const buttons = Array.from(track.querySelectorAll("button"));
      if (!buttons.length) return;
      const current = buttons.indexOf(document.activeElement);
      const index = Number(next.dataset.nextIndex || 0);
      const targetIndex = current >= 0 ? (current + 1) % buttons.length : index % buttons.length;
      const target = buttons[targetIndex];
      target.focus();
      target.scrollIntoView({ block: "nearest", inline: "nearest" });

  // 6. GLOBAL NAV HEADER SCROLL EFFECT
  let navHeaderScrollFrame = 0;

  function getPageScrollTop() {
    return Math.max(
      window.scrollY || 0,
      document.documentElement ? document.documentElement.scrollTop || 0 : 0,
      document.body ? document.body.scrollTop || 0 : 0,
      dom.workspace ? dom.workspace.scrollTop || 0 : 0
    );
  }

  function updateNavHeaderScrollEffect() {
    navHeaderScrollFrame = 0;
    if (!dom.navHeader) return;

    if (!dom.app.classList.contains("hero-route")) {
      dom.navHeader.style.removeProperty("--nav-header-opacity");
      dom.navHeader.style.removeProperty("--nav-header-border-opacity");
      dom.navHeader.style.removeProperty("--nav-header-shadow-opacity");
      dom.navHeader.style.removeProperty("--nav-header-blur");
      return;
    }

    // When the active route has a page hero, the global header is transparent at the top.
    // Over the first 180px of scroll,
    // fade in a frosted surface so dashboard content stays readable beneath it.
    const progress = Math.max(0, Math.min(1, getPageScrollTop() / 180));
    const eased = 1 - Math.pow(1 - progress, 2);

    dom.navHeader.style.setProperty("--nav-header-opacity", (eased * 0.94).toFixed(3));
    dom.navHeader.style.setProperty("--nav-header-border-opacity", (eased * 0.72).toFixed(3));
    dom.navHeader.style.setProperty("--nav-header-shadow-opacity", (eased * 0.08).toFixed(3));
    dom.navHeader.style.setProperty("--nav-header-blur", (eased * 14).toFixed(1) + "px");
  }

  function scheduleNavHeaderScrollEffect() {
    if (navHeaderScrollFrame) return;
    navHeaderScrollFrame = window.requestAnimationFrame(updateNavHeaderScrollEffect);
  }

  // 6. SPA ROUTING
  function setActiveNavigation(route) {
    dom.navItems.forEach(function (item) {
      const active = item.dataset.route === route;
      item.classList.toggle("is-active", active);
      if (active) item.setAttribute("aria-current", "page");
      else item.removeAttribute("aria-current");
    });
  }

  function ensurePage(route) {
    if (pageCache.has(route)) return pageCache.get(route);

    const page = routes[route];
    const template = document.getElementById(page.templateId);
    if (!template || !dom.pageMount) return null;

    const wrapper = document.createElement("div");
    wrapper.className = "route-page";
    wrapper.dataset.pageRoute = route;
    wrapper.hidden = true;
    wrapper.appendChild(template.content.cloneNode(true));
    dom.pageMount.appendChild(wrapper);
    pageCache.set(route, wrapper);

    if (route === "home") initializeHomePage(wrapper);
    if (route === "overview") initializeOverviewPage(wrapper);
    if (route === "offerings") initializeOfferingsPage(wrapper);
    if (route === "opportunities") initializeOpportunitiesPage(wrapper);
    if (route === "programs") initializeProgramsPage(wrapper);
    if (route === "delivery") initializeDeliveryPage(wrapper);
    if (route === "governance") initializeGovernancePage(wrapper);
    return wrapper;
  }

  function renderRoute(route) {
    const page = routes[route];
    if (!page) return;

    pageCache.forEach(function (element) { element.hidden = true; });
    const activePage = ensurePage(route);
    if (activePage) activePage.hidden = false;
    if (route === "home" && activePage) retryFailedHomeAssets(activePage);
    if (route === "overview" && activePage) retryFailedOverviewAssets(activePage);
    if (route === "offerings" && activePage) retryFailedOfferingsAssets(activePage);
    if (route === "opportunities" && activePage) retryFailedOpportunitiesAssets(activePage);
    if (route === "programs" && activePage) retryFailedProgramsAssets(activePage);
    if (route === "delivery" && activePage) retryFailedDeliveryAssets(activePage);
    if (route === "governance" && activePage) retryFailedGovernanceAssets(activePage);

    const hasPageHero = Boolean(activePage && activePage.querySelector("[data-page-hero]"));
    dom.app.classList.toggle("hero-route", hasPageHero);

    if (dom.search) {
      dom.search.placeholder = "Search knowledge, templates, playbooks, tools...";
    }
    // The navigation header is global, so its source filters remain visible on every route.
    if (dom.filters) dom.filters.hidden = false;
    document.title = page.title + " | Novare Nexus 2026";
  }

  function getCurrentPageTitle() {
    const page = pageCache.get(state.route);
    return page ? page.querySelector("[data-page-title]") : null;
  }

  function focusPageTitle() {
    const title = getCurrentPageTitle();
    if (title) title.focus();
  }

  function handleRouteChange(focusContent) {
    const requested = window.location.hash.slice(1);
    const route = Object.prototype.hasOwnProperty.call(routes, requested)
      ? requested
      : config.defaultRoute;

    if (requested !== route) {
      try {
        window.history.replaceState(null, "", "#" + route);
      } catch (error) {
        window.location.replace("#" + route);
      }
    }

    const changed = state.route !== route;
    state.route = route;
    setActiveNavigation(route);
    renderRoute(route);
    updateNavHeaderScrollEffect();

    const drawerWasOpen = state.mobileOpen;
    if (drawerWasOpen) setMobileSidebar(false, false);
    if (focusContent && (changed || drawerWasOpen)) focusPageTitle();
  }

  // 7. SIDEBAR
  function updateSidebar() {
    const mobile = mobileQuery.matches;
    const open = mobile && state.mobileOpen;

    dom.app.classList.toggle("mobile-open", open);
    dom.app.classList.toggle("tablet-expanded", tabletQuery.matches && state.tabletExpanded);
    document.body.classList.toggle("sidebar-open", open);

    if (dom.overlay) dom.overlay.hidden = !open;
    if (dom.workspace) dom.workspace.inert = open;
    if (dom.skipLink) dom.skipLink.inert = open;

    if (dom.sidebar) {
      dom.sidebar.inert = mobile && !open;
      if (open) {
        dom.sidebar.setAttribute("role", "dialog");
        dom.sidebar.setAttribute("aria-modal", "true");
      } else {
        dom.sidebar.removeAttribute("role");
        dom.sidebar.removeAttribute("aria-modal");
      }
    }

    if (dom.toggle) {
      const expanded = mobile ? open : (!tabletQuery.matches || state.tabletExpanded);
      dom.toggle.setAttribute("aria-expanded", String(expanded));
      dom.toggle.setAttribute(
        "aria-label",
        mobile
          ? (open ? "Close navigation" : "Open navigation")
          : (expanded ? "Collapse navigation" : "Expand navigation")
      );
    }
  }

  function setMobileSidebar(open, restoreFocus) {
    state.mobileOpen = open;
    updateSidebar();
    if (open && dom.sidebarClose) dom.sidebarClose.focus();
    else if (restoreFocus && dom.toggle) dom.toggle.focus();
  }

  function toggleSidebar() {
    if (mobileQuery.matches) {
      setMobileSidebar(!state.mobileOpen, true);
    } else if (tabletQuery.matches) {
      state.tabletExpanded = !state.tabletExpanded;
      updateSidebar();
    }
  }

  // 8. SEARCH
  function focusGlobalSearch() {
    if (!dom.search || (dom.dialog && dom.dialog.open)) return;
    if (state.mobileOpen) setMobileSidebar(false, false);
    dom.search.focus();
  }

  function setSearchFilter(filter) {
    state.filter = filter;
    dom.filterItems.forEach(function (item) {
      item.setAttribute("aria-pressed", String(item.dataset.filter === filter));
    });
    if (dom.search) dom.search.dataset.filter = filter;
  }

  // 9. RESPONSIVE NAVIGATION
  function handleViewportChange() {
    const active = document.activeElement;
    const focusWasInSidebar = dom.sidebar && dom.sidebar.contains(active);

    state.mobileOpen = false;
    if (!tabletQuery.matches) state.tabletExpanded = false;
    updateSidebar();

    if (dom.dialog && dom.dialog.open) return;

    if ((mobileQuery.matches && focusWasInSidebar) || active === dom.sidebarClose) {
      if ((mobileQuery.matches || tabletQuery.matches) && dom.toggle) dom.toggle.focus();
      else if (dom.navItems[0]) dom.navItems[0].focus();
    } else if (!mobileQuery.matches && !tabletQuery.matches && active === dom.toggle) {
      focusPageTitle();
    }
  }

  function handleKeyboard(event) {
    if (event.isComposing || event.defaultPrevented) return;
    if (dom.dialog && dom.dialog.open) return;

    if ((event.ctrlKey || event.metaKey) && !event.altKey && !event.shiftKey && event.key.toLowerCase() === "k") {
      event.preventDefault();
      focusGlobalSearch();
      return;
    }

    if (!state.mobileOpen) return;

    if (event.key === "Escape") {
      event.preventDefault();
      setMobileSidebar(false, true);
    } else if (event.key === "Tab" && dom.sidebar) {
      const focusable = Array.from(dom.sidebar.querySelectorAll("button, a[href], input, [tabindex='0']"))
        .filter(function (item) { return !item.disabled && item.getClientRects().length > 0; });
      const first = focusable[0];
      const last = focusable[focusable.length - 1];

      if (!first) {
        event.preventDefault();
        dom.sidebar.focus();
        return;
      }

      if (event.shiftKey && (document.activeElement === first || !dom.sidebar.contains(document.activeElement))) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && (document.activeElement === last || !dom.sidebar.contains(document.activeElement))) {
        event.preventDefault();
        first.focus();
      }
    }
  }

  // 12. INITIALIZATION
  function initializeUser() {
    const user = NexusAPI.getCurrentUserFallback();
    const userName = document.getElementById("user-name");
    const userDepartment = document.getElementById("user-department");
    const userAvatar = document.getElementById("user-avatar");

    if (userName) userName.textContent = user.name;
    if (userDepartment) userDepartment.textContent = user.department;
    if (userAvatar) {
      userAvatar.textContent = user.name
        .split(/\s+/)
        .map(function (part) { return part.charAt(0); })
        .slice(0, 2)
        .join("")
        .toUpperCase();
      userAvatar.setAttribute("aria-label", user.name + " avatar placeholder");
    }
  }

  function initializeApp() {
    if (!dom.app || dom.app.dataset.initialized === "true") return;

    dom.app.dataset.appsScriptAvailable = String(NexusAPI.isAppsScriptAvailable());
    initializeUser();

    dom.navItems.forEach(function (item) {
      item.addEventListener("click", function () {
        const route = item.dataset.route;
        if (window.location.hash === "#" + route) {
          if (state.mobileOpen) setMobileSidebar(false, false);
          focusPageTitle();
        } else {
          window.location.hash = route;
        }
      });
    });

    dom.filterItems.forEach(function (item) {
      item.addEventListener("click", function () {
        setSearchFilter(item.dataset.filter);
      });
    });

    if (dom.toggle) dom.toggle.addEventListener("click", toggleSidebar);
    if (dom.sidebarClose) dom.sidebarClose.addEventListener("click", function () { setMobileSidebar(false, true); });
    if (dom.overlay) dom.overlay.addEventListener("click", function () { setMobileSidebar(false, true); });

    if (dom.skipLink) {
      dom.skipLink.addEventListener("click", function (event) {
        event.preventDefault();
        if (dom.content) dom.content.focus();
      });
    }

    if (dom.launcher) dom.launcher.addEventListener("click", openNoscaPlaceholder);

    if (dom.dialogClose) {
      dom.dialogClose.addEventListener("click", function (event) {
        event.preventDefault();
        closeNoscaPlaceholder();
      });
    }

    if (dom.dialog) {
      dom.dialog.addEventListener("cancel", function (event) {
        event.preventDefault();
        closeNoscaPlaceholder();
      });

      dom.dialog.addEventListener("close", function () {
        if (mobileQuery.matches && !state.mobileOpen && dom.toggle) dom.toggle.focus();
        else if (dom.launcher) dom.launcher.focus();
      });
    }

    window.addEventListener("hashchange", function () { handleRouteChange(true); });
    window.addEventListener("scroll", scheduleNavHeaderScrollEffect, { passive: true });
    if (dom.workspace) dom.workspace.addEventListener("scroll", scheduleNavHeaderScrollEffect, { passive: true });
    document.addEventListener("keydown", handleKeyboard);
    mobileQuery.addEventListener("change", handleViewportChange);
    tabletQuery.addEventListener("change", handleViewportChange);

    updateSidebar();
    setSearchFilter(state.filter);
    initializeShellAssets();
  handleRouteChange(false);
    dom.app.dataset.initialized = "true";
  }

  initializeApp();
}());
