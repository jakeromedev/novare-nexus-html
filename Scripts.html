  function readStoredAdminViewMode() {
    try {
      const stored = window.sessionStorage.getItem(ADMIN_VIEW_MODE_STORAGE_KEY);
      return stored === "user" ? "user" : "admin";
    } catch (error) {
      return "admin";
    }
  }

  function writeStoredAdminViewMode(mode) {
    try {
      window.sessionStorage.setItem(
        ADMIN_VIEW_MODE_STORAGE_KEY,
        mode === "user" ? "user" : "admin"
      );
    } catch (error) {
      // no-op
    }
  }

  function clearStoredAdminViewMode() {
    try {
      window.sessionStorage.removeItem(ADMIN_VIEW_MODE_STORAGE_KEY);
    } catch (error) {
      // no-op
    }
  }

  function getEffectiveUserRole() {
    if (adminViewState.actualIsAdmin && adminViewState.viewMode === "user") {
      return "user";
    }

    return adminViewState.actualRole === "admin"
      ? "admin"
      : "user";
  }

  function isPreviewingAsUser() {
    return adminViewState.actualIsAdmin && adminViewState.viewMode === "user";
  }

  function closeAdminViewMenu() {
    if (dom.adminViewMenu) {
      dom.adminViewMenu.hidden = true;
    }

    if (dom.userViewToggle) {
      dom.userViewToggle.setAttribute("aria-expanded", "false");
    }
  }

  function syncAdminViewModeUI() {
    const effectiveRole = getEffectiveUserRole();
    const previewingAsUser = isPreviewingAsUser();

    if (dom.userPreviewChip) {
      dom.userPreviewChip.hidden = !previewingAsUser;
    }

    dom.adminViewOptions.forEach(function (option) {
      const selected = option.dataset.adminViewMode === adminViewState.viewMode;
      option.classList.toggle("is-selected", selected);
      option.setAttribute("aria-checked", String(selected));
    });

    if (dom.app) {
      dom.app.dataset.currentUserRole = effectiveRole;
      dom.app.dataset.currentUserActualRole = adminViewState.actualRole;
      dom.app.dataset.currentUserViewMode = adminViewState.viewMode;
      dom.app.dataset.currentUserEffectiveRole = effectiveRole;
      dom.app.dataset.previewingAsUser = String(previewingAsUser);
    }

    if (dom.navHeader) {
      dom.navHeader.dataset.currentUserViewMode = adminViewState.viewMode;
      dom.navHeader.dataset.currentUserEffectiveRole = effectiveRole;
      dom.navHeader.dataset.previewingAsUser = String(previewingAsUser);
    }

    document.dispatchEvent(
      new CustomEvent("nexus:viewmodechange", {
        detail: {
          actualRole: adminViewState.actualRole,
          viewMode: adminViewState.viewMode,
          effectiveRole: effectiveRole,
          previewingAsUser: previewingAsUser
        }
      })
    );
  }

  function setAdminViewMode(nextMode, options) {
    const settings = options && typeof options === "object" ? options : {};
    const resolvedMode = nextMode === "user" ? "user" : "admin";

    if (!adminViewState.actualIsAdmin) {
      adminViewState.viewMode = "user";
      clearStoredAdminViewMode();
      syncAdminViewModeUI();
      return;
    }

    adminViewState.viewMode = resolvedMode;

    if (settings.persist !== false) {
      writeStoredAdminViewMode(resolvedMode);
    }

    syncAdminViewModeUI();
  }

  function toggleAdminViewMenu(force) {
    if (!adminViewState.actualIsAdmin || !dom.adminViewMenu || !dom.userViewToggle) {
      return;
    }

    const nextOpen = typeof force === "boolean"
      ? force
      : dom.adminViewMenu.hidden;

    dom.adminViewMenu.hidden = !nextOpen;
    dom.userViewToggle.setAttribute("aria-expanded", String(nextOpen));
  }

  function bindAdminViewControls() {
    if (dom.userProfile) {
      dom.userProfile.addEventListener("click", function (event) {
        if (!adminViewState.actualIsAdmin) return;
        if (dom.userViewToggle && dom.userViewToggle.contains(event.target)) return;
        if (dom.adminViewMenu && dom.adminViewMenu.contains(event.target)) return;
        toggleAdminViewMenu();
      });

      dom.userProfile.addEventListener("keydown", function (event) {
        if (!adminViewState.actualIsAdmin) return;
        if (event.key !== "Enter" && event.key !== " ") return;
        event.preventDefault();
        toggleAdminViewMenu();
      });
    }

    if (dom.userViewToggle) {
      dom.userViewToggle.addEventListener("click", function (event) {
        event.preventDefault();
        event.stopPropagation();
        toggleAdminViewMenu();
      });
    }

    dom.adminViewOptions.forEach(function (option) {
      option.addEventListener("click", function (event) {
        event.preventDefault();
        const mode = option.dataset.adminViewMode === "user" ? "user" : "admin";
        setAdminViewMode(mode);
        closeAdminViewMenu();
      });
    });

    if (dom.exitUserPreview) {
      dom.exitUserPreview.addEventListener("click", function (event) {
        event.preventDefault();
        setAdminViewMode("admin");
      });
    }

    document.addEventListener("click", function (event) {
      if (!dom.userProfile || !dom.adminViewMenu || dom.adminViewMenu.hidden) return;
      if (dom.userProfile.contains(event.target)) return;
      closeAdminViewMenu();
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        closeAdminViewMenu();
      }
    });
  }

    getActualRole: function () { return adminViewState.actualRole; },
    getViewMode: function () { return adminViewState.viewMode; },
    getEffectiveRole: getEffectiveUserRole,
    isPreviewingAsUser: isPreviewingAsUser,
    setViewMode: setAdminViewMode

  function closeNotificationPanel() {
    if (dom.notificationPanel) {
      dom.notificationPanel.hidden = true;
    }

    if (dom.notificationTrigger) {
      dom.notificationTrigger.setAttribute("aria-expanded", "false");
    }
  }

  function renderNotificationPanel() {
    if (!dom.notificationList) return;
    dom.notificationList.innerHTML = '<div class="notification-empty-state">No notifications yet.</div>';
  }

  function toggleNotificationPanel(force) {
    if (!dom.notificationPanel || !dom.notificationTrigger) return;

    const nextOpen = typeof force === "boolean"
      ? force
      : dom.notificationPanel.hidden;

    if (nextOpen) {
      closeAdminViewMenu();
      renderNotificationPanel();
    }

    dom.notificationPanel.hidden = !nextOpen;
    dom.notificationTrigger.setAttribute("aria-expanded", String(nextOpen));
  }

  function bindNotificationControls() {
    renderNotificationPanel();

    if (dom.notificationTrigger) {
      dom.notificationTrigger.addEventListener("click", function (event) {
        event.preventDefault();
        event.stopPropagation();
        toggleNotificationPanel();
      });
    }

    document.addEventListener("click", function (event) {
      if (!dom.notificationPanel || dom.notificationPanel.hidden) return;
      const control = dom.notificationTrigger && dom.notificationTrigger.parentElement;
      if (control && control.contains(event.target)) return;
      closeNotificationPanel();
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        closeNotificationPanel();
      }
    });
  }

  function placeNoscaLauncherForViewport() {
    if (!dom.launcher || !noscaLauncherHome) return;

    if (mobileQuery.matches) {
      if (dom.launcher.parentNode !== document.body) {
        document.body.appendChild(dom.launcher);
      }

      dom.launcher.classList.add(
        "is-mobile-floating"
      );

      return;
    }

    dom.launcher.classList.remove(
      "is-mobile-floating"
    );

    const parent =
      noscaLauncherHome.parent;

    if (!parent) return;

    const sibling =
      noscaLauncherHome.nextSibling;

    if (
      sibling &&
      sibling.parentNode === parent
    ) {
      parent.insertBefore(
        dom.launcher,
        sibling
      );
    } else {
      parent.appendChild(
        dom.launcher
      );
    }
  }

  function getStaticSupportContent() {
    return cloneData(supportPageData);
  }

  function normalizeSupportContent(value) {
    const fallback = getStaticSupportContent();
    if (!value || typeof value !== "object") return fallback;

    return {
      options: Array.isArray(value.options) && value.options.length
        ? value.options
        : fallback.options,
      faqs: Array.isArray(value.faqs) && value.faqs.length
        ? value.faqs
        : fallback.faqs,
      quickLinks: Array.isArray(value.quickLinks) && value.quickLinks.length
        ? value.quickLinks
        : fallback.quickLinks
    };
  }

  function escapeSupportHtml(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function supportIconSvg(type, size) {

    const paths = {
      chat: '<path d="M4 5h16v11H9l-5 4z"/><circle cx="9" cy="10.5" r=".7" fill="currentColor" stroke="none"/><circle cx="12" cy="10.5" r=".7" fill="currentColor" stroke="none"/><circle cx="15" cy="10.5" r=".7" fill="currentColor" stroke="none"/>',

      book: '<path d="M4 5h6c2 0 3 1 3 3v11c0-2-1-3-3-3H4z"/><path d="M20 5h-6c-2 0-3 1-3 3v11c0-2 1-3 3-3h6z"/>',
      shield: '<path d="M12 3 19 6v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/><path d="m9 12 2 2 4-4"/>',
      document: '<path d="M6 3h9l3 3v15H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',
      video: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3z"/>',
      megaphone: '<path d="m4 12 12-6v12L4 12z"/><path d="M16 9h3v6h-3M5 13l1 6h4l-2-5"/>',
      tools: '<path d="M14 6 18 2l4 4-4 4"/><path d="M10 18l-4 4-4-4 4-4"/><path d="m8 16 8-8"/>',
      gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'
    };

    return '<svg ' + attrs + '>' + (paths[type] || paths.document) + '</svg>';
  }

  function renderSupportOptions(pageRoot, items) {
    if (!pageRoot) return;
    const grid = pageRoot.querySelector("#support-options-grid");

  function normalizeOfferingsContent(value) {
    const fallback = getStaticOfferingsContent();
    if (!value || typeof value !== "object") return fallback;

    return {
      coreOfferings: Array.isArray(value.coreOfferings) && value.coreOfferings.length
        ? value.coreOfferings
        : fallback.coreOfferings,
      accelerators: Array.isArray(value.accelerators) && value.accelerators.length
        ? value.accelerators
        : fallback.accelerators,
      quoteOffers: Array.isArray(value.quoteOffers) && value.quoteOffers.length
        ? value.quoteOffers
        : fallback.quoteOffers
    };
  }

  function escapeOfferingsHtml(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function extractDriveFileId(value) {
    if (!value) return "";
    const text = String(value).trim();
    if (/^[A-Za-z0-9_-]{20,}$/.test(text)) return text;

    const fileMatch = text.match(/\/file\/d\/([A-Za-z0-9_-]+)/);
    if (fileMatch) return fileMatch[1];

    const idMatch = text.match(/[?&]id=([A-Za-z0-9_-]+)/);
    return idMatch ? idMatch[1] : "";
  }

  function getDriveImageCandidates(assetOrUrl, width = 1600) {
    const fileId = typeof assetOrUrl === "object"
      ? (assetOrUrl.fileId || extractDriveFileId(assetOrUrl.viewerUrl))
      : extractDriveFileId(assetOrUrl);

    if (!fileId) return [];

    const encodedId = encodeURIComponent(fileId);
    const safeWidth = Math.max(64, Math.round(Number(width) || 1600));

    // Try more than one Google-hosted image endpoint. Different Workspace /
    // iframe / sharing configurations can behave differently across endpoints.
    return [
      "https://drive.google.com/thumbnail?id=" + encodedId + "&sz=w" + safeWidth,
      "https://lh3.googleusercontent.com/d/" + encodedId + "=w" + safeWidth,
      "https://drive.google.com/uc?export=view&id=" + encodedId
    ];
  }

  function bindImageCandidates(image, fallback, candidates) {
    if (!image) return;

    const key = image.dataset.imageKey || image.alt || "image";
    const cacheKey = "nexus.asset.success." + key;
    let urls = Array.from(new Set((candidates || []).filter(Boolean)));

    try {
      const cachedUrl = window.sessionStorage.getItem(cacheKey);
      if (cachedUrl && urls.includes(cachedUrl)) {
        urls = [cachedUrl].concat(urls.filter(function (url) { return url !== cachedUrl; }));
      }
    } catch (error) {
      // Storage can be unavailable in some iframe/privacy modes; image loading still works without it.
    }

    let index = 0;
    let currentUrl = "";
    let loadTimer = null;
    let visibilityObserver = null;
    let hasStarted = false;

    const shouldDefer =
      (image.getAttribute("loading") || "").toLowerCase() === "lazy";

    function clearLoadTimer() {
      if (loadTimer) {
        window.clearTimeout(loadTimer);
        loadTimer = null;
      }
    }

    function disconnectObserver() {
      if (visibilityObserver) {
        visibilityObserver.disconnect();
        visibilityObserver = null;
      }
    }

    function rememberFallbackAccessibility() {
      if (!fallback || fallback.dataset.nexusLoaderPrepared === "true") return;
      fallback.dataset.nexusLoaderPrepared = "true";
      fallback.dataset.nexusOriginalAriaLabel = fallback.getAttribute("aria-label") || "";
    }

    function setFallbackLoading(isLoading) {
      if (!fallback) return;
      rememberFallbackAccessibility();

      fallback.classList.toggle("nexus-image-loader", isLoading);
      fallback.setAttribute("aria-busy", isLoading ? "true" : "false");

      if (isLoading) {
        fallback.hidden = false;
        fallback.setAttribute("aria-label", "Loading image");
      } else {
        fallback.removeAttribute("aria-busy");
        const originalAriaLabel = fallback.dataset.nexusOriginalAriaLabel || "";
        if (originalAriaLabel) fallback.setAttribute("aria-label", originalAriaLabel);
        else fallback.removeAttribute("aria-label");
      }
    }

    function showFallback() {
      clearLoadTimer();
      disconnectObserver();
      image.dataset.assetState = "error";
      image.classList.remove("nexus-image-loading", "nexus-image-loaded");
      image.hidden = true;
      image.style.visibility = "";
      image.removeAttribute("src");
      setFallbackLoading(false);
      if (fallback) fallback.hidden = false;
      console.warn("Nexus asset could not be loaded:", key, urls);
    }

    function tryNext() {
      clearLoadTimer();

      if (index >= urls.length) {
        showFallback();
        return;
      }

      currentUrl = urls[index++];
      image.dataset.assetState = "loading";
      image.classList.add("nexus-image-loading");
      image.classList.remove("nexus-image-loaded");
      setFallbackLoading(true);

      // Once our observer has intentionally activated a lazy image, make the
      // browser fetch it immediately. Native loading=lazy plus a manual timeout
      // can otherwise leave an off-screen request deferred long enough for the
      // timeout to incorrectly mark every Drive URL as failed.
      image.loading = "eager";
      image.hidden = false;
      image.style.visibility = "hidden";

      image.removeAttribute("src");
      image.src = currentUrl;

      // This timer now runs only after the image is close enough to the viewport
      // (or is explicitly eager), so it represents a genuinely stalled request.
      loadTimer = window.setTimeout(function () {
        if (image.dataset.assetState === "loading") tryNext();
      }, 15000);
    }

    function startLoading() {
      if (hasStarted) return;
      hasStarted = true;
      disconnectObserver();
      tryNext();
    }

    function waitUntilNearViewport() {
      image.dataset.assetState = "waiting";
      image.classList.add("nexus-image-loading");
      image.classList.remove("nexus-image-loaded");
      setFallbackLoading(true);

      // Keep the element measurable so IntersectionObserver can detect it,
      // while the animated placeholder remains visible until loading begins.
      image.hidden = false;
      image.style.visibility = "hidden";

      if (!("IntersectionObserver" in window)) {
        startLoading();
        return;
      }

      visibilityObserver = new IntersectionObserver(
        function (entries) {
          const shouldStart = entries.some(function (entry) {
            return entry.isIntersecting;
          });

          if (shouldStart) startLoading();
        },
        {
          root: null,
          // Begin fetching before the user reaches the asset so cards normally
          // appear populated by the time they scroll into view.
          rootMargin: "900px",
          threshold: 0.01
        }
      );

      visibilityObserver.observe(image);
    }

    function retryAll() {
      clearLoadTimer();
      disconnectObserver();
      index = 0;
      currentUrl = "";
      hasStarted = false;
      image.classList.remove("nexus-image-loaded");

      if (shouldDefer) waitUntilNearViewport();
      else startLoading();
    }

    image._nexusRetryAsset = retryAll;

    image.onload = function () {
      clearLoadTimer();
      if (!image.naturalWidth) {
        tryNext();
        return;
      }

      image.dataset.assetState = "loaded";
      image.hidden = false;
      image.style.visibility = "visible";
      image.classList.remove("nexus-image-loading");
      image.classList.add("nexus-image-loaded");
      setFallbackLoading(false);
      if (fallback) fallback.hidden = true;

      try {
        if (currentUrl) window.sessionStorage.setItem(cacheKey, currentUrl);
      } catch (error) {
        // Ignore storage failures; successful image display is sufficient.
      }
    };

    image.onerror = function () {
      clearLoadTimer();
      tryNext();
    };

    if (shouldDefer) waitUntilNearViewport();
    else startLoading();
  }

  function loadHomeAsset(pageRoot, imageId, fallbackId, width) {
    const root = pageRoot || document;
    const image = root.querySelector("#" + imageId);
    const fallback = root.querySelector("#" + fallbackId);

    /*
     * On mobile, the Home hero artwork is rendered as a CSS background
     * on the hero itself rather than as a visible rectangular <img>
     * layer. We still use the normal image loader first so the URL has
     * already been proven to load successfully.
     */
    if (image && imageId === "home-hero-image") {
      image.addEventListener("load", function () {
        const hero = root.querySelector(".home-hero");
        const source = image.currentSrc || image.src || "";

        if (!hero || !source) return;

        const safeSource =
          source
            .replace(/\\/g, "\\\\")
            .replace(/"/g, '\\"');

        hero.style.setProperty(
          "--home-hero-mobile-image",
          'url("' + safeSource + '")'
        );

        hero.classList.add(
          "has-mobile-hero-background"
        );
      });
    }

    bindHomeAsset(image, fallback, width);
  }

    const image = document.getElementById("nexus-logo-image");

    if (image) {
      const asset = shellAssetRegistry[image.dataset.imageKey];
      bindImageCandidates(image, fallback, getDriveImageCandidates(asset, 900));
    }

    const launcher = document.getElementById("nosca-launcher");
    const noscaDesktopAssets = [
      {
        image: document.getElementById("floating-ask-nosca-robot-idle-image"),
        width: 720
      },
      {
        image: document.getElementById("floating-ask-nosca-robot-hover-image"),
        width: 1050
      },

        width: 760

        image: document.getElementById("floating-ask-nosca-robot-thinking-image"),
        width: 820
      },
      {
        image: document.getElementById("floating-ask-nosca-robot-success-image"),
        width: 820
      }
    ];

    function refreshNoscaDesktopAssets() {
      if (!launcher) return;

      const idle = document.getElementById("floating-ask-nosca-robot-idle-image");
      const hover = document.getElementById("floating-ask-nosca-robot-hover-image");
      const tooltip = document.getElementById("floating-ask-nosca-tooltip-image");
      const thinking = document.getElementById("floating-ask-nosca-robot-thinking-image");
      const success = document.getElementById("floating-ask-nosca-robot-success-image");

      function isAssetReady(image) {
        return Boolean(
          image &&
          (
            image.dataset.assetState === "loaded" ||
            (image.complete && image.naturalWidth > 0)
          )
        );
      }

      const coreReady = Boolean(
        isAssetReady(idle) &&
        isAssetReady(hover)
      );

      launcher.classList.toggle("has-desktop-robot", coreReady);
      launcher.classList.toggle(
        "has-desktop-tooltip",
        isAssetReady(tooltip)
      );
      launcher.classList.toggle(
        "has-desktop-thinking",
        isAssetReady(thinking)
      );
      launcher.classList.toggle(
        "has-desktop-success",
        isAssetReady(success)
      );
    }

    noscaDesktopAssets.forEach(function (item) {
      if (!item.image) return;

      function scheduleNoscaDesktopAssetRefresh() {
        // bindImageCandidates updates data-asset-state inside its onload handler.
        // Deferring this check guarantees we evaluate the final loaded/error state.
        window.requestAnimationFrame(refreshNoscaDesktopAssets);
        window.setTimeout(refreshNoscaDesktopAssets, 0);
      }

      item.image.addEventListener("load", scheduleNoscaDesktopAssetRefresh);
      item.image.addEventListener("error", scheduleNoscaDesktopAssetRefresh);

      const asset = shellAssetRegistry[item.image.dataset.imageKey];
      bindImageCandidates(
        item.image,
        null,
        getDriveImageCandidates(asset, item.width)
      );
    });

    refreshNoscaDesktopAssets();
    window.setTimeout(refreshNoscaDesktopAssets, 120);
    window.setTimeout(refreshNoscaDesktopAssets, 900);
  }

      if (pagination) {
        const dot = document.createElement("button");
        dot.type = "button";
        dot.className = "featured-dot";
        dot.setAttribute("aria-label", "Show featured item " + (index + 1) + ": " + item.title);
        dot.setAttribute("aria-controls", card.id);
        dot.addEventListener("click", function () {
          card.scrollIntoView({ behavior: getScrollBehavior(), block: "nearest", inline: "start" });
        });
        pagination.appendChild(dot);
      }
    });

    function getCards() {
      return Array.from(track.querySelectorAll(".featured-card"));
    }

    function updateCarouselState() {
      const cards = getCards();
      if (!cards.length) return;
      const trackRect = track.getBoundingClientRect();
      let activeIndex = 0;
      let nearest = Infinity;

      cards.forEach(function (card, index) {
        const distance = Math.abs(card.getBoundingClientRect().left - trackRect.left);
        if (distance < nearest) {
          nearest = distance;
          activeIndex = index;
        }
      });

      if (pagination) {
        Array.from(pagination.querySelectorAll(".featured-dot")).forEach(function (dot, index) {
          const active = index === activeIndex;
          dot.classList.toggle("is-active", active);
          dot.setAttribute("aria-current", active ? "true" : "false");
        });
      }

      const maxScroll = Math.max(0, track.scrollWidth - track.clientWidth);
      if (prev) prev.disabled = track.scrollLeft <= 4;
      if (next) next.disabled = track.scrollLeft >= maxScroll - 4;
    }

    function scrollFeatured(direction) {
      const card = track.querySelector(".featured-card");
      if (!card) return;
      const gap = parseFloat(getComputedStyle(track).gap) || 12;
      track.scrollBy({ left: direction * (card.getBoundingClientRect().width + gap), behavior: getScrollBehavior() });
    }

    if (prev) prev.addEventListener("click", function () { scrollFeatured(-1); });
    if (next) next.addEventListener("click", function () { scrollFeatured(1); });
    track.addEventListener("scroll", updateCarouselState, { passive: true });
    track.addEventListener("keydown", function (event) {
      if (event.key === "ArrowLeft") {
        event.preventDefault();
        scrollFeatured(-1);
      } else if (event.key === "ArrowRight") {
        event.preventDefault();
        scrollFeatured(1);
      }
    });
    window.addEventListener("resize", updateCarouselState);

    if (viewAll) {
      viewAll.addEventListener("click", function () {
        showHomeSectionStatus(pageRoot, "The full Featured content library will be connected in a later phase.");
      });
    }

    track.dataset.rendered = "true";
    requestAnimationFrame(updateCarouselState);
  }

  function getHomeAiTopicFromDraft(value) {
    const current = String(value || "").trim();
    if (!current) return "";

    for (let index = 0; index < homePageData.aiActions.length; index += 1) {
      const starter = String(homePageData.aiActions[index].draft || "").trim();
      if (starter && current.toLowerCase().indexOf(starter.toLowerCase()) === 0) {
        return current.slice(starter.length).trim();
      }
    }

    return current;
  }

  function buildHomeAiActionDraft(action, currentValue) {
    const starter = String(action && action.draft || "");
    const topic = getHomeAiTopicFromDraft(currentValue);
    return topic ? starter + topic : starter;
  }

  function pulseHomeAiInput(form, inputShell) {
    if (!form || !inputShell) return;

    form.classList.remove("is-receiving-suggestion");
    inputShell.classList.remove("is-filled-by-suggestion");

    // Restart the CSS animations even when users choose shortcuts quickly.
    void inputShell.offsetWidth;

    form.classList.add("is-receiving-suggestion");
    inputShell.classList.add("is-filled-by-suggestion");

    window.setTimeout(function () {
      form.classList.remove("is-receiving-suggestion");
      inputShell.classList.remove("is-filled-by-suggestion");
    }, 760);
  }

  function setHomeAiDraft(form, input, inputShell, draft) {
    input.value = String(draft || "");
    input.dispatchEvent(new Event("input", { bubbles: true }));
    pulseHomeAiInput(form, inputShell);
    input.focus();

    if (typeof input.setSelectionRange === "function") {
      input.setSelectionRange(input.value.length, input.value.length);
    }
  }

  function animateHomeAiSuggestion(button, form, input, inputShell, draft) {
    if (!input) return;

    if (!button || !inputShell) {
      setHomeAiDraft(form, input, inputShell, draft);
      return;
    }

    const reducedMotion = Boolean(
      window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches
    );

    button.classList.remove("is-activating");
    void button.offsetWidth;
    button.classList.add("is-activating");

    window.setTimeout(function () {
      button.classList.remove("is-activating");
    }, 520);

    if (
      reducedMotion ||
      typeof button.animate !== "function" ||
      !document.body
    ) {
      setHomeAiDraft(form, input, inputShell, draft);
      return;
    }

    const startRect = button.getBoundingClientRect();
    const endRect = inputShell.getBoundingClientRect();
    const label = button.querySelector("span");
    const flyer = document.createElement("span");

    flyer.className = "home-ai-suggestion-flyer";
    flyer.textContent = label ? label.textContent : "Ask NOSCA";
    flyer.style.left = startRect.left + "px";
    flyer.style.top = startRect.top + "px";
    flyer.style.width = startRect.width + "px";
    document.body.appendChild(flyer);

    const deltaX =
      endRect.left + Math.min(endRect.width * 0.45, 180) -
      (startRect.left + startRect.width / 2);
    const deltaY =
      endRect.top + endRect.height / 2 -
      (startRect.top + startRect.height / 2);

    const animation = flyer.animate(
      [
        {
          transform: "translate3d(0, 0, 0) scale(1)",
          opacity: 1
        },
        {
          transform:
            "translate3d(" + deltaX + "px, " + deltaY + "px, 0) scale(.72)",
          opacity: 0.08
        }
      ],
      {
        duration: 420,
        easing: "cubic-bezier(.22,.8,.26,1)",
        fill: "forwards"
      }
    );

    window.setTimeout(function () {
      setHomeAiDraft(form, input, inputShell, draft);
    }, 245);

    Promise.resolve(animation.finished)
      .catch(function () {})
      .then(function () {
        if (flyer.parentNode) flyer.parentNode.removeChild(flyer);
      });
  }

  function initializeHomePage(pageRoot) {
    if (!pageRoot || pageRoot.dataset.pageInitialized === "true") return;

    const initialData = getStaticHomeContent();

    loadHomeAsset(pageRoot, "home-hero-image", "home-hero-fallback", 2000);
    loadHomeAsset(pageRoot, "hero-handwritten-tagline", "home-handwriting-fallback", 480);
    renderQuickAccess(pageRoot, initialData.quickAccess);
    renderRoleExplorer(pageRoot, initialData.roles);
    renderFeatured(pageRoot, initialData.featured);
    renderWhatsNew(pageRoot, initialData.whatsNew);
    renderHelpPanel(pageRoot, initialData.help);

    if (window.NexusHomeLinks) {
      window.NexusHomeLinks.initialize(
        pageRoot
      );
    }

    const input = pageRoot.querySelector("#home-ai-input");
    const status = pageRoot.querySelector("#home-ai-status");
    const track = pageRoot.querySelector("#home-ai-track");
    const form = pageRoot.querySelector("#home-ai-form");
    const inputShell = pageRoot.querySelector(".home-ai-input-shell");
    const next = pageRoot.querySelector("#home-ai-next");

    if (!input || !status || !track || !form || !inputShell || !next) return;

    function updateHomeAiComposerState() {
      form.classList.toggle("has-query", Boolean(input.value.trim()));
    }

    input.addEventListener("input", function () {
      status.textContent = "";
      updateHomeAiComposerState();
    });

    homePageData.aiActions.forEach(function (action, index) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "button home-ai-action";
      button.dataset.homeAiAction = action.id;
      button.setAttribute(
        "aria-label",
        action.label + ". Add this search starter to Ask NOSCA."
      );
      button.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + aiActionIcons[index] + '</svg>';

      const labelNode = document.createElement("span");
      labelNode.textContent = action.label;
      button.appendChild(labelNode);

      button.addEventListener("click", function () {
        const draft = buildHomeAiActionDraft(action, input.value);
        status.textContent = "";
        animateHomeAiSuggestion(
          button,
          form,
          input,
          inputShell,
          draft
        );
      });

      track.appendChild(button);
    });

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const question = input.value.trim();

      status.textContent = "";

      if (!question) {
        openNoscaChat({ focus: true });
        return;
      }

      openNoscaChat({
        draft: question,
        submit: true
      });
    });

    updateHomeAiComposerState();

    next.addEventListener("click", function () {
      const buttons = Array.from(track.querySelectorAll("button"));
      if (!buttons.length) return;
      const current = buttons.indexOf(document.activeElement);
      const index = Number(next.dataset.nextIndex || 0);
      const targetIndex = current >= 0 ? (current + 1) % buttons.length : index % buttons.length;
      const target = buttons[targetIndex];
      target.focus();
      target.scrollIntoView({ block: "nearest", inline: "nearest" });
      next.dataset.nextIndex = String((targetIndex + 1) % buttons.length);
    });

    pageRoot.dataset.pageInitialized = "true";

    if (config.useServerHomeContent) {
      NexusAPI.getHomeContent(function (serverData) {
        // Phase 4 only prepares the hook. A later backend phase can add a
        // controlled re-render/diff once the server schema is finalized.
        pageRoot._nexusServerHomeContent = serverData;
      });
    }
  }

  // 6. GLOBAL NAV HEADER SCROLL EFFECT
  let navHeaderScrollFrame = 0;

  function getPageScrollTop() {
    return Math.max(
      window.scrollY || 0,
      document.documentElement ? document.documentElement.scrollTop || 0 : 0,
      document.body ? document.body.scrollTop || 0 : 0,
      dom.workspace ? dom.workspace.scrollTop || 0 : 0
    );
  }

  function getActivePageHero() {
    const page =
      pageCache.get(state.route);

    return page
      ? page.querySelector(
          "[data-page-hero]"
        )
      : null;
  }

  function resetHeroScrollEffect(hero) {
    if (!hero) return;

    hero.style.removeProperty(
      "--hero-scroll-opacity"
    );
    hero.style.removeProperty(
      "--hero-copy-opacity"
    );
    hero.style.removeProperty(
      "--hero-media-scale"
    );
    hero.style.removeProperty(
      "--hero-copy-offset"
    );

    hero.classList.remove(
      "is-scroll-faded"
    );
  }

  function updateHeroScrollEffect(
    scrollTop
  ) {
    const hero =
      getActivePageHero();

    if (!hero) {
      return;
    }

    const fadeDistance =
      mobileQuery.matches
        ? 190
        : 240;

    const rawProgress =
      Math.max(
        0,
        Math.min(
          1,
          scrollTop /
          fadeDistance
        )
      );

    const eased =
      1 -
      Math.pow(
        1 - rawProgress,
        2
      );

    // Background / artwork fades gradually.
    const heroOpacity =
      Math.max(
        0,
        1 - eased
      );

    // Copy disappears a little earlier so text does not linger
    // awkwardly over the next content section.
    const copyOpacity =
      Math.max(
        0,
        1 -
        rawProgress * 1.32
      );

    // Very subtle scale-up gives the hero a polished parallax-like feel.
    const mediaScale =
      1 +
      eased * 0.026;

    const copyOffset =
      Math.round(
        eased * -12
      );

    hero.style.setProperty(
      "--hero-scroll-opacity",
      heroOpacity.toFixed(3)
    );

    hero.style.setProperty(
      "--hero-copy-opacity",
      copyOpacity.toFixed(3)
    );

    hero.style.setProperty(
      "--hero-media-scale",
      mediaScale.toFixed(4)
    );

    hero.style.setProperty(
      "--hero-copy-offset",
      copyOffset + "px"
    );

    hero.classList.toggle(
      "is-scroll-faded",
      rawProgress >= 0.985
    );
  }

  function updateNavHeaderScrollEffect() {
    navHeaderScrollFrame = 0;
    if (!dom.navHeader) return;

    const scrollTop =
      getPageScrollTop();

    if (!dom.app.classList.contains("hero-route")) {
      dom.navHeader.style.removeProperty("--nav-header-opacity");
      dom.navHeader.style.removeProperty("--nav-header-border-opacity");
      dom.navHeader.style.removeProperty("--nav-header-shadow-opacity");
      dom.navHeader.style.removeProperty("--nav-header-blur");

      resetHeroScrollEffect(
        getActivePageHero()
      );

      return;
    }

    // Keep the navbar transition synchronized with the hero dissolve.
    // The navbar becomes frosted while the hero fades away underneath it.
    const progress =
      Math.max(
        0,
        Math.min(
          1,
          scrollTop / 180
        )
      );

    const eased =
      1 -
      Math.pow(
        1 - progress,
        2
      );

    dom.navHeader.style.setProperty(
      "--nav-header-opacity",
      (eased * 0.94).toFixed(3)
    );

    dom.navHeader.style.setProperty(
      "--nav-header-border-opacity",
      (eased * 0.72).toFixed(3)
    );

    dom.navHeader.style.setProperty(
      "--nav-header-shadow-opacity",
      (eased * 0.08).toFixed(3)
    );

    dom.navHeader.style.setProperty(
      "--nav-header-blur",
      (eased * 14).toFixed(1) +
      "px"
    );

    updateHeroScrollEffect(
      scrollTop
    );
  }

  function scheduleNavHeaderScrollEffect() {
    if (navHeaderScrollFrame) return;
    navHeaderScrollFrame = window.requestAnimationFrame(updateNavHeaderScrollEffect);
  }

  // 6. DEFAULT PAGE LOADER
  // Reuses the same visual language as the H1 Overview resource loader.
  // Managed-link pages may keep the loader visible longer while their
  // resource registry is resolving.
  const DEFAULT_PAGE_LOADER_MIN_MS = 520;
  const pageLoaderTimers = new WeakMap();

  function getExistingPageLoader(pageRoot) {
    if (!pageRoot) return null;

    return pageRoot.querySelector(
      ".overview-link-loader, .managed-link-loader, [data-default-page-loader]"
    );
  }

  function ensureDefaultPageLoader(pageRoot) {
    if (!pageRoot) return null;

    const existing =
      getExistingPageLoader(pageRoot);

    if (existing) {
      return existing;
    }

    const loader =
      document.createElement("div");

    loader.className =
      "overview-link-loader";

    loader.dataset.defaultPageLoader =
      "true";

    loader.setAttribute(
      "role",
      "status"
    );

    loader.setAttribute(
      "aria-live",
      "polite"
    );

    loader.setAttribute(
      "aria-label",
      "Loading ONESCA page"
    );

    loader.hidden = true;

    loader.innerHTML =
      '<div class="overview-link-loader-card">' +
        '<div class="overview-link-loader-mark" aria-hidden="true">' +
          '<span class="overview-link-loader-ring"></span>' +
          '<svg viewBox="0 0 24 24">' +
            '<path d="M7.5 12h9"></path>' +
            '<path d="m13 8.5 3.5 3.5-3.5 3.5"></path>' +
          '</svg>' +
        '</div>' +
        '<p class="overview-link-loader-eyebrow">ONESCA RESOURCES</p>' +
        '<h2>Preparing your resources</h2>' +
        '<p class="overview-link-loader-copy">' +
          'Connecting to the latest approved links. This will only take a moment.' +
        '</p>' +
        '<div class="overview-link-loader-dots" aria-hidden="true">' +
          '<span></span><span></span><span></span>' +
        '</div>' +
      '</div>';

    pageRoot.appendChild(loader);

    return loader;
  }

  function clearDefaultPageLoaderTimer(
    pageRoot
  ) {
    const timer =
      pageLoaderTimers.get(
        pageRoot
      );

    if (timer) {
      window.clearTimeout(timer);
      pageLoaderTimers.delete(
        pageRoot
      );
    }
  }

  function showDefaultPageLoader(
    pageRoot
  ) {
    if (!pageRoot) return;

    clearDefaultPageLoaderTimer(
      pageRoot
    );

    const loader =
      ensureDefaultPageLoader(
        pageRoot
      );

    if (!loader) return;

    pageRoot.classList.add(
      "is-default-page-loading"
    );

    pageRoot.setAttribute(
      "aria-busy",
      "true"
    );

    loader.hidden = false;

    window.requestAnimationFrame(
      function () {
        loader.classList.add(
          "is-visible"
        );
      }
    );
  }

  function hideDefaultPageLoader(
    pageRoot
  ) {
    if (!pageRoot) return;

    /*
      Overview and any page using managed links owns the loader while
      its async resource registry is still resolving. Do not hide it
      prematurely just because the route transition finished.
    */
    if (
      pageRoot.classList.contains(
        "is-managed-links-loading"
      )
    ) {
      pageRoot.classList.remove(
        "is-default-page-loading"
      );

      return;
    }

    const loader =
      getExistingPageLoader(
        pageRoot
      );

    pageRoot.classList.remove(
      "is-default-page-loading"
    );

    pageRoot.removeAttribute(
      "aria-busy"
    );

    if (!loader) return;

    loader.classList.remove(
      "is-visible"
    );

    window.setTimeout(
      function () {
        if (
          !pageRoot.classList.contains(
            "is-default-page-loading"
          ) &&
          !pageRoot.classList.contains(
            "is-managed-links-loading"
          )
        ) {
          loader.hidden = true;
        }
      },
      180
    );
  }

  function scheduleDefaultPageLoaderHide(
    pageRoot
  ) {
    if (!pageRoot) return;

    clearDefaultPageLoaderTimer(
      pageRoot
    );

    const timer =
      window.setTimeout(
        function () {
          pageLoaderTimers.delete(
            pageRoot
          );

          hideDefaultPageLoader(
            pageRoot
          );
        },
        DEFAULT_PAGE_LOADER_MIN_MS
      );

    pageLoaderTimers.set(
      pageRoot,
      timer
    );
  }

  // 7. SPA ROUTING
  function setActiveNavigation(route) {
    dom.navItems.forEach(function (item) {
      const active = item.dataset.route === route;
      item.classList.toggle("is-active", active);
      if (active) item.setAttribute("aria-current", "page");
      else item.removeAttribute("aria-current");
    });
  }

  function ensurePage(route) {
    if (pageCache.has(route)) return pageCache.get(route);

    const page = routes[route];
    const template = document.getElementById(page.templateId);
    if (!template || !dom.pageMount) return null;

    const wrapper = document.createElement("div");
    wrapper.className = "route-page";
    wrapper.dataset.pageRoute = route;
    wrapper.hidden = true;
    wrapper.appendChild(template.content.cloneNode(true));
    dom.pageMount.appendChild(wrapper);
    pageCache.set(route, wrapper);

    if (route === "home") initializeHomePage(wrapper);
    if (route === "overview") initializeOverviewPage(wrapper);
    if (route === "offerings") initializeOfferingsPage(wrapper);
    if (route === "opportunities") initializeOpportunitiesPage(wrapper);
    if (route === "programs") initializeProgramsPage(wrapper);
    if (route === "delivery") initializeDeliveryPage(wrapper);
    if (route === "governance") initializeGovernancePage(wrapper);
    if (route === "tools") initializeToolsPage(wrapper);
    if (route === "ai-prompt-library") initializeAIPromptLibraryPage(wrapper);
    if (route === "support") initializeSupportPage(wrapper);
    if (
      route === "search" &&
      window.NexusSearch &&
      typeof window.NexusSearch.initialize === "function"
    ) {
      window.NexusSearch.initialize(wrapper);
      initializeSearchVisualPage(wrapper);
    }
    return wrapper;
  }

  function renderRoute(route) {
    const page = routes[route];
    if (!page) return;

    pageCache.forEach(function (element) { element.hidden = true; });
    const activePage = ensurePage(route);

    if (activePage) {
      activePage.hidden = false;

      /*
       * The default page loader is a first-access experience only.
       * ONESCA keeps SPA pages in pageCache, so once a route has loaded
       * successfully we do not replay the loader when the user returns.
       */
      if (
        activePage.dataset.defaultPageLoaderShown !==
        "true"
      ) {
        /*
         * Route content is already available synchronously from the page
         * template. Do not cover the whole page with a loader. Any async
         * resource-link work now exposes loading only on the affected controls.
         */
        activePage.dataset.defaultPageLoaderShown =
          "true";
      }
    }

    if (route === "home" && activePage) retryFailedHomeAssets(activePage);
    if (route === "overview" && activePage) retryFailedOverviewAssets(activePage);
    if (route === "offerings" && activePage) retryFailedOfferingsAssets(activePage);
    if (route === "opportunities" && activePage) retryFailedOpportunitiesAssets(activePage);
    if (route === "programs" && activePage) retryFailedProgramsAssets(activePage);
    if (route === "delivery" && activePage) retryFailedDeliveryAssets(activePage);
    if (route === "governance" && activePage) retryFailedGovernanceAssets(activePage);
    if (route === "tools" && activePage) retryFailedToolsAssets(activePage);
    if (route === "ai-prompt-library" && activePage) retryFailedAIPromptLibraryAssets(activePage);
    if (route === "support" && activePage) retryFailedSupportAssets(activePage);
    if (route === "search" && activePage) retryFailedSearchAssets(activePage);
    if (
      route === "search" &&
      activePage &&
      window.NexusSearch &&
      typeof window.NexusSearch.syncFromLocation === "function"
    ) {
      window.NexusSearch.syncFromLocation(activePage);

      const searchRouteState = window.NexusSearch.getRouteState();
      if (dom.search) dom.search.value = searchRouteState.query || "";
      setSearchFilter(
        window.NexusSearch.getHeaderFilterForRoute(searchRouteState.filter)
      );
    }

    if (
      activePage &&
      window.NexusSearch &&
      typeof window.NexusSearch.applyPendingSectionTarget === "function"
    ) {
      window.NexusSearch.applyPendingSectionTarget(activePage, route);
    }

    const hasPageHero = Boolean(activePage && activePage.querySelector("[data-page-hero]"));
    dom.app.classList.toggle("hero-route", hasPageHero);

    if (dom.search) {
      dom.search.placeholder = "Search knowledge, templates, playbooks, tools...";
    }
    // The navigation header is global, so its source filters remain visible on every route.
    if (dom.filters) dom.filters.hidden = false;
    document.title = page.title + " | Novare Nexus 2026";

    if (
      activePage &&
      activePage.classList.contains(
        "is-default-page-loading"
      )
    ) {
      scheduleDefaultPageLoaderHide(
        activePage
      );
    }
  }

  function getCurrentPageTitle() {
    const page = pageCache.get(state.route);
    return page ? page.querySelector("[data-page-title]") : null;

    if (title) title.focus();

  function handleRouteChange(focusContent) {
    const rawHash = window.location.hash.slice(1);
    const requested = rawHash.split("?")[0];
    const route = Object.prototype.hasOwnProperty.call(routes, requested)
      ? requested
      : config.defaultRoute;

    if (requested !== route) {
      try {
        window.history.replaceState(null, "", "#" + route);
      } catch (error) {
        window.location.replace("#" + route);
      }
    }

    const changed = state.route !== route;
    state.route = route;
    setActiveNavigation(route);
    renderRoute(route);
    updateNavHeaderScrollEffect();

    const drawerWasOpen = state.mobileOpen;
    if (drawerWasOpen) setMobileSidebar(false, false);
    if (focusContent && (changed || drawerWasOpen)) focusPageTitle();
  }

  const DESKTOP_SIDEBAR_STORAGE_KEY = "nexus.desktopSidebarCollapsed";

  function readDesktopSidebarCollapsed() {
    try {
      return window.localStorage.getItem(DESKTOP_SIDEBAR_STORAGE_KEY) === "true";
    } catch (error) {
      return false;
    }
  }

  function writeDesktopSidebarCollapsed(collapsed) {
    try {
      window.localStorage.setItem(
        DESKTOP_SIDEBAR_STORAGE_KEY,
        collapsed ? "true" : "false"
      );
    } catch (error) {
      // Storage can be unavailable in restricted/private browser contexts.
    }

  // Keep floating UI that lives outside #nexus-app synchronized with
  // the app-local sidebar width. The Ask NOSCA dialog is mounted after
  // #nexus-app, so it cannot inherit #nexus-app's --sidebar-width directly.
  function syncFloatingSidebarWidth() {
    if (!dom.app) return;

    const appStyles = window.getComputedStyle(dom.app);
    const resolvedSidebarWidth = String(
      appStyles.getPropertyValue("--sidebar-width") || ""
    ).trim();

    document.documentElement.style.setProperty(
      "--nosca-sidebar-width",
      resolvedSidebarWidth || "235px"
    );
  }

  // 7. SIDEBAR
  function updateSidebar() {
    const mobile = mobileQuery.matches;
    const tablet = tabletQuery.matches;
    const desktop = desktopQuery.matches;
    const open = mobile && state.mobileOpen;
    const desktopCollapsed = desktop && state.desktopCollapsed;

    dom.app.classList.toggle("mobile-open", open);
    dom.app.classList.toggle("tablet-expanded", tablet && state.tabletExpanded);
    dom.app.classList.toggle("desktop-collapsed", desktopCollapsed);
    document.body.classList.toggle("sidebar-open", open);

    // Synchronize the floating Ask NOSCA panel with the target sidebar width.
    // CSS transitions on the panel then animate it alongside the sidebar.
    syncFloatingSidebarWidth();

    if (dom.app) {
      dom.app.dataset.sidebarMode = mobile
        ? (open ? "mobile-open" : "mobile-closed")
        : tablet
          ? (state.tabletExpanded ? "tablet-expanded" : "tablet-collapsed")
          : (desktopCollapsed ? "desktop-collapsed" : "desktop-expanded");
    }

    if (dom.overlay) dom.overlay.hidden = !open;
    if (dom.workspace) dom.workspace.inert = open;
    if (dom.skipLink) dom.skipLink.inert = open;

    if (dom.sidebar) {
      dom.sidebar.inert = mobile && !open;
      if (open) {
        dom.sidebar.setAttribute("role", "dialog");
        dom.sidebar.setAttribute("aria-modal", "true");
      } else {
        dom.sidebar.removeAttribute("role");
        dom.sidebar.removeAttribute("aria-modal");
      }
    }

    const expanded = mobile
      ? open
      : tablet
        ? state.tabletExpanded
        : !desktopCollapsed;

    if (dom.toggle) {
      dom.toggle.setAttribute("aria-expanded", String(expanded));
      dom.toggle.setAttribute(
        "aria-label",
        mobile
          ? (open ? "Close navigation" : "Open navigation")
          : (expanded ? "Collapse navigation" : "Expand navigation")
      );
      dom.toggle.title = mobile
        ? (open ? "Close navigation" : "Open navigation")
        : (expanded ? "Collapse sidebar" : "Expand sidebar");
    }

    if (dom.desktopToggle) {
      dom.desktopToggle.setAttribute("aria-expanded", String(!desktopCollapsed));
      dom.desktopToggle.setAttribute(
        "aria-label",
        desktopCollapsed ? "Expand navigation" : "Collapse navigation"
      );
      dom.desktopToggle.title = desktopCollapsed ? "Expand sidebar" : "Collapse sidebar";
    }
  }

  function setMobileSidebar(open, restoreFocus) {
    state.mobileOpen = open;
    updateSidebar();
    if (open && dom.sidebarClose) dom.sidebarClose.focus();
    else if (restoreFocus && dom.toggle) dom.toggle.focus();
  }

  function toggleSidebar() {
    if (mobileQuery.matches) {
      setMobileSidebar(!state.mobileOpen, true);
    } else if (tabletQuery.matches) {
      state.tabletExpanded = !state.tabletExpanded;
      updateSidebar();
    } else if (desktopQuery.matches) {
      state.desktopCollapsed = !state.desktopCollapsed;
      writeDesktopSidebarCollapsed(state.desktopCollapsed);
      updateSidebar();
    }
  }

    state.filter = filter;

    dom.filterItems.forEach(function (item) {

      item.setAttribute("aria-pressed", String(active));
      item.setAttribute("aria-checked", String(active));
    });

  // 9. RESPONSIVE NAVIGATION
  function handleViewportChange() {
    closeMobileFilterMenu();
    placeNoscaLauncherForViewport();

    const active = document.activeElement;
    const focusWasInSidebar = dom.sidebar && dom.sidebar.contains(active);

    state.mobileOpen = false;
    if (!tabletQuery.matches) state.tabletExpanded = false;
    updateSidebar();

    if ((mobileQuery.matches && focusWasInSidebar) || active === dom.sidebarClose) {
      if ((mobileQuery.matches || tabletQuery.matches) && dom.toggle) dom.toggle.focus();
      else if (dom.navItems[0]) dom.navItems[0].focus();
    } else if (!mobileQuery.matches && !tabletQuery.matches && active === dom.toggle) {
      focusPageTitle();
    }
  }

  function handleKeyboard(event) {
    if (event.isComposing || event.defaultPrevented) return;
    if (dom.dialog && dom.dialog.open) return;

    if ((event.ctrlKey || event.metaKey) && !event.altKey && !event.shiftKey && event.key.toLowerCase() === "k") {
      event.preventDefault();
      focusGlobalSearch();
      return;
    }

    if (
      event.key === "Escape" &&
      dom.mobileFilterOptions &&
      dom.mobileFilterOptions.classList.contains("is-open")
    ) {
      event.preventDefault();
      closeMobileFilterMenu();

      if (dom.mobileFilterTrigger) {
        dom.mobileFilterTrigger.focus();
      }

      return;
    }

    if (!state.mobileOpen) return;

    if (event.key === "Escape") {
      event.preventDefault();
      setMobileSidebar(false, true);
    } else if (event.key === "Tab" && dom.sidebar) {
      const focusable = Array.from(dom.sidebar.querySelectorAll("button, a[href], input, [tabindex='0']"))
        .filter(function (item) { return !item.disabled && item.getClientRects().length > 0; });
      const first = focusable[0];
      const last = focusable[focusable.length - 1];

      if (!first) {
        event.preventDefault();
        dom.sidebar.focus();
        return;
      }

      if (event.shiftKey && (document.activeElement === first || !dom.sidebar.contains(document.activeElement))) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && (document.activeElement === last || !dom.sidebar.contains(document.activeElement))) {
        event.preventDefault();
        first.focus();
      }
    }
  }

  // 12. INITIALIZATION
  function getUserInitials(user) {
    const name = String(user && user.name || "").trim();
    const email = String(user && user.email || "").trim();
    const source = name || email || "User";

    if (source.indexOf("@") !== -1) {
      return source.charAt(0).toUpperCase();
    }

    return source
      .split(/\s+/)
      .filter(Boolean)
      .map(function (part) { return part.charAt(0); })
      .slice(0, 2)
      .join("")
      .toUpperCase() || "U";
  }

  function renderUserAvatar(userAvatar, options) {
    if (!userAvatar) return;

    const data = options && typeof options === "object"
      ? options
      : {};

    const displayName = String(data.displayName || "User").trim() || "User";
    const email = String(data.email || "").trim();
    const photoUrl = String(data.photoUrl || "").trim();
    const photoIsDefault = data.photoIsDefault === true;

    console.log(
      "[Nexus User Debug] renderUserAvatar() called:",
      {
        displayName: displayName,
        email: email,
        hasPhotoUrl: Boolean(photoUrl),
        photoIsDefault: photoIsDefault,
        photoUrlPreview: photoUrl
          ? photoUrl.substring(0, 120)
          : ""
      }
    );

    const renderInitials = function () {
      userAvatar.textContent = getUserInitials({
        name: displayName,
        email: email
      });

      userAvatar.style.backgroundImage = "";
      userAvatar.style.backgroundSize = "";
      userAvatar.style.backgroundPosition = "";
      userAvatar.style.backgroundRepeat = "";
      userAvatar.classList.remove("has-profile-photo");
      userAvatar.setAttribute(
        "aria-label",
        displayName + " avatar"
      );
    };

    renderInitials();

    // Keep the Nexus initials treatment when Google only returns its
    // generic/default avatar.
    if (!photoUrl) {
      console.warn(
        "[Nexus User Debug] No profile photo URL returned. Using initials."
      );
      return;
    }

    if (photoIsDefault) {
      console.warn(
        "[Nexus User Debug] Google returned a default profile image. " +
        "Keeping initials fallback."
      );
      return;
    }

    console.log(
      "[Nexus User Debug] Attempting to preload Google profile photo:",
      photoUrl
    );

    const image = new Image();

    image.onload = function () {
      console.log(
        "[Nexus User Debug] Profile photo loaded successfully:",
        {
          naturalWidth: image.naturalWidth,
          naturalHeight: image.naturalHeight
        }
      );

      if (!document.contains(userAvatar)) {
        console.warn(
          "[Nexus User Debug] Avatar element is no longer in the DOM."
        );
        return;
      }

      const safePhotoUrl = photoUrl.replace(/"/g, "%22");

      userAvatar.textContent = "";
      userAvatar.style.backgroundImage =
        'url("' + safePhotoUrl + '")';
      userAvatar.style.backgroundSize = "cover";
      userAvatar.style.backgroundPosition = "center";
      userAvatar.style.backgroundRepeat = "no-repeat";
      userAvatar.classList.add("has-profile-photo");
      userAvatar.setAttribute(
        "aria-label",
        displayName + " profile picture"
      );
    };

    image.onerror = function (event) {
      console.error(
        "[Nexus User Debug] Profile photo failed to load in browser:",
        {
          photoUrl: photoUrl,
          event: event
        }
      );
      renderInitials();
    };

    console.log(
      "[Nexus User Debug] Setting preloader image.src now."
    );
    image.src = photoUrl;
  }

  function renderCurrentUser(user) {
    const fallback = NexusAPI.getCurrentUserFallback();
    const resolved = user && typeof user === "object" ? user : fallback;
    const displayName = String(resolved.name || resolved.email || fallback.name).trim() || fallback.name;
    const email = String(resolved.email || "").trim();
    const photoUrl = String(resolved.photoUrl || "").trim();
    const photoIsDefault = resolved.photoIsDefault === true;
    const isAdmin = resolved.isAdmin === true;
    const role = isAdmin ? "admin" : "user";
    const userName = document.getElementById("user-name");
    const userEmail = document.getElementById("user-email");
    const userAvatar = document.getElementById("user-avatar");
    const userProfile = dom.userProfile || document.querySelector("[data-user-profile]");

    adminViewState.actualIsAdmin = isAdmin;
    adminViewState.actualRole = role;

    if (userName) {
      userName.textContent = displayName;
      if (email) userName.title = email;
      else userName.removeAttribute("title");
    }

    if (userEmail) {
      userEmail.classList.toggle("user-admin-badge", isAdmin);

      if (isAdmin) {
        userEmail.textContent = "NEXUS ADMIN";
        userEmail.title = email || "NEXUS Administrator";
        userEmail.setAttribute(
          "aria-label",
          email
            ? ("NEXUS ADMIN, " + email)
            : "NEXUS ADMIN"
        );
      } else {
        userEmail.textContent = email || "Email unavailable";

        if (email) {
          userEmail.title = email;
          userEmail.setAttribute("aria-label", email);
        } else {
          userEmail.removeAttribute("title");
          userEmail.removeAttribute("aria-label");
        }
      }
    }

    if (userAvatar) {
      renderUserAvatar(userAvatar, {
        displayName: displayName,
        email: email,
        photoUrl: photoUrl,
        photoIsDefault: photoIsDefault
      });
    }

    if (userProfile) {
      userProfile.classList.toggle("is-admin", isAdmin);
      userProfile.dataset.userRole = role;
      userProfile.classList.toggle("is-clickable", isAdmin);
      userProfile.tabIndex = isAdmin ? 0 : -1;

      userProfile.setAttribute(
        "aria-label",
        isAdmin
          ? (
              email
                ? (displayName + ", NEXUS ADMIN, " + email)
                : (displayName + ", NEXUS ADMIN")
            )
          : (
              email
                ? (displayName + ", " + email)
                : displayName
            )
      );

      userProfile.classList.remove("is-loading");
      userProfile.setAttribute("aria-busy", "false");
    }

    if (dom.userViewToggle) {
      dom.userViewToggle.hidden = !isAdmin;
    }

    if (!isAdmin) {
      closeAdminViewMenu();
      clearStoredAdminViewMode();
    }

    setAdminViewMode(
      isAdmin ? readStoredAdminViewMode() : "user",
      { persist: false }
    );
  }

  function initializeUser() {
    console.log(
      "[Nexus User Debug] initializeUser(); Apps Script available:",
      NexusAPI.isAppsScriptAvailable()
    );

    NexusAPI.getCurrentUser(
      function (user) {
        renderCurrentUser(user);
      },
      function () {
        // NexusAPI already renders the neutral fallback through onSuccess.
      }
    );
  }

  function initializeApp() {
    if (!dom.app || dom.app.dataset.initialized === "true") return;

    dom.app.dataset.appsScriptAvailable = String(NexusAPI.isAppsScriptAvailable());
    state.desktopCollapsed = readDesktopSidebarCollapsed();
    bindAdminViewControls();
    bindNotificationControls();
    initializeUser();

    dom.navItems.forEach(function (item) {
      item.addEventListener("click", function (event) {
        const route = item.dataset.route;
        if (window.location.hash === "#" + route) {
          if (state.mobileOpen) setMobileSidebar(false, false);
          focusPageTitle();
        } else {
          window.location.hash = route;
        }

        /* Mouse clicks should not leave the collapsed-sidebar tooltip pinned.
           Keyboard navigation retains focus for accessibility. */
        if (
          event.detail > 0 &&
          desktopSidebarQuery.matches &&
          state.desktopCollapsed
        ) {
          window.setTimeout(function () {
            item.blur();
          }, 0);
        }
      });
    });

    dom.filterItems.forEach(function (item) {
      item.addEventListener("click", function () {
        setSearchFilter(item.dataset.filter);
      });
    });

    if (dom.mobileFilterTrigger) {
      dom.mobileFilterTrigger.addEventListener("click", function (event) {
        event.preventDefault();
        event.stopPropagation();
        toggleMobileFilterMenu();
      });
    }

    document.addEventListener("click", function (event) {
      if (
        dom.filters &&
        dom.filters.contains(event.target)
      ) {
        return;
      }

      closeMobileFilterMenu();
    });

    if (dom.searchForm) {
      dom.searchForm.addEventListener("submit", function (event) {
        event.preventDefault();

        const query = dom.search ? dom.search.value.trim() : "";

        if (!query) {
          focusGlobalSearch();
          return;
        }

        if (
          window.NexusSearch &&
          typeof window.NexusSearch.navigate === "function"
        ) {
          window.NexusSearch.navigate(query, state.filter);
        }
      });
    }

    if (dom.toggle) dom.toggle.addEventListener("click", toggleSidebar);
    if (dom.desktopToggle) dom.desktopToggle.addEventListener("click", toggleSidebar);
    if (dom.sidebarClose) dom.sidebarClose.addEventListener("click", function () { setMobileSidebar(false, true); });
    if (dom.overlay) dom.overlay.addEventListener("click", function () { setMobileSidebar(false, true); });

    if (dom.skipLink) {
      dom.skipLink.addEventListener("click", function (event) {
        event.preventDefault();
        if (dom.content) dom.content.focus();
      });
    }

    if (dom.launcher) {
      dom.launcher.addEventListener("click", function () {
        openNoscaChat();
      });
    }

    window.addEventListener("hashchange", function () { handleRouteChange(true); });
    window.addEventListener("scroll", scheduleNavHeaderScrollEffect, { passive: true });
    if (dom.workspace) dom.workspace.addEventListener("scroll", scheduleNavHeaderScrollEffect, { passive: true });
    document.addEventListener("keydown", handleKeyboard);
    mobileQuery.addEventListener("change", handleViewportChange);
    tabletQuery.addEventListener("change", handleViewportChange);
    desktopQuery.addEventListener("change", handleViewportChange);

    placeNoscaLauncherForViewport();
    updateSidebar();
    setSearchFilter(state.filter);
    initializeShellAssets();
    handleRouteChange(false);
    dom.app.dataset.initialized = "true";
  }

  initializeApp();
}());
