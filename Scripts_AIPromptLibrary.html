<script>
(function () {
  "use strict";

  const state = {
    root: null,
    prompts: [],
    myPrompts: [],
    activeView: "explore",
    sortMode: "top-upvoted",
    identityVerified: false,
    communityWritesEnabled: false,
    currentUserEmail: "",
    phase2Installed: false,
    recommendationsData: null,
    recommendationsLoading: false,
    recommendationsError: "",
    recommendationsRequestId: 0,
    reports: [],
    reportsStatus: "Open",
    reportsPage: 1,
    reportTarget: null,
    phase2Busy: false,
    commentsPage: 1,
    commentsTotal: 0,
    votePending: {},
    commentSubmitting: false,
    categories: [],
    categoryOptions: [],
    promptTypeOptions: [],
    adminView: false,
    category: "all",
    query: "",
    filters: {
      promptTypes: [],
      content: "all",
      statuses: []
    },
    page: 1,
    pageSize: 10,
    activePromptId: "",
    editingPromptId: "",
    editorBaseline: "",
    documentFilterListenerBound: false,
    loading: false
  };

  const refs = {};

  function isAppsScriptAvailable() {
    return Boolean(
      typeof google !== "undefined" &&
      google && google.script && google.script.run
    );
  }

  function getEffectiveRole() {
    const app = document.getElementById("nexus-app");
    return app && app.dataset.currentUserEffectiveRole === "admin"
      ? "admin"
      : "user";
  }

  function initialize(pageRoot) {
    const root = pageRoot && pageRoot.querySelector
      ? pageRoot.querySelector('[data-page="ai-prompt-library"]')
      : null;

    if (!root) return;

    state.root = root;

    try {
      cacheRefs(root);

      if (root.dataset.promptLibraryInitialized !== "true") {
        bindEvents(root);
        root.dataset.promptLibraryInitialized = "true";
        syncAdminUI();
        loadLibrary();
        return;
      }

      syncAdminUI();
    } catch (error) {
      console.error(
        "[AI Prompt Library] Frontend initialization error:",
        error
      );

      const status = root.querySelector(
        "#ai-prompt-library-status"
      );
      const statusText = status
        ? status.querySelector("[data-ai-prompt-status-text]")
        : null;

      if (status) {
        status.hidden = false;
        status.className =
          "ai-prompt-library-state is-error";
      }

      if (statusText) {
        statusText.textContent =
          "The Prompt Library could not initialize. " +
          "Please refresh and try again.";
      }
    }
  }

  function cacheRefs(root) {
    refs.surface = root.querySelector("#ai-prompt-library-surface");
    refs.header = root.querySelector("#ai-prompt-library-header");
    refs.count = root.querySelector("#ai-prompt-library-count");
    refs.search = root.querySelector("#ai-prompt-library-search");
    refs.missingSummary = root.querySelector(
      "#ai-prompt-library-missing-summary"
    );
    refs.missingSummaryTitle = root.querySelector(
      "#ai-prompt-library-missing-summary-title"
    );
    refs.viewMissing = root.querySelector(
      "#ai-prompt-library-view-missing"
    );
    refs.filterToggle = root.querySelector(
      "#ai-prompt-library-filter-toggle"
    );
    refs.filterCount = root.querySelector(
      "#ai-prompt-library-filter-count"
    );
    refs.filterPopover = root.querySelector(
      "#ai-prompt-library-filter-popover"
    );
    refs.filterClose = root.querySelector(
      "#ai-prompt-library-filter-close"
    );
    refs.filterCancel = root.querySelector(
      "#ai-prompt-library-filter-cancel"
    );
    refs.filterApply = root.querySelector(
      "#ai-prompt-library-filter-apply"
    );
    refs.filterClear = root.querySelector(
      "#ai-prompt-library-filter-clear"
    );
    refs.filterTypes = root.querySelector(
      "#ai-prompt-library-filter-types"
    );
    refs.filterContentGroup = root.querySelector(
      "#ai-prompt-library-filter-content-group"
    );
    refs.filterStatusGroup = root.querySelector(
      "#ai-prompt-library-filter-status-group"
    );
    refs.activeFilters = root.querySelector(
      "#ai-prompt-library-active-filters"
    );
    refs.activeFilterChips = root.querySelector(
      "#ai-prompt-library-active-filter-chips"
    );
    refs.clearFilters = root.querySelector(
      "#ai-prompt-library-clear-filters"
    );
    refs.categories = root.querySelector("#ai-prompt-library-categories");
    refs.results = root.querySelector("#ai-prompt-library-results");
    refs.pagination = root.querySelector("#ai-prompt-library-pagination");
    refs.status = root.querySelector("#ai-prompt-library-status");
    refs.statusTitle = refs.status
      ? refs.status.querySelector("[data-ai-prompt-status-title]")
      : null;
    refs.statusText = refs.status
      ? refs.status.querySelector("[data-ai-prompt-status-text]")
      : null;
    refs.stateAction = root.querySelector(
      "#ai-prompt-library-state-action"
    );
    refs.retry = root.querySelector("#ai-prompt-library-retry");
    refs.addButton = root.querySelector("#ai-prompt-library-add");
    refs.communityExplore = root.querySelector("#ai-prompt-community-explore");
    refs.communityMy = root.querySelector("#ai-prompt-community-my");
    refs.phase2Bookmarks = root.querySelector("#ai-prompt-community-bookmarks");
    refs.phase3ForYou = root.querySelector("#ai-prompt-community-for-you");
    refs.phase2Moderation = root.querySelector("#ai-prompt-community-moderation");
    refs.phase2Actions = root.querySelector("#ai-prompt-phase2-actions");
    refs.phase2Badge = root.querySelector("#ai-prompt-phase2-verified");
    refs.phase2Bookmark = root.querySelector("#ai-prompt-phase2-bookmark");
    refs.phase2Fork = root.querySelector("#ai-prompt-phase2-fork");
    refs.phase2History = root.querySelector("#ai-prompt-phase2-history");
    refs.phase2Report = root.querySelector("#ai-prompt-phase2-report");
    refs.phase2Verify = root.querySelector("#ai-prompt-phase2-verify");
    refs.phase2Origin = root.querySelector("#ai-prompt-phase2-origin");
    refs.phase2ReportDialog = root.querySelector("#ai-prompt-phase2-report-dialog");
    refs.phase2ReportForm = root.querySelector("#ai-prompt-phase2-report-form");
    refs.phase2Reason = root.querySelector("#ai-prompt-phase2-report-reason");
    refs.phase2ReportDetails = root.querySelector("#ai-prompt-phase2-report-details");
    refs.phase2VersionsDialog = root.querySelector("#ai-prompt-phase2-versions-dialog");
    refs.phase2Versions = root.querySelector("#ai-prompt-phase2-versions");
    refs.communitySort = root.querySelector("#ai-prompt-community-sort");
    refs.communityIdentity = root.querySelector("#ai-prompt-community-identity");
    refs.detailUpvote = root.querySelector("#ai-prompt-community-detail-upvote");
    refs.detailVotes = root.querySelector("#ai-prompt-community-detail-votes");
    refs.detailCopies = root.querySelector("#ai-prompt-community-detail-copies");
    refs.detailCommentCount = root.querySelector("#ai-prompt-community-detail-comment-count");
    refs.comments = root.querySelector("#ai-prompt-community-comments");
    refs.commentForm = root.querySelector("#ai-prompt-comment-form");
    refs.commentBody = root.querySelector("#ai-prompt-comment-body");
    refs.commentsPrev = root.querySelector("#ai-prompt-comments-prev");
    refs.commentsNext = root.querySelector("#ai-prompt-comments-next");
    refs.commentsPage = root.querySelector("#ai-prompt-comments-page");

    refs.detailDialog = root.querySelector("#ai-prompt-detail-dialog");
    refs.detailTitle = root.querySelector("#ai-prompt-detail-title");
    refs.detailId = root.querySelector("#ai-prompt-detail-id");
    refs.detailMeta = root.querySelector("#ai-prompt-detail-meta");
    refs.detailUseCase = root.querySelector("#ai-prompt-detail-use-case");
    refs.detailPrompt = root.querySelector("#ai-prompt-detail-prompt");
    refs.detailCopy = root.querySelector("#ai-prompt-detail-copy");
    refs.detailAdminActions = root.querySelector("#ai-prompt-detail-admin-actions");
    refs.detailEdit = root.querySelector("#ai-prompt-detail-edit");
    refs.detailDelete = root.querySelector("#ai-prompt-detail-delete");
    refs.detailClose = Array.from(
      root.querySelectorAll("[data-ai-prompt-detail-close]")
    );

    refs.addDialog = root.querySelector("#ai-prompt-add-dialog");
    refs.addForm = root.querySelector("#ai-prompt-add-form");
    refs.addClose = Array.from(
      root.querySelectorAll("[data-ai-prompt-add-close]")
    );
    refs.addError = root.querySelector("#ai-prompt-add-error");
    refs.addSubmit = root.querySelector("#ai-prompt-add-submit");
    refs.editorTitle = root.querySelector("#ai-prompt-editor-title");
    refs.editorId = root.querySelector("#ai-prompt-editor-id");
    refs.editorDescription = root.querySelector("#ai-prompt-editor-description");
    refs.useCaseCounter = root.querySelector(
      "#ai-prompt-use-case-counter"
    );
    refs.promptCounter = root.querySelector(
      "#ai-prompt-content-counter"
    );


    refs.categorySelect = root.querySelector(
      "#ai-prompt-add-category-select"
    );
    refs.newCategoryToggle = root.querySelector(
      "#ai-prompt-add-new-category-toggle"
    );
    refs.newCategoryField = root.querySelector(
      "#ai-prompt-add-new-category-field"
    );
    refs.newCategoryInput = root.querySelector(
      "#ai-prompt-add-new-category"
    );

    refs.promptTypeSelect = root.querySelector(
      "#ai-prompt-add-type-select"
    );
    refs.newPromptTypeToggle = root.querySelector(
      "#ai-prompt-add-new-type-toggle"
    );
    refs.newPromptTypeField = root.querySelector(
      "#ai-prompt-add-new-type-field"
    );
    refs.newPromptTypeInput = root.querySelector(
      "#ai-prompt-add-new-type"
    );

    refs.toast = root.querySelector("#ai-prompt-library-toast");


    refs.toastMessage = root.querySelector(
      "#ai-prompt-library-toast-message"
    );
  }

  function bindEvents(root) {
    if (refs.communityExplore) refs.communityExplore.addEventListener("click", function () {
      setCommunityView_("explore");
    });
    if (refs.communityMy) refs.communityMy.addEventListener("click", function () {
      setCommunityView_("my-prompts");
    });
    if (refs.phase2Bookmarks) refs.phase2Bookmarks.addEventListener("click", function () {
      setCommunityView_("bookmarks");
    });
    if (refs.phase2Moderation) refs.phase2Moderation.addEventListener("click", function () {
      setCommunityView_("moderation");
    });
    if (refs.phase3ForYou) refs.phase3ForYou.addEventListener("click", function () {
      setCommunityView_("for-you");
    });
    if (refs.phase2Bookmark) refs.phase2Bookmark.addEventListener("click", function () {
      togglePhase2Bookmark_(state.activePromptId);
    });
    if (refs.phase2Fork) refs.phase2Fork.addEventListener("click", forkPhase2Prompt_);
    if (refs.phase2Report) refs.phase2Report.addEventListener("click", function () {
      openPhase2Report_("prompt", state.activePromptId);
    });
    if (refs.phase2History) refs.phase2History.addEventListener("click", openPhase2Versions_);
    if (refs.phase2Verify) refs.phase2Verify.addEventListener("click", verifyPhase2Prompt_);
    if (refs.phase2ReportForm) refs.phase2ReportForm.addEventListener("submit", submitPhase2Report_);
    if (root.querySelector("#ai-prompt-phase2-report-cancel")) {
      root.querySelector("#ai-prompt-phase2-report-cancel").addEventListener("click", function () {closeDialog(refs.phase2ReportDialog);});
    }
    if (root.querySelector("#ai-prompt-phase2-versions-close")) {
      root.querySelector("#ai-prompt-phase2-versions-close").addEventListener("click", function () {closeDialog(refs.phase2VersionsDialog);});
    }
    if (refs.communitySort) refs.communitySort.addEventListener("change", function () {
      state.sortMode = refs.communitySort.value || "top-upvoted";
      state.page = 1;
      renderLibrary();
    });
    if (refs.detailUpvote) refs.detailUpvote.addEventListener("click", function () {
      setCommunityVote_(state.activePromptId);
    });
    if (refs.commentForm) refs.commentForm.addEventListener("submit", submitCommunityComment_);
    if (refs.commentsPrev) refs.commentsPrev.addEventListener("click", function () {
      state.commentsPage = Math.max(1, state.commentsPage - 1);
      loadCommunityComments_();
    });
    if (refs.commentsNext) refs.commentsNext.addEventListener("click", function () {
      state.commentsPage += 1;
      loadCommunityComments_();
    });
    if (refs.comments) refs.comments.addEventListener("click", handleCommunityCommentAction_);
    if (refs.search) {
      refs.search.addEventListener("input", function () {
        state.query = refs.search.value.trim().toLowerCase();
        state.page = 1;
        renderCategoryFilters();
        renderLibrary();
      });
    }

    if (refs.filterToggle) {
      refs.filterToggle.addEventListener(
        "click",
        function (event) {
          event.stopPropagation();

          if (
            refs.filterPopover &&
            !refs.filterPopover.hidden
          ) {
            closeFilterPopover_();
          } else {
            openFilterPopover_();
          }
        }
      );
    }

    [refs.filterClose, refs.filterCancel].forEach(
      function (button) {
        if (!button) return;

        button.addEventListener(
          "click",
          closeFilterPopover_
        );
      }
    );

    if (refs.filterClear) {
      refs.filterClear.addEventListener(
        "click",
        function () {
          renderFilterControls_({
            promptTypes: [],
            content: "all",
            statuses: []
          });
        }
      );
    }

    if (refs.filterApply) {
      refs.filterApply.addEventListener(
        "click",
        applyFiltersFromPopover_
      );
    }

    if (refs.clearFilters) {
      refs.clearFilters.addEventListener(
        "click",
        function () {
          clearActiveFilters_();
        }
      );
    }

    if (refs.activeFilters) {
      refs.activeFilters.addEventListener(
        "click",
        function (event) {
          const remove = event.target.closest(
            "[data-ai-prompt-remove-filter]"
          );

          if (!remove) return;

          removeActiveFilter_(
            remove.dataset.aiPromptRemoveFilter || "",
            remove.dataset.aiPromptFilterValue || ""
          );
        }
      );
    }

    if (refs.viewMissing) {
      refs.viewMissing.addEventListener(
        "click",
        function () {
          state.category = "all";
          state.query = "";

          if (refs.search) {
            refs.search.value = "";
          }

          state.filters.content = "missing";
          state.page = 1;
          renderFilterSummary_();
          renderCategoryFilters();
          renderLibrary();
        }
      );
    }

    if (refs.categories) {
      refs.categories.addEventListener("click", function (event) {
        const back = event.target.closest(
          "[data-ai-prompt-category-back]"
        );

        if (back) {
          state.category = "all";
          state.page = 1;
          renderCategoryFilters();
          renderLibrary();
          return;
        }

        const button = event.target.closest(
          "[data-ai-prompt-category]"
        );

        if (!button) return;

        state.category =
          button.dataset.aiPromptCategory || "all";
        state.page = 1;
        renderCategoryFilters();
        renderLibrary();
      });
    }

    if (refs.results) {
      refs.results.addEventListener("click", function (event) {
        const actionButton = event.target.closest(
          "[data-ai-prompt-action]"
        );

        if (actionButton) {
          event.preventDefault();
          event.stopPropagation();

          const promptId =
            actionButton.dataset.aiPromptId || "";
          const action =
            actionButton.dataset.aiPromptAction || "";

          if (action === "publish" || action === "unpublish") {
            setCommunityPublication_(promptId, action === "publish");
            return;
          }
          if (action === "upvote") {
            setCommunityVote_(promptId);
            return;
          }
          if (action === "bookmark") {
            togglePhase2Bookmark_(promptId);
            return;
          }
          if (action === "edit") {
            editPromptById(promptId);
            return;
          }

          handlePromptTableAction(
            promptId,
            action,
            actionButton
          );

          return;
        }

        if (
          event.target.closest(
            ".ai-prompt-table-action-cell"
          )
        ) {
          return;
        }

        const openButton = event.target.closest(
          "[data-ai-prompt-open]"
        );

        if (openButton) {
          event.preventDefault();
          openPromptDetail(
            openButton.dataset.aiPromptId || ""
          );
          return;
        }

        const row = event.target.closest(
          "tr[data-ai-prompt-id]"
        );

        if (!row) return;

        openPromptDetail(
          row.dataset.aiPromptId || ""
        );
      });
    }

    if (refs.pagination) {
      refs.pagination.addEventListener("click", function (event) {
        const button = event.target.closest(
          "[data-ai-prompt-page]"
        );

        if (!button || button.disabled) return;

        const page = Number(
          button.dataset.aiPromptPage
        );

        if (!Number.isFinite(page) || page < 1) {
          return;
        }

        state.page = page;
        renderLibrary();

        if (
          refs.header &&
          typeof refs.header.scrollIntoView === "function"
        ) {
          refs.header.scrollIntoView({
            behavior: "smooth",
            block: "start"
          });
        }
      });
    }

    if (refs.stateAction) {
      refs.stateAction.addEventListener(
        "click",
        handleEmptyStateAction_
      );
    }

    if (refs.retry) {
      refs.retry.addEventListener(
        "click",
        loadLibrary
      );
    }

    if (refs.addButton) {
      refs.addButton.addEventListener(
        "click",
        openAddPromptDialog
      );
    }

    refs.detailClose.forEach(function (button) {
      button.addEventListener(
        "click",
        closeDetailDialog
      );
    });

    if (refs.detailCopy) {
      refs.detailCopy.addEventListener(
        "click",
        copyActivePrompt
      );
    }

    if (refs.detailEdit) {
      refs.detailEdit.addEventListener(
        "click",
        openEditPromptDialog
      );
    }

    if (refs.detailDelete) {
      refs.detailDelete.addEventListener(
        "click",
        deleteActivePrompt
      );
    }

    refs.addClose.forEach(function (button) {
      button.addEventListener(
        "click",
        requestCloseAddPromptDialog_
      );
    });

    if (refs.addForm) {
      refs.addForm.addEventListener(
        "submit",
        submitAddPrompt
      );

      refs.addForm.addEventListener(
        "input",
        updatePromptFieldCounters_
      );
    }

    if (refs.categorySelect) {
      refs.categorySelect.addEventListener(
        "change",
        handleCategorySelectionChange
      );
    }

    if (refs.newCategoryToggle) {
      refs.newCategoryToggle.addEventListener(
        "click",
        toggleNewCategoryMode
      );
    }

    if (refs.promptTypeSelect) {
      refs.promptTypeSelect.addEventListener(
        "change",
        handlePromptTypeSelectionChange
      );
    }

    if (refs.newPromptTypeToggle) {
      refs.newPromptTypeToggle.addEventListener(
        "click",
        toggleNewPromptTypeMode
      );
    }

    if (refs.detailDialog) {
      refs.detailDialog.addEventListener(
        "click",
        function (event) {
          if (event.target === refs.detailDialog) {
            closeDetailDialog();
          }
        }
      );
    }

    if (refs.addDialog) {
      refs.addDialog.addEventListener(
        "click",
        function (event) {
          if (event.target === refs.addDialog) {
            requestCloseAddPromptDialog_();
          }
        }
      );

      refs.addDialog.addEventListener(
        "cancel",
        function (event) {
          event.preventDefault();
          requestCloseAddPromptDialog_();
        }
      );
    }

    if (!state.documentFilterListenerBound) {
      document.addEventListener(
        "click",
        function (event) {
          if (
            refs.filterPopover &&
            !refs.filterPopover.hidden &&
            !event.target.closest(
              ".ai-prompt-filter-menu-wrap"
            )
          ) {
            closeFilterPopover_();
          }
        }
      );

      state.documentFilterListenerBound = true;
    }

    root.addEventListener("keydown", function (event) {
      if (event.key !== "Escape") return;

      if (
        refs.filterPopover &&
        !refs.filterPopover.hidden
      ) {
        closeFilterPopover_();
        return;
      }

      if (
        refs.detailDialog &&
        refs.detailDialog.open
      ) {
        closeDetailDialog();
        return;
      }

      if (
        refs.addDialog &&
        refs.addDialog.open
      ) {
        event.preventDefault();
        requestCloseAddPromptDialog_();
      }
    });
  }


  function normalizeFilterState_(filters) {
    const source = filters && typeof filters === "object"
      ? filters
      : {};

    return {
      promptTypes: Array.isArray(source.promptTypes)
        ? source.promptTypes.filter(Boolean)
        : [],
      content: ["all", "has", "missing"].includes(
        source.content
      )
        ? source.content
        : "all",
      statuses: Array.isArray(source.statuses)
        ? source.statuses.filter(Boolean)
        : []
    };
  }


  function getActiveFilterCount_() {
    return (
      state.filters.promptTypes.length +
      state.filters.statuses.length +
      (state.filters.content === "all" ? 0 : 1)
    );
  }


  function hasActiveFilters_() {
    return getActiveFilterCount_() > 0;
  }


  function openFilterPopover_() {
    if (!refs.filterPopover) return;

    renderFilterControls_(state.filters);
    refs.filterPopover.hidden = false;

    if (refs.filterToggle) {
      refs.filterToggle.setAttribute(
        "aria-expanded",
        "true"
      );
    }
  }


  function closeFilterPopover_() {
    if (!refs.filterPopover) return;

    refs.filterPopover.hidden = true;

    if (refs.filterToggle) {
      refs.filterToggle.setAttribute(
        "aria-expanded",
        "false"
      );
    }
  }


  function renderFilterControls_(filters) {
    const value = normalizeFilterState_(filters);

    if (refs.filterTypes) {
      refs.filterTypes.replaceChildren();

      state.promptTypeOptions.forEach(function (item) {
        const label = document.createElement("label");
        label.className = "ai-prompt-filter-option";

        const input = document.createElement("input");
        input.type = "checkbox";
        input.value = item.name;
        input.dataset.aiPromptTypeFilter = "true";
        input.checked = value.promptTypes.includes(
          item.name
        );

        const text = document.createElement("span");
        text.textContent = item.name;

        label.append(input, text);
        refs.filterTypes.appendChild(label);
      });

      if (!state.promptTypeOptions.length) {
        const empty = document.createElement("p");
        empty.className = "ai-prompt-filter-empty";
        empty.textContent =
          "No prompt types are available.";
        refs.filterTypes.appendChild(empty);
      }
    }

    const contentInputs = state.root
      ? state.root.querySelectorAll(
          'input[name="ai-prompt-content-filter-draft"]'
        )
      : [];

    contentInputs.forEach(function (input) {
      input.checked = input.value === value.content;
    });

    const missingCount = getMissingPromptCount_();

    if (refs.filterContentGroup) {
      refs.filterContentGroup.hidden =
        missingCount === 0;
    }

    if (missingCount === 0) {
      value.content = "all";

      contentInputs.forEach(function (input) {
        input.checked = input.value === "all";
      });
    }

    const isAdmin = getEffectiveRole() === "admin";

    if (refs.filterStatusGroup) {
      refs.filterStatusGroup.hidden = !isAdmin;
    }

    const statusInputs = state.root
      ? state.root.querySelectorAll(
          "[data-ai-prompt-status-filter]"
        )
      : [];

    statusInputs.forEach(function (input) {
      input.checked =
        isAdmin &&
        value.statuses.includes(input.value);
    });
  }


  function readFilterControls_() {
    const promptTypes = state.root
      ? Array.from(
          state.root.querySelectorAll(
            "[data-ai-prompt-type-filter]:checked"
          )
        ).map(function (input) {
          return input.value;
        })
      : [];

    const contentInput = state.root
      ? state.root.querySelector(
          'input[name="ai-prompt-content-filter-draft"]:checked'
        )
      : null;

    const statuses = (
      getEffectiveRole() === "admin" &&
      state.root
    )
      ? Array.from(
          state.root.querySelectorAll(
            "[data-ai-prompt-status-filter]:checked"
          )
        ).map(function (input) {
          return input.value;
        })
      : [];

    return normalizeFilterState_({
      promptTypes: promptTypes,
      content: contentInput
        ? contentInput.value
        : "all",
      statuses: statuses
    });
  }


  function applyFiltersFromPopover_() {
    state.filters = readFilterControls_();

    if (
      state.promptTypeOptions.length > 0 &&
      state.filters.promptTypes.length ===
        state.promptTypeOptions.length
    ) {
      state.filters.promptTypes = [];
    }

    if (
      getEffectiveRole() === "admin" &&
      state.filters.statuses.length === 4
    ) {
      state.filters.statuses = [];
    }

    if (
      getMissingPromptCount_() === 0 &&
      state.filters.content !== "all"
    ) {
      state.filters.content = "all";
    }

    state.page = 1;
    closeFilterPopover_();
    renderFilterSummary_();
    renderCategoryFilters();
    renderLibrary();
  }


  function clearActiveFilters_() {
    state.filters = normalizeFilterState_({});
    state.page = 1;
    renderFilterSummary_();
    renderCategoryFilters();
    renderLibrary();
  }


  function removeActiveFilter_(
    filterType,
    filterValue
  ) {
    if (filterType === "promptType") {
      state.filters.promptTypes =
        state.filters.promptTypes.filter(
          function (value) {
            return value !== filterValue;
          }
        );
    }

    if (filterType === "content") {
      state.filters.content = "all";
    }

    if (filterType === "status") {
      state.filters.statuses =
        state.filters.statuses.filter(
          function (value) {
            return value !== filterValue;
          }
        );
    }

    state.page = 1;
    renderFilterSummary_();
    renderCategoryFilters();
    renderLibrary();
  }


  function createActiveFilterChip_(
    label,
    filterType,
    filterValue,
    extraClass
  ) {
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className =
      "ai-prompt-active-filter-chip" +
      (extraClass ? " " + extraClass : "");
    chip.dataset.aiPromptRemoveFilter = filterType;
    chip.dataset.aiPromptFilterValue =
      filterValue || "";
    chip.setAttribute(
      "aria-label",
      "Remove filter: " + label
    );

    const text = document.createElement("span");
    text.textContent = label;

    const close = document.createElement("span");
    close.setAttribute("aria-hidden", "true");
    close.textContent = "×";

    chip.append(text, close);
    return chip;
  }


  function renderFilterSummary_() {
    const filterCount = getActiveFilterCount_();

    if (refs.filterCount) {
      refs.filterCount.hidden = filterCount === 0;
      refs.filterCount.textContent =
        String(filterCount);
    }

    if (refs.filterToggle) {
      refs.filterToggle.classList.toggle(
        "is-active",
        filterCount > 0
      );
    }

    if (
      !refs.activeFilters ||
      !refs.activeFilterChips
    ) {
      return;
    }

    refs.activeFilterChips.replaceChildren();

    state.filters.promptTypes.forEach(
      function (promptType) {
        refs.activeFilterChips.appendChild(
          createActiveFilterChip_(
            promptType,
            "promptType",
            promptType,
            "is-type"
          )
        );
      }
    );

    if (state.filters.content === "has") {
      refs.activeFilterChips.appendChild(
        createActiveFilterChip_(
          "Has prompt",
          "content",
          "has",
          "is-content"
        )
      );
    }

    if (state.filters.content === "missing") {
      refs.activeFilterChips.appendChild(
        createActiveFilterChip_(
          "Missing prompt",
          "content",
          "missing",
          "is-warning"
        )
      );
    }

    state.filters.statuses.forEach(
      function (status) {
        refs.activeFilterChips.appendChild(
          createActiveFilterChip_(
            "Status: " + status,
            "status",
            status,
            "is-status"
          )
        );
      }
    );

    refs.activeFilters.hidden = filterCount === 0;
  }


  function getMissingPromptCount_() {
    return state.prompts.filter(function (prompt) {
      return !hasPromptContent_(prompt);
    }).length;
  }



  function sanitizeActiveFilters_() {
    const allowedTypes = new Set(
      state.promptTypeOptions.map(function (item) {
        return item.name;
      })
    );

    state.filters.promptTypes =
      state.filters.promptTypes.filter(
        function (value) {
          return allowedTypes.has(value);
        }
      );

    if (getMissingPromptCount_() === 0) {
      state.filters.content = "all";
    }

    if (getEffectiveRole() !== "admin") {
      state.filters.statuses = [];
    }
  }


  function renderMissingSummary_() {
    if (!refs.missingSummary) return;

    const missingCount = getMissingPromptCount_();
    const isAdmin = getEffectiveRole() === "admin";

    refs.missingSummary.hidden =
      !isAdmin || missingCount === 0 || state.activeView !== "explore";

    if (
      isAdmin &&
      missingCount > 0 &&
      refs.missingSummaryTitle
    ) {
      refs.missingSummaryTitle.textContent =
        missingCount +
        " " +
        (
          missingCount === 1
            ? "prompt still needs"
            : "prompts still need"
        ) +
        " prompt content.";
    }
  }


  function shouldShowTable_() {
    return Boolean(
      state.query ||
      state.category !== "all" ||
      hasActiveFilters_() ||
      state.activeView === "explore" ||
      state.activeView === "my-prompts" ||
      state.activeView === "bookmarks" ||
      state.activeView === "moderation" ||
      state.activeView === "insights" ||
      state.activeView === "for-you"
    );
  }


  function handleEmptyStateAction_() {
    if (!refs.stateAction) return;

    const action =
      refs.stateAction.dataset.aiPromptStateAction || "";

    if (action === "search") {
      state.query = "";

      if (refs.search) {
        refs.search.value = "";
      }
    }

    if (action === "filters") {
      state.filters = normalizeFilterState_({});
    }

    if (action === "category") {
      state.category = "all";
    }

    state.page = 1;
    renderFilterSummary_();
    renderCategoryFilters();
    renderLibrary();
  }


  function updatePromptFieldCounters_() {
    if (!refs.addForm) return;

    const useCase = refs.addForm.elements.useCase;
    const prompt = refs.addForm.elements.prompt;

    if (refs.useCaseCounter) {
      const length = useCase
        ? String(useCase.value || "").length
        : 0;

      refs.useCaseCounter.textContent =
        length + "/500";
    }

    if (refs.promptCounter) {
      const length = prompt
        ? String(prompt.value || "").length
        : 0;

      refs.promptCounter.textContent =
        length + "/12000";
    }
  }


  function getEditorSignature_() {
    if (!refs.addForm) return "";

    const form = new FormData(refs.addForm);

    return JSON.stringify({
      promptName: String(
        form.get("promptName") || ""
      ),
      categorySelection: refs.categorySelect
        ? refs.categorySelect.value
        : "",
      newCategoryMode: Boolean(
        refs.newCategoryField &&
        !refs.newCategoryField.hidden
      ),
      newCategory: refs.newCategoryInput
        ? refs.newCategoryInput.value
        : "",
      promptTypeSelection: refs.promptTypeSelect
        ? refs.promptTypeSelect.value
        : "",
      newPromptTypeMode: Boolean(
        refs.newPromptTypeField &&
        !refs.newPromptTypeField.hidden
      ),
      newPromptType: refs.newPromptTypeInput
        ? refs.newPromptTypeInput.value
        : "",
      useCase: String(
        form.get("useCase") || ""
      ),
      prompt: String(
        form.get("prompt") || ""
      ),
      status: String(
        form.get("status") || ""
      )
    });
  }


  function updateEditorBaseline_() {
    state.editorBaseline =
      getEditorSignature_();
  }


  function hasUnsavedEditorChanges_() {
    if (!refs.addDialog || !refs.addDialog.open) {
      return false;
    }

    return (
      state.editorBaseline !==
      getEditorSignature_()
    );
  }


  function requestCloseAddPromptDialog_() {
    if (
      hasUnsavedEditorChanges_() &&
      !window.confirm(
        "Discard your unsaved changes?"
      )
    ) {
      return;
    }

    closeAddPromptDialog(true);
  }


  function canWriteCommunity_() {
    return state.identityVerified && state.communityWritesEnabled;
  }

  function findCommunityPrompt_(id) {
    return state.prompts.concat(state.myPrompts).find(function (item) {
      return String(item.id || "") === String(id || "");
    });
  }

  function canEditCommunityPrompt_(prompt) {
    if (!prompt || !canWriteCommunity_()) return false;
    const actualAdminInView = state.adminView && getEffectiveRole() === "admin";
    const isAuthor = prompt.createdByEmail &&
      prompt.createdByEmail === state.currentUserEmail;
    return Boolean(actualAdminInView || (isAuthor &&
      ["Active", "Draft"].includes(prompt.status)));
  }

  function syncAdminUI() {
    const isAdmin = getEffectiveRole() === "admin";
    if (refs.addButton) {
      refs.addButton.hidden = !canWriteCommunity_();
      refs.addButton.textContent = "+ Post a Prompt";
    }
    if (refs.detailAdminActions) {
      const prompt = findCommunityPrompt_(state.activePromptId);
      refs.detailAdminActions.hidden = !canEditCommunityPrompt_(prompt);
    }
    if (refs.detailDelete) {
      refs.detailDelete.hidden = !state.adminView || !isAdmin;
      refs.detailDelete.textContent = "Delete Permanently";
    }
    if (refs.filterStatusGroup) refs.filterStatusGroup.hidden = !isAdmin;
    if (!isAdmin && state.filters.statuses.length) state.filters.statuses = [];
    if (refs.communityIdentity) {
      let msg = "";
      if (!state.phase2Installed) msg = "Phase 2 setup is pending. Ask an administrator to run setupNexusPromptPhase2Sheets().";
      if (!state.identityVerified) {
        msg = "You can browse prompts, but community changes require a verified employee identity.";
      } else if (!state.communityWritesEnabled) {
        msg = "Community interaction is awaiting administrator activation after identity verification.";
      }
      refs.communityIdentity.hidden = !msg;
      refs.communityIdentity.textContent = msg;
    }
    syncCommunityView_();
    renderMissingSummary_();
    renderFilterSummary_();
  }

  function setCommunityView_(name) {
    const allowed = ["explore", "my-prompts", "bookmarks", "moderation", "for-you"];
    const isAdmin = state.adminView && getEffectiveRole() === "admin";
    state.activeView = allowed.includes(name) && (name !== "moderation" || isAdmin)
      ? name : "explore";
    if (state.activeView === "for-you") {
      state.recommendationsData = null;
      state.recommendationsError = "";
    }
    state.page = 1;
    state.category = "all";
    state.query = "";
    if (refs.search) refs.search.value = "";
    state.filters = {promptTypes:[],content:"all",statuses:[]};
    renderFilterSummary_();
    syncCommunityView_();
    renderCategoryFilters();
    renderLibrary();
  }

  function syncCommunityView_() {
    const view = state.activeView;
    const isAdmin = state.adminView && getEffectiveRole() === "admin";
    if (view === "moderation" && !isAdmin) state.activeView = "explore";
    [
      [refs.communityExplore, "explore"],
      [refs.communityMy, "my-prompts"],
      [refs.phase2Bookmarks, "bookmarks"],
      [refs.phase3ForYou, "for-you"],
      [refs.phase2Moderation, "moderation"]
    ].forEach(function (entry) {
      const button = entry[0], page = entry[1];
      if (!button) return;
      const active = state.activeView === page;
      button.classList.toggle("is-active", active);
      button.setAttribute("aria-current", active ? "page" : "false");
    });
    if (refs.communityMy) {
      refs.communityMy.disabled = !state.identityVerified;
      refs.communityMy.title = state.identityVerified ? "View your contributions" : "Identity verification required";
    }
    if (refs.phase2Bookmarks) refs.phase2Bookmarks.hidden = !state.phase2Installed || !state.identityVerified;
    if (refs.phase2Moderation) refs.phase2Moderation.hidden = !state.phase2Installed || !isAdmin;
    if (refs.phase3ForYou) refs.phase3ForYou.hidden = false;
    const isRecommended = state.activeView === "for-you";
    if (refs.communitySort) refs.communitySort.hidden = state.activeView === "moderation" || isRecommended;
    if (refs.categories) refs.categories.hidden = state.activeView !== "explore";
    if (refs.missingSummary) refs.missingSummary.hidden = state.activeView !== "explore";
    const searchToolbar = state.root && state.root.querySelector(".ai-prompt-library-toolbar");
    if (searchToolbar) searchToolbar.hidden = isRecommended || state.activeView === "moderation";
    if (refs.activeFilters) refs.activeFilters.hidden = isRecommended || state.activeView === "moderation" || !hasActiveFilters_();
    if (state.activeView === "moderation") loadPhase2Reports_();
    if (isRecommended && !state.recommendationsData && !state.recommendationsLoading && !state.recommendationsError) {
      loadRecommendedPrompts_();
    }
  }

  function loadLibrary() {
    if (!state.root || state.loading) return;

    state.loading = true;
    setLoadingState();

    if (!isAppsScriptAvailable()) {
      state.loading = false;
      setErrorState("The Prompt Library is available when Nexus is running through Google Apps Script.");
      return;
    }

    try {
      google.script.run
        .withSuccessHandler(function (response) {
          state.loading = false;
          const payload = response && typeof response === "object" ? response : {};
          state.adminView = payload.adminView === true;
          state.identityVerified = payload.identityVerified === true;
          state.communityWritesEnabled = payload.communityWritesEnabled === true;
          state.phase2Installed = payload.phase2Installed === true;
          state.recommendationsData = null;
          state.recommendationsError = "";
          state.currentUserEmail = String(payload.currentUserEmail || "").toLowerCase();
          state.myPrompts = Array.isArray(payload.myPrompts) ? payload.myPrompts : [];
          state.prompts = Array.isArray(payload.prompts) ? payload.prompts : [];
          state.categories = Array.isArray(payload.categories)
            ? payload.categories
            : deriveCategories(state.prompts);

          state.categoryOptions = Array.isArray(payload.categoryOptions)
            ? payload.categoryOptions
            : deriveCategoryOptions(state.prompts);

          state.promptTypeOptions = Array.isArray(payload.promptTypeOptions)
            ? payload.promptTypeOptions
            : derivePromptTypeOptions(state.prompts);

          if (
            state.category !== "all" &&
            !state.categories.some(function (category) { return category.name === state.category; })
          ) {
            state.category = "all";
          }

          populateCategorySelect();
          populatePromptTypeSelect();
          syncAdminUI();
          sanitizeActiveFilters_();
          renderFilterControls_(state.filters);
          renderMissingSummary_();
          renderFilterSummary_();
          renderCategoryFilters();
          renderLibrary();
        })
        .withFailureHandler(function (error) {
          state.loading = false;
          console.error("[AI Prompt Library] Failed to load prompts:", error);
          setErrorState(getErrorMessage(error, "Unable to load the Prompt Library."));
        })
        .getAIPromptLibrary({
          viewMode: getEffectiveRole()
        });
    } catch (error) {
      state.loading = false;
      console.error(
        "[AI Prompt Library] Unable to start the prompt-library request:",
        error
      );
      setErrorState(
        getErrorMessage(
          error,
          "Unable to start the Prompt Library request."
        )
      );
    }
  }

  function setLoadingState() {
    if (refs.count) {
      refs.count.textContent = "Loading prompts…";
    }

    if (refs.pagination) {
      refs.pagination.hidden = true;
      refs.pagination.replaceChildren();
    }

    if (refs.status) {
      refs.status.hidden = true;
    }

    if (refs.missingSummary) {
      refs.missingSummary.hidden = true;
    }

    if (refs.categories) {
      refs.categories.replaceChildren();
    }

    if (refs.results) {
      refs.results.replaceChildren();
    }

    if (shouldShowTable_()) {
      if (!refs.results) return;

      const shell = document.createElement("div");
      shell.className =
        "ai-prompt-table-shell is-loading";

      const table = document.createElement("table");
      table.className = "ai-prompt-table";
      table.classList.toggle(
        "is-admin",
        state.adminView
      );
      table.setAttribute(
        "aria-hidden",
        "true"
      );

      const tbody = document.createElement("tbody");

      for (let i = 0; i < 6; i += 1) {
        const row = document.createElement("tr");

        for (
          let j = 0;
          j < (state.adminView ? 6 : 5);
          j += 1
        ) {
          const cell =
            document.createElement("td");
          const line =
            document.createElement("span");

          line.className =
            "ai-prompt-table-skeleton-line";

          cell.appendChild(line);
          row.appendChild(cell);
        }

        tbody.appendChild(row);
      }

      table.appendChild(tbody);
      shell.appendChild(table);
      refs.results.appendChild(shell);
      return;
    }

    if (!refs.categories) return;

    refs.categories.classList.add(
      "is-grid-view",
      "is-loading"
    );

    const heading = document.createElement("div");
    heading.className =
      "ai-prompt-category-section-heading is-loading";

    const title = document.createElement("span");
    title.className =
      "ai-prompt-category-skeleton-heading";

    const description =
      document.createElement("span");
    description.className =
      "ai-prompt-category-skeleton-copy";

    heading.append(title, description);
    refs.categories.appendChild(heading);

    for (let i = 0; i < 7; i += 1) {
      const card = document.createElement("div");
      card.className =
        "ai-prompt-category-card is-skeleton";

      const icon = document.createElement("span");
      icon.className =
        "ai-prompt-category-skeleton-icon";

      const line = document.createElement("span");
      line.className =
        "ai-prompt-category-skeleton-line";

      const meta = document.createElement("span");
      meta.className =
        "ai-prompt-category-skeleton-meta";

      card.append(icon, line, meta);
      refs.categories.appendChild(card);
    }
  }

  function setErrorState(message) {
    if (refs.count) {
      refs.count.textContent =
        "Prompt Library unavailable";
    }

    if (refs.categories) {
      refs.categories.replaceChildren();
      refs.categories.classList.remove(
        "is-grid-view",
        "is-loading"
      );
    }

    if (refs.results) {
      refs.results.replaceChildren();
    }

    if (refs.pagination) {
      refs.pagination.hidden = true;
      refs.pagination.replaceChildren();
    }

    if (!refs.status) return;

    refs.status.hidden = false;
    refs.status.className =
      "ai-prompt-library-state is-error";

    if (refs.statusTitle) {
      refs.statusTitle.textContent =
        "Prompt Library unavailable";
    }

    if (refs.statusText) {
      refs.statusText.textContent = message;
    }

    if (refs.stateAction) {
      refs.stateAction.hidden = true;
      refs.stateAction.removeAttribute(
        "data-ai-prompt-state-action"
      );
    }

    if (refs.retry) {
      refs.retry.hidden = false;
    }
  }

  function setEmptyState() {
    if (!refs.status) return;

    refs.status.hidden = false;
    refs.status.className =
      "ai-prompt-library-state is-empty";

    if (refs.retry) {
      refs.retry.hidden = true;
    }

    let title = "No prompts found";
    let message =
      "No prompts match the current view.";
    let action = "";
    let actionLabel = "";

    const rawQuery = refs.search
      ? refs.search.value.trim()
      : "";

    if (state.activeView === "my-prompts" && !state.myPrompts.length) {
      title = "You haven't posted any prompts yet";
      message = "Use Post a Prompt to share your first contribution.";
    } else if (state.query) {
      title = rawQuery
        ? 'No prompts match "' + rawQuery + '"'
        : "No prompts match your search";
      message =
        "Try another keyword or clear your search.";
      action = "search";
      actionLabel = "Clear search";
    } else if (hasActiveFilters_()) {
      title =
        "No prompts match these filters";
      message =
        "Try removing one or more filters to broaden the results.";
      action = "filters";
      actionLabel = "Clear filters";
    } else if (state.category !== "all") {
      title =
        "No prompts in " + state.category;
      message =
        "This category does not currently contain prompts visible in this view.";
      action = "category";
      actionLabel = "All categories";
    } else if (!state.prompts.length) {
      title = "No prompts available yet";
      message =
        "The Prompt Library does not have any prompts available in this view.";
    }

    if (refs.statusTitle) {
      refs.statusTitle.textContent = title;
    }

    if (refs.statusText) {
      refs.statusText.textContent = message;
    }

    if (refs.stateAction) {
      refs.stateAction.hidden = !action;

      if (action) {
        refs.stateAction.textContent =
          actionLabel;
        refs.stateAction.dataset.aiPromptStateAction =
          action;
      } else {
        refs.stateAction.removeAttribute(
          "data-ai-prompt-state-action"
        );
      }
    }
  }

  function clearStateMessage() {
    if (refs.status) refs.status.hidden = true;
  }


  function hasPromptContent_(prompt) {
    return Boolean(
      String(
        prompt && prompt.prompt
          ? prompt.prompt
          : ""
      ).trim()
    );
  }



  function renderCategoryFilters() {
    if (!refs.categories) return;
    if (state.activeView !== "explore") {
      refs.categories.replaceChildren();
      return;
    }

    refs.categories.replaceChildren();
    refs.categories.classList.remove(
      "is-loading"
    );

    // Keep the original category monogram cards on the default Explore view
    // while ALSO showing the community popularity feed below them.
    const showContext = Boolean(
      state.query || state.category !== "all" || hasActiveFilters_()
    );
    refs.categories.classList.toggle("is-grid-view", !showContext);
    refs.categories.classList.toggle("is-context-view", showContext);

    if (showContext) {
      refs.categories.appendChild(createLibraryContextBar_());
      return;
    }

    const heading = document.createElement("div");
    heading.className =
      "ai-prompt-category-section-heading";

    const title = document.createElement("h3");
    title.textContent = "Browse by Category";

    const description = document.createElement("p");
    description.textContent =
      "Select a category to view its prompts. Showing " +
      state.categories.length +
      " " +
      (
        state.categories.length === 1
          ? "category"
          : "categories"
      ) +
      " · " +
      pluralizePrompt(state.prompts.length) +
      ".";

    heading.append(title, description);
    refs.categories.appendChild(heading);

    getVisibleCategories_().forEach(
      function (category) {
        refs.categories.appendChild(
          createCategoryCard_(category)
        );
      }
    );
  }


  function getVisibleCategories_() {
    return state.categories.slice().sort(function (a, b) {
      return String(a.name || "").localeCompare(
        String(b.name || ""),
        undefined,
        { sensitivity: "base" }
      );
    });
  }



  function getCategoryMonogram_(categoryName) {
    const words = String(categoryName || "")
      .trim()
      .split(/\s+/)
      .map(function (word) {
        return word.replace(/[^A-Za-z0-9]/g, "");
      })
      .filter(Boolean);

    if (!words.length) {
      return "NA";
    }

    if (words.length >= 2) {
      return (
        words[0].charAt(0) +
        words[1].charAt(0)
      ).toUpperCase();
    }

    const compact = words[0].toUpperCase();

    if (compact.length === 1) {
      return compact;
    }

    return compact.slice(0, 2);
  }


  function getCategoryAccentClass_(categoryName) {
    const value = String(categoryName || "");
    let hash = 0;

    for (let index = 0; index < value.length; index += 1) {
      hash = (
        (hash * 31) +
        value.charCodeAt(index)
      ) >>> 0;
    }

    return "is-accent-" + (hash % 6);
  }


  function createCategoryCard_(category) {
    const card = document.createElement("article");
    card.className =
      "ai-prompt-category-card " +
      getCategoryAccentClass_(category.name);

    const button = document.createElement("button");
    button.type = "button";
    button.className =
      "ai-prompt-category-card-open";
    button.dataset.aiPromptCategory =
      category.name;
    button.setAttribute(
      "aria-label",
      "View prompts in " + category.name
    );

    const top = document.createElement("span");
    top.className = "ai-prompt-category-card-top";

    const monogram = document.createElement("span");
    monogram.className =
      "ai-prompt-category-card-monogram";
    monogram.setAttribute("aria-hidden", "true");
    monogram.textContent =
      getCategoryMonogram_(category.name);

    const name = document.createElement("strong");
    name.textContent = category.name;

    top.append(monogram, name);

    const count = document.createElement("span");
    count.className =
      "ai-prompt-category-card-count";
    count.textContent =
      pluralizePrompt(category.count);

    const footer = document.createElement("span");
    footer.className =

  function renderLibrary() {
    if (!refs.results) return;

    refs.results.replaceChildren();
    if (state.activeView === "for-you") {
      renderRecommendedPrompts_();
      return;
    }
    if (state.activeView === "moderation") {
      renderPhase2Moderation_();
      return;
    }
    if (refs.count) {
      refs.count.textContent = state.activeView === "my-prompts"
        ? pluralizePrompt(state.myPrompts.length)
        : state.activeView === "bookmarks"
          ? pluralizePrompt(state.prompts.filter(function(p){return p.bookmarkedByMe;}).length)
          : pluralizePrompt(state.prompts.length);
    }

    if (!shouldShowTable_()) {
      if (refs.pagination) {
        refs.pagination.hidden = true;
        refs.pagination.replaceChildren();
      }

      clearStateMessage();
      return;
    }

    const filtered = getVisiblePrompts();

    if (!filtered.length) {
      if (refs.pagination) {
        refs.pagination.hidden = true;
        refs.pagination.replaceChildren();
      }

      setEmptyState();
      return;
    }

    clearStateMessage();

    const totalPages = Math.max(
      1,
      Math.ceil(
        filtered.length / state.pageSize
      )
    );

    if (state.page > totalPages) {
      state.page = totalPages;
    }

    const start =
      (state.page - 1) * state.pageSize;

    const pageItems = filtered.slice(
      start,
      start + state.pageSize
    );

    if (state.activeView === "my-prompts" ||
        (!state.query && state.category === "all" && !hasActiveFilters_())) {
      const heading = document.createElement("h3");
      heading.className = "ai-prompt-community-feed-title";
      heading.textContent = state.activeView === "my-prompts"
        ? "My Contributions" : state.activeView === "bookmarks"
          ? "My Bookmarks" : "Top Community Prompts";
      refs.results.appendChild(heading);
    }
    refs.results.appendChild(createPromptTable(pageItems));

    renderPagination(
      filtered.length,
      totalPages,
      start,
      pageItems.length
    );
  }


  function getVisiblePrompts() {
    let prompts = state.activeView === "my-prompts"
      ? state.myPrompts.slice()
      : state.activeView === "bookmarks"
        ? state.prompts.filter(function(p){return p.bookmarkedByMe;})
        : state.prompts.slice();

    if (state.query) {
      prompts = prompts.filter(
        function (prompt) {
          return getSearchText(prompt).includes(
            state.query
          );
        }
      );
    } else if (state.category !== "all") {
      prompts = prompts.filter(
        function (prompt) {
          return (
            prompt.category ===
            state.category
          );
        }
      );
    }

    if (state.filters.promptTypes.length) {
      prompts = prompts.filter(
        function (prompt) {
          return state.filters.promptTypes.includes(
            prompt.promptType
          );
        }
      );
    }

    if (state.filters.content === "has") {
      prompts = prompts.filter(
        hasPromptContent_
      );
    }

    if (state.filters.content === "missing") {
      prompts = prompts.filter(
        function (prompt) {
          return !hasPromptContent_(prompt);
        }
      );
    }

    if (
      getEffectiveRole() === "admin" &&
      state.filters.statuses.length
    ) {
      prompts = prompts.filter(
        function (prompt) {
          return state.filters.statuses.includes(
            prompt.status
          );
        }
      );
    }

    prompts.sort(function (a, b) {
      const votes = function (p) { return Math.max(0, Number(p.upvoteCount) || 0); };
      const copies = function (p) { return Math.max(0, Number(p.copyCount) || 0); };
      const name = function (x, y) { return String(x.promptName || "").localeCompare(String(y.promptName || ""), undefined, {sensitivity:"base"}); };
      let result = 0;
      if (state.sortMode === "most-copied") result = copies(b)-copies(a) || votes(b)-votes(a);
      else if (state.sortMode === "newest") {
        const ta = a.createdAt ? Date.parse(a.createdAt) || 0 : 0;
        const tb = b.createdAt ? Date.parse(b.createdAt) || 0 : 0;
        result = tb-ta;
      } else if (state.sortMode === "top-upvoted") result = votes(b)-votes(a) || copies(b)-copies(a);
      return result || name(a,b) || String(a.id||"").localeCompare(String(b.id||""));
    });

    return prompts;
  }


  function enablePromptTableHorizontalGestures_(shell) {
    if (!shell || shell.dataset.horizontalGestureReady === "true") {
      return;
    }

    shell.dataset.horizontalGestureReady = "true";

    const getMaxScroll = function () {
      return Math.max(
        0,
        shell.scrollWidth - shell.clientWidth
      );
    };

    const keepInsideScrollableRange = function () {
      const maxScroll = getMaxScroll();

      if (maxScroll <= 2) {
        return;
      }

      // Browser history gestures are commonly triggered when a horizontal
      // scroller is already at its absolute left/right boundary. Keeping a
      // 1px buffer is visually imperceptible but prevents the page from
      // "taking over" the trackpad gesture at the table edge.
      if (shell.scrollLeft <= 0) {
        shell.scrollLeft = 1;
      } else if (shell.scrollLeft >= maxScroll) {
        shell.scrollLeft = maxScroll - 1;
      }
    };

    const handleHorizontalWheel = function (event) {
      const absX = Math.abs(event.deltaX);
      const absY = Math.abs(event.deltaY);

      // Only intercept gestures that are clearly horizontal.
      // Mostly vertical/diagonal trackpad gestures continue bubbling so
      // the full page scrolls normally.
      const horizontalIntent =
        event.shiftKey ||
        (
          absX >= 6 &&
          absX > absY * 1.15
        );

      if (!horizontalIntent) {
        return;
      }

      let delta = event.deltaX;

      if (event.shiftKey && absX < 0.01) {
        delta = event.deltaY;
      }

      if (Math.abs(delta) < 0.01) {
        return;
      }

      const maxScroll = getMaxScroll();

      if (maxScroll <= 0) {
        return;
      }

      // Capture the gesture before the browser can interpret it as
      // back/forward history navigation.
      event.preventDefault();
      event.stopPropagation();
      if (typeof event.stopImmediatePropagation === "function") {
        event.stopImmediatePropagation();
      }

      keepInsideScrollableRange();

      const next = Math.max(
        1,
        Math.min(
          maxScroll - 1,
          shell.scrollLeft + delta
        )
      );

      shell.scrollLeft = next;
    };

    shell.addEventListener(
      "wheel",
      handleHorizontalWheel,
      {
        passive: false,
        capture: true
      }
    );

    shell.addEventListener(
      "mouseenter",
      keepInsideScrollableRange
    );

    shell.addEventListener(
      "pointerenter",
      keepInsideScrollableRange
    );

    shell.addEventListener(
      "scroll",
      function () {
        window.requestAnimationFrame(
          keepInsideScrollableRange
        );
      },
      { passive: true }
    );

    // Apply the 1px edge buffer after layout has calculated scrollWidth.
    window.requestAnimationFrame(
      keepInsideScrollableRange
    );
  }

  function appendHighlightedText_(
    element,
    text,
    query
  ) {
    if (!element) return;

    const value = String(text || "");
    const needle = String(query || "").trim();

    if (!needle) {
      element.textContent = value;
      return;
    }

    const lower = value.toLowerCase();
    const lowerNeedle = needle.toLowerCase();
    let cursor = 0;
    let matchIndex = lower.indexOf(
      lowerNeedle,
      cursor
    );

    while (matchIndex !== -1) {
      if (matchIndex > cursor) {
        element.appendChild(
          document.createTextNode(
            value.slice(cursor, matchIndex)
          )
        );
      }

      const mark = document.createElement("mark");
      mark.className =
        "ai-prompt-search-highlight";
      mark.textContent = value.slice(
        matchIndex,
        matchIndex + needle.length
      );
      element.appendChild(mark);

      cursor = matchIndex + needle.length;
      matchIndex = lower.indexOf(
        lowerNeedle,
        cursor
      );
    }

    if (cursor < value.length) {
      element.appendChild(
        document.createTextNode(
          value.slice(cursor)
        )
      );
    }
  }

  function renderPagination(
    totalItems,
    totalPages,
    startIndex,
    pageItemCount
  ) {
    if (!refs.pagination) return;

    refs.pagination.replaceChildren();

    if (totalPages <= 1) {
      refs.pagination.hidden = true;
      return;
    }

    refs.pagination.hidden = false;

    const summary = document.createElement("p");
    summary.className = "ai-prompt-pagination-summary";

    const first = startIndex + 1;
    const last = startIndex + pageItemCount;

    summary.textContent =
      "Showing " +
      first +
      "–" +
      last +
      " of " +
      totalItems +
      " prompts";

    const controls = document.createElement("div");
    controls.className = "ai-prompt-pagination-controls";

    controls.appendChild(
      createPageButton(
        "Previous",
        state.page - 1,
        state.page === 1,
        "previous"
      )
    );

    getPaginationPages(totalPages).forEach(
      function (page) {
        if (page === "ellipsis") {
          const ellipsis = document.createElement("span");
          ellipsis.className = "ai-prompt-pagination-ellipsis";
          ellipsis.textContent = "…";
          controls.appendChild(ellipsis);
          return;
        }

        const button = createPageButton(
          String(page),
          page,
          false,
          "page"
        );

        if (page === state.page) {
          button.classList.add("is-active");
          button.setAttribute("aria-current", "page");
        }

        controls.appendChild(button);
      }
    );

  function getPaginationPages(totalPages) {
    if (totalPages <= 7) {
      return Array.from(
        { length: totalPages },
        function (_, index) {
          return index + 1;
        }
      );
    }

    const pages = [1];
    const start = Math.max(2, state.page - 1);
    const end = Math.min(
      totalPages - 1,
      state.page + 1
    );

    if (start > 2) {
      pages.push("ellipsis");
    }

    for (let page = start; page <= end; page += 1) {
      pages.push(page);
    }

    if (end < totalPages - 1) {
      pages.push("ellipsis");
    }

    pages.push(totalPages);

    return pages;
  }

    const prompt = state.prompts.find(function (item) {

      'Delete "' +

  function submitAddPrompt(event) {
    event.preventDefault();

    if (!canWriteCommunity_()) {
      setAddError("Verified employee access and community activation are required.");
      return;
    }

    if (!refs.addForm || !refs.addForm.reportValidity()) {
      return;
    }

    if (!isAppsScriptAvailable()) {
      setAddError(
        "Google Apps Script is unavailable in this environment."
      );
      return;
    }

    const form = new FormData(refs.addForm);

    const isNewCategory = Boolean(
      refs.newCategoryField &&
      !refs.newCategoryField.hidden
    );

    const category = isNewCategory
      ? String(
          refs.newCategoryInput
            ? refs.newCategoryInput.value
            : ""
        ).trim()
      : String(
          refs.categorySelect
            ? refs.categorySelect.value
            : ""
        ).trim();

    if (!category) {
      setAddError(
        isNewCategory
          ? "Please enter the new category name."
          : "Please select a category or create a new one."
      );
      return;
    }

    const isNewPromptType = Boolean(
      refs.newPromptTypeField &&
      !refs.newPromptTypeField.hidden
    );

    const promptType = isNewPromptType
      ? String(
          refs.newPromptTypeInput
            ? refs.newPromptTypeInput.value
            : ""
        ).trim()
      : String(
          refs.promptTypeSelect
            ? refs.promptTypeSelect.value
            : ""
        ).trim();

    if (!promptType) {
      setAddError(
        isNewPromptType
          ? "Please enter the new prompt type."
          : "Please select a prompt type or create a new one."
      );
      return;
    }


    const payload = {
      category: category,
      promptType: promptType,
      promptName: String(
        form.get("promptName") || ""
      ).trim(),
      useCase: String(
        form.get("useCase") || ""
      ).trim(),
      prompt: String(
        form.get("prompt") || ""
      ).trim(),
      status: String(
        form.get("status") || "Active"
      )
    };

    const isEditing = Boolean(state.editingPromptId);

    clearAddError();
    setAddSubmitting(true);

    const runner = google.script.run
      .withSuccessHandler(function (response) {
        setAddSubmitting(false);
        closeAddPromptDialog(true);

        showToast(
          response && response.message
            ? response.message
            : (
                isEditing
                  ? "Prompt updated successfully."
                  : "Prompt added successfully."
              ),
          "success"
        );

        loadLibrary();
      })
      .withFailureHandler(function (error) {
        setAddSubmitting(false);

        console.error(
          isEditing
            ? "[AI Prompt Library] Failed to update prompt:"
            : "[AI Prompt Library] Failed to add prompt:",
          error
        );

        setAddError(
          getErrorMessage(
            error,
            isEditing
              ? "Unable to update the prompt."
              : "Unable to add the prompt."
          )
        );
      });

    try {
      if (isEditing) {
        runner.updateAIPrompt(
          state.editingPromptId,
          payload
        );
      } else {
        runner.addAIPrompt(payload);
      }
    } catch (error) {
      setAddSubmitting(false);

      console.error(
        "[AI Prompt Library] Unable to start save request:",
        error
      );

      setAddError(
        getErrorMessage(
          error,
          "Unable to start the save request."
        )
      );
    }
  }

  function deriveCategoryOptions(prompts) {
    const map = new Map();

    prompts.forEach(function (prompt) {
      const name = String(
        prompt.category || ""
      ).trim();

      if (!name) return;

      const key = name.toLowerCase();

      if (!map.has(key)) {
        map.set(key, {
          name: name,
          promptCount: 1
        });
        return;
      }

      map.get(key).promptCount += 1;
    });

    return Array.from(map.values()).sort(function (a, b) {
      return String(a.name || "").localeCompare(
        String(b.name || ""),
        undefined,
        { sensitivity: "base" }
      );
    });
  }


  function derivePromptTypeOptions(prompts) {
    const map = new Map();

    prompts.forEach(function (prompt) {
      const name = String(
        prompt.promptType || ""
      ).trim();

      if (!name) return;

      const key = name.toLowerCase();

      if (!map.has(key)) {
        map.set(key, {
          name: name,
          promptCount: 1
        });
        return;
      }

      map.get(key).promptCount += 1;
    });

    return Array.from(map.values()).sort(function (a, b) {
      return String(a.name || "").localeCompare(
        String(b.name || ""),
        undefined,
        { sensitivity: "base" }
      );
    });
  }


  function deriveCategories(prompts) {
    const map = new Map();

    prompts.forEach(function (prompt) {
      const name = String(
        prompt.category || "Uncategorized"
      ).trim() || "Uncategorized";

      const key = name.toLowerCase();

      if (!map.has(key)) {
        map.set(key, {
          name: name,
          count: 1
        });
      } else {
        map.get(key).count += 1;
      }
    });

    return Array.from(map.values()).sort(function (a, b) {
      return String(a.name || "").localeCompare(
        String(b.name || ""),
        undefined,
        { sensitivity: "base" }
      );
    });
  }

  function getSearchText(prompt) {
    return [
