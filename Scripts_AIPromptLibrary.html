  function openDialog(dialog) {
    if (!dialog) return;
    if (typeof dialog.showModal === "function") {
      if (!dialog.open) dialog.showModal();
      return;
    }
    dialog.setAttribute("open", "");
  }

  function closeDialog(dialog) {
    if (!dialog) return;
    if (typeof dialog.close === "function" && dialog.open) {
      dialog.close();
      return;
    }
    dialog.removeAttribute("open");
  }

  function copyText(text) {
    if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
      return navigator.clipboard.writeText(text);
    }

    return new Promise(function (resolve, reject) {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";
      document.body.appendChild(textarea);
      textarea.select();
      try {
        const copied = document.execCommand("copy");
        textarea.remove();
        copied ? resolve() : reject(new Error("Copy failed"));
      } catch (error) {
        textarea.remove();
        reject(error);
      }
    });
  }

  let toastTimer = null;
  function showToast(message, type) {
    if (!refs.toast || !refs.toastMessage) return;
    window.clearTimeout(toastTimer);
    refs.toast.hidden = false;
    refs.toast.dataset.toastType = type === "error" ? "error" : "success";
    refs.toastMessage.textContent = message;
    toastTimer = window.setTimeout(function () {
      if (refs.toast) refs.toast.hidden = true;
    }, 3200);
  }

  function setCommunityPublication_(id, publish) {
    const prompt = findCommunityPrompt_(id);
    if (!canEditCommunityPrompt_(prompt)) return;
    if (!publish && !window.confirm("Unpublish this prompt and save it as Draft?")) return;
    google.script.run.withSuccessHandler(function (response) {
      showToast(response.message || "Prompt status updated.","success");
      loadLibrary();
    }).withFailureHandler(function (error) {
      showToast(getErrorMessage(error,"Unable to update publication."),"error");
    }).setNexusPromptPublication(id,publish);
  }

  function updateCommunityPromptMetrics_(id, updates) {
    [state.prompts, state.myPrompts].forEach(function (list) {
      list.forEach(function (prompt) {
        if (prompt.id !== id) return;
        Object.keys(updates).forEach(function (key) { prompt[key] = updates[key]; });
      });
    });
    renderLibrary();
    if (state.activePromptId === id) {
      const prompt = findCommunityPrompt_(id);
      if (prompt) updateCommunityEngagement_(prompt);
    }
  }

  function updateCommunityEngagement_(prompt) {
    if (!prompt) return;
    if (refs.detailVotes) refs.detailVotes.textContent = (Number(prompt.upvoteCount)||0) + " upvotes";
    if (refs.detailCopies) refs.detailCopies.textContent = (Number(prompt.copyCount)||0) + " copies";
    if (refs.detailCommentCount) refs.detailCommentCount.textContent = (Number(prompt.commentCount)||0) + " comments";
    if (refs.detailUpvote) {
      refs.detailUpvote.disabled = !canWriteCommunity_() || prompt.status !== "Active" || !!state.votePending[prompt.id];
      refs.detailUpvote.setAttribute("aria-pressed", prompt.upvotedByMe ? "true" : "false");
      refs.detailUpvote.textContent = prompt.upvotedByMe ? "▲ Upvoted" : "▲ Upvote";
    }
  }

  function setCommunityVote_(promptId) {
    const prompt = findCommunityPrompt_(promptId);
    if (!prompt || !canWriteCommunity_() || prompt.status !== "Active" || state.votePending[promptId]) return;
    const desired = !Boolean(prompt.upvotedByMe);
    state.votePending[promptId] = true;
    updateCommunityEngagement_(prompt);
    google.script.run.withSuccessHandler(function (response) {
      delete state.votePending[promptId];
      updateCommunityPromptMetrics_(promptId, {
        upvotedByMe: response.upvoted === true,
        upvoteCount: Math.max(0, Number(response.upvoteCount)||0)
      });
    }).withFailureHandler(function (error) {
      delete state.votePending[promptId];
      updateCommunityEngagement_(prompt);
      showToast(getErrorMessage(error, "Could not update upvote."), "error");
    }).setNexusPromptUpvote(promptId, desired);
  }

  function trackCommunityCopy_(promptId) {
    const prompt = findCommunityPrompt_(promptId);
    if (!prompt || !canWriteCommunity_() || prompt.status !== "Active") return;
    // Clipboard copy is already done; one non-retried server increment.
    google.script.run.withSuccessHandler(function (response) {
      updateCommunityPromptMetrics_(promptId, {copyCount: Math.max(0,Number(response.copyCount)||0)});
    }).withFailureHandler(function (error) {
      console.warn("[AI Prompt Library] Prompt copied, but metric was not recorded:", error);
    }).recordNexusPromptCopy(promptId);
  }

  function loadCommunityComments_() {
    if (!state.activePromptId || !refs.comments) return;
    const id = state.activePromptId;
    const page = state.commentsPage;
    refs.comments.textContent = "Loading discussion…";
    google.script.run.withSuccessHandler(function (response) {
      if (id !== state.activePromptId) return;
      const data = response || {};
      state.commentsTotal = Number(data.total)||0;
      renderCommunityComments_(Array.isArray(data.comments)?data.comments:[]);
      if (refs.commentsPage) refs.commentsPage.textContent = "Page " + state.commentsPage;
      if (refs.commentsPrev) refs.commentsPrev.disabled = state.commentsPage <= 1;
      if (refs.commentsNext) refs.commentsNext.disabled = state.commentsPage * 15 >= state.commentsTotal;
      if (refs.commentForm) refs.commentForm.hidden = data.canComment !== true;
    }).withFailureHandler(function (error) {
      if (id === state.activePromptId) refs.comments.textContent = getErrorMessage(error,"Unable to load discussion.");
    }).getNexusPromptComments(id, {page:page,pageSize:15,includeHidden: state.adminView});
  }

  function renderCommunityComments_(comments) {
    if (!refs.comments) return;
    refs.comments.replaceChildren();
    if (!comments.length) { refs.comments.textContent = "No comments yet. Share a suggestion to help others."; return; }
    comments.forEach(function (comment) {
      const article = document.createElement("article");
      article.className = "ai-prompt-community-comment";
      const meta = document.createElement("div"); meta.className = "ai-prompt-community-comment-meta";
      const author = document.createElement("strong"); author.textContent = comment.authorName || "Nexus Contributor";
      const date = document.createElement("small");
      date.textContent = comment.createdAt ? new Date(comment.createdAt).toLocaleDateString() : "";
      meta.append(author,date);
      const body = document.createElement("p"); body.textContent = comment.comment || "";
      if (comment.status === "Hidden") {
        const marker = document.createElement("small");
        marker.textContent = "Hidden by a Nexus administrator";
        marker.className = "ai-prompt-community-comment-hidden";
        meta.appendChild(marker);
      }
      article.append(meta,body);
      if (comment.canEdit || (state.phase2Installed && canWriteCommunity_() && comment.status === "Visible")) {
        const buttons = document.createElement("div"); buttons.className = "ai-prompt-community-comment-actions";
        const actions = comment.canEdit
          ? (state.adminView && getEffectiveRole() === "admin"
            ? (comment.status === "Hidden" ? ["restore","remove"] : ["edit","remove","hide"])
            : ["edit","remove"])
          : [];
        if (state.phase2Installed && canWriteCommunity_() && comment.status === "Visible") actions.push("report");
        actions.forEach(function (action) {
          const button = document.createElement("button");
          button.type = "button";
          button.dataset.communityCommentAction = action;
          button.dataset.communityCommentId = comment.id;
          button.dataset.communityCommentBody = comment.comment;
          button.textContent = action === "edit" ? "Edit" : action === "hide" ? "Hide" : action === "restore" ? "Restore" : action === "report" ? "Report" : "Remove";
          buttons.appendChild(button);
        });
        article.appendChild(buttons);
      }
      refs.comments.appendChild(article);
    });
  }

  function submitCommunityComment_(event) {
    event.preventDefault();
    if (!canWriteCommunity_() || !state.activePromptId || state.commentSubmitting) return;
    const body = String(refs.commentBody && refs.commentBody.value || "").trim();
    if (!body) return;
    state.commentSubmitting = true;
    const id = state.activePromptId;
    google.script.run.withSuccessHandler(function (response) {
      state.commentSubmitting = false;
      if (refs.commentBody) refs.commentBody.value = "";
      updateCommunityPromptMetrics_(id, {commentCount:Number(response.commentCount)||0});
      state.commentsPage = 1;
      loadCommunityComments_();
    }).withFailureHandler(function (error) {
      state.commentSubmitting = false;
      showToast(getErrorMessage(error,"Unable to submit comment."),"error");
    }).createNexusPromptComment(id,body);
  }

  function handleCommunityCommentAction_(event) {
    const button = event.target.closest("[data-community-comment-action]");
    if (!button || !canWriteCommunity_()) return;
    const id = button.dataset.communityCommentId || "";
    const action = button.dataset.communityCommentAction;
    if (action === "report") {
      openPhase2Report_("comment", id);
      return;
    }
    if (action === "edit") {
      const previous = button.dataset.communityCommentBody || "";
      const body = window.prompt("Edit your comment:", previous);
      if (body === null || !body.trim() || body === previous) return;
      google.script.run.withSuccessHandler(loadCommunityComments_)
        .withFailureHandler(function (error) {showToast(getErrorMessage(error,"Unable to edit comment."),"error");})
        .updateNexusPromptComment(id,body);
    } else if ((action === "hide" || action === "restore") && state.adminView) {
      google.script.run.withSuccessHandler(function (response) {
        updateCommunityPromptMetrics_(state.activePromptId,{commentCount:Number(response.commentCount)||0});
        loadCommunityComments_();
      }).withFailureHandler(function (error) {showToast(getErrorMessage(error,"Unable to moderate comment."),"error");})
        .moderateNexusPromptComment(id,action === "hide");
    } else if (action === "remove" && window.confirm("Remove this comment?")) {
      google.script.run.withSuccessHandler(function (response) {
        updateCommunityPromptMetrics_(state.activePromptId,{commentCount:Number(response.commentCount)||0});
        loadCommunityComments_();
      }).withFailureHandler(function (error) {showToast(getErrorMessage(error,"Unable to remove comment."),"error");})
        .deleteNexusPromptComment(id);
    }
  }

  // ------------------ PHASE 2 QUALITY & GOVERNANCE ------------------
  function isPhase2Admin_() {
    return state.adminView && getEffectiveRole() === "admin";
  }

  function canPhase2Change_() {
    return canWriteCommunity_() && state.phase2Installed;
  }

  function updatePhase2Details_(prompt) {
    if (!refs.phase2Actions) return;
    const enabled = state.phase2Installed;
    refs.phase2Actions.hidden = !enabled;
    const published = prompt.status === "Active";
    const writable = canPhase2Change_();
    const mine = !!prompt.createdByEmail && prompt.createdByEmail === state.currentUserEmail;
    if (refs.phase2Badge) refs.phase2Badge.hidden = !prompt.verified;
    if (refs.phase2Bookmark) {
      refs.phase2Bookmark.hidden = !state.identityVerified || !published;
      refs.phase2Bookmark.disabled = !writable;
      refs.phase2Bookmark.textContent = prompt.bookmarkedByMe ? "★ Saved" : "☆ Save";
      refs.phase2Bookmark.setAttribute("aria-pressed", prompt.bookmarkedByMe ? "true" : "false");
    }
    if (refs.phase2Fork) {
      refs.phase2Fork.hidden = !published || !state.identityVerified;
      refs.phase2Fork.disabled = !writable || state.phase2Busy;
    }
    if (refs.phase2Report) {
      refs.phase2Report.hidden = !published || !state.identityVerified;
      refs.phase2Report.disabled = !writable || state.phase2Busy;
    }
    if (refs.phase2History) {
      refs.phase2History.hidden = !state.identityVerified || !(mine || isPhase2Admin_());
    }
    if (refs.phase2Verify) {
      refs.phase2Verify.hidden = !isPhase2Admin_();
      refs.phase2Verify.disabled = !writable || state.phase2Busy || (!prompt.verified && !published);
      refs.phase2Verify.textContent = prompt.verified ? "Remove Verification" : "Verify Prompt";
    }
    if (refs.phase2Origin) {
      refs.phase2Origin.hidden = !prompt.forkedFrom;
      refs.phase2Origin.textContent = prompt.forkedFrom
        ? "Adapted from prompt " + prompt.forkedFrom + " · Credit to the original contributor"
        : "";
    }
  }

  function updatePhase2LocalPrompt_(promptId, updates) {
    [state.prompts, state.myPrompts].forEach(function (list) {
      list.forEach(function (p) {
        if (p.id !== promptId) return;
        Object.keys(updates).forEach(function (k) {p[k] = updates[k];});
      });
    });
    renderLibrary();
    const active = findCommunityPrompt_(state.activePromptId);
    if (active) updatePhase2Details_(active);
  }

  function togglePhase2Bookmark_(promptId) {
    const prompt = findCommunityPrompt_(promptId);
    if (!prompt || !canPhase2Change_() || state.phase2Busy) return;
    const desired = !prompt.bookmarkedByMe;
    state.phase2Busy = true;
    google.script.run.withSuccessHandler(function (result) {
      state.phase2Busy = false;
      updatePhase2LocalPrompt_(promptId, {bookmarkedByMe: result.bookmarked === true});
      showToast(result.bookmarked ? "Saved to bookmarks." : "Removed from bookmarks.", "success");
    }).withFailureHandler(function (error) {
      state.phase2Busy = false;
      showToast(getErrorMessage(error, "Unable to update bookmark."), "error");
    }).setNexusPromptBookmark(promptId, desired);
  }

  function forkPhase2Prompt_() {
    const id = state.activePromptId;
    if (!id || !canPhase2Change_() || state.phase2Busy) return;
    if (!window.confirm("Create your own editable Draft from this prompt, while crediting its original author?")) return;
    state.phase2Busy = true;
    google.script.run.withSuccessHandler(function (result) {
      state.phase2Busy = false;
      closeDetailDialog();
      setCommunityView_("my-prompts");
      showToast(result.message || "Fork saved as a Draft.", "success");
      loadLibrary();
    }).withFailureHandler(function (error) {
      state.phase2Busy = false;
      showToast(getErrorMessage(error, "Unable to fork prompt."), "error");
    }).forkNexusPrompt(id);
  }

  function verifyPhase2Prompt_() {
    const prompt = findCommunityPrompt_(state.activePromptId);
    if (!prompt || !isPhase2Admin_() || !canPhase2Change_() || state.phase2Busy) return;
    const verify = prompt.verified !== true;
    state.phase2Busy = true;
    google.script.run.withSuccessHandler(function (result) {
      state.phase2Busy = false;
      updatePhase2LocalPrompt_(prompt.id, {verified:result.verified === true});
      showToast(result.verified ? "Prompt verified." : "Verification removed.", "success");
    }).withFailureHandler(function (error) {
      state.phase2Busy = false;
      showToast(getErrorMessage(error, "Unable to change verification."), "error");
    }).setNexusPromptVerified(prompt.id, verify);
  }

  function openPhase2Report_(type, id) {
    if (!canPhase2Change_() || !id || state.phase2Busy) return;
    state.reportTarget = {type:type,id:id};
    if (refs.phase2ReportForm) refs.phase2ReportForm.reset();
    openDialog(refs.phase2ReportDialog);
  }
  function submitPhase2Report_(event) {
    event.preventDefault();
    if (!canPhase2Change_() || !state.reportTarget || state.phase2Busy) return;
    const reason=refs.phase2Reason ? refs.phase2Reason.value : "";
    const details=refs.phase2ReportDetails ? refs.phase2ReportDetails.value.trim() : "";
    if (!reason) return;
    const target=state.reportTarget;
    const submit=state.root.querySelector("#ai-prompt-phase2-report-submit");
    if (submit) submit.disabled=true;
    state.phase2Busy=true;
    google.script.run.withSuccessHandler(function (result) {
      state.phase2Busy=false;
      if (submit) submit.disabled=false;
      closeDialog(refs.phase2ReportDialog);
      state.reportTarget=null;
      showToast(result.message || "Report received.","success");
    }).withFailureHandler(function (error) {
      state.phase2Busy=false;
      if (submit) submit.disabled=false;
      showToast(getErrorMessage(error,"Unable to submit report."),"error");
    }).reportNexusPromptContent(target.type,target.id,reason,details);
  }

  function openPhase2Versions_() {
    const id=state.activePromptId, prompt=findCommunityPrompt_(id);
    const mine=prompt && prompt.createdByEmail && prompt.createdByEmail===state.currentUserEmail;
    if(!id || !state.phase2Installed || !(mine || isPhase2Admin_()))return;
    if(refs.phase2Versions)refs.phase2Versions.textContent="Loading versions…";
    openDialog(refs.phase2VersionsDialog);
    google.script.run.withSuccessHandler(function (result) {
      if(id!==state.activePromptId && state.activePromptId!=='')return;
      renderPhase2Versions_(id,result);
    }).withFailureHandler(function (error) {
      if(refs.phase2Versions)refs.phase2Versions.textContent=getErrorMessage(error,"Unable to load history.");
    }).getNexusPromptVersionHistory(id);
  }

  function renderPhase2Versions_(promptId,result) {
    if(!refs.phase2Versions)return;
    refs.phase2Versions.replaceChildren();
    const versions=Array.isArray(result&&result.versions)?result.versions:[];
    if(!versions.length){refs.phase2Versions.textContent="No stored versions yet. An administrator can run backfillNexusPromptPhase2Versions().";return;}
    versions.forEach(function (revision) {
      const section=document.createElement("section");
      section.className="ai-prompt-phase2-revision";
      const head=document.createElement("div");head.className="ai-prompt-phase2-revision-head";
      const title=document.createElement("strong");title.textContent="Version "+revision.revision+" · "+revision.event;
      const date=document.createElement("small");
      date.textContent=revision.editedAt ? new Date(revision.editedAt).toLocaleString() : "";
      head.append(title,date);
      const promptText=document.createElement("pre");
      promptText.textContent=revision.prompt||"(empty prompt)";
      const meta=document.createElement("p");meta.textContent=revision.promptName+" · "+revision.category+" · "+revision.status;
      section.append(head,meta,promptText);
      if(result.canRestore===true && canPhase2Change_() && revision.revision!==result.currentRevision){
        const button=document.createElement("button");button.type="button";
        button.textContent="Restore as Draft";
        button.addEventListener("click",function () {
          if (!window.confirm("Restore version "+revision.revision+" as a new Draft? Existing author and counters will be kept."))return;
          button.disabled=true;
          google.script.run.withSuccessHandler(function (response) {
            closeDialog(refs.phase2VersionsDialog);
            closeDetailDialog();
            setCommunityView_("my-prompts");
            loadLibrary();
            showToast(response.message||"Restored as Draft.","success");
          }).withFailureHandler(function (error) {
            button.disabled=false;
            showToast(getErrorMessage(error,"Unable to restore revision."),"error");
          }).restoreNexusPromptVersion(promptId,revision.revision);
        });
        section.appendChild(button);
      }
      refs.phase2Versions.appendChild(section);
    });
  }

  function loadPhase2Reports_() {
    if(!state.phase2Installed || !isPhase2Admin_() || state.activeView!=="moderation")return;
    google.script.run.withSuccessHandler(function (response) {
      if(state.activeView!=="moderation" || !isPhase2Admin_())return;
      state.reportsError="";
      state.reports=Array.isArray(response.items)?response.items:[];
      state.reportsTotal=Number(response.total)||0;
      renderPhase2Moderation_();
    }).withFailureHandler(function (error) {
      state.reportsError=getErrorMessage(error,"Unable to load reports.");
      renderPhase2Moderation_();
    }).getNexusPromptReports({status:state.reportsStatus,page:state.reportsPage});
  }

  function renderPhase2Moderation_() {
    if(!refs.results || state.activeView!=="moderation")return;
    refs.results.replaceChildren();
    if(refs.pagination)refs.pagination.hidden=true;
    if(refs.count)refs.count.textContent=(Number(state.reportsTotal)||0)+" reports";
    if(!isPhase2Admin_()){
      refs.results.textContent="Administrator view is required.";return;
    }
    const bar=document.createElement("div");bar.className="ai-prompt-phase2-report-bar";
    const title=document.createElement("h3");title.textContent="Moderation Queue";
    const filter=document.createElement("select");filter.setAttribute("aria-label","Report status");
    ["Open","Resolved","Dismissed","All"].forEach(function(value){const option=document.createElement("option");option.value=value;option.textContent=value;filter.appendChild(option);});
    filter.value=state.reportsStatus;
    filter.addEventListener("change",function(){state.reportsStatus=filter.value;state.reportsPage=1;loadPhase2Reports_();});
    const refresh=document.createElement("button");refresh.type="button";refresh.textContent="Refresh";refresh.addEventListener("click",loadPhase2Reports_);
    bar.append(title,filter,refresh);refs.results.appendChild(bar);
    if(state.reportsError){const err=document.createElement("p");err.textContent=state.reportsError;refs.results.appendChild(err);return;}
    if(!state.reports.length){const empty=document.createElement("p");empty.textContent="No reports in this view.";refs.results.appendChild(empty);}
    state.reports.forEach(function(report){
      const article=document.createElement("article");article.className="ai-prompt-phase2-report";
      const heading=document.createElement("strong");heading.textContent=report.reason+" · "+report.targetType+" · "+report.targetId;
      const meta=document.createElement("small");meta.textContent=report.reporterEmail+" · "+(report.reportedAt ? new Date(report.reportedAt).toLocaleString():"")+" · "+report.status;
      const body=document.createElement("p");body.textContent=report.details||"No additional details.";
      article.append(heading,meta,body);
      if(report.status==="Open"){
        const buttons=document.createElement("div");buttons.className="ai-prompt-phase2-report-buttons";
        [["Hide","Hide content"],["Resolve","Resolve without hiding"],["Dismiss","Dismiss"]].forEach(function(entry){
          const button=document.createElement("button");button.type="button";button.textContent=entry[1];
          button.addEventListener("click",function(){
            const decision=entry[0];
            if(!window.confirm("Apply action: "+entry[1]+"?"))return;
            const note=window.prompt("Moderator notes (optional, max 500 characters):","");
            if(note===null)return;
            button.disabled=true;
            google.script.run.withSuccessHandler(function(response){showToast(response.message||"Report reviewed.","success");loadPhase2Reports_();loadLibrary();})
              .withFailureHandler(function(error){button.disabled=false;showToast(getErrorMessage(error,"Moderation failed."),"error");})
              .resolveNexusPromptReport(report.id,decision,note);
          });
          buttons.appendChild(button);
        });
        article.appendChild(buttons);
      }
      refs.results.appendChild(article);
    });
    const pager=document.createElement("nav");pager.className="ai-prompt-phase2-reports-pager";
    const prev=document.createElement("button");prev.type="button";prev.textContent="Previous";prev.disabled=state.reportsPage<=1;
    prev.addEventListener("click",function(){state.reportsPage-=1;loadPhase2Reports_();});
    const label=document.createElement("span");label.textContent="Page "+state.reportsPage;
    const next=document.createElement("button");next.type="button";next.textContent="Next";
    next.disabled=state.reportsPage*20>=(state.reportsTotal||0);
    next.addEventListener("click",function(){state.reportsPage+=1;loadPhase2Reports_();});
    pager.append(prev,label,next);refs.results.appendChild(pager);
  }

  // -------- Personalized discovery — no dashboard, snapshots or timers --------
  function loadRecommendedPrompts_() {
    if (state.recommendationsLoading || state.activeView !== "for-you") return;
    state.recommendationsLoading = true;
    state.recommendationsError = "";
    const requestId = ++state.recommendationsRequestId;
    renderRecommendedPrompts_();
    if (!isAppsScriptAvailable()) {
      state.recommendationsLoading = false;
      state.recommendationsError = "Google Apps Script is unavailable.";
      renderRecommendedPrompts_();
      return;
    }
    google.script.run.withSuccessHandler(function (response) {
      if (requestId !== state.recommendationsRequestId) return;
      state.recommendationsLoading = false;
      if (response && response.ok) {
        state.recommendationsData = response;
        state.recommendationsError = "";
      } else {
        state.recommendationsError = (response && response.message) || "Recommendations could not be loaded.";
      }
      if (state.activeView === "for-you") renderRecommendedPrompts_();
    }).withFailureHandler(function (error) {
      if (requestId !== state.recommendationsRequestId) return;
      state.recommendationsLoading = false;
      state.recommendationsError = getErrorMessage(error, "Could not load recommendations.");
      if (state.activeView === "for-you") renderRecommendedPrompts_();
    }).getNexusPromptRecommendations();
  }

  function renderRecommendedPrompts_() {
    if (!refs.results || state.activeView !== "for-you") return;
    refs.results.replaceChildren();
    if (refs.status) refs.status.hidden = true;
    if (refs.pagination) refs.pagination.hidden = true;
    if (refs.count) refs.count.textContent = "Suggestions for you";

    const panel = document.createElement("section");
    panel.className = "ai-prompt-recommendations";
    refs.results.appendChild(panel);
    const heading = document.createElement("div");
    heading.className = "ai-prompt-recommendations-header";
    const title = document.createElement("h3");
    title.textContent = "Recommended for You";
    heading.appendChild(title);
    const refresh = document.createElement("button");
    refresh.type = "button";
    refresh.className = "ai-prompt-recommendations-refresh";
    refresh.textContent = "↻ Refresh";
    refresh.addEventListener("click", function () {
      state.recommendationsData = null;
      state.recommendationsError = "";
      loadRecommendedPrompts_();
    });
    heading.appendChild(refresh);
    panel.appendChild(heading);

    if (state.recommendationsLoading) {
      panel.appendChild(document.createTextNode("Finding relevant published prompts…"));
      return;
    }
    if (state.recommendationsError) {
      const error = document.createElement("p");
      error.className = "ai-prompt-recommendations-note";
      error.textContent = state.recommendationsError;
      panel.appendChild(error);
      return;
    }
    const data = state.recommendationsData;
    if (!data) {
      panel.appendChild(document.createTextNode("Preparing suggestions…"));
      return;
    }
    const description = document.createElement("p");
    description.className = "ai-prompt-recommendations-note";
    description.textContent = data.personalized
      ? "Suggestions based on categories and prompt types you've engaged with."
      : "Discover popular and verified prompts from the community.";
    panel.appendChild(description);

    const list = document.createElement("div");
    list.className = "ai-prompt-recommendations-grid";
    const items = Array.isArray(data.recommendations) ? data.recommendations : [];
    items.forEach(function (item) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "ai-prompt-recommendation-card";
      button.dataset.aiPromptOpen = "true";
      button.dataset.aiPromptId = String(item.id || "");
      const label = document.createElement("strong");
      label.textContent = String(item.promptName || "Untitled Prompt");
      const category = document.createElement("span");
      category.className = "ai-prompt-recommendation-muted";
      category.textContent = (item.category || "Uncategorized") + (item.verified ? " · ✓ Verified" : "");
      const reason = document.createElement("span");
      reason.className = "ai-prompt-recommendation-reason";
      reason.textContent = String(item.reason || "Community recommendation");
      button.append(label, category, reason);
      list.appendChild(button);
    });
    if (!items.length) {
      const empty = document.createElement("p");
      empty.textContent = "No new published prompts to recommend yet.";
      list.appendChild(empty);
    }
    panel.appendChild(list);
    const footnote = document.createElement("p");
    footnote.className = "ai-prompt-recommendations-note";
    footnote.textContent = "Suggestions use existing bookmarks, upvotes, categories and prompt popularity. No daily snapshots, analytics dashboard or Gemini calls.";
    panel.appendChild(footnote);
  }

  function getErrorMessage(error, fallback) {
    if (!error) return fallback;
    if (typeof error === "string") return error;
    return String(error.message || error.details || fallback);
  }

  document.addEventListener("nexus:viewmodechange", function () {
    syncAdminUI();

    if (refs.detailDialog && refs.detailDialog.open) {
      closeDetailDialog();
    }

    if (refs.addDialog && refs.addDialog.open &&
        state.editingPromptId &&
        !canEditCommunityPrompt_(findCommunityPrompt_(state.editingPromptId))) {
      closeAddPromptDialog(true);
    }
    loadLibrary();
  });

  window.NexusAIPromptLibrary = {
    initialize: initialize,
    refresh: loadLibrary,
    syncAdminUI: syncAdminUI,
    // Read-only local identity diagnostic for cross-account deployment testing.
    getCommunityStatus: function () {
      return {
        identityVerified: state.identityVerified,
        currentUserEmail: state.currentUserEmail,
        communityWritesEnabled: state.communityWritesEnabled,
        activeView: state.activeView
      };
    }
  };
})();
</script>
