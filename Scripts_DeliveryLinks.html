<script>
(function () {
  "use strict";

  /*
   * ONESCA — H5 Delivery managed-link configuration
   *
   * External/resource actions are mapped to stable dl-* keys in the
   * existing 06_Assets registry.
   *
   * Internal UI actions are intentionally excluded:
   * - explore-methodologies
   * - explore-case-studies
   * - ask-nosca
   */

  const DELIVERY_LINKS =
    Object.freeze({
      // ---------------------------------------------------------
      // METHODOLOGIES
      // ---------------------------------------------------------
      "delivery-methodologies":
        "dl-methodologies",

      "implementation-frameworks":
        "dl-implementation-frameworks",

      "project-program-management":
        "dl-project-program-management",

      "agile-hybrid-delivery":
        "dl-agile-hybrid-delivery",

      "architecture-engineering-practices":
        "dl-architecture-engineering-practices",

      "quality-delivery-assurance":
        "dl-quality-delivery-assurance",

      "handover-transition":
        "dl-handover-transition",

      "delivery-checklists-playbooks":
        "dl-checklists-playbooks",

      // ---------------------------------------------------------
      // CASE STUDIES / DELIVERY KNOWLEDGE
      // ---------------------------------------------------------
      "client-case-studies":
        "dl-client-case-studies",

      "solution-case-studies":
        "dl-solution-case-studies",

      "industry-case-studies":
        "dl-industry-case-studies",

      "delivery-success-stories":
        "dl-success-stories",

      "lessons-learned":
        "dl-lessons-learned",

      "reusable-delivery-patterns":
        "dl-reusable-patterns",

      // ---------------------------------------------------------
      // QUICK ACCESS
      // ---------------------------------------------------------
      "delivery-templates":
        "dl-templates",

      "tools-checklists":
        "dl-tools-checklists",

      "standards-guidelines":
        "dl-standards-guidelines",

      "training-enablement":
        "dl-training-enablement",

      "delivery-community":
        "dl-community"
    });

  const DELIVERY_CONFIG =
    Object.freeze({
      namespace: "delivery",
      pageLabel: "Delivery",
      actionAttribute:
        "data-delivery-action",
      links: DELIVERY_LINKS
    });

  function initialize(pageRoot) {
    if (
      !pageRoot ||
      !window.NexusManagedLinks
    ) {
      return;
    }

    window.NexusManagedLinks
      .initialize(
        pageRoot,
        DELIVERY_CONFIG
      );
  }

  function refresh(pageRoot) {
    if (
      !pageRoot ||
      !window.NexusManagedLinks
    ) {
      return;
    }

    window.NexusManagedLinks
      .refresh(pageRoot);
  }

  function getConfiguredLinkKeys() {
    return Object.keys(
      DELIVERY_LINKS
    ).map(function (action) {
      return DELIVERY_LINKS[action];
    });
  }

  window.NexusDeliveryLinks =
    Object.freeze({
      initialize: initialize,
      refresh: refresh,
      getConfiguredLinkKeys:
        getConfiguredLinkKeys
    });
}());
</script>
