<script>
(function () {
  "use strict";

  /*
   * ONESCA — H5 Delivery managed-link configuration
   *
   * External/resource actions are mapped to the existing del-* Asset IDs in the
   * existing 06_Assets registry.
   *
   * Internal UI actions are intentionally excluded:
   * - explore-methodologies
   * - explore-case-studies
   * - ask-nosca
   */

  const DELIVERY_LINKS =
    Object.freeze({
      // ---------------------------------------------------------
      // METHODOLOGIES
      // ---------------------------------------------------------
      "delivery-methodologies":
        "del-dm",

      "implementation-frameworks":
        "del-if",

      "project-program-management":
        "del-ppm",

      "agile-hybrid-delivery":
        "del-ahd",

      "architecture-engineering-practices":
        "del-aep",

      "quality-delivery-assurance":
        "del-qda",

      "handover-transition":
        "del-ht",

      "delivery-checklists-playbooks":
        "del-dcp",

      // ---------------------------------------------------------
      // CASE STUDIES / DELIVERY KNOWLEDGE
      // ---------------------------------------------------------
      "client-case-studies":
        "del-ccs",

      "solution-case-studies":
        "del-scs",

      "industry-case-studies":
        "del-ics",

      "delivery-success-stories":
        "del-dss",

      "lessons-learned":
        "del-ll",

      "reusable-delivery-patterns":
        "del-rdp",

      // ---------------------------------------------------------
      // QUICK ACCESS
      // ---------------------------------------------------------
      "delivery-templates":
        "del-dt",

      "tools-checklists":
        "del-tc",

      "standards-guidelines":
        "del-sg",

      "training-enablement":
        "del-te",

      "delivery-community":
        "del-dc"
    });

  const DELIVERY_CONFIG =
    Object.freeze({
      namespace: "delivery",
      pageLabel: "Delivery",
      actionAttribute:
        "data-delivery-action",
      links: DELIVERY_LINKS
    });

  function initialize(pageRoot) {
    if (
      !pageRoot ||
      !window.NexusManagedLinks
    ) {
      return;
    }

    window.NexusManagedLinks
      .initialize(
        pageRoot,
        DELIVERY_CONFIG
      );
  }

  function refresh(pageRoot) {
    if (
      !pageRoot ||
      !window.NexusManagedLinks
    ) {
      return;
    }

    window.NexusManagedLinks
      .refresh(pageRoot);
  }

  function getConfiguredLinkKeys() {
    return Object.keys(
      DELIVERY_LINKS
    ).map(function (action) {
      return DELIVERY_LINKS[action];
    });
  }

  window.NexusDeliveryLinks =
    Object.freeze({
      initialize: initialize,
      refresh: refresh,
      getConfiguredLinkKeys:
        getConfiguredLinkKeys
    });
}());
</script>
