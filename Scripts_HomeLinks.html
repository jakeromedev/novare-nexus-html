<script>
(function () {
  "use strict";

  /*
   * ONESCA — Home managed-link configuration
   *
   * Only Home controls whose destination is expected to be a
   * centrally managed resource are included here.
   *
   * Internal SPA routes and UI controls remain owned by Scripts.html.
   */

  const HOME_LINKS =
    Object.freeze({
      // Quick Access
      "deal-tools":
        "hm-dt",

      "training":
        "hm-te",

      // Explore by Role
      "role-execom":
        "hm-r-exe",

      "role-sales-executives":
        "hm-r-se",

      "role-product-managers":
        "hm-r-pm",

      "role-solutions-consultants":
        "hm-r-sc",

      "role-delivery-risk-finance":
        "hm-r-drf",

      // Featured
      "featured-go-to-market":
        "hm-f-nngmg-v",

      "featured-solution-blueprint":
        "hm-f-sbt-v",

      "featured-customer-engagement":
        "hm-f-cel-v",

      "featured-deal-calculator":
        "hm-f-dc-v",

      // What's New
      "whats-new-governance-guidelines":
        "hm-wn-ugg",

      "whats-new-sow-template-fy27":
        "hm-wn-nsowt-fy27",

      "whats-new-deal-calculator-v2":
        "hm-wn-dc-v2",

      "whats-new-go-to-market-guide":
        "hm-wn-nngmg",

      // Need Help
      "help-submit-request":
        "hm-sar",

      "help-user-guide":
        "hm-nug"
    });

  const HOME_CONFIG =
    Object.freeze({
      namespace: "home",
      pageLabel: "Home",
      actionAttribute:
        "data-home-action",
      links: HOME_LINKS
    });

  function initialize(pageRoot) {
    if (
      !pageRoot ||
      !window.NexusManagedLinks
    ) {
      return;
    }

    window.NexusManagedLinks
      .initialize(
        pageRoot,
        HOME_CONFIG
      );
  }

  function refresh(pageRoot) {
    if (
      !pageRoot ||
      !window.NexusManagedLinks
    ) {
      return;
    }

    window.NexusManagedLinks
      .refresh(pageRoot);
  }

  function getConfiguredLinkKeys() {
    return Object.keys(
      HOME_LINKS
    ).map(function (action) {
      return HOME_LINKS[action];
    });
  }

  window.NexusHomeLinks =
    Object.freeze({
      initialize: initialize,
      refresh: refresh,
      getConfiguredLinkKeys:
        getConfiguredLinkKeys
    });
}());
</script>
