<script>
(function () {
  "use strict";

  /*
   * ONESCA — shared managed-link runtime
   *
   * Page modules provide:
   * - a page namespace
   * - the page action attribute
   * - an action -> managed-link-key map
   *
   * This module owns:
   * - getManagedLinks() calls
   * - URL validation
   * - ready / missing states
   * - in-place skeleton loading for managed resource controls
   * - Coming Soon fallback
   * - normal new-tab opening
   */

  const instances = new WeakMap();
  const NEXUS_ADMIN_DEBUG = true;

  function adminDebugLog(message, details) {
    if (!NEXUS_ADMIN_DEBUG) return;
    if (arguments.length > 1) {
      console.log("[NEXUS ADMIN DEBUG] " + message, details);
    } else {
      console.log("[NEXUS ADMIN DEBUG] " + message);
    }
  }

  function getAdminDebugSnapshot() {
    const app = document.getElementById("nexus-app");
    const profile = document.querySelector("[data-user-profile]");
    const badge = document.getElementById("user-email");
    return {
      appFound: Boolean(app),
      appRole: app ? String(app.dataset.currentUserRole || "") : "",
      appViewRole: app ? String(app.dataset.currentUserViewRole || "") : "",
      profileFound: Boolean(profile),
      profileRole: profile ? String(profile.dataset.userRole || "") : "",
      profileViewRole: profile ? String(profile.dataset.userViewRole || "") : "",
      profileHasAdminClass: Boolean(profile && profile.classList.contains("is-admin")),
      badgeText: badge ? String(badge.textContent || "").trim() : "",
      managedLinksLoaded: true,
      url: window.location.href
    };
  }

  adminDebugLog("Scripts_ManagedLinks loaded.", getAdminDebugSnapshot());

  function normalizeLinkDefinition(value) {
    if (typeof value === "string") {
      return {
        key: value.trim(),
        type: "external"
      };
    }

    if (!value || typeof value !== "object") {
      return null;
    }

    return {
      key: String(value.key || "").trim(),
      type: String(value.type || "external").trim() || "external"
    };
  }

  function normalizeConfig(config) {
    const source =
      config && typeof config === "object"
        ? config
        : {};

    const rawLinks =
      source.links &&
      typeof source.links === "object"
        ? source.links
        : {};

    const links = Object.create(null);

    Object.keys(rawLinks).forEach(function (action) {
      const definition =
        normalizeLinkDefinition(
          rawLinks[action]
        );

      if (
        definition &&
        definition.key
      ) {
        links[
          String(action || "").trim()
        ] = definition;
      }
    });

    return {
      namespace:
        String(
          source.namespace || "page"
        ).trim() || "page",

      pageLabel:
        String(
          source.pageLabel || "ONESCA"
        ).trim() || "ONESCA",

      actionAttribute:
        String(
          source.actionAttribute ||
          "data-managed-action"
        ).trim(),

      links: links
    };
  }

  function getInstance(pageRoot) {
    return instances.get(pageRoot) || null;
  }

  function getAction(
    element,
    config
  ) {
    if (!element || !config) {
      return "";
    }

    return String(
      element.getAttribute(
        config.actionAttribute
      ) || ""
    ).trim();
  }

  function getDefinition(
    element,
    config
  ) {
    const action =
      getAction(
        element,
        config
      );

    return (
      config.links[action] ||
      null
    );
  }

  function applyLinkKeys(
    pageRoot,
    config
  ) {
    if (
      !pageRoot ||
      !config ||
      !config.actionAttribute
    ) {
      return;
    }

    const selector =
      "[" +
      config.actionAttribute +
      "]";

    pageRoot
      .querySelectorAll(selector)
      .forEach(function (element) {
        const definition =
          getDefinition(
            element,
            config
          );

        if (!definition) {
          return;
        }

        element.dataset.linkKey =
          definition.key;

        element.dataset.managedLinkType =
          definition.type;
      });
  }

  function getConfiguredKeys(config) {
    const seen =
      Object.create(null);

    return Object.keys(
      config.links
    )
      .map(function (action) {
        return config.links[action].key;
      })
      .filter(function (key) {
        if (!key || seen[key]) {
          return false;
        }

        seen[key] = true;
        return true;
      });
  }

  function normalizeServerResponse(
    response
  ) {
    const source =
      response &&
      typeof response === "object"
        ? response
        : {};

    const sourceLinks =
      source.links &&
      typeof source.links === "object"
        ? source.links
        : {};

    const links =
      Object.create(null);

    Object.keys(
      sourceLinks
    ).forEach(function (key) {
      const url =
        String(
          sourceLinks[key] || ""
        ).trim();

      if (
        /^https?:\/\/\S+$/i.test(url)
      ) {
        links[key] = url;
      }
    });

    const sourceMeta =
      source.meta &&
      typeof source.meta === "object"
        ? source.meta
        : {};

    return {
      links: links,

      missing:
        Array.isArray(source.missing)
          ? source.missing.slice()
          : [],

      duplicates:
        Array.isArray(source.duplicates)
          ? source.duplicates.slice()
          : [],

      invalid:
        Array.isArray(source.invalid)
          ? source.invalid.slice()
          : [],

      meta: {
        connected:
          sourceMeta.connected === true,

        spreadsheetId:
          String(
            sourceMeta.spreadsheetId ||
            ""
          ),

        sheetName:
          String(
            sourceMeta.sheetName ||
            ""
          ),

        rowsScanned:
          Number(
            sourceMeta.rowsScanned ||
            0
          ),

        requestedCount:
          Number(
            sourceMeta.requestedCount ||
            0
          ),

        matchedCount:
          Number(
            sourceMeta.matchedCount ||
            0
          )
      }
    };
  }

  function restoreLoadingAttribute(element, attributeName, datasetName) {
    if (!element) return;

    const previous = element.dataset[datasetName];

    if (previous === undefined) return;

    if (previous === "__none__") {
      element.removeAttribute(attributeName);
    } else {
      element.setAttribute(attributeName, previous);
    }

    delete element.dataset[datasetName];
  }

  function setControlLoading(control, isLoading) {
    if (!control) return;

    if (isLoading) {
      if (control.dataset.nexusControlLoading !== "true") {
        control.dataset.nexusOriginalAriaBusy =
          control.hasAttribute("aria-busy")
            ? control.getAttribute("aria-busy")
            : "__none__";

        control.dataset.nexusOriginalAriaDisabled =
          control.hasAttribute("aria-disabled")
            ? control.getAttribute("aria-disabled")
            : "__none__";
      }

      control.dataset.nexusControlLoading = "true";
      control.classList.add("nexus-control-loading");
      control.setAttribute("aria-busy", "true");
      control.setAttribute("aria-disabled", "true");
      return;
    }

    const wasLoading = control.dataset.nexusControlLoading === "true";

    control.classList.remove("nexus-control-loading");
    delete control.dataset.nexusControlLoading;
    restoreLoadingAttribute(control, "aria-busy", "nexusOriginalAriaBusy");
    restoreLoadingAttribute(control, "aria-disabled", "nexusOriginalAriaDisabled");

    if (wasLoading) {
      control.classList.add("nexus-control-ready");
      window.setTimeout(function () {
        control.classList.remove("nexus-control-ready");
      }, 280);
    }
  }

  function setManagedControlsLoading(pageRoot, isLoading) {
    if (!pageRoot) return;

    pageRoot
      .querySelectorAll("[data-link-key]")
      .forEach(function (control) {
        setControlLoading(control, isLoading);
      });
  }

  /*
   * Managed-link loading is intentionally local to the actionable controls.
   * We previously covered the entire route with a modal-style loader while
   * getManagedLinks() resolved. That made the portal feel blocked even though
   * the rest of the page was already usable. Buttons/cards now keep their own
   * dimensions and show the shared wave skeleton until their URLs are ready.
   */
  function showLoader(
    pageRoot,
    state
  ) {
    if (!pageRoot) return;

    state.loader = null;
    setManagedControlsLoading(pageRoot, true);
  }

  function hideLoader(
    pageRoot,
    state
  ) {
    if (!pageRoot) return;

    setManagedControlsLoading(pageRoot, false);
  }

  function unlockAdminInteractiveNode(node) {
    if (!node || node.nodeType !== 1) return;

    // A native disabled form control does not reliably emit a click event,
    // so simply making the managed parent clickable is not enough. Remove
    // disabled states from the entire actionable subtree for NEXUS Admins.
    if ("disabled" in node && node.disabled) {
      node.disabled = false;
    }

    node.removeAttribute("disabled");

    if (node.getAttribute("aria-disabled") === "true") {
      node.setAttribute("aria-disabled", "false");
    }

    // A stale loading class can also keep a missing-link control inert.
    node.classList.remove("nexus-control-loading");
    node.removeAttribute("aria-busy");

    // Inline !important wins over legacy page rules that use
    // pointer-events:none!important on unavailable affordances.
    try {
      node.style.setProperty("pointer-events", "auto", "important");
    } catch (error) {
      // Non-critical; continue with the remaining unlock steps.
    }
  }

  function makeManagedElementAdminInteractive(element) {
    if (!element) return;

    element.dataset.managedAdminEditable = "true";

    unlockAdminInteractiveNode(element);

    // Some managed controls are cards with nested native buttons/anchors.
    // Unlock all likely interactive descendants so a disabled child cannot
    // swallow the pointer before the delegated managed-link handler receives it.
    element
      .querySelectorAll(
        'button, a, input, [role="button"], [aria-disabled="true"], [disabled], .nexus-control-loading'
      )
      .forEach(unlockAdminInteractiveNode);

    if (
      !/^(A|BUTTON|INPUT|SELECT|TEXTAREA)$/i.test(element.tagName || "") &&
      !element.hasAttribute("tabindex")
    ) {
      element.setAttribute("tabindex", "0");
    }

    adminDebugLog("Admin interactivity unlocked for managed link.", {
      key: String(element.dataset.linkKey || ""),
      tag: element.tagName,
      disabled: "disabled" in element ? Boolean(element.disabled) : null,
      ariaDisabled: element.getAttribute("aria-disabled"),
      pointerEvents: window.getComputedStyle(element).pointerEvents
    });
  }

  function refreshAdminInteractivity(root) {
    const scope = root && root.querySelectorAll ? root : document;

    if (!isCurrentUserAdmin()) {
      return;
    }

    scope
      .querySelectorAll('[data-managed-link-missing="true"]')
      .forEach(makeManagedElementAdminInteractive);
  }

  function refreshViewModeInteractivity(root) {
    const scope = root && root.querySelectorAll ? root : document;
    const adminView = isCurrentUserAdmin();

    scope
      .querySelectorAll('[data-managed-link-missing="true"]')
      .forEach(function (element) {
        element.dataset.managedTooltip = adminView
          ? "NEXUS ADMIN — manage destination"
          : "Coming soon";

        if (adminView) {
          makeManagedElementAdminInteractive(element);
        } else {
          delete element.dataset.managedAdminEditable;
        }
      });

    adminDebugLog("View-mode interactivity refreshed.", {
      adminView: adminView,
      snapshot: getAdminDebugSnapshot()
    });
  }

  function applyResolvedState(
    pageRoot,
    state
  ) {
    if (!pageRoot) {
      return;
    }

    const admin = isCurrentUserAdmin();

    pageRoot
      .querySelectorAll(
        "[data-link-key]"
      )
      .forEach(function (element) {
        const key =
          String(
            element.dataset.linkKey ||
            ""
          ).trim();

        const url =
          state.links[key] || "";

        if (url) {
          element.dataset.managedLinkReady =
            "true";

          element.removeAttribute(
            "data-managed-link-missing"
          );
          element.removeAttribute(
            "data-managed-tooltip"
          );
          delete element.dataset.managedAdminEditable;
        } else {
          delete element.dataset
            .managedLinkReady;

          element.dataset
            .managedLinkMissing =
              "true";
          element.dataset.managedTooltip =
            admin
              ? "NEXUS ADMIN — manage destination"
              : "Coming soon";

          if (admin) {
            makeManagedElementAdminInteractive(element);
          }
        }
      });
  }

  function getTriggerLabel(trigger) {
    if (!trigger) {
      return "This resource";
    }

    const ariaLabel =
      String(
        trigger.getAttribute(
          "aria-label"
        ) || ""
      ).trim();

    if (ariaLabel) {
      return ariaLabel
        .replace(/^Open\s+/i, "")
        .replace(/^View\s+/i, "")
        .replace(/^Explore\s+/i, "")
        .trim();
    }

    const text =
      String(
        trigger.textContent || ""
      )
        .replace(/\s+/g, " ")
        .trim();

    return (
      text ||
      "This resource"
    );
  }

  function ensureComingSoonDialog() {
    let dialog =
      document.getElementById(
        "managed-link-coming-soon"
      );

    if (dialog) {
      return dialog;
    }

    dialog =
      document.createElement(
        "dialog"
      );

    dialog.id =
      "managed-link-coming-soon";

    dialog.className =
      "managed-coming-soon-dialog";

    dialog.setAttribute(
      "aria-labelledby",
      "managed-coming-soon-title"
    );

    dialog.setAttribute(
      "aria-describedby",
      "managed-coming-soon-message"
    );

    dialog.innerHTML =
      '<div class="managed-coming-soon-card">' +
        '<button class="managed-coming-soon-close" type="button" ' +
          'data-managed-coming-soon-close aria-label="Close">' +
          '<svg viewBox="0 0 24 24" aria-hidden="true">' +
            '<path d="M6 6l12 12M18 6L6 18"></path>' +
          '</svg>' +
        '</button>' +

        '<div class="managed-coming-soon-icon" aria-hidden="true">' +
          '<svg viewBox="0 0 24 24">' +
            '<path d="M12 3l1.85 4.15L18 9l-4.15 1.85L12 15l-1.85-4.15L6 9l4.15-1.85L12 3Z"></path>' +
            '<path d="M18.5 14.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9.9-2.1Z"></path>' +
          '</svg>' +
        '</div>' +

        '<p class="managed-coming-soon-eyebrow">COMING SOON</p>' +
        '<h2 id="managed-coming-soon-title">Something exciting is on the way ✨</h2>' +
        '<p id="managed-coming-soon-message" class="managed-coming-soon-message">' +
          'We’re putting the finishing touches on this experience so it’s ready to shine. Check back soon — there’s more good stuff coming!' +
        '</p>' +

        '<button class="managed-coming-soon-action" type="button" ' +
          'data-managed-coming-soon-close>' +
          'Got it — can’t wait!' +
        '</button>' +
      '</div>';

    dialog
      .querySelectorAll(
        "[data-managed-coming-soon-close]"
      )
      .forEach(function (button) {
        button.addEventListener(
          "click",
          function () {
            dialog.close();
          }
        );
      });

    dialog.addEventListener(
      "click",
      function (event) {
        if (
          event.target === dialog
        ) {
          dialog.close();
        }
      }
    );

    document.body.appendChild(
      dialog
    );

    return dialog;
  }

  function showComingSoon() {
    adminDebugLog("SHARED Coming Soon modal opened.", getAdminDebugSnapshot());
    const dialog =
      ensureComingSoonDialog();

    if (
      typeof dialog.showModal ===
      "function"
    ) {
      if (!dialog.open) {
        dialog.showModal();
      }

      return;
    }

    dialog.setAttribute(
      "open",
      ""
    );
  }

  function openResolvedUrl(
    url
  ) {
    window.open(
      url,
      "_blank",
      "noopener,noreferrer"
    );
  }


  /* =========================================================
     NEXUS ADMIN — MANAGED LINK EDITOR
     ---------------------------------------------------------
     Missing managed links keep the normal Coming Soon behavior
     for regular users. A server-resolved NEXUS Admin instead gets
     a small editor that writes the destination to 06_Assets.
     ========================================================= */

  let adminLinkDialog = null;
  let adminLinkDialogContext = null;

  function isCurrentUserAdmin() {
    const snapshot = getAdminDebugSnapshot();
    const appRole = String(snapshot.appRole || "").toLowerCase();
    const profileRole = String(snapshot.profileRole || "").toLowerCase();
    const actualAdmin = appRole === "admin" || profileRole === "admin";

    // currentUserViewRole is intentionally separate from actual authorization.
    // When an actual admin chooses "Show as User", managed links must behave
    // exactly like the standard-user experience even though server privileges
    // remain unchanged.
    const appViewRole = String(snapshot.appViewRole || "").toLowerCase();
    const profileViewRole = String(snapshot.profileViewRole || "").toLowerCase();
    let effectiveRole = appViewRole || profileViewRole;

    if (
      window.NexusViewMode &&
      typeof window.NexusViewMode.getRole === "function"
    ) {
      effectiveRole = String(window.NexusViewMode.getRole() || effectiveRole).toLowerCase();
    }

    const result = actualAdmin && effectiveRole !== "user";

    adminDebugLog("isCurrentUserAdmin()", {
      result: result,
      actualAdmin: actualAdmin,
      effectiveRole: effectiveRole || "<not set>",
      appRole: snapshot.appRole,
      appViewRole: snapshot.appViewRole,
      profileRole: snapshot.profileRole,
      profileViewRole: snapshot.profileViewRole,
      profileHasAdminClass: snapshot.profileHasAdminClass,
      badgeText: snapshot.badgeText
    });
    return result;
  }

  function isAppsScriptAvailable() {
    return Boolean(
      typeof google !== "undefined" &&
      google &&
      google.script &&
      google.script.run
    );
  }

  function getAppsScriptErrorMessage(error) {
    if (!error) {
      return "Unable to save the link. Please try again.";
    }

    const message = String(
      error.message ||
      error.toString && error.toString() ||
      error ||
      ""
    ).trim();

    return message ||
      "Unable to save the link. Please try again.";
  }

  function setAdminLinkDialogMessage(
    dialog,
    message,
    type
  ) {
    if (!dialog) return;

    const status =
      dialog.querySelector(
        "[data-managed-admin-status]"
      );

    if (!status) return;

    const text =
      String(message || "").trim();

    status.textContent = text;
    status.hidden = !text;
    status.dataset.statusType =
      String(type || "info");
  }

  function setAdminLinkDialogBusy(
    dialog,
    isBusy,
    busyAction
  ) {
    if (!dialog) return;

    const form = dialog.querySelector("[data-managed-admin-form]");
    const input = dialog.querySelector("[data-managed-admin-url]");
    const saveButton = dialog.querySelector("[data-managed-admin-save]");
    const cancelButtons = dialog.querySelectorAll("[data-managed-admin-cancel]");
    const visitButton = dialog.querySelector("[data-managed-admin-visit]");
    const deleteButton = dialog.querySelector("[data-managed-admin-delete]");

    dialog.classList.toggle("is-saving", Boolean(isBusy));
    dialog.dataset.busyAction = isBusy ? String(busyAction || "save") : "";

    if (form) {
      form.setAttribute("aria-busy", isBusy ? "true" : "false");
    }

    if (input) {
      input.disabled = Boolean(isBusy);
    }

    if (saveButton) {
      saveButton.disabled = Boolean(isBusy);

      const label = saveButton.querySelector("[data-managed-admin-save-label]");
      if (label) {
        const hasExisting = Boolean(
          adminLinkDialogContext && adminLinkDialogContext.currentUrl
        );
        label.textContent =
          isBusy && busyAction === "save"
            ? (hasExisting ? "UPDATING..." : "SAVING...")
            : (hasExisting ? "UPDATE LINK" : "SAVE LINK");
      }
    }

    cancelButtons.forEach(function (button) {
      button.disabled = Boolean(isBusy);
    });

    if (visitButton) {
      visitButton.disabled = Boolean(isBusy);
    }

    if (deleteButton) {
      deleteButton.disabled = Boolean(isBusy);
      const deleteLabel = deleteButton.querySelector("[data-managed-admin-delete-label]");
      if (deleteLabel && isBusy && busyAction === "delete") {
        deleteLabel.textContent = "DELETING...";
      }
    }
  }

  function closeAdminLinkDialog() {
    if (!adminLinkDialog) return;

    const context =
      adminLinkDialogContext;

    if (adminLinkDialog.open) {
      adminLinkDialog.close();
    } else {
      adminLinkDialog.removeAttribute(
        "open"
      );
    }

    adminLinkDialogContext = null;

    if (
      context &&
      context.trigger &&
      typeof context.trigger.focus ===
        "function"
    ) {
      window.setTimeout(
        function () {
          try {
            context.trigger.focus({
              preventScroll: true
            });
          } catch (error) {
            context.trigger.focus();
          }
        },
        0
      );
    }
  }

  function ensureAdminLinkDialog() {
    if (adminLinkDialog) {
      return adminLinkDialog;
    }

    let dialog = document.getElementById("managed-link-admin-editor");

    if (!dialog) {
      dialog = document.createElement("dialog");
      dialog.id = "managed-link-admin-editor";
      dialog.className = "managed-admin-link-dialog";
      dialog.setAttribute("aria-labelledby", "managed-admin-link-title");
      dialog.setAttribute("aria-describedby", "managed-admin-link-description");

      dialog.innerHTML =
        '<form class="managed-admin-link-card" data-managed-admin-form>' +
          '<div class="managed-admin-link-topline">' +
            '<div class="managed-admin-link-icon" aria-hidden="true">' +
              '<svg viewBox="0 0 24 24">' +
                '<path d="M10.2 13.8a4.2 4.2 0 0 0 5.94 0l2.86-2.86a4.2 4.2 0 0 0-5.94-5.94l-1.64 1.64"></path>' +
                '<path d="M13.8 10.2a4.2 4.2 0 0 0-5.94 0L5 13.06A4.2 4.2 0 1 0 10.94 19l1.64-1.64"></path>' +
              '</svg>' +
            '</div>' +
            '<div class="managed-admin-link-heading">' +
              '<span class="managed-admin-link-eyebrow">NEXUS ADMIN</span>' +
              '<h2 id="managed-admin-link-title">Manage resource link</h2>' +
              '<p id="managed-admin-link-description">Visit, update, or remove the destination for this Nexus resource.</p>' +
            '</div>' +
            '<button class="managed-admin-link-close" type="button" data-managed-admin-cancel aria-label="Close">' +
              '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>' +
            '</button>' +
          '</div>' +

          '<div class="managed-admin-link-resource">' +
            '<div>' +
              '<span class="managed-admin-link-meta-label">RESOURCE</span>' +
              '<strong data-managed-admin-resource>This resource</strong>' +
            '</div>' +
            '<div class="managed-admin-link-key-wrap">' +
              '<span class="managed-admin-link-meta-label">LINK KEY</span>' +
              '<code data-managed-admin-key></code>' +
            '</div>' +
          '</div>' +

          '<label class="managed-admin-link-field">' +
            '<span>Destination URL</span>' +
            '<div class="managed-admin-link-input-wrap">' +
              '<svg viewBox="0 0 24 24" aria-hidden="true">' +
                '<path d="M10.2 13.8a4.2 4.2 0 0 0 5.94 0l2.86-2.86a4.2 4.2 0 0 0-5.94-5.94l-1.64 1.64"></path>' +
                '<path d="M13.8 10.2a4.2 4.2 0 0 0-5.94 0L5 13.06A4.2 4.2 0 1 0 10.94 19l1.64-1.64"></path>' +
              '</svg>' +
              '<input type="url" inputmode="url" autocomplete="url" spellcheck="false" placeholder="https://..." data-managed-admin-url required>' +
            '</div>' +
          '</label>' +

          '<p class="managed-admin-link-hint" data-managed-admin-hint>This writes to <strong>06_Assets</strong>. Changes take effect immediately in the current page.</p>' +
          '<p class="managed-admin-link-status" data-managed-admin-status role="status" aria-live="polite" hidden></p>' +

          '<div class="managed-admin-link-actions">' +
            '<div class="managed-admin-link-actions-left">' +
              '<button class="managed-admin-link-danger" type="button" data-managed-admin-delete hidden>' +
                '<span data-managed-admin-delete-label>DELETE LINK</span>' +
              '</button>' +
            '</div>' +
            '<div class="managed-admin-link-actions-right">' +
              '<button class="managed-admin-link-secondary" type="button" data-managed-admin-cancel>CANCEL</button>' +
              '<button class="managed-admin-link-secondary managed-admin-link-visit" type="button" data-managed-admin-visit hidden>' +
                '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5h5v5"></path><path d="M10 14 19 5"></path><path d="M19 13v6H5V5h6"></path></svg>' +
                '<span>VISIT LINK</span>' +
              '</button>' +
              '<button class="managed-admin-link-primary" type="submit" data-managed-admin-save>' +
                '<span class="managed-admin-link-spinner" aria-hidden="true"></span>' +
                '<span data-managed-admin-save-label>UPDATE LINK</span>' +
              '</button>' +
            '</div>' +
          '</div>' +
        '</form>';

      document.body.appendChild(dialog);
    }

    adminLinkDialog = dialog;

    dialog.querySelectorAll("[data-managed-admin-cancel]").forEach(function (button) {
      button.addEventListener("click", function () {
        if (!dialog.classList.contains("is-saving")) {
          closeAdminLinkDialog();
        }
      });
    });

    dialog.addEventListener("cancel", function (event) {
      if (dialog.classList.contains("is-saving")) {
        event.preventDefault();
        return;
      }
      event.preventDefault();
      closeAdminLinkDialog();
    });

    dialog.addEventListener("click", function (event) {
      if (event.target === dialog && !dialog.classList.contains("is-saving")) {
        closeAdminLinkDialog();
      }
    });

    const visitButton = dialog.querySelector("[data-managed-admin-visit]");
    if (visitButton) {
      visitButton.addEventListener("click", function () {
        if (!adminLinkDialogContext || dialog.classList.contains("is-saving")) return;
        const currentUrl = String(adminLinkDialogContext.currentUrl || "").trim();
        if (/^https?:\/\/\S+$/i.test(currentUrl)) {
          openResolvedUrl(currentUrl);
        }
      });
    }

    const deleteButton = dialog.querySelector("[data-managed-admin-delete]");
    if (deleteButton) {
      deleteButton.addEventListener("click", function () {
        if (!adminLinkDialogContext || dialog.classList.contains("is-saving") || !adminLinkDialogContext.currentUrl) return;

        const deleteLabel = deleteButton.querySelector("[data-managed-admin-delete-label]");

        if (deleteButton.dataset.confirmDelete !== "true") {
          deleteButton.dataset.confirmDelete = "true";
          deleteButton.classList.add("is-confirming");
          if (deleteLabel) deleteLabel.textContent = "CONFIRM DELETE";
          setAdminLinkDialogMessage(
            dialog,
            "Click CONFIRM DELETE again to remove this destination. The registry key will remain available for a new link.",
            "warning"
          );
          return;
        }

        if (!isAppsScriptAvailable()) {
          setAdminLinkDialogMessage(dialog, "Apps Script is unavailable in this preview, so the link cannot be deleted here.", "error");
          return;
        }

        const context = adminLinkDialogContext;
        setAdminLinkDialogMessage(dialog, "", "info");
        setAdminLinkDialogBusy(dialog, true, "delete");

        google.script.run
          .withSuccessHandler(function (response) {
            const source = response && typeof response === "object" ? response : {};
            if (source.ok !== true || source.deleted !== true) {
              setAdminLinkDialogBusy(dialog, false);
              setAdminLinkDialogMessage(dialog, "The server returned an unexpected response while deleting the link.", "error");
              return;
            }

            const result = {
              ok: true,
              deleted: true,
              key: String(source.key || context.key || "").trim(),
              row: Number(source.row || 0),
              message: String(source.message || "Link deleted successfully.")
            };

            context.currentUrl = "";
            if (typeof context.onDeleted === "function") context.onDeleted(result);

            setAdminLinkDialogBusy(dialog, false);
            setAdminLinkDialogMessage(dialog, "Link deleted. This resource is now available for an admin to configure again.", "success");
            if (deleteLabel) deleteLabel.textContent = "DELETED ✓";

            window.setTimeout(function () { closeAdminLinkDialog(); }, 850);
          })
          .withFailureHandler(function (error) {
            setAdminLinkDialogBusy(dialog, false);
            deleteButton.dataset.confirmDelete = "true";
            deleteButton.classList.add("is-confirming");
            if (deleteLabel) deleteLabel.textContent = "CONFIRM DELETE";
            setAdminLinkDialogMessage(dialog, getAppsScriptErrorMessage(error), "error");
          })
          .deleteManagedLink(context.key);
      });
    }

    const form = dialog.querySelector("[data-managed-admin-form]");
    if (form) {
      form.addEventListener("submit", function (event) {
        event.preventDefault();
        if (!adminLinkDialogContext || dialog.classList.contains("is-saving")) return;

        const input = dialog.querySelector("[data-managed-admin-url]");
        const url = String(input ? input.value : "").trim();

        if (!/^https?:\/\/\S+$/i.test(url)) {
          setAdminLinkDialogMessage(dialog, "Enter a complete http:// or https:// URL.", "error");
          if (input) { input.focus(); input.select(); }
          return;
        }

        if (!isAppsScriptAvailable()) {
          setAdminLinkDialogMessage(dialog, "Apps Script is unavailable in this preview, so the link cannot be saved here.", "error");
          return;
        }

        setAdminLinkDialogMessage(dialog, "", "info");
        setAdminLinkDialogBusy(dialog, true, "save");
        const context = adminLinkDialogContext;

        google.script.run
          .withSuccessHandler(function (response) {
            const source = response && typeof response === "object" ? response : {};
            const savedKey = String(source.key || context.key || "").trim();
            const savedUrl = String(source.url || url).trim();

            if (source.ok !== true || !savedKey || !/^https?:\/\/\S+$/i.test(savedUrl)) {
              setAdminLinkDialogBusy(dialog, false);
              setAdminLinkDialogMessage(dialog, "The server returned an unexpected response. Please try again.", "error");
              return;
            }

            const result = {
              ok: true,
              key: savedKey,
              url: savedUrl,
              row: Number(source.row || 0),
              created: source.created === true,
              message: String(source.message || "Link saved successfully.")
            };

            context.currentUrl = savedUrl;
            if (typeof context.onSaved === "function") context.onSaved(result);

            setAdminLinkDialogBusy(dialog, false);
            setAdminLinkDialogMessage(dialog, result.created ? "Link added. This resource is now active." : "Link updated successfully.", "success");

            const saveLabel = dialog.querySelector("[data-managed-admin-save-label]");
            if (saveLabel) saveLabel.textContent = "SAVED ✓";
            window.setTimeout(function () { closeAdminLinkDialog(); }, 850);
          })
          .withFailureHandler(function (error) {
            setAdminLinkDialogBusy(dialog, false);
            setAdminLinkDialogMessage(dialog, getAppsScriptErrorMessage(error), "error");
          })
          .saveManagedLink(context.key, url);
      });
    }

    return dialog;
  }

  function showAdminLinkEditor(options) {
    adminDebugLog("showAdminLinkEditor() called.", {
      options: options,
      roleSnapshot: getAdminDebugSnapshot()
    });

    const source = options && typeof options === "object" ? options : {};
    const key = String(source.key || "").trim();

    if (!key) return false;

    if (!isCurrentUserAdmin()) {
      console.warn("[NEXUS ADMIN DEBUG] Admin link editor BLOCKED; user is not resolving as admin.", getAdminDebugSnapshot());
      return false;
    }

    const currentUrl = String(source.url || "").trim();
    const hasExisting = /^https?:\/\/\S+$/i.test(currentUrl);
    const dialog = ensureAdminLinkDialog();

    const resource = dialog.querySelector("[data-managed-admin-resource]");
    const keyElement = dialog.querySelector("[data-managed-admin-key]");
    const input = dialog.querySelector("[data-managed-admin-url]");
    const title = dialog.querySelector("#managed-admin-link-title");
    const description = dialog.querySelector("#managed-admin-link-description");
    const hint = dialog.querySelector("[data-managed-admin-hint]");
    const visitButton = dialog.querySelector("[data-managed-admin-visit]");
    const deleteButton = dialog.querySelector("[data-managed-admin-delete]");

    if (resource) resource.textContent = String(source.label || "This resource").trim() || "This resource";
    if (keyElement) keyElement.textContent = key;
    if (input) input.value = hasExisting ? currentUrl : "";
    if (title) title.textContent = hasExisting ? "Manage resource link" : "Add resource link";
    if (description) {
      description.textContent = hasExisting
        ? "Visit the current destination, update it, or remove it from this Nexus resource."
        : "Add the destination for this Nexus resource. Saving activates the button immediately.";
    }
    if (hint) {
      hint.innerHTML = hasExisting
        ? 'Updates write directly to <strong>06_Assets</strong>. Deleting clears the URL but keeps the registry key.'
        : 'This writes to <strong>06_Assets</strong>. Existing keys are updated; a missing key is created automatically.';
    }
    if (visitButton) visitButton.hidden = !hasExisting;
    if (deleteButton) {
      deleteButton.hidden = !hasExisting;
      deleteButton.dataset.confirmDelete = "false";
      deleteButton.classList.remove("is-confirming");
      const deleteLabel = deleteButton.querySelector("[data-managed-admin-delete-label]");
      if (deleteLabel) deleteLabel.textContent = "DELETE LINK";
    }

    adminLinkDialogContext = {
      key: key,
      trigger: source.trigger || null,
      currentUrl: hasExisting ? currentUrl : "",
      onSaved: typeof source.onSaved === "function" ? source.onSaved : null,
      onDeleted: typeof source.onDeleted === "function" ? source.onDeleted : null
    };

    setAdminLinkDialogBusy(dialog, false);
    setAdminLinkDialogMessage(dialog, "", "info");

    const saveLabel = dialog.querySelector("[data-managed-admin-save-label]");
    if (saveLabel) saveLabel.textContent = hasExisting ? "UPDATE LINK" : "SAVE LINK";

    if (typeof dialog.showModal === "function") {
      if (!dialog.open) dialog.showModal();
    } else {
      dialog.setAttribute("open", "");
    }

    window.setTimeout(function () {
      if (input) input.focus();
    }, 0);

    return true;
  }

  function applySavedLinkToState(
    pageRoot,
    state,
    result
  ) {
    if (
      !state ||
      !result ||
      result.ok !== true
    ) {
      return;
    }

    const key =
      String(result.key || "").trim();
    const url =
      String(result.url || "").trim();

    if (
      !key ||
      !/^https?:\/\/\S+$/i.test(url)
    ) {
      return;
    }

    state.links[key] = url;
    state.missing =
      state.missing.filter(
        function (item) {
          return item !== key;
        }
      );
    state.invalid =
      state.invalid.filter(
        function (item) {
          return item !== key;
        }
      );

    applyResolvedState(
      pageRoot,
      state
    );

    hideManagedTooltip();
  }


  function applyDeletedLinkToState(
    pageRoot,
    state,
    result
  ) {
    if (!state || !result || result.ok !== true || result.deleted !== true) return;

    const key = String(result.key || "").trim();
    if (!key) return;

    delete state.links[key];
    if (state.missing.indexOf(key) === -1) state.missing.push(key);
    state.invalid = state.invalid.filter(function (item) { return item !== key; });

    applyResolvedState(pageRoot, state);
    refreshAdminInteractivity(pageRoot);
    hideManagedTooltip();
  }


  let managedTooltip = null;
  let managedTooltipCard = null;
  let managedTooltipMessage = null;
  let managedTooltipActiveTrigger = null;
  let managedTooltipBound = false;

  function ensureManagedTooltip() {
    if (managedTooltip) {
      return managedTooltip;
    }

    managedTooltip = document.createElement("div");
    managedTooltip.id = "managed-link-tooltip";
    managedTooltip.className = "managed-link-tooltip";
    managedTooltip.setAttribute("role", "status");
    managedTooltip.setAttribute("aria-live", "polite");
    managedTooltip.setAttribute("data-placement", "top");
    managedTooltip.hidden = true;
    managedTooltip.innerHTML =
      '<div class="managed-link-tooltip-card">' +
        '<p class="managed-link-tooltip-message">✨ Coming soon — something great is near!</p>' +
        '<div class="managed-link-tooltip-caret" aria-hidden="true"></div>' +
      '</div>';

    document.body.appendChild(managedTooltip);
    managedTooltipCard = managedTooltip.querySelector('.managed-link-tooltip-card');
    managedTooltipMessage = managedTooltip.querySelector('.managed-link-tooltip-message');

    if (!managedTooltipBound) {
      window.addEventListener('scroll', function () {
        if (managedTooltipActiveTrigger) {
          positionManagedTooltip(managedTooltipActiveTrigger);
        }
      }, true);

      window.addEventListener('resize', function () {
        if (managedTooltipActiveTrigger) {
          positionManagedTooltip(managedTooltipActiveTrigger);
        }
      });

      managedTooltipBound = true;
    }

    return managedTooltip;
  }

  function getUnavailableTooltip() {
    if (isCurrentUserAdmin()) {
      return "🔗 NEXUS ADMIN — add destination link";
    }

    return "✨ Coming soon — something great is near!";
  }

  function positionManagedTooltip(trigger) {
    if (!trigger) {
      return;
    }

    const tooltip = ensureManagedTooltip();
    tooltip.hidden = false;

    const rect = trigger.getBoundingClientRect();
    const gap = 8;
    const viewportWidth = window.innerWidth || document.documentElement.clientWidth;
    const viewportHeight = window.innerHeight || document.documentElement.clientHeight;
    const cardWidth = managedTooltipCard.offsetWidth || 204;
    const cardHeight = managedTooltipCard.offsetHeight || 46;

    let left = rect.left + (rect.width / 2) - (cardWidth / 2);
    const minLeft = 10;
    const maxLeft = viewportWidth - cardWidth - 10;
    left = Math.max(minLeft, Math.min(left, maxLeft));

    const showBelow = rect.top < cardHeight + 16;
    let top = showBelow
      ? rect.bottom + gap
      : rect.top - cardHeight - gap;

    top = Math.max(10, Math.min(top, viewportHeight - cardHeight - 10));

    tooltip.style.left = left + 'px';
    tooltip.style.top = top + 'px';
    tooltip.setAttribute('data-placement', showBelow ? 'bottom' : 'top');

    const caret = tooltip.querySelector('.managed-link-tooltip-caret');
    if (caret) {
      const center = rect.left + (rect.width / 2);
      const caretLeft = Math.max(22, Math.min(cardWidth - 22, center - left));
      caret.style.left = caretLeft + 'px';
    }
  }

  function showManagedTooltip(trigger) {
    if (!trigger || trigger.dataset.managedLinkMissing !== 'true') {
      return;
    }

    const tooltip = ensureManagedTooltip();
    const message = getUnavailableTooltip(trigger);

    if (managedTooltipMessage) {
      managedTooltipMessage.textContent = message;
    }
    managedTooltipActiveTrigger = trigger;

    positionManagedTooltip(trigger);
    requestAnimationFrame(function () {
      tooltip.classList.add('is-visible');
    });
  }

  function hideManagedTooltip(trigger) {
    if (
      trigger &&
      managedTooltipActiveTrigger &&
      trigger !== managedTooltipActiveTrigger
    ) {
      return;
    }

    if (!managedTooltip) {
      return;
    }

    managedTooltip.classList.remove('is-visible');
    managedTooltipActiveTrigger = null;

    window.setTimeout(function () {
      if (managedTooltip && !managedTooltip.classList.contains('is-visible')) {
        managedTooltip.hidden = true;
      }
    }, 180);
  }

  function bindManagedTooltip(pageRoot, state) {
    if (state.tooltipBound) {
      return;
    }

    pageRoot.addEventListener('mouseover', function (event) {
      const trigger = event.target.closest('[data-managed-link-missing="true"]');
      if (!trigger || !pageRoot.contains(trigger)) {
        return;
      }

      if (managedTooltipActiveTrigger === trigger) {
        positionManagedTooltip(trigger);
        return;
      }

      showManagedTooltip(trigger);
    }, true);

    pageRoot.addEventListener('mouseout', function (event) {
      const trigger = event.target.closest('[data-managed-link-missing="true"]');
      if (!trigger || managedTooltipActiveTrigger !== trigger) {
        return;
      }

      const related = event.relatedTarget;
      if (related && trigger.contains(related)) {
        return;
      }

      hideManagedTooltip(trigger);
    }, true);

    pageRoot.addEventListener('focusin', function (event) {
      const trigger = event.target.closest('[data-managed-link-missing="true"]');
      if (!trigger || !pageRoot.contains(trigger)) {
        return;
      }

      showManagedTooltip(trigger);
    });

    pageRoot.addEventListener('focusout', function (event) {
      const trigger = event.target.closest('[data-managed-link-missing="true"]');
      if (!trigger || managedTooltipActiveTrigger !== trigger) {
        return;
      }

      const related = event.relatedTarget;
      if (related && trigger.contains(related)) {
        return;
      }

      hideManagedTooltip(trigger);
    });

    state.tooltipBound = true;
  }


  function handleManagedClick(
    event,
    pageRoot,
    state
  ) {
    const trigger = event.target.closest("[data-link-key]");

    if (!trigger || !pageRoot.contains(trigger)) return;

    if (state.loading) {
      event.preventDefault();
      event.stopPropagation();
      return;
    }

    const key = String(trigger.dataset.linkKey || "").trim();
    const url = state.links[key] || "";
    const adminDetected = isCurrentUserAdmin();

    if (!url) {
      if (state.loaded) {
        event.preventDefault();
        event.stopPropagation();
        hideManagedTooltip(trigger);

        console.log("[NEXUS ADMIN DEBUG] Missing managed-link button clicked:", {
          page: state.config.pageLabel,
          namespace: state.config.namespace,
          key: key,
          label: getTriggerLabel(trigger),
          adminDetected: adminDetected,
          roleSnapshot: getAdminDebugSnapshot(),
          trigger: trigger
        });

        if (adminDetected) {
          showAdminLinkEditor({
            key: key,
            label: getTriggerLabel(trigger),
            trigger: trigger,
            url: "",
            onSaved: function (result) {
              applySavedLinkToState(pageRoot, state, result);
            },
            onDeleted: function (result) {
              applyDeletedLinkToState(pageRoot, state, result);
            }
          });
        } else {
          showComingSoon(trigger);
        }
      }
      return;
    }

    event.preventDefault();
    event.stopPropagation();

    if (adminDetected) {
      console.log("[NEXUS ADMIN DEBUG] Existing managed-link clicked by admin; opening manager:", {
        key: key,
        url: url,
        label: getTriggerLabel(trigger)
      });

      showAdminLinkEditor({
        key: key,
        label: getTriggerLabel(trigger),
        trigger: trigger,
        url: url,
        onSaved: function (result) {
          applySavedLinkToState(pageRoot, state, result);
        },
        onDeleted: function (result) {
          applyDeletedLinkToState(pageRoot, state, result);
        }
      });
      return;
    }

    openResolvedUrl(url);
  }

  function getManagedTriggerFromEvent(event, pageRoot) {
    if (!event || !pageRoot) return null;

    const path =
      typeof event.composedPath === "function"
        ? event.composedPath()
        : [];

    for (let index = 0; index < path.length; index += 1) {
      const node = path[index];
      if (!node || node === pageRoot) break;
      if (
        node.nodeType === 1 &&
        node.matches &&
        node.matches("[data-link-key]") &&
        pageRoot.contains(node)
      ) {
        return node;
      }
    }

    const target = event.target && event.target.closest
      ? event.target.closest("[data-link-key]")
      : null;

    return target && pageRoot.contains(target) ? target : null;
  }

  function handleAdminMissingPointerDown(event, pageRoot, state) {
    if (!isCurrentUserAdmin() || state.loading || !state.loaded) return;

    const trigger = getManagedTriggerFromEvent(event, pageRoot);
    if (!trigger || trigger.dataset.managedLinkMissing !== "true") return;

    const key = String(trigger.dataset.linkKey || "").trim();
    if (!key || state.links[key]) return;

    // Mark this gesture so the subsequent click (when one is emitted) does not
    // open a second modal. pointerdown is used because disabled native buttons
    // can suppress click altogether in some Chromium/WebView paths.
    const now = Date.now();
    const previous = Number(trigger.dataset.nexusAdminPointerHandledAt || 0);
    if (now - previous < 450) return;
    trigger.dataset.nexusAdminPointerHandledAt = String(now);

    event.preventDefault();
    event.stopPropagation();
    hideManagedTooltip(trigger);

    adminDebugLog("Admin missing-link pointerdown fallback fired.", {
      key: key,
      label: getTriggerLabel(trigger),
      targetTag: event.target && event.target.tagName,
      triggerTag: trigger.tagName
    });

    showAdminLinkEditor({
      key: key,
      label: getTriggerLabel(trigger),
      trigger: trigger,
      url: "",
      onSaved: function (result) {
        applySavedLinkToState(pageRoot, state, result);
      },
      onDeleted: function (result) {
        applyDeletedLinkToState(pageRoot, state, result);
      }
    });
  }

  function bindManagedClicks(
    pageRoot,
    state
  ) {
    if (state.bound) {
      return;
    }

    pageRoot.addEventListener(
      "pointerdown",
      function (event) {
        handleAdminMissingPointerDown(
          event,
          pageRoot,
          state
        );
      },
      true
    );

    pageRoot.addEventListener(
      "click",
      function (event) {
        const trigger = getManagedTriggerFromEvent(event, pageRoot);
        const handledAt = trigger
          ? Number(trigger.dataset.nexusAdminPointerHandledAt || 0)
          : 0;

        if (
          trigger &&
          isCurrentUserAdmin() &&
          trigger.dataset.managedLinkMissing === "true" &&
          Date.now() - handledAt < 650
        ) {
          event.preventDefault();
          event.stopPropagation();
          return;
        }

        handleManagedClick(
          event,
          pageRoot,
          state
        );
      },
      true
    );

    state.bound = true;
  }

  function fetchLinks(
    pageRoot,
    state
  ) {
    const requestedKeys =
      getConfiguredKeys(
        state.config
      );

    if (!requestedKeys.length) {
      state.loaded = true;
      state.loading = false;
      hideLoader(
        pageRoot,
        state
      );
      return;
    }

    showLoader(
      pageRoot,
      state
    );

    if (state.loading) {
      return;
    }

    state.loading = true;

    console.info(
      "[ONESCA " +
        state.config.pageLabel +
        "] Connecting to managed link registry...",
      {
        sheet: "06_Assets",
        keyColumn: "B",
        urlColumn: "I",
        requestedKeys:
          requestedKeys.length
      }
    );

    google.script.run
      .withSuccessHandler(
        function (response) {
          adminDebugLog("getManagedLinks() success for " + state.config.pageLabel + ".", {
            requestedKeys: requestedKeys,
            response: response,
            roleSnapshot: getAdminDebugSnapshot()
          });

          const normalized =
            normalizeServerResponse(
              response
            );

          state.links =
            normalized.links;

          state.missing =
            normalized.missing;

          state.duplicates =
            normalized.duplicates;

          state.invalid =
            normalized.invalid;

          state.meta =
            normalized.meta;

          state.loaded = true;
          state.loading = false;

          applyResolvedState(
            pageRoot,
            state
          );

          hideLoader(
            pageRoot,
            state
          );

          if (
            state.missing.length
          ) {
            console.warn(
              "[ONESCA " +
                state.config.pageLabel +
                "] No usable URL was returned for these keys:",
              state.missing
            );
          }

          if (
            state.duplicates.length
          ) {
            console.warn(
              "[ONESCA " +
                state.config.pageLabel +
                "] Duplicate managed-link keys found:",
              state.duplicates
            );
          }

          if (
            state.invalid.length
          ) {
            console.warn(
              "[ONESCA " +
                state.config.pageLabel +
                "] Invalid managed-link URLs found:",
              state.invalid
            );
          }
        }
      )
      .withFailureHandler(
        function (error) {
          state.loading = false;
          state.loaded = false;

          hideLoader(
            pageRoot,
            state
          );

          console.error(
            "[ONESCA " +
              state.config.pageLabel +
              "] Managed-link registry request failed.",
            error
          );
        }
      )
      .getManagedLinks(
        requestedKeys
      );
  }

  function initialize(
    pageRoot,
    rawConfig
  ) {
    if (!pageRoot) {
      return null;
    }

    const existing =
      getInstance(pageRoot);

    if (existing) {
      applyLinkKeys(
        pageRoot,
        existing.config
      );

      if (existing.loaded) {
        applyResolvedState(
          pageRoot,
          existing
        );
      }

      return existing;
    }

    const config =
      normalizeConfig(
        rawConfig
      );

    const state = {
      config: config,
      links:
        Object.create(null),
      loaded: false,
      loading: false,
      bound: false,
      missing: [],
      duplicates: [],
      invalid: [],
      loader: null,
      meta: {
        connected: false,
        spreadsheetId: "",
        sheetName: "",
        rowsScanned: 0,
        requestedCount: 0,
        matchedCount: 0
      }
    };

    instances.set(
      pageRoot,
      state
    );

    applyLinkKeys(
      pageRoot,
      config
    );

    bindManagedClicks(
      pageRoot,
      state
    );

    bindManagedTooltip(
      pageRoot,
      state
    );

    fetchLinks(
      pageRoot,
      state
    );

    return state;
  }

  function refresh(
    pageRoot
  ) {
    const state =
      getInstance(
        pageRoot
      );

    if (!state) {
      return;
    }

    state.loaded = false;
    state.loading = false;
    state.links =
      Object.create(null);

    applyLinkKeys(
      pageRoot,
      state.config
    );

    fetchLinks(
      pageRoot,
      state
    );
  }

  let adminRoleObserver = null;
  let adminDomObserver = null;
  let adminRefreshQueued = false;

  function queueAdminInteractivityRefresh() {
    if (adminRefreshQueued || !isCurrentUserAdmin()) return;
    adminRefreshQueued = true;

    window.requestAnimationFrame(function () {
      adminRefreshQueued = false;
      refreshAdminInteractivity(document);
    });
  }

  function bindAdminRoleObserver() {
    const app = document.getElementById("nexus-app");
    if (!app || adminRoleObserver) return;

    adminRoleObserver = new MutationObserver(function (mutations) {
      const roleChanged = mutations.some(function (mutation) {
        return mutation.type === "attributes" && [
          "data-current-user-role",
          "data-current-user-view-role"
        ].indexOf(mutation.attributeName) !== -1;
      });

      if (roleChanged) {
        adminDebugLog("User/admin view role changed; refreshing managed-link behavior.", getAdminDebugSnapshot());
        refreshViewModeInteractivity(document);
      }
    });

    adminRoleObserver.observe(app, {
      attributes: true,
      attributeFilter: [
        "data-current-user-role",
        "data-current-user-view-role"
      ]
    });

    // Pages are mounted dynamically and some page scripts can alter disabled/
    // loading attributes after the initial link resolution. Keep admin-only
    // missing controls unlocked when those late changes occur.
    adminDomObserver = new MutationObserver(function (mutations) {
      if (!isCurrentUserAdmin()) return;

      const relevant = mutations.some(function (mutation) {
        if (mutation.type === "childList") return true;
        if (mutation.type !== "attributes") return false;
        return [
          "disabled",
          "aria-disabled",
          "class",
          "data-managed-link-missing"
        ].indexOf(mutation.attributeName) !== -1;
      });

      if (relevant) queueAdminInteractivityRefresh();
    });

    adminDomObserver.observe(app, {
      subtree: true,
      childList: true,
      attributes: true,
      attributeFilter: [
        "disabled",
        "aria-disabled",
        "class",
        "data-managed-link-missing"
      ]
    });

    if (isCurrentUserAdmin()) queueAdminInteractivityRefresh();
  }

  window.addEventListener("nexus:viewmodechange", function () {
    refreshViewModeInteractivity(document);
  });

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", bindAdminRoleObserver, { once: true });
  } else {
    bindAdminRoleObserver();
  }

  window.NexusManagedLinks =
    Object.freeze({
      initialize: initialize,
      refresh: refresh,
      showComingSoon:
        showComingSoon,
      showUnavailableTooltip:
        showManagedTooltip,
      hideUnavailableTooltip:
        hideManagedTooltip,
      isCurrentUserAdmin:
        isCurrentUserAdmin,
      getAdminDebugSnapshot:
        getAdminDebugSnapshot,
      showAdminLinkEditor:
        showAdminLinkEditor,
      refreshAdminInteractivity:
        refreshAdminInteractivity,
      refreshViewModeInteractivity:
        refreshViewModeInteractivity
    });
}());
</script>
