<script>
(function () {
  "use strict";

  /*
   * ONESCA — shared managed-link runtime
   *
   * Page modules provide:
   * - a page namespace
   * - the page action attribute
   * - an action -> managed-link-key map
   *
   * This module owns:
   * - getManagedLinks() calls
   * - URL validation
   * - ready / missing states
   * - in-place skeleton loading for managed resource controls
   * - Coming Soon fallback
   * - normal new-tab opening
   */

  const instances = new WeakMap();

  function normalizeLinkDefinition(value) {
    if (typeof value === "string") {
      return {
        key: value.trim(),
        type: "external"
      };
    }

    if (!value || typeof value !== "object") {
      return null;
    }

    return {
      key: String(value.key || "").trim(),
      type: String(value.type || "external").trim() || "external"
    };
  }

  function normalizeConfig(config) {
    const source =
      config && typeof config === "object"
        ? config
        : {};

    const rawLinks =
      source.links &&
      typeof source.links === "object"
        ? source.links
        : {};

    const links = Object.create(null);

    Object.keys(rawLinks).forEach(function (action) {
      const definition =
        normalizeLinkDefinition(
          rawLinks[action]
        );

      if (
        definition &&
        definition.key
      ) {
        links[
          String(action || "").trim()
        ] = definition;
      }
    });

    return {
      namespace:
        String(
          source.namespace || "page"
        ).trim() || "page",

      pageLabel:
        String(
          source.pageLabel || "ONESCA"
        ).trim() || "ONESCA",

      actionAttribute:
        String(
          source.actionAttribute ||
          "data-managed-action"
        ).trim(),

      links: links
    };
  }

  function getInstance(pageRoot) {
    return instances.get(pageRoot) || null;
  }

  function getAction(
    element,
    config
  ) {
    if (!element || !config) {
      return "";
    }

    return String(
      element.getAttribute(
        config.actionAttribute
      ) || ""
    ).trim();
  }

  function getDefinition(
    element,
    config
  ) {
    const action =
      getAction(
        element,
        config
      );

    return (
      config.links[action] ||
      null
    );
  }

  function applyLinkKeys(
    pageRoot,
    config
  ) {
    if (
      !pageRoot ||
      !config ||
      !config.actionAttribute
    ) {
      return;
    }

    const selector =
      "[" +
      config.actionAttribute +
      "]";

    pageRoot
      .querySelectorAll(selector)
      .forEach(function (element) {
        const definition =
          getDefinition(
            element,
            config
          );

        if (!definition) {
          return;
        }

        element.dataset.linkKey =
          definition.key;

        element.dataset.managedLinkType =
          definition.type;
      });
  }

  function getConfiguredKeys(config) {
    const seen =
      Object.create(null);

    return Object.keys(
      config.links
    )
      .map(function (action) {
        return config.links[action].key;
      })
      .filter(function (key) {
        if (!key || seen[key]) {
          return false;
        }

        seen[key] = true;
        return true;
      });
  }

  function normalizeServerResponse(
    response
  ) {
    const source =
      response &&
      typeof response === "object"
        ? response
        : {};

    const sourceLinks =
      source.links &&
      typeof source.links === "object"
        ? source.links
        : {};

    const links =
      Object.create(null);

    Object.keys(
      sourceLinks
    ).forEach(function (key) {
      const url =
        String(
          sourceLinks[key] || ""
        ).trim();

      if (
        /^https?:\/\/\S+$/i.test(url)
      ) {
        links[key] = url;
      }
    });

    const sourceMeta =
      source.meta &&
      typeof source.meta === "object"
        ? source.meta
        : {};

    return {
      links: links,

      missing:
        Array.isArray(source.missing)
          ? source.missing.slice()
          : [],

      duplicates:
        Array.isArray(source.duplicates)
          ? source.duplicates.slice()
          : [],

      invalid:
        Array.isArray(source.invalid)
          ? source.invalid.slice()
          : [],

      meta: {
        connected:
          sourceMeta.connected === true,

        spreadsheetId:
          String(
            sourceMeta.spreadsheetId ||
            ""
          ),

        sheetName:
          String(
            sourceMeta.sheetName ||
            ""
          ),

        rowsScanned:
          Number(
            sourceMeta.rowsScanned ||
            0
          ),

        requestedCount:
          Number(
            sourceMeta.requestedCount ||
            0
          ),

        matchedCount:
          Number(
            sourceMeta.matchedCount ||
            0
          )
      }
    };
  }

  function restoreLoadingAttribute(element, attributeName, datasetName) {
    if (!element) return;

    const previous = element.dataset[datasetName];

    if (previous === undefined) return;

    if (previous === "__none__") {
      element.removeAttribute(attributeName);
    } else {
      element.setAttribute(attributeName, previous);
    }

    delete element.dataset[datasetName];
  }

  function setControlLoading(control, isLoading) {
    if (!control) return;

    if (isLoading) {
      if (control.dataset.nexusControlLoading !== "true") {
        control.dataset.nexusOriginalAriaBusy =
          control.hasAttribute("aria-busy")
            ? control.getAttribute("aria-busy")
            : "__none__";

        control.dataset.nexusOriginalAriaDisabled =
          control.hasAttribute("aria-disabled")
            ? control.getAttribute("aria-disabled")
            : "__none__";
      }

      control.dataset.nexusControlLoading = "true";
      control.classList.add("nexus-control-loading");
      control.setAttribute("aria-busy", "true");
      control.setAttribute("aria-disabled", "true");
      return;
    }

    const wasLoading = control.dataset.nexusControlLoading === "true";

    control.classList.remove("nexus-control-loading");
    delete control.dataset.nexusControlLoading;
    restoreLoadingAttribute(control, "aria-busy", "nexusOriginalAriaBusy");
    restoreLoadingAttribute(control, "aria-disabled", "nexusOriginalAriaDisabled");

    if (wasLoading) {
      control.classList.add("nexus-control-ready");
      window.setTimeout(function () {
        control.classList.remove("nexus-control-ready");
      }, 280);
    }
  }

  function setManagedControlsLoading(pageRoot, isLoading) {
    if (!pageRoot) return;

    pageRoot
      .querySelectorAll("[data-link-key]")
      .forEach(function (control) {
        setControlLoading(control, isLoading);
      });
  }

  /*
   * Managed-link loading is intentionally local to the actionable controls.
   * We previously covered the entire route with a modal-style loader while
   * getManagedLinks() resolved. That made the portal feel blocked even though
   * the rest of the page was already usable. Buttons/cards now keep their own
   * dimensions and show the shared wave skeleton until their URLs are ready.
   */
  function showLoader(
    pageRoot,
    state
  ) {
    if (!pageRoot) return;

    state.loader = null;
    setManagedControlsLoading(pageRoot, true);
  }

  function hideLoader(
    pageRoot,
    state
  ) {
    if (!pageRoot) return;

    setManagedControlsLoading(pageRoot, false);
  }

  function applyResolvedState(
    pageRoot,
    state
  ) {
    if (!pageRoot) {
      return;
    }

    pageRoot
      .querySelectorAll(
        "[data-link-key]"
      )
      .forEach(function (element) {
        const key =
          String(
            element.dataset.linkKey ||
            ""
          ).trim();

        const url =
          state.links[key] || "";

        if (url) {
          element.dataset.managedLinkReady =
            "true";

          element.removeAttribute(
            "data-managed-link-missing"
          );
          element.removeAttribute(
            "data-managed-tooltip"
          );
        } else {
          delete element.dataset
            .managedLinkReady;

          element.dataset
            .managedLinkMissing =
              "true";
          element.dataset.managedTooltip =
            "Coming soon";
        }
      });
  }

  function getTriggerLabel(trigger) {
    if (!trigger) {
      return "This resource";
    }

    const ariaLabel =
      String(
        trigger.getAttribute(
          "aria-label"
        ) || ""
      ).trim();

    if (ariaLabel) {
      return ariaLabel
        .replace(/^Open\s+/i, "")
        .replace(/^View\s+/i, "")
        .replace(/^Explore\s+/i, "")
        .trim();
    }

    const text =
      String(
        trigger.textContent || ""
      )
        .replace(/\s+/g, " ")
        .trim();

    return (
      text ||
      "This resource"
    );
  }

  function ensureComingSoonDialog() {
    let dialog =
      document.getElementById(
        "managed-link-coming-soon"
      );

    if (dialog) {
      return dialog;
    }

    dialog =
      document.createElement(
        "dialog"
      );

    dialog.id =
      "managed-link-coming-soon";

    dialog.className =
      "managed-coming-soon-dialog";

    dialog.setAttribute(
      "aria-labelledby",
      "managed-coming-soon-title"
    );

    dialog.setAttribute(
      "aria-describedby",
      "managed-coming-soon-message"
    );

    dialog.innerHTML =
      '<div class="managed-coming-soon-card">' +
        '<button class="managed-coming-soon-close" type="button" ' +
          'data-managed-coming-soon-close aria-label="Close">' +
          '<svg viewBox="0 0 24 24" aria-hidden="true">' +
            '<path d="M6 6l12 12M18 6L6 18"></path>' +
          '</svg>' +
        '</button>' +

        '<div class="managed-coming-soon-icon" aria-hidden="true">' +
          '<svg viewBox="0 0 24 24">' +
            '<path d="M12 3l1.85 4.15L18 9l-4.15 1.85L12 15l-1.85-4.15L6 9l4.15-1.85L12 3Z"></path>' +
            '<path d="M18.5 14.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9.9-2.1Z"></path>' +
          '</svg>' +
        '</div>' +

        '<p class="managed-coming-soon-eyebrow">COMING SOON</p>' +
        '<h2 id="managed-coming-soon-title">Something exciting is on the way ✨</h2>' +
        '<p id="managed-coming-soon-message" class="managed-coming-soon-message">' +
          'We’re putting the finishing touches on this experience so it’s ready to shine. Check back soon — there’s more good stuff coming!' +
        '</p>' +

        '<button class="managed-coming-soon-action" type="button" ' +
          'data-managed-coming-soon-close>' +
          'Got it — can’t wait!' +
        '</button>' +
      '</div>';

    dialog
      .querySelectorAll(
        "[data-managed-coming-soon-close]"
      )
      .forEach(function (button) {
        button.addEventListener(
          "click",
          function () {
            dialog.close();
          }
        );
      });

    dialog.addEventListener(
      "click",
      function (event) {
        if (
          event.target === dialog
        ) {
          dialog.close();
        }
      }
    );

    document.body.appendChild(
      dialog
    );

    return dialog;
  }

  function showComingSoon() {
    const dialog =
      ensureComingSoonDialog();

    if (
      typeof dialog.showModal ===
      "function"
    ) {
      if (!dialog.open) {
        dialog.showModal();
      }

      return;
    }

    dialog.setAttribute(
      "open",
      ""
    );
  }

  function openResolvedUrl(
    url
  ) {
    window.open(
      url,
      "_blank",
      "noopener,noreferrer"
    );
  }



  let managedTooltip = null;
  let managedTooltipCard = null;
  let managedTooltipMessage = null;
  let managedTooltipActiveTrigger = null;
  let managedTooltipBound = false;

  function ensureManagedTooltip() {
    if (managedTooltip) {
      return managedTooltip;
    }

    managedTooltip = document.createElement("div");
    managedTooltip.id = "managed-link-tooltip";
    managedTooltip.className = "managed-link-tooltip";
    managedTooltip.setAttribute("role", "status");
    managedTooltip.setAttribute("aria-live", "polite");
    managedTooltip.setAttribute("data-placement", "top");
    managedTooltip.hidden = true;
    managedTooltip.innerHTML =
      '<div class="managed-link-tooltip-card">' +
        '<p class="managed-link-tooltip-message">✨ Coming soon — something great is near!</p>' +
        '<div class="managed-link-tooltip-caret" aria-hidden="true"></div>' +
      '</div>';

    document.body.appendChild(managedTooltip);
    managedTooltipCard = managedTooltip.querySelector('.managed-link-tooltip-card');
    managedTooltipMessage = managedTooltip.querySelector('.managed-link-tooltip-message');

    if (!managedTooltipBound) {
      window.addEventListener('scroll', function () {
        if (managedTooltipActiveTrigger) {
          positionManagedTooltip(managedTooltipActiveTrigger);
        }
      }, true);

      window.addEventListener('resize', function () {
        if (managedTooltipActiveTrigger) {
          positionManagedTooltip(managedTooltipActiveTrigger);
        }
      });

      managedTooltipBound = true;
    }

    return managedTooltip;
  }

  function getUnavailableTooltip() {
    return "✨ Coming soon — something great is near!";
  }

  function positionManagedTooltip(trigger) {
    if (!trigger) {
      return;
    }

    const tooltip = ensureManagedTooltip();
    tooltip.hidden = false;

    const rect = trigger.getBoundingClientRect();
    const gap = 8;
    const viewportWidth = window.innerWidth || document.documentElement.clientWidth;
    const viewportHeight = window.innerHeight || document.documentElement.clientHeight;
    const cardWidth = managedTooltipCard.offsetWidth || 204;
    const cardHeight = managedTooltipCard.offsetHeight || 46;

    let left = rect.left + (rect.width / 2) - (cardWidth / 2);
    const minLeft = 10;
    const maxLeft = viewportWidth - cardWidth - 10;
    left = Math.max(minLeft, Math.min(left, maxLeft));

    const showBelow = rect.top < cardHeight + 16;
    let top = showBelow
      ? rect.bottom + gap
      : rect.top - cardHeight - gap;

    top = Math.max(10, Math.min(top, viewportHeight - cardHeight - 10));

    tooltip.style.left = left + 'px';
    tooltip.style.top = top + 'px';
    tooltip.setAttribute('data-placement', showBelow ? 'bottom' : 'top');

    const caret = tooltip.querySelector('.managed-link-tooltip-caret');
    if (caret) {
      const center = rect.left + (rect.width / 2);
      const caretLeft = Math.max(22, Math.min(cardWidth - 22, center - left));
      caret.style.left = caretLeft + 'px';
    }
  }

  function showManagedTooltip(trigger) {
    if (!trigger || trigger.dataset.managedLinkMissing !== 'true') {
      return;
    }

    const tooltip = ensureManagedTooltip();
    const message = getUnavailableTooltip(trigger);

    if (managedTooltipMessage) {
      managedTooltipMessage.textContent = message;
    }
    managedTooltipActiveTrigger = trigger;

    positionManagedTooltip(trigger);
    requestAnimationFrame(function () {
      tooltip.classList.add('is-visible');
    });
  }

  function hideManagedTooltip(trigger) {
    if (
      trigger &&
      managedTooltipActiveTrigger &&
      trigger !== managedTooltipActiveTrigger
    ) {
      return;
    }

    if (!managedTooltip) {
      return;
    }

    managedTooltip.classList.remove('is-visible');
    managedTooltipActiveTrigger = null;

    window.setTimeout(function () {
      if (managedTooltip && !managedTooltip.classList.contains('is-visible')) {
        managedTooltip.hidden = true;
      }
    }, 180);
  }

  function bindManagedTooltip(pageRoot, state) {
    if (state.tooltipBound) {
      return;
    }

    pageRoot.addEventListener('mouseover', function (event) {
      const trigger = event.target.closest('[data-managed-link-missing="true"]');
      if (!trigger || !pageRoot.contains(trigger)) {
        return;
      }

      if (managedTooltipActiveTrigger === trigger) {
        positionManagedTooltip(trigger);
        return;
      }

      showManagedTooltip(trigger);
    }, true);

    pageRoot.addEventListener('mouseout', function (event) {
      const trigger = event.target.closest('[data-managed-link-missing="true"]');
      if (!trigger || managedTooltipActiveTrigger !== trigger) {
        return;
      }

      const related = event.relatedTarget;
      if (related && trigger.contains(related)) {
        return;
      }

      hideManagedTooltip(trigger);
    }, true);

    pageRoot.addEventListener('focusin', function (event) {
      const trigger = event.target.closest('[data-managed-link-missing="true"]');
      if (!trigger || !pageRoot.contains(trigger)) {
        return;
      }

      showManagedTooltip(trigger);
    });

    pageRoot.addEventListener('focusout', function (event) {
      const trigger = event.target.closest('[data-managed-link-missing="true"]');
      if (!trigger || managedTooltipActiveTrigger !== trigger) {
        return;
      }

      const related = event.relatedTarget;
      if (related && trigger.contains(related)) {
        return;
      }

      hideManagedTooltip(trigger);
    });

    state.tooltipBound = true;
  }


  function handleManagedClick(
    event,
    pageRoot,
    state
  ) {
    const trigger =
      event.target.closest(
        "[data-link-key]"
      );

    if (
      !trigger ||
      !pageRoot.contains(trigger)
    ) {
      return;
    }

    if (state.loading) {
      event.preventDefault();
      event.stopPropagation();
      return;
    }

    const key =
      String(
        trigger.dataset.linkKey ||
        ""
      ).trim();

    const url =
      state.links[key] || "";

    if (!url) {
      if (state.loaded) {
        event.preventDefault();
        event.stopPropagation();
        showComingSoon(trigger);
      }

      return;
    }

    event.preventDefault();
    event.stopPropagation();

    openResolvedUrl(url);
  }

  function bindManagedClicks(
    pageRoot,
    state
  ) {
    if (state.bound) {
      return;
    }

    pageRoot.addEventListener(
      "click",
      function (event) {
        handleManagedClick(
          event,
          pageRoot,
          state
        );
      },
      true
    );

    state.bound = true;
  }

  function fetchLinks(
    pageRoot,
    state
  ) {
    const requestedKeys =
      getConfiguredKeys(
        state.config
      );

    if (!requestedKeys.length) {
      state.loaded = true;
      state.loading = false;
      hideLoader(
        pageRoot,
        state
      );
      return;
    }

    showLoader(
      pageRoot,
      state
    );

    if (state.loading) {
      return;
    }

    state.loading = true;

    console.info(
      "[ONESCA " +
        state.config.pageLabel +
        "] Connecting to managed link registry...",
      {
        sheet: "06_Assets",
        keyColumn: "B",
        urlColumn: "I",
        requestedKeys:
          requestedKeys.length
      }
    );

    google.script.run
      .withSuccessHandler(
        function (response) {
          const normalized =
            normalizeServerResponse(
              response
            );

          state.links =
            normalized.links;

          state.missing =
            normalized.missing;

          state.duplicates =
            normalized.duplicates;

          state.invalid =
            normalized.invalid;

          state.meta =
            normalized.meta;

          state.loaded = true;
          state.loading = false;

          applyResolvedState(
            pageRoot,
            state
          );

          hideLoader(
            pageRoot,
            state
          );

          if (
            state.missing.length
          ) {
            console.warn(
              "[ONESCA " +
                state.config.pageLabel +
                "] No usable URL was returned for these keys:",
              state.missing
            );
          }

          if (
            state.duplicates.length
          ) {
            console.warn(
              "[ONESCA " +
                state.config.pageLabel +
                "] Duplicate managed-link keys found:",
              state.duplicates
            );
          }

          if (
            state.invalid.length
          ) {
            console.warn(
              "[ONESCA " +
                state.config.pageLabel +
                "] Invalid managed-link URLs found:",
              state.invalid
            );
          }
        }
      )
      .withFailureHandler(
        function (error) {
          state.loading = false;
          state.loaded = false;

          hideLoader(
            pageRoot,
            state
          );

          console.error(
            "[ONESCA " +
              state.config.pageLabel +
              "] Managed-link registry request failed.",
            error
          );
        }
      )
      .getManagedLinks(
        requestedKeys
      );
  }

  function initialize(
    pageRoot,
    rawConfig
  ) {
    if (!pageRoot) {
      return null;
    }

    const existing =
      getInstance(pageRoot);

    if (existing) {
      applyLinkKeys(
        pageRoot,
        existing.config
      );

      if (existing.loaded) {
        applyResolvedState(
          pageRoot,
          existing
        );
      }

      return existing;
    }

    const config =
      normalizeConfig(
        rawConfig
      );

    const state = {
      config: config,
      links:
        Object.create(null),
      loaded: false,
      loading: false,
      bound: false,
      missing: [],
      duplicates: [],
      invalid: [],
      loader: null,
      meta: {
        connected: false,
        spreadsheetId: "",
        sheetName: "",
        rowsScanned: 0,
        requestedCount: 0,
        matchedCount: 0
      }
    };

    instances.set(
      pageRoot,
      state
    );

    applyLinkKeys(
      pageRoot,
      config
    );

    bindManagedClicks(
      pageRoot,
      state
    );

    bindManagedTooltip(
      pageRoot,
      state
    );

    fetchLinks(
      pageRoot,
      state
    );

    return state;
  }

  function refresh(
    pageRoot
  ) {
    const state =
      getInstance(
        pageRoot
      );

    if (!state) {
      return;
    }

    state.loaded = false;
    state.loading = false;
    state.links =
      Object.create(null);

    applyLinkKeys(
      pageRoot,
      state.config
    );

    fetchLinks(
      pageRoot,
      state
    );
  }

  window.NexusManagedLinks =
    Object.freeze({
      initialize: initialize,
      refresh: refresh,
      showComingSoon:
        showComingSoon,
      showUnavailableTooltip:
        showManagedTooltip,
      hideUnavailableTooltip:
        hideManagedTooltip
    });
}());
</script>
