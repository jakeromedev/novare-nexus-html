<script>
(function () {
  "use strict";

  const NOSCA_CONTEXT_STORAGE_KEY =
    "onesca.nosca.conversationContext.v1";

  const NOSCA_VIEW_STORAGE_KEY =
    "onesca.nosca.panelView.v1";

  const state = {
    initialized: false,
    pending: false,
    previousFocus: null,
    messages: [],
    conversationContext: null,
    viewMode: "closed",
    unread: false
  };

  const dom = {};

  function cacheDom() {
    dom.dialog = document.getElementById("nosca-dialog");
    dom.messages = document.getElementById("nosca-messages");
    dom.welcome = document.getElementById("nosca-welcome");
    dom.status = document.getElementById("nosca-status");
    dom.form = document.getElementById("nosca-form");
    dom.input = document.getElementById("nosca-input");
    dom.send = document.getElementById("nosca-send");
    dom.clear = document.getElementById("nosca-clear");
    dom.minimize = document.getElementById("nosca-minimize");
    dom.close = document.getElementById("nosca-close");
    dom.launcher = document.getElementById("nosca-launcher");
    dom.suggestions = Array.from(
      document.querySelectorAll("[data-nosca-suggestion]")
    );
  }

  function initialize() {
    if (state.initialized) return true;

    cacheDom();

    if (
      !dom.dialog ||
      !dom.messages ||
      !dom.form ||
      !dom.input ||
      !dom.send
    ) {
      console.warn(
        "[Ask NOSCA] Chat UI could not initialize because required elements are missing."
      );
      return false;
    }

    dom.form.addEventListener("submit", function (event) {
      event.preventDefault();
      sendCurrentQuestion();
    });

    dom.input.addEventListener("keydown", function (event) {
      if (
        event.key === "Enter" &&
        !event.shiftKey &&
        !event.isComposing
      ) {
        event.preventDefault();
        sendCurrentQuestion();
      }
    });

    dom.input.addEventListener("input", function () {
      autoSizeComposer();
      updateComposerState();
    });

    if (dom.clear) {
      dom.clear.addEventListener("click", function () {
        clearConversation();
      });
    }

    if (dom.minimize) {
      dom.minimize.addEventListener("click", function () {
        minimize();
      });
    }

    if (dom.close) {
      dom.close.addEventListener("click", function () {
        close();
      });
    }

    dom.suggestions.forEach(function (button) {
      button.addEventListener("click", function () {
        const question = String(
          button.dataset.noscaSuggestion || ""
        ).trim();

        if (!question) return;

        open({
          draft: question,
          submit: true
        });
      });
    });

    dom.dialog.addEventListener("cancel", function (event) {
      event.preventDefault();
      minimize();
    });

    dom.dialog.addEventListener("close", function () {
      syncPanelAttributes();
    });

    document.addEventListener("keydown", function (event) {
      if (
        event.key === "Escape" &&
        dom.dialog.open &&
        !event.defaultPrevented
      ) {
        event.preventDefault();
        minimize();
      }
    });

    state.conversationContext =
      loadConversationContext();

    state.viewMode =
      loadPanelViewState();

    // Never force the floating panel open after a full browser refresh.
    // "open" is restored as minimized, while SPA route changes naturally
    // preserve the live panel and conversation because the shell persists.
    if (state.viewMode === "open") {
      state.viewMode = "minimized";
      savePanelViewState();
    }

    updateComposerState();
    autoSizeComposer();
    syncPanelAttributes();
    updateLauncherState();

    state.initialized = true;
    return true;
  }

  function open(options) {
    if (!initialize()) return;

    const settings =
      options && typeof options === "object"
        ? options
        : {};

    dom.dialog.classList.remove(
      "is-closing",
      "is-minimizing"
    );

    if (!dom.dialog.open) {
      state.previousFocus =
        document.activeElement instanceof HTMLElement
          ? document.activeElement
          : null;

      if (typeof dom.dialog.show === "function") {
        dom.dialog.show();
      } else {
        dom.dialog.setAttribute("open", "");
      }
    }

    state.viewMode = "open";
    state.unread = false;
    savePanelViewState();
    syncPanelAttributes();
    updateLauncherState();

    if (typeof settings.draft === "string") {
      dom.input.value = settings.draft.slice(0, 2000);
      autoSizeComposer();
      updateComposerState();
    }

    window.setTimeout(function () {
      scrollMessagesToBottom();

      if (settings.submit) {
        sendCurrentQuestion();
      } else if (
        settings.focus !== false &&
        dom.input &&
        !dom.input.disabled
      ) {
        dom.input.focus();
        dom.input.setSelectionRange(
          dom.input.value.length,
          dom.input.value.length
        );
      }
    }, 0);
  }

  function minimize() {
    if (!initialize()) return;

    hidePanel_("minimized");
  }

  function close() {
    if (!initialize()) return;

    hidePanel_("closed");
  }

  function hidePanel_(targetView) {
    const nextView =
      targetView === "minimized"
        ? "minimized"
        : "closed";

    state.viewMode = nextView;

    if (nextView === "closed") {
      state.unread = false;
    }

    savePanelViewState();
    updateLauncherState();

    if (!dom.dialog.open) {
      syncPanelAttributes();
      restoreFocus();
      return;
    }

    const reducedMotion =
      window.matchMedia &&
      window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      ).matches;

    if (reducedMotion) {
      finishPanelClose_();
      return;
    }

    dom.dialog.classList.remove(
      "is-closing",
      "is-minimizing"
    );

    dom.dialog.classList.add(
      "is-closing"
    );

    if (nextView === "minimized") {
      dom.dialog.classList.add(
        "is-minimizing"
      );
    }

    window.setTimeout(
      finishPanelClose_,
      190
    );
  }

  function finishPanelClose_() {
    if (!dom.dialog) return;

    if (
      dom.dialog.open &&
      typeof dom.dialog.close === "function"
    ) {
      dom.dialog.close();
    } else {
      dom.dialog.removeAttribute(
        "open"
      );
    }

    dom.dialog.classList.remove(
      "is-closing",
      "is-minimizing"
    );

    syncPanelAttributes();
    updateLauncherState();
    restoreFocus();
  }

  function restoreFocus() {
    const target = state.previousFocus;
    state.previousFocus = null;

    if (
      target &&
      document.contains(target) &&
      typeof target.focus === "function"
    ) {
      target.focus();
      return;
    }

    const launcher =
      dom.launcher ||
      document.getElementById("nosca-launcher");

    if (
      launcher &&
      typeof launcher.focus === "function"
    ) {
      launcher.focus();
    }
  }

  function sendCurrentQuestion() {
    if (!initialize() || state.pending) return;

    const question = String(dom.input.value || "")
      .replace(/\s+/g, " ")
      .trim();

    if (!question) {
      setStatus("Enter a question to get started.", "warning");
      dom.input.focus();
      return;
    }

    sendQuestion(question);
  }

  function sendQuestion(question) {
    if (!initialize() || state.pending) return;

    const normalized = String(question || "")
      .replace(/\s+/g, " ")
      .trim();

    if (!normalized) return;

    if (!isAppsScriptAvailable()) {
      setStatus(
        "Ask NOSCA backend is unavailable in this environment.",
        "error"
      );
      return;
    }

    console.log(
      "[Ask NOSCA DEBUG] Sending question to Apps Script",
      {
        questionLength: normalized.length,
        hasConversationContext:
          Boolean(
            state.conversationContext &&
            Array.isArray(state.conversationContext.topicTerms) &&
            state.conversationContext.topicTerms.length
          ),
        topic:
          state.conversationContext &&
          state.conversationContext.topicLabel
            ? state.conversationContext.topicLabel
            : ""
      }
    );

    hideWelcome();
    appendUserMessage(normalized);

    dom.input.value = "";
    autoSizeComposer();
    setStatus("", "");
    setBusy(true);

    const loadingNode = appendLoadingMessage();

    google.script.run
      .withSuccessHandler(function (result) {
        removeNode(loadingNode);
        setBusy(false);
        handleNoscaSuccess(normalized, result);
      })
      .withFailureHandler(function (error) {
        removeNode(loadingNode);
        setBusy(false);
        handleNoscaFailure(normalized, error);
      })
      .askNosca({
        question: normalized,
        context: state.conversationContext
      });
  }

  function handleNoscaSuccess(question, result) {
    const response =
      result && typeof result === "object"
        ? result
        : {};

    if (
      response.conversationContext &&
      typeof response.conversationContext === "object"
    ) {
      state.conversationContext =
        sanitizeClientConversationContext(
          response.conversationContext
        );

      saveConversationContext(
        state.conversationContext
      );
    }

    console.log(
      "[Ask NOSCA DEBUG] Backend response received",
      {
        requestId: String(response.requestId || ""),
        ok: response.ok,
        grounded: response.grounded,
        sourceCount: Array.isArray(response.sources)
          ? response.sources.length
          : 0,
        diagnostics: response.diagnostics || null,
        conversationContext:
          response.conversationContext || null,
        model: response.model || "",
        elapsedMs: Number(response.elapsedMs || 0)
      }
    );

    if (
      response.grounded === false
    ) {
      console.warn(
        "[Ask NOSCA DEBUG] Backend returned no grounded context.",
        {
          requestId: String(response.requestId || ""),
          diagnostics: response.diagnostics || null
        }
      );
    }

    const answer = String(response.answer || "").trim();

    if (!answer) {
      handleNoscaFailure(
        question,
        new Error("Ask NOSCA returned an empty response.")
      );
      return;
    }

    appendAssistantMessage({
      requestId: String(response.requestId || "").trim(),
      answer: answer,
      grounded: response.grounded !== false,
      sources: Array.isArray(response.sources)
        ? response.sources
        : [],
      responseMode: String(response.responseMode || ""),
      elapsedMs: Number(response.elapsedMs || 0)
    });

    state.messages.push({
      role: "assistant",
      answer: answer
    });

    setStatus("", "");
    scrollMessagesToBottom();

    if (state.viewMode !== "open") {
      markUnread();
    } else if (dom.input && !dom.input.disabled) {
      dom.input.focus();
    }
  }

  function handleNoscaFailure(question, error) {
    console.error(
      "[Ask NOSCA DEBUG] Backend request failed",
      error
    );

    const message = getErrorMessage(error);

    appendErrorMessage(
      "I couldn't complete that request.",
      message,
      function () {
        sendQuestion(question);
      }
    );

    setStatus(
      "Ask NOSCA encountered an error. You can retry the question.",
      "error"
    );

    scrollMessagesToBottom();

    if (state.viewMode !== "open") {
      markUnread();
    }
  }

  function appendUserMessage(question) {
    state.messages.push({
      role: "user",
      question: question
    });

    const row = createMessageRow("user");
    const bubble = document.createElement("div");
    bubble.className = "nosca-message-bubble";

    const label = document.createElement("span");
    label.className = "nosca-message-label";
    label.textContent = "You";

    const text = document.createElement("p");
    text.className = "nosca-message-text";
    text.textContent = question;

    bubble.appendChild(label);
    bubble.appendChild(text);
    row.appendChild(bubble);
    dom.messages.appendChild(row);

    scrollMessagesToBottom();
  }

  function appendAssistantMessage(data) {
    const row = createMessageRow("assistant");
    const avatar = createAssistantAvatar();
    const body = document.createElement("div");
    body.className = "nosca-message-body";

    const bubble = document.createElement("div");
    bubble.className = "nosca-message-bubble";

    const label = document.createElement("span");
    label.className = "nosca-message-label";
    label.textContent = "NOSCA";

    const text = document.createElement("div");
    text.className = "nosca-message-text nosca-answer-text";
    renderSafeAnswer(text, data.answer);

    bubble.appendChild(label);
    bubble.appendChild(text);
    body.appendChild(bubble);

    if (data.grounded === false) {
      const note = document.createElement("div");
      note.className = "nosca-answer-note";
      note.textContent =
        "No sufficiently relevant approved source was found for this answer.";
      body.appendChild(note);
    }

    const sourceBlock = createSourceBlock(
      Array.isArray(data.sources) ? data.sources : [],
      String(data.responseMode || "")
    );

    if (sourceBlock) {
      body.appendChild(sourceBlock);
    }

    if (data.requestId) {
      body.appendChild(
        createFeedbackBlock(data.requestId)
      );
    }

    row.appendChild(avatar);
    row.appendChild(body);
    dom.messages.appendChild(row);
  }

  function appendLoadingMessage() {
    const row = createMessageRow("assistant");
    row.classList.add("is-loading");

    const avatar = createAssistantAvatar();
    const body = document.createElement("div");
    body.className = "nosca-message-body";

    const bubble = document.createElement("div");
    bubble.className = "nosca-message-bubble nosca-loading-bubble";

    const label = document.createElement("span");
    label.className = "nosca-message-label";
    label.textContent = "NOSCA";

    const line = document.createElement("div");
    line.className = "nosca-loading-line";

    const copy = document.createElement("span");
    copy.textContent = "Finding the most relevant information";

    const dots = document.createElement("span");
    dots.className = "nosca-thinking-dots";
    dots.setAttribute("aria-hidden", "true");
    dots.innerHTML =
      "<i></i><i></i><i></i>";

    line.appendChild(copy);
    line.appendChild(dots);

    bubble.appendChild(label);
    bubble.appendChild(line);
    body.appendChild(bubble);

    row.appendChild(avatar);
    row.appendChild(body);
    dom.messages.appendChild(row);

    scrollMessagesToBottom();

    return row;
  }

  function appendErrorMessage(title, detail, retryHandler) {
    const row = createMessageRow("assistant");
    row.classList.add("is-error");

    const avatar = createAssistantAvatar();
    const body = document.createElement("div");
    body.className = "nosca-message-body";

    const bubble = document.createElement("div");
    bubble.className = "nosca-message-bubble";

    const label = document.createElement("span");
    label.className = "nosca-message-label";
    label.textContent = "NOSCA";

    const heading = document.createElement("strong");
    heading.className = "nosca-error-title";
    heading.textContent = title;

    const copy = document.createElement("p");
    copy.className = "nosca-message-text";
    copy.textContent = detail;

    const retry = document.createElement("button");
    retry.type = "button";
    retry.className = "nosca-retry";
    retry.textContent = "Retry";
    retry.addEventListener("click", retryHandler);

    bubble.appendChild(label);
    bubble.appendChild(heading);
    bubble.appendChild(copy);
    bubble.appendChild(retry);
    body.appendChild(bubble);

    row.appendChild(avatar);
    row.appendChild(body);
    dom.messages.appendChild(row);
  }

  function createMessageRow(role) {
    const row = document.createElement("article");
    row.className =
      "nosca-message nosca-message--" + role;
    row.dataset.role = role;
    return row;
  }

  function createAssistantAvatar() {
    const avatar = document.createElement("span");
    avatar.className = "nosca-message-avatar";
    avatar.setAttribute("aria-hidden", "true");
    avatar.innerHTML =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
      '<rect x="4" y="7" width="16" height="14" rx="4"></rect>' +
      '<path d="M12 3v4M8 12h.01M16 12h.01M9 17h6"></path>' +
      '<circle cx="12" cy="2" r="1"></circle>' +
      '</svg>';
    return avatar;
  }

  function createSourceBlock(sources, responseMode) {
    const validSources = sources.filter(function (source) {
      return (
        source &&
        typeof source === "object" &&
        String(source.fileName || "").trim()
      );
    });

    if (!validSources.length) {
      return null;
    }

    const isLookup = responseMode === "document_lookup";

    const block = document.createElement("section");
    block.className = "nosca-sources";
    block.setAttribute(
      "aria-label",
      isLookup
        ? "Drive results"
        : "Sources used for this answer"
    );

    const heading = document.createElement("div");
    heading.className = "nosca-sources-heading";

    const title = document.createElement("span");
    title.textContent =
      (isLookup ? "Drive results · " : "Sources · ") +
      validSources.length;

    heading.appendChild(title);
    block.appendChild(heading);

    const list = document.createElement("div");
    list.className = "nosca-source-list";

    validSources.forEach(function (source) {
      const url = getSafeHttpUrl(source.driveUrl);
      const item = url
        ? document.createElement("a")
        : document.createElement("div");

      item.className = "nosca-source-card";

      const itemType =
        String(source.itemType || "File").trim();

      item.dataset.itemType =
        itemType.toLowerCase();

      if (url) {
        item.href = url;
        item.target = "_blank";
        item.rel = "noopener noreferrer";
        item.setAttribute(
          "aria-label",
          "Open " +
          itemType.toLowerCase() +
          " " +
          String(source.fileName || "")
        );
      }

      const icon = document.createElement("span");
      icon.className = "nosca-source-icon";
      icon.setAttribute("aria-hidden", "true");
      icon.innerHTML = getNoscaResultIconSvg(source);

      const copy = document.createElement("span");
      copy.className = "nosca-source-copy";

      const name = document.createElement("strong");

      if (isLookup) {
        name.textContent =
          String(source.fileName || "Drive result");
      } else {
        name.textContent =
          (source.sourceIndex
            ? "Source " + source.sourceIndex + " · "
            : "") +
          String(source.fileName || "Novare source");
      }

      const path = document.createElement("span");

      const sourceMeta = [];

      if (itemType === "Folder") {
        sourceMeta.push("Folder");
      } else {
        sourceMeta.push(
          String(source.documentType || "").trim()
        );
        sourceMeta.push(
          String(source.fileFormat || "").trim()
        );
      }

      sourceMeta.push(
        String(source.folderPath || "").trim() ||
          getReadableMimeType(source.mimeType)
      );

      path.textContent = sourceMeta
        .filter(function (value, index, array) {
          return value && array.indexOf(value) === index;
        })
        .join(" · ");

      copy.appendChild(name);
      copy.appendChild(path);

      item.appendChild(icon);
      item.appendChild(copy);

      if (url) {
        const openIcon = document.createElement("span");
        openIcon.className = "nosca-source-open";
        openIcon.setAttribute("aria-hidden", "true");
        openIcon.innerHTML =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M14 5h5v5M13 11l6-6M19 13v6H5V5h6"></path>' +
          '</svg>';
        item.appendChild(openIcon);
      }

      list.appendChild(item);
    });

    block.appendChild(list);
    return block;
  }

  function getNoscaResultIconSvg(source) {
    const itemType =
      String(source.itemType || "").toLowerCase();
    const documentType =
      String(source.documentType || "").toLowerCase();
    const format =
      String(source.fileFormat || "").toLowerCase();

    // Folder
    if (itemType === "folder") {
      return (
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M3 6.5h6l2 2h10v9.5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"></path>' +
        '<path d="M3 9h18"></path>' +
        '</svg>'
      );
    }

    // EE / spreadsheets
    if (
      documentType === "ee" ||
      documentType === "spreadsheet" ||
      format.indexOf("sheet") !== -1 ||
      format.indexOf("excel") !== -1
    ) {
      return (
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
        '<rect x="4" y="3" width="16" height="18" rx="2"></rect>' +
        '<path d="M4 9h16M9 9v12M14.5 9v12M4 15h16"></path>' +
        '</svg>'
      );
    }

    // Presentation / deck
    if (
      documentType === "presentation" ||
      format.indexOf("slides") !== -1 ||
      format.indexOf("powerpoint") !== -1
    ) {
      return (
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
        '<rect x="3" y="4" width="18" height="13" rx="2"></rect>' +
        '<path d="M8 21l4-4 4 4M8 9h8M8 13h5"></path>' +
        '</svg>'
      );
    }

    // Proposal / document
    if (
      documentType === "proposal" ||
      documentType === "document" ||
      format.indexOf("doc") !== -1 ||
      format.indexOf("word") !== -1
    ) {
      return (
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M6 3h9l4 4v14H6z"></path>' +
        '<path d="M14 3v5h5M9 12h6M9 16h6"></path>' +
        '</svg>'
      );
    }

    // PDF
    if (documentType === "pdf" || format === "pdf") {
      return (
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M6 3h9l4 4v14H6z"></path>' +
        '<path d="M14 3v5h5"></path>' +
        '<path d="M8 16h2.2a2 2 0 0 0 0-4H8v5M13 17v-5h1.5a2.5 2.5 0 0 1 0 5H13ZM18 17v-5h3"></path>' +
        '</svg>'
      );
    }

    // Generic file
    return (
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M6 3h9l4 4v14H6z"></path>' +
      '<path d="M14 3v5h5M9 13h6M9 17h6"></path>' +
      '</svg>'
    );
  }

  function createFeedbackBlock(requestId) {
    const block = document.createElement("section");
    block.className = "nosca-feedback";
    block.dataset.requestId = requestId;
    block.setAttribute(
      "aria-label",
      "Rate this Ask NOSCA response"
    );

    const top = document.createElement("div");
    top.className = "nosca-feedback-top";

    const question = document.createElement("span");
    question.className = "nosca-feedback-question";
    question.textContent = "Was this helpful?";

    const actions = document.createElement("div");
    actions.className = "nosca-feedback-actions";

    const yes = createFeedbackButton(
      true,
      "Helpful",
      '<path d="M7 10v10H4V10h3Zm4 10H8V9l4-6c.7 0 1.3.3 1.7.8.4.5.5 1.2.3 1.8L13.2 9H19c1.1 0 2 .9 2 2l-1.2 7c-.2 1.2-1.2 2-2.4 2H11Z"></path>'
    );

    const no = createFeedbackButton(
      false,
      "Not helpful",
      '<path d="M7 14V4H4v10h3Zm4-10H8v11l4 6c.7 0 1.3-.3 1.7-.8.4-.5.5-1.2.3-1.8L13.2 15H19c1.1 0 2-.9 2-2l-1.2-7c-.2-1.2-1.2-2-2.4-2H11Z"></path>'
    );

    actions.appendChild(yes);
    actions.appendChild(no);
    top.appendChild(question);
    top.appendChild(actions);

    const status = document.createElement("p");
    status.className = "nosca-feedback-status";
    status.setAttribute("role", "status");
    status.setAttribute("aria-live", "polite");

    const noteWrap = document.createElement("div");
    noteWrap.className = "nosca-feedback-note";
    noteWrap.hidden = true;

    const noteLabel = document.createElement("label");
    noteLabel.className = "nosca-feedback-note-label";
    noteLabel.textContent =
      "Optional note for the ONESCA team";

    const note = document.createElement("textarea");
    note.rows = 2;
    note.maxLength = 1000;
    note.placeholder =
      "What was useful, missing, or incorrect?";

    const saveNote = document.createElement("button");
    saveNote.type = "button";
    saveNote.className = "nosca-feedback-note-save";
    saveNote.textContent = "Save note";
    saveNote.disabled = true;

    note.addEventListener("input", function () {
      saveNote.disabled =
        !String(note.value || "").trim();
    });

    noteWrap.appendChild(noteLabel);
    noteWrap.appendChild(note);
    noteWrap.appendChild(saveNote);

    let selectedHelpful = null;

    function setPending(isPending) {
      yes.disabled = isPending;
      no.disabled = isPending;
      saveNote.disabled =
        isPending ||
        !String(note.value || "").trim();

      block.classList.toggle(
        "is-saving",
        isPending
      );
    }

    function applySelection(helpful) {
      selectedHelpful = helpful;

      yes.setAttribute(
        "aria-pressed",
        String(helpful === true)
      );
      no.setAttribute(
        "aria-pressed",
        String(helpful === false)
      );

      yes.classList.toggle(
        "is-selected",
        helpful === true
      );
      no.classList.toggle(
        "is-selected",
        helpful === false
      );
    }

    function submitRating(helpful, comment) {
      if (!isAppsScriptAvailable()) {
        status.textContent =
          "Feedback service is unavailable in this environment.";
        return;
      }

      setPending(true);
      status.textContent = "Saving feedback…";

      google.script.run
        .withSuccessHandler(function (result) {
          setPending(false);
          applySelection(helpful);
          noteWrap.hidden = false;

          status.textContent =
            result && result.commentSaved
              ? "Thanks — your feedback and note were saved."
              : "Thanks — your feedback was saved.";
        })
        .withFailureHandler(function (error) {
          setPending(false);
          status.textContent =
            "Feedback could not be saved. Please try again.";
          console.error(
            "[Ask NOSCA] Feedback error:",
            error
          );
        })
        .submitNoscaFeedback(
          requestId,
          helpful,
          String(comment || "").trim()
        );
    }

    yes.addEventListener("click", function () {
      submitRating(
        true,
        selectedHelpful === true
          ? note.value
          : ""
      );
    });

    no.addEventListener("click", function () {
      submitRating(
        false,
        selectedHelpful === false
          ? note.value
          : ""
      );
    });

    saveNote.addEventListener("click", function () {
      const comment =
        String(note.value || "").trim();

      if (selectedHelpful === null) {
        status.textContent =
          "Choose Helpful or Not helpful first.";
        return;
      }

      if (!comment) {
        note.focus();
        return;
      }

      submitRating(
        selectedHelpful,
        comment
      );
    });

    block.appendChild(top);
    block.appendChild(status);
    block.appendChild(noteWrap);

    return block;
  }

  function createFeedbackButton(
    helpful,
    label,
    iconMarkup
  ) {
    const button = document.createElement("button");
    button.type = "button";
    button.className =
      "nosca-feedback-button " +
      (
        helpful
          ? "nosca-feedback-button--yes"
          : "nosca-feedback-button--no"
      );
    button.setAttribute(
      "aria-label",
      label
    );
    button.setAttribute(
      "aria-pressed",
      "false"
    );
    button.title = label;

    button.innerHTML =
      '<svg viewBox="0 0 24 24" aria-hidden="true">' +
      iconMarkup +
      '</svg>' +
      '<span>' +
      label +
      '</span>';

    return button;
  }

  function renderSafeAnswer(container, answer) {
    const text = cleanNoscaDisplayText(answer);

    if (!text) return;

    // Safe lightweight rendering: preserve paragraphs, bullets and numbered
    // lists without ever inserting model-generated HTML.
    const blocks = text.split(/\n{2,}/);

    blocks.forEach(function (block) {
      const lines = block
        .split("\n")
        .map(function (line) {
          return line.trimEnd();
        })
        .filter(function (line) {
          return line.trim() !== "";
        });

      if (!lines.length) return;

      const isBulletGroup = lines.every(function (line) {
        return /^[-•]\s+/.test(line.trim());
      });

      if (isBulletGroup) {
        const list = document.createElement("ul");
        list.className = "nosca-answer-list";

        lines.forEach(function (line) {
          const item = document.createElement("li");
          item.textContent = line
            .trim()
            .replace(/^[-•]\s+/, "");
          list.appendChild(item);
        });

        container.appendChild(list);
        return;
      }

      const isNumberedGroup = lines.every(function (line) {
        return /^\d+[.)]\s+/.test(line.trim());
      });

      if (isNumberedGroup) {
        const list = document.createElement("ol");
        list.className =
          "nosca-answer-list nosca-answer-list--numbered";

        lines.forEach(function (line) {
          const item = document.createElement("li");
          item.textContent = line
            .trim()
            .replace(/^\d+[.)]\s+/, "");
          list.appendChild(item);
        });

        container.appendChild(list);
        return;
      }

      const paragraph = document.createElement("p");
      paragraph.textContent = lines.join("\n");
      container.appendChild(paragraph);
    });
  }

  function cleanNoscaDisplayText(value) {
    return String(value || "")
      .replace(/\r\n?/g, "\n")
      .replace(/\*\*([^*]+)\*\*/g, "$1")
      .replace(/__([^_]+)__/g, "$1")
      .replace(/`([^`\n]+)`/g, "$1")
      .replace(/^#{1,6}\s+/gm, "")
      .replace(/^\s*\*\s+/gm, "- ")
      .replace(/[ \t]+\n/g, "\n")
      .replace(/\n{3,}/g, "\n\n")
      .trim();
  }

  function sanitizeClientConversationContext(value) {
    const source =
      value && typeof value === "object"
        ? value
        : {};

    const topicTerms =
      Array.isArray(source.topicTerms)
        ? source.topicTerms
            .map(function (term) {
              return String(term || "")
                .toLowerCase()
                .replace(/[^a-z0-9+#&.\-]/g, "")
                .trim();
            })
            .filter(Boolean)
            .slice(0, 12)
        : [];

    const documentTypes =
      Array.isArray(source.documentTypes)
        ? source.documentTypes
            .map(function (type) {
              return String(type || "").trim();
            })
            .filter(Boolean)
            .slice(0, 4)
        : [];

    return {
      version: 1,
      topicTerms: topicTerms,
      topicLabel:
        String(source.topicLabel || "").slice(0, 160),
      lastIntent:
        source.lastIntent === "document_lookup"
          ? "document_lookup"
          : "knowledge",
      documentTypes: documentTypes,
      previousQuestion:
        String(source.previousQuestion || "").slice(0, 500),
      previousResolvedQuestion:
        String(
          source.previousResolvedQuestion || ""
        ).slice(0, 1000),
      updatedAt:
        String(source.updatedAt || "").slice(0, 60)
    };
  }

  function loadConversationContext() {
    try {
      const raw =
        window.sessionStorage.getItem(
          NOSCA_CONTEXT_STORAGE_KEY
        );

      if (!raw) return null;

      return sanitizeClientConversationContext(
        JSON.parse(raw)
      );
    } catch (error) {
      console.warn(
        "[Ask NOSCA] Conversation context could not be restored.",
        error
      );

      clearStoredConversationContext();
      return null;
    }
  }

  function saveConversationContext(context) {
    try {
      if (
        !context ||
        !Array.isArray(context.topicTerms) ||
        !context.topicTerms.length
      ) {
        clearStoredConversationContext();
        return;
      }

      window.sessionStorage.setItem(
        NOSCA_CONTEXT_STORAGE_KEY,
        JSON.stringify(context)
      );
    } catch (error) {
      console.warn(
        "[Ask NOSCA] Conversation context could not be saved.",
        error
      );
    }
  }

  function clearStoredConversationContext() {
    try {
      window.sessionStorage.removeItem(
        NOSCA_CONTEXT_STORAGE_KEY
      );
    } catch (error) {
      console.warn(
        "[Ask NOSCA] Conversation context could not be cleared.",
        error
      );
    }
  }

  function clearConversation() {
    if (!initialize() || state.pending) return;

    state.messages = [];
    state.conversationContext = null;
    clearStoredConversationContext();

    dom.messages
      .querySelectorAll(".nosca-message")
      .forEach(function (node) {
        node.remove();
      });

    if (dom.welcome) {
      dom.welcome.hidden = false;
    }

    dom.input.value = "";
    autoSizeComposer();
    updateComposerState();
    setStatus("", "");
    scrollMessagesToTop();

    state.unread = false;
    updateLauncherState();

    if (
      state.viewMode === "open" &&
      dom.input &&
      !dom.input.disabled
    ) {
      dom.input.focus();
    }
  }


  function loadPanelViewState() {
    try {
      const value =
        String(
          window.sessionStorage.getItem(
            NOSCA_VIEW_STORAGE_KEY
          ) || ""
        ).trim();

      return (
        value === "open" ||
        value === "minimized" ||
        value === "closed"
      )
        ? value
        : "closed";
    } catch (error) {
      return "closed";
    }
  }

  function savePanelViewState() {
    try {
      window.sessionStorage.setItem(
        NOSCA_VIEW_STORAGE_KEY,
        state.viewMode
      );
    } catch (error) {
      // The chat remains fully usable even when sessionStorage is blocked.
    }
  }

  function syncPanelAttributes() {
    if (!dom.dialog) return;

    dom.dialog.dataset.noscaView =
      state.viewMode;

    dom.dialog.setAttribute(
      "aria-hidden",
      String(!dom.dialog.open)
    );
  }

  function markUnread() {
    state.unread = true;
    updateLauncherState();
  }

  function updateLauncherState() {
    const launcher =
      dom.launcher ||
      document.getElementById(
        "nosca-launcher"
      );

    if (!launcher) return;

    const isOpen =
      state.viewMode === "open";

    const isThinking =
      state.viewMode === "minimized" &&
      state.pending;

    const hasReadyAnswer =
      !state.pending &&
      state.unread;

    launcher.classList.toggle(
      "has-unread",
      hasReadyAnswer
    );

    launcher.classList.toggle(
      "is-thinking",
      isThinking
    );

    launcher.classList.toggle(
      "is-chat-open",
      isOpen
    );

    launcher.classList.toggle(
      "is-minimized",
      state.viewMode === "minimized"
    );

    const label =
      launcher.querySelector("span");

    if (label) {
      label.textContent =
        isThinking
          ? "Thinking…"
          : (
              hasReadyAnswer
                ? "Answer ready"
                : "Ask NOSCA"
            );
    }

    launcher.setAttribute(
      "aria-expanded",
      String(isOpen)
    );

    launcher.setAttribute(
      "aria-busy",
      String(isThinking)
    );

    launcher.setAttribute(
      "aria-label",
      isThinking
        ? "Ask NOSCA is thinking"
        : (
            hasReadyAnswer
              ? "Ask NOSCA — answer ready"
              : "Ask NOSCA"
          )
    );

    launcher.title =
      isThinking
        ? "Ask NOSCA is thinking"
        : (
            hasReadyAnswer
              ? "Ask NOSCA — answer ready"
              : "Ask NOSCA"
          );
  }

  function hideWelcome() {
    if (dom.welcome) {
      dom.welcome.hidden = true;
    }
  }

  function setBusy(isBusy) {
    state.pending = Boolean(isBusy);

    if (!dom.dialog) return;

    dom.dialog.setAttribute(
      "aria-busy",
      String(state.pending)
    );

    dom.input.disabled = state.pending;
    dom.send.disabled = state.pending;

    if (dom.clear) {
      dom.clear.disabled = state.pending;
    }

    updateComposerState();

    if (
      state.pending ||
      state.viewMode !== "minimized"
    ) {
      updateLauncherState();
    }
  }

  function updateComposerState() {
    if (!dom.send || !dom.input) return;

    const hasText =
      String(dom.input.value || "").trim().length > 0;

    dom.send.disabled =
      state.pending || !hasText;
  }

  function autoSizeComposer() {
    if (!dom.input) return;

    dom.input.style.height = "auto";
    dom.input.style.height =
      Math.min(dom.input.scrollHeight, 120) + "px";
  }

  function setStatus(message, tone) {
    if (!dom.status) return;

    dom.status.textContent = String(message || "");
    dom.status.dataset.tone = tone || "";
  }

  function scrollMessagesToBottom() {
    if (!dom.messages) return;

    window.requestAnimationFrame(function () {
      dom.messages.scrollTop = dom.messages.scrollHeight;
    });
  }

  function scrollMessagesToTop() {
    if (!dom.messages) return;
    dom.messages.scrollTop = 0;
  }

  function removeNode(node) {
    if (node && node.parentNode) {
      node.parentNode.removeChild(node);
    }
  }

  function getSafeHttpUrl(value) {
    const raw = String(value || "").trim();

    if (!/^https?:\/\//i.test(raw)) {
      return "";
    }

    try {
      const url = new URL(raw);
      return url.protocol === "https:" || url.protocol === "http:"
        ? url.href
        : "";
    } catch (error) {
      return "";
    }
  }

  function getReadableMimeType(mimeType) {
    const labels = {
      "application/vnd.google-apps.document": "Google Docs",
      "application/vnd.google-apps.presentation": "Google Slides",
      "application/vnd.google-apps.spreadsheet": "Google Sheets",
      "text/plain": "Text file"
    };

    return labels[String(mimeType || "")] || "Novare knowledge source";
  }

  function getErrorMessage(error) {
    if (!error) {
      return "Please try again.";
    }

    const raw = String(
      error.message ||
      error.details ||
      error
    ).trim();

    if (!raw) {
      return "Please try again.";
    }

    // Avoid showing raw Apps Script stack traces or verbose internal details
    // inside the employee-facing chat UI.
    if (
      /GEMINI_API_KEY|Script Properties|Exception:| at /i.test(raw)
    ) {
      console.error("[Ask NOSCA] Backend error:", error);
      return "The Ask NOSCA service is temporarily unavailable. Please try again or contact the ONESCA administrator.";
    }

    return raw.slice(0, 500);
  }

  function isAppsScriptAvailable() {
    return Boolean(
      typeof google !== "undefined" &&
      google &&
      google.script &&
      google.script.run
    );
  }

  window.NexusNosca = Object.freeze({
    initialize: initialize,
    open: open,
    minimize: minimize,
    close: close,
    ask: function (question) {
      open({
        draft: String(question || ""),
        submit: true
      });
    },
    clear: clearConversation,
    isOpen: function () {
      return Boolean(
        dom.dialog &&
        dom.dialog.open &&
        state.viewMode === "open"
      );
    },
    isMinimized: function () {
      return state.viewMode === "minimized";
    },
    hasUnread: function () {
      return state.unread;
    },
    isBusy: function () {
      return state.pending;
    }
  });

  initialize();
}());
</script>
