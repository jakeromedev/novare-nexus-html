<script>
(function () {
  "use strict";

  const state = {
    initialized: false,
    pending: false,
    previousFocus: null,
    messages: []
  };

  const dom = {};

  function cacheDom() {
    dom.dialog = document.getElementById("nosca-dialog");
    dom.messages = document.getElementById("nosca-messages");
    dom.welcome = document.getElementById("nosca-welcome");
    dom.status = document.getElementById("nosca-status");
    dom.form = document.getElementById("nosca-form");
    dom.input = document.getElementById("nosca-input");
    dom.send = document.getElementById("nosca-send");
    dom.clear = document.getElementById("nosca-clear");
    dom.close = document.getElementById("nosca-close");
    dom.suggestions = Array.from(
      document.querySelectorAll("[data-nosca-suggestion]")
    );
  }

  function initialize() {
    if (state.initialized) return true;

    cacheDom();

    if (
      !dom.dialog ||
      !dom.messages ||
      !dom.form ||
      !dom.input ||
      !dom.send
    ) {
      console.warn(
        "[Ask NOSCA] Chat UI could not initialize because required elements are missing."
      );
      return false;
    }

    dom.form.addEventListener("submit", function (event) {
      event.preventDefault();
      sendCurrentQuestion();
    });

    dom.input.addEventListener("keydown", function (event) {
      if (
        event.key === "Enter" &&
        !event.shiftKey &&
        !event.isComposing
      ) {
        event.preventDefault();
        sendCurrentQuestion();
      }
    });

    dom.input.addEventListener("input", function () {
      autoSizeComposer();
      updateComposerState();
    });

    if (dom.clear) {
      dom.clear.addEventListener("click", function () {
        clearConversation();
      });
    }

    if (dom.close) {
      dom.close.addEventListener("click", function () {
        close();
      });
    }

    dom.suggestions.forEach(function (button) {
      button.addEventListener("click", function () {
        const question = String(
          button.dataset.noscaSuggestion || ""
        ).trim();

        if (!question) return;

        open({
          draft: question,
          submit: true
        });
      });
    });

    dom.dialog.addEventListener("click", function (event) {
      if (event.target === dom.dialog) {
        close();
      }
    });

    dom.dialog.addEventListener("cancel", function (event) {
      event.preventDefault();
      close();
    });

    dom.dialog.addEventListener("close", function () {
      setBusy(false);
      restoreFocus();
    });

    updateComposerState();
    autoSizeComposer();

    state.initialized = true;
    return true;
  }

  function open(options) {
    if (!initialize()) return;

    const settings =
      options && typeof options === "object"
        ? options
        : {};

    if (!dom.dialog.open) {
      state.previousFocus =
        document.activeElement instanceof HTMLElement
          ? document.activeElement
          : null;

      if (typeof dom.dialog.showModal === "function") {
        dom.dialog.showModal();
      } else {
        dom.dialog.setAttribute("open", "");
      }
    }

    if (typeof settings.draft === "string") {
      dom.input.value = settings.draft.slice(0, 2000);
      autoSizeComposer();
      updateComposerState();
    }

    window.setTimeout(function () {
      if (settings.submit) {
        sendCurrentQuestion();
      } else {
        dom.input.focus();
        dom.input.setSelectionRange(
          dom.input.value.length,
          dom.input.value.length
        );
      }
    }, 0);
  }

  function close() {
    if (!initialize()) return;

    if (dom.dialog.open && typeof dom.dialog.close === "function") {
      dom.dialog.close();
      return;
    }

    dom.dialog.removeAttribute("open");
    setBusy(false);
    restoreFocus();
  }

  function restoreFocus() {
    const target = state.previousFocus;
    state.previousFocus = null;

    if (
      target &&
      document.contains(target) &&
      typeof target.focus === "function"
    ) {
      target.focus();
      return;
    }

    const launcher = document.getElementById("nosca-launcher");
    if (launcher && typeof launcher.focus === "function") {
      launcher.focus();
    }
  }

  function sendCurrentQuestion() {
    if (!initialize() || state.pending) return;

    const question = String(dom.input.value || "")
      .replace(/\s+/g, " ")
      .trim();

    if (!question) {
      setStatus("Enter a question to get started.", "warning");
      dom.input.focus();
      return;
    }

    sendQuestion(question);
  }

  function sendQuestion(question) {
    if (!initialize() || state.pending) return;

    const normalized = String(question || "")
      .replace(/\s+/g, " ")
      .trim();

    if (!normalized) return;

    if (!isAppsScriptAvailable()) {
      setStatus(
        "Ask NOSCA backend is unavailable in this environment.",
        "error"
      );
      return;
    }

    hideWelcome();
    appendUserMessage(normalized);

    dom.input.value = "";
    autoSizeComposer();
    setStatus("", "");
    setBusy(true);

    const loadingNode = appendLoadingMessage();

    google.script.run
      .withSuccessHandler(function (result) {
        removeNode(loadingNode);
        setBusy(false);
        handleNoscaSuccess(normalized, result);
      })
      .withFailureHandler(function (error) {
        removeNode(loadingNode);
        setBusy(false);
        handleNoscaFailure(normalized, error);
      })
      .askNosca(normalized);
  }

  function handleNoscaSuccess(question, result) {
    const response =
      result && typeof result === "object"
        ? result
        : {};

    const answer = String(response.answer || "").trim();

    if (!answer) {
      handleNoscaFailure(
        question,
        new Error("Ask NOSCA returned an empty response.")
      );
      return;
    }

    appendAssistantMessage({
      requestId: String(response.requestId || "").trim(),
      answer: answer,
      grounded: response.grounded !== false,
      sources: Array.isArray(response.sources)
        ? response.sources
        : [],
      elapsedMs: Number(response.elapsedMs || 0)
    });

    state.messages.push({
      role: "assistant",
      answer: answer
    });

    setStatus("", "");
    scrollMessagesToBottom();
    dom.input.focus();
  }

  function handleNoscaFailure(question, error) {
    const message = getErrorMessage(error);

    appendErrorMessage(
      "I couldn't complete that request.",
      message,
      function () {
        sendQuestion(question);
      }
    );

    setStatus(
      "Ask NOSCA encountered an error. You can retry the question.",
      "error"
    );

    scrollMessagesToBottom();
  }

  function appendUserMessage(question) {
    state.messages.push({
      role: "user",
      question: question
    });

    const row = createMessageRow("user");
    const bubble = document.createElement("div");
    bubble.className = "nosca-message-bubble";

    const label = document.createElement("span");
    label.className = "nosca-message-label";
    label.textContent = "You";

    const text = document.createElement("p");
    text.className = "nosca-message-text";
    text.textContent = question;

    bubble.appendChild(label);
    bubble.appendChild(text);
    row.appendChild(bubble);
    dom.messages.appendChild(row);

    scrollMessagesToBottom();
  }

  function appendAssistantMessage(data) {
    const row = createMessageRow("assistant");
    const avatar = createAssistantAvatar();
    const body = document.createElement("div");
    body.className = "nosca-message-body";

    const bubble = document.createElement("div");
    bubble.className = "nosca-message-bubble";

    const label = document.createElement("span");
    label.className = "nosca-message-label";
    label.textContent = "NOSCA";

    const text = document.createElement("div");
    text.className = "nosca-message-text nosca-answer-text";
    renderSafeAnswer(text, data.answer);

    bubble.appendChild(label);
    bubble.appendChild(text);
    body.appendChild(bubble);

    if (data.grounded === false) {
      const note = document.createElement("div");
      note.className = "nosca-answer-note";
      note.textContent =
        "No sufficiently relevant approved source was found for this answer.";
      body.appendChild(note);
    }

    const sourceBlock = createSourceBlock(
      Array.isArray(data.sources) ? data.sources : []
    );

    if (sourceBlock) {
      body.appendChild(sourceBlock);
    }

    if (data.requestId) {
      body.appendChild(
        createFeedbackBlock(data.requestId)
      );
    }

    row.appendChild(avatar);
    row.appendChild(body);
    dom.messages.appendChild(row);
  }

  function appendLoadingMessage() {
    const row = createMessageRow("assistant");
    row.classList.add("is-loading");

    const avatar = createAssistantAvatar();
    const body = document.createElement("div");
    body.className = "nosca-message-body";

    const bubble = document.createElement("div");
    bubble.className = "nosca-message-bubble nosca-loading-bubble";

    const label = document.createElement("span");
    label.className = "nosca-message-label";
    label.textContent = "NOSCA";

    const line = document.createElement("div");
    line.className = "nosca-loading-line";

    const copy = document.createElement("span");
    copy.textContent = "Searching approved Novare knowledge";

    const dots = document.createElement("span");
    dots.className = "nosca-thinking-dots";
    dots.setAttribute("aria-hidden", "true");
    dots.innerHTML =
      "<i></i><i></i><i></i>";

    line.appendChild(copy);
    line.appendChild(dots);

    bubble.appendChild(label);
    bubble.appendChild(line);
    body.appendChild(bubble);

    row.appendChild(avatar);
    row.appendChild(body);
    dom.messages.appendChild(row);

    scrollMessagesToBottom();

    return row;
  }

  function appendErrorMessage(title, detail, retryHandler) {
    const row = createMessageRow("assistant");
    row.classList.add("is-error");

    const avatar = createAssistantAvatar();
    const body = document.createElement("div");
    body.className = "nosca-message-body";

    const bubble = document.createElement("div");
    bubble.className = "nosca-message-bubble";

    const label = document.createElement("span");
    label.className = "nosca-message-label";
    label.textContent = "NOSCA";

    const heading = document.createElement("strong");
    heading.className = "nosca-error-title";
    heading.textContent = title;

    const copy = document.createElement("p");
    copy.className = "nosca-message-text";
    copy.textContent = detail;

    const retry = document.createElement("button");
    retry.type = "button";
    retry.className = "nosca-retry";
    retry.textContent = "Retry";
    retry.addEventListener("click", retryHandler);

    bubble.appendChild(label);
    bubble.appendChild(heading);
    bubble.appendChild(copy);
    bubble.appendChild(retry);
    body.appendChild(bubble);

    row.appendChild(avatar);
    row.appendChild(body);
    dom.messages.appendChild(row);
  }

  function createMessageRow(role) {
    const row = document.createElement("article");
    row.className =
      "nosca-message nosca-message--" + role;
    row.dataset.role = role;
    return row;
  }

  function createAssistantAvatar() {
    const avatar = document.createElement("span");
    avatar.className = "nosca-message-avatar";
    avatar.setAttribute("aria-hidden", "true");
    avatar.innerHTML =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
      '<rect x="4" y="7" width="16" height="14" rx="4"></rect>' +
      '<path d="M12 3v4M8 12h.01M16 12h.01M9 17h6"></path>' +
      '<circle cx="12" cy="2" r="1"></circle>' +
      '</svg>';
    return avatar;
  }

  function createSourceBlock(sources) {
    const validSources = sources.filter(function (source) {
      return (
        source &&
        typeof source === "object" &&
        String(source.fileName || "").trim()
      );
    });

    if (!validSources.length) {
      return null;
    }

    const block = document.createElement("section");
    block.className = "nosca-sources";
    block.setAttribute("aria-label", "Sources used for this answer");

    const heading = document.createElement("div");
    heading.className = "nosca-sources-heading";

    const title = document.createElement("span");
    title.textContent =
      "Sources · " + validSources.length;

    heading.appendChild(title);
    block.appendChild(heading);

    const list = document.createElement("div");
    list.className = "nosca-source-list";

    validSources.forEach(function (source) {
      const url = getSafeHttpUrl(source.driveUrl);
      const item = url
        ? document.createElement("a")
        : document.createElement("div");

      item.className = "nosca-source-card";

      if (url) {
        item.href = url;
        item.target = "_blank";
        item.rel = "noopener noreferrer";
        item.setAttribute(
          "aria-label",
          "Open source " + String(source.fileName || "")
        );
      }

      const icon = document.createElement("span");
      icon.className = "nosca-source-icon";
      icon.setAttribute("aria-hidden", "true");
      icon.innerHTML =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M6 3h9l4 4v14H6z"></path>' +
        '<path d="M14 3v5h5M9 13h6M9 17h6"></path>' +
        '</svg>';

      const copy = document.createElement("span");
      copy.className = "nosca-source-copy";

      const name = document.createElement("strong");
      name.textContent =
        (source.sourceIndex
          ? "Source " + source.sourceIndex + " · "
          : "") +
        String(source.fileName || "Novare source");

      const path = document.createElement("span");
      path.textContent =
        String(source.folderPath || "").trim() ||
        getReadableMimeType(source.mimeType);

      copy.appendChild(name);
      copy.appendChild(path);

      item.appendChild(icon);
      item.appendChild(copy);

      if (url) {
        const openIcon = document.createElement("span");
        openIcon.className = "nosca-source-open";
        openIcon.setAttribute("aria-hidden", "true");
        openIcon.innerHTML =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M14 5h5v5M13 11l6-6M19 13v6H5V5h6"></path>' +
          '</svg>';
        item.appendChild(openIcon);
      }

      list.appendChild(item);
    });

    block.appendChild(list);
    return block;
  }

  function createFeedbackBlock(requestId) {
    const block = document.createElement("section");
    block.className = "nosca-feedback";
    block.dataset.requestId = requestId;
    block.setAttribute(
      "aria-label",
      "Rate this Ask NOSCA response"
    );

    const top = document.createElement("div");
    top.className = "nosca-feedback-top";

    const question = document.createElement("span");
    question.className = "nosca-feedback-question";
    question.textContent = "Was this helpful?";

    const actions = document.createElement("div");
    actions.className = "nosca-feedback-actions";

    const yes = createFeedbackButton(
      true,
      "Helpful",
      '<path d="M7 10v10H4V10h3Zm4 10H8V9l4-6c.7 0 1.3.3 1.7.8.4.5.5 1.2.3 1.8L13.2 9H19c1.1 0 2 .9 2 2l-1.2 7c-.2 1.2-1.2 2-2.4 2H11Z"></path>'
    );

    const no = createFeedbackButton(
      false,
      "Not helpful",
      '<path d="M7 14V4H4v10h3Zm4-10H8v11l4 6c.7 0 1.3-.3 1.7-.8.4-.5.5-1.2.3-1.8L13.2 15H19c1.1 0 2-.9 2-2l-1.2-7c-.2-1.2-1.2-2-2.4-2H11Z"></path>'
    );

    actions.appendChild(yes);
    actions.appendChild(no);
    top.appendChild(question);
    top.appendChild(actions);

    const status = document.createElement("p");
    status.className = "nosca-feedback-status";
    status.setAttribute("role", "status");
    status.setAttribute("aria-live", "polite");

    const noteWrap = document.createElement("div");
    noteWrap.className = "nosca-feedback-note";
    noteWrap.hidden = true;

    const noteLabel = document.createElement("label");
    noteLabel.className = "nosca-feedback-note-label";
    noteLabel.textContent =
      "Optional note for the ONESCA team";

    const note = document.createElement("textarea");
    note.rows = 2;
    note.maxLength = 1000;
    note.placeholder =
      "What was useful, missing, or incorrect?";

    const saveNote = document.createElement("button");
    saveNote.type = "button";
    saveNote.className = "nosca-feedback-note-save";
    saveNote.textContent = "Save note";
    saveNote.disabled = true;

    note.addEventListener("input", function () {
      saveNote.disabled =
        !String(note.value || "").trim();
    });

    noteWrap.appendChild(noteLabel);
    noteWrap.appendChild(note);
    noteWrap.appendChild(saveNote);

    let selectedHelpful = null;

    function setPending(isPending) {
      yes.disabled = isPending;
      no.disabled = isPending;
      saveNote.disabled =
        isPending ||
        !String(note.value || "").trim();

      block.classList.toggle(
        "is-saving",
        isPending
      );
    }

    function applySelection(helpful) {
      selectedHelpful = helpful;

      yes.setAttribute(
        "aria-pressed",
        String(helpful === true)
      );
      no.setAttribute(
        "aria-pressed",
        String(helpful === false)
      );

      yes.classList.toggle(
        "is-selected",
        helpful === true
      );
      no.classList.toggle(
        "is-selected",
        helpful === false
      );
    }

    function submitRating(helpful, comment) {
      if (!isAppsScriptAvailable()) {
        status.textContent =
          "Feedback service is unavailable in this environment.";
        return;
      }

      setPending(true);
      status.textContent = "Saving feedback…";

      google.script.run
        .withSuccessHandler(function (result) {
          setPending(false);
          applySelection(helpful);
          noteWrap.hidden = false;

          status.textContent =
            result && result.commentSaved
              ? "Thanks — your feedback and note were saved."
              : "Thanks — your feedback was saved.";
        })
        .withFailureHandler(function (error) {
          setPending(false);
          status.textContent =
            "Feedback could not be saved. Please try again.";
          console.error(
            "[Ask NOSCA] Feedback error:",
            error
          );
        })
        .submitNoscaFeedback(
          requestId,
          helpful,
          String(comment || "").trim()
        );
    }

    yes.addEventListener("click", function () {
      submitRating(
        true,
        selectedHelpful === true
          ? note.value
          : ""
      );
    });

    no.addEventListener("click", function () {
      submitRating(
        false,
        selectedHelpful === false
          ? note.value
          : ""
      );
    });

    saveNote.addEventListener("click", function () {
      const comment =
        String(note.value || "").trim();

      if (selectedHelpful === null) {
        status.textContent =
          "Choose Helpful or Not helpful first.";
        return;
      }

      if (!comment) {
        note.focus();
        return;
      }

      submitRating(
        selectedHelpful,
        comment
      );
    });

    block.appendChild(top);
    block.appendChild(status);
    block.appendChild(noteWrap);

    return block;
  }

  function createFeedbackButton(
    helpful,
    label,
    iconMarkup
  ) {
    const button = document.createElement("button");
    button.type = "button";
    button.className =
      "nosca-feedback-button " +
      (
        helpful
          ? "nosca-feedback-button--yes"
          : "nosca-feedback-button--no"
      );
    button.setAttribute(
      "aria-label",
      label
    );
    button.setAttribute(
      "aria-pressed",
      "false"
    );
    button.title = label;

    button.innerHTML =
      '<svg viewBox="0 0 24 24" aria-hidden="true">' +
      iconMarkup +
      '</svg>' +
      '<span>' +
      label +
      '</span>';

    return button;
  }

  function renderSafeAnswer(container, answer) {
    const text = String(answer || "")
      .replace(/\r\n?/g, "\n")
      .trim();

    if (!text) return;

    // Safe lightweight rendering: preserve paragraphs and common bullet
    // markers without inserting model-generated HTML.
    const blocks = text.split(/\n{2,}/);

    blocks.forEach(function (block) {
      const lines = block
        .split("\n")
        .map(function (line) {
          return line.trimEnd();
        })
        .filter(function (line) {
          return line.trim() !== "";
        });

      if (!lines.length) return;

      const isBulletGroup = lines.every(function (line) {
        return /^[-*•]\s+/.test(line.trim());
      });

      if (isBulletGroup) {
        const list = document.createElement("ul");
        list.className = "nosca-answer-list";

        lines.forEach(function (line) {
          const item = document.createElement("li");
          item.textContent = line
            .trim()
            .replace(/^[-*•]\s+/, "");
          list.appendChild(item);
        });

        container.appendChild(list);
        return;
      }

      const paragraph = document.createElement("p");
      paragraph.textContent = lines.join("\n");
      container.appendChild(paragraph);
    });
  }

  function clearConversation() {
    if (!initialize() || state.pending) return;

    state.messages = [];

    dom.messages
      .querySelectorAll(".nosca-message")
      .forEach(function (node) {
        node.remove();
      });

    if (dom.welcome) {
      dom.welcome.hidden = false;
    }

    dom.input.value = "";
    autoSizeComposer();
    updateComposerState();
    setStatus("", "");
    scrollMessagesToTop();
    dom.input.focus();
  }

  function hideWelcome() {
    if (dom.welcome) {
      dom.welcome.hidden = true;
    }
  }

  function setBusy(isBusy) {
    state.pending = Boolean(isBusy);

    if (!initialize()) return;

    dom.dialog.setAttribute(
      "aria-busy",
      String(state.pending)
    );

    dom.input.disabled = state.pending;
    dom.send.disabled = state.pending;

    if (dom.clear) {
      dom.clear.disabled = state.pending;
    }

    updateComposerState();
  }

  function updateComposerState() {
    if (!dom.send || !dom.input) return;

    const hasText =
      String(dom.input.value || "").trim().length > 0;

    dom.send.disabled =
      state.pending || !hasText;
  }

  function autoSizeComposer() {
    if (!dom.input) return;

    dom.input.style.height = "auto";
    dom.input.style.height =
      Math.min(dom.input.scrollHeight, 120) + "px";
  }

  function setStatus(message, tone) {
    if (!dom.status) return;

    dom.status.textContent = String(message || "");
    dom.status.dataset.tone = tone || "";
  }

  function scrollMessagesToBottom() {
    if (!dom.messages) return;

    window.requestAnimationFrame(function () {
      dom.messages.scrollTop = dom.messages.scrollHeight;
    });
  }

  function scrollMessagesToTop() {
    if (!dom.messages) return;
    dom.messages.scrollTop = 0;
  }

  function removeNode(node) {
    if (node && node.parentNode) {
      node.parentNode.removeChild(node);
    }
  }

  function getSafeHttpUrl(value) {
    const raw = String(value || "").trim();

    if (!/^https?:\/\//i.test(raw)) {
      return "";
    }

    try {
      const url = new URL(raw);
      return url.protocol === "https:" || url.protocol === "http:"
        ? url.href
        : "";
    } catch (error) {
      return "";
    }
  }

  function getReadableMimeType(mimeType) {
    const labels = {
      "application/vnd.google-apps.document": "Google Docs",
      "application/vnd.google-apps.presentation": "Google Slides",
      "application/vnd.google-apps.spreadsheet": "Google Sheets",
      "text/plain": "Text file"
    };

    return labels[String(mimeType || "")] || "Novare knowledge source";
  }

  function getErrorMessage(error) {
    if (!error) {
      return "Please try again.";
    }

    const raw = String(
      error.message ||
      error.details ||
      error
    ).trim();

    if (!raw) {
      return "Please try again.";
    }

    // Avoid showing raw Apps Script stack traces or verbose internal details
    // inside the employee-facing chat UI.
    if (
      /GEMINI_API_KEY|Script Properties|Exception:| at /i.test(raw)
    ) {
      console.error("[Ask NOSCA] Backend error:", error);
      return "The Ask NOSCA service is temporarily unavailable. Please try again or contact the ONESCA administrator.";
    }

    return raw.slice(0, 500);
  }

  function isAppsScriptAvailable() {
    return Boolean(
      typeof google !== "undefined" &&
      google &&
      google.script &&
      google.script.run
    );
  }

  window.NexusNosca = Object.freeze({
    initialize: initialize,
    open: open,
    close: close,
    ask: function (question) {
      open({
        draft: String(question || ""),
        submit: true
      });
    },
    clear: clearConversation,
    isOpen: function () {
      return Boolean(dom.dialog && dom.dialog.open);
    },
    isBusy: function () {
      return state.pending;
    }
  });

  initialize();
}());
</script>
