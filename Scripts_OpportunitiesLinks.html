<script>
(function () {
  "use strict";

  /*
   * ONESCA — H3 Opportunities managed-link configuration
   *
   * The Opportunities page already exposes readable
   * data-opportunities-action values. This module maps external/resource
   * actions to the existing keys already registered in 06_Assets.
   *
   * Internal UI actions such as "view-all-templates" are intentionally
   * not included here; they remain owned by Scripts.html.
   */

  const OPPORTUNITIES_LINKS =
    Object.freeze({
      // ---------------------------------------------------------
      // ENTRY POINTS
      // ---------------------------------------------------------
      "opportunity-dashboard":
        "opp-od",

      "sales-process":
        "opp-ssp",

      "customer-engagement":
        "opp-cel",

      // ---------------------------------------------------------
      // SOLUTIONING TOOLKIT
      // ---------------------------------------------------------
      "discovery-template":
        "opp-dt",

      "conceptual-strategy-template":
        "opp-cst",

      "solution-blueprint-template":
        "opp-sbt",

      "bom-estimation-template":
        "opp-bet",

      "proposal-template":
        "opp-pt",

      "sow-template":
        "opp-sowt",

      "poc-pov-template":
        "opp-poc-pov-t",

      "technical-handover-checklist":
        "opp-thc",

      // ---------------------------------------------------------
      // SALES PILLARS KNOWLEDGE REPOSITORY
      // ---------------------------------------------------------
      "sales-pillar-tudi":
        "opp-tkr",

      "sales-pillar-bfsi":
        "opp-bkr",

      "sales-pillar-cg":
        "opp-cgkr",

      // ---------------------------------------------------------
      // WIN / LOSS REPOSITORIES
      // ---------------------------------------------------------
      "win-repository":
        "opp-wr",

      "loss-repository":
        "opp-lr",

      // ---------------------------------------------------------
      // QUICK KNOWLEDGE ACCESS
      // ---------------------------------------------------------
      "account-plans":
        "opp-ap",

      "key-contacts":
        "opp-kc",

      "competitors":
        "opp-comp",

      "products-solutions":
        "opp-ps",

      "case-studies":
        "opp-cs",

      "partner-ecosystem":
        "opp-pe"
    });

  const OPPORTUNITIES_CONFIG =
    Object.freeze({
      namespace: "opportunities",
      pageLabel: "Opportunities",
      actionAttribute:
        "data-opportunities-action",
      links: OPPORTUNITIES_LINKS
    });

  function initialize(pageRoot) {
    if (
      !pageRoot ||
      !window.NexusManagedLinks
    ) {
      return;
    }

    window.NexusManagedLinks
      .initialize(
        pageRoot,
        OPPORTUNITIES_CONFIG
      );
  }

  function refresh(pageRoot) {
    if (
      !pageRoot ||
      !window.NexusManagedLinks
    ) {
      return;
    }

    window.NexusManagedLinks
      .refresh(pageRoot);
  }

  function getConfiguredLinkKeys() {
    return Object.keys(
      OPPORTUNITIES_LINKS
    ).map(function (action) {
      return OPPORTUNITIES_LINKS[action];
    });
  }

  window.NexusOpportunitiesLinks =
    Object.freeze({
      initialize: initialize,
      refresh: refresh,
      getConfiguredLinkKeys:
        getConfiguredLinkKeys
    });
}());
</script>
