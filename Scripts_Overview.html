<script>
(function () {
  "use strict";

  /*
   * ONESCA — Overview page link module
   *
   * This file owns Overview-specific link-key behavior.
   * Later, the Google Sheet fetching/binding logic for Overview
   * can be added here without growing the global Scripts.html.
   *
   * data-link-key is the single key that will match the Google Sheet.
   * data-overview-action remains only for the page's existing
   * placeholder/internal action behavior.
   */

  const OVERVIEW_LINK_KEYS = Object.freeze({
    "about-novare": "ov-an-open",
    "corporate-overview": "ov-co",
    "novare-solution-groups": "ov-nsg",
    "accounts-industry-focus": "ov-aif",
    "partner-ecosystem": "ov-pe",
    "corporate-pitchbook": "ov-cpb",

    "about-sca": "ov-asca-open",
    "charter-mandate": "ov-cm",
    "strategy-practice-vision": "ov-spv",
    "presales-operating-model": "ov-psom",
    "organization-roles": "ov-or",
    "ways-of-working": "ov-wow",
    "performance-okrs": "ov-pokr",
    "sca-general-guidelines": "ov-scagg",

    "directories": "ov-dir-open",
    "sca-directory": "ov-scad",
    "accounts-directory": "ov-ad",
    "partners-directory": "ov-pd",

    "experience-overview-video": "ov-eov",

    "cx": "ov-cx",
    "api": "ov-api",

    "intelligence-overview-video": "ov-iov",

    "data": "ov-data",
    "cloud": "ov-cloud",

    "modernization-overview-video": "ov-mov",

    "edge": "ov-edge",
    "infra": "ov-infra",
    "netsec": "ov-netsec"
  });

  function applyLinkKeys(pageRoot) {
    if (!pageRoot) return;

    pageRoot.querySelectorAll("[data-overview-action]").forEach(function (element) {
      const action = String(element.dataset.overviewAction || "").trim();
      const linkKey = OVERVIEW_LINK_KEYS[action];

      if (linkKey) {
        element.dataset.linkKey = linkKey;
      }
    });
  }

  function getLinkKeyForAction(action) {
    return OVERVIEW_LINK_KEYS[String(action || "").trim()] || "";
  }

  function getConfiguredLinkKeys() {
    return Object.values(OVERVIEW_LINK_KEYS);
  }

  const OVERVIEW_VIDEO_KEYS = new Set([
    "ov-eov",
    "ov-iov",
    "ov-mov"
  ]);

  const state = {
    links: Object.create(null),
    loaded: false,
    loading: false,
    missing: [],
    duplicates: [],
    invalid: [],
    activeRoot: null,
    meta: {
      connected: false,
      spreadsheetId: "",
      sheetName: "",
      rowsScanned: 0,
      requestedCount: 0,
      matchedCount: 0
    }
  };

  function ensureLinkLoader(pageRoot) {
    if (!pageRoot) return null;

    let loader = pageRoot.querySelector(
      "[data-overview-link-loader]"
    );

    if (loader) return loader;

    loader = document.createElement("div");
    loader.className = "overview-link-loader";
    loader.dataset.overviewLinkLoader = "true";
    loader.setAttribute("role", "status");
    loader.setAttribute("aria-live", "polite");
    loader.setAttribute("aria-label", "Loading OneSCA resource links");

    loader.innerHTML =
      '<div class="overview-link-loader-card">' +
        '<div class="overview-link-loader-mark" aria-hidden="true">' +
          '<span class="overview-link-loader-ring"></span>' +
          '<svg viewBox="0 0 24 24">' +
            '<path d="M7.5 12h9"></path>' +
            '<path d="m13 8.5 3.5 3.5-3.5 3.5"></path>' +
          '</svg>' +
        '</div>' +
        '<p class="overview-link-loader-eyebrow">ONESCA RESOURCES</p>' +
        '<h2>Preparing your resources</h2>' +
        '<p class="overview-link-loader-copy">' +
          'Connecting to the latest approved links. This will only take a moment.' +
        '</p>' +
        '<div class="overview-link-loader-dots" aria-hidden="true">' +
          '<span></span><span></span><span></span>' +
        '</div>' +
      '</div>';

    pageRoot.appendChild(loader);

    return loader;
  }

  function showLinkLoader(pageRoot) {
    if (!pageRoot) return;

    const loader = ensureLinkLoader(pageRoot);

    state.activeRoot = pageRoot;
    pageRoot.classList.add("is-managed-links-loading");
    pageRoot.setAttribute("aria-busy", "true");

    if (!loader) return;

    loader.hidden = false;

    window.requestAnimationFrame(function () {
      loader.classList.add("is-visible");
    });
  }

  function hideLinkLoader(pageRoot) {
    if (!pageRoot) return;

    const loader = pageRoot.querySelector(
      "[data-overview-link-loader]"
    );

    pageRoot.classList.remove("is-managed-links-loading");
    pageRoot.removeAttribute("aria-busy");

    if (!loader) return;

    loader.classList.remove("is-visible");

    window.setTimeout(function () {
      if (!pageRoot.classList.contains("is-managed-links-loading")) {
        loader.hidden = true;
      }
    }, 180);
  }

  function normalizeServerResponse(response) {
    const source = response && typeof response === "object" ? response : {};
    const sourceLinks =
      source.links && typeof source.links === "object"
        ? source.links
        : {};

    const links = Object.create(null);

    Object.keys(sourceLinks).forEach(function (key) {
      const url = String(sourceLinks[key] || "").trim();

      if (/^https?:\/\/\S+$/i.test(url)) {
        links[key] = url;
      }
    });

    const sourceMeta =
      source.meta && typeof source.meta === "object"
        ? source.meta
        : {};

    return {
      links: links,
      missing: Array.isArray(source.missing) ? source.missing.slice() : [],
      duplicates: Array.isArray(source.duplicates) ? source.duplicates.slice() : [],
      invalid: Array.isArray(source.invalid) ? source.invalid.slice() : [],
      meta: {
        connected: sourceMeta.connected === true,
        spreadsheetId: String(sourceMeta.spreadsheetId || ""),
        sheetName: String(sourceMeta.sheetName || ""),
        rowsScanned: Number(sourceMeta.rowsScanned || 0),
        requestedCount: Number(sourceMeta.requestedCount || 0),
        matchedCount: Number(sourceMeta.matchedCount || 0)
      }
    };
  }

  function fetchLinks(pageRoot) {
    if (!pageRoot) return;

    showLinkLoader(pageRoot);

    if (state.loading) {
      state.activeRoot = pageRoot;
      return;
    }

    const requestedKeys = getConfiguredLinkKeys();

    state.loading = true;
    state.activeRoot = pageRoot;

    console.info(
      "[ONESCA Overview] Connecting to Google Sheet link registry...",
      {
        sheet: "06_Assets",
        keyColumn: "B",
        urlColumn: "I",
        requestedKeys: requestedKeys.length
      }
    );

    google.script.run
      .withSuccessHandler(function (response) {
        const normalized = normalizeServerResponse(response);

        state.links = normalized.links;
        state.missing = normalized.missing;
        state.duplicates = normalized.duplicates;
        state.invalid = normalized.invalid;
        state.meta = normalized.meta;
        state.loaded = true;
        state.loading = false;

        if (state.meta.connected) {
          console.info(
            "✅ [ONESCA Overview] Google Sheet connected successfully.",
            {
              spreadsheetId: state.meta.spreadsheetId,
              sheet: state.meta.sheetName,
              rowsScanned: state.meta.rowsScanned,
              requestedKeys: state.meta.requestedCount,
              matchedLinks: state.meta.matchedCount,
              missingLinks: state.missing.length,
              duplicateKeys: state.duplicates.length,
              invalidUrls: state.invalid.length
            }
          );
        } else {
          console.warn(
            "⚠️ [ONESCA Overview] Link request completed, but no real Google Sheet connection was reported."
          );
        }

        if (state.missing.length) {
          console.warn(
            "[ONESCA Overview] No usable URL was returned for these keys:",
            state.missing
          );
        }

        const resolvedRoot = state.activeRoot || pageRoot;

        applyResolvedState(resolvedRoot);
        hideLinkLoader(resolvedRoot);

        if (state.duplicates.length) {
          console.warn(
            "[ONESCA Overview] Duplicate link keys found in 06_Assets:",
            state.duplicates
          );
        }

        if (state.invalid.length) {
          console.warn(
            "[ONESCA Overview] Invalid link URLs found in 06_Assets:",
            state.invalid
          );
        }
      })
      .withFailureHandler(function (error) {
        state.loading = false;
        state.loaded = false;

        const resolvedRoot = state.activeRoot || pageRoot;
        hideLinkLoader(resolvedRoot);

        console.error(
          "❌ [ONESCA Overview] Google Sheet connection failed.",
          error
        );
      })
      .getManagedLinks(requestedKeys);
  }

  function applyResolvedState(pageRoot) {
    if (!pageRoot) return;

    pageRoot.querySelectorAll("[data-link-key]").forEach(function (element) {
      const key = String(element.dataset.linkKey || "").trim();
      const url = state.links[key] || "";

      if (url) {
        element.dataset.managedLinkReady = "true";
        element.removeAttribute("data-managed-link-missing");
      } else {
        delete element.dataset.managedLinkReady;
        element.dataset.managedLinkMissing = "true";
      }
    });
  }

  function getUrl(linkKey) {
    const key = String(linkKey || "").trim();
    return state.links[key] || "";
  }

  function getTriggerLabel(trigger) {
    if (!trigger) return "This resource";

    const ariaLabel = String(
      trigger.getAttribute("aria-label") || ""
    ).trim();

    if (ariaLabel) {
      return ariaLabel
        .replace(/^Open\s+/i, "")
        .replace(/^View\s+/i, "")
        .trim();
    }

    const text = String(trigger.textContent || "")
      .replace(/\s+/g, " ")
      .trim();

    return text || "This resource";
  }

  function ensureComingSoonDialog() {
    let dialog = document.getElementById(
      "overview-managed-link-coming-soon"
    );

    if (dialog) return dialog;

    dialog = document.createElement("dialog");
    dialog.id = "overview-managed-link-coming-soon";
    dialog.className = "overview-coming-soon-dialog";
    dialog.setAttribute(
      "aria-labelledby",
      "overview-coming-soon-title"
    );
    dialog.setAttribute(
      "aria-describedby",
      "overview-coming-soon-message"
    );

    dialog.innerHTML =
      '<div class="overview-coming-soon-card">' +
        '<button class="overview-coming-soon-close" type="button" ' +
          'data-overview-coming-soon-close aria-label="Close">' +
          '<svg viewBox="0 0 24 24" aria-hidden="true">' +
            '<path d="M6 6l12 12M18 6L6 18"></path>' +
          '</svg>' +
        '</button>' +

        '<div class="overview-coming-soon-icon" aria-hidden="true">' +
          '<svg viewBox="0 0 24 24">' +
            '<path d="M12 3l1.85 4.15L18 9l-4.15 1.85L12 15l-1.85-4.15L6 9l4.15-1.85L12 3Z"></path>' +
            '<path d="M18.5 14.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9.9-2.1Z"></path>' +
          '</svg>' +
        '</div>' +

        '<p class="overview-coming-soon-eyebrow">COMING SOON</p>' +
        '<h2 id="overview-coming-soon-title">Something great is on the way.</h2>' +
        '<p id="overview-coming-soon-resource" class="overview-coming-soon-resource"></p>' +
        '<p id="overview-coming-soon-message" class="overview-coming-soon-message">' +
          'We’re preparing the latest approved resource for OneSCA so you get the best, most up-to-date material. Check back soon!' +
        '</p>' +

        '<button class="overview-coming-soon-action" type="button" ' +
          'data-overview-coming-soon-close>' +
          'Got it — I’ll check back' +
        '</button>' +
      '</div>';

    dialog
      .querySelectorAll("[data-overview-coming-soon-close]")
      .forEach(function (button) {
        button.addEventListener("click", function () {
          dialog.close();
        });
      });

    dialog.addEventListener("click", function (event) {
      if (event.target === dialog) {
        dialog.close();
      }
    });

    document.body.appendChild(dialog);

    return dialog;
  }

  function showComingSoonDialog(trigger) {
    const dialog = ensureComingSoonDialog();
    const resource = dialog.querySelector(
      "#overview-coming-soon-resource"
    );
    const label = getTriggerLabel(trigger);

    if (resource) {
      resource.textContent =
        label === "This resource"
          ? "This resource is getting ready for launch."
          : label + " is getting ready for launch.";
    }

    if (typeof dialog.showModal === "function") {
      if (!dialog.open) {
        dialog.showModal();
      }
      return;
    }

    dialog.setAttribute("open", "");
  }

  function isOverviewVideoKey(linkKey) {
    return OVERVIEW_VIDEO_KEYS.has(
      String(linkKey || "").trim()
    );
  }

  function getGoogleDriveFileId(url) {
    const value = String(url || "").trim();

    if (!value) return "";

    const filePathMatch = value.match(
      /drive\.google\.com\/file\/d\/([^/?#]+)/i
    );

    if (filePathMatch && filePathMatch[1]) {
      return filePathMatch[1];
    }

    const queryMatch = value.match(
      /[?&]id=([^&#]+)/i
    );

    if (queryMatch && queryMatch[1]) {
      return queryMatch[1];
    }

    return "";
  }

  function getGoogleDrivePreviewUrl(url) {
    const fileId = getGoogleDriveFileId(url);

    if (!fileId) return "";

    return (
      "https://drive.google.com/file/d/" +
      encodeURIComponent(fileId) +
      "/preview"
    );
  }

  function ensureVideoDialog() {
    let dialog = document.getElementById(
      "overview-video-player-dialog"
    );

    if (dialog) return dialog;

    dialog = document.createElement("dialog");
    dialog.id = "overview-video-player-dialog";
    dialog.className = "overview-video-dialog";
    dialog.setAttribute(
      "aria-labelledby",
      "overview-video-dialog-title"
    );

    dialog.innerHTML =
      '<div class="overview-video-dialog-shell">' +
        '<div class="overview-video-dialog-header">' +
          '<div class="overview-video-dialog-heading">' +
            '<p class="overview-video-dialog-eyebrow">ONESCA OVERVIEW</p>' +
            '<h2 id="overview-video-dialog-title">Overview Video</h2>' +
          '</div>' +
          '<button class="overview-video-dialog-close" type="button" ' +
            'data-overview-video-close aria-label="Close video player">' +
            '<svg viewBox="0 0 24 24" aria-hidden="true">' +
              '<path d="M6 6l12 12M18 6L6 18"></path>' +
            '</svg>' +
          '</button>' +
        '</div>' +

        '<div class="overview-video-frame-wrap">' +
          '<iframe ' +
            'class="overview-video-frame" ' +
            'title="OneSCA Overview Video" ' +
            'src="about:blank" ' +
            'allow="autoplay; fullscreen; encrypted-media; picture-in-picture" ' +
            'allowfullscreen>' +
          '</iframe>' +
        '</div>' +

        '<div class="overview-video-dialog-footer">' +
          '<span class="overview-video-dialog-note">' +
            'Playing securely from Google Drive' +
          '</span>' +
        '</div>' +
      '</div>';

    dialog
      .querySelector("[data-overview-video-close]")
      .addEventListener("click", function () {
        dialog.close();
      });

    dialog.addEventListener("click", function (event) {
      if (event.target === dialog) {
        dialog.close();
      }
    });

    dialog.addEventListener("close", function () {
      const frame = dialog.querySelector(
        ".overview-video-frame"
      );

      if (frame) {
        // Unload the Drive player so audio/video stops immediately.
        frame.src = "about:blank";
      }
    });

    document.body.appendChild(dialog);

    return dialog;
  }

  function openOverviewVideo(url, trigger) {
    const previewUrl = getGoogleDrivePreviewUrl(url);

    // If a future video URL is not a recognizable Google Drive file URL,
    // preserve access by falling back to the normal new-tab behavior.
    if (!previewUrl) {
      console.warn(
        "[ONESCA Overview] Video link is not a recognized Google Drive file URL. Opening in a new tab instead.",
        url
      );

      window.open(
        url,
        "_blank",
        "noopener,noreferrer"
      );

      return;
    }

    const dialog = ensureVideoDialog();
    const frame = dialog.querySelector(
      ".overview-video-frame"
    );
    const title = dialog.querySelector(
      "#overview-video-dialog-title"
    );
    const label = getTriggerLabel(trigger)
      .replace(/\s*[–—-]?\s*Watch Overview Video\s*$/i, "")
      .trim();

    if (title) {
      title.textContent =
        label && label !== "This resource"
          ? label
          : "Overview Video";
    }

    if (frame) {
      frame.title =
        (title ? title.textContent : "Overview Video") +
        " — Google Drive video player";

      frame.src = previewUrl;
    }

    if (typeof dialog.showModal === "function") {
      if (!dialog.open) {
        dialog.showModal();
      }
      return;
    }

    dialog.setAttribute("open", "");
  }

  function handleManagedLinkClick(event, pageRoot) {
    const trigger = event.target.closest("[data-link-key]");

    if (!trigger || !pageRoot.contains(trigger)) {
      return;
    }

    const linkKey = String(trigger.dataset.linkKey || "").trim();
    const url = getUrl(linkKey);

    if (!url) {
      // Only treat it as "coming soon" after the Sheet request has
      // completed successfully enough to establish the managed-link state.
      // If fetching failed, keep the existing Overview fallback behavior.
      if (state.loaded) {
        event.preventDefault();
        event.stopPropagation();
        showComingSoonDialog(trigger);
      }

      return;
    }

    event.preventDefault();
    event.stopPropagation();

    if (isOverviewVideoKey(linkKey)) {
      openOverviewVideo(url, trigger);
      return;
    }

    window.open(
      url,
      "_blank",
      "noopener,noreferrer"
    );
  }

  function bindManagedLinkClicks(pageRoot) {
    if (
      !pageRoot ||
      pageRoot.dataset.overviewManagedLinksBound === "true"
    ) {
      return;
    }

    // Capture phase lets a resolved managed link run before the existing
    // Overview placeholder click handler in the global Scripts.html.
    pageRoot.addEventListener(
      "click",
      function (event) {
        handleManagedLinkClick(event, pageRoot);
      },
      true
    );

    pageRoot.dataset.overviewManagedLinksBound = "true";
  }

  function initialize(pageRoot) {
    if (!pageRoot) return;

    applyLinkKeys(pageRoot);
    bindManagedLinkClicks(pageRoot);

    if (state.loaded) {
      applyResolvedState(pageRoot);
      hideLinkLoader(pageRoot);
      return;
    }

    showLinkLoader(pageRoot);
    fetchLinks(pageRoot);
  }

  window.NexusOverviewLinks = Object.freeze({
    initialize: initialize,
    applyLinkKeys: applyLinkKeys,
    getLinkKeyForAction: getLinkKeyForAction,
    getConfiguredLinkKeys: getConfiguredLinkKeys,
    getUrl: getUrl,
    fetchLinks: fetchLinks,
    isVideoKey: isOverviewVideoKey,
    getDrivePreviewUrl: getGoogleDrivePreviewUrl
  });
}());
</script>
