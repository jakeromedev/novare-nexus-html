<style>
    /* 1. DESIGN TOKENS */
    :root {
      color-scheme: light;
      --navy-950: #001126;
      --navy-900: #01172F;
      --navy-850: #031B3D;
      --blue-700: #004ECF;
      --blue-600: #0068F5;
      --blue-500: #0785FF;
      --cyan-500: #00CFE8;
      --cyan-400: #13E1E1;
      --cyan-300: #55E8F2;
      --page-bg: #F5FAFE;
      --surface: #FFFFFF;
      --surface-soft: #F3F8FC;
      --surface-blue: #EAF6FD;
      --border-light: #D8E9F5;
      --border-blue: #BFDDF4;
      --text-primary: #071B4B;
      --text-secondary: #526987;
      --text-muted: #7185A0;
      --accent-purple: #742CE8;
      --accent-orange: #FF861F;
      --accent-green: #13BF85;
      --accent-red: #F04B4B;
      --sidebar-width: 235px;
      --topbar-height: 72px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-card: 14px;
      --radius-pill: 999px;
      --shadow-sm: 0 2px 8px rgb(7 27 75 / 5%);
      --shadow-md: 0 8px 24px rgb(7 27 75 / 8%);
      --content-padding: clamp(20px, 3vw, 48px);
    }

    /* 2. RESET / BASE */
    [hidden] { display: none !important; }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", "Arial", sans-serif;
      font-size: 1rem;
      line-height: 1.5;
      color: var(--text-primary);
      background: var(--page-bg);
    }
    button, input, select, textarea { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    a { color: var(--blue-700); }
    h1, h2, p { margin: 0; }
    svg { display: block; flex-shrink: 0; }
    :focus-visible {
      outline: 3px solid var(--blue-600);
      outline-offset: 4px;
    }
    .skip-link {
      position: absolute;
      z-index: 10;
      top: 12px;
      left: 12px;
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      background: var(--surface);
      transform: translateY(-180%);
    }
    .skip-link:focus { transform: translateY(0); }

    .button, .icon-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      border: 1px solid var(--border-blue);
      border-radius: var(--radius-sm);
      padding: 10px 16px;
      color: var(--text-primary);
      background: var(--surface);
      font-size: .875rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }
    .button:hover, .icon-button:hover { background: var(--surface-blue); }
    .button--primary { color: var(--surface); background: var(--blue-700); border-color: var(--blue-700); }
    .button--primary:hover { background: var(--blue-600); }
    .icon-button { width: 44px; padding: 10px; flex-shrink: 0; }
    .button:disabled, .icon-button:disabled { opacity: .5; cursor: not-allowed; }
    .card { padding: 24px; border: 1px solid var(--border-light); border-radius: var(--radius-card); background: var(--surface); }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border: 1px solid var(--border-blue);
      border-radius: var(--radius-pill);
      color: var(--blue-700);
      background: var(--surface-blue);
      font-size: .75rem;
      font-weight: 600;
    }
    .divider { width: 100%; height: 1px; margin: 16px 0; border: 0; background: var(--border-light); }
    .shadow-sm { box-shadow: var(--shadow-sm); }
    .shadow-md { box-shadow: var(--shadow-md); }
    .section-label { font-size: .6875rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }

    /* Reserved controls have no backend behavior yet. */
    [aria-disabled="true"] { cursor: default; }

    /* 3. APP LAYOUT */
    #nexus-app {
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
      min-height: 100vh;
    }
    #nexus-workspace { position: relative; display: flex; flex-direction: column; min-width: 0; }
    #nexus-content { flex: 1; min-width: 0; overflow-wrap: anywhere; }

    /* 4. SIDEBAR */
    #nexus-sidebar {
      position: sticky;
      top: 0;
      align-self: start;
      height: 100vh;
      height: 100dvh;
      overflow: visible;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
      padding: 8px 16px 14px;
      color: var(--surface);
      background:
        radial-gradient(circle at 50% 0%, rgb(0 199 255 / 12%), transparent 28%),
        linear-gradient(180deg, #02112C 0%, #041B43 38%, #031538 100%);
      border-right: 1px solid rgb(121 183 255 / 12%);
      box-shadow: inset -1px 0 0 rgb(255 255 255 / 3%), 10px 0 24px rgb(1 11 32 / 26%);
      z-index: 5;
    }
    .sidebar-scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: visible; padding: 0 6px 64px; margin: 0 -6px; display: flex; flex-direction: column; gap: 8px; scrollbar-width: thin; }
    .sidebar-scroll::-webkit-scrollbar { width: 6px; }
    .sidebar-scroll::-webkit-scrollbar-track { background: transparent; }
    .sidebar-scroll::-webkit-scrollbar-thumb { background: rgb(203 224 244 / 34%); border-radius: 999px; }
    .sidebar-label { color: rgb(255 255 255 / 78%); font-size: .75rem; text-transform: uppercase; letter-spacing: .18em; font-weight: 700; }
    #nexus-sidebar :focus-visible { outline-color: var(--cyan-300); }

    /* 5. NAVIGATION */
    .nav-row {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 42px;
      width: 100%;
      padding: 8px 12px;
      border: 1px solid transparent;
      border-radius: 14px;
      color: var(--border-light);
      background: transparent;
      text-align: left;
      text-decoration: none;
      font-size: .86rem;
      font-weight: 500;
      transition: background .18s ease, border-color .18s ease, box-shadow .18s ease, color .18s ease;
    }
    a.nav-row:hover, button.nav-row:hover { background: rgb(7 133 255 / 12%); color: var(--surface); }
    .nav-row.is-active, .nav-row[aria-current="page"] {
      color: var(--surface);
      background: linear-gradient(90deg, rgb(9 82 226 / 94%), rgb(12 113 255 / 84%) 52%, rgb(8 96 255 / 72%) 100%);
      border-color: rgb(58 224 255 / 80%);
      box-shadow: 0 0 0 1px rgb(49 221 255 / 36%) inset, 0 0 18px rgb(0 194 255 / 45%), inset 0 0 18px rgb(181 241 255 / 14%);
    }
    .sidebar-nav { display: grid; gap: 1px; }
    .sidebar-nav .sidebar-label { padding: 10px 8px 4px; }
    .sidebar-nav .divider { margin: 6px 8px 8px; background: rgb(191 221 244 / 22%); }
    .sidebar-nav .nav-row svg { width: 18px; height: 18px; }

    /* 6. TOPBAR */
    #nexus-nav-header {
      position: sticky;
      top: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: var(--topbar-height);
      padding: 14px 24px;
      border-bottom: 1px solid var(--border-light);
      background: rgb(255 255 255 / 92%);
      box-shadow: 0 8px 22px rgb(7 27 75 / 5%);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    /* 7. SEARCH */
    .global-search {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1 1 360px;
      max-width: 680px;
      min-width: 0;
      height: 44px;
      padding: 0 12px;
      border: 1px solid var(--border-blue);
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      background: var(--surface);
    }
    .global-search:focus-within { border-color: var(--blue-600); box-shadow: 0 0 0 3px rgb(0 207 232 / 16%); }
    .global-search input { width: 100%; min-width: 0; border: 0; padding: 0; color: var(--text-primary); background: transparent; font-size: .8125rem; }
    .global-search input:focus { outline: none; }
    .global-search input::placeholder { color: var(--text-secondary); opacity: 1; }
    .search-keycap { flex-shrink: 0; padding: 2px 5px; border: 1px solid var(--border-light); border-radius: 4px; font: .75rem "Inter", "Arial", sans-serif; white-space: nowrap; }
    .search-filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
    .filter-chip { min-height: 32px; padding: 5px 12px; color: var(--text-secondary); background: var(--surface); }
    .filter-chip[aria-pressed="true"] { color: var(--blue-700); border-color: var(--blue-500); background: var(--surface-blue); }

    /* 8. USER CONTROLS */
    .topbar-controls { display: flex; align-items: center; gap: 4px; }
    .topbar-controls > .icon-button { position: relative; border-color: transparent; background: transparent; color: var(--text-secondary); }
    .topbar-controls > .icon-button:hover { background: var(--surface-blue); }
    .notification-dot { position: absolute; top: 9px; right: 10px; width: 7px; height: 7px; border: 1px solid var(--surface); border-radius: 50%; background: var(--accent-red); }
    .user-profile { display: flex; align-items: center; gap: 10px; margin-left: 8px; padding-left: 16px; border-left: 1px solid var(--border-light); }
    .user-details { display: grid; }
    .user-name { font-size: .875rem; font-weight: 600; white-space: nowrap; }
    .user-department { font-size: .75rem; color: var(--text-secondary); }

    /* 9. PAGE CONTAINER */
    .page-container { padding: var(--content-padding); }
    .page-development-placeholder { padding-block: 12px 40px; }
    .page-development-placeholder .section-label { color: var(--blue-700); }
    .page-development-placeholder h1 {
      margin-top: 10px;
      font-size: clamp(1.75rem, 3vw, 2.5rem);
      font-weight: 600;
      letter-spacing: -.035em;
      line-height: 1.2;
    }
    .page-development-placeholder p { margin-top: 16px; color: var(--text-secondary); }

    /* 10. ASK NOSCA */
    .nosca-launcher {
      position: absolute;
      right: -34px;
      bottom: 16px;
      z-index: 6;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 11px 16px;
      min-width: 162px;
      min-height: 50px;
      border: 1px solid rgb(96 238 255 / 55%);
      border-radius: var(--radius-pill);
      color: var(--surface);
      background: linear-gradient(90deg, #18D1F0 0%, #168CFF 46%, #2553EC 100%);
      box-shadow: 0 12px 28px rgb(0 72 173 / 42%), 0 0 0 1px rgb(255 255 255 / 8%) inset;
    }
    .nosca-launcher svg { flex-shrink: 0; }
    .nosca-launcher span { font-size: .95rem; font-weight: 700; white-space: nowrap; }
    .nosca-launcher:hover { background: linear-gradient(90deg, #23D7F2 0%, #2496FF 46%, #2E5AF0 100%); }
    .nosca-dialog { width: min(440px, calc(100% - 32px)); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); padding: 28px; border-color: var(--border-blue); color: var(--text-primary); overflow-wrap: anywhere; }
    .nosca-dialog::backdrop { background: rgb(0 17 38 / 60%); }
    .nosca-dialog h2 { font-size: 1.25rem; }
    .nosca-dialog p { margin-top: 12px; color: var(--text-secondary); }
    .nosca-dialog form { margin-top: 24px; text-align: right; }

    /* 11. PLACEHOLDERS */
    .image-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      overflow: hidden;
      padding: 12px;
      border: 1px dashed var(--border-blue);
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      background: linear-gradient(135deg, var(--surface-blue), var(--surface-soft));
      text-align: center;
      font-size: .75rem;
      overflow-wrap: anywhere;
    }
    .sidebar-brand {
      position: sticky;
      top: 0;
      z-index: 8;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 72px;
      flex-shrink: 0;
      overflow: hidden;
      padding: 0;
      margin: 0;
      background: transparent;
    }
    .sidebar-brand::before,
    .sidebar-brand::after { content: none; }
    .sidebar-logo {
      display: block;
      width: 100%;
      height: auto;
      max-width: none;
      max-height: none;
      object-fit: contain;
      object-position: center;
      filter: none;
    }

    .sidebar-logo-fallback {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      color: #FFFFFF;
      line-height: 1;
      white-space: nowrap;
    }
    .sidebar-logo-fallback-brand { font-size: .72rem; font-weight: 800; letter-spacing: .12em; }
    .sidebar-logo-fallback-divider { color: var(--cyan-300); opacity: .85; }
    .sidebar-logo-fallback-name { font-size: 1.05rem; font-weight: 750; letter-spacing: .08em; }

    .avatar-placeholder { width: 38px; height: 38px; padding: 0; flex-shrink: 0; border-radius: var(--radius-pill); color: var(--blue-700); font-weight: 600; }

    /* HOME TOP AREA — references/home-banner.png is the visual source. */
    .home-page {
      --home-navy: #061C54; --home-cobalt: #0755E8; --home-electric-blue: #008BFF; --home-cyan: #00D4F0;
      --home-page-bg: #F4FAFE; --home-white: #FFFFFF; --home-soft-blue: #EDF7FD; --home-border: #D7E8F5;
      --quick-blue: #168BFF; --quick-orange: #FF8A24; --quick-purple: #6F35E8; --quick-green: #13C98A;
      width: 100%; padding: 0 0 28px; color: var(--home-navy); background: var(--home-page-bg);
    }
    /* Desktop masthead: the hero starts at the top of the workspace and the global search floats above it. */
    .home-hero {
      position: relative; isolation: isolate; overflow: hidden; display: flex; align-items: center;
      min-height: 468px; padding: 126px 54px 104px; border-radius: 0; background: #E4F4FF;
    }
    .home-hero-copy { position: relative; z-index: 2; width: 42%; max-width: 650px; }
    .home-welcome { color: #0052D9; font-size: clamp(1.5rem, 2vw, 2rem); font-weight: 600; line-height: 1.2; }
    .home-hero h1 { margin: 2px 0 12px; font-size: clamp(3.65rem, 4.45vw, 4.55rem); font-weight: 750; line-height: 1.03; letter-spacing: -.055em; color: #061E85; white-space: nowrap; }
    .home-title-nexus { color: #008BFF; }
    @supports (background-clip: text) {
      .home-title-nexus { background: linear-gradient(110deg, #054CEF 10%, #008EFF 65%, #00D4D8); background-clip: text; -webkit-background-clip: text; color: transparent; }
      .home-title-accent { background: linear-gradient(130deg, #00C8D6 10%, #00D29A 45%, #FFD332 49%, #FF861F 75%); background-clip: text; -webkit-background-clip: text; color: transparent; }
    }
    .home-description { max-width: 430px; font-size: clamp(.875rem, 1.14vw, 1.0625rem); line-height: 1.3; color: #244675; }
    .home-tagline { display: flex; align-items: center; gap: 14px; margin-top: 20px; font-size: clamp(.8125rem, 1.08vw, 1rem); font-weight: 600; color: #0755CF; }
    .home-tagline::before { content: ""; width: 38px; height: 3px; flex-shrink: 0; background: linear-gradient(90deg, #0755E8, #00D4F0); }
    .home-hero-media { position: absolute; inset: 0; z-index: -1; overflow: hidden; }
    .home-hero-media::after {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background:
        linear-gradient(90deg, rgb(244 250 254 / 90%), rgb(240 249 255 / 66%) 21%, rgb(232 247 255 / 12%) 38%, transparent 49%),
        linear-gradient(90deg, transparent 70%, rgb(0 29 88 / 14%) 82%, rgb(0 29 88 / 34%));
    }
    .home-hero-image { position: absolute; inset: 0; display: block; width: 100%; max-width: none; height: 100%; object-fit: cover; object-position: center 39%; }
    .home-hero-fallback { position: absolute; inset: 0; border-radius: 0; }
    .home-hero-message { position: absolute; top: 145px; right: 14.2%; z-index: 2; width: 13.5%; color: #FFFFFF; font-weight: 600; text-shadow: 0 1px 5px rgb(0 24 80 / 35%); }
    .home-values { font-size: clamp(.8125rem, 1.35vw, 1.25rem); letter-spacing: .2em; line-height: 1.55; }
    .home-opportunity { margin-top: 16px; font-size: clamp(.625rem, .83vw, .8125rem); line-height: 1.5; letter-spacing: .19em; }
    .home-opportunity::before { content: ""; display: block; width: 40px; height: 3px; margin-bottom: 14px; background: #13E1E1; }
    .home-handwriting-frame { position: absolute; top: 140px; right: 1.4%; z-index: 2; width: 12.5%; height: 220px; display: grid; place-items: center; }
    .hero-handwritten-tagline { display: block; width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 2px 4px rgb(0 29 88 / 22%)); }
    .home-handwriting-fallback { color: white; text-shadow: 0 1px 4px #061C54; text-align: center; font-family: cursive; font-size: 1.25rem; line-height: 1.2; }
    /* Ask Nexus intentionally overlaps the lower part of the hero, matching the reference masthead. */
    .home-ai-command {
      position: relative; z-index: 5; display: grid;
      grid-template-columns: minmax(300px, .9fr) minmax(0, 1.1fr); align-items: center; gap: 18px;
      margin: -82px 34px 0; padding: 10px 12px;
      border: 1px solid rgb(215 232 245 / 90%); border-radius: 18px;
      background: linear-gradient(110deg, rgb(250 253 255 / 94%), rgb(234 245 255 / 90%));
      box-shadow: 0 10px 28px rgb(7 85 232 / 10%); backdrop-filter: blur(10px);
    }
    .home-ai-form { display: flex; align-items: center; gap: 12px; min-width: 0; min-height: 60px; padding: 5px 8px; border: 1px solid #E0EEFF; border-radius: 14px; background: rgb(255 255 255 / 85%); box-shadow: 0 2px 7px rgb(7 85 232 / 8%); }
    .home-ai-icon { display: grid; place-items: center; width: 52px; height: 52px; flex-shrink: 0; border-radius: 12px; color: white; background: linear-gradient(40deg, #003DEE, #007FFF 65%, #00D9EA); box-shadow: inset 0 0 0 1px rgb(255 255 255 / 35%); }
    .home-ai-icon svg { width: 29px; height: 29px; }
    .home-ai-field { flex: 1; min-width: 0; }
    .home-ai-label { display: flex; align-items: center; gap: 7px; font-size: 1rem; font-weight: 700; color: #062C94; }
    .home-ai-beta { padding: 2px 6px; font-size: .625rem; line-height: 1.4; border-radius: 5px; color: #0578D3; background: #C8EAFE; }
    .home-ai-input { display: block; width: 100%; min-width: 0; min-height: 26px; padding: 2px 0; border: 0; font-size: .8125rem; color: var(--home-navy); background: transparent; text-overflow: ellipsis; }
    .home-ai-input::placeholder { color: #526987; opacity: 1; }
    .home-ai-send { width: 38px; min-height: 38px; padding: 8px; border-radius: 50%; color: white; border: 2px solid #83D9FF; background: linear-gradient(135deg, #0799F5, #0044CF); box-shadow: 0 0 7px rgb(0 139 255 / 25%); }
    .home-ai-send:hover { background: #004ECF; }
    .home-ai-actions { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .home-ai-track { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; overflow-x: auto; padding: 5px; margin: -5px; scrollbar-width: thin; }
    .home-ai-action { flex-shrink: 0; gap: 6px; min-height: 34px; padding: 6px 10px; border-radius: 999px; border-color: #D4E6FC; background: #F9FCFF; color: #0641BE; font-size: clamp(.625rem, .76vw, .8125rem); font-weight: 600; box-shadow: 0 2px 5px rgb(7 85 232 / 6%); }
    .home-ai-action svg { width: 16px; height: 16px; color: #0068F5; }
    .home-ai-next { width: 28px; min-height: 28px; padding: 5px; border-radius: 50%; border-color: #CCE5FA; color: #0785FF; background: transparent; }
    .home-ai-status { grid-column: 1 / -1; font-size: .8125rem; color: var(--text-secondary); }
    .home-ai-status:empty { display: none; }

    /* HOME PHASE 2 — QUICK ACCESS + EXPLORE BY ROLE */
    .home-dashboard-content {
      width: 100%;
      padding: 30px 34px 8px;
    }

    .home-section + .home-section { margin-top: 28px; }

    .home-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }

    .home-section-title {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: #071F59;
      font-size: 1.05rem;
      font-weight: 750;
      line-height: 1.25;
      letter-spacing: -.015em;
    }

    .home-section-title-icon {
      display: inline-grid;
      place-items: center;
      width: 30px;
      height: 30px;
      flex-shrink: 0;
      border-radius: 9px;
    }

    .home-section-title-icon--quick {
      color: #F59A18;
      background: #FFF4DD;
    }

    .home-section-title-icon--roles {
      color: #086FE8;
      background: #E8F4FF;
    }

    .home-view-all {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 34px;
      padding: 5px 3px 5px 10px;
      border: 0;
      border-radius: 8px;
      color: #0866D7;
      background: transparent;
      font-size: .75rem;
      font-weight: 700;
      cursor: pointer;
    }

    .home-view-all:hover {
      color: #004ECF;
      background: #EAF5FF;
    }

    .quick-access-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .quick-access-card {
      --quick-card-accent: #168BFF;
      --quick-card-tint: #EDF7FF;
      appearance: none;
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) 18px;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-width: 0;
      min-height: 96px;
      padding: 13px 12px;
      border: 1px solid #D7E8F5;
      border-radius: 12px;
      color: #071B4B;
      background: linear-gradient(135deg, var(--quick-card-tint), #FFFFFF 76%);
      box-shadow: 0 2px 8px rgb(7 85 232 / 4%);
      text-align: left;
      cursor: pointer;
      transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease, background .16s ease;
    }

    .quick-access-card[data-theme="blue"] {
      --quick-card-accent: #168BFF;
      --quick-card-tint: #EAF6FF;
    }

    .quick-access-card[data-theme="orange"] {
      --quick-card-accent: #FF8A24;
      --quick-card-tint: #FFF3E8;
    }

    /* GLOBAL NAV HEADER LAYOUT
       The search/navigation controls are identical on every route. Only the outer
       header surface changes when the active page exposes a data-page-hero. */
    #nexus-nav-header {
      min-height: 96px;
      padding: 22px 36px;
      gap: 20px;
      background: rgb(255 255 255 / 94%);
      border-bottom: 1px solid var(--border-light);
      box-shadow: 0 8px 24px rgb(7 27 75 / 6%);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .global-search {

      max-width: 1020px;
      height: 46px;
      gap: 8px;
      padding: 0 14px;
      border: 1px solid rgb(218 239 255 / 95%);
      border-radius: 15px;
      background: rgb(255 255 255 / 94%);
      box-shadow: 0 8px 24px rgb(22 88 160 / 10%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .global-search input { flex: 1 1 150px; font-size: .75rem; }
    .search-keycap { display: none; }
    .search-filters {
      display: flex;
      flex-shrink: 0;
      flex-wrap: nowrap;
      gap: 3px;
      margin: 0;
    }
    .filter-chip {
      gap: 5px;
      min-height: 26px;
      padding: 4px 7px;
      font-size: .625rem;
      font-weight: 500;
      border-color: transparent;
      background: transparent;

    .topbar-controls { gap: 5px; margin-left: auto; }
    .topbar-controls > .icon-button { width: 30px; min-height: 32px; padding: 6px; color: #07388E; }
    .user-profile { gap: 8px; margin-left: 4px; padding-left: 10px; }
    .user-name { font-size: .8125rem; }
    .user-department { font-size: .6875rem; }
    .notification-dot { top: 4px; right: 4px; }

    #nexus-app.hero-route #nexus-nav-header {
      margin-bottom: -96px;
    }

    @media (min-width: 1200px) and (max-width: 1350px) {
      #nexus-nav-header { gap: 10px; padding-inline: 24px; }

      .filter-chip { padding-inline: 4px; gap: 3px; }
    }

    @media (max-width: 1199px) {

        min-height: var(--topbar-height);

      }

      #nexus-app.hero-route #nexus-nav-header { margin-bottom: calc(-1 * var(--topbar-height)); }
    }

      .global-search { flex: 1 1 0; height: auto; min-height: 42px; flex-wrap: wrap; padding: 8px 10px; }
      .search-filters { width: 100%; justify-content: flex-start; overflow-x: auto; }
      .filter-chip { font-size: .6875rem; }
      .topbar-controls { width: 100%; justify-content: flex-end; flex-wrap: wrap; }
      #nexus-app.hero-route #nexus-nav-header { margin-bottom: 0; }
      .page-hero[data-page-hero] { padding-top: 32px; }
    }

    /* GLOBAL PAGE HERO CONTRACT
       Add data-page-hero to any route hero. Use .page-hero for the standard shell spacing,
       or keep a page-specific class (such as .home-hero) for a custom composition. */
    .page-hero[data-page-hero] {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      min-height: 320px;
      padding: calc(56px + var(--topbar-height)) var(--content-padding) 56px;
      background: var(--surface-blue);
    }
    .page-hero-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
    }
    .page-hero[data-page-hero]::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: linear-gradient(90deg, rgb(244 250 254 / 96%), rgb(244 250 254 / 62%) 46%, rgb(244 250 254 / 12%) 78%);
    }

    /* HOME PHASE 4 — INTERACTION, ACCESSIBILITY, RESPONSIVE QA */
    .home-page section,
    .home-page aside { scroll-margin-top: 96px; }

    .featured-card { cursor: default; }
    .featured-card:focus-visible { outline: none; }
    .featured-cta:focus-visible,
    .featured-dot:focus-visible,
    .featured-carousel-button:focus-visible,
    .home-view-all:focus-visible {
      outline: 3px solid #0877EA;
      outline-offset: 2px;
    }

    .featured-track:focus-visible {
      outline: 3px solid #0877EA;
      outline-offset: 3px;
      border-radius: 10px;
    }

    .role-image,
    .featured-image,
    .home-hero-image,
    .hero-handwritten-tagline,
    .sidebar-logo {
      contain: paint;
    }

    @media (max-width: 1199px) {
      .home-right-rail { margin-top: 4px; }
    }

    @media (max-width: 767px) {
      .home-dashboard-content { padding-bottom: 12px; }
      .home-right-rail { margin-top: 24px; }
      .home-utility-panel { width: 100%; }
      .featured-track { scroll-padding-inline: 2px; }
      .home-ai-track { overscroll-behavior-inline: contain; }
    }

    @media (prefers-reduced-motion: reduce) {
      .quick-access-card,
      .role-card,
      .role-card-arrow,
      .featured-card,
      .featured-dot,
      .featured-carousel-button,
      .home-help-item,
      .whats-new-item,
      .home-view-all,
      .nav-row,
      .button,
      .icon-button {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }

      .featured-track,
      .role-grid,
      .home-ai-track { scroll-behavior: auto !important; }
    }

  

    /* =========================================================
       H1 OVERVIEW — PHASE 1
       Hero + page foundation only.
       Global sidebar and Component_NavHeader remain shell-owned.
    ========================================================== */
    .overview-page {
      --overview-navy: #071D62;
      --overview-blue: #0757EF;

      --overview-cyan: #10D7D9;

      width: 100%;
      min-width: 0;
      color: var(--overview-navy);
      background: var(--overview-page-bg);

    .overview-hero {
      position: relative;
      isolation: isolate;
      display: flex;
      align-items: flex-start;

      padding: calc(var(--topbar-height) + 26px) 46px 38px;

      background: #DDEFFF;

    .overview-hero.page-hero[data-page-hero]::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        linear-gradient(90deg,
          rgb(245 251 255 / 94%) 0%,

          rgb(5 58 153 / 5%) 70%,
          rgb(4 35 114 / 22%) 100%);

      height: 100%;

      z-index: 0;
      display: block;
      object-fit: cover;
      object-position: center center;
      background: #DDEFFF;

    .overview-hero-fallback {

    /* =========================================================

    .overview-solution-arrow {

    .overview-solution-arrow:hover {

    .overview-capability-grid {

      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

      display: grid;
      grid-template-columns: 40px minmax(0, 1fr) 14px;

      gap: 8px;
      min-width: 0;
      min-height: 94px;
      padding: 10px 9px;
      border: 1px solid #DCEBF6;
      border-radius: 9px;

      transform: translateY(-2px);

      display: inline-flex;
      align-items: center;
      justify-content: center;

      height: 40px;
      border-radius: 10px;

      background: color-mix(in srgb, var(--group-accent) 10%, white);

      gap: 3px;

      font-size: .72rem;
      font-weight: 850;

    }

    .overview-capability-copy > span {

      font-size: .60rem;
      font-weight: 520;

    }

    .overview-capability-chevron {

      font-size: 1.35rem;
      line-height: 1;
    }

    .overview-capability-grid-3 .overview-capability-card {
      grid-template-columns: 34px minmax(0, 1fr) 12px;
      gap: 6px;
      min-height: 94px;

      height: 34px;

    /* =========================================================
       H1 OVERVIEW — PHASE 4
       Accessibility, responsive hardening, performance-ready UI
    ========================================================== */

    #overview-solution-groups-title {
      scroll-margin-top: 112px;
    }

    .overview-page button:focus-visible,
    .overview-page [tabindex="-1"]:focus-visible {
      outline: 3px solid rgb(0 139 255 / 42%);
      outline-offset: 3px;
    }

    .overview-reference-row,
    .overview-reference-featured-link,
    .overview-card-arrow,
    .overview-view-all,
    .overview-video-button,
    .overview-solution-arrow,
    .overview-capability-card {
      -webkit-tap-highlight-color: transparent;
    }

    /* Prevent a long label or translated copy from breaking card geometry. */
    .overview-reference-row > span:nth-child(2),
    .overview-reference-row > strong,
    .overview-reference-featured-link > strong,
    .overview-capability-copy,
    .overview-section-heading {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    /* Guard against horizontal page overflow inside Google Sites / Apps Script iframes. */
    .overview-page,
    .overview-reference-grid,
    .overview-solution-groups,
    .overview-solution-group-grid {
      max-width: 100%;
    }

    @media (max-width: 767px) {
      .overview-reference-row,
      .overview-directory-row,
      .overview-reference-featured-link {
        min-height: 44px;
      }

      .overview-card-arrow,
      .overview-solution-arrow {
        width: 44px;
        height: 44px;
      }

      .overview-video-button {
        min-height: 44px;
        padding-inline: 10px 13px;
      }

      .overview-view-all {
        min-height: 44px;
      }

      #overview-solution-groups-title {
        scroll-margin-top: 132px;
      }
    }

    @media (max-width: 420px) {
      .overview-section-header {
        gap: 2px;
      }

      .overview-view-all {
        justify-self: start;
        margin-left: 39px;
      }

      .overview-solution-banner-copy {
        width: calc(100% - 66px);
      }

      .overview-solution-arrow {
        top: 12px;
        right: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .overview-page *,
      .overview-page *::before,
      .overview-page *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }

      letter-spacing: .10em;

    /* ---- CORE OFFERINGS HEADER ---- */
    .offerings-core-section {
      position: relative;
      z-index: 3;
      padding: 12px 18px 24px;
      background:
        linear-gradient(180deg, rgb(247 252 255 / 96%), #F8FCFF 62%, #FFFFFF 100%);

    .offerings-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-width: 0;

    .offerings-section-title-row {

      align-items: center;
      min-width: 0;
      gap: 11px;
    }

    .offerings-section-title-row h2 {

      color: #08156F;
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: .08em;
      line-height: 1;

    .offerings-section-rule {
      display: inline-block;
      width: 55px;
      height: 4px;
      flex: 0 0 auto;
      border-radius: 999px;
      background: linear-gradient(90deg, #155CFF 0%, #00D5D8 100%);
    }

    .offerings-section-title-row p {
      margin: 0;
      color: #4269AD;
      font-size: .68rem;
      font-weight: 650;
      line-height: 1.2;
      white-space: nowrap;
    }

    .offerings-coe-filter {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      min-width: 0;
      margin-left: auto;
    }

    .offerings-coe-filter-label {
      margin-right: 3px;
      color: #1645B2;
      font-size: .58rem;
      font-weight: 850;
      line-height: 1;
      white-space: nowrap;
    }

    .offerings-coe-chip {
      min-height: 28px;
      padding: 5px 12px;
      border: 1.5px solid currentColor;
      border-radius: 7px;
      background: rgb(255 255 255 / 78%);
      font: inherit;
      font-size: .57rem;
      font-weight: 850;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: 0 2px 6px rgb(0 48 116 / 4%);
      transition: transform .14s ease, background .14s ease, box-shadow .14s ease;
    }

    .offerings-coe-chip:hover,
    .offerings-coe-chip.is-selected {
      transform: translateY(-1px);
      background: #FFFFFF;
      box-shadow: 0 5px 12px rgb(0 54 126 / 9%);
    }

    .offerings-coe-chip[aria-pressed="true"] {
      box-shadow:
        0 0 0 2px rgb(255 255 255 / 92%),
        0 0 0 4px currentColor;
    }

    .offerings-coe-chip.is-experience { color: var(--coe-experience); }
    .offerings-coe-chip.is-data { color: var(--coe-data); }
    .offerings-coe-chip.is-cloud { color: var(--coe-cloud); }
    .offerings-coe-chip.is-edge { color: var(--coe-edge); }
    .offerings-coe-chip.is-infra { color: var(--coe-infra); }
    .offerings-coe-chip.is-netsec { color: var(--coe-netsec); }

    .core-offerings-grid {
      min-height: 8px;
      margin-top: 8px;
    }

    .offerings-status {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 95;
      max-width: min(440px, calc(100vw - 44px));
      margin: 0;
      padding: 10px 14px;
      border: 1px solid #CFE5F5;
      border-radius: 12px;
      color: #0A327F;
      background: rgb(255 255 255 / 95%);
      box-shadow: 0 12px 28px rgb(0 43 110 / 16%);
      font-size: .76rem;
      font-weight: 650;
      opacity: 0;
      visibility: hidden;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease, visibility .18s ease;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .offerings-status.is-visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .offerings-page button:focus-visible {
      outline: 3px solid rgb(0 121 255 / 40%);
      outline-offset: 3px;
    }

    /* =========================================================
       H2 OFFERINGS — PHASE 2
       Five Core Offering cards
    ========================================================== */

    .core-offerings-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      align-items: stretch;
      gap: 11px;
      min-height: 0;
      margin-top: 9px;
    }

    .core-offering-card {
      --card-accent: var(--coe-experience);
      --card-accent-deep: #0862D8;
      --card-tint: #EAF5FF;

      position: relative;
      display: flex;
      min-width: 0;
      min-height: 386px;
      flex-direction: column;
      overflow: hidden;
      padding: 8px 8px 7px;
      border: 1px solid color-mix(in srgb, var(--card-accent) 22%, #D9E8F5);
      border-radius: 12px;
      background:
        linear-gradient(
          150deg,
          color-mix(in srgb, var(--card-accent) 7%, white) 0%,
          #FFFFFF 38%,
          #FFFFFF 100%
        );
      box-shadow:
        0 5px 15px rgb(0 48 116 / 5%),
        inset 0 1px 0 rgb(255 255 255 / 75%);
      isolation: isolate;
    }

    .core-offering-card.is-data {
      --card-accent: var(--coe-data);
      --card-accent-deep: #6A23DB;
      --card-tint: #F3ECFF;
    }

    .core-offering-card.is-cloud {
      --card-accent: var(--coe-cloud);
      --card-accent-deep: #087F8C;
      --card-tint: #E9FBFC;
    }

    .core-offering-card.is-netsec {
      --card-accent: var(--coe-netsec);
      --card-accent-deep: #E8362A;
      --card-tint: #FFF0ED;
    }

    .core-offering-card.is-edge {
      --card-accent: var(--coe-edge);
      --card-accent-deep: #D88308;
      --card-tint: #FFF6E5;
    }

    .core-offering-card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      z-index: -1;
      height: 42%;
      pointer-events: none;
      background:
        radial-gradient(
          circle at 75% 10%,
          color-mix(in srgb, var(--card-accent) 18%, transparent),
          transparent 56%
        );
    }

    .core-offering-card-topline {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      min-height: 27px;
      padding: 1px 3px 0;
    }

    .core-offering-number {
      color: var(--card-accent-deep);
      font-size: 1.06rem;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -.03em;
    }

    .core-offering-coe-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 24px;
      padding: 4px 9px;
      border: 1.4px solid var(--card-accent);
      border-radius: 6px;
      color: var(--card-accent-deep);
      background: rgb(255 255 255 / 78%);
      box-shadow: 0 2px 5px color-mix(in srgb, var(--card-accent) 12%, transparent);
      font-size: .51rem;
      font-weight: 900;
      line-height: 1;
      white-space: nowrap;
    }

    .core-offering-visual {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 126px;
      margin: 0 -2px 5px;
      overflow: hidden;
      border-radius: 8px;
      background:
        radial-gradient(
          circle at 50% 48%,
          color-mix(in srgb, var(--card-accent) 13%, white),
          rgb(255 255 255 / 48%) 58%,
          transparent 78%
        );
    }

    .core-offering-image,
    .core-offering-image-fallback {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .core-offering-image {
      display: block;
      object-fit: contain;
      object-position: center;
      padding: 2px;
      filter: saturate(1.03) contrast(1.01);
    }

    .core-offering-image-fallback {
      border: 0;
      border-radius: 8px;
      color: var(--card-accent-deep);
      background:
        linear-gradient(
          145deg,
          color-mix(in srgb, var(--card-accent) 12%, white),
          #FFFFFF
        );
      font-size: .74rem;
      font-weight: 850;
    }

    .core-offering-content {
      display: flex;
      min-width: 0;
      flex: 1 1 auto;
      flex-direction: column;
      padding: 0 4px;
    }

    .core-offering-content h3 {
      margin: 0;
      color: #08146B;
      font-size: 1.05rem;
      font-weight: 900;
      line-height: 1.02;
      letter-spacing: -.025em;
    }

    .core-offering-coe {
      min-height: 25px;
      margin: 2px 0 4px;
      color: #1845B3;
      font-size: .60rem;
      font-weight: 820;
      line-height: 1.15;
    }

    .core-offering-description {
      min-height: 58px;
      margin: 0 0 5px;
      color: #345793;
      font-size: .61rem;
      font-weight: 560;
      line-height: 1.24;
    }

    .offering-artifacts {
      display: grid;
      gap: 1px;
      margin-top: auto;
      padding-top: 4px;
      border-top: 1px solid #DCE9F5;
    }

    .offering-artifacts-title {
      margin: 0 0 2px;
      color: #123896;
      font-size: .54rem;
      font-weight: 900;
      line-height: 1;
      letter-spacing: .02em;
    }

    .offering-artifacts button {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      min-height: 20px;
      padding: 1px 0;
      border: 0;
      color: #2357BB;
      background: transparent;
      text-align: left;
      font: inherit;
      font-size: .58rem;
      font-weight: 590;
      line-height: 1.1;
      cursor: pointer;
      transition: color .14s ease, transform .14s ease;
    }

    .offering-artifacts button:hover {
      color: var(--card-accent-deep);
      transform: translateX(2px);
    }

    .artifact-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 15px;
      height: 15px;
      flex: 0 0 auto;
      border-radius: 3px;
      color: #FFFFFF;
      background: var(--card-accent);
      box-shadow: 0 2px 4px color-mix(in srgb, var(--card-accent) 22%, transparent);
      font-size: .47rem;
      line-height: 1;
    }

    .offering-explore-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      width: 100%;
      min-height: 37px;
      margin-top: 7px;
      padding: 7px 9px;
      border: 0;
      border-radius: 8px;
      color: #FFFFFF;
      background:
        linear-gradient(
          110deg,
          color-mix(in srgb, var(--card-accent) 88%, white),
          var(--card-accent-deep)
        );
      box-shadow:
        0 5px 12px color-mix(in srgb, var(--card-accent) 22%, transparent),
        inset 0 1px 0 rgb(255 255 255 / 24%);
      font: inherit;
      font-size: .67rem;
      font-weight: 820;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
    }

    .offering-explore-button:hover {
      transform: translateY(-1px);
      filter: saturate(1.06);
      box-shadow:
        0 7px 15px color-mix(in srgb, var(--card-accent) 28%, transparent),
        inset 0 1px 0 rgb(255 255 255 / 28%);
    }

    .offering-explore-button > span:last-child {
      font-size: 1rem;
      font-weight: 500;
      line-height: .7;
    }

    /* Reference-like density at wide desktop sizes. */
    @media (min-width: 1451px) {
      .offerings-core-section {
        padding-inline: 18px;
      }

      .core-offerings-grid {
        gap: 10px;
      }

      .core-offering-card {
        min-height: 388px;

    /* 3 + 2 cards once five narrow columns are no longer comfortable. */
    @media (max-width: 1450px) {

    @media (max-width: 980px) {

    @media (max-width: 620px) {
      .core-offerings-grid {

      }

        min-height: 0;

      }

      .core-offering-description {

      }

      .offering-artifacts-title {
        font-size: .62rem;
      }

      .offering-artifacts button {
        min-height: 32px;

      }

      .artifact-icon {

        height: 20px;
      }

      .offering-explore-button {
        min-height: 44px;
        font-size: .75rem;
      }
    }


    /* =========================================================
       H2 OFFERINGS — PHASE 3
       AI Accelerators + Supply & Deliver / MRS Staff Aug
    ========================================================== */

    .offerings-accelerators-section {
      position: relative;
      z-index: 2;
      padding: 0 18px 10px;
      background:
        linear-gradient(180deg, #F8FCFF 0%, #F5FAFF 100%);
    }

    .offerings-accelerators-section .offerings-section-header {
      margin-bottom: 7px;
    }

    .ai-accelerators-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .ai-accelerator-card {
      --accelerator-accent: #1688FF;
      --accelerator-deep: #075ECC;
      --accelerator-tint: #EAF5FF;

      display: grid;
      grid-template-columns: minmax(0, 1.18fr) minmax(145px, .82fr);
      grid-template-rows: 1fr auto;
      min-width: 0;
      min-height: 138px;
      overflow: hidden;
      padding: 9px 10px 8px;
      border: 1px solid color-mix(in srgb, var(--accelerator-accent) 18%, #D8E7F4);
      border-radius: 11px;
      background:
        linear-gradient(
          135deg,
          color-mix(in srgb, var(--accelerator-accent) 7%, white),
          #FFFFFF 46%,
          color-mix(in srgb, var(--accelerator-accent) 4%, white)
        );
      box-shadow: 0 5px 15px rgb(0 48 116 / 4%);
    }

    .ai-accelerator-card.is-personal-ai {
      --accelerator-accent: #7A28F2;
      --accelerator-deep: #5A14C6;
      --accelerator-tint: #F3EAFE;
    }

    .ai-accelerator-card.is-sovereign-ai {
      --accelerator-accent: #06A6AF;
      --accelerator-deep: #057A84;
      --accelerator-tint: #E8FAFB;
    }

    .ai-accelerator-main {
      display: grid;
      grid-template-columns: 62px minmax(0, 1fr);
      align-items: start;
      gap: 9px;
      min-width: 0;
      padding-right: 10px;
      border-right: 1px solid #DBE8F4;

    .ai-accelerator-icon {
      position: relative;
      width: 58px;
      height: 58px;
      overflow: hidden;
      border-radius: 50%;
      background: var(--accelerator-tint);
      box-shadow:
        0 4px 10px color-mix(in srgb, var(--accelerator-accent) 18%, transparent),

    .ai-accelerator-icon .image-placeholder {

    .ai-accelerator-icon .image-placeholder {

    .ai-accelerator-copy {

      color: #0B2CA6;
      font-size: .84rem;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -.015em;
    }

    .ai-accelerator-coe {
      margin: 3px 0 2px;
      color: #1547B0;
      font-size: .54rem;
      font-weight: 820;
      line-height: 1.1;

    .ai-accelerator-copy > p:last-child {

      color: #355A96;
      font-size: .55rem;
      font-weight: 550;

    .ai-accelerator-artifacts .offering-artifacts-title {

    .ai-accelerator-card .offering-explore-button {

        linear-gradient(
          110deg,
          color-mix(in srgb, var(--accelerator-accent) 90%, white),

        );

        0 5px 12px color-mix(in srgb, var(--accelerator-accent) 18%, transparent),
        inset 0 1px 0 rgb(255 255 255 / 24%);

    .ai-accelerator-card .artifact-icon {
      background: var(--accelerator-accent);

    /* ---- Bottom quote lanes ---- */
