    }

    /* 3-column layout: each row equalizes independently. */
    @media (min-width: 861px) and (max-width: 1120px) {
      .governance-framework-card {
        height: auto !important;
        min-height: 0 !important;
        grid-template-rows: 128px auto;
      }
    }

    /* Tablet/mobile retain the existing stacked layouts while
       removing any inherited fixed height. */
    @media (max-width: 860px) {
      .governance-framework-card {
        height: auto !important;
        min-height: 0 !important;
      }

      .governance-card-cta {
        margin-top: 8px;
      }
    }


    /* =========================================================
       H6 GOVERNANCE — CROSS-CARD CONTENT ALIGNMENT
       Align headings, resource bullets, and CTA buttons
    ========================================================== */

    /* Wide desktop reference layout:
       every card uses the same internal row rhythm so that
       bullet lists and buttons line up horizontally. */
    @media (min-width: 1121px) {
      .governance-framework-card {
        align-self: stretch;
        height: auto !important;
        min-height: 0 !important;
      }

      .governance-card-body {
        display: grid;
        grid-template-rows:
          minmax(2.15rem, auto)   /* title */
          minmax(4.55rem, auto)   /* description */
          auto                    /* resources */
          auto;                   /* CTA */
        align-content: start;
        min-height: 0;
      }

      .governance-card-body h3 {
        display: flex;
        align-items: flex-start;
        min-height: 2.15rem;
        margin: 0;
      }

      .governance-card-description {
        min-height: 4.55rem;
        margin-top: 8px;
      }

      .governance-resource-list {
        display: grid;
        grid-template-rows: repeat(4, minmax(1.55rem, auto));
        align-content: start;
        gap: 4px;
        min-height: calc((1.55rem * 4) + 12px);
        margin-top: 7px;
        margin-bottom: 0;
      }

      .governance-resource-list li {
        min-height: 1.55rem;
        align-items: center;
      }

      .governance-card-cta {
        align-self: end;
        min-height: 47px;
        margin-top: 10px;
      }
    }

    /* 3-column desktop/tablet rows should also align internally. */
    @media (min-width: 861px) and (max-width: 1120px) {
      .governance-card-body {
        display: grid;
        grid-template-rows:
          minmax(2.15rem, auto)
          minmax(4.2rem, auto)
          auto
          auto;
      }

      .governance-card-body h3 {
        min-height: 2.15rem;
      }

      .governance-card-description {
        min-height: 4.2rem;
      }

      .governance-resource-list {
        display: grid;
        grid-template-rows: repeat(4, minmax(1.55rem, auto));
        gap: 4px;
        min-height: calc((1.55rem * 4) + 12px);
      }

      .governance-card-cta {
        align-self: end;
      }
    }


    /* =========================================================
       TOOLS & TEMPLATES — PHASE 1
       Hero + Solutioning Toolkit
    ========================================================== */

    .tools-page {
      --tools-navy: #071B59;
      --tools-blue: #155AEF;
      --tools-bright-blue: #2670FF;
      --tools-cyan: #0DC9D8;
      --tools-teal: #0AACB5;
      --tools-purple: #7632E8;
      --tools-orange: #FF8A1B;
      --tools-border: #D7E7F5;
      --tools-muted: #3B60A6;

      position: relative;
      min-width: 0;
      overflow-x: clip;
      color: var(--tools-navy);
      background:
        radial-gradient(circle at 34% 0%, rgb(34 118 255 / 5%), transparent 28%),
        #F8FCFF;
    }

    /* ---------- HERO ---------- */

    .tools-hero.page-hero[data-page-hero] {
      position: relative;
      min-height: 278px;
      overflow: hidden;
      padding: calc(var(--topbar-height) + 20px) 42px 17px;
      background: #E9F5FF;
    }

    .tools-hero.page-hero[data-page-hero]::after {
      content: none;
    }

    .tools-hero-media,
    .tools-hero-image,
    .tools-hero-fallback,
    .tools-hero-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .tools-hero-media {
      z-index: 0;
      overflow: hidden;
    }

    .tools-hero-image {
      z-index: 0;
      display: block;
      object-fit: cover;
      object-position: center 47%;
    }

    .tools-hero-fallback {
      z-index: 0;
      border: 0;
      border-radius: 0;
      color: #0C449D;
      background:
        linear-gradient(110deg, #FAFDFF 0%, #E9F5FF 37%, #BBDFFF 68%, #102F73 100%);
    }

    /* Preserve the image composition while creating a readable left copy zone. */
    .tools-hero-overlay {
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(
          90deg,
          rgb(250 253 255 / 99%) 0%,
          rgb(250 253 255 / 98%) 24%,
          rgb(250 253 255 / 76%) 36%,
          rgb(250 253 255 / 8%) 51%,
          rgb(6 37 93 / 0%) 74%,
          rgb(7 31 80 / 31%) 100%
        );
    }

    .tools-hero-content {
      position: relative;
      z-index: 2;
      min-height: 230px;
    }

    .tools-hero-copy {
      width: min(42%, 610px);
      min-width: 535px;
      padding-top: 2px;
    }

    .tools-eyebrow {
      margin: 0 0 8px;
      color: #2757CD;
      font-size: .86rem;
      font-weight: 810;
      line-height: 1;
      letter-spacing: .23em;
    }

    .tools-hero-copy h1 {
      margin: 0;
      color: #07194D;
      font-size: clamp(2.40rem, 3.1vw, 3.48rem);
      font-weight: 920;
      line-height: .94;
      letter-spacing: -.046em;
    }

    .tools-hero-copy h1 > span {
      display: block;
    }

    .tools-hero-copy h1 strong {
      color: #165FF2;
      font-weight: 920;
    }

    .tools-hero-description {
      max-width: 580px;
      margin: 9px 0 0;
      color: #2658B7;
      font-size: .80rem;
      font-weight: 620;
      line-height: 1.2;
    }

    .tools-hero-tagline {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 11px;
      color: #1C59D8;
      font-size: .68rem;
      font-weight: 820;
    }

    .tools-hero-tagline-rule {
      width: 67px;
      height: 5px;
      flex: 0 0 auto;
      border-radius: 999px;
      background: linear-gradient(
        90deg,
        #1E61FF 0 25%,
        #12CED8 26% 50%,
        #58DCA2 51% 66%,
        #FFC72C 67% 82%,
        #FF8840 83% 100%
      );
    }

    /* PLAN / SOLVE / DELIVER / CREATE IMPACT and NEXUS are baked into
       the approved hero artwork and intentionally have no HTML overlays. */

    .tools-hero-screen-message {
      position: absolute;
      top: 42px;
      left: 66.5%;
      display: grid;
      gap: 0;
      justify-items: start;
      color: #FFFFFF;
      font-size: 1.12rem;
      font-weight: 850;
      line-height: .94;
      text-shadow: 0 2px 8px rgb(0 23 71 / 58%);
      transform: rotate(-1deg);
      pointer-events: none;
    }

    .tools-hero-screen-message span:not(.tools-hero-screen-rule) {
      display: block;
    }

    .tools-hero-screen-rule {
      display: block;
      width: 48px;
      height: 4px;
      margin-top: 7px;
      border-radius: 999px;
      background: linear-gradient(90deg, #13D9E0, #34B2FF 50%, #FFCB39 51%, #FF7B40 100%);
    }

    .tools-hero-message {
      position: absolute;
      top: 7px;
      right: 1px;
      display: grid;
      justify-items: center;
      width: 118px;
      color: #F5FBFF;
      text-shadow: 0 2px 11px rgb(0 22 65 / 65%);
      pointer-events: none;
    }

    .tools-hero-message-script {
      display: grid;
      justify-items: start;
      gap: 0;
      width: 100%;
      transform: rotate(-7deg);
      font-family: "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
      font-size: .78rem;
      font-weight: 500;
      line-height: 1.04;
    }

    .tools-hero-message-script span:nth-child(2),
    .tools-hero-message-script span:nth-child(4),
    .tools-hero-message-script span:nth-child(5) {
      color: #1DD4E5;
    }

    .tools-hero-message-rule {
      display: block;
      width: 68px;
      height: 4px;
      margin-top: 8px;
      border-radius: 999px;
      background: linear-gradient(90deg, #1F62FF, #14CAD8 48%, #FFD02F 72%, #2F6BFF 100%);
    }

    /* ---------- SHARED PANEL ---------- */

    .tools-panel {
      position: relative;
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--tools-border);
      border-radius: 12px;
      background: rgb(255 255 255 / 97%);
      box-shadow:
        0 5px 16px rgb(0 47 115 / 4%),
        inset 0 1px 0 rgb(255 255 255 / 86%);
    }

    /* ---------- SOLUTIONING TOOLKIT ---------- */

    .tools-toolkit {
      margin: 9px 20px 14px;
      padding: 9px 10px 11px;
    }

    .tools-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 63px;
      padding: 0 5px 8px;
    }

    .tools-panel-title-group {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .tools-panel-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 58px;
      height: 58px;
      flex: 0 0 auto;
      border-radius: 9px;
      color: #FFFFFF;
      box-shadow:
        0 6px 12px rgb(0 47 115 / 12%),
        inset 0 1px 0 rgb(255 255 255 / 18%);
    }

    .tools-panel-icon.is-blue {
      background: linear-gradient(145deg, #175DF5 0%, #0A35AF 100%);
    }

    .tools-panel-title-group h2 {
      margin: 0;
      color: #0D3BAB;
      font-size: 1.15rem;
      font-weight: 910;
      line-height: 1;
      letter-spacing: -.025em;
    }

    .tools-panel-title-group p {
      margin: 4px 0 0;
      color: #4469AE;
      font-size: .68rem;
      font-weight: 590;
      line-height: 1.12;
    }

    .tools-view-all {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      flex: 0 0 auto;
      min-height: 40px;
      padding: 7px 8px 7px 14px;
      border: 0;
      color: #1257DA;
      background: transparent;
      font: inherit;
      font-size: .66rem;
      font-weight: 820;
      cursor: pointer;
      transition: transform .14s ease;
    }

    .tools-view-all:hover {
      transform: translateX(2px);
    }

    .tools-view-all span:last-child {
      font-size: 1.1rem;
      line-height: 1;
    }

    .tools-toolkit-grid {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: 7px;
      align-items: stretch;
    }

    .tools-template-card {
      --template-accent: #1C64F3;
      --template-deep: #114CCB;
      --template-soft: #E9F4FF;

      position: relative;
      display: grid;
      grid-template-rows: 70px minmax(3.4rem, 1fr) 32px;
      justify-items: center;
      align-items: start;
      min-width: 0;
      min-height: 185px;
      padding: 10px 8px 8px;
      border: 1px solid color-mix(in srgb, var(--template-accent) 17%, #DCE9F4);
      border-radius: 10px;
      color: #0E43BB;
      background:
        linear-gradient(
          160deg,
          color-mix(in srgb, var(--template-accent) 3%, white),
          #FFFFFF 75%
        );
      text-align: center;
      font: inherit;
      cursor: pointer;
      box-shadow: 0 3px 9px rgb(0 47 115 / 3%);
      transition: transform .14s ease, border-color .14s ease, box-shadow .14s ease;
    }

    .tools-template-card.is-blue {
      --template-accent: #1766F4;
      --template-deep: #1050D0;
      --template-soft: #EAF4FF;
    }

    .tools-template-card.is-cyan {
      --template-accent: #16BCCE;
      --template-deep: #078D9F;
      --template-soft: #E5F9FB;
    }

    .tools-template-card.is-purple {
      --template-accent: #7836EA;
      --template-deep: #6225D4;
      --template-soft: #F1EAFF;
    }

    .tools-template-card.is-teal {
      --template-accent: #0EB6B1;
      --template-deep: #07898C;
      --template-soft: #E5F9F7;
    }

    .tools-template-card.is-orange {
      --template-accent: #FF8A20;
      --template-deep: #E8680F;
      --template-soft: #FFF1E4;
    }

    .tools-template-card:hover {
      transform: translateY(-2px);
      border-color: color-mix(in srgb, var(--template-accent) 37%, #DCE9F4);
      box-shadow: 0 8px 16px rgb(0 47 115 / 7%);
    }

    .tools-template-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 62px;
      height: 62px;
      border-radius: 11px;
      color: var(--template-deep);
      background: var(--template-soft);
      box-shadow: inset 0 1px 0 rgb(255 255 255 / 86%);
    }

    .tools-template-label {
      align-self: start;
      min-width: 0;
      color: #0E3FB1;
      font-size: .69rem;
      font-weight: 850;
      line-height: 1.03;
      overflow-wrap: anywhere;
    }

    .tools-template-arrow {
      align-self: end;
      justify-self: end;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 31px;
      height: 31px;
      border: 1px solid #D7E7F5;
      border-radius: 50%;
      color: #1762EB;
      background: #FFFFFF;
      box-shadow: 0 3px 8px rgb(0 47 115 / 8%);
      font-size: 1rem;
      font-weight: 820;
      line-height: 1;
      transition: transform .14s ease, box-shadow .14s ease;
    }

    .tools-template-card:hover .tools-template-arrow {
      transform: translateX(2px);
      box-shadow: 0 5px 10px rgb(0 47 115 / 11%);
    }

    /* ---------- STATUS ---------- */

    .tools-status {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 96;
      max-width: min(440px, calc(100vw - 44px));
      margin: 0;
      padding: 10px 14px;
      border: 1px solid #CFE5F5;
      border-radius: 12px;
      color: #0A327F;
      background: rgb(255 255 255 / 96%);
      box-shadow: 0 12px 28px rgb(0 43 110 / 16%);
      font-size: .75rem;
      font-weight: 650;
      line-height: 1.35;
      opacity: 0;
      visibility: hidden;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease, visibility .18s ease;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .tools-status.is-visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .tools-page button:focus-visible,
    .tools-page [data-page-title]:focus-visible {
      outline: 3px solid rgb(0 121 255 / 44%);
      outline-offset: 3px;
    }

    /* ---------- RESPONSIVE ---------- */

    @media (max-width: 1380px) {
      .tools-toolkit-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .tools-template-card {
        min-height: 175px;
      }
    }

    @media (max-width: 1220px) {
      .tools-hero.page-hero[data-page-hero] {
        min-height: 312px;
        padding-inline: 28px;
      }

      .tools-hero-copy {
        width: min(49%, 590px);
        min-width: 465px;
      }

      .tools-hero-screen-message {
        left: 68%;
        top: 54px;
      }
    }

    @media (max-width: 980px) {
      .tools-hero.page-hero[data-page-hero] {
        min-height: 350px;
        padding: calc(var(--topbar-height) + 22px) 22px 20px;
      }

      .tools-hero-image {
        object-position: 61% center;
      }

      .tools-hero-overlay {
        background:
          linear-gradient(
            90deg,
            rgb(250 253 255 / 99%) 0%,
            rgb(250 253 255 / 96%) 40%,
            rgb(250 253 255 / 43%) 62%,
            rgb(7 31 80 / 40%) 100%
          );
      }

      .tools-hero-copy {
        width: min(60%, 580px);
        min-width: 410px;
      }

      .tools-hero-message {
        width: 105px;
      }

      .tools-hero-screen-message {
        display: none;
      }

      .tools-panel-header {
        align-items: flex-start;
      }
    }

    @media (max-width: 767px) {
      .tools-page {
        overflow-x: hidden;
      }

      .tools-hero.page-hero[data-page-hero] {
        min-height: 465px;
        padding: 26px 16px 18px;
      }

      .tools-hero-image {
        object-position: 70% center;
      }

      .tools-hero-overlay {
        background:
          linear-gradient(
            180deg,
            rgb(250 253 255 / 99%) 0%,
            rgb(250 253 255 / 95%) 43%,
            rgb(250 253 255 / 50%) 68%,
            rgb(7 31 80 / 29%) 100%
          );
      }

      .tools-hero-content {
        min-height: 415px;
      }

      .tools-hero-copy {
        width: 100%;
        min-width: 0;
      }

      .tools-eyebrow {
        font-size: .74rem;
      }

      .tools-hero-copy h1 {
        font-size: clamp(2.02rem, 10.7vw, 2.7rem);
      }

      .tools-hero-description {
        max-width: 95%;
        font-size: .74rem;
      }

      .tools-hero-tagline {
        font-size: .61rem;
      }

      .tools-hero-message {
        display: none;
      }

      .tools-toolkit {
        margin: 11px 14px 16px;
        padding: 8px 9px 10px;
      }

      .tools-panel-header {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 6px;
        padding-bottom: 9px;
      }

      .tools-panel-title-group {
        align-items: flex-start;
      }

      .tools-panel-icon {
        width: 48px;
        height: 48px;
      }

      .tools-panel-title-group h2 {
        font-size: 1rem;
      }

      .tools-panel-title-group p {
        font-size: .64rem;
      }

      .tools-view-all {
        justify-self: end;
        min-height: 44px;
      }

      .tools-toolkit-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .tools-template-card {
        min-height: 168px;
      }
    }

    @media (max-width: 460px) {
      .tools-toolkit-grid {
        grid-template-columns: minmax(0, 1fr);
      }

      .tools-template-card {
        grid-template-columns: 70px minmax(0, 1fr) 34px;
        grid-template-rows: minmax(72px, auto);
        align-items: center;
        justify-items: start;
        min-height: 88px;
        text-align: left;
      }

      .tools-template-icon {
        width: 58px;
        height: 58px;
      }

      .tools-template-label {
        align-self: center;
        font-size: .72rem;
      }

      .tools-template-arrow {
        align-self: center;
        justify-self: end;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .tools-page *,
      .tools-page *::before,
      .tools-page *::after {
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }


    /* =========================================================
       TOOLS & TEMPLATES — PHASE 2
       Connected Digital Stack + Bottom CTA + Final Hardening
    ========================================================== */

    /* ---------- CONNECTED DIGITAL STACK ---------- */

    .tools-stack {
      margin: 0 20px 14px;
      padding: 8px 10px 10px;
      background:
        linear-gradient(180deg, #FFFFFF 0%, #FAFDFF 100%);
    }

    .tools-panel-header.is-stack {
      justify-content: flex-start;
      min-height: 56px;
      padding-bottom: 7px;
    }

    .tools-stack-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      align-items: stretch;
    }

    .tools-stack-card {
      --stack-accent: #1766F4;
      --stack-deep: #0D48C5;
      --stack-soft: #EAF4FF;

      display: grid;
      grid-template-rows: minmax(138px, auto) 32px;
      min-width: 0;
      overflow: hidden;
      border: 1px solid #D9E8F5;
      border-radius: 10px;
      background: #FFFFFF;
      box-shadow:
        0 4px 11px rgb(0 47 115 / 4%),
        inset 0 1px 0 rgb(255 255 255 / 84%);
    }

    .tools-stack-card.is-workspace {
      --stack-accent: #0AB8B5;
      --stack-deep: #087F88;
      --stack-soft: #E8FAF8;
    }

    .tools-stack-card.is-other {
      --stack-accent: #2B6EF2;
      --stack-deep: #164BBE;
      --stack-soft: #EEF5FF;
    }

    .tools-stack-card-main {
      display: grid;
      grid-template-columns: minmax(150px, .95fr) minmax(0, 1.15fr) 42px;
      align-items: center;
      gap: 13px;
      min-width: 0;
      padding: 10px 12px 8px;
    }

    .tools-stack-brand {
      position: relative;
      min-width: 0;
      min-height: 114px;
      overflow: hidden;
      border-radius: 8px;
      background:
        linear-gradient(
          145deg,
          color-mix(in srgb, var(--stack-accent) 5%, white),
          #FFFFFF
        );
    }

    .tools-stack-brand img,
    .tools-stack-fallback {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .tools-stack-brand img {
      display: block;
      object-fit: cover;
      object-position: center;
    }

    .tools-stack-fallback {
      border: 0;
      border-radius: 0;
      color: var(--stack-deep);
      background: var(--stack-soft);
      font-size: .67rem;
      font-weight: 820;
    }

    .tools-stack-copy {
      min-width: 0;
    }

    .tools-stack-copy h3 {
      margin: 0;
      color: #123FAF;
      font-size: .91rem;
      font-weight: 900;
      line-height: 1.02;
      letter-spacing: -.02em;
    }

    .tools-stack-copy p {
      margin: 7px 0 0;
      color: #4164A4;
      font-size: .66rem;
      font-weight: 590;
      line-height: 1.17;
    }

    .tools-stack-arrow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      justify-self: end;
      border: 1px solid #D8E8F5;
      border-radius: 50%;
      color: #1761E9;
      background: #FFFFFF;
      box-shadow: 0 4px 10px rgb(0 47 115 / 8%);
      font: inherit;
      font-size: 1.12rem;
      font-weight: 830;
      line-height: 1;
      cursor: pointer;
      transition: transform .14s ease, box-shadow .14s ease;
    }

    .tools-stack-arrow:hover {
      transform: translateX(2px);
      box-shadow: 0 6px 13px rgb(0 47 115 / 11%);
    }

    .tools-stack-strip {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 32px;
      padding: 5px 10px;
      color: #2863BF;
      background:
        linear-gradient(90deg, #F1F8FF, #E4F3FF);
      font-size: .61rem;
      font-weight: 650;
      line-height: 1.1;
      text-align: center;
    }

    .tools-stack-strip.is-teal {
      color: #087E89;
      background:
        linear-gradient(90deg, #EDFDF9, #DFF8F4);
    }

    /* ---------- BOTTOM CTA ---------- */

    .tools-bottom-cta {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) auto minmax(0, .9fr);
      align-items: center;
      gap: 22px;
      min-height: 86px;
      margin: 0 20px 16px;
      overflow: hidden;
      border: 1px solid #D7E7F5;
      border-radius: 11px;
      background:
        linear-gradient(90deg, #FFFFFF 0%, #FBFDFF 54%, #EAF8FF 100%);
      box-shadow:
        0 5px 14px rgb(0 47 115 / 4%),
        inset 0 1px 0 rgb(255 255 255 / 84%);
    }

    .tools-bottom-cta::before {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 34%;
      pointer-events: none;
      background:
        linear-gradient(135deg, transparent 0 16%, #1ACBD9 17% 33%, #0877F0 34% 58%, #103C9A 59% 100%);
      clip-path: polygon(25% 0, 100% 0, 100% 100%, 45% 100%, 0 0);
      opacity: .98;
    }

    .tools-bottom-left,
    .tools-bottom-button,
    .tools-bottom-brand {
      position: relative;
      z-index: 2;
    }

    .tools-bottom-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      padding-left: 14px;
    }

    .tools-bottom-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 54px;
      height: 54px;
      flex: 0 0 auto;
      border-radius: 10px;
      color: #1761E8;
      background: #EAF3FF;
      box-shadow: inset 0 1px 0 rgb(255 255 255 / 85%);
    }

    .tools-bottom-left h2 {
      margin: 0;
      color: #0D3CB0;
      font-size: .88rem;
      font-weight: 900;
      line-height: 1.05;
    }

    .tools-bottom-left p {
      margin: 4px 0 0;
      color: #4568A8;
      font-size: .63rem;
      font-weight: 590;
      line-height: 1.13;
    }

    .tools-bottom-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 42px;
      padding: 8px 16px;
      border: 1px solid #DBE9F5;
      border-radius: 9px;
      color: #1459DB;
      background: #FFFFFF;
      box-shadow: 0 4px 10px rgb(0 47 115 / 6%);
      font: inherit;
      font-size: .66rem;
      font-weight: 820;
      cursor: pointer;
      transition: transform .14s ease, box-shadow .14s ease;
    }

    .tools-bottom-button:hover {
      transform: translateX(2px);
      box-shadow: 0 6px 13px rgb(0 47 115 / 9%);
    }

    .tools-bottom-brand {
      display: grid;
      justify-self: end;
      gap: 5px;
      min-width: 175px;
      padding-right: 18px;
      color: #FFFFFF;
      font-size: .68rem;
      font-weight: 650;
      line-height: 1.07;
      text-shadow: 0 2px 10px rgb(0 20 70 / 45%);
    }

    .tools-bottom-brand div {
      display: grid;
      gap: 1px;
    }

    .tools-bottom-brand strong {
      font-weight: 900;
    }

    .tools-bottom-brand-rule {
      display: block;
      width: 59px;
      height: 4px;
      border-radius: 999px;
      background: linear-gradient(90deg, #16D0D8, #2B75FF 46%, #FFCB31 73%, #A650E8 100%);
    }

    /* ---------- FINAL HARDENING ---------- */

    #tools-toolkit-title,
    #tools-stack-title,
    #tools-bottom-title {
      scroll-margin-top: 118px;
    }

    .tools-page button {
      -webkit-tap-highlight-color: transparent;
    }

    .tools-page button:focus-visible,
    .tools-page [tabindex="-1"]:focus-visible {
      outline: 3px solid rgb(0 121 255 / 45%);
      outline-offset: 3px;
    }

    .tools-template-card,
    .tools-template-label,
    .tools-stack-card,
    .tools-stack-copy,
    .tools-bottom-left {
      min-width: 0;
    }

    .tools-template-label,
    .tools-stack-copy h3,
    .tools-stack-copy p,
    .tools-bottom-left p {
      overflow-wrap: anywhere;
    }

    .tools-toolkit,
    .tools-stack,
    .tools-bottom-cta {
      content-visibility: auto;
      contain-intrinsic-size: 1px 250px;
    }

    @media (max-width: 1160px) {
      .tools-stack-grid {
        grid-template-columns: minmax(0, 1fr);
      }

      .tools-stack-card-main {
        grid-template-columns: minmax(180px, .75fr) minmax(0, 1.2fr) 42px;
      }

      .tools-bottom-cta {
        grid-template-columns: minmax(0, 1fr) auto;
      }

      .tools-bottom-cta::before {
        width: 42%;
      }

      .tools-bottom-brand {
        grid-column: 1 / -1;
        justify-self: end;
        min-height: 42px;
        padding: 2px 18px 8px 0;
      }
    }

    @media (max-width: 767px) {
      .tools-stack {
        margin: 0 14px 14px;
        padding: 8px 9px 10px;
      }

      .tools-stack-card-main {
        grid-template-columns: minmax(125px, 39%) minmax(0, 1fr) 40px;
        gap: 9px;
        min-height: 145px;
        padding: 9px;
      }

      .tools-stack-brand {
        min-height: 120px;
      }

      .tools-stack-copy h3 {
        font-size: .82rem;
      }

      .tools-stack-copy p {
        font-size: .61rem;
      }

      .tools-stack-arrow {
        width: 36px;
        height: 36px;
      }

      .tools-bottom-cta {
        grid-template-columns: minmax(0, 1fr);
        gap: 10px;
        margin: 0 14px 16px;
        padding: 11px 12px;
      }

      .tools-bottom-cta::before {
        width: 100%;
        height: 54px;
        top: auto;
        clip-path: polygon(38% 0, 100% 0, 100% 100%, 20% 100%);
      }

      .tools-bottom-left {
        padding-left: 0;
      }

      .tools-bottom-button {
        justify-self: start;
        min-height: 44px;
      }

      .tools-bottom-brand {
        grid-column: auto;
        justify-self: end;
        min-height: 52px;
        padding: 8px 4px 0 0;
      }

      #tools-toolkit-title,
      #tools-stack-title,
      #tools-bottom-title {
        scroll-margin-top: 132px;
      }

      .tools-template-card,
      .tools-stack-arrow,
      .tools-bottom-button {
        min-height: 44px;
      }
    }

    @media (max-width: 500px) {
      .tools-stack-card-main {
        grid-template-columns: minmax(0, 1fr) 40px;
        grid-template-rows: 135px auto;
      }

      .tools-stack-brand {
        grid-column: 1 / -1;
        min-height: 135px;
      }

      .tools-stack-copy {
        grid-column: 1;
      }

      .tools-stack-arrow {
        grid-column: 2;
        grid-row: 2;
      }

      .tools-bottom-icon {
        width: 48px;
        height: 48px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .tools-page *,
      .tools-page *::before,
      .tools-page *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }


    /* =========================================================
       HELP & SUPPORT — PHASE 1
       Hero + Primary Support Options
    ========================================================== */

    .support-page {
      --support-navy: #071A59;
      --support-blue: #155EF4;
      --support-bright-blue: #2471FF;
      --support-cyan: #14CAD9;
      --support-green: #14C88B;
      --support-purple: #7138F0;
      --support-orange: #FF541D;
      --support-border: #D8E8F5;
      --support-muted: #4163A2;

      position: relative;
      min-width: 0;
      overflow-x: clip;
      color: var(--support-navy);
      background:
        radial-gradient(circle at 28% 0%, rgb(34 118 255 / 5%), transparent 28%),
        #F8FCFF;
    }

    /* ---------- HERO ---------- */

    .support-hero.page-hero[data-page-hero] {
      position: relative;
      min-height: 306px;
      overflow: hidden;
      padding: calc(var(--topbar-height) + 19px) 48px 18px;
      background: #EAF6FF;
    }

    .support-hero.page-hero[data-page-hero]::after {
      content: none;
    }

    .support-hero-media,
    .support-hero-image,
    .support-hero-fallback,
    .support-hero-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .support-hero-media {
      z-index: 0;
      overflow: hidden;
    }

    .support-hero-image {
      z-index: 0;
      display: block;
      object-fit: cover;
      object-position: center 45%;
    }

    .support-hero-fallback {
      z-index: 0;
      border: 0;
      border-radius: 0;
      color: #0C449D;
      background:
        linear-gradient(110deg, #FAFDFF 0%, #EAF6FF 38%, #B6DBFF 67%, #0B347C 100%);
    }

    .support-hero-overlay {
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(
          90deg,
          rgb(250 253 255 / 99%) 0%,
          rgb(250 253 255 / 98%) 25%,
          rgb(250 253 255 / 83%) 38%,
          rgb(250 253 255 / 16%) 55%,
          rgb(9 49 107 / 2%) 69%,
          rgb(5 34 87 / 55%) 100%
        );
    }

    .support-hero-content {
      position: relative;
      z-index: 2;
      min-height: 250px;
    }

    .support-hero-copy {
      width: min(43%, 610px);
      min-width: 535px;
      padding-top: 1px;
    }

    .support-eyebrow {
      margin: 0 0 9px;
      color: #2456D0;
      font-size: .88rem;
      font-weight: 820;
      line-height: 1;
      letter-spacing: .23em;
    }

    .support-hero-copy h1 {
      margin: 0;
      color: #07174A;
      font-size: clamp(2.55rem, 3.15vw, 3.58rem);
      font-weight: 930;
      line-height: .94;
      letter-spacing: -.047em;
    }

    .support-hero-copy h1 > span {
      display: block;
    }

    .support-hero-copy h1 strong {
      color: #1B60F2;
      font-weight: 930;
    }

    .support-hero-description {
      max-width: 560px;
      margin: 11px 0 0;
      color: #2857B7;
      font-size: .82rem;
      font-weight: 650;
      line-height: 1.24;
    }

    .support-hero-tagline {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-top: 17px;
      color: #245AD5;
      font-size: .69rem;
      font-weight: 830;
    }

    .support-hero-tagline-rule {
      width: 74px;
      height: 5px;
      flex: 0 0 auto;
      border-radius: 999px;
      background: linear-gradient(
        90deg,
        #1D61FF 0 26%,
        #10D0D8 27% 55%,
        #5BDCA0 56% 72%,
        #FFD22F 73% 100%
      );
    }

    .support-hero-message {
      position: absolute;
      top: 8px;
      right: 3.2%;
      display: grid;
      justify-items: center;
      width: 180px;
      color: #F6FBFF;
      text-shadow: 0 2px 12px rgb(0 24 70 / 62%);
      pointer-events: none;
    }

    .support-hero-message-script {
      display: grid;
      justify-items: start;
      width: 100%;
      transform: rotate(-7deg);
      font-family: "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
      font-size: 1.08rem;
      font-weight: 500;
      line-height: 1.00;
    }

    .support-hero-message-script span:nth-child(4),
    .support-hero-message-script span:nth-child(5) {
      color: #19D6DD;
    }

    .support-hero-message-rule {
      display: block;
      width: 84px;
      height: 5px;
      margin-top: 13px;
      border-radius: 999px;
      background:
        linear-gradient(90deg, #29B7FF, #14D9D5 38%, #FFD32F 63%, #1B78FF 100%);
    }

    /* ---------- PRIMARY SUPPORT OPTIONS ---------- */

    .support-options {
      margin: 0;
      padding: 9px 18px 14px;
      background:
        linear-gradient(180deg, #FAFDFF 0%, #F8FCFF 100%);
    }

    .support-options-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      padding: 10px;
      border: 1px solid #D7E8F5;
      border-radius: 14px;
      background: rgb(255 255 255 / 97%);
      box-shadow:
        0 5px 15px rgb(0 48 114 / 5%),
        inset 0 1px 0 rgb(255 255 255 / 86%);
    }

    .support-option-card {
      --option-accent: #1766F4;
      --option-deep: #0A47D2;
      --option-soft: #EAF4FF;
      --option-bg: #F1F7FF;

      position: relative;
      display: grid;
      grid-template-columns: 100px minmax(0, 1fr) 48px;
      align-items: center;
      gap: 13px;
      min-width: 0;
      min-height: 174px;
      padding: 14px 14px 14px 11px;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--option-accent) 14%, #DDE9F4);
      border-radius: 11px;
      color: #123FAE;
      background:
        radial-gradient(circle at 16% 42%, color-mix(in srgb, var(--option-accent) 12%, white), transparent 32%),
        linear-gradient(140deg, var(--option-bg), #FFFFFF 78%);
      text-align: left;
      font: inherit;
      cursor: pointer;
      box-shadow:
        0 3px 9px rgb(0 48 114 / 3%),
        inset 0 1px 0 rgb(255 255 255 / 82%);
      transition:
        transform .14s ease,
        border-color .14s ease,
        box-shadow .14s ease;
    }

    .support-option-card.is-blue {
      --option-accent: #1765F4;
      --option-deep: #0D49D2;
      --option-soft: #E6F1FF;
      --option-bg: #EEF6FF;
    }

    .support-option-card.is-green {
      --option-accent: #18C996;
      --option-deep: #079875;
      --option-soft: #E6FAF4;
      --option-bg: #F0FCF8;
    }

    .support-option-card.is-purple {
      --option-accent: #7338F1;
      --option-deep: #5523D1;
      --option-soft: #EFE9FF;
      --option-bg: #F6F2FF;
    }

    .support-option-card.is-orange {
      --option-accent: #FF5A1F;
      --option-deep: #E84011;
      --option-soft: #FFF0E8;
      --option-bg: #FFF7F0;
    }

    .support-option-card:hover {
      transform: translateY(-2px);
      border-color: color-mix(in srgb, var(--option-accent) 34%, #DDE9F4);
      box-shadow: 0 8px 17px rgb(0 48 114 / 7%);
    }

    .support-option-icon {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 86px;
      height: 86px;
      justify-self: center;
      border: 9px solid color-mix(in srgb, var(--option-accent) 15%, white);
      border-radius: 50%;
      color: #FFFFFF;
      background:
        linear-gradient(145deg, var(--option-accent), var(--option-deep));
      box-shadow:
        0 7px 15px color-mix(in srgb, var(--option-accent) 20%, transparent),
        inset 0 1px 0 rgb(255 255 255 / 22%);
    }

    .support-option-icon::after {
      content: "";
      position: absolute;
      inset: -9px;
      border: 1px solid color-mix(in srgb, var(--option-accent) 16%, transparent);
      border-radius: inherit;
      pointer-events: none;
    }

    .support-option-copy {
      display: grid;
      align-content: center;
      gap: 8px;
      min-width: 0;
    }

    .support-option-copy strong {
      color: var(--option-deep);
      font-size: 1.03rem;
      font-weight: 910;
      line-height: 1.03;
      letter-spacing: -.02em;
    }

    .support-option-copy > span {
      color: #4262A2;
      font-size: .74rem;
      font-weight: 580;
      line-height: 1.17;
    }

    .support-option-arrow {
      align-self: end;
      justify-self: end;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 46px;
      height: 46px;
      margin-bottom: 1px;
      border: 1px solid #D8E8F5;
      border-radius: 50%;
      color: #1762EC;
      background: #FFFFFF;
      box-shadow: 0 4px 10px rgb(0 48 114 / 8%);
      font-size: 1.45rem;
      font-weight: 820;
      line-height: 1;
      transition: transform .14s ease, box-shadow .14s ease;
    }

    .support-option-card:hover .support-option-arrow {
      transform: translateX(2px);
      box-shadow: 0 6px 13px rgb(0 48 114 / 11%);
    }

    /* ---------- STATUS ---------- */

    .support-status {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 96;
      max-width: min(440px, calc(100vw - 44px));
      margin: 0;
      padding: 10px 14px;
      border: 1px solid #CFE5F5;
      border-radius: 12px;
      color: #0A327F;
      background: rgb(255 255 255 / 96%);
      box-shadow: 0 12px 28px rgb(0 43 110 / 16%);
      font-size: .75rem;
      font-weight: 650;
      line-height: 1.35;
      opacity: 0;
      visibility: hidden;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease, visibility .18s ease;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .support-status.is-visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .support-page button:focus-visible,
    .support-page [data-page-title]:focus-visible {
      outline: 3px solid rgb(0 121 255 / 45%);
      outline-offset: 3px;
    }

    .support-option-card,
    .support-option-copy,
    .support-option-copy strong,
    .support-option-copy > span {
      min-width: 0;
    }

    /* ---------- RESPONSIVE ---------- */

    @media (max-width: 1320px) {
      .support-hero.page-hero[data-page-hero] {
        min-height: 330px;
        padding-inline: 30px;
      }

      .support-hero-copy {
        width: min(48%, 590px);
        min-width: 465px;
      }

      .support-option-card {
        grid-template-columns: 86px minmax(0, 1fr) 44px;
        min-height: 166px;
      }

      .support-option-icon {
        width: 74px;
        height: 74px;
        border-width: 8px;
      }
    }

    @media (max-width: 1080px) {
      .support-options-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .support-option-card {
        min-height: 158px;
      }

      .support-hero-image {
        object-position: 59% center;
      }
    }

    @media (max-width: 920px) {
      .support-hero.page-hero[data-page-hero] {
        min-height: 370px;
        padding: calc(var(--topbar-height) + 22px) 22px 20px;
      }

      .support-hero-overlay {
        background:
          linear-gradient(
            90deg,
            rgb(250 253 255 / 99%) 0%,
            rgb(250 253 255 / 96%) 42%,
            rgb(250 253 255 / 43%) 63%,
            rgb(5 34 87 / 44%) 100%
          );
      }

      .support-hero-copy {
        width: min(60%, 575px);
        min-width: 400px;
      }

      .support-hero-message {
        width: 145px;
        right: 2%;
      }

      .support-hero-message-script {
        font-size: .91rem;
      }
    }

    @media (max-width: 767px) {
      .support-page {
        overflow-x: hidden;
      }

      .support-hero.page-hero[data-page-hero] {
        min-height: 500px;
        padding: 26px 16px 18px;
      }

      .support-hero-image {
        object-position: 69% center;
      }

      .support-hero-overlay {
        background:
          linear-gradient(
            180deg,
            rgb(250 253 255 / 99%) 0%,
            rgb(250 253 255 / 96%) 43%,
            rgb(250 253 255 / 48%) 70%,
            rgb(5 34 87 / 25%) 100%
          );
      }

      .support-hero-content {
        min-height: 450px;
      }

      .support-hero-copy {
        width: 100%;
        min-width: 0;
      }

      .support-eyebrow {
        font-size: .74rem;
      }

      .support-hero-copy h1 {
        font-size: clamp(2.08rem, 10.7vw, 2.78rem);
      }

      .support-hero-description {
        max-width: 94%;
        font-size: .75rem;
      }

      .support-hero-tagline {
        font-size: .61rem;
      }

      .support-hero-message {
        display: none;
      }

      .support-options {
        padding: 11px 14px 16px;
      }

      .support-options-grid {
        grid-template-columns: minmax(0, 1fr);
        gap: 9px;
        padding: 8px;
      }

      .support-option-card {
        grid-template-columns: 82px minmax(0, 1fr) 44px;
        min-height: 132px;
        padding: 11px;
      }

      .support-option-icon {
        width: 70px;
        height: 70px;
        border-width: 7px;
      }

      .support-option-copy {
        gap: 5px;
      }

      .support-option-copy strong {
        font-size: .91rem;
      }

      .support-option-copy > span {
        font-size: .68rem;
      }

      .support-option-arrow {
        width: 42px;
        height: 42px;
        min-height: 42px;
      }

      .support-status {
        right: 12px;
        bottom: 12px;
        max-width: calc(100vw - 24px);
      }
    }

    @media (max-width: 460px) {
      .support-option-card {
        grid-template-columns: 67px minmax(0, 1fr) 40px;
        gap: 9px;
      }

      .support-option-icon {
        width: 58px;
        height: 58px;
        border-width: 6px;
      }

      .support-option-icon svg {
        width: 32px;
        height: 32px;
      }

      .support-option-copy > span br {
        display: none;
      }

      .support-option-arrow {
        width: 38px;
        height: 38px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .support-page *,
      .support-page *::before,
      .support-page *::after {
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }


    /* =========================================================
       HELP & SUPPORT — PHASE 2
       FAQ + Quick Links + Bottom CTA + Final Hardening
    ========================================================== */

    .support-panel {
      position: relative;
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--support-border);
      border-radius: 11px;
      background: rgb(255 255 255 / 97%);
      box-shadow:
        0 4px 12px rgb(0 47 115 / 4%),
        inset 0 1px 0 rgb(255 255 255 / 84%);
    }

    /* ---------- FAQ + QUICK LINKS WRAPPER ---------- */

    .support-content-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 14px;
      padding: 0 18px 14px;
    }

    .support-faq,
    .support-links {
      padding: 9px 10px 11px;
    }

    .support-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 45px;
      padding: 0 5px 7px;
    }

    .support-section-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .support-section-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      color: #1762EA;
    }

    .support-section-title-group h2 {
      margin: 0;
      color: #0D3DB1;
      font-size: .98rem;
      font-weight: 910;
      line-height: 1;
      letter-spacing: -.02em;
    }

    .support-view-all {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 38px;
      padding: 6px 4px 6px 10px;
      border: 0;
      color: #155ADD;
      background: transparent;
      font: inherit;
      font-size: .62rem;
      font-weight: 820;
      cursor: pointer;
      transition: transform .14s ease;
    }

    .support-view-all:hover {
      transform: translateX(2px);
    }

    .support-view-all span:last-child {
      font-size: 1rem;
    }

    /* ---------- FAQ ---------- */

    .support-faq-list {
      display: grid;
      gap: 7px;
    }

    .support-faq-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 28px;
      align-items: center;
      gap: 10px;
      min-width: 0;
      min-height: 47px;
      padding: 8px 12px 8px 14px;
      border: 1px solid #D9E8F5;
      border-radius: 9px;
      color: #3155A1;
      background:
        linear-gradient(90deg, #FCFEFF, #F7FBFF);
      text-align: left;
      font: inherit;
      font-size: .74rem;
      font-weight: 590;
      line-height: 1.12;
      cursor: pointer;
      transition:
        transform .14s ease,
        border-color .14s ease,
        box-shadow .14s ease;
    }

    .support-faq-item:hover {
      transform: translateX(2px);
      border-color: #BDD8F0;
      box-shadow: 0 4px 10px rgb(0 47 115 / 5%);
    }

    .support-faq-item > span:last-child {
      justify-self: end;
      color: #1260EE;
      font-size: 1.45rem;
      font-weight: 850;
      line-height: 1;
    }

    /* ---------- QUICK LINKS ---------- */

    .support-quick-links-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px 10px;
    }

    .support-link-card {
      --link-accent: #1765F4;
      --link-deep: #0E4BC8;
      --link-soft: #EAF4FF;

      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) 26px;
      align-items: center;
      gap: 10px;
      min-width: 0;
      min-height: 61px;
      padding: 7px 10px;
      border: 1px solid #D9E8F5;
      border-radius: 9px;
      color: #123FAF;
      background: #FFFFFF;
      text-align: left;
      font: inherit;
      font-size: .64rem;
      font-weight: 820;
      line-height: 1.1;
      cursor: pointer;
      box-shadow: 0 3px 8px rgb(0 47 115 / 3%);
      transition:
        transform .14s ease,
        border-color .14s ease,
        box-shadow .14s ease;
    }

    .support-link-card.is-blue {
      --link-accent: #1765F4;
      --link-deep: #0E4BC8;
      --link-soft: #EAF4FF;
    }

    .support-link-card.is-green {
      --link-accent: #19C887;
      --link-deep: #078B63;
      --link-soft: #E7FAF2;
    }

    .support-link-card.is-orange {
      --link-accent: #FF6B22;
      --link-deep: #E64A12;
      --link-soft: #FFF0E7;
    }

    .support-link-card.is-purple {
      --link-accent: #7138EE;
      --link-deep: #5425CB;
      --link-soft: #F0EAFF;
    }

    .support-link-card:hover {
      transform: translateY(-1px);
      border-color: color-mix(in srgb, var(--link-accent) 30%, #D9E8F5);
      box-shadow: 0 6px 12px rgb(0 47 115 / 6%);
    }

    .support-link-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 45px;
      height: 45px;
      border-radius: 8px;
      color: var(--link-deep);
      background: var(--link-soft);
      box-shadow: inset 0 1px 0 rgb(255 255 255 / 86%);
    }

    .support-link-arrow {
      justify-self: end;
      color: #1260EE;
      font-size: 1.42rem;
      font-weight: 850;
      line-height: 1;
      transition: transform .14s ease;
    }

    .support-link-card:hover .support-link-arrow {
      transform: translateX(2px);
    }

    /* ---------- BOTTOM SUPPORT CTA ---------- */

    .support-bottom-cta {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 18px;
      min-height: 83px;
      margin: 0 18px 16px;
      overflow: hidden;
      border: 1px solid #D7E8F5;
      border-radius: 11px;
      background:
        linear-gradient(90deg, #F7FBFF 0%, #F4FAFF 58%, #E8F7FF 100%);
      box-shadow:
        0 4px 12px rgb(0 47 115 / 4%),
        inset 0 1px 0 rgb(255 255 255 / 84%);
    }

    .support-bottom-cta::before {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 36%;
      pointer-events: none;
      background:
        linear-gradient(135deg, transparent 0 18%, #55D8F2 19% 36%, #28B1F1 37% 56%, #1B72EA 57% 100%);
      clip-path: polygon(28% 0, 100% 0, 100% 100%, 47% 100%, 0 0);
      opacity: .95;
    }

    .support-bottom-left,
    .support-bottom-button {
      position: relative;
      z-index: 2;
    }

    .support-bottom-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      padding-left: 14px;
    }

    .support-bottom-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 54px;
      height: 54px;
      flex: 0 0 auto;
      border-radius: 50%;
      color: #FFFFFF;
      background:
        linear-gradient(145deg, #31BFF8, #1457E6);
      box-shadow:
        0 6px 14px rgb(21 95 231 / 16%),
        inset 0 1px 0 rgb(255 255 255 / 20%);
    }

    .support-bottom-left h2 {
      margin: 0;
      color: #0E3CB1;
      font-size: .88rem;
      font-weight: 900;
      line-height: 1.05;
    }

    .support-bottom-left p {
      margin: 4px 0 0;
      color: #4164A4;
      font-size: .63rem;
      font-weight: 590;
      line-height: 1.13;
    }

    .support-bottom-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-width: 250px;
      min-height: 48px;
      margin-right: 20px;
      padding: 9px 18px;
      border: 0;
      border-radius: 8px;
      color: #FFFFFF;
      background:
        linear-gradient(135deg, #1D5AF0, #0E9FF2);
      box-shadow:
        0 7px 15px rgb(16 93 226 / 18%),
        inset 0 1px 0 rgb(255 255 255 / 18%);
      font: inherit;
      font-size: .66rem;
      font-weight: 830;
      cursor: pointer;
      transition: transform .14s ease, box-shadow .14s ease;
    }

    .support-bottom-button:hover {
      transform: translateX(2px);
      box-shadow:
        0 9px 18px rgb(16 93 226 / 23%),
        inset 0 1px 0 rgb(255 255 255 / 18%);
    }

    /* ---------- FINAL HARDENING ---------- */

    #support-faq-title,
    #support-links-title,
    #support-bottom-title {
      scroll-margin-top: 118px;
    }

    .support-page button {
      -webkit-tap-highlight-color: transparent;
    }

    .support-page button:focus-visible,
    .support-page [tabindex="-1"]:focus-visible {
      outline: 3px solid rgb(0 121 255 / 45%);
      outline-offset: 3px;
    }

    .support-faq-item,
    .support-link-card,
    .support-bottom-left,
    .support-section-title-group {
      min-width: 0;
    }

    .support-faq-item > span:first-child,
    .support-link-card > span:nth-child(2),
    .support-bottom-left p {
      overflow-wrap: anywhere;
    }

    .support-options,
    .support-content-grid,
    .support-bottom-cta {
      content-visibility: auto;
      contain-intrinsic-size: 1px 260px;
    }

    @media (max-width: 1000px) {
      .support-content-grid {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    @media (max-width: 767px) {
      .support-content-grid {
        gap: 10px;
        padding: 0 14px 13px;
      }

      .support-faq,
      .support-links {
        padding: 8px 9px 10px;
      }

      .support-section-header {
        align-items: flex-start;
      }

      .support-section-title-group h2 {
        font-size: .88rem;
        line-height: 1.08;
      }

      .support-view-all {
        min-height: 44px;
      }

      .support-quick-links-grid {
        grid-template-columns: minmax(0, 1fr);
      }

      .support-faq-item,
      .support-link-card {
        min-height: 54px;
      }

      .support-bottom-cta {
        grid-template-columns: minmax(0, 1fr);
        gap: 9px;
        margin: 0 14px 16px;
        padding: 11px 12px 12px;
      }

      .support-bottom-cta::before {
        width: 100%;
        height: 56px;
        top: auto;
        clip-path: polygon(40% 0, 100% 0, 100% 100%, 20% 100%);
      }

      .support-bottom-left {
        padding-left: 0;
      }

      .support-bottom-button {
        justify-self: end;
        min-width: min(100%, 260px);
        min-height: 46px;
        margin-right: 0;
      }

      #support-faq-title,
      #support-links-title,
      #support-bottom-title {
        scroll-margin-top: 132px;
      }
    }

    @media (max-width: 480px) {
      .support-section-header {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 3px;
      }

      .support-view-all {
        justify-self: end;
      }

      .support-link-card {
        grid-template-columns: 44px minmax(0, 1fr) 24px;
      }

      .support-link-icon {
        width: 41px;
        height: 41px;
      }

      .support-bottom-left {
        align-items: flex-start;
      }

      .support-bottom-icon {
        width: 48px;
        height: 48px;
      }

      .support-bottom-button {
        width: 100%;
        justify-self: stretch;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .support-page *,
      .support-page *::before,
      .support-page *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }


    /* =========================================================
       H2 OFFERINGS — COMPACT CORE OFFERINGS REFINEMENT
       Keeps all 5 cards in one desktop row and reduces card height.
    ========================================================== */

    /* Compact section framing */
    .offerings-core-section {
      padding: 9px 14px 15px;
    }

    .offerings-section-header {
      gap: 12px;
    }

    .offerings-section-title-row {
      gap: 9px;
    }

    .offerings-section-title-row h2 {
      font-size: .96rem;
    }

    .offerings-section-rule {
      width: 48px;
      height: 4px;
    }

    .offerings-section-title-row p {
      font-size: .63rem;
    }

    .offerings-coe-filter {
      gap: 5px;
    }

    .offerings-coe-filter-label {
      font-size: .54rem;
    }

    .offerings-coe-chip {
      min-height: 25px;
      padding: 4px 9px;
      border-radius: 6px;
      font-size: .52rem;
    }

    /* Five compact offering cards on normal desktop widths */
    .core-offerings-grid {
      grid-template-columns: repeat(5, minmax(0, 1fr));
      align-items: stretch;
      gap: 9px;
      margin-top: 7px;
    }

    .core-offering-card {
      min-height: 0 !important;
      height: auto;
      padding: 6px 6px 6px;
      border-radius: 10px;
    }

    .core-offering-card::before {
      height: 34%;
    }

    .core-offering-card-topline {
      min-height: 23px;
      padding: 0 2px;
    }

    .core-offering-number {
      font-size: .95rem;
    }

    .core-offering-coe-chip {
      min-height: 21px;
      padding: 3px 7px;
      border-radius: 5px;
      font-size: .46rem;
    }

    /* Main height reduction: artwork no longer dominates card */
    .core-offering-visual {
      height: 92px;
      margin: 0 -1px 4px;
      border-radius: 7px;
    }

    .core-offering-image {
      padding: 0;
    }

    .core-offering-content {
      padding: 0 3px;
    }

    .core-offering-content h3 {
      font-size: .90rem;
      line-height: 1;
    }

    .core-offering-coe {
      min-height: 19px;
      margin: 2px 0 3px;
      font-size: .52rem;
      line-height: 1.1;
    }

    /* Keep descriptions aligned but much shorter */
    .core-offering-description {
      min-height: 44px;
      margin: 0 0 4px;
      font-size: .53rem;
      line-height: 1.18;
    }

    .offering-artifacts {
      gap: 0;
      margin-top: 0;
      padding-top: 4px;
    }

    .offering-artifacts-title {
      margin-bottom: 2px;
      font-size: .48rem;
    }

    .offering-artifacts button {
      min-height: 17px;
      gap: 5px;
      padding: 0;
      font-size: .51rem;
      line-height: 1.05;
    }

    .artifact-icon {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      font-size: .42rem;
    }

    .offering-explore-button {
      min-height: 31px;
      margin-top: 5px;
      padding: 5px 7px;
      border-radius: 7px;
      font-size: .58rem;
      gap: 8px;
    }

    .offering-explore-button > span:last-child {
      font-size: .88rem;
    }

    /* Desktop/laptop:
       retain 5 columns instead of prematurely switching to 3 + 2. */
    @media (min-width: 1120px) {
      .core-offerings-grid {
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 9px;
      }

      .core-offering-card {
        min-height: 0 !important;
      }

      .core-offering-visual {
        height: 92px;
      }

      .core-offering-description {
        min-height: 44px;
      }
    }

    /* Smaller laptop/tablet: 3 columns, but still compact. */
    @media (min-width: 820px) and (max-width: 1119px) {
      .core-offerings-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }

      .core-offering-card {
        min-height: 0 !important;
      }

      .core-offering-visual {
        height: 105px;
      }

      .core-offering-description {
        min-height: 38px;
      }
    }

    /* Tablet */
    @media (min-width: 621px) and (max-width: 819px) {
      .core-offerings-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .core-offering-card {
        min-height: 0 !important;
      }

      .core-offering-visual {
        height: 118px;
      }

      .core-offering-description {
        min-height: 0;
      }
    }

    /* Mobile keeps the existing readable one-column behavior,
       but removes the oversized 190px artwork. */
    @media (max-width: 620px) {
      .offerings-core-section {
        padding: 12px 12px 16px;
      }

      .core-offerings-grid {
        grid-template-columns: minmax(0, 1fr);
        gap: 9px;
      }

      .core-offering-card {
        min-height: 0 !important;
        padding: 8px;
      }

      .core-offering-visual {
        height: 145px;
        margin-bottom: 5px;
      }

      .core-offering-content h3 {
        font-size: 1.02rem;
      }

      .core-offering-coe {
        font-size: .62rem;
      }

      .core-offering-description {
        min-height: 0;
        margin-bottom: 6px;
        font-size: .64rem;
      }

      .offering-artifacts-title {
        font-size: .57rem;
      }

      .offering-artifacts button {
        min-height: 27px;
        font-size: .62rem;
      }

      .artifact-icon {
        width: 18px;
        height: 18px;
      }

      .offering-explore-button {
        min-height: 40px;
        font-size: .69rem;
      }
    }


    /* =========================================================
       H3 OPPORTUNITIES — COMPACT LOWER SECTIONS REFINEMENT
       Solutioning Toolkit + Repositories + Quick Access
       Preserves existing content and behavior.
    ========================================================== */

    /* ---------- Shared lower-section density ---------- */

    .solutioning-toolkit-section,
    .sales-pillars-panel,
    .deal-retrospective-panel,
    .opportunities-quick-access {
      border-radius: 10px;
      box-shadow:
        0 4px 12px rgb(0 48 116 / 4%),
        inset 0 1px 0 rgb(255 255 255 / 84%);
    }

    .opportunities-panel-header {
      min-height: 45px;
      margin-bottom: 6px;
      gap: 12px;
    }

    .opportunities-panel-title-group {
      gap: 9px;
    }

    .opportunities-panel-icon {
      width: 43px;
      height: 43px;
      border-radius: 8px;
    }

    .opportunities-panel-icon.is-repository,
    .opportunities-panel-icon.is-retrospective {
      width: 41px;
      height: 41px;
    }

    .opportunities-panel-icon svg {
      width: 25px;
      height: 25px;
    }

    .opportunities-panel-title-group h2 {
      font-size: .91rem;
      line-height: 1.02;
    }

    .opportunities-panel-title-group p {
      margin-top: 2px;
      font-size: .58rem;
      line-height: 1.12;
    }

    .opportunities-view-all {
      min-height: 30px;
      gap: 7px;
      padding: 3px 4px;
      font-size: .59rem;
    }

    /* ---------- Solutioning Toolkit ---------- */

    .solutioning-toolkit-section {
      margin: 0 14px 10px;
      padding: 7px 9px 9px;
    }

    /* Keep all 8 toolkit resources visible in one row at
       normal desktop/laptop widths. */
    .solutioning-toolkit-grid {
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: 7px;
    }

    .toolkit-card {
      grid-template-rows: 43px minmax(2.55rem, auto);
      min-height: 104px !important;
      padding: 7px 6px 6px;
      border-radius: 8px;
    }

    .toolkit-card-icon {
      width: 40px;
      height: 40px;
      border-radius: 7px;
    }

    .toolkit-card-icon svg {
      width: 25px;
      height: 25px;
    }

    .toolkit-card-label {
      align-self: start;
      padding-top: 4px;
      font-size: .57rem;
      font-weight: 830;
      line-height: 1.03;
    }

    .toolkit-card-arrow {
      right: 6px;
      bottom: 4px;
      font-size: 1.03rem;
    }

    /* ---------- Repository row ---------- */

    .opportunities-repository-grid {
      grid-template-columns: minmax(0, 1.03fr) minmax(0, 1fr);
      gap: 10px;
      margin: 0 14px 10px;
    }

    .sales-pillars-panel,
    .deal-retrospective-panel {
      padding: 7px 9px 9px;
    }

    .sales-pillars-grid {
      gap: 7px;
    }

    .sales-pillar-card {
      grid-template-columns: 74px minmax(0, 1fr) 30px;
      min-height: 68px !important;
      height: 68px;
      padding-right: 6px;
      border-radius: 8px;
    }

    .sales-pillar-media {
      width: 74px;
      height: 68px;
      border-radius: 7px 0 0 7px;
    }

    .sales-pillar-card strong {
      padding-left: 8px;
      font-size: .66rem;
    }

    .sales-pillar-arrow {
      width: 28px;
      height: 28px;
      font-size: 1.05rem;
    }

    /* Make failed-image fallbacks feel intentional rather than
       looking like duplicate text blocks. */
    .sales-pillar-fallback {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      color: #1553B7;
      background:
        linear-gradient(135deg, #EAF5FF, #DDEEFF);
      font-size: .58rem;
      line-height: 1;
      text-align: center;
    }

    /* Win/Loss cards */
    .deal-retrospective-grid {
      gap: 8px;
    }

    .deal-retrospective-card {
      grid-template-columns: 46px minmax(0, 1fr) 31px;
      gap: 8px;
      min-height: 68px !important;
      height: 68px;
      padding: 7px 8px;
      border-radius: 8px;
    }

    .deal-retrospective-icon {
      width: 42px;
      height: 42px;
      border-radius: 7px;
    }

    .deal-retrospective-icon svg {
      width: 25px;
      height: 25px;
    }

    .deal-retrospective-copy {
      gap: 2px;
    }

    .deal-retrospective-copy strong {
      font-size: .66rem;
    }

    .deal-retrospective-copy > span {

    /* =========================================================
       H3 OPPORTUNITIES — ENTRY CARD READABILITY REFINEMENT
       Keeps imagery visible while protecting all text labels.
    ========================================================== */

    /* Stronger left-to-right veil:
       copy area stays clean; artwork remains vivid on the right. */
    .opportunity-entry-gradient {
      background:
        linear-gradient(
          90deg,
          rgb(255 255 255 / 100%) 0%,
          rgb(255 255 255 / 100%) 33%,
          rgb(255 255 255 / 98%) 46%,
          rgb(255 255 255 / 92%) 57%,
          rgb(255 255 255 / 66%) 68%,
          rgb(255 255 255 / 22%) 80%,
          rgb(255 255 255 / 0%) 100%
        );
    }

    /* Give the icon + copy their own subtle readable surface.
       This avoids text competing with bright dashboard imagery. */
    .opportunity-entry-content::before {
      content: "";
      position: absolute;
      z-index: -1;
      top: 8px;
      left: 8px;
      bottom: 8px;
      width: min(64%, 375px);
      border-radius: 9px;
      pointer-events: none;
      background:
        linear-gradient(
          90deg,
          rgb(255 255 255 / 96%) 0%,
          rgb(255 255 255 / 92%) 76%,
          rgb(255 255 255 / 0%) 100%
        );
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }

    /* Stronger typography contrast */
    .opportunity-entry-copy h2 {
      color: #082F9F;
      font-size: .98rem;
      font-weight: 920;
      text-shadow: 0 1px 0 rgb(255 255 255 / 90%);
    }

    .opportunity-entry-copy p {
      max-width: 315px;
      color: #284F96;
      font-size: .69rem;
      font-weight: 640;
      line-height: 1.24;
      text-shadow: 0 1px 0 rgb(255 255 255 / 82%);
    }

    /* CTA also gets a protected white pill so the label remains
       readable regardless of the artwork underneath. */
    .opportunity-entry-link {
      min-height: 31px;
      padding: 4px 10px;
      border: 1px solid rgb(184 211 239 / 70%);
      border-radius: 999px;
      color: #084DCC;
      background: rgb(255 255 255 / 91%);
      box-shadow:
        0 2px 7px rgb(0 47 115 / 6%),
        inset 0 1px 0 rgb(255 255 255 / 88%);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    .opportunity-entry-link:hover {
      color: var(--entry-deep);
      background: #FFFFFF;
      border-color: color-mix(in srgb, var(--entry-accent) 30%, #C9DDF0);
    }

    /* Make the icon tile more opaque so the icon is never lost
       against bright portions of the image. */
    .opportunity-entry-icon {
      background:
        color-mix(in srgb, var(--entry-accent) 12%, #FFFFFF);
      box-shadow:
        inset 0 0 0 1px rgb(255 255 255 / 92%),
        0 3px 9px rgb(0 47 115 / 6%);
    }

    /* Keep image detail on the far-right side */
    .opportunity-entry-card.is-dashboard .opportunity-entry-image {
      object-position: 72% center;
    }

    .opportunity-entry-card.is-process .opportunity-entry-image {
      object-position: 73% center;
    }

    .opportunity-entry-card.is-engagement .opportunity-entry-image {
      object-position: 72% center;
    }

    /* On narrower layouts, reserve a little more white space
       because the image and text naturally overlap sooner. */
    @media (max-width: 1180px) {
      .opportunity-entry-gradient {
        background:
          linear-gradient(
            90deg,
            rgb(255 255 255 / 100%) 0%,
            rgb(255 255 255 / 100%) 39%,
            rgb(255 255 255 / 96%) 55%,
            rgb(255 255 255 / 72%) 68%,
            rgb(255 255 255 / 20%) 84%,
            transparent 100%
          );
      }

      .opportunity-entry-content::before {
        width: min(70%, 405px);
      }
    }

    @media (max-width: 767px) {
      .opportunity-entry-content::before {
        top: 7px;
        left: 7px;
        right: 7px;
        bottom: 7px;
        width: auto;
        background: rgb(255 255 255 / 88%);
        border: 1px solid rgb(214 231 245 / 72%);
      }

      .opportunity-entry-gradient {
        background:
          linear-gradient(
            180deg,
            rgb(255 255 255 / 96%) 0%,
            rgb(255 255 255 / 90%) 60%,
            rgb(255 255 255 / 55%) 100%
          );
      }

      .opportunity-entry-copy p {
        max-width: none;
      }
    }


    /* =========================================================
       H1 OVERVIEW — GROUPED HIGHLIGHTED REFERENCE ITEMS
       Keep important resources inside their natural list group.
    ========================================================== */

    /* With featured resources now kept inside the list, cards no longer
       need a detached bottom action treatment. */
    .overview-reference-links {
      margin-bottom: 0;
    }

    .overview-reference-row.is-highlighted {
      position: relative;
      color: #083DBA;
      background:
        linear-gradient(90deg, #E9F4FF 0%, #F4F9FF 58%, #FFFFFF 100%);
      font-weight: 760;
      box-shadow: inset 3px 0 0 #1765F4;
    }

    .overview-reference-row.is-highlighted:hover {
      color: #0649D8;
      background:
        linear-gradient(90deg, #DDEFFF 0%, #EDF7FF 60%, #FFFFFF 100%);
    }

    .overview-reference-row.is-highlighted .overview-reference-row-icon {
      color: #FFFFFF;
      background: linear-gradient(145deg, #2A79FF 0%, #1646D5 100%);
      box-shadow:
        0 3px 8px rgb(17 75 211 / 22%),
        inset 0 1px 0 rgb(255 255 255 / 20%);
    }

    .overview-reference-row.is-highlighted .overview-reference-chevron {
      color: #0757EF;
      font-weight: 800;
    }

    .overview-reference-row.is-highlighted strong {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .overview-reference-row.is-highlighted strong::after {
      content: "KEY";
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 15px;
      padding: 1px 5px;
      border: 1px solid #B9D8FF;
      border-radius: 999px;
      color: #0B55D7;
      background: #FFFFFF;
      font-size: .40rem;
      font-weight: 850;
      line-height: 1;
      letter-spacing: .055em;
    }

    /* Legacy detached featured-link markup is intentionally hidden if an
       older cached page template appears before the Phase 4 renderer runs. */
    .overview-reference-featured-link {
      display: none !important;
    }

    @media (max-width: 767px) {
      .overview-reference-row.is-highlighted strong::after {
        font-size: .38rem;
      }

    /* =========================================================
       H1 OVERVIEW — MANAGED LINK / COMING SOON STATES
       Gray treatment is applied only after the link registry has
       resolved and no usable URL exists for a configured key.
    ========================================================== */

    .overview-page [data-managed-link-missing="true"] {
      --overview-missing-bg: #F2F5F8;
      --overview-missing-border: #D7DEE7;
      --overview-missing-text: #6E7C8D;
      --overview-missing-icon: #8190A2;

      cursor: pointer !important;
      filter: saturate(.22);
      opacity: .78;
      border-color: var(--overview-missing-border) !important;
      box-shadow: none !important;
      transition:
        opacity 160ms ease,
        transform 160ms ease,
        background-color 160ms ease,
        border-color 160ms ease;
    }

    .overview-page [data-managed-link-missing="true"]:hover {
      opacity: .94;
      transform: translateY(-1px);
      border-color: #C7D0DA !important;
    }

    .overview-page .overview-reference-row[data-managed-link-missing="true"],
    .overview-page .overview-capability-card[data-managed-link-missing="true"],
    .overview-page .overview-card-arrow[data-managed-link-missing="true"],
    .overview-page .overview-solution-arrow[data-managed-link-missing="true"],
    .overview-page .overview-video-button[data-managed-link-missing="true"] {
      color: var(--overview-missing-text) !important;
    }

    .overview-page .overview-reference-row[data-managed-link-missing="true"] {
      background: var(--overview-missing-bg) !important;
    }

    .overview-page .overview-reference-row[data-managed-link-missing="true"] strong,
    .overview-page .overview-reference-row[data-managed-link-missing="true"] span,
    .overview-page .overview-reference-row[data-managed-link-missing="true"] svg {
      color: var(--overview-missing-text) !important;
      stroke: var(--overview-missing-icon) !important;
    }

    .overview-page .overview-reference-row.is-highlighted[data-managed-link-missing="true"] {
      background:
        linear-gradient(135deg, #F2F5F8 0%, #E9EEF3 100%) !important;
      border-color: #D5DDE6 !important;
    }

    .overview-page .overview-reference-row.is-highlighted[data-managed-link-missing="true"] strong::after {
      content: "SOON";
      color: #69798A;
      background: #E2E7EC;
      border-color: #CCD5DE;
    }

    .overview-page .overview-capability-card[data-managed-link-missing="true"] {
      background: #F3F6F8 !important;
    }

    .overview-page .overview-video-button[data-managed-link-missing="true"],
    .overview-page .overview-card-arrow[data-managed-link-missing="true"],
    .overview-page .overview-solution-arrow[data-managed-link-missing="true"] {
      background: #EEF2F5 !important;
    }

    /* Coming-soon dialog */
    .overview-coming-soon-dialog {
      width: min(92vw, 470px);
      max-width: 470px;
      margin: auto;
      padding: 0;
      border: 0;
      border-radius: 22px;
      overflow: visible;
      color: #0A2757;
      background: transparent;
      box-shadow: none;
    }

    .overview-coming-soon-dialog::backdrop {
      background: rgb(4 20 43 / 55%);
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
    }

    .overview-coming-soon-card {
      position: relative;
      overflow: hidden;
      padding: 36px 34px 30px;
      border: 1px solid rgb(199 222 241 / 82%);
      border-radius: 22px;
      text-align: center;
      background:
        radial-gradient(circle at 85% 4%, rgb(0 183 255 / 15%), transparent 32%),
        radial-gradient(circle at 12% 88%, rgb(86 69 255 / 9%), transparent 34%),
        linear-gradient(145deg, #FFFFFF 0%, #F6FBFF 100%);

        0 28px 80px rgb(0 28 70 / 24%),
        inset 0 1px 0 rgb(255 255 255 / 90%);

    .overview-coming-soon-card::before {

      position: absolute;
      top: 0;
      left: 12%;
      right: 12%;

    }

    .overview-coming-soon-close {
      position: absolute;
      z-index: 2;
      top: 15px;
      right: 15px;
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      padding: 0;
      border: 1px solid #DFE9F2;
      border-radius: 50%;
      color: #69809A;
      background: rgb(255 255 255 / 76%);
      cursor: pointer;
      transition:
        color 150ms ease,
        background-color 150ms ease,
        transform 150ms ease;
    }

    .overview-coming-soon-close:hover {
      color: #174CA0;
      background: #FFFFFF;
      transform: rotate(4deg);
    }

    .overview-coming-soon-close svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;

    .overview-coming-soon-icon {
      display: grid;
      width: 66px;
      height: 66px;
      margin: 0 auto 17px;
      place-items: center;
      border-radius: 20px;
      color: #096AF2;
      background:
        linear-gradient(145deg, #EAF5FF 0%, #E8F9FB 100%);
      box-shadow:
        inset 0 0 0 1px rgb(150 204 245 / 38%),
        0 9px 24px rgb(0 91 194 / 10%);
    }

    .overview-coming-soon-icon svg {
      width: 37px;
      height: 37px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.55;
      stroke-linecap: round;
      stroke-linejoin: round;

    .overview-coming-soon-eyebrow {
      margin: 0 0 8px;
      color: #0877E8;
      font-size: .68rem;
      font-weight: 850;
      letter-spacing: .14em;
    }

    .overview-coming-soon-dialog h2 {
      margin: 0;
      color: #0A2C62;
      font-size: clamp(1.25rem, 3vw, 1.55rem);
      line-height: 1.12;
      font-weight: 850;
      letter-spacing: -.025em;

    .overview-coming-soon-resource {

      font-weight: 760;
      line-height: 1.35;

    .overview-coming-soon-message {

    .overview-coming-soon-action {
      min-height: 40px;
      margin-top: 22px;

    @media (max-width: 560px) {

    /* =========================================================
       H1 OVERVIEW — SOLUTION CAPABILITY READABILITY FIX
       Prevents EDGE / INFRA / NETSEC labels and descriptions from
       breaking character-by-character inside compact capability cards.
    ========================================================== */

    .overview-page .overview-capability-copy {
      min-width: 0;
      overflow-wrap: normal !important;
      word-break: normal !important;
      hyphens: none;
    }

    .overview-page .overview-capability-copy strong {
      display: block;
      width: 100%;
      white-space: nowrap;
      overflow-wrap: normal !important;
      word-break: keep-all !important;
      line-height: 1.12;
    }

    .overview-page .overview-capability-copy > span {
      display: block;
      width: 100%;
      overflow-wrap: normal !important;
      word-break: normal !important;
      hyphens: none;
      line-height: 1.32;
    }

    /* Give the copy more room in 3-item capability rows. */
    .overview-page .overview-capability-grid-3 .overview-capability-card {
      grid-template-columns: 30px minmax(0, 1fr) 10px;
      gap: 7px;
      padding: 10px 8px;
    }

    .overview-page .overview-capability-grid-3 .overview-capability-icon {
      width: 30px;
      height: 30px;
      border-radius: 8px;
    }

    .overview-page .overview-capability-grid-3 .overview-capability-copy strong {
      font-size: .70rem;
    }

    .overview-page .overview-capability-grid-3 .overview-capability-copy > span {
      font-size: .57rem;
    }

    .overview-page .overview-capability-grid-3 .overview-capability-chevron {
      font-size: 1.18rem;
    }

    /* At narrower widths, two columns are more readable than squeezing
       three capability cards into a narrow row. */
    @media (max-width: 900px) and (min-width: 541px) {
      .overview-page .overview-capability-grid-3,
      .overview-page .overview-solution-card.is-modernization .overview-capability-grid-3 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .overview-page .overview-capability-grid-3 .overview-capability-card {
        grid-template-columns: 38px minmax(0, 1fr) 14px;
        min-height: 82px;
        padding: 10px 11px;

      .overview-page .overview-capability-grid-3 .overview-capability-icon {
        width: 38px;
        height: 38px;
      }

      }

      .overview-page .overview-capability-grid-3 .overview-capability-copy > span {
        font-size: .64rem;
      }
