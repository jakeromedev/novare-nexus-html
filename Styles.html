<style>
    /* 1. DESIGN TOKENS */
    :root {
      color-scheme: light;
      --navy-950: #001126;
      --navy-900: #01172F;
      --navy-850: #031B3D;
      --blue-700: #004ECF;
      --blue-600: #0068F5;
      --blue-500: #0785FF;
      --cyan-500: #00CFE8;
      --cyan-400: #13E1E1;
      --cyan-300: #55E8F2;
      --page-bg: #F5FAFE;
      --surface: #FFFFFF;
      --surface-soft: #F3F8FC;
      --surface-blue: #EAF6FD;
      --border-light: #D8E9F5;
      --border-blue: #BFDDF4;
      --text-primary: #071B4B;
      --text-secondary: #526987;
      --text-muted: #7185A0;
      --accent-purple: #742CE8;
      --accent-orange: #FF861F;
      --accent-green: #13BF85;
      --accent-red: #F04B4B;
      --sidebar-width: 235px;
      --topbar-height: 72px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-card: 14px;
      --radius-pill: 999px;
      --shadow-sm: 0 2px 8px rgb(7 27 75 / 5%);
      --shadow-md: 0 8px 24px rgb(7 27 75 / 8%);
      --content-padding: clamp(20px, 3vw, 48px);
    }

    /* 2. RESET / BASE */
    [hidden] { display: none !important; }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", "Arial", sans-serif;
      font-size: 1rem;
      line-height: 1.5;
      color: var(--text-primary);
      background: var(--page-bg);
    }
    button, input, select, textarea { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    a { color: var(--blue-700); }
    h1, h2, p { margin: 0; }
    svg { display: block; flex-shrink: 0; }
    :focus-visible {
      outline: 3px solid var(--blue-600);
      outline-offset: 4px;
    }
    .skip-link {
      position: absolute;
      z-index: 10;
      top: 12px;
      left: 12px;
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      background: var(--surface);
      transform: translateY(-180%);
    }
    .skip-link:focus { transform: translateY(0); }

    .button, .icon-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      border: 1px solid var(--border-blue);
      border-radius: var(--radius-sm);
      padding: 10px 16px;
      color: var(--text-primary);
      background: var(--surface);
      font-size: .875rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }
    .button:hover, .icon-button:hover { background: var(--surface-blue); }
    .button--primary { color: var(--surface); background: var(--blue-700); border-color: var(--blue-700); }
    .button--primary:hover { background: var(--blue-600); }
    .icon-button { width: 44px; padding: 10px; flex-shrink: 0; }
    .button:disabled, .icon-button:disabled { opacity: .5; cursor: not-allowed; }
    .card { padding: 24px; border: 1px solid var(--border-light); border-radius: var(--radius-card); background: var(--surface); }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border: 1px solid var(--border-blue);
      border-radius: var(--radius-pill);
      color: var(--blue-700);
      background: var(--surface-blue);
      font-size: .75rem;
      font-weight: 600;
    }
    .divider { width: 100%; height: 1px; margin: 16px 0; border: 0; background: var(--border-light); }
    .shadow-sm { box-shadow: var(--shadow-sm); }
    .shadow-md { box-shadow: var(--shadow-md); }
    .section-label { font-size: .6875rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }

    /* Reserved controls have no backend behavior yet. */
    [aria-disabled="true"] { cursor: default; }

    /* 3. APP LAYOUT */
    #nexus-app {
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
      min-height: 100vh;
    }
    #nexus-workspace { position: relative; display: flex; flex-direction: column; min-width: 0; }
    #nexus-content { flex: 1; min-width: 0; overflow-wrap: anywhere; }

    /* 4. SIDEBAR */
    #nexus-sidebar {
      position: sticky;
      top: 0;
      align-self: start;
      height: 100vh;
      height: 100dvh;
      overflow: visible;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
      padding: 8px 16px 14px;
      color: var(--surface);
      background:
        radial-gradient(circle at 50% 0%, rgb(0 199 255 / 12%), transparent 28%),
        linear-gradient(180deg, #02112C 0%, #041B43 38%, #031538 100%);
      border-right: 1px solid rgb(121 183 255 / 12%);
      box-shadow: inset -1px 0 0 rgb(255 255 255 / 3%), 10px 0 24px rgb(1 11 32 / 26%);
      z-index: 5;
    }
    .sidebar-scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: visible; padding: 0 6px 64px; margin: 0 -6px; display: flex; flex-direction: column; gap: 8px; scrollbar-width: thin; }
    .sidebar-scroll::-webkit-scrollbar { width: 6px; }
    .sidebar-scroll::-webkit-scrollbar-track { background: transparent; }
    .sidebar-scroll::-webkit-scrollbar-thumb { background: rgb(203 224 244 / 34%); border-radius: 999px; }
    .sidebar-label { color: rgb(255 255 255 / 78%); font-size: .75rem; text-transform: uppercase; letter-spacing: .18em; font-weight: 700; }
    #nexus-sidebar :focus-visible { outline-color: var(--cyan-300); }

    /* 5. NAVIGATION */
    .nav-row {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 42px;
      width: 100%;
      padding: 8px 12px;
      border: 1px solid transparent;
      border-radius: 14px;
      color: var(--border-light);
      background: transparent;
      text-align: left;
      text-decoration: none;
      font-size: .86rem;
      font-weight: 500;
      transition: background .18s ease, border-color .18s ease, box-shadow .18s ease, color .18s ease;
    }
    a.nav-row:hover, button.nav-row:hover { background: rgb(7 133 255 / 12%); color: var(--surface); }
    .nav-row.is-active, .nav-row[aria-current="page"] {
      color: var(--surface);
      background: linear-gradient(90deg, rgb(9 82 226 / 94%), rgb(12 113 255 / 84%) 52%, rgb(8 96 255 / 72%) 100%);
      border-color: rgb(58 224 255 / 80%);
      box-shadow: 0 0 0 1px rgb(49 221 255 / 36%) inset, 0 0 18px rgb(0 194 255 / 45%), inset 0 0 18px rgb(181 241 255 / 14%);
    }
    .sidebar-nav { display: grid; gap: 1px; }
    .sidebar-nav .sidebar-label { padding: 10px 8px 4px; }
    .sidebar-nav .divider { margin: 6px 8px 8px; background: rgb(191 221 244 / 22%); }
    .sidebar-nav .nav-row svg { width: 18px; height: 18px; }

    /* 6. TOPBAR */
    #nexus-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: var(--topbar-height);
      padding: 14px 24px;
      border-bottom: 1px solid var(--border-light);
      background: rgb(255 255 255 / 90%);
      backdrop-filter: blur(12px);
    }

    /* 7. SEARCH */
    .global-search {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1 1 360px;
      max-width: 680px;
      min-width: 0;
      height: 44px;
      padding: 0 12px;
      border: 1px solid var(--border-blue);
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      background: var(--surface);
    }
    .global-search:focus-within { border-color: var(--blue-600); box-shadow: 0 0 0 3px rgb(0 207 232 / 16%); }
    .global-search input { width: 100%; min-width: 0; border: 0; padding: 0; color: var(--text-primary); background: transparent; font-size: .8125rem; }
    .global-search input:focus { outline: none; }
    .global-search input::placeholder { color: var(--text-secondary); opacity: 1; }
    .search-keycap { flex-shrink: 0; padding: 2px 5px; border: 1px solid var(--border-light); border-radius: 4px; font: .75rem "Inter", "Arial", sans-serif; white-space: nowrap; }
    .search-filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
    .filter-chip { min-height: 32px; padding: 5px 12px; color: var(--text-secondary); background: var(--surface); }
    .filter-chip[aria-pressed="true"] { color: var(--blue-700); border-color: var(--blue-500); background: var(--surface-blue); }

    /* 8. USER CONTROLS */
    .topbar-controls { display: flex; align-items: center; gap: 4px; }
    .topbar-controls > .icon-button { position: relative; border-color: transparent; background: transparent; color: var(--text-secondary); }
    .topbar-controls > .icon-button:hover { background: var(--surface-blue); }
    .notification-dot { position: absolute; top: 9px; right: 10px; width: 7px; height: 7px; border: 1px solid var(--surface); border-radius: 50%; background: var(--accent-red); }
    .user-profile { display: flex; align-items: center; gap: 10px; margin-left: 8px; padding-left: 16px; border-left: 1px solid var(--border-light); }
    .user-details { display: grid; }
    .user-name { font-size: .875rem; font-weight: 600; white-space: nowrap; }
    .user-department { font-size: .75rem; color: var(--text-secondary); }

    /* 9. PAGE CONTAINER */
    .page-container { padding: var(--content-padding); }
    .page-development-placeholder { padding-block: 12px 40px; }
    .page-development-placeholder .section-label { color: var(--blue-700); }
    .page-development-placeholder h1 {
      margin-top: 10px;
      font-size: clamp(1.75rem, 3vw, 2.5rem);
      font-weight: 600;
      letter-spacing: -.035em;
      line-height: 1.2;
    }
    .page-development-placeholder p { margin-top: 16px; color: var(--text-secondary); }

    /* 10. ASK NOSCA */
    .nosca-launcher {
      position: absolute;
      right: -34px;
      bottom: 16px;
      z-index: 6;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 11px 16px;
      min-width: 162px;
      min-height: 50px;
      border: 1px solid rgb(96 238 255 / 55%);
      border-radius: var(--radius-pill);
      color: var(--surface);
      background: linear-gradient(90deg, #18D1F0 0%, #168CFF 46%, #2553EC 100%);
      box-shadow: 0 12px 28px rgb(0 72 173 / 42%), 0 0 0 1px rgb(255 255 255 / 8%) inset;
    }
    .nosca-launcher svg { flex-shrink: 0; }
    .nosca-launcher span { font-size: .95rem; font-weight: 700; white-space: nowrap; }
    .nosca-launcher:hover { background: linear-gradient(90deg, #23D7F2 0%, #2496FF 46%, #2E5AF0 100%); }
    .nosca-dialog { width: min(440px, calc(100% - 32px)); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); padding: 28px; border-color: var(--border-blue); color: var(--text-primary); overflow-wrap: anywhere; }
    .nosca-dialog::backdrop { background: rgb(0 17 38 / 60%); }
    .nosca-dialog h2 { font-size: 1.25rem; }
    .nosca-dialog p { margin-top: 12px; color: var(--text-secondary); }
    .nosca-dialog form { margin-top: 24px; text-align: right; }

    /* 11. PLACEHOLDERS */
    .image-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      overflow: hidden;
      padding: 12px;
      border: 1px dashed var(--border-blue);
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      background: linear-gradient(135deg, var(--surface-blue), var(--surface-soft));
      text-align: center;
      font-size: .75rem;
      overflow-wrap: anywhere;
    }
    .sidebar-brand {
      position: sticky;
      top: 0;
      z-index: 8;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 72px;
      flex-shrink: 0;
      overflow: hidden;
      padding: 0;
      margin: 0;
      background: transparent;
    }
    .sidebar-brand::before,
    .sidebar-brand::after { content: none; }
    .sidebar-logo {
      display: block;
      width: 100%;
      height: auto;
      max-width: none;
      max-height: none;
      object-fit: contain;
      object-position: center;
      filter: none;
    }

    .sidebar-logo-fallback {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      color: #FFFFFF;
      line-height: 1;
      white-space: nowrap;
    }
    .sidebar-logo-fallback-brand { font-size: .72rem; font-weight: 800; letter-spacing: .12em; }
    .sidebar-logo-fallback-divider { color: var(--cyan-300); opacity: .85; }
    .sidebar-logo-fallback-name { font-size: 1.05rem; font-weight: 750; letter-spacing: .08em; }

    .avatar-placeholder { width: 38px; height: 38px; padding: 0; flex-shrink: 0; border-radius: var(--radius-pill); color: var(--blue-700); font-weight: 600; }

    /* HOME TOP AREA — references/home-banner.png is the visual source. */
    .home-page {
      --home-navy: #061C54; --home-cobalt: #0755E8; --home-electric-blue: #008BFF; --home-cyan: #00D4F0;
      --home-page-bg: #F4FAFE; --home-white: #FFFFFF; --home-soft-blue: #EDF7FD; --home-border: #D7E8F5;
      --quick-blue: #168BFF; --quick-orange: #FF8A24; --quick-purple: #6F35E8; --quick-green: #13C98A;
      width: 100%; padding: 0 0 28px; color: var(--home-navy); background: var(--home-page-bg);
    }
    /* Desktop masthead: the hero starts at the top of the workspace and the global search floats above it. */
    .home-hero {
      position: relative; isolation: isolate; overflow: hidden; display: flex; align-items: center;
      min-height: 468px; padding: 126px 54px 104px; border-radius: 0; background: #E4F4FF;
    }
    .home-hero-copy { position: relative; z-index: 2; width: 42%; max-width: 650px; }
    .home-welcome { color: #0052D9; font-size: clamp(1.5rem, 2vw, 2rem); font-weight: 600; line-height: 1.2; }
    .home-hero h1 { margin: 2px 0 12px; font-size: clamp(3.65rem, 4.45vw, 4.55rem); font-weight: 750; line-height: 1.03; letter-spacing: -.055em; color: #061E85; white-space: nowrap; }
    .home-title-nexus { color: #008BFF; }
    @supports (background-clip: text) {
      .home-title-nexus { background: linear-gradient(110deg, #054CEF 10%, #008EFF 65%, #00D4D8); background-clip: text; -webkit-background-clip: text; color: transparent; }
      .home-title-accent { background: linear-gradient(130deg, #00C8D6 10%, #00D29A 45%, #FFD332 49%, #FF861F 75%); background-clip: text; -webkit-background-clip: text; color: transparent; }
    }
    .home-description { max-width: 430px; font-size: clamp(.875rem, 1.14vw, 1.0625rem); line-height: 1.3; color: #244675; }
    .home-tagline { display: flex; align-items: center; gap: 14px; margin-top: 20px; font-size: clamp(.8125rem, 1.08vw, 1rem); font-weight: 600; color: #0755CF; }
    .home-tagline::before { content: ""; width: 38px; height: 3px; flex-shrink: 0; background: linear-gradient(90deg, #0755E8, #00D4F0); }
    .home-hero-media { position: absolute; inset: 0; z-index: -1; overflow: hidden; }
    .home-hero-media::after {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background:
        linear-gradient(90deg, rgb(244 250 254 / 90%), rgb(240 249 255 / 66%) 21%, rgb(232 247 255 / 12%) 38%, transparent 49%),
        linear-gradient(90deg, transparent 70%, rgb(0 29 88 / 14%) 82%, rgb(0 29 88 / 34%));
    }
    .home-hero-image { position: absolute; inset: 0; display: block; width: 100%; max-width: none; height: 100%; object-fit: cover; object-position: center 39%; }
    .home-hero-fallback { position: absolute; inset: 0; border-radius: 0; }
    .home-hero-message { position: absolute; top: 145px; right: 14.2%; z-index: 2; width: 13.5%; color: #FFFFFF; font-weight: 600; text-shadow: 0 1px 5px rgb(0 24 80 / 35%); }
    .home-values { font-size: clamp(.8125rem, 1.35vw, 1.25rem); letter-spacing: .2em; line-height: 1.55; }
    .home-opportunity { margin-top: 16px; font-size: clamp(.625rem, .83vw, .8125rem); line-height: 1.5; letter-spacing: .19em; }
    .home-opportunity::before { content: ""; display: block; width: 40px; height: 3px; margin-bottom: 14px; background: #13E1E1; }
    .home-handwriting-frame { position: absolute; top: 140px; right: 1.4%; z-index: 2; width: 12.5%; height: 220px; display: grid; place-items: center; }
    .hero-handwritten-tagline { display: block; width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 2px 4px rgb(0 29 88 / 22%)); }
    .home-handwriting-fallback { color: white; text-shadow: 0 1px 4px #061C54; text-align: center; font-family: cursive; font-size: 1.25rem; line-height: 1.2; }
    /* Ask Nexus intentionally overlaps the lower part of the hero, matching the reference masthead. */
    .home-ai-command {
      position: relative; z-index: 5; display: grid;
      grid-template-columns: minmax(300px, .9fr) minmax(0, 1.1fr); align-items: center; gap: 18px;
      margin: -82px 34px 0; padding: 10px 12px;
      border: 1px solid rgb(215 232 245 / 90%); border-radius: 18px;
      background: linear-gradient(110deg, rgb(250 253 255 / 94%), rgb(234 245 255 / 90%));
      box-shadow: 0 10px 28px rgb(7 85 232 / 10%); backdrop-filter: blur(10px);
    }
    .home-ai-form { display: flex; align-items: center; gap: 12px; min-width: 0; min-height: 60px; padding: 5px 8px; border: 1px solid #E0EEFF; border-radius: 14px; background: rgb(255 255 255 / 85%); box-shadow: 0 2px 7px rgb(7 85 232 / 8%); }
    .home-ai-icon { display: grid; place-items: center; width: 52px; height: 52px; flex-shrink: 0; border-radius: 12px; color: white; background: linear-gradient(40deg, #003DEE, #007FFF 65%, #00D9EA); box-shadow: inset 0 0 0 1px rgb(255 255 255 / 35%); }
    .home-ai-icon svg { width: 29px; height: 29px; }
    .home-ai-field { flex: 1; min-width: 0; }
    .home-ai-label { display: flex; align-items: center; gap: 7px; font-size: 1rem; font-weight: 700; color: #062C94; }
    .home-ai-beta { padding: 2px 6px; font-size: .625rem; line-height: 1.4; border-radius: 5px; color: #0578D3; background: #C8EAFE; }
    .home-ai-input { display: block; width: 100%; min-width: 0; min-height: 26px; padding: 2px 0; border: 0; font-size: .8125rem; color: var(--home-navy); background: transparent; text-overflow: ellipsis; }
    .home-ai-input::placeholder { color: #526987; opacity: 1; }
    .home-ai-send { width: 38px; min-height: 38px; padding: 8px; border-radius: 50%; color: white; border: 2px solid #83D9FF; background: linear-gradient(135deg, #0799F5, #0044CF); box-shadow: 0 0 7px rgb(0 139 255 / 25%); }
    .home-ai-send:hover { background: #004ECF; }
    .home-ai-actions { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .home-ai-track { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; overflow-x: auto; padding: 5px; margin: -5px; scrollbar-width: thin; }
    .home-ai-action { flex-shrink: 0; gap: 6px; min-height: 34px; padding: 6px 10px; border-radius: 999px; border-color: #D4E6FC; background: #F9FCFF; color: #0641BE; font-size: clamp(.625rem, .76vw, .8125rem); font-weight: 600; box-shadow: 0 2px 5px rgb(7 85 232 / 6%); }
    .home-ai-action svg { width: 16px; height: 16px; color: #0068F5; }
    .home-ai-next { width: 28px; min-height: 28px; padding: 5px; border-radius: 50%; border-color: #CCE5FA; color: #0785FF; background: transparent; }
    .home-ai-status { grid-column: 1 / -1; font-size: .8125rem; color: var(--text-secondary); }
    .home-ai-status:empty { display: none; }

    /* HOME PHASE 2 — QUICK ACCESS + EXPLORE BY ROLE */
    .home-dashboard-content {
      width: 100%;
      padding: 30px 34px 8px;
    }

    .home-section + .home-section { margin-top: 28px; }

    .home-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }

    .home-section-title {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: #071F59;
      font-size: 1.05rem;
      font-weight: 750;
      line-height: 1.25;
      letter-spacing: -.015em;
    }

    .home-section-title-icon {
      display: inline-grid;
      place-items: center;
      width: 30px;
      height: 30px;
      flex-shrink: 0;
      border-radius: 9px;
    }

    .home-section-title-icon--quick {
      color: #F59A18;
      background: #FFF4DD;
    }

    .home-section-title-icon--roles {
      color: #086FE8;
      background: #E8F4FF;
    }

    .home-view-all {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 34px;
      padding: 5px 3px 5px 10px;
      border: 0;
      border-radius: 8px;
      color: #0866D7;
      background: transparent;
      font-size: .75rem;
      font-weight: 700;
      cursor: pointer;
    }

    .home-view-all:hover {
      color: #004ECF;
      background: #EAF5FF;
    }

    .quick-access-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .quick-access-card {
      --quick-card-accent: #168BFF;
      --quick-card-tint: #EDF7FF;
      appearance: none;
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) 18px;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-width: 0;
      min-height: 96px;
      padding: 13px 12px;
      border: 1px solid #D7E8F5;
      border-radius: 12px;
      color: #071B4B;
      background: linear-gradient(135deg, var(--quick-card-tint), #FFFFFF 76%);
      box-shadow: 0 2px 8px rgb(7 85 232 / 4%);
      text-align: left;
      cursor: pointer;
      transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease, background .16s ease;
    }

    .quick-access-card[data-theme="blue"] {
      --quick-card-accent: #168BFF;
      --quick-card-tint: #EAF6FF;
    }

    .quick-access-card[data-theme="orange"] {
      --quick-card-accent: #FF8A24;
      --quick-card-tint: #FFF3E8;
    }

    .quick-access-card[data-theme="purple"] {
      --quick-card-accent: #6F35E8;
