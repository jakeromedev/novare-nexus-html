       explicitly preserve normal word wrapping. */
    @media (max-width: 540px) {
      .overview-page .overview-capability-copy strong {
        white-space: normal;
      }

      .overview-page .overview-capability-copy,
      .overview-page .overview-capability-copy > span,
      .overview-page .overview-capability-copy strong {
        overflow-wrap: normal !important;
        word-break: normal !important;
      }
    }


    /* =========================================================
       H1 OVERVIEW — MANAGED LINK PAGE LOADER
       Covers the Overview content while Google Sheet link states
       are being resolved, preventing active-to-gray visual flicker.
    ========================================================== */

    .overview-page {
      position: relative;
    }

    .overview-page.is-managed-links-loading {
      min-height: 68vh;
    }

    .overview-link-loader[hidden] {
      display: none !important;
    }

    .overview-link-loader {
      position: absolute;
      z-index: 90;
      inset: 0;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      min-height: 68vh;
      padding:
        clamp(115px, 18vh, 190px)
        clamp(18px, 4vw, 46px)
        60px;
      opacity: 0;

      /* Keep the page visible while softening it enough that the
         loader remains the clear focal point. */
      background:
        radial-gradient(
          circle at 72% 12%,
          rgb(60 161 255 / 8%),
          transparent 35%
        ),
        linear-gradient(
          180deg,
          rgb(245 250 254 / 34%) 0%,
          rgb(245 250 254 / 26%) 48%,
          rgb(245 250 254 / 32%) 100%
        );

      backdrop-filter:
        blur(9px)
        saturate(.78);
      -webkit-backdrop-filter:
        blur(9px)
        saturate(.78);

      transition: opacity 180ms ease;

      /* Allow mouse-wheel / trackpad scrolling through the overlay. */
      pointer-events: none;
    }

    .overview-link-loader.is-visible {
      opacity: 1;
    }


    /* While links are unresolved, prevent managed buttons from being
       activated underneath the translucent loader. Scrolling is unaffected. */
    .overview-page.is-managed-links-loading [data-link-key] {
      pointer-events: none !important;
      user-select: none;
    }

    /* Make the underlying page subtly recede without hiding it. */
    .overview-page.is-managed-links-loading > :not(.overview-link-loader) {
      filter: saturate(.82) contrast(.96);
      transition: filter 180ms ease;
    }

    .overview-link-loader-card {
      position: sticky;
      top: 120px;
      width: min(92vw, 410px);
      padding: 30px 32px 27px;
      border: 1px solid rgb(190 219 240 / 78%);
      border-radius: 22px;
      text-align: center;
      background:
        radial-gradient(
          circle at 88% 4%,
          rgb(0 190 232 / 11%),
          transparent 34%
        ),
        linear-gradient(145deg, #FFFFFF 0%, #F7FBFF 100%);
      box-shadow:
        0 18px 54px rgb(0 44 95 / 12%),
        inset 0 1px 0 rgb(255 255 255 / 90%);
    }

    .overview-link-loader-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 16%;
      right: 16%;
      height: 3px;
      border-radius: 999px;
      background:
        linear-gradient(90deg, #1269ED, #00C6E8, #7766FF);
    }

    .overview-link-loader-mark {
      position: relative;
      display: grid;
      width: 66px;
      height: 66px;
      margin: 0 auto 17px;
      place-items: center;
    }

    .overview-link-loader-ring {
      position: absolute;
      inset: 0;
      border: 4px solid #E3EFF9;
      border-top-color: #0874EC;
      border-right-color: #00BAD7;
      border-radius: 50%;
      animation: overview-link-loader-spin .82s linear infinite;
    }

    .overview-link-loader-mark svg {
      width: 27px;
      height: 27px;
      fill: none;
      stroke: #0B65D8;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .overview-link-loader-eyebrow {
      margin: 0 0 7px;
      color: #0874DF;
      font-size: .65rem;
      font-weight: 850;
      letter-spacing: .14em;
    }

    .overview-link-loader-card h2 {
      margin: 0;
      color: #0A2E63;
      font-size: clamp(1.15rem, 2.5vw, 1.38rem);
      line-height: 1.16;
      font-weight: 850;
      letter-spacing: -.02em;
    }

    .overview-link-loader-copy {
      max-width: 315px;
      margin: 9px auto 0;
      color: #647991;
      font-size: .76rem;
      line-height: 1.5;
    }

    .overview-link-loader-dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 18px;
    }

    .overview-link-loader-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #1683EB;
      animation: overview-link-loader-dot 1.05s ease-in-out infinite;
    }

    .overview-link-loader-dots span:nth-child(2) {
      animation-delay: 140ms;
    }

    .overview-link-loader-dots span:nth-child(3) {
      animation-delay: 280ms;
    }

    @keyframes overview-link-loader-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes overview-link-loader-dot {
      0%,
      65%,
      100% {
        transform: translateY(0);
        opacity: .36;
      }

      32% {
        transform: translateY(-4px);
        opacity: 1;
      }
    }

    @media (max-width: 620px) {
      .overview-link-loader {
        padding-top: 96px;
      }

      .overview-link-loader-card {
        top: 94px;
        padding: 27px 22px 24px;
        border-radius: 18px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .overview-link-loader,
      .overview-link-loader-ring,
      .overview-link-loader-dots span {
        transition: none;
        animation: none;
      }
    }


    /* =========================================================
       H1 OVERVIEW — EMBEDDED GOOGLE DRIVE VIDEO PLAYER
       Used by ov-eov / ov-iov / ov-mov.
    ========================================================== */

    .overview-video-dialog {
      width: min(94vw, 1040px);
      max-width: 1040px;
      margin: auto;
      padding: 0;
      border: 0;
      border-radius: 24px;
      overflow: visible;
      color: #FFFFFF;
      background: transparent;
      box-shadow: none;
    }

    .overview-video-dialog::backdrop {
      background:
        radial-gradient(
          circle at 50% 28%,
          rgb(10 87 165 / 18%),
          transparent 36%
        ),
        rgb(2 13 29 / 78%);
      backdrop-filter: blur(9px);
      -webkit-backdrop-filter: blur(9px);
    }

    .overview-video-dialog-shell {
      overflow: hidden;
      border: 1px solid rgb(105 164 219 / 34%);
      border-radius: 24px;
      background:
        radial-gradient(
          circle at 90% 0%,
          rgb(0 173 230 / 17%),
          transparent 34%
        ),
        linear-gradient(
          145deg,
          #071C37 0%,
          #061426 58%,
          #030B16 100%
        );
      box-shadow:
        0 32px 92px rgb(0 0 0 / 45%),
        inset 0 1px 0 rgb(255 255 255 / 7%);
    }

    .overview-video-dialog-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 78px;
      padding: 17px 20px 15px 24px;
      border-bottom: 1px solid rgb(132 177 216 / 16%);
    }

    .overview-video-dialog-heading {
      min-width: 0;
    }

    .overview-video-dialog-eyebrow {
      margin: 0 0 4px;
      color: #61D6F1;
      font-size: .62rem;
      font-weight: 850;
      letter-spacing: .14em;
    }

    .overview-video-dialog h2 {
      margin: 0;
      overflow: hidden;
      color: #FFFFFF;
      font-size: clamp(1rem, 2.4vw, 1.28rem);
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -.015em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .overview-video-dialog-close {
      display: grid;
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      place-items: center;
      padding: 0;
      border: 1px solid rgb(150 193 228 / 23%);
      border-radius: 50%;
      color: #DDEEFF;
      background: rgb(255 255 255 / 7%);
      cursor: pointer;
      transition:
        transform 150ms ease,
        background-color 150ms ease,
        border-color 150ms ease;
    }

    .overview-video-dialog-close:hover {
      transform: rotate(4deg);
      border-color: rgb(111 204 238 / 42%);
      background: rgb(255 255 255 / 13%);
    }

    .overview-video-dialog-close svg {
      width: 17px;
      height: 17px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
    }

    .overview-video-frame-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background:
        radial-gradient(
          circle at center,
          #102C4A 0%,
          #061321 54%,
          #020711 100%
        );
    }

    .overview-video-frame-wrap::before {
      content: "Loading video…";
      position: absolute;
      z-index: 0;
      inset: 0;
      display: grid;
      place-items: center;
      color: rgb(210 230 247 / 65%);
      font-size: .78rem;
      font-weight: 650;
      letter-spacing: .03em;
    }

    .overview-video-frame {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #030911;
    }

    .overview-video-dialog-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      min-height: 43px;
      padding: 10px 22px 11px;
      border-top: 1px solid rgb(132 177 216 / 12%);
    }

    .overview-video-dialog-note {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #8EA9C2;
      font-size: .62rem;
      font-weight: 600;
    }

    .overview-video-dialog-note::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #42C8E8;
      box-shadow: 0 0 0 4px rgb(66 200 232 / 10%);
    }

    @media (max-width: 620px) {
      .overview-video-dialog {
        width: min(96vw, 1040px);
        border-radius: 18px;
      }

      .overview-video-dialog-shell {
        border-radius: 18px;
      }

      .overview-video-dialog-header {
        min-height: 68px;
        padding: 13px 14px 12px 17px;
      }

      .overview-video-dialog-close {
        width: 36px;
        height: 36px;
        flex-basis: 36px;
      }

      .overview-video-dialog-footer {
        padding-inline: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .overview-video-dialog-close {
        transition: none;
      }
    }


    /* =========================================================
       ASK NOSCA — PHASE 5 CHAT UI
    ========================================================== */

    .nosca-dialog {
      width: min(620px, calc(100vw - 28px));
      height: min(780px, calc(100dvh - 28px));
      max-width: none;
      max-height: none;
      margin: auto;
      padding: 0;
      overflow: hidden;
      border: 1px solid rgb(99 158 216 / 35%);
      border-radius: 24px;
      color: #071B36;
      background: #F7FBFF;
      box-shadow:
        0 38px 110px rgb(0 17 42 / 34%),
        0 0 0 1px rgb(255 255 255 / 70%) inset;
    }

    .nosca-dialog::backdrop {
      background:
        radial-gradient(
          circle at 76% 22%,
          rgb(11 131 238 / 15%),
          transparent 36%
        ),
        rgb(0 17 38 / 64%);
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
    }

    .nosca-shell {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto auto auto;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(
          circle at 93% 0%,
          rgb(24 195 236 / 10%),
          transparent 27%

        linear-gradient(
          180deg,
          #FFFFFF 0%,
          #F6FAFE 100%
        );

    .nosca-header {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 76px;
      padding: 14px 16px 13px 18px;
      border-bottom: 1px solid #DCEAF5;
      background:
        linear-gradient(
          135deg,
          rgb(255 255 255 / 98%),
          rgb(239 248 255 / 96%)
        );
    }

    .nosca-brand {
      display: grid;
      width: 43px;
      height: 43px;
      flex: 0 0 43px;
      place-items: center;
      border: 1px solid rgb(84 201 239 / 42%);
      border-radius: 13px;
      color: #FFFFFF;
      background:
        linear-gradient(
          145deg,
          #08BFE6 0%,
          #087DF1 46%,
          #224EE4 100%
        );
      box-shadow:
        0 9px 20px rgb(13 112 226 / 23%),
        inset 0 1px 0 rgb(255 255 255 / 30%);

    .nosca-brand svg {
      width: 24px;
      height: 24px;
    }

    .nosca-heading {
      min-width: 0;
      flex: 1;
    }

    .nosca-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nosca-dialog .nosca-heading h2 {
      margin: 0;
      color: #071D42;
      font-size: 1.08rem;
      font-weight: 820;
      line-height: 1.2;
      letter-spacing: -.02em;
    }

    .nosca-beta {
      display: inline-flex;
      align-items: center;
      min-height: 20px;
      padding: 2px 6px;
      border: 1px solid #B8E5F4;
      border-radius: 5px;
      color: #0876B3;
      background: #E7F8FD;
      font-size: .58rem;
      font-weight: 850;
      letter-spacing: .07em;
    }

    .nosca-dialog .nosca-heading p {
      margin: 4px 0 0;
      color: #61758D;
      font-size: .72rem;
      font-weight: 560;
    }

    .nosca-header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nosca-header-button {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 50%;
      color: #506A85;
      background: transparent;
      cursor: pointer;
      transition:
        background-color 150ms ease,
        border-color 150ms ease,
        color 150ms ease,
        transform 150ms ease;

    .nosca-header-button:hover {

      color: #0B5BBD;

    .nosca-header-button:active {

    .nosca-header-button:disabled {

    .nosca-header-button svg {

    .nosca-messages {

    .nosca-welcome {

      height: 58px;
      place-items: center;
      margin-bottom: 16px;

      border-radius: 18px;

      background:

          #E7F8FF 62%,

    .nosca-message-body {

    .nosca-message-bubble {

    .nosca-message--assistant .nosca-message-bubble {

      border-radius: 5px 17px 17px 17px;

    .nosca-loading-bubble {

        opacity: 1;

      background: #FFFFFF;

      border-color: #A5D4F0;
      box-shadow: 0 5px 13px rgb(22 108 185 / 8%);

      height: 28px;
      place-items: center;
      border-radius: 8px;

      background: #EAF7FE;

    .nosca-source-icon svg {

    .nosca-source-copy strong {

      border-color: #F1D0D0;
      background: #FFF9F9;

    .nosca-error-title {
      display: block;
      margin-bottom: 5px;
      color: #9A3030;
      font-size: .78rem;
    }

    .nosca-retry {
      min-height: 30px;
      margin-top: 9px;
      padding: 5px 10px;
      border: 1px solid #E7BFC2;
      border-radius: 8px;
      color: #A23238;
      background: #FFFFFF;
      font-size: .66rem;
      font-weight: 720;
      cursor: pointer;

    .nosca-status {
      min-height: 0;
      padding: 0 19px;
      color: #667C91;
      font-size: .65rem;

    .search-page-filter {

      border: 1px solid #D6E6F3;
      border-radius: 999px;
      color: #5A718D;
      background: #FFFFFF;
      font: inherit;
      font-size: .82rem;

      min-height: 80px;
      padding: 20px 26px;

    .search-results-toolbar h2 {

      font-weight: 750;

    .search-results-toolbar p {

    .search-results-list {

    @media (max-width: 767px) {

    /* GLOBAL SEARCH — PHASE 2 RESULTS */
    .search-results-list:not(:empty) {
      padding: 8px 0 14px;
    }

    .global-search-result {
      display: grid;
      grid-template-columns: 50px minmax(0, 1fr) 34px;
      align-items: center;
      gap: 14px;
      min-height: 92px;
      padding: 16px 24px;

      border-bottom: 1px solid #E8F0F7;
      color: inherit;
      background: #FFFFFF;
      text-decoration: none;

    .global-search-result:last-child {

    }

    .global-search-result:hover {
      background: #F7FBFF;

      background: #F7FBFF;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 46px;

      background: #EFF8FF;

      line-height: 1.3;

    /* Existing sidebar launcher doubles as the minimized chat state. */

    .nosca-launcher {
      transform-origin: center;
      transition:
        opacity 150ms ease,
        transform 190ms cubic-bezier(.2, .8, .2, 1),
        filter 190ms ease,
        box-shadow 180ms ease;
    }

    .nosca-launcher.is-chat-open {
      opacity: 0;
      transform:
        translateX(-12px)
        scale(.68);
      filter: blur(2px);
      pointer-events: none;
      visibility: hidden;
      transition:
        opacity 120ms ease,
        transform 180ms cubic-bezier(.2, .8, .2, 1),
        filter 160ms ease,
        visibility 0s linear 180ms;
    }

    .nosca-launcher.is-thinking {
      background-size: 220% 100%;
      animation:
        nosca-launcher-thinking-gradient 1.35s linear infinite,
        nosca-launcher-thinking-pulse 1.5s ease-in-out infinite;
    }

    .nosca-launcher.is-thinking svg {
      animation:
        nosca-launcher-bot-breathe 1.1s ease-in-out infinite;
    }

    .nosca-launcher.is-thinking::after {
      content: "";
      position: absolute;
      top: -5px;
      right: -4px;
      width: 18px;
      height: 18px;
      box-sizing: border-box;
      border: 2px solid rgb(255 255 255 / 42%);
      border-top-color: #FFFFFF;
      border-radius: 50%;
      background: rgb(22 108 238 / 92%);
      box-shadow:
        0 3px 10px rgb(0 43 121 / 28%);
      animation:
        nosca-launcher-spinner .72s linear infinite;
    }

    .nosca-launcher.has-unread::after {
      content: "✓";
      position: absolute;
      top: -6px;
      right: -5px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 21px;
      height: 21px;
      box-sizing: border-box;
      border: 2px solid #FFFFFF;
      border-radius: 50%;
      color: #FFFFFF;
      background:
        linear-gradient(
          135deg,
          #31D58A,
          #0EAB68
        );
      box-shadow:
        0 4px 12px
        rgb(10 123 77 / 30%);
      font-size: .7rem;
      font-weight: 900;
      line-height: 1;
      animation:
        nosca-ready-badge-pop
        420ms
        cubic-bezier(.2, 1.35, .32, 1);
    }

    @keyframes nosca-panel-in {
      0% {
        opacity: 0;
        transform:
          translate(-24px, 28px)
          scale(.58);
        filter: blur(7px);
      }
      62% {
        opacity: 1;
        transform:
          translate(2px, -2px)
          scale(1.018);
        filter: blur(0);
      }
      100% {
        opacity: 1;
        transform:
          translate(0, 0)
          scale(1);
        filter: blur(0);
      }
    }

    @keyframes nosca-panel-out {
      0% {
        opacity: 1;
        transform:
          translate(0, 0)
          scale(1);
        filter: blur(0);
      }
      100% {
        opacity: 0;
        transform:
          translate(-20px, 26px)
          scale(.62);
        filter: blur(5px);
      }
    }

    @keyframes nosca-launcher-thinking-gradient {
      from {
        background-position: 0% 50%;
      }
      to {
        background-position: 220% 50%;
      }
    }

    @keyframes nosca-launcher-thinking-pulse {
      0%, 100% {
        box-shadow:
          0 10px 24px rgb(0 72 173 / 34%),
          0 0 0 0 rgb(43 185 255 / 0%);
      }
      50% {
        box-shadow:
          0 12px 30px rgb(0 72 173 / 46%),
          0 0 0 7px rgb(43 185 255 / 12%);
      }
    }

    @keyframes nosca-launcher-bot-breathe {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.12);
      }
    }

    @keyframes nosca-launcher-spinner {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes nosca-ready-badge-pop {
      0% {
        opacity: 0;
        transform: scale(.25);
      }
      65% {
        opacity: 1;
        transform: scale(1.22);
      }
      100% {
        opacity: 1;
        transform: scale(1);

    }

    /* =========================================================
       NAVBAR — USER PROFILE ON THE LEFT
       Removes the unused Help / Notification / App Grid region.
       The global search markup and controls are unchanged.
       ========================================================= */

    #nexus-nav-header {

    #nexus-nav-header > .sidebar-toggle {

      order: 1;
    }

    #nexus-nav-header > .user-profile--header-left {
      order: 2;

      min-width: 0;
      margin: 0;
      padding:
        0
        18px
        0
        0;

      border-right:
        1px solid

    }

    #nexus-nav-header > .global-search {
      order: 3;
    }

    #nexus-nav-header
      > .user-profile--header-left
      .user-details {

    }

    #nexus-nav-header
      > .user-profile--header-left
      .user-name,
    #nexus-nav-header
      > .user-profile--header-left
      .user-department {
      max-width: 210px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Keep the profile readable while the navbar is transparent over a hero. */
    #nexus-app.hero-route
      #nexus-nav-header
      > .user-profile--header-left {
      gap: 8px;
      margin: 0;
      padding:
        0
        14px
        0
        0;
      border-left: 0;
      border-right:
        1px solid
        rgb(7 56 142 / 18%);
    }

    #nexus-app.hero-route
      #nexus-nav-header
      > .user-profile--header-left
      .user-name {
      color: #062E74;
    }

    #nexus-app.hero-route
      #nexus-nav-header
      > .user-profile--header-left
      .user-department {
      color: #486A94;
    }

    /* Tablet: keep the avatar on the left and give the search the remaining room. */
    @media (min-width: 768px) and (max-width: 1199px) {
      #nexus-nav-header
        > .user-profile--header-left {
        padding-right: 10px;
      }

      #nexus-nav-header
        > .user-profile--header-left
        .user-details {
        display: none;
      }
    }

    /* Mobile: profile remains at the left of the header as a compact avatar. */
    @media (max-width: 767px) {
      #nexus-nav-header
        > .user-profile--header-left {
        flex: 0 0 auto;
        gap: 0;
        margin: 0;
        padding:
          0
          8px
          0
          0;
      }

      #nexus-nav-header
        > .user-profile--header-left
        .user-details {
        display: none;
      }

      #nexus-nav-header
        > .global-search {
        flex: 1 1 220px;
        min-width: 0;
      }

    /* =========================================================
       NAVBAR USER PROFILE — LOADING SKELETON
       Shown only while Session.getActiveUser() is resolving.
       ========================================================= */

    #nexus-nav-header
      > .user-profile--header-left.is-loading {
      pointer-events: none;
    }

    #nexus-nav-header
      > .user-profile--header-left.is-loading
      #user-avatar {
      position: relative;
      overflow: hidden;
      color: transparent !important;
      border-color:
        rgb(126 168 218 / 28%);
      background:
        linear-gradient(
          100deg,
          rgb(218 232 246 / 82%) 18%,
          rgb(244 249 253 / 96%) 38%,
          rgb(218 232 246 / 82%) 58%
        );
      background-size: 220% 100%;
      box-shadow: none;
      animation:
        nexus-user-skeleton-shimmer
        1.25s
        ease-in-out
        infinite;
    }

    #nexus-nav-header
      > .user-profile--header-left.is-loading
      .user-name,
    #nexus-nav-header
      > .user-profile--header-left.is-loading
      .user-department {
      position: relative;
      display: block;
      overflow: hidden;
      color: transparent !important;
      text-shadow: none !important;
      border-radius: 999px;
      background:
        linear-gradient(
          100deg,
          rgb(206 222 239 / 76%) 18%,
          rgb(246 250 253 / 96%) 38%,
          rgb(206 222 239 / 76%) 58%
        );
      background-size: 220% 100%;
      user-select: none;
      animation:
        nexus-user-skeleton-shimmer
        1.25s
        ease-in-out
        infinite;
    }

    #nexus-nav-header
      > .user-profile--header-left.is-loading
      .user-name {
      width: 142px;
      max-width: 142px;
      height: 13px;
      margin-bottom: 6px;
    }

    #nexus-nav-header
      > .user-profile--header-left.is-loading
      .user-department {
      width: 188px;
      max-width: 188px;
      height: 10px;
    }

    /* Add a subtle stagger so the three skeleton pieces feel fluid. */
    #nexus-nav-header
      > .user-profile--header-left.is-loading
      .user-name {
      animation-delay: -120ms;
    }

    #nexus-nav-header
      > .user-profile--header-left.is-loading
      .user-department {
      animation-delay: -240ms;
    }

    @keyframes nexus-user-skeleton-shimmer {
      0% {
        background-position: 120% 0;
      }

      100% {
        background-position: -120% 0;
      }
    }

    /* Fade the real values in once Apps Script resolves the user. */
    #nexus-nav-header
      > .user-profile--header-left:not(.is-loading)
      #user-avatar,
    #nexus-nav-header
      > .user-profile--header-left:not(.is-loading)
      .user-name,
    #nexus-nav-header
      > .user-profile--header-left:not(.is-loading)
      .user-department {
      animation:
        nexus-user-profile-loaded
        220ms
        ease-out
        both;
    }

    @keyframes nexus-user-profile-loaded {
      from {
        opacity: 0;
        transform: translateY(2px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #nexus-nav-header
        > .user-profile--header-left.is-loading
        #user-avatar,
      #nexus-nav-header
        > .user-profile--header-left.is-loading
        .user-name,
      #nexus-nav-header
        > .user-profile--header-left.is-loading
        .user-department,
      #nexus-nav-header
        > .user-profile--header-left:not(.is-loading)
        #user-avatar,
      #nexus-nav-header
        > .user-profile--header-left:not(.is-loading)
        .user-name,
      #nexus-nav-header
        > .user-profile--header-left:not(.is-loading)
        .user-department {
        animation: none !important;
      }

       ========================================================= */

    .home-hero::before,
    .page-hero[data-page-hero]::before {

      right: 0;
      bottom: 0;
      z-index: 1;

      background:
        linear-gradient(
          to bottom,
          rgb(248 252 255 / 0%) 0%,
          rgb(248 252 255 / 10%) 22%,
          rgb(248 252 255 / 42%) 55%,
          rgb(248 252 255 / 82%) 80%,
          #F8FCFF 100%
        );

      Hero foreground content sits above the fade.

    .home-hero-copy,
    .home-hero-message,
    .overview-hero-copy,
    .overview-hero-message,
    .offerings-hero-content,
    .opportunities-hero-content,
    .programs-hero-content,
    .delivery-hero-content,
    .governance-hero-content,
    .tools-hero-content,
    .support-hero-content,

        height: clamp(62px, 24%, 96px);

    /* =========================================================
       ONESCA MANAGED LINKS — SHARED RUNTIME
       Home is the first page using the shared implementation.
       ========================================================= */

    .home-page {
      position: relative;
    }

    .managed-link-loader[hidden] {
      display: none !important;
    }

    .managed-link-loader {
      position: absolute;
      z-index: 92;
      inset: 0;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      min-height: 68vh;
      padding:
        clamp(118px, 18vh, 190px)
        clamp(18px, 4vw, 46px)

      background:
        radial-gradient(

        radial-gradient(

        auto
        14px;
      place-items: center;

        linear-gradient(
          145deg,
          #E9F5FF,
          #EDF9FF
        );

    .managed-link-loader-mark svg {

      z-index: 2;

    .managed-link-loader-ring {

    .managed-link-loader-eyebrow {

      filter: saturate(.24);
      opacity: .76;
      border-color:
        var(
          --home-managed-missing-border

      box-shadow:

    .home-page

    .home-page
      .featured-cta[data-managed-link-missing="true"],
    .home-page
      .whats-new-item[data-managed-link-missing="true"],
    .home-page

          --home-managed-missing-text
        ) !important;
      background:
        var(
          --home-managed-missing-bg
        ) !important;

    .home-page
      [data-managed-link-missing="true"]
      svg {
      color:
        var(
          --home-managed-missing-icon
        ) !important;
      stroke:
        var(
          --home-managed-missing-icon

    /* =========================================================
       GLOBAL HERO — STICKY SCROLL DISSOLVE
       The hero stays pinned briefly while scrolling, then fades
       and softly zooms away as the frosted navbar takes over.
       ========================================================= */

    [data-page-hero] {
      --hero-scroll-opacity: 1;
      --hero-copy-opacity: 1;
      --hero-media-scale: 1;
      --hero-copy-offset: 0px;

      position: sticky !important;
      top: 0;
      z-index: 0;

      opacity:
        var(--hero-scroll-opacity);

      transform:
        translateZ(0);

      will-change:
        opacity;

      transition:
        opacity 28ms linear;
    }

    /*
      Hero artwork scales independently from the hero container so
      sticky positioning remains stable.
    */
    [data-page-hero]
      > [class*="-hero-media"],
    .home-hero[data-page-hero]
      .home-hero-media {
      transform:
        scale(
          var(--hero-media-scale)
        );

      transform-origin:
        center center;

      will-change:
        transform;

      transition:
        transform 28ms linear;
    }

    /*
      Foreground copy fades slightly faster than the artwork and moves
      upward just a few pixels for a polished dissolve.
    */
    .home-hero[data-page-hero]
      .home-hero-copy,
    .home-hero[data-page-hero]
      .home-hero-message,
    .home-hero[data-page-hero]
      .home-handwriting-frame,
    .overview-hero[data-page-hero]
      .overview-hero-copy,
    .offerings-hero[data-page-hero]
      .offerings-hero-content,
    .opportunities-hero[data-page-hero]
      .opportunities-hero-content,
    .programs-hero[data-page-hero]
      .programs-hero-content,
    .delivery-hero[data-page-hero]
      .delivery-hero-content,
    .governance-hero[data-page-hero]
      .governance-hero-content,
    .tools-hero[data-page-hero]
      .tools-hero-content,
    .support-hero[data-page-hero]
      .support-hero-content,
    .search-hero[data-page-hero]
      .search-hero-content {
      opacity:
        var(--hero-copy-opacity);

      transform:
        translateY(
          var(--hero-copy-offset)
        );

      will-change:
        opacity,
        transform;

      transition:
        opacity 28ms linear,
        transform 28ms linear;
    }

    /*
      Once fully faded, the invisible sticky hero must not intercept
      clicks intended for content scrolling underneath it.
    */
    [data-page-hero].is-scroll-faded {
      pointer-events: none;
    }

    /*
      Give following page content its own paint layer so it can visually
      take over from the fading sticky hero instead of appearing trapped
      behind it.
    */
    [data-page-hero] + * {
      position: relative;
      z-index: 1;
    }

    /*
      Home's Ask Nexus command already intentionally overlaps the hero;
      keep its existing stronger stacking level.
    */
    .home-hero[data-page-hero]
      + .home-ai-command {
      z-index: 5;
    }
