<style>
/* =========================================================
   NEXUS — AI PROMPT LIBRARY
   ---------------------------------------------------------
   IMPORTANT:
   Hero geometry + typography are controlled by
   Styles_HeroTypography.html, exactly like Overview,
   Offerings, Opportunities, Programs, Delivery,
   Governance, Tools, Support, and Search.

   This file only owns:
   - AI Prompt Library page colors
   - hero image treatment
   - hero overlay
   - sheet-backed prompt library
   - prompt cards, filters, and modals
   - admin Add Prompt experience
========================================================= */

.ai-prompt-library-page {
  --ai-prompt-navy: #071D68;
  --ai-prompt-blue: #1266F4;
  --ai-prompt-cyan: #16CDE6;

  width: 100%;
  min-width: 0;
  min-height: 100%;
  overflow-x: clip;
  color: var(--ai-prompt-navy);
  background: #F8FCFF;
}

/* =========================================================
   HERO
   Geometry intentionally follows the shared Nexus standard.
========================================================= */

.ai-prompt-library-hero {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  background: #E7F4FF;
}

.ai-prompt-library-hero-media,
.ai-prompt-library-hero-image,
.ai-prompt-library-hero-fallback,
.ai-prompt-library-hero-overlay {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.ai-prompt-library-hero-media {
  z-index: 0;
  overflow: hidden;
}

.ai-prompt-library-hero-image {
  z-index: 0;
  display: block;
  object-fit: cover;
  object-position: center center;
  background: #E7F4FF;
}

.ai-prompt-library-hero-fallback {
  z-index: 0;
  border: 0;
  border-radius: 0;
  color: transparent;
  background:
    radial-gradient(circle at 82% 32%, rgb(46 165 255 / 24%), transparent 27%),
    linear-gradient(110deg, #F8FCFF 0%, #E6F4FF 42%, #76BAF4 74%, #174A9E 100%);
}

.ai-prompt-library-hero-overlay {
  z-index: 1;
  pointer-events: none;
  background:
    linear-gradient(
      90deg,
      rgb(248 252 255 / 99%) 0%,
      rgb(248 252 255 / 97%) 24%,
      rgb(248 252 255 / 82%) 39%,
      rgb(248 252 255 / 42%) 51%,
      rgb(235 248 255 / 8%) 68%,
      transparent 100%
    );
}

/* Keep AI page colors while using shared Nexus font sizing. */
.ai-prompt-library-eyebrow {
  color: #1358D6;
}

.ai-prompt-library-hero-copy h1 {
  color: #071D68;
}

.ai-prompt-library-hero-copy h1 > span {
  display: block;
}

.ai-prompt-library-hero-copy h1 strong {
  color: transparent;
  background: linear-gradient(
    105deg,
    #0757EF 0%,
    #0B86FF 62%,
    #00BED5 100%
  );
  background-clip: text;
  -webkit-background-clip: text;
}

.ai-prompt-library-hero-description {
  color: #153B82;
}

/* =========================================================
   PROMPT LIBRARY CONTENT AREA
========================================================= */

.ai-prompt-library-placeholder {
  padding: 8px 20px 22px;
  background: #F8FCFF;
}

.ai-prompt-library-placeholder-surface {
  width: 100%;
  min-height: clamp(430px, 49vh, 700px);
  padding: 22px;
  border: 1px solid #D8E7F4;
  border-radius: 18px;
  background:
    radial-gradient(circle at 88% 8%, rgb(64 165 255 / 6%), transparent 30%),
    linear-gradient(145deg, #FFFFFF 0%, #F7FBFF 100%);
  box-shadow:
    0 5px 14px rgb(0 47 115 / 4%),
    inset 0 1px 0 rgb(255 255 255 / 82%);
}

/* =========================================================
   RESPONSIVE IMAGE TREATMENT ONLY
   Typography/layout remain shared.
========================================================= */

@media (max-width: 1199px) {
  .ai-prompt-library-hero-image {
    object-position: 58% center;
  }

  .ai-prompt-library-hero-overlay {
    background:
      linear-gradient(
        90deg,
        rgb(248 252 255 / 98%) 0%,
        rgb(248 252 255 / 92%) 35%,
        rgb(248 252 255 / 44%) 62%,
        transparent 100%
      );
  }
}

@media (max-width: 767px) {
  .ai-prompt-library-page {
    padding: 0 10px 20px;
  }

  .ai-prompt-library-hero {
    margin-inline: -10px;
  }

  .ai-prompt-library-hero-image {
    object-position: 64% center;
  }

  .ai-prompt-library-hero-overlay {
    background:
      linear-gradient(
        180deg,
        rgb(248 252 255 / 98%) 0%,
        rgb(248 252 255 / 94%) 48%,
        rgb(238 248 255 / 52%) 70%,
        rgb(229 244 255 / 12%) 100%
      );
  }

  .ai-prompt-library-placeholder {
    margin-inline: -10px;
    padding: 10px;
  }

  .ai-prompt-library-placeholder-surface {
    min-height: 420px;
    border-radius: 14px;
  }
}

/* =========================================================
   LIBRARY HEADER + TOOLBAR
========================================================= */

.ai-prompt-library-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 18px;
}

.ai-prompt-library-heading-copy {
  min-width: 0;
}

.ai-prompt-library-kicker {
  margin: 0 0 5px;
  color: #1660D9;
  font-size: .72rem;
  font-weight: 800;
  letter-spacing: .18em;
  text-transform: uppercase;
}

.ai-prompt-library-title-row {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.ai-prompt-library-title-row h2 {
  margin: 0;
  color: #082768;
  font-size: clamp(1.45rem, 2vw, 2rem);
  line-height: 1.05;
  letter-spacing: -.03em;
}

.ai-prompt-library-heading-copy > p:last-child {
  margin: 7px 0 0;
  color: #58719D;
  font-size: .92rem;
  line-height: 1.45;
}

.ai-prompt-library-count {
  display: inline-flex;
  align-items: center;
  min-height: 26px;
  padding: 4px 9px;
  border: 1px solid #D5E5F5;
  border-radius: 999px;
  color: #315A8F;
  background: #F5FAFF;
  font-size: .74rem;
  font-weight: 700;
  white-space: nowrap;
}

.ai-prompt-library-add-button,
.ai-prompt-primary-button,
.ai-prompt-copy-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: 0;
  border-radius: 10px;
  color: #FFFFFF;
  background: linear-gradient(135deg, #0B5FEF 0%, #275DFF 62%, #784CFF 100%);
  box-shadow: 0 8px 18px rgb(27 92 234 / 18%);
  font-weight: 800;
  cursor: pointer;
  transition: transform .18s ease, box-shadow .18s ease, opacity .18s ease;
}

.ai-prompt-library-add-button {
  min-height: 40px;
  padding: 0 14px;
  font-size: .86rem;
  white-space: nowrap;
}

.ai-prompt-library-add-button:hover,
.ai-prompt-primary-button:hover,
.ai-prompt-copy-button:hover {
  transform: translateY(-1px);
  box-shadow: 0 10px 22px rgb(27 92 234 / 24%);
}

.ai-prompt-library-toolbar {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  margin-bottom: 14px;
}

.ai-prompt-library-search-field {
  position: relative;
  display: block;
  min-width: 0;
}

.ai-prompt-library-search-icon {
  position: absolute;
  left: 13px;
  top: 50%;
  width: 18px;
  height: 18px;
  transform: translateY(-50%);
  color: #6883AC;
  pointer-events: none;
}

.ai-prompt-library-search-icon svg,
.ai-prompt-card-icon svg,
.ai-prompt-copy-button svg {
  width: 100%;
  height: 100%;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.ai-prompt-library-search-field input,
.ai-prompt-library-sort-field select,
.ai-prompt-form-field input,
.ai-prompt-form-field select,
.ai-prompt-form-field textarea {
  width: 100%;
  border: 1px solid #D6E4F3;
  border-radius: 10px;
  color: #173A75;
  background: #FFFFFF;
  outline: none;
  transition: border-color .18s ease, box-shadow .18s ease;
}

.ai-prompt-library-search-field input {
  min-height: 42px;
  padding: 0 14px 0 42px;
  font-size: .9rem;
}

.ai-prompt-library-search-field input:focus,
.ai-prompt-library-sort-field select:focus,
.ai-prompt-form-field input:focus,
.ai-prompt-form-field select:focus,
.ai-prompt-form-field textarea:focus {
  border-color: #69A7FF;
  box-shadow: 0 0 0 3px rgb(54 125 255 / 11%);
}

.ai-prompt-library-sort-field {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #5B7297;
  font-size: .8rem;
  font-weight: 700;
}

.ai-prompt-library-sort-field select {
  min-width: 145px;
  min-height: 42px;
  padding: 0 34px 0 11px;
  font-size: .84rem;
  font-weight: 700;
}

.ai-prompt-library-categories {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 2px 1px 10px;
  scrollbar-width: thin;
}

.ai-prompt-category-chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  min-height: 34px;
  padding: 0 12px;
  border: 1px solid #D7E6F5;
  border-radius: 999px;
  color: #365986;
  background: #FFFFFF;
  font-size: .78rem;
  font-weight: 800;
  white-space: nowrap;
  cursor: pointer;
}

.ai-prompt-category-chip small {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 20px;
  height: 20px;
  padding: 0 5px;
  border-radius: 999px;
  color: #6781A6;
  background: #EEF5FC;
  font-size: .67rem;
}

.ai-prompt-category-chip.is-active {
  border-color: #8FB8FF;
  color: #0C56D9;
  background: #EEF5FF;
  box-shadow: inset 0 0 0 1px rgb(91 145 255 / 12%);
}

/* =========================================================
   CATEGORY GROUPS + PROMPT CARDS
========================================================= */

.ai-prompt-library-results {
  display: grid;
  gap: 22px;
  padding-top: 4px;
}

.ai-prompt-category-section {
  min-width: 0;
}

.ai-prompt-category-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.ai-prompt-category-heading > div {
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
}

.ai-prompt-category-heading h3 {
  margin: 0;
  color: #102D6D;
  font-size: 1rem;
  line-height: 1.2;
}

.ai-prompt-category-count {
  color: #7A90B1;
  font-size: .72rem;
  font-weight: 700;
}

.ai-prompt-card-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}

.ai-prompt-card {
  position: relative;
  display: flex;
  flex-direction: column;
  min-height: 180px;
  padding: 16px;
  border: 1px solid #DCE8F4;
  border-radius: 14px;
  text-align: left;
  color: #15376F;
  background: linear-gradient(145deg, #FFFFFF 0%, #FBFDFF 100%);
  box-shadow: 0 5px 14px rgb(12 55 110 / 4%);
  cursor: pointer;
  transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
}

.ai-prompt-card:hover,
.ai-prompt-card:focus-visible {
  transform: translateY(-2px);
  border-color: #9BC2FF;
  box-shadow: 0 11px 26px rgb(19 76 153 / 10%);
  outline: none;
}

.ai-prompt-card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.ai-prompt-card-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  padding: 8px;
  border-radius: 10px;
  color: #FFFFFF;
  background: linear-gradient(135deg, #1B6CF3, #7657FF);
  box-shadow: 0 6px 14px rgb(68 99 235 / 20%);
}

.ai-prompt-featured-star {
  color: #F4A900;
  font-size: 1.05rem;
}

.ai-prompt-card h4 {
  margin: 0 0 7px;
  color: #0B2869;
  font-size: .94rem;
  line-height: 1.28;
}

.ai-prompt-card > p {
  display: -webkit-box;
  overflow: hidden;
  margin: 0;
  color: #5A7097;
  font-size: .81rem;
  line-height: 1.45;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
}

.ai-prompt-card-footer {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 10px;
  margin-top: auto;
  padding-top: 14px;
}

.ai-prompt-card-meta,
.ai-prompt-detail-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  min-width: 0;
}

.ai-prompt-pill {
  display: inline-flex;
  align-items: center;
  min-height: 23px;
  max-width: 100%;
  padding: 3px 8px;
  border-radius: 999px;
  color: #3565A3;
  background: #EEF5FF;
  font-size: .66rem;
  font-weight: 700;
  line-height: 1.2;
}

.ai-prompt-pill.is-muted {
  color: #6B7791;
  background: #F1F4F8;
}

.ai-prompt-card-action {
  flex: 0 0 auto;
  color: #1A61E8;
  font-size: .72rem;
  font-weight: 800;
}

/* =========================================================
   LOADING / EMPTY / ERROR
========================================================= */

.ai-prompt-skeleton-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}

.ai-prompt-skeleton-card {
  min-height: 170px;
  padding: 16px;
  border: 1px solid #E4EDF6;
  border-radius: 14px;
  background: #FFFFFF;
}

.ai-prompt-skeleton-card span {
  display: block;
  height: 12px;
  margin-bottom: 12px;
  border-radius: 999px;
  background: linear-gradient(90deg, #EEF4FA 20%, #F8FBFE 45%, #EEF4FA 70%);
  background-size: 220% 100%;
  animation: ai-prompt-shimmer 1.3s infinite linear;
}

.ai-prompt-skeleton-card span:first-child {
  width: 36px;
  height: 36px;
  border-radius: 10px;
}

.ai-prompt-skeleton-card span:nth-child(2) { width: 72%; }
.ai-prompt-skeleton-card span:nth-child(3) { width: 92%; }

@keyframes ai-prompt-shimmer {
  to { background-position: -220% 0; }
}

.ai-prompt-library-state {
  display: grid;
  place-items: center;
  gap: 8px;
  min-height: 230px;
  padding: 30px;
  text-align: center;
  color: #617799;
}

.ai-prompt-library-state-icon {
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  border-radius: 12px;
  color: #1C67E9;
  background: #ECF4FF;
  font-size: 1.2rem;
}

.ai-prompt-library-state p {
  margin: 0;
  font-size: .9rem;
}

.ai-prompt-library-state.is-error .ai-prompt-library-state-icon {
  color: #B42318;
  background: #FFF0EE;
}

.ai-prompt-library-retry {
  min-height: 34px;
  padding: 0 12px;
  border: 1px solid #C9DBF2;
  border-radius: 9px;
  color: #1D5FC6;
  background: #FFFFFF;
  font-weight: 800;
  cursor: pointer;
}

/* =========================================================
   MODALS
========================================================= */

.ai-prompt-dialog {
  width: min(760px, calc(100vw - 30px));
  max-height: min(86vh, 860px);
  padding: 0;
  border: 0;
  border-radius: 18px;
  overflow: hidden;
  color: #15376F;
  background: transparent;
  box-shadow: 0 30px 90px rgb(9 35 77 / 28%);
}

.ai-prompt-add-dialog {
  width: min(860px, calc(100vw - 30px));
}

.ai-prompt-dialog::backdrop {
  background: rgb(5 24 56 / 44%);
  backdrop-filter: blur(4px);
}

.ai-prompt-dialog-shell {
  display: flex;
  flex-direction: column;
  max-height: inherit;
  background: #FFFFFF;
}

.ai-prompt-dialog-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 18px;
  padding: 20px 22px 17px;
  border-bottom: 1px solid #E5EDF6;
  background: linear-gradient(180deg, #FFFFFF 0%, #FAFCFF 100%);
}

.ai-prompt-dialog-header h2 {
  margin: 0;
  color: #0A2868;
  font-size: 1.22rem;
  line-height: 1.2;
}

.ai-prompt-dialog-header p {
  margin: 5px 0 0;
  color: #7083A2;
  font-size: .8rem;
  line-height: 1.4;
}

.ai-prompt-dialog-eyebrow {
  color: #1B64E4 !important;
  font-size: .66rem !important;
  font-weight: 800;
  letter-spacing: .16em;
}

.ai-prompt-dialog-close {
  display: grid;
  place-items: center;
  flex: 0 0 34px;
  width: 34px;
  height: 34px;
  border: 1px solid #DEE8F3;
  border-radius: 10px;
  color: #61799B;
  background: #FFFFFF;
  font-size: 1.35rem;
  line-height: 1;
  cursor: pointer;
}

.ai-prompt-dialog-body,
.ai-prompt-add-form {
  overflow-y: auto;
}

.ai-prompt-dialog-body {
  display: grid;
  gap: 18px;
  padding: 20px 22px;
}

.ai-prompt-detail-title-line {
  display: flex;
  align-items: center;
  gap: 9px;
  flex-wrap: wrap;
}

.ai-prompt-detail-featured {
  padding: 4px 8px;
  border-radius: 999px;
  color: #9A6500;
  background: #FFF4CE;
  font-size: .68rem;
  font-weight: 800;
}

.ai-prompt-detail-section h3 {
  margin: 0 0 8px;
  color: #16346D;
  font-size: .82rem;
}

.ai-prompt-detail-meta {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}

.ai-prompt-detail-meta-item {
  padding: 10px 11px;
  border: 1px solid #E1EAF5;
  border-radius: 10px;
  background: #F9FBFE;
}

.ai-prompt-detail-meta-item span {
  display: block;
  margin-bottom: 3px;
  color: #8393AD;
  font-size: .65rem;
  font-weight: 700;
}

.ai-prompt-detail-meta-item strong {
  color: #315B93;
  font-size: .76rem;
}

.ai-prompt-detail-description,
.ai-prompt-detail-text {
  margin: 0;
  color: #5B7094;
  font-size: .84rem;
  line-height: 1.5;
}

.ai-prompt-detail-section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
}

.ai-prompt-detail-section-heading h3 { margin: 0; }

.ai-prompt-copy-button {
  min-height: 32px;
  padding: 0 10px;
  border-radius: 8px;
  font-size: .73rem;
}

.ai-prompt-copy-button svg {
  width: 14px;
  height: 14px;
}

.ai-prompt-detail-prompt {
  margin: 0;
  padding: 14px;
  border: 1px solid #DAE7F4;
  border-radius: 11px;
  overflow: auto;
  color: #244C83;
  background: #F6FAFF;
  font: inherit;
  font-size: .82rem;
  line-height: 1.55;
  white-space: pre-wrap;
  word-break: break-word;
}

.ai-prompt-dialog-footer {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  padding: 14px 22px 18px;
  border-top: 1px solid #E8EFF7;
  background: #FCFDFF;
}

.ai-prompt-primary-button,
.ai-prompt-secondary-button {
  min-height: 38px;
  padding: 0 14px;
  font-size: .8rem;
}

.ai-prompt-secondary-button {
  border: 1px solid #D5E1EF;
  border-radius: 10px;
  color: #496486;
  background: #FFFFFF;
  font-weight: 800;
  cursor: pointer;
}

/* =========================================================
   ADMIN FORM
========================================================= */

.ai-prompt-add-form {
  padding: 20px 22px 0;
}

.ai-prompt-form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.ai-prompt-form-field {
  display: grid;
  gap: 6px;
}

.ai-prompt-form-field--wide {
  grid-column: 1 / -1;
}

.ai-prompt-form-field > span {
  color: #3B557A;
  font-size: .74rem;
  font-weight: 800;
}

.ai-prompt-form-field > span b {
  color: #1C63DF;
}

.ai-prompt-form-field input,
.ai-prompt-form-field select {
  min-height: 40px;
  padding: 0 11px;
  font-size: .82rem;
}

.ai-prompt-form-field textarea {
  padding: 10px 11px;
  resize: vertical;
  font: inherit;
  font-size: .82rem;
  line-height: 1.5;
}

.ai-prompt-form-check {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 58px;
  padding: 10px 12px;
  border: 1px solid #DEE8F3;
  border-radius: 10px;
  background: #F9FBFE;
}

.ai-prompt-form-check input {
  width: 18px;
  min-height: 18px;
  margin: 0;
}

.ai-prompt-form-check span {
  display: grid;
  gap: 2px;
}

.ai-prompt-form-check strong {
  color: #385987;
  font-size: .77rem;
}

.ai-prompt-form-check small {
  color: #7C8EAA;
  font-size: .68rem;
  font-weight: 500;
}

.ai-prompt-add-error {
  margin: 14px 0 0;
  padding: 10px 12px;
  border: 1px solid #F4C7C3;
  border-radius: 9px;
  color: #A02C20;
  background: #FFF4F2;
  font-size: .78rem;
}

.ai-prompt-add-footer {
  margin: 18px -22px 0;
}

.ai-prompt-primary-button:disabled {
  opacity: .64;
  cursor: wait;
  transform: none;
}

/* =========================================================
   TOAST
========================================================= */

.ai-prompt-library-toast {
  position: fixed;
  right: 24px;
  bottom: 24px;
  z-index: 2200;
  display: flex;
  align-items: center;

  box-shadow: 0 5px 12px rgb(23 104 229 / 12%);
}

/* Edit = amber. */
.ai-prompt-icon-action.is-edit {
  border-color: #F0D49B;
  color: #A86B00;
  background: #FFFAEF;
}

.ai-prompt-icon-action.is-edit:hover,
.ai-prompt-icon-action.is-edit:focus-visible {
  border-color: #E1B75C;
  color: #875500;
  background: #FFF3D6;
  box-shadow: 0 5px 12px rgb(184 119 0 / 10%);
}

/* Delete = red. */
.ai-prompt-icon-action.is-delete {
  border-color: #EFC3C8;
  color: #BC3340;
  background: #FFF8F8;
}

.ai-prompt-icon-action.is-delete:hover,
.ai-prompt-icon-action.is-delete:focus-visible {
  border-color: #E38C96;
  color: #9C202C;
  background: #FFF0F1;
  box-shadow: 0 5px 12px rgb(188 51 64 / 10%);
}

/* Copy confirmation state. */
.ai-prompt-icon-action.is-copied {
  border-color: #A9DEC2 !important;
  color: #24764D !important;
  background: #EFFAF4 !important;
}

.ai-prompt-icon-action:disabled {
  opacity: .55;
  cursor: wait;
  transform: none;
}

/* Browser tooltip is supplied through title + aria-label.
   This makes the button purpose understandable on hover/focus
   without introducing a clipped tooltip inside the scroll table. */

/* Preserve semantic status coloring. */
.ai-prompt-status-badge.is-active {
  border-color: #B0DFC5;
  color: #25734B;
  background: #EDF9F2;
}

.ai-prompt-status-badge.is-draft {
  border-color: #EACB83;
  color: #8A6100;
  background: #FFF7E2;
}

.ai-prompt-status-badge.is-inactive {
  border-color: #D5DFEA;
  color: #697B93;
  background: #F4F7FA;
}

.ai-prompt-status-badge.is-retired {
  border-color: #E8B7BE;
  color: #9D3542;
  background: #FFF2F4;
}

/* Remove the obsolete word-based View button from the visual system. */
.ai-prompt-table-view-button {
  display: none !important;
}

@media (max-width: 900px) {
  .ai-prompt-table {
    min-width: 920px;
  }
}


/* =========================================================
   CATEGORY-FIRST PROMPT LIBRARY FLOW
   ---------------------------------------------------------
   Default:
   Category Grid -> Category Prompt Table

   Search:
   Search text -> Prompt Table

   Categories and prompts are displayed alphabetically.
========================================================= */

/* The former chip strip now hosts either the category grid or
   a compact table context bar. */
.ai-prompt-library-categories {
  display: block;
  overflow: visible;
  padding: 2px 0 14px;
}

.ai-prompt-library-categories.is-grid-view {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
}


.ai-prompt-category-card {
  position: relative;
  min-width: 0;
  border: 1px solid #DCE7F3;
  border-radius: 15px;
  background:
    linear-gradient(145deg, #FFFFFF 0%, #F8FBFF 100%);
  box-shadow: 0 8px 22px rgb(27 73 125 / 5%);
  transition:
    transform .15s ease,
    border-color .15s ease,
    box-shadow .15s ease,
    opacity .15s ease;
}

.ai-prompt-category-card:hover {
  transform: translateY(-2px);
  border-color: #B9D3F1;
  box-shadow: 0 12px 26px rgb(27 73 125 / 9%);
}



.ai-prompt-category-card-open {
  display: grid;
  width: 100%;
  min-height: 118px;
  padding: 18px;
  border: 0;
  border-radius: inherit;
  color: inherit;
  background: transparent;
  cursor: pointer;
  text-align: left;
}

.ai-prompt-category-card-eyebrow {
  color: #5F7A9D;
  font-size: .61rem;
  font-weight: 850;
  letter-spacing: .13em;
}

.ai-prompt-category-card-open strong {
  margin-top: 8px;
  overflow: hidden;
  color: #123D78;
  font-size: .98rem;
  line-height: 1.3;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.ai-prompt-category-card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  align-self: end;
  margin-top: 22px;
  color: #7288A5;
  font-size: .69rem;
  font-weight: 700;
}

.ai-prompt-category-card-arrow {
  display: inline-grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border-radius: 9px;
  color: #1768E5;
  background: #EDF5FF;
  font-size: .9rem;
}



/* Table context shown after selecting a category or while searching. */
.ai-prompt-library-context-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  min-height: 48px;
  padding: 8px 2px 12px;
}

.ai-prompt-library-context-copy {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
}

.ai-prompt-library-context-copy > strong {
  color: #163F76;
  font-size: .86rem;
}

.ai-prompt-library-context-copy > span {
  color: #7A8EA9;
  font-size: .69rem;
  font-weight: 700;
}

.ai-prompt-library-back-button {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 32px;
  padding: 0 9px;
  border: 1px solid #D7E5F4;
  border-radius: 9px;
  color: #41638E;
  background: #FFFFFF;
  cursor: pointer;
  font: inherit;
  font-size: .69rem;
  font-weight: 800;
}

.ai-prompt-library-back-button:hover {
  border-color: #AFCBED;
  color: #125DCB;
  background: #F6FAFF;
}

.ai-prompt-library-back-button svg {
  width: 15px;
  height: 15px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.ai-prompt-library-context-note {
  color: #7890AE;
  font-size: .67rem;
  font-weight: 650;
}

/* Explicit horizontal scrolling. */
.ai-prompt-table-shell {
  width: 100%;
  max-width: 100%;
  overflow-x: auto !important;
  overflow-y: hidden;
  scrollbar-width: auto;
  scrollbar-gutter: stable;
  -webkit-overflow-scrolling: touch;
}

.ai-prompt-table-shell::-webkit-scrollbar {
  height: 11px;
}

.ai-prompt-table-shell::-webkit-scrollbar-track {
  background: #F1F5F9;
  border-radius: 999px;
}

.ai-prompt-table-shell::-webkit-scrollbar-thumb {
  border: 2px solid #F1F5F9;
  border-radius: 999px;
  background: #B6C6D9;
}

.ai-prompt-table {
  min-width: 1180px;
}

/* Actions are the first and sticky column. */
.ai-prompt-table th.ai-prompt-table-col-actions,
.ai-prompt-table td.ai-prompt-table-col-actions {
  position: sticky;
  left: 0;
  z-index: 3;
  width: 58px;
  min-width: 58px;
  background: #FFFFFF;
  box-shadow: 1px 0 0 #E4ECF5;
}

.ai-prompt-table thead th.ai-prompt-table-col-actions {
  z-index: 5;
  background: #F7FAFD;
}

.ai-prompt-table.is-admin th.ai-prompt-table-col-actions,
.ai-prompt-table.is-admin td.ai-prompt-table-col-actions {
  width: 166px;
  min-width: 166px;
}

.ai-prompt-table tbody tr:hover td.ai-prompt-table-col-actions {
  background: #F7FBFF;
}





.ai-prompt-table th.ai-prompt-table-col-name,
.ai-prompt-table td.ai-prompt-table-col-name {
  width: 250px;
  min-width: 250px;
}

.ai-prompt-table th.ai-prompt-table-col-category,
.ai-prompt-table td.ai-prompt-table-col-category {
  width: 155px;
  min-width: 155px;
}

.ai-prompt-table th.ai-prompt-table-col-type,
.ai-prompt-table td.ai-prompt-table-col-type {
  width: 145px;
  min-width: 145px;
}

.ai-prompt-table th.ai-prompt-table-col-use-case,
.ai-prompt-table td.ai-prompt-table-col-use-case {
  width: 430px;
  min-width: 430px;
}

.ai-prompt-table th.ai-prompt-table-col-status,
.ai-prompt-table td.ai-prompt-table-col-status {
  width: 105px;
  min-width: 105px;
}


@media (max-width: 1180px) {
  .ai-prompt-library-categories.is-grid-view {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (max-width: 820px) {
  .ai-prompt-library-categories.is-grid-view {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .ai-prompt-library-context-bar {
    align-items: flex-start;
    flex-direction: column;
  }
}

@media (max-width: 560px) {
  .ai-prompt-library-categories.is-grid-view {
    grid-template-columns: 1fr;
  }

  .ai-prompt-library-context-copy {
    align-items: flex-start;
    flex-direction: column;
  }

  .ai-prompt-category-card-open {
    min-height: 104px;
  }
}


/* =========================================================
   CORRECTED USE CASE + PROMPT DATA MODEL
========================================================= */

/* Use Case is short descriptive context. */
.ai-prompt-form-grid--content textarea[name="useCase"] {
  min-height: 88px;
  resize: vertical;
}

/* Prompt is the actual long-form content copied by users. */
.ai-prompt-form-grid--content textarea[name="prompt"] {
  min-height: 220px;
  resize: vertical;
}

.ai-prompt-detail-use-case {
  margin: 7px 0 0;
  padding: 12px 14px;
  border: 1px solid #E2EAF3;
  border-radius: 10px;
  color: #5A7090;
  background: #FAFCFE;
  font-size: .8rem;
  line-height: 1.55;
}

#ai-prompt-detail-prompt {
  min-height: 140px;
}

#ai-prompt-detail-prompt.is-empty {
  color: #8A9AAF;
  font-style: italic;
  background: #F8FAFC;
}

.ai-prompt-copy-button:disabled,
#ai-prompt-detail-copy-footer:disabled {
  opacity: .5;
  cursor: not-allowed;
  box-shadow: none;
}


/* =========================================================
   MISSING PROMPT BADGE + CONTENT FILTER
========================================================= */

/* Search + prompt-content filter. */
.ai-prompt-library-toolbar {
  grid-template-columns:
    minmax(0, 1fr)
    auto;
}

.ai-prompt-library-filter-field,
.ai-prompt-library-content-filter {
  flex: 0 0 auto;
  white-space: nowrap;
}

.ai-prompt-library-content-filter[hidden] {
  display: none !important;
}

.ai-prompt-library-filter-field > span,
.ai-prompt-library-content-filter > span {
  white-space: nowrap;
}

.ai-prompt-library-filter-field select,
.ai-prompt-library-content-filter select {
  min-width: 164px;
}

/* Compact warning badge directly below Prompt Name. */
.ai-prompt-missing-badge {
  display: inline-flex;
  align-items: center;
  width: fit-content;
  min-height: 20px;
  margin-top: 5px;
  padding: 2px 7px;
  border: 1px solid #E9C46E;
  border-radius: 999px;
  color: #8A5D00;
  background: #FFF7DD;
  font-size: .6rem;
  font-weight: 850;
  line-height: 1.2;
  letter-spacing: .01em;
  white-space: nowrap;
}

.ai-prompt-table-name-cell .ai-prompt-missing-badge + small {
  margin-top: 5px;
}

@media (max-width: 1050px) {
  .ai-prompt-library-toolbar {
    grid-template-columns:
      minmax(0, 1fr)
      auto;
  }

  .ai-prompt-library-search-field {
    grid-column: 1 / -1;
  }
}

@media (max-width: 767px) {
  .ai-prompt-library-toolbar {
    grid-template-columns: 1fr;
  }

  .ai-prompt-library-search-field {
    grid-column: auto;
  }

  .ai-prompt-library-filter-field,
  .ai-prompt-library-content-filter {
    justify-content: space-between;
  }

  .ai-prompt-library-filter-field select,
  .ai-prompt-library-content-filter select {
    min-width: 0;
    width: min(190px, 58vw);
  }
}

========================================================= */

.ai-prompt-library-placeholder {

}

.ai-prompt-library-placeholder-surface {

.ai-prompt-library-heading-copy {

.ai-prompt-library-missing-summary[hidden] {

.ai-prompt-library-missing-summary-icon {

.ai-prompt-library-missing-summary-copy strong {

.ai-prompt-library-missing-summary-copy p {

}

.ai-prompt-library-missing-summary-button {

  flex: 0 0 auto;
  min-height: 34px;
  padding: 0 11px;
  border: 1px solid #E6C37C;

.ai-prompt-library-missing-summary-button:hover,
.ai-prompt-library-missing-summary-button:focus-visible {

/* Search + filter control */
.ai-prompt-library-toolbar {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;

.ai-prompt-library-search-field {

.ai-prompt-library-search-field:focus-within {

.ai-prompt-library-search-field input {

.ai-prompt-library-search-field input::placeholder {

.ai-prompt-filter-menu-wrap {

.ai-prompt-library-filter-toggle {

.ai-prompt-library-filter-toggle svg {

.ai-prompt-library-filter-toggle:hover,

.ai-prompt-library-filter-count {

.ai-prompt-library-filter-count[hidden] {

  border: 0;
  color: #1768E5;
  background: transparent;
  cursor: pointer;
  font: inherit;
  font-size: .64rem;
  font-weight: 800;
}

/* Category discovery */
.ai-prompt-library-categories {
  padding: 4px 0 15px;
}

.ai-prompt-library-categories.is-grid-view {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 11px;
}

.ai-prompt-category-section-heading {
  grid-column: 1 / -1;
  margin: 4px 0 2px;
}

.ai-prompt-category-section-heading h3 {
  margin: 0;
  color: #173F74;
  font-size: .9rem;
  letter-spacing: -.01em;
}

.ai-prompt-category-section-heading p {
  margin: 4px 0 0;
  color: #768CA8;
  font-size: .66rem;
  line-height: 1.45;
}

.ai-prompt-category-card {
  border: 1px solid #DCE7F2;
  border-radius: 13px;
  background: #FFFFFF;
  box-shadow: 0 4px 12px rgb(25 63 109 / 4%);
}

.ai-prompt-category-card:hover {
  transform: translateY(-2px);
  border-color: #AFCDF2;
  box-shadow: 0 10px 24px rgb(25 63 109 / 8%);
}

.ai-prompt-category-card-open {
  min-height: 122px;
  padding: 14px;
}

.ai-prompt-category-card-top {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.ai-prompt-category-card-icon {
  display: inline-grid;
  place-items: center;
  flex: 0 0 32px;
  width: 32px;
  height: 32px;
  border-radius: 9px;
  color: #1768E5;
  background: #EAF4FF;
}

.ai-prompt-category-card-icon svg {
  width: 17px;
  height: 17px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.ai-prompt-category-card.is-violet .ai-prompt-category-card-icon {
  color: #6D4BD6;
  background: #F0ECFF;
}

.ai-prompt-category-card.is-cyan .ai-prompt-category-card-icon {
  color: #087F9B;
  background: #E6F9FC;
}

.ai-prompt-category-card.is-green .ai-prompt-category-card-icon {
  color: #23805A;
  background: #E8F8F0;
}

.ai-prompt-category-card.is-slate .ai-prompt-category-card-icon {
  color: #66768E;
  background: #EEF2F6;
}

.ai-prompt-category-card.is-rose .ai-prompt-category-card-icon {
  color: #C14C68;
  background: #FFF0F4;
}

.ai-prompt-category-card.is-amber .ai-prompt-category-card-icon {
  color: #A86C00;
  background: #FFF5D8;
}

.ai-prompt-category-card-open strong {
  margin: 0;
  min-width: 0;
  overflow: hidden;
  color: #173F74;
  font-size: .78rem;
  font-weight: 850;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.ai-prompt-category-card-count {
  display: block;
  margin: 9px 0 0 42px;
  color: #7C91AB;
  font-size: .62rem;
  font-weight: 700;
}

.ai-prompt-category-card-footer {
  margin: 19px 0 0 42px;
  justify-content: flex-start;
  gap: 7px;
  color: #1768E5;
  font-size: .63rem;
  font-weight: 800;
}

.ai-prompt-category-card-arrow {
  display: inline;
  width: auto;
  height: auto;
  color: currentColor;
  background: transparent;
}

/* Context heading above table/search results */
.ai-prompt-library-categories.is-context-view {
  display: block;
  padding-bottom: 8px;
}

.ai-prompt-library-context-bar {
  min-height: auto;
  padding: 6px 0 10px;
}

.ai-prompt-library-context-copy {
  display: block;
}

.ai-prompt-library-back-button {
  margin-bottom: 8px;
  padding: 0;
  min-height: auto;
  border: 0;
  color: #1768E5;
  background: transparent;
}

.ai-prompt-library-back-button:hover {
  border: 0;
  background: transparent;
  color: #0E54BB;
}

.ai-prompt-library-context-heading h3 {
  margin: 0;
  color: #173F74;
  font-size: 1.02rem;
  letter-spacing: -.02em;
}

.ai-prompt-library-context-heading p {
  margin: 3px 0 0;
  color: #7489A6;
  font-size: .67rem;
}

/* Loading category cards */
.ai-prompt-category-section-heading.is-loading {
  display: grid;
  gap: 7px;
}

.ai-prompt-category-skeleton-heading,
.ai-prompt-category-skeleton-copy,
.ai-prompt-category-skeleton-icon,
.ai-prompt-category-skeleton-line,
.ai-prompt-category-skeleton-meta {
  display: block;
  border-radius: 999px;
  background:
    linear-gradient(
      90deg,
      #EDF2F7 0%,
      #F8FAFC 45%,
      #EDF2F7 100%
    );
  background-size: 220% 100%;
  animation: aiPromptSkeleton 1.2s ease-in-out infinite;
}

.ai-prompt-category-skeleton-heading {
  width: 150px;
  height: 16px;
}

.ai-prompt-category-skeleton-copy {
  width: min(360px, 80%);
  height: 10px;
}

.ai-prompt-category-card.is-skeleton {
  display: grid;
  grid-template-columns: 32px 1fr;
  gap: 11px;
  min-height: 122px;
  padding: 14px;
  pointer-events: none;
}

.ai-prompt-category-skeleton-icon {
  width: 32px;
  height: 32px;
  border-radius: 9px;
}

.ai-prompt-category-skeleton-line {
  align-self: center;
  width: 75%;
  height: 12px;
}

.ai-prompt-category-skeleton-meta {
  grid-column: 2;
  width: 45%;
  height: 9px;
}

@keyframes aiPromptSkeleton {
  0% { background-position: 100% 0; }
  100% { background-position: -100% 0; }
}

/* Table scanability */
.ai-prompt-table-shell {
  border-radius: 13px;
  border-color: #DDE7F1;
  box-shadow: none;
}

.ai-prompt-table {
  min-width: 1100px;
}

.ai-prompt-table th {
  padding-top: 11px;
  padding-bottom: 11px;
  color: #617A9A;
  background: #F8FAFD;
  font-size: .62rem;
  letter-spacing: .035em;
}

.ai-prompt-table td {
  padding-top: 11px;
  padding-bottom: 11px;
}

.ai-prompt-table tbody tr:hover td {
  background: #FAFCFF;
}

.ai-prompt-table-name-button {
  color: #173F74;
  font-size: .76rem;
}

.ai-prompt-table-name-cell small {
  color: #8DA0B7;
  font-size: .59rem;
}

.ai-prompt-table-use-case {
  color: #587291;
  font-size: .68rem;
  line-height: 1.45;
}

.ai-prompt-pill {
  font-size: .59rem;
}

.ai-prompt-search-highlight {
  padding: 0 1px;
  border-radius: 3px;
  color: inherit;
  background: #FFF0AD;
}

.ai-prompt-missing-badge {
  min-height: 18px;
  margin-top: 4px;
  padding: 1px 6px;
  font-size: .55rem;
}

.ai-prompt-icon-action {
  width: 32px;
  height: 32px;
  border-radius: 8px;
}

.ai-prompt-table th.ai-prompt-table-col-actions,
.ai-prompt-table td.ai-prompt-table-col-actions {
  background: #FFFFFF;
}

.ai-prompt-table thead th.ai-prompt-table-col-actions {
  background: #F8FAFD;
}

/* Empty / error states */
.ai-prompt-library-state {
  display: grid;
  justify-items: center;
  gap: 6px;
  max-width: 520px;
  margin: 28px auto;
  padding: 30px 18px;
  text-align: center;
}

.ai-prompt-library-state[hidden] {
  display: none !important;
}

.ai-prompt-library-state-icon {
  display: inline-grid;
  place-items: center;
  width: 44px;
  height: 44px;
  margin-bottom: 4px;
  border-radius: 50%;
  color: #6C88AA;
  background: #F0F5FA;
}

.ai-prompt-library-state-icon svg {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
}

.ai-prompt-library-state h3 {
  margin: 0;
  color: #173F74;
  font-size: .86rem;
}

.ai-prompt-library-state p {
  margin: 0;
  color: #8192A8;
  font-size: .67rem;
  line-height: 1.5;
}

.ai-prompt-library-state-actions {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}

.ai-prompt-library-state-action,
.ai-prompt-library-retry {
  min-height: 34px;
  padding: 0 12px;
  border: 1px solid #BED5F1;
  border-radius: 9px;
  color: #1768E5;
  background: #FFFFFF;
  cursor: pointer;
  font: inherit;
  font-size: .65rem;
  font-weight: 800;
}

/* Pagination quieter */
.ai-prompt-library-pagination {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 0;
}

.ai-prompt-pagination-summary {
  color: #7187A3;
  font-size: .64rem;
}

.ai-prompt-pagination-button {
  min-width: 30px;
  height: 30px;
  border-radius: 8px;
  font-size: .62rem;
}

/* =========================================================
   DETAIL MODAL — compact, single-copy CTA
========================================================= */

.ai-prompt-detail-dialog {
  width: min(780px, calc(100vw - 28px));
}

.ai-prompt-detail-dialog .ai-prompt-dialog-shell {
  border-radius: 18px;
}

.ai-prompt-detail-dialog .ai-prompt-dialog-header {
  padding: 18px 22px 14px;
}

.ai-prompt-detail-dialog .ai-prompt-dialog-header h2 {
  font-size: 1.12rem;
  letter-spacing: -.025em;
}

.ai-prompt-detail-dialog .ai-prompt-dialog-header > div > p:last-child {
  margin-top: 4px;
  color: #7187A4;
  font-size: .68rem;
}

.ai-prompt-detail-title-line {
  align-items: center;
  gap: 8px;
}

.ai-prompt-detail-id,
.ai-prompt-editor-id {
  display: inline-flex;
  align-items: center;
  min-height: 22px;
  padding: 2px 7px;
  border-radius: 999px;
  color: #7188A5;
  background: #F1F5F9;
  font-size: .59rem;
  font-weight: 800;
}

.ai-prompt-detail-id[hidden],
.ai-prompt-editor-id[hidden] {
  display: none !important;
}

.ai-prompt-detail-dialog .ai-prompt-dialog-body {
  display: grid;
  gap: 14px;
  padding: 16px 22px 18px;
}

.ai-prompt-detail-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.ai-prompt-detail-meta-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 25px;
  padding: 3px 8px;
  border: 1px solid #D9E5F2;
  border-radius: 999px;
  color: #41658F;
  background: #F7FAFE;
  font-size: .6rem;
  font-weight: 800;
}

.ai-prompt-detail-meta-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #79A6DD;
}

.ai-prompt-detail-meta-pill.is-type {
  color: #4B5FAC;
  background: #F2F1FF;
  border-color: #DDD8FA;
}

.ai-prompt-detail-meta-pill.is-type .ai-prompt-detail-meta-dot {
  background: #7267D9;
}

.ai-prompt-detail-meta-pill.is-status.is-active {
  color: #24724A;
  background: #EDF9F2;
  border-color: #B9E0CA;
}

.ai-prompt-detail-meta-pill.is-status.is-active .ai-prompt-detail-meta-dot {
  background: #3A9B68;
}

.ai-prompt-detail-meta-pill.is-status.is-draft {
  color: #8A6100;
  background: #FFF7E2;
  border-color: #EACB83;
}

.ai-prompt-detail-meta-pill.is-status.is-inactive,
.ai-prompt-detail-meta-pill.is-status.is-retired {
  color: #6B788B;
  background: #F4F7FA;
  border-color: #D7E0EA;
}

.ai-prompt-detail-section {
  margin: 0;
}

.ai-prompt-detail-section h3 {
  margin: 0 0 7px;
  color: #173F74;
  font-size: .72rem;
}

.ai-prompt-detail-use-case {
  margin: 0;
  padding: 11px 12px;
  border-radius: 10px;
  font-size: .7rem;
  line-height: 1.5;
}

.ai-prompt-detail-section-heading {
  margin-bottom: 7px;
}

.ai-prompt-copy-button {
  min-height: 34px;
  padding: 0 11px;
  border-radius: 9px;
  font-size: .64rem;
}

.ai-prompt-detail-prompt {
  max-height: 300px;
  min-height: 120px;
  overflow: auto;
  margin: 0;
  padding: 13px;
  border-radius: 10px;
  color: #415D7D;
  background: #FAFCFE;
  font-size: .67rem;
  line-height: 1.55;
  white-space: pre-wrap;
}

.ai-prompt-detail-dialog .ai-prompt-dialog-footer {
  min-height: 58px;
  padding: 10px 22px;
}

/* =========================================================
   ADD / EDIT MODAL — clearer information hierarchy
========================================================= */

.ai-prompt-add-dialog {
  width: min(1040px, calc(100vw - 28px));
}

.ai-prompt-add-dialog .ai-prompt-dialog-shell {
  border-radius: 18px;
}

.ai-prompt-add-dialog .ai-prompt-dialog-header {
  padding: 17px 22px 13px;
}

.ai-prompt-editor-title-line {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}

.ai-prompt-add-scroll {
  padding: 14px 22px 18px;
}

.ai-prompt-form-section {
  margin: 0;
  padding: 14px 0;
  border: 0;
  border-bottom: 1px solid #EAF0F6;
  background: transparent;
  box-shadow: none;
}

.ai-prompt-form-section:first-child {
  padding-top: 4px;
}

.ai-prompt-form-section:last-of-type {
  border-bottom: 0;
}

.ai-prompt-form-section-heading {
  margin-bottom: 10px;
}

.ai-prompt-form-step {
  display: none;
}

.ai-prompt-form-section-heading h3 {
  color: #173F74;
  font-size: .73rem;
}

.ai-prompt-form-section-heading p {
  margin-top: 2px;
  color: #8293A9;
  font-size: .61rem;
}

.ai-prompt-classification-layout {
  display: grid;
  grid-template-columns:
    minmax(0, 1.25fr)
    minmax(0, 1fr)
    minmax(0, 1fr);
  align-items: start;
  gap: 12px;
}

.ai-prompt-form-grid--content {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}

.ai-prompt-form-field > span,
.ai-prompt-form-label {
  margin-bottom: 5px;
  color: #365877;
  font-size: .62rem;
  font-weight: 850;
}

.ai-prompt-form-field input,
.ai-prompt-form-field select,
.ai-prompt-form-field textarea {
  border-color: #D7E3EF;
  border-radius: 9px;
  color: #264E79;
  background: #FFFFFF;
  font-size: .68rem;
}

.ai-prompt-form-field input,
.ai-prompt-form-field select {
  min-height: 38px;
}

.ai-prompt-form-grid--content textarea[name="useCase"] {
  min-height: 96px;
}

.ai-prompt-form-grid--content textarea[name="prompt"] {
  min-height: 190px;
}

.ai-prompt-field-footer {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-top: 5px;
}

.ai-prompt-field-hint {
  margin: 0;
  color: #8A9AAF;
  font-size: .58rem;
}

.ai-prompt-field-counter {
  flex: 0 0 auto;
  color: #8294AA;
  font-size: .57rem;
  font-variant-numeric: tabular-nums;
}

.ai-prompt-new-category-toggle {
  margin-top: 6px;
  font-size: .58rem;
}

.ai-prompt-new-category-inline {
  margin-top: 7px;
}

.ai-prompt-publish-row {
  display: grid;
  grid-template-columns: minmax(190px, .7fr) minmax(0, 1.3fr);
  gap: 12px;
}

.ai-prompt-system-note {
  min-height: 74px;
  border-color: #DDE8F3;
  border-radius: 10px;
  background: #F8FBFE;
}

.ai-prompt-system-note strong {
  font-size: .64rem;
}

.ai-prompt-system-note p {
  font-size: .58rem;
}

.ai-prompt-add-dialog .ai-prompt-dialog-footer {
  min-height: 60px;
  padding: 10px 22px;
}

.ai-prompt-add-dialog .ai-prompt-primary-button,
.ai-prompt-add-dialog .ai-prompt-secondary-button {
  min-height: 38px;
  border-radius: 9px;
}

/* Responsive */
@media (max-width: 1100px) {
  .ai-prompt-library-categories.is-grid-view {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .ai-prompt-classification-layout {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .ai-prompt-name-field {
    grid-column: 1 / -1;
  }
}

@media (max-width: 780px) {
  .ai-prompt-library-placeholder-surface {
    padding: 18px;
  }

  .ai-prompt-library-header {
    gap: 14px;
  }

  .ai-prompt-library-missing-summary {
    align-items: flex-start;
    flex-direction: column;
  }

  .ai-prompt-library-toolbar {
    grid-template-columns: 1fr;
  }

  .ai-prompt-library-filter-toggle {
    width: 100%;
  }

  .ai-prompt-library-filter-popover {
    left: 0;
    right: auto;
    width: min(100%, 420px);
  }

  .ai-prompt-library-categories.is-grid-view {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .ai-prompt-classification-layout,
  .ai-prompt-publish-row {
    grid-template-columns: 1fr;
  }

  .ai-prompt-name-field {
    grid-column: auto;
  }
}

@media (max-width: 520px) {
  .ai-prompt-library-placeholder-surface {
    padding: 14px;
    border-radius: 14px;
  }

  .ai-prompt-library-header {
    flex-direction: column;
  }

  .ai-prompt-library-add-button {
    width: 100%;
  }

  .ai-prompt-library-categories.is-grid-view {
    grid-template-columns: 1fr;
  }

  .ai-prompt-category-card-open {
    min-height: 108px;
  }

  .ai-prompt-library-active-filters {
    align-items: flex-start;
    flex-direction: column;
  }

  .ai-prompt-filter-check-grid {
    grid-template-columns: 1fr;
  }

  .ai-prompt-detail-dialog,
  .ai-prompt-add-dialog {
    width: calc(100vw - 16px);
  }
}


/* =========================================================
   CATEGORY MONOGRAM CARDS + PROMPT TABLE ACTION
========================================================= */

.ai-prompt-category-card {
  --category-accent: #1768E5;
  --category-accent-bg: #EAF4FF;
  border-color: #DCE7F2;
  box-shadow: 0 4px 12px rgb(25 63 109 / 4%);
  transition:
    transform .16s ease,
    border-color .16s ease,
    box-shadow .16s ease,
    background .16s ease;
}

.ai-prompt-category-card:hover,
.ai-prompt-category-card:focus-within {
  transform: translateY(-2px);
  border-color: #9EC3F0;
  background: #FFFFFF;
  box-shadow:
    0 12px 28px rgb(25 63 109 / 9%),
    0 2px 8px rgb(25 63 109 / 4%);
}

.ai-prompt-category-card-open:focus-visible {
  outline: 3px solid rgb(23 104 229 / 14%);
  outline-offset: 2px;
}

.ai-prompt-category-card-monogram {
  display: inline-grid;
  place-items: center;
  flex: 0 0 36px;
  width: 36px;
  height: 36px;
  border: 1px solid rgb(23 104 229 / 12%);
  border-radius: 10px;
  color: var(--category-accent);
  background: var(--category-accent-bg);
  font-size: .68rem;
  font-weight: 900;
  line-height: 1;
  letter-spacing: .035em;
  transition:
    transform .16s ease,
    border-color .16s ease;
}

.ai-prompt-category-card:hover
.ai-prompt-category-card-monogram,
.ai-prompt-category-card:focus-within
.ai-prompt-category-card-monogram {
  transform: translateY(-1px);
  border-color: rgb(23 104 229 / 22%);
}

.ai-prompt-category-card-count {
  margin-left: 46px;
}

.ai-prompt-category-card-footer {
  margin-left: 46px;
}

.ai-prompt-category-card-arrow {
  transition: transform .16s ease;
}

.ai-prompt-category-card:hover
.ai-prompt-category-card-arrow,
.ai-prompt-category-card:focus-within
.ai-prompt-category-card-arrow {
  transform: translateX(3px);
}

/* Accent choice is derived automatically from the category name.
   No category-to-icon or category-to-style setup is required. */
.ai-prompt-category-card.is-accent-0 {
  --category-accent: #1768E5;
  --category-accent-bg: #EAF4FF;
}

.ai-prompt-category-card.is-accent-1 {
  --category-accent: #6D4BD6;
  --category-accent-bg: #F0ECFF;
}

.ai-prompt-category-card.is-accent-2 {
  --category-accent: #087F9B;
  --category-accent-bg: #E6F9FC;
}

.ai-prompt-category-card.is-accent-3 {
  --category-accent: #23805A;
  --category-accent-bg: #E8F8F0;
}

.ai-prompt-category-card.is-accent-4 {
  --category-accent: #B24E69;
  --category-accent-bg: #FFF0F4;
}

.ai-prompt-category-card.is-accent-5 {
  --category-accent: #9A6500;
  --category-accent-bg: #FFF5D8;
}

/* The primary row action opens the Prompt modal. */
.ai-prompt-table-prompt-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 70px;
  height: 32px;
  padding: 0 11px;
  border: 1px solid #B9D3F6;
  border-radius: 8px;
  color: #145FCF;
  background: #F6FAFF;
  cursor: pointer;
  font: inherit;
  font-size: .61rem;
  font-weight: 850;
  line-height: 1;
  white-space: nowrap;
  transition:
    border-color .14s ease,
