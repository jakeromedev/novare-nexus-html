<style>
/* Styles ManagedLinks — modularized from the former monolithic Styles.html. */

  /* =========================================================
     SHARED MANAGED-LINK STATES
     ---------------------------------------------------------
     Design intent:
     - Keep content cards, images, titles, and descriptions readable.
     - When a managed link is unavailable, mute only the actionable
       affordance (arrow / CTA / button control), not the full card.
     - Provide a playful floating tooltip on hover/focus.
     ========================================================= */

  :root {
    --managed-missing-bg: #F2F5F8;
    --managed-missing-border: #D7DEE7;
    --managed-missing-text: #6E7C8D;
    --managed-missing-icon: #8190A2;
    --managed-tooltip-bg: linear-gradient(135deg, #133C9A 0%, #2563EB 55%, #4F8CFF 100%);
    --managed-tooltip-shadow: 0 18px 38px rgb(11 46 117 / 28%);
  }

  [data-managed-link-missing="true"] {
    position: relative;
    cursor: pointer !important;
  }

  [data-managed-link-missing="true"]:focus-visible {
    outline: 2px solid rgb(37 99 235 / 34%);
    outline-offset: 2px;
  }

  /* ---------------------------------------------------------
     FUN FLOATING TOOLTIP
     --------------------------------------------------------- */

  .managed-link-tooltip {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 9999;
    pointer-events: none;
    opacity: 0;
  }

  .managed-link-tooltip[hidden] {
    display: none;
  }

  .managed-link-tooltip-card {
    position: relative;
    width: min(204px, calc(100vw - 18px));
    padding: 8px 10px;
    border-radius: 12px;
    background: var(--managed-tooltip-bg);
    color: #FFFFFF;
    box-shadow: 0 12px 24px rgb(11 46 117 / 24%);
    border: 1px solid rgb(255 255 255 / 20%);
    transform: translateY(6px) scale(.98);
    transform-origin: center bottom;
    transition:
      opacity 120ms ease,
      transform 190ms cubic-bezier(.2,.8,.2,1);
    overflow: hidden;
  }

  .managed-link-tooltip-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at top right, rgb(255 255 255 / 18%) 0, transparent 38%),
      linear-gradient(180deg, rgb(255 255 255 / 8%), transparent 62%);
    pointer-events: none;
  }

  .managed-link-tooltip-message {
    position: relative;
    z-index: 1;
    margin: 0;
    color: #FFFFFF;
    font-size: .68rem;
    font-weight: 760;
    line-height: 1.26;
    letter-spacing: -.005em;
  }

  .managed-link-tooltip-caret {
    position: absolute;
    left: 50%;
    width: 10px;
    height: 10px;
    background: #2B6EF5;
    border-right: 1px solid rgb(255 255 255 / 22%);
    border-bottom: 1px solid rgb(255 255 255 / 22%);
    transform: translateX(-50%) rotate(45deg);
    box-shadow: 8px 8px 20px rgb(11 46 117 / 12%);
  }

  .managed-link-tooltip[data-placement="top"] .managed-link-tooltip-caret {
    bottom: -5px;
  }

  .managed-link-tooltip[data-placement="bottom"] .managed-link-tooltip-card {
    transform-origin: center top;
    transform: translateY(-6px) scale(.98);
  }

  .managed-link-tooltip[data-placement="bottom"] .managed-link-tooltip-caret {
    top: -5px;
    transform: translateX(-50%) rotate(225deg);
  }

  .managed-link-tooltip.is-visible {
    opacity: 1;
  }

  .managed-link-tooltip.is-visible[data-placement="top"] .managed-link-tooltip-card {
    transform: translateY(0) scale(1);
    animation: managedTooltipEnterTop 190ms cubic-bezier(.2,.8,.2,1) both;
  }

  .managed-link-tooltip.is-visible[data-placement="bottom"] .managed-link-tooltip-card {
    transform: translateY(0) scale(1);
    animation: managedTooltipEnterBottom 190ms cubic-bezier(.2,.8,.2,1) both;
  }

  @keyframes managedTooltipEnterTop {
    from {
      opacity: 0;
      transform: translateY(7px) scale(.98);
      filter: blur(1.5px);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: blur(0);
    }
  }

  @keyframes managedTooltipEnterBottom {
    from {
      opacity: 0;
      transform: translateY(-7px) scale(.98);
      filter: blur(1.5px);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: blur(0);
    }
  }

  @keyframes managedTooltipSpark {
    0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
    50%      { transform: scale(1.16) rotate(10deg); opacity: .82; }
  }

  /* ---------------------------------------------------------
     GENERIC UNAVAILABLE ACTION LOOK
     --------------------------------------------------------- */

  .managed-link-unavailable-action,
  .offerings-page .offering-artifacts button[data-managed-link-missing="true"],
  .offerings-page .offering-explore-button[data-managed-link-missing="true"],
  .offerings-page .offerings-quote-button[data-managed-link-missing="true"],
  .opportunities-page .opportunity-entry-arrow[data-managed-link-missing="true"],
  .opportunities-page .toolkit-card[data-managed-link-missing="true"] .toolkit-card-arrow,
  .opportunities-page .sales-pillar-card[data-managed-link-missing="true"] .sales-pillar-arrow,
  .opportunities-page .deal-retrospective-card[data-managed-link-missing="true"] .deal-retrospective-arrow,
  .opportunities-page .opportunities-quick-card[data-managed-link-missing="true"] .opportunities-quick-arrow,
  .programs-page .program-entry-arrow[data-managed-link-missing="true"],
  .programs-page .innovation-playbook-stages button[data-managed-link-missing="true"],
  .programs-page .program-toolkit-shortcuts button[data-managed-link-missing="true"],
  .programs-page .program-insight-cta[data-managed-link-missing="true"],
  .programs-page .programs-quick-card[data-managed-link-missing="true"] .programs-quick-arrow,
  .delivery-page .delivery-resource-card[data-managed-link-missing="true"] .delivery-resource-arrow,
  .delivery-page .delivery-quick-card[data-managed-link-missing="true"] .delivery-quick-arrow,
  .governance-page .governance-card-cta[data-managed-link-missing="true"],
  .governance-page .governance-quick-card[data-managed-link-missing="true"] .governance-quick-arrow,
  .tools-page .tools-template-card[data-managed-link-missing="true"] .tools-template-arrow,
  .tools-page .tools-stack-arrow[data-managed-link-missing="true"],
  .support-page .support-option-card[data-managed-link-missing="true"] .support-option-arrow,
  .support-page .support-faq-item[data-managed-link-missing="true"] > span:last-child,
  .support-page .support-link-card[data-managed-link-missing="true"] .support-link-arrow,
  .support-page .support-bottom-button[data-managed-link-missing="true"] > span:last-child {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-width: 30px;
    min-height: 30px;
    padding: 0 10px;
    border-radius: 999px;
    border: 1px solid var(--managed-missing-border) !important;
    background: var(--managed-missing-bg) !important;
    color: var(--managed-missing-text) !important;
    box-shadow: none !important;
    filter: none !important;
    opacity: 1 !important;
    transition:
      transform 160ms ease,
      border-color 160ms ease,
      background-color 160ms ease,
      color 160ms ease;
  }

  .offerings-page [data-managed-link-missing="true"] svg,
  .opportunities-page .opportunity-entry-arrow[data-managed-link-missing="true"] svg,
  .programs-page .program-entry-arrow[data-managed-link-missing="true"] svg,
  .governance-page .governance-card-cta[data-managed-link-missing="true"] svg,
  .tools-page .tools-stack-arrow[data-managed-link-missing="true"] svg,
  .support-page .support-bottom-button[data-managed-link-missing="true"] svg,
  .offerings-page .offering-artifacts button[data-managed-link-missing="true"] .artifact-icon,
  .opportunities-page .toolkit-card[data-managed-link-missing="true"] .toolkit-card-arrow,
  .opportunities-page .sales-pillar-card[data-managed-link-missing="true"] .sales-pillar-arrow,
  .opportunities-page .deal-retrospective-card[data-managed-link-missing="true"] .deal-retrospective-arrow,
  .opportunities-page .opportunities-quick-card[data-managed-link-missing="true"] .opportunities-quick-arrow,
  .programs-page .programs-quick-card[data-managed-link-missing="true"] .programs-quick-arrow,
  .delivery-page .delivery-resource-card[data-managed-link-missing="true"] .delivery-resource-arrow,
  .delivery-page .delivery-quick-card[data-managed-link-missing="true"] .delivery-quick-arrow,
  .governance-page .governance-quick-card[data-managed-link-missing="true"] .governance-quick-arrow,
  .tools-page .tools-template-card[data-managed-link-missing="true"] .tools-template-arrow,
  .support-page .support-option-card[data-managed-link-missing="true"] .support-option-arrow,
  .support-page .support-link-card[data-managed-link-missing="true"] .support-link-arrow,
  .support-page .support-faq-item[data-managed-link-missing="true"] > span:last-child {
    color: var(--managed-missing-icon) !important;
    stroke: var(--managed-missing-icon) !important;
  }

  .offerings-page [data-managed-link-missing="true"]:hover,
  .opportunities-page [data-managed-link-missing="true"]:hover,
  .programs-page [data-managed-link-missing="true"]:hover,
  .delivery-page [data-managed-link-missing="true"]:hover,
  .governance-page [data-managed-link-missing="true"]:hover,
  .tools-page [data-managed-link-missing="true"]:hover,
  .support-page [data-managed-link-missing="true"]:hover {
    transform: translateY(-1px);
  }

  .offerings-page .offering-artifacts button[data-managed-link-missing="true"]:hover,
  .offerings-page .offering-explore-button[data-managed-link-missing="true"]:hover,
  .offerings-page .offerings-quote-button[data-managed-link-missing="true"]:hover,
  .opportunities-page .opportunity-entry-arrow[data-managed-link-missing="true"]:hover,
  .opportunities-page .toolkit-card[data-managed-link-missing="true"]:hover .toolkit-card-arrow,
  .opportunities-page .sales-pillar-card[data-managed-link-missing="true"]:hover .sales-pillar-arrow,
  .opportunities-page .deal-retrospective-card[data-managed-link-missing="true"]:hover .deal-retrospective-arrow,
  .opportunities-page .opportunities-quick-card[data-managed-link-missing="true"]:hover .opportunities-quick-arrow,
  .programs-page .program-entry-arrow[data-managed-link-missing="true"]:hover,
  .programs-page .innovation-playbook-stages button[data-managed-link-missing="true"]:hover,
  .programs-page .program-toolkit-shortcuts button[data-managed-link-missing="true"]:hover,
  .programs-page .program-insight-cta[data-managed-link-missing="true"]:hover,
  .programs-page .programs-quick-card[data-managed-link-missing="true"]:hover .programs-quick-arrow,
  .delivery-page .delivery-resource-card[data-managed-link-missing="true"]:hover .delivery-resource-arrow,
  .delivery-page .delivery-quick-card[data-managed-link-missing="true"]:hover .delivery-quick-arrow,
  .governance-page .governance-card-cta[data-managed-link-missing="true"]:hover,
  .governance-page .governance-quick-card[data-managed-link-missing="true"]:hover .governance-quick-arrow,
  .tools-page .tools-template-card[data-managed-link-missing="true"]:hover .tools-template-arrow,
  .tools-page .tools-stack-arrow[data-managed-link-missing="true"]:hover,
  .support-page .support-option-card[data-managed-link-missing="true"]:hover .support-option-arrow,
  .support-page .support-faq-item[data-managed-link-missing="true"]:hover > span:last-child,
  .support-page .support-link-card[data-managed-link-missing="true"]:hover .support-link-arrow,
  .support-page .support-bottom-button[data-managed-link-missing="true"]:hover > span:last-child {
    border-color: #C7D0DA !important;
    transform: translateY(-1px);
  }

  /* Explicitly keep cards and images vivid when the link is unavailable. */
  .opportunities-page .toolkit-card[data-managed-link-missing="true"],
  .opportunities-page .sales-pillar-card[data-managed-link-missing="true"],
  .opportunities-page .deal-retrospective-card[data-managed-link-missing="true"],
  .opportunities-page .opportunities-quick-card[data-managed-link-missing="true"],
  .programs-page .programs-quick-card[data-managed-link-missing="true"],
  .delivery-page .delivery-resource-card[data-managed-link-missing="true"],
  .delivery-page .delivery-quick-card[data-managed-link-missing="true"],
  .governance-page .governance-quick-card[data-managed-link-missing="true"],
  .tools-page .tools-template-card[data-managed-link-missing="true"],
  .support-page .support-option-card[data-managed-link-missing="true"],
  .support-page .support-faq-item[data-managed-link-missing="true"],
  .support-page .support-link-card[data-managed-link-missing="true"] {
    filter: none !important;
    opacity: 1 !important;
  }

  @media (prefers-reduced-motion: reduce) {
    .managed-link-tooltip-card,
    .managed-link-tooltip.is-visible .managed-link-tooltip-card,
    .offerings-page [data-managed-link-missing="true"],
    .opportunities-page [data-managed-link-missing="true"],
    .programs-page [data-managed-link-missing="true"],
    .delivery-page [data-managed-link-missing="true"],
    .governance-page [data-managed-link-missing="true"],
    .tools-page [data-managed-link-missing="true"],
    .support-page [data-managed-link-missing="true"] {
      animation: none !important;
      transition: none !important;
    }
  }


  /* ---------------------------------------------------------

     Styles_Runtime contains the legacy full-card gray treatment.
     These later rules intentionally neutralize that treatment.
     --------------------------------------------------------- */

    filter: none !important;
    opacity: 1 !important;
  }

  .home-page .role-card[data-managed-link-missing="true"] {
    color: #071B4B !important;
    background: #FFFFFF !important;
    border-color: #D7E8F5 !important;
