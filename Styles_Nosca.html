<style>
/* Styles Nosca — modularized from the former monolithic Styles.html. */
    /* =========================================================
       ASK NOSCA — PHASE 5 CHAT UI
    ========================================================== */

    .nosca-dialog {
      width: min(620px, calc(100vw - 28px));
      height: min(780px, calc(100dvh - 28px));
      max-width: none;
      max-height: none;
      margin: auto;
      padding: 0;
      overflow: hidden;
      border: 1px solid rgb(99 158 216 / 35%);
      border-radius: 24px;
      color: #071B36;
      background: #F7FBFF;
      box-shadow:
        0 38px 110px rgb(0 17 42 / 34%),
        0 0 0 1px rgb(255 255 255 / 70%) inset;
    }

    .nosca-dialog::backdrop {
      background:
        radial-gradient(
          circle at 76% 22%,
          rgb(11 131 238 / 15%),
          transparent 36%
        ),
        rgb(0 17 38 / 64%);
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
    }

    .nosca-shell {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto auto auto;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(
          circle at 93% 0%,
          rgb(24 195 236 / 10%),
          transparent 27%
        ),
        linear-gradient(
          180deg,
          #FFFFFF 0%,
          #F6FAFE 100%
        );
    }

    .nosca-header {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 76px;
      padding: 14px 16px 13px 18px;
      border-bottom: 1px solid #DCEAF5;
      background:
        linear-gradient(
          135deg,
          rgb(255 255 255 / 98%),
          rgb(239 248 255 / 96%)
        );
    }

    .nosca-brand {
      display: grid;
      width: 43px;
      height: 43px;
      flex: 0 0 43px;
      place-items: center;
      border: 1px solid rgb(84 201 239 / 42%);
      border-radius: 13px;
      color: #FFFFFF;
      background:
        linear-gradient(
          145deg,
          #08BFE6 0%,
          #087DF1 46%,
          #224EE4 100%
        );
      box-shadow:
        0 9px 20px rgb(13 112 226 / 23%),
        inset 0 1px 0 rgb(255 255 255 / 30%);
    }

    .nosca-brand svg {
      width: 24px;
      height: 24px;
    }

    .nosca-heading {
      min-width: 0;
      flex: 1;
    }

    .nosca-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nosca-dialog .nosca-heading h2 {
      margin: 0;
      color: #071D42;
      font-size: 1.08rem;
      font-weight: 820;
      line-height: 1.2;
      letter-spacing: -.02em;
    }

    .nosca-beta {
      display: inline-flex;
      align-items: center;
      min-height: 20px;
      padding: 2px 6px;
      border: 1px solid #B8E5F4;
      border-radius: 5px;
      color: #0876B3;
      background: #E7F8FD;
      font-size: .58rem;
      font-weight: 850;
      letter-spacing: .07em;
    }

    .nosca-dialog .nosca-heading p {
      margin: 4px 0 0;
      color: #61758D;
      font-size: .72rem;
      font-weight: 560;
    }

    .nosca-header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nosca-header-button {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 50%;
      color: #506A85;
      background: transparent;
      cursor: pointer;
      transition:
        background-color 150ms ease,
        border-color 150ms ease,
        color 150ms ease,
        transform 150ms ease;
    }

    .nosca-header-button:hover {
      border-color: #D7E8F5;
      color: #0B5BBD;
      background: #EDF7FD;
    }

    .nosca-header-button:active {
      transform: scale(.96);
    }

    .nosca-header-button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .nosca-header-button svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nosca-messages {
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 22px 19px 28px;
      scroll-behavior: smooth;
      scrollbar-width: thin;
      scrollbar-color: #BCD6EA transparent;
    }

    .nosca-welcome {
      display: grid;
      justify-items: center;
      max-width: 470px;
      margin: 32px auto 0;
      text-align: center;
    }

    .nosca-welcome[hidden] {
      display: none;
    }

    .nosca-welcome-mark {
      display: grid;
      width: 58px;
      height: 58px;
      place-items: center;
      margin-bottom: 16px;
      border: 1px solid #BEE8F5;
      border-radius: 18px;
      color: #087EDD;
      background:
        radial-gradient(
          circle at 35% 20%,
          #FFFFFF,
          #E7F8FF 62%,
          #DFF0FF
        );
      box-shadow: 0 12px 30px rgb(12 107 198 / 12%);
    }

    .nosca-welcome-mark svg {
      width: 30px;
      height: 30px;
    }

    .nosca-welcome h3 {
      margin: 0;
      color: #071F47;
      font-size: clamp(1.2rem, 3vw, 1.45rem);
      font-weight: 800;
      letter-spacing: -.025em;
    }

    .nosca-welcome > p:not(.nosca-grounding-note) {
      max-width: 420px;
      margin: 9px 0 0;
      color: #5A718A;
      font-size: .84rem;
      line-height: 1.55;
    }

    .nosca-suggestions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 20px;
    }

    .nosca-suggestion {
      min-height: 34px;
      padding: 7px 11px;
      border: 1px solid #D4E8F6;
      border-radius: 999px;
      color: #0A5AB9;
      background: #FFFFFF;
      font-size: .69rem;
      font-weight: 680;
      cursor: pointer;
      box-shadow: 0 3px 9px rgb(10 81 155 / 5%);
      transition:
        border-color 150ms ease,
        background-color 150ms ease,
        transform 150ms ease;
    }

    .nosca-suggestion:hover {
      transform: translateY(-1px);
      border-color: #A7D8F3;
      background: #F1FAFF;
    }

    .nosca-grounding-note {
      max-width: 410px;
      margin: 22px 0 0;
      color: #8394A5;
      font-size: .64rem;
      line-height: 1.5;
    }

    .nosca-message {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      width: 100%;
      margin: 0 0 18px;
    }

    .nosca-message--user {
      justify-content: flex-end;
      padding-left: 58px;
    }

    .nosca-message--assistant {
      padding-right: 28px;
    }

    .nosca-message-avatar {
      display: grid;
      width: 31px;
      height: 31px;
      flex: 0 0 31px;
      place-items: center;
      margin-top: 2px;
      border-radius: 10px;
      color: #FFFFFF;
      background:
        linear-gradient(
          145deg,
          #10BEE4,
          #087AF0 55%,
          #244FE3
        );
      box-shadow: 0 5px 13px rgb(10 103 211 / 17%);
    }

    .nosca-message-avatar svg {
      width: 18px;
      height: 18px;
    }

    .nosca-message-body {
      min-width: 0;
      width: min(100%, 480px);
    }

    .nosca-message-bubble {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .nosca-message--assistant .nosca-message-bubble {
      padding: 12px 14px 13px;
      border: 1px solid #DCEAF5;
      border-radius: 5px 17px 17px 17px;
      color: #18324C;
      background: #FFFFFF;
      box-shadow: 0 4px 14px rgb(19 70 119 / 5%);
    }

    .nosca-message--user .nosca-message-bubble {
      max-width: min(420px, 100%);
      padding: 11px 14px 12px;
      border: 1px solid #1679E7;
      border-radius: 17px 17px 5px 17px;
      color: #FFFFFF;
      background:
        linear-gradient(
          140deg,
          #1088F4 0%,
          #075BCF 100%
        );
      box-shadow: 0 7px 19px rgb(3 81 174 / 14%);
    }

    .nosca-message-label {
      display: block;
      margin-bottom: 5px;
      color: #668099;
      font-size: .59rem;
      font-weight: 800;
      letter-spacing: .055em;
      text-transform: uppercase;
    }

    .nosca-message--user .nosca-message-label {
      color: rgb(255 255 255 / 72%);
    }

    .nosca-message-text {
      margin: 0;
      color: inherit;
      font-size: .82rem;
      line-height: 1.58;
      white-space: pre-wrap;
    }

    .nosca-answer-text {
      white-space: normal;
    }

    .nosca-answer-text p {
      margin: 0 0 10px;
      color: inherit;
      font-size: inherit;
      line-height: inherit;
      white-space: pre-wrap;
    }

    .nosca-answer-text p:last-child {
      margin-bottom: 0;
    }

    .nosca-answer-list {
      margin: 5px 0 11px;
      padding-left: 19px;
      color: inherit;
      font-size: .82rem;
      line-height: 1.58;
    }

    .nosca-answer-list:last-child {
      margin-bottom: 0;
    }

    .nosca-answer-note {
      margin-top: 7px;
      padding: 8px 10px;
      border: 1px solid #E4DDAE;
      border-radius: 9px;
      color: #735E16;
      background: #FFFBE8;
      font-size: .67rem;
      line-height: 1.45;
    }

    .nosca-loading-bubble {
      min-width: 245px;
    }

    .nosca-loading-line {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #4D6781;
      font-size: .75rem;
      font-weight: 610;
    }

    .nosca-thinking-dots {
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .nosca-thinking-dots i {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #1889E9;
      animation: nosca-thinking 1.1s ease-in-out infinite;
    }

    .nosca-thinking-dots i:nth-child(2) {
      animation-delay: .13s;
    }

    .nosca-thinking-dots i:nth-child(3) {
      animation-delay: .26s;
    }

    @keyframes nosca-thinking {
      0%, 65%, 100% {
        transform: translateY(0);
        opacity: .35;
      }
      32% {
        transform: translateY(-3px);
        opacity: 1;
      }
    }

    .nosca-sources {
      margin-top: 8px;
      padding: 10px;
      border: 1px solid #DDEAF4;
      border-radius: 12px;
      background: rgb(244 250 254 / 82%);
    }

    .nosca-sources-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 1px 7px;
      color: #617A93;
      font-size: .61rem;
      font-weight: 780;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .nosca-source-list {
      display: grid;
      gap: 6px;
    }

    .nosca-source-card {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 9px;
      min-width: 0;
      padding: 8px 9px;
      border: 1px solid #D9E8F4;
      border-radius: 9px;
      color: #173B60;
      background: #FFFFFF;
      text-decoration: none;
    }

    a.nosca-source-card {
      cursor: pointer;
      transition:
        border-color 140ms ease,
        box-shadow 140ms ease,
        transform 140ms ease;
    }

    a.nosca-source-card:hover {
      transform: translateY(-1px);
      border-color: #A5D4F0;
      box-shadow: 0 5px 13px rgb(22 108 185 / 8%);
    }

    .nosca-source-icon {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border-radius: 8px;
      color: #0E77D1;
      background: #EAF7FE;
    }

    .nosca-source-icon svg {
      width: 15px;
      height: 15px;
    }

    .nosca-source-copy {
      display: grid;
      min-width: 0;
      gap: 2px;
    }

    .nosca-source-copy strong {
      overflow: hidden;
      color: #173B60;
      font-size: .69rem;
      font-weight: 750;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .nosca-source-copy > span {
      overflow: hidden;
      color: #788DA2;
      font-size: .59rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .nosca-source-open {
      display: grid;
      place-items: center;
      color: #7B97B1;
    }

    .nosca-source-open svg {
      width: 14px;
      height: 14px;
    }

    .nosca-message.is-error .nosca-message-bubble {
      border-color: #F1D0D0;
      background: #FFF9F9;
    }

    .nosca-error-title {
      display: block;
      margin-bottom: 5px;
      color: #9A3030;
      font-size: .78rem;
    }

    .nosca-retry {
      min-height: 30px;
      margin-top: 9px;
      padding: 5px 10px;
      border: 1px solid #E7BFC2;
      border-radius: 8px;
      color: #A23238;
      background: #FFFFFF;
      font-size: .66rem;
      font-weight: 720;
      cursor: pointer;
    }

    .nosca-status {
      min-height: 0;
      padding: 0 19px;
      color: #667C91;
      font-size: .65rem;
      line-height: 1.35;
    }

    .nosca-status:empty {
      display: none;
    }

    .nosca-status:not(:empty) {
      padding-top: 7px;
    }

    .nosca-status[data-tone="error"] {
      color: #AA3E45;
    }

    .nosca-status[data-tone="warning"] {
      color: #8A6817;
    }

    .nosca-composer {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 9px;
      margin: 10px 14px 0;
      padding: 8px 8px 8px 13px;
      border: 1px solid #CFE3F2;
      border-radius: 16px;
      background: #FFFFFF;
      box-shadow:
        0 8px 24px rgb(21 82 135 / 8%),
        0 0 0 1px rgb(255 255 255 / 80%) inset;
    }

    .nosca-composer:focus-within {
      border-color: #76BBEF;
      box-shadow:
        0 8px 24px rgb(21 82 135 / 8%),
        0 0 0 3px rgb(25 139 232 / 10%);
    }

    .nosca-composer textarea {
      display: block;
      width: 100%;
      min-height: 34px;
      max-height: 120px;
      resize: none;
      overflow-y: auto;
      padding: 7px 1px 5px;
      border: 0;
      outline: 0;
      color: #112D49;
      background: transparent;
      font: inherit;
      font-size: .82rem;
      line-height: 1.42;
    }

    .nosca-composer textarea::placeholder {
      color: #8799AA;
      opacity: 1;
    }

    .nosca-send {
      display: grid;
      width: 39px;
      height: 39px;
      place-items: center;
      padding: 0;
      border: 1px solid #0A78DF;
      border-radius: 12px;
      color: #FFFFFF;
      background:
        linear-gradient(
          145deg,
          #10A5ED,
          #0768DD 58%,
          #1648C9
        );
      cursor: pointer;
      box-shadow: 0 6px 15px rgb(7 91 202 / 20%);
      transition:
        transform 140ms ease,
        opacity 140ms ease,
        box-shadow 140ms ease;
    }

    .nosca-send:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 19px rgb(7 91 202 / 25%);
    }

    .nosca-send:disabled {
      opacity: .38;
      cursor: not-allowed;
      box-shadow: none;
    }

    .nosca-send svg {
      width: 18px;
      height: 18px;
    }

    .nosca-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 34px;
      padding: 6px 17px 9px;
      color: #8A9BAB;
      font-size: .55rem;
      line-height: 1.3;
    }

    .nosca-footer span:last-child {
      text-align: right;
    }

    .sr-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    @media (max-width: 620px) {
      .nosca-dialog {
        width: calc(100vw - 12px);
        height: calc(100dvh - 12px);
        border-radius: 18px;
      }

      .nosca-header {
        min-height: 69px;
        padding: 11px 10px 10px 13px;
      }

      .nosca-brand {
        width: 39px;
        height: 39px;
        flex-basis: 39px;
        border-radius: 11px;
      }

      .nosca-header-button {
        width: 34px;
        height: 34px;
      }

      .nosca-messages {
        padding: 17px 12px 23px;
      }

      .nosca-welcome {
        margin-top: 24px;
      }

      .nosca-message--user {
        padding-left: 34px;
      }

      .nosca-message--assistant {
        padding-right: 4px;
      }

      .nosca-message-avatar {
        width: 28px;
        height: 28px;
        flex-basis: 28px;
      }

      .nosca-composer {
        margin-inline: 9px;
      }

      .nosca-footer {
        padding-inline: 12px;
      }

      .nosca-footer span:last-child {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .nosca-thinking-dots i {
        animation: none;
        opacity: .75;
      }

      .nosca-suggestion,
      .nosca-header-button,
      .nosca-send,
      a.nosca-source-card {
        transition: none;
      }
    }


    /* =========================================================
       ASK NOSCA — PHASE 6 FEEDBACK
    ========================================================== */

    .nosca-feedback {
      margin-top: 9px;
      padding: 9px 10px;
      border: 1px solid #DDEAF4;
      border-radius: 12px;
      background: rgb(249 252 255 / 88%);
    }

    .nosca-feedback-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .nosca-feedback-question {
      color: #657C92;
      font-size: .66rem;
      font-weight: 680;
    }

    .nosca-feedback-actions {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .nosca-feedback-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-height: 30px;
      padding: 5px 8px;
      border: 1px solid #D6E6F2;
      border-radius: 8px;
      color: #58738D;
      background: #FFFFFF;
      font-size: .61rem;
      font-weight: 690;
      cursor: pointer;
      transition:
        border-color 140ms ease,
        color 140ms ease,
        background-color 140ms ease,
        transform 140ms ease;
    }

    .nosca-feedback-button svg {
      width: 13px;
      height: 13px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nosca-feedback-button:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: #A9D3EE;
      color: #0B6BCB;
      background: #F3FAFF;
    }

    .nosca-feedback-button.is-selected {
      border-color: #78BEEE;
      color: #075FB8;
      background: #EAF7FF;
      box-shadow: inset 0 0 0 1px rgb(33 135 214 / 6%);
    }

    .nosca-feedback-button--no.is-selected {
      border-color: #E4B7B9;
      color: #9D3B43;
      background: #FFF4F5;
    }

    .nosca-feedback-button:disabled {
      opacity: .55;
      cursor: not-allowed;
      transform: none;
    }

    .nosca-feedback-status {
      min-height: 0;
      margin: 0;
      color: #71879A;
      font-size: .59rem;
      line-height: 1.4;
    }

    .nosca-feedback-status:not(:empty) {
      margin-top: 7px;
    }

    .nosca-feedback-note {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 7px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #E3EDF5;
    }

    .nosca-feedback-note[hidden] {
      display: none;
    }

    .nosca-feedback-note-label {
      grid-column: 1 / -1;
      color: #71869A;
      font-size: .59rem;
      font-weight: 650;
    }

    .nosca-feedback-note textarea {
      width: 100%;
      min-height: 50px;
      max-height: 110px;
      resize: vertical;
      padding: 8px 9px;
      border: 1px solid #D5E5F1;
      border-radius: 8px;
      outline: 0;
      color: #17334F;
      background: #FFFFFF;
      font: inherit;
      font-size: .65rem;
      line-height: 1.4;
    }

    .nosca-feedback-note textarea:focus {
      border-color: #79BBEA;
      box-shadow: 0 0 0 3px rgb(34 139 220 / 8%);
    }

    .nosca-feedback-note textarea::placeholder {
      color: #93A3B1;
      opacity: 1;
    }

    .nosca-feedback-note-save {
      min-height: 34px;
      padding: 6px 10px;
      border: 1px solid #BBD9ED;
      border-radius: 8px;
      color: #0B63B9;
      background: #F2FAFF;
      font-size: .61rem;
      font-weight: 720;
      cursor: pointer;
    }

    .nosca-feedback-note-save:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .nosca-feedback.is-saving {
      opacity: .78;
    }

    @media (max-width: 520px) {
      .nosca-feedback-top {
        align-items: flex-start;
        flex-direction: column;
      }

      .nosca-feedback-actions {
        width: 100%;
      }

      .nosca-feedback-button {
        flex: 1;
      }

      .nosca-feedback-note {
