<style>
/* Styles Nosca Floating — modularized from the former monolithic Styles.html. */
    /* =========================================================
       ASK NOSCA — MESSENGER-STYLE FLOATING PANEL
       Non-modal, minimizable, persistent across SPA navigation.
       ========================================================= */

    .nosca-dialog.nosca-chat-panel {
      position: fixed;
      inset:
        auto
        auto
        22px
        calc(var(--sidebar-width) + 18px);
      z-index: 120;
      width: min(410px, calc(100vw - 32px));
      height: min(640px, calc(100dvh - 44px));
      max-width: none;
      max-height: none;
      margin: 0;
      padding: 0;
      overflow: hidden;
      border: 1px solid rgb(87 113 155 / 28%);
      border-radius: 18px;
      color: #10233E;
      background: #F5F7FA;
      box-shadow:
        0 22px 60px rgb(4 20 50 / 24%),
        0 4px 16px rgb(4 20 50 / 12%);
      transform-origin: bottom left;
      animation:
        nosca-panel-in
        320ms
        cubic-bezier(.16, 1, .3, 1);
    }

    .nosca-dialog.nosca-chat-panel::backdrop {
      display: none;
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }

    .nosca-dialog.nosca-chat-panel:not([open]) {
      display: none;
    }


    .nosca-dialog.nosca-chat-panel.is-closing {
      pointer-events: none;
      animation:
        nosca-panel-out
        180ms
        cubic-bezier(.4, 0, 1, 1)
        forwards;
    }

    .nosca-chat-panel .nosca-shell {
      grid-template-rows:
        auto
        minmax(0, 1fr)
        auto
        auto
        auto;
      background:
        linear-gradient(
          180deg,
          #F6F8FB 0%,
          #F3F6FA 100%
        );
    }

    .nosca-chat-panel .nosca-header {
      min-height: 72px;
      gap: 10px;
      padding: 11px 11px 10px 13px;
      border-bottom: 1px solid rgb(255 255 255 / 9%);
      color: #FFFFFF;
      background:
        linear-gradient(
          135deg,
          #071B50 0%,
          #092C76 58%,
          #0754B5 100%
        );
      box-shadow:
        0 1px 0 rgb(255 255 255 / 7%) inset;
    }

    .nosca-chat-panel .nosca-brand {
      width: 42px;
      height: 42px;
      flex-basis: 42px;
      border: 1px solid rgb(110 228 255 / 38%);
      border-radius: 50%;
      background:
        linear-gradient(
          145deg,
          #13C8E8,
          #0C78F0 55%,
          #224DE5
        );
      box-shadow:
        0 6px 16px rgb(0 13 52 / 24%),
        inset 0 1px 0 rgb(255 255 255 / 30%);
    }

    .nosca-chat-panel .nosca-heading h2 {
      color: #FFFFFF;
      font-size: 1rem;
      letter-spacing: -.01em;
    }

    .nosca-chat-panel .nosca-beta {
      min-height: 18px;
      padding: 1px 5px;
      border-color: rgb(123 225 255 / 30%);
      color: #BFF4FF;
      background: rgb(25 209 239 / 12%);
      font-size: .53rem;
    }

    .nosca-chat-panel .nosca-heading p {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 3px;
      color: rgb(231 243 255 / 76%);
      font-size: .67rem;
    }

    .nosca-presence-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      flex: 0 0 7px;
      border: 1px solid rgb(255 255 255 / 62%);
      border-radius: 50%;
      background: #39D98A;
      box-shadow: 0 0 0 2px rgb(57 217 138 / 13%);
    }

    .nosca-chat-panel .nosca-header-actions {
      gap: 1px;
    }

    .nosca-chat-panel .nosca-header-button {
      width: 33px;
      height: 33px;
      color: #DCEBFF;
      border-color: transparent;
      background: transparent;
    }

    .nosca-chat-panel .nosca-header-button:hover {
      color: #FFFFFF;
      border-color: rgb(255 255 255 / 8%);
      background: rgb(255 255 255 / 10%);
    }

    .nosca-chat-panel .nosca-header-button svg {
      width: 17px;
      height: 17px;
    }

    .nosca-chat-panel .nosca-minimize svg {
      stroke-width: 2.2;
    }

    .nosca-chat-panel .nosca-messages {
      padding: 17px 13px 20px;
      background:
        radial-gradient(
          circle at 88% 0%,
          rgb(39 127 239 / 6%),
          transparent 31%
        ),
        #F4F6F9;
      scrollbar-color: #C2CEDC transparent;
    }

    .nosca-chat-panel .nosca-welcome {
      max-width: 330px;
      margin-top: 24px;
    }

    .nosca-chat-panel .nosca-welcome-mark {
      width: 50px;
      height: 50px;
      margin-bottom: 12px;
      border-radius: 50%;
      color: #0A72D8;
      background: #FFFFFF;
      box-shadow:
        0 7px 20px rgb(12 74 151 / 10%);
    }

    .nosca-chat-panel .nosca-welcome h3 {
      font-size: 1.08rem;
    }

    .nosca-chat-panel .nosca-welcome > p:not(.nosca-grounding-note) {
      max-width: 325px;
      font-size: .75rem;
      line-height: 1.48;
    }

    .nosca-chat-panel .nosca-suggestions {
      gap: 6px;
      margin-top: 15px;
    }

    .nosca-chat-panel .nosca-suggestion {
      min-height: 31px;
      padding: 6px 9px;
      border-color: #D6E2EE;
      color: #175DAB;
      background: #FFFFFF;
      font-size: .62rem;
      box-shadow: none;
    }

    .nosca-chat-panel .nosca-grounding-note {
      margin-top: 15px;
      font-size: .58rem;
    }

    .nosca-chat-panel .nosca-message {
      gap: 7px;
      margin-bottom: 11px;
    }

    .nosca-chat-panel .nosca-message--assistant {
      padding-right: 38px;
    }

    .nosca-chat-panel .nosca-message--user {
      padding-left: 64px;
    }

    .nosca-chat-panel .nosca-message-avatar {
      width: 27px;
      height: 27px;
      flex-basis: 27px;
      margin-top: 6px;
      border-radius: 50%;
      box-shadow: none;
    }

    .nosca-chat-panel .nosca-message-avatar svg {
      width: 15px;
      height: 15px;
    }

    .nosca-chat-panel .nosca-message-body {
      width: min(100%, 315px);
    }

    .nosca-chat-panel .nosca-message--assistant .nosca-message-bubble {
      padding: 9px 11px 10px;
      border: 1px solid #E1E5EA;
      border-radius: 16px 16px 16px 5px;
      color: #263648;
      background: #FFFFFF;
      box-shadow: 0 2px 7px rgb(27 44 67 / 4%);
    }

    .nosca-chat-panel .nosca-message--user .nosca-message-bubble {
      max-width: min(285px, 100%);
      padding: 9px 12px 10px;
      border: 0;
      border-radius: 16px 16px 5px 16px;
      color: #FFFFFF;
      background:
        linear-gradient(
          135deg,
          #246CFF 0%,
          #1559E8 100%
        );
      box-shadow: none;
    }

    .nosca-chat-panel .nosca-message-label {
      margin-bottom: 3px;
      font-size: .52rem;
      letter-spacing: .045em;
    }

    .nosca-chat-panel .nosca-message-text,
    .nosca-chat-panel .nosca-answer-list {
      font-size: .77rem;
      line-height: 1.5;
    }

    .nosca-chat-panel .nosca-answer-text p {
      margin-bottom: 8px;
    }

    .nosca-chat-panel .nosca-loading-bubble {
      min-width: 215px;
    }

    .nosca-chat-panel .nosca-loading-line {
      font-size: .69rem;
    }

    .nosca-chat-panel .nosca-sources {
      margin-top: 7px;
      border-radius: 11px;
    }

    .nosca-chat-panel .nosca-source-card {
      min-height: 45px;
      padding: 7px 8px;
    }

    .nosca-chat-panel .nosca-feedback {
      margin-top: 7px;
      padding: 8px;
      border-radius: 10px;
    }

    .nosca-chat-panel .nosca-status {
      padding-inline: 13px;
      font-size: .6rem;
      background: #F4F6F9;
    }

    .nosca-chat-panel .nosca-composer {
      gap: 7px;
      margin: 8px 10px 0;
      padding: 6px 6px 6px 11px;
      border: 1px solid #D1D9E3;
      border-radius: 20px;
      background: #FFFFFF;
      box-shadow: none;
    }

    .nosca-chat-panel .nosca-composer:focus-within {
      border-color: #7FB2F4;
      box-shadow: 0 0 0 3px rgb(33 110 230 / 9%);
    }

    .nosca-chat-panel .nosca-composer textarea {
      min-height: 31px;
      padding: 6px 1px 4px;
      font-size: .78rem;
    }

    .nosca-chat-panel .nosca-send {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      background:
        linear-gradient(
          135deg,
          #2676FF,
          #0B55DA
        );
      box-shadow: none;
    }

    .nosca-chat-panel .nosca-footer {
      min-height: 30px;
      padding: 5px 12px 8px;
      color: #8492A2;
      background: #F4F6F9;
      font-size: .5rem;
    }

    /* Existing sidebar launcher doubles as the minimized chat state. */

    .nosca-launcher {
      transform-origin: center;
      transition:
        opacity 150ms ease,
        transform 190ms cubic-bezier(.2, .8, .2, 1),
        filter 190ms ease,
        box-shadow 180ms ease;
    }

    .nosca-launcher.is-chat-open {
      opacity: 0;
      transform:
        translateX(-12px)
        scale(.68);
      filter: blur(2px);
      pointer-events: none;
      visibility: hidden;
      transition:
        opacity 120ms ease,
        transform 180ms cubic-bezier(.2, .8, .2, 1),
        filter 160ms ease,
        visibility 0s linear 180ms;
    }

    .nosca-launcher.is-thinking {
      background-size: 220% 100%;
      animation:
        nosca-launcher-thinking-gradient 1.35s linear infinite,
        nosca-launcher-thinking-pulse 1.5s ease-in-out infinite;
    }

    .nosca-launcher.is-thinking svg {
      animation:
        nosca-launcher-bot-breathe 1.1s ease-in-out infinite;
    }

    .nosca-launcher.is-thinking::after {
      content: "";
      position: absolute;
      top: -5px;
      right: -4px;
      width: 18px;
      height: 18px;
      box-sizing: border-box;
      border: 2px solid rgb(255 255 255 / 42%);
      border-top-color: #FFFFFF;
      border-radius: 50%;
      background: rgb(22 108 238 / 92%);
      box-shadow:
        0 3px 10px rgb(0 43 121 / 28%);
      animation:
        nosca-launcher-spinner .72s linear infinite;
    }

    .nosca-launcher.has-unread::after {
      content: "✓";
      position: absolute;
      top: -6px;
      right: -5px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 21px;
      height: 21px;
      box-sizing: border-box;
      border: 2px solid #FFFFFF;
      border-radius: 50%;
      color: #FFFFFF;
      background:
        linear-gradient(
          135deg,
          #31D58A,
          #0EAB68
        );
      box-shadow:
        0 4px 12px
        rgb(10 123 77 / 30%);
      font-size: .7rem;
      font-weight: 900;
      line-height: 1;
      animation:
        nosca-ready-badge-pop
        420ms
        cubic-bezier(.2, 1.35, .32, 1);
    }

    @keyframes nosca-panel-in {
      0% {
        opacity: 0;
        transform:
          translate(-24px, 28px)
          scale(.58);
        filter: blur(7px);
      }
      62% {
        opacity: 1;
        transform:
          translate(2px, -2px)
          scale(1.018);
        filter: blur(0);
      }
      100% {
        opacity: 1;
        transform:
          translate(0, 0)
          scale(1);
        filter: blur(0);
      }
    }

    @keyframes nosca-panel-out {
      0% {
        opacity: 1;
        transform:
          translate(0, 0)
          scale(1);
        filter: blur(0);
      }
      100% {
        opacity: 0;
        transform:
          translate(-20px, 26px)
          scale(.62);
        filter: blur(5px);
      }
    }

    @keyframes nosca-launcher-thinking-gradient {
      from {
        background-position: 0% 50%;
      }
      to {
        background-position: 220% 50%;
      }
    }

    @keyframes nosca-launcher-thinking-pulse {
      0%, 100% {
        box-shadow:
          0 10px 24px rgb(0 72 173 / 34%),
          0 0 0 0 rgb(43 185 255 / 0%);
      }
      50% {
        box-shadow:
          0 12px 30px rgb(0 72 173 / 46%),
          0 0 0 7px rgb(43 185 255 / 12%);
      }
    }

    @keyframes nosca-launcher-bot-breathe {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.12);
      }
    }

    @keyframes nosca-launcher-spinner {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes nosca-ready-badge-pop {
      0% {
        opacity: 0;
        transform: scale(.25);
      }
      65% {
        opacity: 1;
        transform: scale(1.22);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (max-width: 900px) {
      .nosca-dialog.nosca-chat-panel {
        left: calc(var(--sidebar-width) + 12px);
        right: auto;
        bottom: 14px;
        width: min(
          400px,
          calc(
            100vw -
            var(--sidebar-width) -
            26px
          )
        );
        height:
          min(
            610px,
            calc(100dvh - 28px)
          );
      }

      #nexus-app:not(.tablet-expanded)
        .nosca-launcher {
        position: relative;
      }
    }

    @media (max-width: 620px) {
      .nosca-dialog.nosca-chat-panel {
        inset: auto 6px 6px 6px;
        width: auto;
        height: min(78dvh, 690px);
        border-radius: 18px;
        transform-origin: bottom center;
      }

      .nosca-chat-panel .nosca-header {
        min-height: 66px;
        padding: 9px 8px 8px 11px;
      }

      .nosca-chat-panel .nosca-brand {
        width: 38px;
        height: 38px;
        flex-basis: 38px;
      }

      .nosca-chat-panel .nosca-header-button {
        width: 32px;
        height: 32px;
      }

      .nosca-chat-panel .nosca-messages {
        padding: 13px 9px 17px;
      }

      .nosca-chat-panel .nosca-message--assistant {
        padding-right: 18px;
      }

      .nosca-chat-panel .nosca-message--user {
        padding-left: 42px;
      }

      .nosca-chat-panel .nosca-message-body {
        width: min(100%, 83vw);
      }

      .nosca-chat-panel .nosca-message--user .nosca-message-bubble {
        max-width: min(76vw, 310px);
      }

      .nosca-chat-panel .nosca-footer span:last-child {
        display: none;
      }

      .nosca-launcher {
        position: relative;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .nosca-dialog.nosca-chat-panel,
      .nosca-launcher,
      .nosca-launcher::after,
      .nosca-launcher svg {
        animation: none !important;
        transition: none !important;
      }
    }
</style>
