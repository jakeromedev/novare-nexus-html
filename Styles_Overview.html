<style>
/* Styles Overview — modularized from the former monolithic Styles.html. */
    /* =========================================================
       H1 OVERVIEW — PHASE 1
       Hero + page foundation only.
       Global sidebar and Component_NavHeader remain shell-owned.
    ========================================================== */
    .overview-page {
      --overview-navy: #071D62;
      --overview-blue: #0757EF;
      --overview-electric: #0789FF;
      --overview-cyan: #10D7D9;
      --overview-page-bg: #F4FAFE;
      width: 100%;
      min-width: 0;
      color: var(--overview-navy);
      background: var(--overview-page-bg);
    }

    .overview-hero {
      position: relative;
      isolation: isolate;
      display: flex;
      align-items: flex-start;
      width: 100%;
      min-height: 365px;
      padding: calc(var(--topbar-height) + 26px) 46px 38px;
      overflow: hidden;
      background: #DDEFFF;
    }

    /* Override the generic hero wash with the H1 reference composition. */
    .overview-hero.page-hero[data-page-hero]::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        linear-gradient(90deg,
          rgb(245 251 255 / 94%) 0%,
          rgb(245 251 255 / 78%) 24%,
          rgb(245 251 255 / 30%) 47%,
          rgb(5 58 153 / 5%) 70%,
          rgb(4 35 114 / 22%) 100%);
    }

    .overview-hero-media,
    .overview-hero-image,
    .overview-hero-fallback {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .overview-hero-media { z-index: -2; }

    .overview-hero-image {
      z-index: 0;
      display: block;
      object-fit: cover;
      object-position: center center;
      background: #DDEFFF;
    }

    .overview-hero-fallback {
      border: 0;
      border-radius: 0;
      background:
        radial-gradient(circle at 72% 40%, rgb(0 139 255 / 18%), transparent 24%),
        linear-gradient(120deg, #F2FAFF 0%, #D7EEFF 52%, #0A53C8 100%);
      color: transparent;
    }

    .overview-hero-copy {
      position: relative;
      z-index: 2;
      width: min(48%, 690px);
      min-width: 0;
    }

    .overview-eyebrow {
      margin: 0 0 7px;
      color: #06206D;
      font-size: .86rem;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: .28em;
      text-transform: uppercase;
    }

    .overview-title {
      margin: 0;
      max-width: 680px;
      color: #071B67;
      font-size: clamp(3.05rem, 4.25vw, 4.55rem);
      font-weight: 800;
      line-height: .92;
      letter-spacing: -.055em;
      text-wrap: balance;
      outline: none;
    }

    .overview-title-accent {
      color: #096BF0;
    }

    @supports (background-clip: text) {
      .overview-title-accent {
        background: linear-gradient(105deg, #034FE4 10%, #0B86FF 66%, #00BED5 100%);
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
      }
    }

    .overview-description {
      margin: 10px 0 0;
      color: #0A2D7F;
      font-size: clamp(.98rem, 1.25vw, 1.18rem);
      font-weight: 600;
      line-height: 1.35;
    }

    .overview-tagline {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 18px;
      color: #0860D9;
      font-size: .83rem;
      line-height: 1.25;
    }

    .overview-tagline-accent {
      display: block;
      width: 58px;
      height: 6px;
      flex: 0 0 auto;
      border-radius: 999px;
      background: linear-gradient(90deg, #0757EF 0%, #0CB9EC 60%, #13DFB3 100%);
      box-shadow: 0 2px 8px rgb(8 114 229 / 18%);
    }

    .overview-hero-message {
      position: absolute;
      z-index: 2;
      top: calc(var(--topbar-height) + 25px);
      right: 4.4%;
      width: 184px;
      color: #FFFFFF;
      text-shadow: 0 2px 12px rgb(0 34 102 / 30%);
    }

    .overview-values,
    .overview-opportunity {
      margin: 0;
      font-weight: 500;
      letter-spacing: .22em;
    }

    .overview-values {
      font-size: .83rem;
      line-height: 1.55;
    }

    .overview-message-accent {
      display: block;
      width: 62px;
      height: 5px;
      margin: 13px 0 14px;
      border-radius: 999px;
      background: linear-gradient(90deg, #D9FDFF 0%, #0DE6E9 75%, #00B6FB 100%);
      box-shadow: 0 0 14px rgb(0 225 240 / 55%);
    }

    .overview-opportunity {
      font-size: .72rem;
      line-height: 1.55;
    }

    /* Keep the shell header on top while making the H1 hero start behind it. */
    #nexus-app.hero-route .route-page[data-page-route="overview"] .overview-hero {
      padding-top: calc(var(--topbar-height) + 26px);
    }

    @media (min-width: 1200px) and (max-width: 1399px) {
      .overview-hero {
        min-height: 350px;
        padding-inline: 36px;
      }
      .overview-hero-copy { width: min(50%, 620px); }
      .overview-title { font-size: clamp(2.85rem, 4.35vw, 3.8rem); }
      .overview-hero-message { right: 3%; width: 164px; }
    }

    @media (max-width: 1199px) {
      .overview-hero {
        min-height: 330px;
        padding: calc(var(--topbar-height) + 22px) 28px 30px;
      }
      .overview-hero-copy { width: 58%; }
      .overview-title { font-size: clamp(2.65rem, 5.4vw, 3.7rem); }
      .overview-description { font-size: .94rem; }
      .overview-hero-message { display: none; }
      .overview-hero.page-hero[data-page-hero]::after {
        background: linear-gradient(90deg,
          rgb(245 251 255 / 96%) 0%,
          rgb(245 251 255 / 84%) 34%,
          rgb(245 251 255 / 22%) 68%,
          transparent 100%);
      }
    }

    @media (max-width: 767px) {
      .overview-page { padding: 0 10px 20px; }
      .overview-hero {
        min-height: 500px;
        margin-inline: -10px;
        padding: 28px 20px 0;
        align-items: flex-start;
      }
      .overview-hero-copy {
        width: 100%;
        max-width: 560px;
      }
      .overview-eyebrow {
        margin-bottom: 8px;
        font-size: .7rem;
        letter-spacing: .2em;
      }
      .overview-title {
        max-width: 430px;
        font-size: clamp(2.4rem, 11.5vw, 3.35rem);
        line-height: .95;
      }
      .overview-description {
        max-width: 360px;
        margin-top: 12px;
        font-size: .84rem;
      }
      .overview-description br { display: none; }
      .overview-tagline {
        gap: 10px;
        margin-top: 14px;
        font-size: .72rem;
      }
      .overview-tagline-accent { width: 44px; height: 5px; }
      .overview-hero-image {
        object-position: 64% center;
      }
      .overview-hero.page-hero[data-page-hero]::after {
        background:
          linear-gradient(180deg,
            rgb(245 251 255 / 96%) 0%,
            rgb(245 251 255 / 88%) 32%,
            rgb(245 251 255 / 36%) 58%,
            transparent 78%);
      }
    }

    @media (max-width: 440px) {
      .overview-hero { min-height: 470px; }
      .overview-title { font-size: clamp(2.15rem, 11vw, 2.8rem); }
      .overview-tagline strong { max-width: 205px; }
    }


    /* =========================================================
       H1 OVERVIEW — PHASE 2
       About Novare + About SC&A + Directories
    ========================================================== */
    .overview-reference-grid {
      position: relative;
      z-index: 4;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin: -28px 20px 0;
    }

    .overview-reference-card {
      display: flex;
      min-width: 0;
      min-height: 298px;
      flex-direction: column;
      overflow: hidden;
      padding: 12px;
      border: 1px solid #D6E9F7;
      border-radius: 14px;
      background: rgb(255 255 255 / 96%);
      box-shadow: 0 6px 18px rgb(2 50 113 / 5%);
      backdrop-filter: blur(9px);
      -webkit-backdrop-filter: blur(9px);
    }

    .overview-reference-card-header {
      display: grid;
      grid-template-columns: 136px minmax(0, 1fr) 40px;
      align-items: start;
      gap: 12px;
      min-height: 82px;
      margin-bottom: 7px;
    }

    .overview-reference-thumbnail {
      position: relative;
      overflow: hidden;
      width: 136px;
      height: 82px;
      border-radius: 9px;
      background: #EAF6FD;
    }

    .overview-reference-image,
    .overview-reference-image-fallback {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .overview-reference-image {
      display: block;
      object-fit: cover;
      object-position: center;
    }

    .overview-reference-image-fallback {
      border: 0;
      border-radius: 0;
      background:
        linear-gradient(135deg, rgb(8 100 235 / 10%), rgb(9 210 221 / 10%)),
        #EEF8FE;
      color: #5E789A;
      font-size: .72rem;
      font-weight: 700;
    }

    .overview-reference-heading-copy {
      min-width: 0;
      padding-top: 7px;
    }

    .overview-reference-heading-copy h2 {
      margin: 0;
      color: #0730B0;
      font-size: 1.03rem;
      font-weight: 800;
      line-height: 1.12;
      letter-spacing: -.02em;
    }

    .overview-reference-heading-copy p {
      margin: 4px 0 0;
      color: #4E6A93;
      font-size: .72rem;
      font-weight: 500;
      line-height: 1.28;
    }

    .overview-card-arrow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      margin-top: 1px;
      padding: 0;
      border: 1px solid #D6E9F7;
      border-radius: 999px;
      color: #096FF0;
      background: #FFFFFF;
      box-shadow: 0 4px 12px rgb(5 81 184 / 9%);
      cursor: pointer;
      transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
    }

    .overview-card-arrow:hover {
      transform: translateX(2px);
      border-color: #A9D1F2;
      box-shadow: 0 6px 16px rgb(5 81 184 / 14%);
    }

    .overview-reference-links {
      display: grid;
      overflow: hidden;
      border: 1px solid #E6F0F7;
      border-radius: 8px;
      background: #FFFFFF;
    }

    .overview-reference-row {
      display: grid;
      grid-template-columns: 26px minmax(0, 1fr) 18px;
      align-items: center;
      gap: 7px;
      width: 100%;
      min-height: 30px;
      padding: 4px 9px;
      border: 0;
      border-bottom: 1px solid #EDF4F9;
      color: #1640B7;
      background: #FFFFFF;
      text-align: left;
      font: inherit;
      font-size: .71rem;
      font-weight: 600;
      line-height: 1.2;
      cursor: pointer;
      transition: background .14s ease, color .14s ease;
    }

    .overview-reference-row:last-child { border-bottom: 0; }

    .overview-reference-row:hover {
      color: #0757EF;
      background: #F5FAFE;
    }

    .overview-reference-row-icon,
    .overview-reference-featured-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 23px;
      height: 23px;
      border-radius: 5px;
      color: #FFFFFF;
      background: linear-gradient(150deg, #0B9EFF 0%, #0757EF 100%);
      box-shadow: 0 2px 6px rgb(7 87 239 / 18%);
    }

    .overview-reference-chevron {
      justify-self: end;
      color: #0B6BF0;
      font-size: 1.25rem;
      font-weight: 600;
      line-height: 1;
    }

    .overview-reference-featured-link {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) 18px;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-height: 37px;
      margin-top: auto;
      padding: 6px 10px;
      border: 0;
      border-radius: 8px;
      color: #123FC0;
      background: linear-gradient(90deg, #E9F4FD 0%, #F5FAFE 100%);
      text-align: left;
      font: inherit;
      font-size: .72rem;
      cursor: pointer;
      transition: background .14s ease, transform .14s ease;
    }

    .overview-reference-featured-link:hover {
      background: linear-gradient(90deg, #DDEFFC 0%, #EEF8FE 100%);
      transform: translateY(-1px);
    }

    .overview-reference-featured-icon {
      width: 27px;
      height: 27px;
      border-radius: 6px;
      background: linear-gradient(150deg, #2C67FF 0%, #113BC4 100%);
    }

    .overview-directory-card .overview-reference-links {
      margin-top: 4px;
    }

    .overview-directory-row {
      min-height: 44px;
      font-size: .75rem;
    }

    .overview-status {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 90;
      max-width: min(420px, calc(100vw - 44px));
      margin: 0;
      padding: 10px 14px;
      border: 1px solid #CFE4F5;
      border-radius: 12px;
      color: #0A327F;
      background: rgb(255 255 255 / 94%);
      box-shadow: 0 12px 28px rgb(0 43 110 / 16%);
      font-size: .78rem;
      font-weight: 600;
      line-height: 1.35;
      opacity: 0;
      visibility: hidden;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease, visibility .18s ease;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .overview-status.is-visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    @media (max-width: 1199px) {
      .overview-reference-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        margin: 16px 18px 0;
      }

      .overview-directory-card {
        grid-column: 1 / -1;
      }

      .overview-directory-card .overview-reference-card-header {
        grid-template-columns: 136px minmax(0, 1fr) 40px;
      }
    }

    @media (max-width: 767px) {
      .overview-reference-grid {
        grid-template-columns: minmax(0, 1fr);
        gap: 12px;
        margin: 14px 0 0;
      }

      .overview-directory-card { grid-column: auto; }

      .overview-reference-card {
        min-height: 0;
        padding: 11px;
        border-radius: 13px;
      }

      .overview-reference-card-header {
        grid-template-columns: 108px minmax(0, 1fr) 38px;
        gap: 10px;
        min-height: 72px;
      }

      .overview-reference-thumbnail {
        width: 108px;
        height: 68px;
      }

      .overview-reference-heading-copy {
        padding-top: 3px;
      }

      .overview-reference-heading-copy h2 {
        font-size: .94rem;
      }

      .overview-reference-heading-copy p {
        font-size: .68rem;
      }

      .overview-card-arrow {
        width: 38px;
        height: 38px;
      }

      .overview-reference-row {
        min-height: 36px;
        font-size: .73rem;
      }

      .overview-directory-row {
        min-height: 42px;
      }

      .overview-reference-featured-link {
        min-height: 40px;
        margin-top: 9px;
        font-size: .73rem;
      }
    }

    @media (max-width: 440px) {
      .overview-reference-card-header {
        grid-template-columns: 88px minmax(0, 1fr) 34px;
        gap: 8px;
      }

      .overview-reference-thumbnail {
        width: 88px;
        height: 62px;
      }

      .overview-card-arrow {
        width: 34px;
        height: 34px;
      }

      .overview-reference-heading-copy p {
        display: -webkit-box;
        overflow: hidden;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }

      .overview-status {
        right: 12px;
        bottom: 12px;
        max-width: calc(100vw - 24px);
      }
    }


    /* =========================================================
       H1 OVERVIEW — PHASE 3
       Novare Solutions Groups
    ========================================================== */
    .overview-solution-groups {
      position: relative;
      z-index: 2;
      margin: 18px 20px 34px;
    }

    .overview-section-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin: 0 4px 10px;
    }

    .overview-section-heading {
      min-width: 0;
    }

    .overview-section-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .overview-section-accent {
      display: inline-block;
      width: 44px;
      height: 5px;
      flex: 0 0 auto;
      border-radius: 999px;
      background: linear-gradient(90deg, #0757EF 0%, #02D7D8 100%);
      box-shadow: 0 2px 6px rgb(7 87 239 / 14%);
    }

    .overview-section-title-row h2 {
      margin: 0;
      color: #071F63;
      font-size: 1.24rem;
      font-weight: 850;
      line-height: 1.12;
      letter-spacing: -.025em;
    }

    .overview-section-heading > p {
      margin: 3px 0 0 54px;
      color: #5B7291;
      font-size: .76rem;
      font-weight: 500;
      line-height: 1.3;
    }

    .overview-view-all {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      flex: 0 0 auto;
      padding: 7px 4px;
      border: 0;
      color: #0757EF;
      background: transparent;
      font: inherit;
      font-size: .76rem;
      font-weight: 750;
      cursor: pointer;
      transition: transform .16s ease, color .16s ease;
    }

    .overview-view-all:hover {
      color: #0049D8;
      transform: translateX(2px);
    }

    .overview-solution-group-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .overview-solution-card {
      --group-accent: #08C9D4;
      --group-accent-dark: #008FAB;
      overflow: hidden;
      min-width: 0;
      border: 1px solid #D4E8F7;
      border-radius: 13px;
      background: #FFFFFF;
      box-shadow: 0 7px 20px rgb(1 45 108 / 5%);
    }

    .overview-solution-card.is-intelligence {
      --group-accent: #3B63FF;
      --group-accent-dark: #1936C9;
    }

    .overview-solution-card.is-modernization {
      --group-accent: #FF6B27;
      --group-accent-dark: #DB4415;
      border-color: #F6D7C4;
    }

    .overview-solution-banner {
      position: relative;
      overflow: hidden;
      min-height: 208px;
      isolation: isolate;
      background:
        linear-gradient(135deg, color-mix(in srgb, var(--group-accent) 65%, white), var(--group-accent-dark));
    }

    .overview-solution-image,
    .overview-solution-image-fallback,
    .overview-solution-image-shade {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .overview-solution-image {
      z-index: 0;
      display: block;
      object-fit: cover;
      object-position: center;
    }

    .overview-solution-image-fallback {
      z-index: 0;
      border: 0;
      border-radius: 0;
      color: rgb(255 255 255 / 82%);
      background:
        linear-gradient(125deg, color-mix(in srgb, var(--group-accent-dark) 88%, black), color-mix(in srgb, var(--group-accent) 72%, white));
      font-size: .78rem;
      font-weight: 750;
    }

    .overview-solution-image-shade {
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(
          90deg,
          rgb(1 29 89 / 78%) 0%,
          rgb(1 32 95 / 60%) 32%,
          rgb(1 32 95 / 24%) 60%,
          transparent 84%
        );
    }

    .is-experience .overview-solution-image-shade {
      background:
        linear-gradient(
          90deg,
          rgb(0 92 116 / 76%) 0%,
          rgb(0 112 132 / 55%) 32%,
          rgb(0 100 130 / 20%) 60%,
          transparent 84%
        );
    }

    .is-modernization .overview-solution-image-shade {
      background:
        linear-gradient(
          90deg,
          rgb(126 42 3 / 78%) 0%,
          rgb(175 56 4 / 58%) 32%,
          rgb(154 47 1 / 22%) 60%,
          transparent 84%
        );
    }

    .overview-solution-banner-copy {
      position: relative;
      z-index: 2;
      width: min(72%, 330px);
      padding: 17px 18px 15px;
      color: #FFFFFF;
      text-shadow: 0 2px 8px rgb(0 21 68 / 25%);
    }

    .overview-solution-banner-copy h3 {
      margin: 0;
      font-size: 1.34rem;
      font-weight: 850;
      line-height: 1.02;
      letter-spacing: -.025em;
    }

    .overview-solution-label {
      margin: 2px 0 7px;
      font-size: .92rem;
      font-weight: 650;
      line-height: 1.1;
    }

    .overview-solution-description {
      margin: 0;
      color: rgb(255 255 255 / 92%);
      font-size: .72rem;
      font-weight: 520;
      line-height: 1.28;
    }

    .overview-video-button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 27px;
      margin-top: 10px;
      padding: 4px 10px 4px 6px;
      border: 1px solid rgb(255 255 255 / 62%);
      border-radius: 999px;
      color: var(--group-accent-dark);
      background: rgb(255 255 255 / 94%);
      box-shadow: 0 3px 9px rgb(0 20 65 / 12%);
      font: inherit;
      font-size: .63rem;
      font-weight: 760;
      cursor: pointer;
      transition: transform .14s ease, background .14s ease;
    }

    .overview-video-button:hover {
      transform: translateY(-1px);
      background: #FFFFFF;
    }

    .overview-play-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      color: #FFFFFF;
      background: var(--group-accent);
    }

    .overview-solution-arrow {
      position: absolute;
      z-index: 3;
      top: 17px;
      right: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 43px;
      height: 43px;
      padding: 0;
      border: 1px solid rgb(255 255 255 / 70%);
      border-radius: 999px;
      color: var(--group-accent-dark);
      background: rgb(255 255 255 / 94%);
      box-shadow: 0 6px 18px rgb(0 22 77 / 12%);
      cursor: pointer;
      transition: transform .16s ease, background .16s ease;
    }

    .overview-solution-arrow:hover {
      transform: translateX(2px);
      background: #FFFFFF;
    }

    .overview-capability-grid {
      display: grid;
      gap: 8px;
      padding: 9px;
      background:
        linear-gradient(
          180deg,
          color-mix(in srgb, var(--group-accent) 10%, white),
          #FFFFFF 70%
        );
    }

    .overview-capability-grid-2 {
