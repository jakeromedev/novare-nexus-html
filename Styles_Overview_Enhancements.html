<style>
/* Styles Overview Enhancements — modularized from the former monolithic Styles.html. */
    /* ================================================================
       OVERVIEW VISUAL REFRESH — IMAGE-LED REFERENCE CARDS
       Makes the About / Directories artwork the focal point while keeping
       all existing managed-link actions and page content intact.
       ================================================================ */
    .overview-reference-grid {
      gap: 16px;
      margin: -24px 20px 0;
    }

    .overview-reference-card {
      min-height: 390px;
      padding: 0;
      border: 1px solid #CFE3F3;
      border-radius: 18px;
      background: linear-gradient(180deg, #FFFFFF 0%, #FBFDFF 100%);
      box-shadow:
        0 14px 34px rgb(7 49 115 / 8%),
        0 2px 7px rgb(7 49 115 / 4%);
      transition:
        transform .22s ease,
        box-shadow .22s ease,
        border-color .22s ease;
    }

    .overview-reference-card:hover {
      transform: translateY(-3px);
      border-color: #AFD4F1;
      box-shadow:
        0 18px 42px rgb(7 49 115 / 12%),
        0 3px 9px rgb(7 49 115 / 5%);
    }

    .overview-reference-card-header {
      position: relative;
      display: block;
      min-height: 178px;
      margin: 0;
      overflow: hidden;
      border-radius: 17px 17px 0 0;
      isolation: isolate;
      background: #EAF5FD;
    }

    .overview-reference-card-header::before {
      content: "";
      position: absolute;
      z-index: 2;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(
          90deg,
          rgb(248 252 255 / 98%) 0%,
          rgb(248 252 255 / 92%) 24%,
          rgb(248 252 255 / 70%) 42%,
          rgb(248 252 255 / 18%) 70%,
          transparent 100%
        ),
        linear-gradient(
          0deg,
          rgb(255 255 255 / 62%) 0%,
          transparent 43%
        );
    }

    .overview-reference-card-header::after {
      content: "";
      position: absolute;
      z-index: 2;
      right: -8%;
      bottom: -42%;
      width: 72%;
      height: 90%;
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(circle, rgb(49 150 255 / 17%) 0%, transparent 68%);
    }

    .overview-reference-thumbnail {
      position: absolute;
      z-index: 0;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 0;
      background: #EAF5FD;
    }

    .overview-reference-image,
    .overview-reference-image-fallback {
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .overview-reference-image {
      object-fit: cover;
      object-position: center;
      transform: scale(1.002);
      transition: transform .55s cubic-bezier(.2, .7, .2, 1), filter .4s ease;
    }

    .overview-reference-card:hover .overview-reference-image {
      transform: scale(1.035);
      filter: saturate(1.04) contrast(1.02);
    }

    .overview-reference-image-fallback {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 20px;
      color: #6A82A2;
      background:
        linear-gradient(115deg, #EFF8FE 0%, #DCEFFD 48%, #E8F7FC 100%);
      font-size: .75rem;
      font-weight: 700;
    }

    .overview-reference-heading-copy {
      position: absolute;
      z-index: 3;
      left: 22px;
      bottom: 22px;
      width: min(64%, 300px);
      min-width: 0;
      padding: 0;
    }

    .overview-reference-heading-copy h2 {
      margin: 0;
      color: #071F63;
      font-size: clamp(1.36rem, 1.65vw, 1.72rem);
      font-weight: 860;
      line-height: 1.02;
      letter-spacing: -.035em;
      text-shadow: 0 1px 0 rgb(255 255 255 / 75%);
    }

    .overview-reference-card:not(.overview-directory-card)
      .overview-reference-heading-copy h2::before,
    .overview-directory-card .overview-reference-heading-copy h2::before {
      display: block;
      margin-bottom: 6px;
      color: #174D8C;
      font-size: .60rem;
      font-weight: 850;
      line-height: 1;
      letter-spacing: .105em;
      text-transform: uppercase;
    }

    .overview-reference-card:not(.overview-directory-card)
      .overview-reference-heading-copy h2::before {
      content: "ABOUT";
    }

    .overview-directory-card .overview-reference-heading-copy h2::before {
      content: "DIRECTORIES";
    }

    .overview-reference-heading-copy p {
      max-width: 280px;
      margin: 7px 0 0;
      color: #315681;
      font-size: .72rem;
      font-weight: 540;
      line-height: 1.34;
      text-wrap: balance;
    }

    .overview-card-arrow {
      position: absolute;
      z-index: 4;
      right: 18px;
      bottom: 19px;
      width: 44px;
      height: 44px;
      margin: 0;
      border-color: rgb(159 205 242 / 76%);
      color: #0757EF;
      background: rgb(255 255 255 / 94%);
      box-shadow:
        0 8px 20px rgb(6 76 171 / 15%),
        inset 0 1px 0 rgb(255 255 255 / 70%);
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
    }

    .overview-card-arrow:hover {
      transform: translateX(3px) scale(1.03);
      border-color: #7CB9EA;
      box-shadow: 0 10px 24px rgb(6 76 171 / 20%);
    }

    .overview-reference-links,
    .overview-directory-card .overview-reference-links {
      margin: 12px 14px 14px;
      overflow: hidden;
      border: 1px solid #E1EDF6;
      border-radius: 11px;
      background: #FFFFFF;
      box-shadow: 0 2px 8px rgb(9 57 123 / 3%);
    }

    .overview-reference-row {
      min-height: 36px;
      padding: 6px 10px;
      border-bottom-color: #EBF2F8;
      font-size: .72rem;
      transition:
        color .15s ease,
        background .15s ease,
        padding-left .15s ease;
    }

    .overview-reference-row:hover {
      padding-left: 12px;
      color: #0757EF;
      background: linear-gradient(90deg, #F4FAFF 0%, #FAFDFF 100%);
    }

    .overview-reference-row.is-highlighted {
      position: relative;
      background: linear-gradient(90deg, #EBF5FF 0%, #F8FBFF 100%);
    }

    .overview-reference-row.is-highlighted::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 3px;
      background: linear-gradient(180deg, #0959F2, #0CC9DD);
    }

    .overview-reference-row-icon {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      box-shadow: 0 3px 8px rgb(7 87 239 / 15%);
    }

    .overview-directory-row {
      min-height: 46px;
      font-size: .74rem;
    }

    /* Stronger visual bridge into the solution-group cards. */
    .overview-solution-groups {
      margin-top: 22px;
    }

    .overview-section-header-enhanced {
      align-items: flex-start;
      margin: 0 4px 14px;
    }

    .overview-section-kicker-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .overview-section-kicker {
      color: #31537E;
      font-size: .62rem;
      font-weight: 850;
      line-height: 1;
      letter-spacing: .15em;
    }

    .overview-section-header-enhanced .overview-section-accent {
      width: 42px;
      height: 4px;
    }

    .overview-section-header-enhanced #overview-solution-groups-title {
      margin: 0 0 0 52px;
      color: #071F63;
      font-size: clamp(1.42rem, 1.9vw, 1.82rem);
      font-weight: 880;
      line-height: 1.04;
      letter-spacing: -.035em;
    }

    .overview-section-header-enhanced .overview-section-heading > p {
      margin: 6px 0 0 52px;
      color: #536E91;
      font-size: .76rem;
    }

    .overview-solution-card {
      border-radius: 15px;
      box-shadow: 0 10px 25px rgb(3 49 113 / 7%);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .overview-solution-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 34px rgb(3 49 113 / 10%);
    }

    @media (max-width: 1199px) {
      .overview-reference-grid {
        gap: 15px;
        margin: 18px 18px 0;
      }

      .overview-reference-card {
        min-height: 380px;
      }

      .overview-directory-card .overview-reference-card-header,
      .overview-reference-card-header {
        min-height: 175px;
      }

      .overview-directory-card {
        grid-column: 1 / -1;
      }

      .overview-directory-card .overview-reference-heading-copy {
        width: min(48%, 390px);
      }
    }

    @media (max-width: 767px) {
      .overview-reference-grid {
        gap: 14px;
        margin: 14px 0 0;
      }

      .overview-reference-card {
        min-height: 0;
        padding: 0;
        border-radius: 16px;
      }

      .overview-reference-card-header,
      .overview-directory-card .overview-reference-card-header {
        display: block;
        min-height: 186px;
        margin: 0;
        border-radius: 15px 15px 0 0;
      }

      .overview-reference-thumbnail {
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .overview-reference-heading-copy,
      .overview-directory-card .overview-reference-heading-copy {
        left: 18px;
        bottom: 18px;
        width: min(68%, 320px);
        padding: 0;
      }

      .overview-reference-heading-copy h2 {
        font-size: 1.38rem;
      }

      .overview-reference-heading-copy p {
        display: block;
        margin-top: 6px;
        font-size: .70rem;
        -webkit-line-clamp: unset;
      }

      .overview-card-arrow {
        right: 16px;
        bottom: 17px;
        width: 40px;
        height: 40px;
      }

      .overview-reference-links,
      .overview-directory-card .overview-reference-links {
        margin: 10px 11px 12px;
      }

      .overview-reference-row {
        min-height: 40px;
        font-size: .73rem;
      }

      .overview-directory-row {
        min-height: 44px;
      }

      .overview-section-header-enhanced {
        margin: 0 2px 12px;
      }

      .overview-section-kicker-row {
        gap: 8px;
      }

      .overview-section-kicker {
        font-size: .58rem;
        letter-spacing: .12em;
      }

      .overview-section-header-enhanced .overview-section-accent {
        width: 34px;
      }

      .overview-section-header-enhanced #overview-solution-groups-title,
      .overview-section-header-enhanced .overview-section-heading > p {
        margin-left: 42px;
      }

      .overview-section-header-enhanced #overview-solution-groups-title {
        font-size: 1.35rem;
      }

      .overview-section-header-enhanced .overview-section-heading > p {
        font-size: .70rem;
      }
    }

    @media (max-width: 440px) {
      .overview-reference-card-header,
      .overview-directory-card .overview-reference-card-header {
        min-height: 176px;
      }

      .overview-reference-card-header::before {
        background:
          linear-gradient(
            90deg,
            rgb(248 252 255 / 97%) 0%,
            rgb(248 252 255 / 86%) 36%,
            rgb(248 252 255 / 30%) 70%,
            transparent 100%
          ),
          linear-gradient(0deg, rgb(255 255 255 / 62%) 0%, transparent 45%);
      }

      .overview-reference-heading-copy,
      .overview-directory-card .overview-reference-heading-copy {
        left: 15px;
        bottom: 15px;
        width: 67%;
      }

      .overview-reference-heading-copy h2 {
        font-size: 1.24rem;
      }

      .overview-reference-heading-copy p {
        font-size: .66rem;
        line-height: 1.3;
      }

      .overview-card-arrow {
        right: 13px;
        bottom: 14px;
        width: 38px;
        height: 38px;
      }

      .overview-section-header-enhanced #overview-solution-groups-title {
        font-size: 1.24rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .overview-reference-card,
      .overview-reference-image,
      .overview-card-arrow,
      .overview-reference-row,
      .overview-solution-card {
        transition: none !important;
      }

      .overview-reference-card:hover,
      .overview-reference-card:hover .overview-reference-image,
      .overview-solution-card:hover {
        transform: none !important;
      }
    }


    /* =========================================================
       H1 OVERVIEW — SOLUTION GROUP SHOWCASE V2
       Approved visual:
       - stronger editorial section heading
       - premium 3-column solution-group cards on desktop
       - one capability per row
       - equalized capability regions across all three groups
       - larger imagery and video CTA
       - subtle card/image interaction
       ========================================================= */

    .overview-solution-groups {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      margin: 24px 20px 38px;
      padding: 26px 14px 20px;
      border-radius: 24px;
      background:
        radial-gradient(circle at 84% 0%, rgb(82 176 255 / 10%), transparent 30%),
        linear-gradient(180deg, rgb(248 252 255 / 92%), rgb(247 252 255 / 68%) 55%, transparent 100%);
    }

    .overview-solution-groups::before {
      content: "";
      position: absolute;
      z-index: -1;
      top: -96px;
      right: -4%;
      width: 66%;
      height: 245px;
      pointer-events: none;
      border-radius: 50%;
      background:
        radial-gradient(ellipse at center, rgb(74 162 255 / 14%) 0 30%, transparent 68%),
        linear-gradient(155deg, transparent 28%, rgb(64 151 255 / 7%) 48%, transparent 70%);
      transform: rotate(-5deg);
      filter: blur(.2px);
    }

    .overview-section-header-showcase {
      display: block;
      margin: 0 12px 26px;
    }

    .overview-section-header-showcase .overview-section-heading {
      max-width: 850px;
    }

    .overview-section-header-showcase .overview-section-kicker-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 10px;
    }

    .overview-section-header-showcase .overview-section-accent {
      width: 54px;
      height: 5px;
      border-radius: 999px;
      background: linear-gradient(90deg, #0757EF 0%, #00D4D8 100%);
      box-shadow: 0 3px 9px rgb(7 87 239 / 14%);
    }

    .overview-section-header-showcase .overview-section-kicker {
      margin: 0;
      color: #36547D;
      font-size: .72rem;
      font-weight: 900;
      line-height: 1;
      letter-spacing: .20em;
    }

    .overview-section-header-showcase #overview-solution-groups-title {
      margin: 0;
      color: #071F63;
      font-size: clamp(2rem, 2.55vw, 2.85rem);
      font-weight: 900;
      line-height: 1.02;
      letter-spacing: -.045em;
    }

    .overview-section-header-showcase .overview-section-heading > p {
      max-width: 720px;
      margin: 9px 0 0;
      color: #5A7293;
      font-size: clamp(.82rem, 1.05vw, 1rem);
      font-weight: 520;
      line-height: 1.42;
    }

    .overview-solution-group-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-items: stretch;
      gap: 20px;
    }

    .overview-solution-card,
    .overview-solution-card.is-modernization {
      grid-column: auto;
      display: flex;
      min-width: 0;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--group-accent) 24%, #D7E8F5);
      border-radius: 20px;
      background: #FFFFFF;
      box-shadow:
        0 16px 38px rgb(3 49 113 / 9%),
        inset 0 1px 0 rgb(255 255 255 / 90%);
      transition:
        transform .24s cubic-bezier(.2, .8, .2, 1),
        box-shadow .24s ease,
        border-color .24s ease;
    }

    .overview-solution-card:hover {
      transform: translateY(-4px);
      border-color: color-mix(in srgb, var(--group-accent) 48%, #D7E8F5);
      box-shadow:
        0 22px 48px rgb(3 49 113 / 13%),
        0 0 0 1px color-mix(in srgb, var(--group-accent) 10%, transparent);
    }

    .overview-solution-banner,
    .overview-solution-card.is-modernization .overview-solution-banner {
      position: relative;
      min-height: 300px;
      overflow: hidden;
      isolation: isolate;
    }

    .overview-solution-image {
      transition: transform .55s cubic-bezier(.2, .75, .2, 1), filter .4s ease;
    }

    .overview-solution-card:hover .overview-solution-image {
      transform: scale(1.025);
      filter: saturate(1.04) contrast(1.02);
    }

    .overview-solution-image-shade,
    .is-experience .overview-solution-image-shade,
    .is-modernization .overview-solution-image-shade {
      background:
        linear-gradient(
          90deg,
          color-mix(in srgb, var(--group-accent-dark) 76%, #071B4F) 0%,
          color-mix(in srgb, var(--group-accent-dark) 54%, #071B4F) 31%,
          rgb(4 27 78 / 28%) 59%,
          transparent 84%
        );
    }

    .overview-solution-banner-copy {
      position: absolute;
      z-index: 2;
      inset: 0 auto 0 0;
      display: flex;
      width: min(74%, 390px);
      height: 100%;
      box-sizing: border-box;
      flex-direction: column;
      align-items: flex-start;
      padding: 28px 28px 26px;
      color: #FFFFFF;
      text-shadow: 0 2px 9px rgb(0 20 65 / 28%);
    }

    .overview-solution-banner-copy::before {
      display: block;
      margin-bottom: 13px;
      color: rgb(255 255 255 / 90%);
      font-size: .66rem;
      font-weight: 900;
      line-height: 1;
      letter-spacing: .20em;
    }

    .is-experience .overview-solution-banner-copy::before {
      content: "EXPERIENCE";
    }

    .is-intelligence .overview-solution-banner-copy::before {
      content: "INTELLIGENCE";
    }

    .is-modernization .overview-solution-banner-copy::before {
      content: "MODERNIZATION";
    }

    .overview-solution-banner-copy h3 {
      margin: 0;
      max-width: 100%;
      font-size: clamp(1.45rem, 1.65vw, 1.9rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -.035em;
    }

    .overview-solution-label {
      margin: 4px 0 13px;
      font-size: clamp(1.05rem, 1.18vw, 1.34rem);
      font-weight: 780;
      line-height: 1.05;
    }

    .overview-solution-description {
      max-width: 310px;
      margin: 0;
      color: rgb(255 255 255 / 94%);
      font-size: .84rem;
      font-weight: 540;
      line-height: 1.42;
    }

    .overview-solution-description br {
      display: none;
    }

    .overview-video-button {
      min-height: 42px;
      margin-top: auto;
      padding: 6px 16px 6px 8px;
      gap: 9px;
      border: 1px solid rgb(255 255 255 / 78%);
      border-radius: 999px;
      color: var(--group-accent-dark);
      background: rgb(255 255 255 / 96%);
      box-shadow: 0 8px 22px rgb(0 20 65 / 16%);
      font-size: .76rem;
      font-weight: 850;
      text-shadow: none;
      transition:
        transform .18s ease,
        box-shadow .18s ease,
        background-color .18s ease;
    }

    .overview-video-button:hover {
      transform: translateY(-2px);
      background: #FFFFFF;
      box-shadow: 0 11px 26px rgb(0 20 65 / 20%);
    }

    .overview-play-icon {
      width: 28px;
      height: 28px;
      flex: 0 0 auto;
      box-shadow: 0 4px 12px color-mix(in srgb, var(--group-accent) 28%, transparent);
    }

    /*
     * One capability per row.
     * Keep the total capability area equal across groups so Experience,
     * Intelligence, and Modernization align despite having 2 / 2 / 3 items.
     */
    .overview-capability-grid,
    .overview-capability-grid-2,
    .overview-capability-grid-3,
    .overview-solution-card.is-modernization .overview-capability-grid-3 {
      display: grid;
      grid-template-columns: minmax(0, 1fr) !important;
      gap: 10px;
      min-height: 294px;
      padding: 16px;
      background:
        linear-gradient(
          180deg,
          color-mix(in srgb, var(--group-accent) 7%, white),
          #FFFFFF 78%
        );
    }

    .overview-capability-grid-2 {
      grid-template-rows: repeat(2, minmax(0, 1fr));
    }

    .overview-capability-grid-3,
    .overview-solution-card.is-modernization .overview-capability-grid-3 {
      grid-template-rows: repeat(3, minmax(0, 1fr));
    }

    .overview-capability-card,
    .overview-capability-grid-3 .overview-capability-card {
      display: grid;
      grid-template-columns: 58px minmax(0, 1fr) 38px;
      align-items: center;
      gap: 14px;
      min-width: 0;
      min-height: 0;
      padding: 12px 14px;
      border: 1px solid color-mix(in srgb, var(--group-accent) 15%, #DCEBF6);
      border-radius: 15px;
      color: #123C9B;
      background: rgb(255 255 255 / 96%);
      box-shadow:
        0 4px 13px rgb(0 47 112 / 4%),
        inset 0 1px 0 rgb(255 255 255 / 88%);
      transition:
        transform .18s ease,
        border-color .18s ease,
        box-shadow .18s ease,
        background-color .18s ease;
    }

    .overview-capability-card:hover,
    .overview-capability-grid-3 .overview-capability-card:hover {
      transform: translateY(-2px);
      border-color: color-mix(in srgb, var(--group-accent) 46%, #DCEBF6);
      background: #FFFFFF;
      box-shadow: 0 9px 21px rgb(0 47 112 / 9%);
    }

    .overview-capability-icon,
    .overview-capability-grid-3 .overview-capability-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 58px;
      height: 58px;
      border-radius: 16px;
      color: var(--group-accent-dark);
      background: color-mix(in srgb, var(--group-accent) 10%, white);
    }

    .overview-capability-icon svg,
    .overview-capability-grid-3 .overview-capability-icon svg {
      width: 31px;
      height: 31px;
    }

    .overview-capability-copy {
      gap: 5px;
      min-width: 0;
    }

    .overview-capability-copy strong,
    .overview-capability-grid-3 .overview-capability-copy strong {
      color: #102E84;
      font-size: .88rem;
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -.015em;
    }

    .overview-capability-copy > span,
    .overview-capability-grid-3 .overview-capability-copy > span {
      color: #587092;
      font-size: .72rem;
      font-weight: 540;
      line-height: 1.36;
      overflow-wrap: normal;
      word-break: normal;
      hyphens: none;
    }

    .overview-capability-copy br {
      display: none;
    }

    .overview-capability-chevron,
    .overview-capability-grid-3 .overview-capability-chevron {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      justify-self: end;
      align-self: center;
      width: 34px;
      height: 34px;
      border: 1px solid #DCE8F4;
      border-radius: 50%;
      color: #58759A;
      background: #F6FAFE;
      box-shadow: 0 2px 7px rgb(0 47 112 / 4%);
      font-size: 1.45rem;
      line-height: 1;
      transition:
        transform .18s ease,
        color .18s ease,
        border-color .18s ease,
        background-color .18s ease;
    }

    .overview-capability-card:hover .overview-capability-chevron {
