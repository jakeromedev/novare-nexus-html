<style>
/* Styles Overview Enhancements — modularized from the former monolithic Styles.html. */
    /* ================================================================
       OVERVIEW VISUAL REFRESH — IMAGE-LED REFERENCE CARDS
       Makes the About / Directories artwork the focal point while keeping
       all existing managed-link actions and page content intact.
       ================================================================ */
    .overview-reference-grid {
      gap: 16px;
      margin: -24px 20px 0;
    }

    .overview-reference-card {
      min-height: 390px;
      padding: 0;
      border: 1px solid #CFE3F3;
      border-radius: 18px;
      background: linear-gradient(180deg, #FFFFFF 0%, #FBFDFF 100%);
      box-shadow:
        0 14px 34px rgb(7 49 115 / 8%),
        0 2px 7px rgb(7 49 115 / 4%);
      transition:
        transform .22s ease,
        box-shadow .22s ease,
        border-color .22s ease;
    }

    .overview-reference-card:hover {
      transform: translateY(-3px);
      border-color: #AFD4F1;
      box-shadow:
        0 18px 42px rgb(7 49 115 / 12%),
        0 3px 9px rgb(7 49 115 / 5%);
    }

    .overview-reference-card-header {
      position: relative;
      display: block;
      min-height: 178px;
      margin: 0;
      overflow: hidden;
      border-radius: 17px 17px 0 0;
      isolation: isolate;
      background: #EAF5FD;
    }

    .overview-reference-card-header::before {
      content: "";
      position: absolute;
      z-index: 2;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(
          90deg,
          rgb(248 252 255 / 98%) 0%,
          rgb(248 252 255 / 92%) 24%,
          rgb(248 252 255 / 70%) 42%,
          rgb(248 252 255 / 18%) 70%,
          transparent 100%
        ),
        linear-gradient(
          0deg,
          rgb(255 255 255 / 62%) 0%,
          transparent 43%
        );
    }

    .overview-reference-card-header::after {
      content: "";
      position: absolute;
      z-index: 2;
      right: -8%;
      bottom: -42%;
      width: 72%;
      height: 90%;
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(circle, rgb(49 150 255 / 17%) 0%, transparent 68%);
    }

    .overview-reference-thumbnail {
      position: absolute;
      z-index: 0;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 0;
      background: #EAF5FD;
    }

    .overview-reference-image,
    .overview-reference-image-fallback {
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .overview-reference-image {
      object-fit: cover;
      object-position: center;
      transform: scale(1.002);
      transition: transform .55s cubic-bezier(.2, .7, .2, 1), filter .4s ease;
    }

    .overview-reference-card:hover .overview-reference-image {
      transform: scale(1.035);
      filter: saturate(1.04) contrast(1.02);
    }

    .overview-reference-image-fallback {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 20px;
      color: #6A82A2;
      background:
        linear-gradient(115deg, #EFF8FE 0%, #DCEFFD 48%, #E8F7FC 100%);
      font-size: .75rem;
      font-weight: 700;
    }

    .overview-reference-heading-copy {
      position: absolute;
      z-index: 3;
      left: 22px;
      bottom: 22px;
      width: min(64%, 300px);
      min-width: 0;
      padding: 0;
    }

    .overview-reference-heading-copy h2 {
      margin: 0;
      color: #071F63;
      font-size: clamp(1.36rem, 1.65vw, 1.72rem);
      font-weight: 860;
      line-height: 1.02;
      letter-spacing: -.035em;
      text-shadow: 0 1px 0 rgb(255 255 255 / 75%);
    }

    .overview-reference-card:not(.overview-directory-card)
      .overview-reference-heading-copy h2::before,
    .overview-directory-card .overview-reference-heading-copy h2::before {
      display: block;
      margin-bottom: 6px;
      color: #174D8C;
      font-size: .60rem;
      font-weight: 850;
      line-height: 1;
      letter-spacing: .105em;
      text-transform: uppercase;
    }

    .overview-reference-card:not(.overview-directory-card)
      .overview-reference-heading-copy h2::before {
      content: "ABOUT";
    }

    .overview-directory-card .overview-reference-heading-copy h2::before {
      content: "DIRECTORIES";
    }

    .overview-reference-heading-copy p {
      max-width: 280px;
      margin: 7px 0 0;
      color: #315681;
      font-size: .72rem;
      font-weight: 540;
      line-height: 1.34;
      text-wrap: balance;
    }

    .overview-card-arrow {
      position: absolute;
      z-index: 4;
      right: 18px;
      bottom: 19px;
      width: 44px;
      height: 44px;
      margin: 0;
      border-color: rgb(159 205 242 / 76%);
      color: #0757EF;
      background: rgb(255 255 255 / 94%);
      box-shadow:
        0 8px 20px rgb(6 76 171 / 15%),
        inset 0 1px 0 rgb(255 255 255 / 70%);
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
    }

    .overview-card-arrow:hover {
      transform: translateX(3px) scale(1.03);
      border-color: #7CB9EA;
      box-shadow: 0 10px 24px rgb(6 76 171 / 20%);
    }

    .overview-reference-links,
    .overview-directory-card .overview-reference-links {
      margin: 12px 14px 14px;
      overflow: hidden;
      border: 1px solid #E1EDF6;
      border-radius: 11px;
      background: #FFFFFF;
      box-shadow: 0 2px 8px rgb(9 57 123 / 3%);
    }

    .overview-reference-row {
      min-height: 36px;
      padding: 6px 10px;
      border-bottom-color: #EBF2F8;
      font-size: .72rem;
      transition:
        color .15s ease,
        background .15s ease,
        padding-left .15s ease;
    }

    .overview-reference-row:hover {
      padding-left: 12px;
      color: #0757EF;
      background: linear-gradient(90deg, #F4FAFF 0%, #FAFDFF 100%);
    }

    .overview-reference-row.is-highlighted {
      position: relative;
      background: linear-gradient(90deg, #EBF5FF 0%, #F8FBFF 100%);
    }

    .overview-reference-row.is-highlighted::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 3px;
      background: linear-gradient(180deg, #0959F2, #0CC9DD);
    }

    .overview-reference-row-icon {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      box-shadow: 0 3px 8px rgb(7 87 239 / 15%);
    }

    .overview-directory-row {
      min-height: 46px;
      font-size: .74rem;
    }

    /* Stronger visual bridge into the solution-group cards. */
    .overview-solution-groups {
      margin-top: 22px;
    }

    .overview-section-header-enhanced {
      align-items: flex-start;
      margin: 0 4px 14px;
    }

    .overview-section-kicker-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .overview-section-kicker {
      color: #31537E;
      font-size: .62rem;
      font-weight: 850;
      line-height: 1;
      letter-spacing: .15em;
    }

    .overview-section-header-enhanced .overview-section-accent {
      width: 42px;
      height: 4px;
    }

    .overview-section-header-enhanced #overview-solution-groups-title {
      margin: 0 0 0 52px;
      color: #071F63;
      font-size: clamp(1.42rem, 1.9vw, 1.82rem);
      font-weight: 880;
      line-height: 1.04;
      letter-spacing: -.035em;
    }

    .overview-section-header-enhanced .overview-section-heading > p {
      margin: 6px 0 0 52px;
      color: #536E91;
      font-size: .76rem;
    }

    .overview-solution-card {
      border-radius: 15px;
      box-shadow: 0 10px 25px rgb(3 49 113 / 7%);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .overview-solution-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 34px rgb(3 49 113 / 10%);
    }

    @media (max-width: 1199px) {
      .overview-reference-grid {
        gap: 15px;
        margin: 18px 18px 0;
      }

      .overview-reference-card {
        min-height: 380px;
      }

      .overview-directory-card .overview-reference-card-header,
      .overview-reference-card-header {
        min-height: 175px;
      }

      .overview-directory-card {
        grid-column: 1 / -1;
      }

      .overview-directory-card .overview-reference-heading-copy {
        width: min(48%, 390px);
      }
    }

    @media (max-width: 767px) {
      .overview-reference-grid {
        gap: 14px;
        margin: 14px 0 0;
      }

      .overview-reference-card {
        min-height: 0;
        padding: 0;
        border-radius: 16px;
      }

      .overview-reference-card-header,
      .overview-directory-card .overview-reference-card-header {
        display: block;
        min-height: 186px;
        margin: 0;
        border-radius: 15px 15px 0 0;
      }

      .overview-reference-thumbnail {
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .overview-reference-heading-copy,
      .overview-directory-card .overview-reference-heading-copy {
        left: 18px;
        bottom: 18px;
        width: min(68%, 320px);
        padding: 0;
      }

      .overview-reference-heading-copy h2 {
        font-size: 1.38rem;
      }

      .overview-reference-heading-copy p {
        display: block;
        margin-top: 6px;
        font-size: .70rem;
        -webkit-line-clamp: unset;
      }

      .overview-card-arrow {
        right: 16px;
        bottom: 17px;
        width: 40px;
        height: 40px;
      }

      .overview-reference-links,
      .overview-directory-card .overview-reference-links {
        margin: 10px 11px 12px;
      }

      .overview-reference-row {
        min-height: 40px;
        font-size: .73rem;
      }

      .overview-directory-row {
        min-height: 44px;
      }

      .overview-section-header-enhanced {
        margin: 0 2px 12px;
      }

      .overview-section-kicker-row {
        gap: 8px;
      }

      .overview-section-kicker {
        font-size: .58rem;
        letter-spacing: .12em;
      }

      .overview-section-header-enhanced .overview-section-accent {
        width: 34px;
      }

      .overview-section-header-enhanced #overview-solution-groups-title,
      .overview-section-header-enhanced .overview-section-heading > p {
        margin-left: 42px;
      }

      .overview-section-header-enhanced #overview-solution-groups-title {
        font-size: 1.35rem;
      }

      .overview-section-header-enhanced .overview-section-heading > p {
        font-size: .70rem;
      }
    }

    @media (max-width: 440px) {
      .overview-reference-card-header,
      .overview-directory-card .overview-reference-card-header {
        min-height: 176px;
      }

      .overview-reference-card-header::before {
        background:
          linear-gradient(
            90deg,
            rgb(248 252 255 / 97%) 0%,
            rgb(248 252 255 / 86%) 36%,
            rgb(248 252 255 / 30%) 70%,
            transparent 100%
          ),
          linear-gradient(0deg, rgb(255 255 255 / 62%) 0%, transparent 45%);
      }

      .overview-reference-heading-copy,
      .overview-directory-card .overview-reference-heading-copy {
        left: 15px;
        bottom: 15px;
        width: 67%;
      }

      .overview-reference-heading-copy h2 {
        font-size: 1.24rem;
      }

      .overview-reference-heading-copy p {
        font-size: .66rem;
        line-height: 1.3;
      }

      .overview-card-arrow {
        right: 13px;
        bottom: 14px;
        width: 38px;
        height: 38px;
      }

      .overview-section-header-enhanced #overview-solution-groups-title {
        font-size: 1.24rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .overview-reference-card,
      .overview-reference-image,
      .overview-card-arrow,
      .overview-reference-row,
      .overview-solution-card {
        transition: none !important;
      }

      .overview-reference-card:hover,
      .overview-reference-card:hover .overview-reference-image,
      .overview-solution-card:hover {
        transform: none !important;
      }
    }
</style>
