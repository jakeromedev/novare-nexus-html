<style>
/* Styles Search — modularized from the former monolithic Styles.html. */
    /* GLOBAL SEARCH — PHASE 1 */
    .search-page {
      min-height: calc(100vh - var(--topbar-height));
      padding: clamp(26px, 4vw, 52px);
      color: var(--text-primary);
      background:
        radial-gradient(circle at 82% 0%, rgb(0 139 255 / 8%), transparent 28%),
        linear-gradient(180deg, #F7FBFF 0%, #F4F9FD 100%);
    }

    .search-page-shell {
      width: min(1180px, 100%);
      margin: 0 auto;
    }

    .search-page-header {
      display: grid;
      gap: 22px;
      padding: clamp(24px, 3vw, 34px);
      border: 1px solid var(--border-light);
      border-radius: 24px;
      background: rgb(255 255 255 / 92%);
      box-shadow: 0 18px 50px rgb(12 54 105 / 8%);
    }

    .search-page-heading {
      display: grid;
      gap: 7px;
    }

    .search-page-heading .section-label {
      color: var(--blue-700);
    }

    .search-page-heading h1 {
      margin: 0;
      font-size: clamp(1.9rem, 4vw, 2.9rem);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -.045em;
    }

    .search-page-heading p {
      max-width: 720px;
      margin: 0;
      color: var(--text-secondary);
      font-size: .95rem;
      line-height: 1.65;
    }

    .search-page-form {
      margin: 0;
    }

    .search-page-field {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 58px;
      padding: 8px 9px 8px 18px;
      border: 1px solid #C9E0F2;
      border-radius: 18px;
      color: #506B8A;
      background: #FFFFFF;
      box-shadow: 0 8px 26px rgb(17 71 128 / 7%);
    }

    .search-page-field:focus-within {
      border-color: var(--blue-500);
      box-shadow: 0 0 0 4px rgb(0 104 245 / 9%), 0 10px 30px rgb(17 71 128 / 8%);
    }

    .search-page-field > svg {
      flex: 0 0 auto;
    }

    .search-page-field input {
      flex: 1 1 auto;
      min-width: 0;
      border: 0;
      outline: 0;
      color: var(--text-primary);
      background: transparent;
      font: inherit;
      font-size: 1rem;
    }

    .search-page-field input::placeholder {
      color: #7890AA;
    }

    .search-page-submit {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
      padding: 0 16px;
      border: 1px solid #086DF0;
      border-radius: 12px;
      color: #FFFFFF;
      background: linear-gradient(135deg, #0878F8 0%, #0757DC 100%);
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 18px rgb(0 84 210 / 18%);
    }

    .search-page-submit:hover {
      background: linear-gradient(135deg, #1485FF 0%, #0B63EB 100%);
    }

    .search-page-filters {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .search-page-filters::-webkit-scrollbar {
      display: none;
    }

    .search-page-filter {
      flex: 0 0 auto;
      min-height: 36px;
      padding: 7px 13px;
      border: 1px solid #D6E6F3;
      border-radius: 999px;
      color: #5A718D;
      background: #FFFFFF;
      font: inherit;
      font-size: .82rem;
      font-weight: 650;
      cursor: pointer;
      transition: border-color .18s ease, color .18s ease, background .18s ease, box-shadow .18s ease;
    }

    .search-page-filter:hover {
      color: var(--blue-700);
      border-color: #A9CFF0;
      background: #F7FBFF;
    }

    .search-page-filter[aria-pressed="true"] {
      color: #0757D8;
      border-color: #9FCBFA;
      background: #EAF4FF;
      box-shadow: inset 0 0 0 1px rgb(0 104 245 / 6%);
    }

    .search-results-panel {
      margin-top: 22px;
      overflow: hidden;
      border: 1px solid var(--border-light);
      border-radius: 24px;
      background: #FFFFFF;
      box-shadow: 0 16px 42px rgb(12 54 105 / 6%);
    }

    .search-results-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 80px;
      padding: 20px 26px;
      border-bottom: 1px solid #E5EFF7;
    }

    .search-results-toolbar h2 {
      margin: 0;
      font-size: 1rem;
      font-weight: 750;
      letter-spacing: -.015em;
    }

    .search-results-toolbar p {
      margin: 5px 0 0;
      color: var(--text-secondary);
      font-size: .84rem;
    }

    .search-results-state {
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: 190px;
      padding: 34px 30px;
      color: #526B87;
    }

    .search-results-state[hidden] {
      display: none !important;
    }

    .search-results-state > div {
      display: grid;
      gap: 5px;
    }

    .search-results-state strong {
      color: var(--text-primary);
      font-size: .98rem;
    }

    .search-results-state span:not(.search-results-spinner):not(.search-results-state-icon) {
      font-size: .86rem;
      line-height: 1.55;
    }

    .search-results-state-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 46px;
      height: 46px;
      flex: 0 0 46px;
      border: 1px solid #CFE4F5;
      border-radius: 14px;
      color: #0B72EA;
      background: #EFF8FF;
    }

    .search-results-spinner {
      width: 30px;
      height: 30px;
      flex: 0 0 30px;
      border: 3px solid #D6E8F7;
      border-top-color: #0876EF;
      border-radius: 50%;
      animation: nexus-search-spin .8s linear infinite;
    }

    @keyframes nexus-search-spin {
      to { transform: rotate(360deg); }
    }

    .search-results-error .search-results-state-icon {
      color: #B83535;
      border-color: #F2CACA;
      background: #FFF4F4;
    }

    .search-results-list {
      display: grid;
    }

    @media (prefers-reduced-motion: reduce) {
      .search-results-spinner {
        animation-duration: 1.8s;
      }
    }

    @media (max-width: 767px) {
      .search-page {
        padding: 20px 14px 34px;
      }

      .search-page-header,
      .search-results-panel {
        border-radius: 18px;
      }

      .search-page-header {
        padding: 20px 16px;
      }

      .search-page-field {
        min-height: 52px;
        padding-left: 14px;
      }

      .search-page-submit {
        padding-inline: 12px;
      }

      .search-page-submit span {
        display: none;
      }

      .search-results-toolbar {
        min-height: 72px;
        padding: 18px;
      }

      .search-results-state {
        align-items: flex-start;
        min-height: 170px;
        padding: 28px 20px;
      }
    }


    /* GLOBAL SEARCH — PHASE 2 RESULTS */
    .search-results-list:not(:empty) {
      padding: 8px 0 14px;
    }

    .global-search-result {
      display: grid;
      grid-template-columns: 50px minmax(0, 1fr) 34px;
      align-items: center;
      gap: 14px;
      min-height: 92px;
      padding: 16px 24px;
      border: 0;
      border-bottom: 1px solid #E8F0F7;
      color: inherit;
      background: #FFFFFF;
      text-decoration: none;
      transition:
        background .16s ease,
        transform .16s ease;
    }

    .global-search-result:last-child {
      border-bottom: 0;
    }

    .global-search-result:hover {
      background: #F7FBFF;
    }

    .global-search-result:focus-visible {
      position: relative;
      z-index: 1;
      outline: 3px solid rgb(0 112 245 / 22%);
      outline-offset: -3px;
      background: #F7FBFF;
    }

    .global-search-result-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 46px;
      height: 46px;
      border: 1px solid #D2E6F5;
      border-radius: 14px;
      color: #0A73E9;
      background: #EFF8FF;
    }

    .global-search-result[data-result-type="folder"] .global-search-result-icon {
      color: #A76405;
      border-color: #F0D9B3;
      background: #FFF8E9;
    }

    .global-search-result-icon svg {
      width: 23px;
      height: 23px;
    }

    .global-search-result-body {
      display: grid;
      min-width: 0;
      gap: 5px;
    }

    .global-search-result-topline {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .global-search-result-name {
      min-width: 0;
      overflow: hidden;
      color: #173A62;
      font-size: .96rem;
      font-weight: 760;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .global-search-result-badge {
      flex: 0 0 auto;
      max-width: 240px;
      overflow: hidden;
      padding: 4px 8px;
      border: 1px solid #D7E7F5;
      border-radius: 999px;
      color: #4E6C8D;
      background: #F6FAFD;
      font-size: .7rem;
      font-weight: 700;
      line-height: 1;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .global-search-result-context,
    .global-search-result-meta {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .global-search-result-context {
      color: #5B7695;
      font-size: .82rem;
      font-weight: 600;
    }

    .global-search-result-meta {
      color: #7890A8;
      font-size: .76rem;
    }

    .global-search-result-open {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 10px;
      color: #7890A8;
    }

    .global-search-result:hover .global-search-result-open {
      color: #0876EF;
      background: #EAF5FF;
    }

    .global-search-result-open svg {
      width: 17px;
      height: 17px;
    }

    @media (max-width: 767px) {
      .global-search-result {
        grid-template-columns: 42px minmax(0, 1fr) 28px;
        gap: 11px;
        min-height: 86px;
        padding: 14px 16px;
      }

      .global-search-result-icon {
        width: 40px;
        height: 40px;
        border-radius: 12px;
      }

      .global-search-result-icon svg {
        width: 20px;
        height: 20px;
      }

      .global-search-result-topline {
        align-items: flex-start;
        flex-direction: column;
        gap: 5px;
      }

      .global-search-result-name {
        width: 100%;
        font-size: .9rem;
      }

      .global-search-result-badge {
        max-width: 100%;
      }

      .global-search-result-context {
        font-size: .78rem;
      }

      .global-search-result-meta {
        display: none;
      }
    }


    /* GLOBAL SEARCH — PHASE 3 SITE RESULTS */
    .global-search-result-group { display: grid; }
    .global-search-result-group + .global-search-result-group { margin-top: 8px; border-top: 8px solid #F4F8FC; }
    .global-search-result-group-heading { display: flex; align-items: center; gap: 8px; min-height: 46px; padding: 12px 24px 8px; color: #5A7390; background: #FFFFFF; }
    .global-search-result-group-heading h3 { margin: 0; color: #476585; font-size: .72rem; font-weight: 800; letter-spacing: .1em; }
    .global-search-result-group-heading span { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 6px; border: 1px solid #D9E7F3; border-radius: 999px; color: #68819C; background: #F7FAFD; font-size: .68rem; font-weight: 750; }
    button.global-search-result { width: 100%; font: inherit; text-align: left; cursor: pointer; }
    .global-search-result--site .global-search-result-icon { color: #6554D9; border-color: #DCD7FA; background: #F5F3FF; }
    .global-search-result--site .global-search-result-badge { color: #5D55A9; border-color: #DED9F7; background: #F8F6FF; }
    .global-search-result--site:hover .global-search-result-open { color: #6554D9; background: #F1EEFF; }
    .search-target-highlight { scroll-margin-top: calc(var(--topbar-height) + 28px); border-radius: 8px; outline: 3px solid rgb(0 112 245 / 20%); outline-offset: 6px; background: rgb(228 243 255 / 56%); box-shadow: 0 0 0 9px rgb(228 243 255 / 20%); transition: background .25s ease, outline-color .25s ease, box-shadow .25s ease; }
    @media (max-width: 767px) { .global-search-result-group-heading { padding-inline: 16px; } }
    @media (prefers-reduced-motion: reduce) { .search-target-highlight { transition: none; } }


    /* GLOBAL SEARCH — PHASE 4 PRODUCTION POLISH */
    .sr-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    .global-search-result-group--mixed {
      background:
        linear-gradient(
          180deg,
          rgb(240 247 255 / 76%),
          rgb(255 255 255 / 0%)
        );
    }

    .global-search-result-group--mixed
      .global-search-result-group-heading h3 {
      color: #0A64D8;
    }

    .global-search-result-group--mixed
      .global-search-result-group-heading span {
      color: #0A64D8;
      border-color: #C9DFF7;
      background: #EEF6FF;
    }

    .global-search-result-group--mixed
      .global-search-result {
      background: rgb(255 255 255 / 94%);
    }

    .global-search-result-group--mixed
      .global-search-result:hover {
      background: #F5FAFF;
    }

    .global-search-result {
      min-width: 0;
    }

    .global-search-result-body,
    .global-search-result-topline {
      min-width: 0;
    }

    .global-search-result-name {
      display: block;
    }

    .search-page-filter:focus-visible,
    .search-page-submit:focus-visible,
    .global-search-result:focus-visible {
      outline: 3px solid rgb(0 112 245 / 24%);
      outline-offset: 2px;
    }

    .search-page-filter[aria-current="true"] {
      color: #0757D8;
      border-color: #9FCBFA;
      background: #EAF4FF;
    }

    @media (max-width: 980px) {
      .search-page-header {
        gap: 18px;
      }

      .global-search-result {
        padding-inline: 18px;
      }

      .global-search-result-group-heading {
        padding-inline: 18px;
      }
    }

    @media (max-width: 640px) {
      .search-page-heading h1 {
        font-size: 1.8rem;
      }

      .search-page-heading p {
        font-size: .88rem;
      }

      .search-page-filters {
        margin-inline: -4px;
        padding-inline: 4px;
      }

      .global-search-result-group + .global-search-result-group {
        border-top-width: 6px;
      }

      .global-search-result-context {
        white-space: normal;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }
    }


    /* =========================================================
       GLOBAL SEARCH — VISUAL REDESIGN PHASE 2
       Scoped to the Search route so other ONESCA pages remain unchanged.
       ========================================================= */

    .search-page--visual-redesign {
      --search-navy: #071D63;
      --search-blue: #1766F2;
      --search-blue-2: #0B54DB;
      --search-border: #D7E8F6;
      --search-soft: #F6FBFF;
      --search-muted: #53729D;

      min-width: 0;
      overflow-x: clip;
      padding: 0;
      color: var(--search-navy);
      background:
        linear-gradient(180deg, #F8FCFF 0%, #F4FAFF 100%);
    }

    /* ---------- HERO ---------- */

    .search-page--visual-redesign .search-hero.page-hero[data-page-hero] {
      position: relative;
      min-height: 318px;
      overflow: hidden;
      padding:
        calc(var(--topbar-height) + 24px)
        42px
        24px;
      background: #EAF5FF;
    }

    .search-page--visual-redesign .search-hero.page-hero[data-page-hero]::after {
      content: none;
    }

    .search-page--visual-redesign .search-hero-media,
    .search-page--visual-redesign .search-hero-image,
    .search-page--visual-redesign .search-hero-fallback,
    .search-page--visual-redesign .search-hero-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .search-page--visual-redesign .search-hero-media {
      z-index: 0;
      overflow: hidden;
    }

    .search-page--visual-redesign .search-hero-image {
      z-index: 0;
      display: block;
      object-fit: cover;
      object-position: center center;
    }

    .search-page--visual-redesign .search-hero-fallback {
      z-index: 0;
      border: 0;
      border-radius: 0;
      color: transparent;
      background:
        radial-gradient(circle at 72% 46%, rgb(34 126 255 / 23%), transparent 22%),
        linear-gradient(105deg, #FFFFFF 0%, #F2F9FF 38%, #C9E5FF 69%, #0C4EBF 100%);
    }

    .search-page--visual-redesign .search-hero-overlay {
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(
          90deg,
          rgb(251 253 255 / 99%) 0%,
          rgb(251 253 255 / 98%) 29%,
          rgb(248 252 255 / 84%) 42%,
          rgb(240 248 255 / 18%) 59%,
          rgb(12 72 174 / 3%) 72%,
          rgb(6 45 124 / 15%) 100%
        );
    }

    .search-page--visual-redesign .search-hero-content {
      position: relative;
      z-index: 2;
      min-height: 246px;
    }

    .search-page--visual-redesign .search-hero-copy {
      width: min(49%, 690px);
      min-width: 540px;
      padding-top: 2px;
    }

    .search-page--visual-redesign .search-hero-eyebrow {
      margin: 0 0 8px;
      color: #1D5DDA;
      font-size: .82rem;
      font-weight: 840;
      line-height: 1;
      letter-spacing: .22em;
    }

    .search-page--visual-redesign .search-hero-title {
      margin: 0;
      color: #081E67;
      font-size: clamp(2.55rem, 3.35vw, 3.75rem);
      font-weight: 900;
      line-height: .95;
      letter-spacing: -.047em;
    }

    .search-page--visual-redesign .search-hero-title strong {
      color: #2165F3;
      font-weight: 900;
    }

    .search-page--visual-redesign .search-hero-description {
      max-width: 655px;
      margin: 9px 0 0;
      color: #47689A;
      font-size: .85rem;
      font-weight: 590;
      line-height: 1.4;
    }

    .search-page--visual-redesign .search-hero-filters {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 16px;
    }

    .search-page--visual-redesign .search-page-filter {
      min-height: 34px;
      padding: 6px 14px;
      border: 1px solid #BFD9F1;
      border-radius: 999px;
      color: #44638E;
      background: rgb(255 255 255 / 82%);
      box-shadow: 0 2px 8px rgb(33 83 145 / 4%);
      font: inherit;
      font-size: .72rem;
      font-weight: 720;
      cursor: pointer;
      transition:
        color .16s ease,
        border-color .16s ease,
        background .16s ease,
        box-shadow .16s ease,
        transform .16s ease;
    }

    .search-page--visual-redesign .search-page-filter:hover {
      color: #0D55CB;
      border-color: #89B8EA;
      background: #F4FAFF;
      transform: translateY(-1px);
    }

    .search-page--visual-redesign .search-page-filter[aria-pressed="true"],
    .search-page--visual-redesign .search-page-filter[aria-current="true"] {
      color: #FFFFFF;
      border-color: #1766F2;
      background: linear-gradient(135deg, #2477FF, #0C59DE);
      box-shadow: 0 7px 18px rgb(13 92 218 / 20%);
    }

    .search-page--visual-redesign .search-hero-message {
      position: absolute;
      top: 35px;
      right: 16px;
      display: grid;
      width: 205px;
      transform: rotate(-7deg);
      color: #FFFFFF;
      text-align: left;
      text-shadow: 0 2px 12px rgb(0 30 88 / 58%);
      font-family: "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
      line-height: 1.06;
    }

    .search-page--visual-redesign .search-hero-message span:first-child {
      font-size: .88rem;
      font-weight: 600;
    }

    .search-page--visual-redesign .search-hero-message strong {
      margin-top: 3px;
      color: #37E2E9;
      font-size: .93rem;
      font-weight: 650;
    }

    .search-page--visual-redesign .search-hero-message-rule {
      width: 85px;
      height: 4px;
      margin-top: 9px;
      border-radius: 999px;
      background:
        linear-gradient(
          90deg,
          #2566FF 0 25%,
          #13C7D7 26% 52%,
          #62E3A8 53% 72%,
          #FFB325 73% 100%
        );
      box-shadow: 0 0 9px rgb(37 198 231 / 35%);
    }

    /* ---------- CONTENT ---------- */

    .search-page--visual-redesign .search-page-content {
      padding: 10px 16px 24px;
      background:
        linear-gradient(180deg, #FBFEFF 0%, #F6FBFF 100%);
    }

    .search-page--visual-redesign .search-results-statusbar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      padding: 2px 4px 9px;
    }

    .search-page--visual-redesign .search-results-statusbar h2 {
      margin: 0;
      color: #091E67;
      font-size: 1rem;
      font-weight: 830;
      letter-spacing: -.015em;
    }

    .search-page--visual-redesign .search-results-statusbar p {
      margin: 3px 0 0;
      color: #54739D;
      font-size: .73rem;
      font-weight: 560;
    }

    .search-page--visual-redesign .search-results-state {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 138px;
      margin: 0 0 12px;
      padding: 26px 28px;
      border: 1px solid var(--search-border);
      border-radius: 16px;
      color: #54739D;
      background: #FFFFFF;
      box-shadow: 0 10px 30px rgb(13 58 115 / 5%);
    }

    .search-page--visual-redesign .search-results-state[hidden] {
