  const refs = {};

  // The detail design is authored in Page_AI_Prompt_Details.html, not in the
  // growing Prompt Library HTML. Index.html exposes the compiled partial in a
  // template; replace only the old detail DOM before references/events bind.
  function mountDedicatedPromptDetails_(root) {
    if (root.querySelector("#ai-prompt-detail-dialog.nx-prompt-detail")) return;
    const template = document.getElementById("nexus-prompt-detail-template");
    const existing = root.querySelector("#ai-prompt-detail-dialog");
    if (!template || !existing || !template.content) {
      console.error("[Prompt Hub] Dedicated detail template is missing. Check Index.html include.");
      return;
    }
    const fragment = template.content.cloneNode(true);
    if (!fragment.querySelector("#ai-prompt-detail-dialog")) return;
    existing.replaceWith(fragment);
    const nav = root.querySelector(".ai-prompt-community-nav");
    if (nav && !nav.querySelector(".nx-prompt-hub-brand")) {
      const brand = document.createElement("span");
      brand.className = "nx-prompt-hub-brand";
      brand.textContent = "✣  Prompt Hub";
      nav.insertBefore(brand, nav.firstChild);
    }
  }

  function isAppsScriptAvailable() {
    return Boolean(
      typeof google !== "undefined" &&
      google && google.script && google.script.run
    );
  }

  function getEffectiveRole() {
    const app = document.getElementById("nexus-app");
    return app && app.dataset.currentUserEffectiveRole === "admin"
      ? "admin"
      : "user";
  }

  function initialize(pageRoot) {
    const root = pageRoot && pageRoot.querySelector
      ? pageRoot.querySelector('[data-page="ai-prompt-library"]')
      : null;

    if (!root) return;

    state.root = root;

    try {
      mountDedicatedPromptDetails_(root);
      cacheRefs(root);
      syncPromptHubStickyOffset_();

      if (root.dataset.promptLibraryInitialized !== "true") {
        bindEvents(root);
        root.dataset.promptLibraryInitialized = "true";
        syncAdminUI();
        handlePromptSubroute_();
        loadLibrary();
        return;
      }

      syncAdminUI();
      handlePromptSubroute_();
    } catch (error) {
      console.error(
        "[AI Prompt Library] Frontend initialization error:",
        error
      );

      const status = root.querySelector(
        "#ai-prompt-library-status"
      );
      const statusText = status
        ? status.querySelector("[data-ai-prompt-status-text]")
        : null;

      if (status) {
        status.hidden = false;
        status.className =
          "ai-prompt-library-state is-error";
      }

      if (statusText) {
        statusText.textContent =
          "The Prompt Library could not initialize. " +
          "Please refresh and try again.";
      }
    }
  }

  function cacheRefs(root) {
    refs.surface = root.querySelector("#ai-prompt-library-surface");
    refs.hero = root.querySelector(".ai-prompt-library-hero");
    refs.communityNav = root.querySelector(".ai-prompt-community-nav");
    refs.listContent = root.querySelector("#ai-prompt-library-content");
    refs.detailPage = root.querySelector("#ai-prompt-detail-dialog");
    refs.detailShell = refs.detailPage && refs.detailPage.querySelector(".ai-prompt-dialog-shell");
    refs.detailState = root.querySelector("#ai-prompt-phase1-state");
    refs.detailStateTitle = root.querySelector("#ai-prompt-phase1-state-title");
    refs.detailStateMessage = root.querySelector("#ai-prompt-phase1-state-message");
    refs.detailBack = root.querySelector("#ai-prompt-phase1-back");
    refs.detailOrigin = root.querySelector("#ai-prompt-phase1-origin");
    refs.detailCurrent = root.querySelector("#ai-prompt-phase1-current");
    refs.detailRelated = root.querySelector("#ai-prompt-phase1-related-list");
    refs.detailShare = root.querySelector("#ai-prompt-phase1-share");
    // The redundant Prompt Collection heading was removed. Keep pagination
    // scroll-to-top working by targeting the sticky Prompt Hub tabs instead.
    refs.header = refs.communityNav;
    refs.count = null;
    refs.search = root.querySelector("#ai-prompt-library-search");
    refs.categoryQuickSelect = root.querySelector("#ai-prompt-library-category-select");
    refs.typeQuickSelect = root.querySelector("#ai-prompt-library-type-select");
    refs.missingSummary = root.querySelector(
      "#ai-prompt-library-missing-summary"
    );
    refs.missingSummaryTitle = root.querySelector(
      "#ai-prompt-library-missing-summary-title"
    );

    );

    );
    refs.filterCount = root.querySelector(

    );

    );

    refs.filterStatusGroup = root.querySelector(

    );
    refs.activeFilters = root.querySelector(

    );
    refs.activeFilterChips = root.querySelector(
      "#ai-prompt-library-active-filter-chips"
    );
    refs.clearFilters = root.querySelector(
      "#ai-prompt-library-clear-filters"
    );
    refs.categories = root.querySelector("#ai-prompt-library-categories");
    refs.results = root.querySelector("#ai-prompt-library-results");
    refs.discoveryBreadcrumbs = root.querySelector("#ai-prompt-discovery-breadcrumbs");
    refs.pagination = root.querySelector("#ai-prompt-library-pagination");
    refs.status = root.querySelector("#ai-prompt-library-status");
    refs.statusTitle = refs.status
      ? refs.status.querySelector("[data-ai-prompt-status-title]")
      : null;
    refs.statusText = refs.status
      ? refs.status.querySelector("[data-ai-prompt-status-text]")
      : null;
    refs.stateAction = root.querySelector(
      "#ai-prompt-library-state-action"
    );
    refs.retry = root.querySelector("#ai-prompt-library-retry");
    refs.addButton = root.querySelector("#ai-prompt-library-add");
    refs.communityExplore = root.querySelector("#ai-prompt-community-explore");
    refs.communityMy = root.querySelector("#ai-prompt-community-my");
    refs.phase2Bookmarks = root.querySelector("#ai-prompt-community-bookmarks");
    refs.phase3ForYou = root.querySelector("#ai-prompt-community-for-you");
    refs.phase2Moderation = root.querySelector("#ai-prompt-community-moderation");
    refs.phase2Actions = root.querySelector("#ai-prompt-phase2-actions");
    refs.phase2Badge = root.querySelector("#ai-prompt-phase2-verified");
    refs.phase2Bookmark = root.querySelector("#ai-prompt-phase2-bookmark");
    refs.phase2Fork = root.querySelector("#ai-prompt-phase2-fork");
    refs.phase2History = root.querySelector("#ai-prompt-phase2-history");
    refs.phase2Report = root.querySelector("#ai-prompt-phase2-report");
    refs.phase2Verify = root.querySelector("#ai-prompt-phase2-verify");
    refs.phase2Origin = root.querySelector("#ai-prompt-phase2-origin");
    refs.phase2ReportDialog = root.querySelector("#ai-prompt-phase2-report-dialog");
    refs.phase2ReportForm = root.querySelector("#ai-prompt-phase2-report-form");
    refs.phase2Reason = root.querySelector("#ai-prompt-phase2-report-reason");
    refs.phase2ReportDetails = root.querySelector("#ai-prompt-phase2-report-details");
    refs.phase2VersionsDialog = root.querySelector("#ai-prompt-phase2-versions-dialog");
    refs.phase2Versions = root.querySelector("#ai-prompt-phase2-versions");
    refs.communitySort = root.querySelector("#ai-prompt-community-sort");
    refs.communityIdentity = root.querySelector("#ai-prompt-community-identity");
    refs.detailUpvote = root.querySelector("#ai-prompt-community-detail-upvote");
    refs.detailVotes = root.querySelector("#ai-prompt-community-detail-votes");
    refs.detailCopies = root.querySelector("#ai-prompt-community-detail-copies");
    refs.detailCommentCount = root.querySelector("#ai-prompt-community-detail-comment-count");
    refs.comments = root.querySelector("#ai-prompt-community-comments");
    refs.commentForm = root.querySelector("#ai-prompt-comment-form");
    refs.commentBody = root.querySelector("#ai-prompt-comment-body");
    refs.commentsPrev = root.querySelector("#ai-prompt-comments-prev");
    refs.commentsNext = root.querySelector("#ai-prompt-comments-next");
    refs.commentsPage = root.querySelector("#ai-prompt-comments-page");

    refs.detailDialog = root.querySelector("#ai-prompt-detail-dialog");
    refs.detailTitle = root.querySelector("#ai-prompt-detail-title");
    refs.detailId = root.querySelector("#ai-prompt-detail-id");

    refs.detailPrompt = root.querySelector("#ai-prompt-detail-prompt");
    refs.detailCopy = root.querySelector("#ai-prompt-detail-copy");
    refs.detailAdminActions = root.querySelector("#ai-prompt-detail-admin-actions");

    refs.detailClose = Array.from(

    );

    refs.addDialog = root.querySelector("#ai-prompt-add-dialog");

    refs.editorAccessTitle = root.querySelector("#ai-prompt-phase3-access-title");
    refs.editorAccessMessage = root.querySelector("#ai-prompt-phase3-access-message");
    refs.editorCrumb = root.querySelector("#ai-prompt-phase3-crumb");
    refs.editorPreviewTitle = root.querySelector("#ai-prompt-phase3-preview-title");
    refs.editorPreviewMeta = root.querySelector("#ai-prompt-phase3-preview-meta");
    refs.editorPreviewUseCase = root.querySelector("#ai-prompt-phase3-preview-use-case");
    refs.editorPreviewPrompt = root.querySelector("#ai-prompt-phase3-preview-prompt");
    refs.addForm = root.querySelector("#ai-prompt-add-form");
    refs.addClose = Array.from(
      root.querySelectorAll("[data-ai-prompt-add-close]")
    );
    refs.addError = root.querySelector("#ai-prompt-add-error");
    refs.addSubmit = root.querySelector("#ai-prompt-add-submit");
    refs.editorTitle = root.querySelector("#ai-prompt-editor-title");
    refs.editorId = root.querySelector("#ai-prompt-editor-id");
    refs.editorDescription = root.querySelector("#ai-prompt-editor-description");
    refs.useCaseCounter = root.querySelector(
      "#ai-prompt-use-case-counter"
    );
    refs.promptCounter = root.querySelector(

    refs.categorySelect = root.querySelector(

    refs.toastMessage = root.querySelector(

    );
  }

  // The global header is responsive. Measure its actual rendered height so
  // the Prompt Hub nav sticks immediately below it (rather than behind it).
  function syncPromptHubStickyOffset_() {
    if (!refs.communityNav) return;
    const header = document.getElementById("nexus-nav-header");
    if (!header) return;
    const pixels = Math.ceil(header.getBoundingClientRect().height);
    if (pixels > 0) refs.communityNav.style.setProperty("--prompt-hub-sticky-top", pixels + "px");
  }

  function bindEvents(root) {
    bindPromptHeroInteractions_(root);
    window.addEventListener("resize", syncPromptHubStickyOffset_, { passive: true });
    if (typeof ResizeObserver !== "undefined") {
      const nexusHeader = document.getElementById("nexus-nav-header");
      if (nexusHeader) {
        const headerSizeObserver = new ResizeObserver(syncPromptHubStickyOffset_);
        headerSizeObserver.observe(nexusHeader);
      }
    }
    if (refs.communityExplore) refs.communityExplore.addEventListener("click", function () {
      setCommunityView_("explore");
    });
    if (refs.communityMy) refs.communityMy.addEventListener("click", function () {
      setCommunityView_("my-prompts");
    });
    if (refs.phase2Bookmarks) refs.phase2Bookmarks.addEventListener("click", function () {
      setCommunityView_("bookmarks");
    });
    if (refs.phase2Moderation) refs.phase2Moderation.addEventListener("click", function () {
      setCommunityView_("moderation");
    });
    if (refs.phase3ForYou) refs.phase3ForYou.addEventListener("click", function () {
      setCommunityView_("for-you");
    });
    if (refs.phase2Bookmark) refs.phase2Bookmark.addEventListener("click", function () {
      togglePhase2Bookmark_(state.activePromptId);
    });
    // Fork-to-Draft is on hold; retain the backend but do not expose its UI.
    if (refs.phase2Report) refs.phase2Report.addEventListener("click", function () {
      openPhase2Report_("prompt", state.activePromptId);
    });
    // Revision History is on hold; preserve stored versions without a UI route.
    if (refs.phase2Verify) refs.phase2Verify.addEventListener("click", verifyPhase2Prompt_);
    if (refs.phase2ReportForm) refs.phase2ReportForm.addEventListener("submit", submitPhase2Report_);
    if (root.querySelector("#ai-prompt-phase2-report-cancel")) {
      root.querySelector("#ai-prompt-phase2-report-cancel").addEventListener("click", function () {closeDialog(refs.phase2ReportDialog);});
    }
    if (root.querySelector("#ai-prompt-phase2-versions-close")) {
      root.querySelector("#ai-prompt-phase2-versions-close").addEventListener("click", function () {closeDialog(refs.phase2VersionsDialog);});
    }
    if (refs.communitySort) refs.communitySort.addEventListener("change", function () {
      state.sortMode = refs.communitySort.value || "top-upvoted";
      state.page = 1;
      navigateListing_(state.activeView);
    });
    if (refs.categoryQuickSelect) refs.categoryQuickSelect.addEventListener("change", function () {
      state.category = refs.categoryQuickSelect.value || "all";
      state.page = 1;
      navigateListing_(state.query ? "search" : state.category === "all" ? "explore" : "category");
    });
    if (refs.typeQuickSelect) refs.typeQuickSelect.addEventListener("change", function () {
      state.filters.promptTypes = refs.typeQuickSelect.value ? [refs.typeQuickSelect.value] : [];
      state.page = 1;
      navigateListing_(state.activeView);
    });
    if (refs.detailUpvote) refs.detailUpvote.addEventListener("click", function () {
      setCommunityVote_(state.activePromptId);
    });
    if (refs.commentForm) refs.commentForm.addEventListener("submit", submitCommunityComment_);
    if (refs.commentsPrev) refs.commentsPrev.addEventListener("click", function () {
      state.commentsPage = Math.max(1, state.commentsPage - 1);
      loadCommunityComments_();
    });
    if (refs.commentsNext) refs.commentsNext.addEventListener("click", function () {
      state.commentsPage += 1;
      loadCommunityComments_();
    });
    if (refs.comments) refs.comments.addEventListener("click", handleCommunityCommentAction_);
    if (refs.search) {
      refs.search.addEventListener("input", function () {
        if (!state.searchOriginHash) state.searchOriginHash = window.location.hash || "#ai-prompt-library?view=explore";
        state.query = refs.search.value.trim().toLowerCase();
        state.page = 1;
        const view = ["bookmarks", "my-prompts"].includes(state.activeView) ? state.activeView
          : state.query ? "search" : state.category !== "all" ? "category" : "explore";
        // Update results immediately, then replace the URL after a short debounce.
        state.activeView = view;
        syncCommunityView_();
        renderCategoryFilters();
        renderLibrary();
        renderDiscoveryBreadcrumbs_();
        if (state.searchTimer) clearTimeout(state.searchTimer);
        state.searchTimer = setTimeout(function () {
          state.searchTimer = null;
          navigateListing_(view, {replace:true, preserveSearchOrigin:true});
        }, 300);
      });
      refs.search.addEventListener("keydown", function (event) {
        if (event.key !== "Enter") return;
        event.preventDefault();
        if (state.searchTimer) { clearTimeout(state.searchTimer); state.searchTimer = null; }
        const view = ["bookmarks", "my-prompts"].includes(state.activeView) ? state.activeView
          : state.query ? "search" : state.category !== "all" ? "category" : "explore";
        // Commit one navigable search entry without one entry per keystroke.
        const origin = state.searchOriginHash;
        const destination = buildListingHash_(view);
        if (origin && origin !== destination) {
          replaceListingHash_(origin);
        }
        state.searchOriginHash = "";
        navigateListing_(view);
      });
    }

    if (refs.filterToggle) {
      refs.filterToggle.addEventListener(
        "click",
        function (event) {
          event.stopPropagation();

          if (
            refs.filterPopover &&
            !refs.filterPopover.hidden
          ) {
            closeFilterPopover_();
          } else {
            openFilterPopover_();
          }
        }
      );
    }

    [refs.filterClose, refs.filterCancel].forEach(
      function (button) {
        if (!button) return;

        button.addEventListener(
          "click",
          closeFilterPopover_
        );
      }
    );

    if (refs.filterClear) {
      refs.filterClear.addEventListener(
        "click",
        function () {
          renderFilterControls_({
            promptTypes: [],
            content: "all",
            statuses: []
          });
        }
      );
    }

    if (refs.filterApply) {
      refs.filterApply.addEventListener(
        "click",
        applyFiltersFromPopover_
      );
    }

    if (refs.clearFilters) {
      refs.clearFilters.addEventListener(
        "click",
        function () {
          clearActiveFilters_();
        }
      );
    }

    if (refs.activeFilters) {
      refs.activeFilters.addEventListener(
        "click",
        function (event) {
          const remove = event.target.closest(
            "[data-ai-prompt-remove-filter]"
          );

          if (!remove) return;

          removeActiveFilter_(
            remove.dataset.aiPromptRemoveFilter || "",
            remove.dataset.aiPromptFilterValue || ""
          );
        }
      );
    }

    if (refs.viewMissing) {
      refs.viewMissing.addEventListener(
        "click",
        function () {
          state.category = "all";
          state.query = "";

          if (refs.search) {
            refs.search.value = "";
          }

          state.filters.content = "missing";
          state.page = 1;
          navigateListing_("explore");
        }
      );
    }

    if (refs.categories) {
      refs.categories.addEventListener("click", function (event) {
        const back = event.target.closest(
          "[data-ai-prompt-category-back]"
        );

        if (back) {
          state.category = "all";
          state.page = 1;
          navigateListing_("explore");
          return;
        }

        const button = event.target.closest(
          "[data-ai-prompt-category]"
        );

        if (!button) return;

        state.category = button.dataset.aiPromptCategory || "all";
        state.query = "";
        if (refs.search) refs.search.value = "";
        state.page = 1;
        navigateListing_(state.category === "all" ? "explore" : "category");
      });
    }

    if (refs.results) {
      refs.results.addEventListener("click", function (event) {
        const expandButton = event.target.closest("[data-ai-prompt-expand]");
        if (expandButton) {
          state.exploreExpanded = !state.exploreExpanded;
          state.pageSize = state.exploreExpanded ? 12 : 6;
          state.page = 1;
          navigateListing_("explore");
          return;
        }
        const actionButton = event.target.closest(
          "[data-ai-prompt-action]"
        );

        if (actionButton) {
          event.preventDefault();
          event.stopPropagation();

          const promptId =
            actionButton.dataset.aiPromptId || "";
          const action =
            actionButton.dataset.aiPromptAction || "";

          if (action === "publish" || action === "unpublish") {
            showToast("Draft management is on hold for this release.", "error");
            return;
          }
          if (action === "upvote") {
            setCommunityVote_(promptId);
            return;
          }
          if (action === "bookmark") {
            togglePhase2Bookmark_(promptId);
            return;
          }
          if (action === "edit") {
            editPromptById(promptId);
            return;
          }

          handlePromptTableAction(
            promptId,
            action,
            actionButton
          );

          return;
        }

        if (
          event.target.closest(
            ".ai-prompt-table-action-cell"
          )
        ) {
          return;
        }

        const openButton = event.target.closest(
          "[data-ai-prompt-open]"
        );

        if (openButton) {
          event.preventDefault();
          openPromptDetail(
            openButton.dataset.aiPromptId || ""
          );
          return;
        }

        const row = event.target.closest("tr[data-ai-prompt-id]");
        const card = event.target.closest(".ai-prompt-feed-card[data-ai-prompt-id]");
        const target = row || card;
        if (!target) return;
        openPromptDetail(target.dataset.aiPromptId || "");
      });
    }

    if (refs.pagination) {
      refs.pagination.addEventListener("click", function (event) {
        const button = event.target.closest(
          "[data-ai-prompt-page]"
        );

        if (!button || button.disabled) return;

        const page = Number(
          button.dataset.aiPromptPage
        );

        if (!Number.isFinite(page) || page < 1) {
          return;
        }

        state.page = page;
        navigateListing_(state.activeView);

        if (
          refs.header &&
          typeof refs.header.scrollIntoView === "function"
        ) {
          refs.header.scrollIntoView({
            behavior: "smooth",
            block: "start"
          });
        }
      });
    }

    if (refs.discoveryBreadcrumbs) {
      refs.discoveryBreadcrumbs.addEventListener("click", function (event) {
        const target = event.target.closest("[data-ai-prompt-nav-view]");
        if (!target) return;
        event.preventDefault();
        const view = target.dataset.aiPromptNavView || "explore";
        if (view === "explore") {
          state.category = "all";
          state.query = "";
          if (refs.search) refs.search.value = "";
          state.filters = normalizeFilterState_({});
          state.page = 1;
        } else if (view === "category") {
          state.query = "";
          if (refs.search) refs.search.value = "";
          state.page = 1;
        }
        navigateListing_(view);
      });
    }

    if (refs.stateAction) {
      refs.stateAction.addEventListener(
        "click",

    window.addEventListener("hashchange", handlePromptSubroute_);
    window.addEventListener("popstate", handlePromptSubroute_);
    window.addEventListener("beforeunload", function(event) {
      if (!hasUnsavedEditorChanges_()) return;

      );

  function normalizeFilterState_(filters) {
    const source = filters && typeof filters === "object"
      ? filters
      : {};

    return {
      promptTypes: Array.isArray(source.promptTypes)
        ? source.promptTypes.filter(Boolean)
        : [],
      content: ["all", "has", "missing"].includes(
        source.content
      )
        ? source.content
        : "all",
      statuses: Array.isArray(source.statuses)
        ? source.statuses.filter(Boolean)
        : []
    };
  }


  function getActiveFilterCount_() {
    return (
      state.filters.promptTypes.length +
      state.filters.statuses.length +
      (state.filters.content === "all" ? 0 : 1)
    );
  }


  function hasActiveFilters_() {
    return getActiveFilterCount_() > 0;
  }


  function openFilterPopover_() {
    if (!refs.filterPopover) return;

    renderFilterControls_(state.filters);
    refs.filterPopover.hidden = false;

    if (refs.filterToggle) {
      refs.filterToggle.setAttribute(
        "aria-expanded",
        "true"
      );
    }
  }


  function closeFilterPopover_() {
    if (!refs.filterPopover) return;

    refs.filterPopover.hidden = true;

    if (refs.filterToggle) {
      refs.filterToggle.setAttribute(
        "aria-expanded",
        "false"
      );
    }
  }


  function renderFilterControls_(filters) {
    const value = normalizeFilterState_(filters);

    if (refs.filterTypes) {
      refs.filterTypes.replaceChildren();

      state.promptTypeOptions.forEach(function (item) {
        const label = document.createElement("label");
        label.className = "ai-prompt-filter-option";

        const input = document.createElement("input");
        input.type = "checkbox";
        input.value = item.name;
        input.dataset.aiPromptTypeFilter = "true";
        input.checked = value.promptTypes.includes(
          item.name
        );

        const text = document.createElement("span");
        text.textContent = item.name;

        label.append(input, text);
        refs.filterTypes.appendChild(label);
      });

      if (!state.promptTypeOptions.length) {
        const empty = document.createElement("p");
        empty.className = "ai-prompt-filter-empty";
        empty.textContent =
          "No prompt types are available.";
        refs.filterTypes.appendChild(empty);
      }
    }

    const contentInputs = state.root
      ? state.root.querySelectorAll(
          'input[name="ai-prompt-content-filter-draft"]'
        )
      : [];

    contentInputs.forEach(function (input) {
      input.checked = input.value === value.content;
    });

    const missingCount = getMissingPromptCount_();

    if (refs.filterContentGroup) {
      refs.filterContentGroup.hidden =
        missingCount === 0;
    }

    if (missingCount === 0) {
      value.content = "all";

      contentInputs.forEach(function (input) {
        input.checked = input.value === "all";
      });
    }

    const isAdmin = getEffectiveRole() === "admin";

    if (refs.filterStatusGroup) {
      refs.filterStatusGroup.hidden = !isAdmin;
    }

    const statusInputs = state.root
      ? state.root.querySelectorAll(
          "[data-ai-prompt-status-filter]"
        )
      : [];

    statusInputs.forEach(function (input) {
      input.checked =
        isAdmin &&
        value.statuses.includes(input.value);
    });
  }


  function readFilterControls_() {
    const promptTypes = state.root
      ? Array.from(
          state.root.querySelectorAll(
            "[data-ai-prompt-type-filter]:checked"
          )
        ).map(function (input) {
          return input.value;
        })
      : [];

    const contentInput = state.root
      ? state.root.querySelector(
          'input[name="ai-prompt-content-filter-draft"]:checked'
        )
      : null;

    const statuses = (
      getEffectiveRole() === "admin" &&
      state.root
    )
      ? Array.from(
          state.root.querySelectorAll(
            "[data-ai-prompt-status-filter]:checked"
          )
        ).map(function (input) {
          return input.value;
        })
      : [];

    return normalizeFilterState_({
      promptTypes: promptTypes,
      content: contentInput
        ? contentInput.value
        : "all",
      statuses: statuses
    });
  }


  function applyFiltersFromPopover_() {
    state.filters = readFilterControls_();

    if (
      state.promptTypeOptions.length > 0 &&
      state.filters.promptTypes.length ===
        state.promptTypeOptions.length
    ) {
      state.filters.promptTypes = [];
    }

    if (
      getEffectiveRole() === "admin" &&
      state.filters.statuses.length === 4
    ) {
      state.filters.statuses = [];
    }

    if (
      getMissingPromptCount_() === 0 &&
      state.filters.content !== "all"
    ) {
      state.filters.content = "all";
    }

    state.page = 1;
    closeFilterPopover_();
    navigateListing_(state.activeView);
  }


  function clearActiveFilters_() {
    state.filters = normalizeFilterState_({});
    state.page = 1;
    navigateListing_(state.activeView);
  }


  function removeActiveFilter_(
    filterType,
    filterValue
  ) {
    if (filterType === "promptType") {
      state.filters.promptTypes =
        state.filters.promptTypes.filter(
          function (value) {
            return value !== filterValue;
          }
        );
    }

    if (filterType === "content") {
      state.filters.content = "all";
    }

    if (filterType === "status") {
      state.filters.statuses =
        state.filters.statuses.filter(
          function (value) {
            return value !== filterValue;
          }
        );
    }

    state.page = 1;
    navigateListing_(state.activeView);
  }


  function createActiveFilterChip_(
    label,
    filterType,
    filterValue,
    extraClass
  ) {
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className =
      "ai-prompt-active-filter-chip" +
      (extraClass ? " " + extraClass : "");
    chip.dataset.aiPromptRemoveFilter = filterType;
    chip.dataset.aiPromptFilterValue =
      filterValue || "";
    chip.setAttribute(
      "aria-label",
      "Remove filter: " + label
    );

    const text = document.createElement("span");
    text.textContent = label;

    const close = document.createElement("span");
    close.setAttribute("aria-hidden", "true");
    close.textContent = "×";

    chip.append(text, close);
    return chip;
  }


  function renderFilterSummary_() {
    const filterCount = getActiveFilterCount_();

    if (refs.filterCount) {
      refs.filterCount.hidden = filterCount === 0;
      refs.filterCount.textContent =
        String(filterCount);
    }

    if (refs.filterToggle) {
      refs.filterToggle.classList.toggle(
        "is-active",
        filterCount > 0
      );
    }

    if (
      !refs.activeFilters ||
      !refs.activeFilterChips
    ) {
      return;
    }

    refs.activeFilterChips.replaceChildren();

    state.filters.promptTypes.forEach(
      function (promptType) {
        refs.activeFilterChips.appendChild(
          createActiveFilterChip_(
            promptType,
            "promptType",
            promptType,
            "is-type"
          )
        );
      }
    );

    if (state.filters.content === "has") {
      refs.activeFilterChips.appendChild(
        createActiveFilterChip_(
          "Has prompt",
          "content",
          "has",
          "is-content"
        )
      );
    }

    if (state.filters.content === "missing") {
      refs.activeFilterChips.appendChild(
        createActiveFilterChip_(
          "Missing prompt",
          "content",
          "missing",
          "is-warning"
        )
      );
    }

    state.filters.statuses.forEach(
      function (status) {
        refs.activeFilterChips.appendChild(
          createActiveFilterChip_(
            "Status: " + status,
            "status",
            status,
            "is-status"
          )
        );
      }
    );

    refs.activeFilters.hidden = filterCount === 0;
  }


  function getMissingPromptCount_() {
    return state.prompts.filter(function (prompt) {
      return !hasPromptContent_(prompt);
    }).length;
  }



  function sanitizeActiveFilters_() {
    const allowedTypes = new Set(
      state.promptTypeOptions.map(function (item) {
        return item.name;
      })
    );

    state.filters.promptTypes =
      state.filters.promptTypes.filter(
        function (value) {
          return allowedTypes.has(value);
        }
      );

    if (getMissingPromptCount_() === 0) {
      state.filters.content = "all";
    }

    if (getEffectiveRole() !== "admin") {
      state.filters.statuses = [];
    }
  }


  function renderMissingSummary_() {
    if (!refs.missingSummary) return;

    const missingCount = getMissingPromptCount_();
    const isAdmin = getEffectiveRole() === "admin";

    refs.missingSummary.hidden =
      !isAdmin || missingCount === 0 || state.activeView !== "explore";

    if (
      isAdmin &&
      missingCount > 0 &&
      refs.missingSummaryTitle
    ) {
      refs.missingSummaryTitle.textContent =
        missingCount +
        " " +
        (
          missingCount === 1
            ? "prompt still needs"
            : "prompts still need"
        ) +
        " prompt content.";
    }
  }


  function shouldShowTable_() {
    return Boolean(
      state.query ||
      state.category !== "all" ||
      hasActiveFilters_() ||
      state.activeView === "explore" ||
      state.activeView === "category" ||
      state.activeView === "search" ||
      state.activeView === "my-prompts" ||
      state.activeView === "bookmarks" ||
      state.activeView === "moderation" ||
      state.activeView === "insights" ||
      state.activeView === "for-you"
    );
  }


  function handleEmptyStateAction_() {
    if (!refs.stateAction) return;

    const action =
      refs.stateAction.dataset.aiPromptStateAction || "";

    if (action === "search") {
      state.query = "";

      if (refs.search) {
        refs.search.value = "";
      }
    }

    if (action === "filters") {
      state.filters = normalizeFilterState_({});
    }

    if (action === "category" || action === "browse") {
      state.category = "all";
      if (action === "browse") state.activeView = "explore";
    }

    state.page = 1;
    navigateListing_(state.query ? "search" : state.category !== "all" ? "category" : state.activeView);
  }


  function updatePromptFieldCounters_() {
    if (!refs.addForm) return;

    const useCase = refs.addForm.elements.useCase;
    const prompt = refs.addForm.elements.prompt;

    if (refs.useCaseCounter) {
      const length = useCase
        ? String(useCase.value || "").length
        : 0;

      refs.useCaseCounter.textContent =
        length + "/500";
    }

    if (refs.promptCounter) {
      const length = prompt
        ? String(prompt.value || "").length
        : 0;

      refs.promptCounter.textContent =
        length + "/12000";
    }
    renderPhase3Preview_();
  }

  function renderPhase3Preview_() {
    if (!refs.addForm) return;
    const form = refs.addForm.elements;
    const title = String(form.promptName && form.promptName.value || "").trim();
    const category = refs.newCategoryField && !refs.newCategoryField.hidden
      ? String(refs.newCategoryInput.value || "").trim()
      : String(refs.categorySelect && refs.categorySelect.value || "").trim();
    const type = refs.newPromptTypeField && !refs.newPromptTypeField.hidden
      ? String(refs.newPromptTypeInput.value || "").trim()
      : String(refs.promptTypeSelect && refs.promptTypeSelect.value || "").trim();
    if (refs.editorPreviewTitle) refs.editorPreviewTitle.textContent = title || "Your prompt title";
    if (refs.editorPreviewMeta) refs.editorPreviewMeta.textContent = [category, type].filter(Boolean).join(" · ") || "Select a category and prompt type";
    if (refs.editorPreviewUseCase) refs.editorPreviewUseCase.textContent = String(form.useCase && form.useCase.value || "").trim() || "Describe the use case…";
    if (refs.editorPreviewPrompt) refs.editorPreviewPrompt.textContent = String(form.prompt && form.prompt.value || "").trim() || "Your reusable prompt will appear here…";
  }


  function getEditorSignature_() {
    if (!refs.addForm) return "";

    const form = new FormData(refs.addForm);

    return JSON.stringify({
      promptName: String(
        form.get("promptName") || ""
      ),
      categorySelection: refs.categorySelect
        ? refs.categorySelect.value
        : "",
      newCategoryMode: Boolean(
        refs.newCategoryField &&
        !refs.newCategoryField.hidden
      ),
      newCategory: refs.newCategoryInput
        ? refs.newCategoryInput.value
        : "",
      promptTypeSelection: refs.promptTypeSelect
        ? refs.promptTypeSelect.value
        : "",
      newPromptTypeMode: Boolean(
        refs.newPromptTypeField &&
        !refs.newPromptTypeField.hidden
      ),
      newPromptType: refs.newPromptTypeInput
        ? refs.newPromptTypeInput.value
        : "",
      useCase: String(
        form.get("useCase") || ""
      ),
      prompt: String(
        form.get("prompt") || ""
      ),
      status: String(
        form.get("status") || ""
      )
    });
  }


  function updateEditorBaseline_() {
    state.editorBaseline =
      getEditorSignature_();
  }


  function hasUnsavedEditorChanges_() {
    if (!state.editorReady || state.editorSaving) return false;

    return (
      state.editorBaseline !==
      getEditorSignature_()
    );
  }


  function requestCloseAddPromptDialog_() {
    if (
      hasUnsavedEditorChanges_() &&
      !window.confirm(
        "Discard your unsaved changes?"
      )
    ) {
      return;
    }

    closeAddPromptDialog(true);
    const returnHash = state.editorReturnHash || "#ai-prompt-library?view=explore";
    if (window.location.hash !== returnHash) window.location.hash = returnHash;
    handlePromptSubroute_();
  }


  function canWriteCommunity_() {
    return state.identityVerified && state.communityWritesEnabled;
  }

  function findCommunityPrompt_(id) {
    return state.prompts.concat(state.myPrompts).find(function (item) {
      return String(item.id || "") === String(id || "");
    });
  }

  function canEditCommunityPrompt_(prompt) {
    if (!prompt || !canWriteCommunity_()) return false;
    const actualAdminInView = state.adminView && getEffectiveRole() === "admin";
    const isAuthor = prompt.createdByEmail &&
      prompt.createdByEmail === state.currentUserEmail;
    // Phase 1 holds Draft editing and publishing even for verified authors.
    return Boolean(prompt.status === "Active" && (actualAdminInView || isAuthor));
  }

  function syncAdminUI() {
    const isAdmin = getEffectiveRole() === "admin";
    if (refs.addButton) {
      refs.addButton.hidden = !canWriteCommunity_();
      const actionWrap = refs.addButton.closest(".ai-prompt-create-floating");
      if (actionWrap) actionWrap.hidden = !canWriteCommunity_();
      // Preserve the CTA's inline SVG and accessible text: updating textContent
      // would destroy the markup. Visibility still follows verified-user writes.
      refs.addButton.setAttribute("aria-label", "Create a Prompt");
    }
    if (refs.detailAdminActions) {
      const prompt = findCommunityPrompt_(state.activePromptId);
      refs.detailAdminActions.hidden = !canEditCommunityPrompt_(prompt);
    }
    if (refs.detailDelete) {
      refs.detailDelete.hidden = !state.adminView || !isAdmin;
      refs.detailDelete.textContent = "Delete Permanently";
    }
    if (refs.filterStatusGroup) refs.filterStatusGroup.hidden = !isAdmin;
    if (!isAdmin && state.filters.statuses.length) state.filters.statuses = [];
    if (refs.communityIdentity) {
      let msg = "";
      if (!state.phase2Installed) msg = "Phase 2 setup is pending. Ask an administrator to run setupNexusPromptPhase2Sheets().";
      if (!state.identityVerified) {
        msg = "You can browse prompts, but community changes require a verified employee identity.";
      } else if (!state.communityWritesEnabled) {
        msg = "Community interaction is awaiting administrator activation after identity verification.";
      }
      refs.communityIdentity.hidden = !msg;
      refs.communityIdentity.textContent = msg;
    }
    syncCommunityView_();
    renderMissingSummary_();
    renderFilterSummary_();
  }

  // Phase 2: all discovery screens share the same listing controls/cards but
  // have independent, refreshable fragment routes. Never place user identities
  // in URLs; server data remains the authority for private actions.
  const LISTING_VIEWS_ = ["explore", "category", "search", "bookmarks", "for-you", "my-prompts", "moderation"];
  function buildListingHash_(view) {
    const target = LISTING_VIEWS_.includes(view) ? view : "explore";
    const params = new URLSearchParams();
    params.set("view", target);
    if (target === "category" || (target === "search" && state.category !== "all")) {
      params.set("name", state.category);
    }
    if (["search", "bookmarks", "my-prompts"].includes(target) && state.query) params.set("q", refs.search ? refs.search.value.trim() : state.query);
    if (!["for-you", "moderation"].includes(target)) {
      if (state.filters.promptTypes.length) params.set("types", state.filters.promptTypes.join("|"));
      if (state.filters.content !== "all") params.set("content", state.filters.content);
      if (state.filters.statuses.length && state.adminView) params.set("statuses", state.filters.statuses.join("|"));
      if (state.sortMode !== "top-upvoted") params.set("sort", state.sortMode);
      if (state.page > 1) params.set("page", String(state.page));
      if (target === "explore" && state.exploreExpanded) params.set("expanded", "1");
    }
    return "#ai-prompt-library?" + params.toString();
  }
  function replaceListingHash_(hash) {
    try {
      history.replaceState(history.state, "", location.pathname + location.search + hash);
    } catch (error) {
      // Some embedded hosting surfaces restrict History APIs. Hash routing
      // remains functional, although that fallback adds a history entry.
      window.location.hash = hash;
    }
  }
  function navigateListing_(view, options) {
    const opts = options || {};
    const target = LISTING_VIEWS_.includes(view) ? view : "explore";
    if (state.searchTimer && !opts.preserveSearchOrigin) { clearTimeout(state.searchTimer); state.searchTimer = null; }
    if (!opts.preserveSearchOrigin) state.searchOriginHash = "";
    state.activeView = target;
    const hash = buildListingHash_(target);
    if (opts.replace) {
      replaceListingHash_(hash);
      handlePromptSubroute_();
    } else if (window.location.hash !== hash) {
      window.location.hash = hash;
      handlePromptSubroute_();
    } else {
      state.lastAppliedListingHash = "";
      handlePromptSubroute_();
    }
  }
  function setCommunityView_(name) {
    const target = LISTING_VIEWS_.includes(name) ? name : "explore";
    const isAdmin = state.adminView && getEffectiveRole() === "admin";
    if (target === "moderation" && !isAdmin) return;
    if (["my-prompts", "bookmarks", "for-you"].includes(target) && !state.identityVerified) return;
    if (target === "bookmarks" && !state.phase2Installed) return;
    state.category = "all";
    state.query = "";
    if (refs.search) refs.search.value = "";
    state.filters = normalizeFilterState_({});
    state.page = 1;
    state.exploreExpanded = false;
    state.pageSize = target === "explore" ? 6 : 10;
    if (target === "for-you") { state.recommendationsData = null; state.recommendationsError = ""; }
    navigateListing_(target);
  }

  function syncCommunityView_() {
    const view = state.activeView;
    const isAdmin = state.adminView && getEffectiveRole() === "admin";
    if (view === "moderation" && !isAdmin) state.activeView = "explore";
    [
      [refs.communityExplore, "explore"],
      [refs.communityMy, "my-prompts"],
      [refs.phase2Bookmarks, "bookmarks"],
      [refs.phase3ForYou, "for-you"],
      [refs.phase2Moderation, "moderation"]
    ].forEach(function (entry) {
      const button = entry[0], page = entry[1];
      if (!button) return;
      const active = state.activeView === page || (page === "explore" && ["category", "search"].includes(state.activeView));
      button.classList.toggle("is-active", active);
      button.setAttribute("aria-current", active ? "page" : "false");
    });
    if (refs.communityMy) {
      refs.communityMy.disabled = !state.identityVerified;
      refs.communityMy.title = state.identityVerified ? "View your contributions" : "Identity verification required";
    }
    if (refs.phase2Bookmarks) refs.phase2Bookmarks.hidden = !state.phase2Installed || !state.identityVerified;
    if (refs.phase2Moderation) refs.phase2Moderation.hidden = !state.phase2Installed || !isAdmin;
    if (refs.phase3ForYou) refs.phase3ForYou.hidden = !state.identityVerified;
    if (state.root) state.root.classList.toggle("is-explore-view", ["explore", "category", "search", "bookmarks", "for-you"].includes(state.activeView));
    const isRecommended = state.activeView === "for-you";
    if (refs.communitySort) refs.communitySort.disabled = state.activeView === "moderation" || isRecommended;
    if (refs.categories) refs.categories.hidden = state.activeView !== "explore";
    if (refs.missingSummary) refs.missingSummary.hidden = state.activeView !== "explore";
    const searchToolbar = state.root && state.root.querySelector(".ai-prompt-library-toolbar");
    if (searchToolbar) searchToolbar.hidden = isRecommended || state.activeView === "moderation";
    if (refs.activeFilters) refs.activeFilters.hidden = isRecommended || state.activeView === "moderation" || !hasActiveFilters_();
    renderDiscoveryBreadcrumbs_();
    if (state.activeView === "moderation") loadPhase2Reports_();
    if (isRecommended && state.libraryLoaded && state.identityVerified && !state.recommendationsData && !state.recommendationsLoading && !state.recommendationsError) {
      loadRecommendedPrompts_();
    }
  }

  function loadLibrary() {
    if (!state.root || state.loading) return;

    state.loading = true;
    setLoadingState();

    if (!isAppsScriptAvailable()) {
      state.loading = false;
      setErrorState("The Prompt Library is available when Nexus is running through Google Apps Script.");
      return;
    }

    try {
      google.script.run
        .withSuccessHandler(function (response) {
          state.loading = false;
          const payload = response && typeof response === "object" ? response : {};
          state.adminView = payload.adminView === true;
          state.identityVerified = payload.identityVerified === true;
          state.communityWritesEnabled = payload.communityWritesEnabled === true;
          state.phase2Installed = payload.phase2Installed === true;
          state.libraryLoaded = true;
          state.recommendationsData = null;
          state.recommendationsError = "";
          state.currentUserEmail = String(payload.currentUserEmail || "").toLowerCase();
          state.myPrompts = Array.isArray(payload.myPrompts) ? payload.myPrompts : [];
          state.prompts = Array.isArray(payload.prompts) ? payload.prompts : [];
          state.categories = Array.isArray(payload.categories)
            ? payload.categories
            : deriveCategories(state.prompts);

          state.categoryOptions = Array.isArray(payload.categoryOptions)
            ? payload.categoryOptions
            : deriveCategoryOptions(state.prompts);

          state.promptTypeOptions = Array.isArray(payload.promptTypeOptions)
            ? payload.promptTypeOptions
            : derivePromptTypeOptions(state.prompts);

          if (
            state.category !== "all" &&
            !state.categories.some(function (category) { return category.name === state.category; })
          ) {
            state.category = "all";
          }

          populateCategorySelect();
          populatePromptTypeSelect();
          populateExploreQuickFilters_();
          syncAdminUI();
          sanitizeActiveFilters_();
          renderFilterControls_(state.filters);
          renderMissingSummary_();
          renderFilterSummary_();
          renderCategoryFilters();
          renderLibrary();
          state.lastAppliedListingHash = "";
          handlePromptSubroute_();
          // A cold deep link may finish detail validation before the
          // registry response. Synchronize access-dependent actions and
          // related recommendations after the listing finishes loading.
          if (state.isDetailRoute && state.activePromptId) {
            const active = findCommunityPrompt_(state.activePromptId);
            if (active && active.status === "Active") {
              updateCommunityEngagement_(active);
              updatePhase2Details_(active);
              renderPhase1Related_(active);
            }
          }
        })
        .withFailureHandler(function (error) {
          state.loading = false;
          console.error("[AI Prompt Library] Failed to load prompts:", error);
          setErrorState(getErrorMessage(error, "Unable to load the Prompt Library."));
        })
        .getAIPromptLibrary({
          viewMode: getEffectiveRole()
        });
    } catch (error) {
      state.loading = false;
      console.error(
        "[AI Prompt Library] Unable to start the prompt-library request:",
        error
      );
      setErrorState(
        getErrorMessage(
          error,
          "Unable to start the Prompt Library request."
        )
      );
    }
  }

    if (refs.count) {
      refs.count.textContent =

    if (refs.categories) {
      refs.categories.replaceChildren();
      refs.categories.classList.remove(
        "is-grid-view",

      );
    }

    if (refs.results) {
      refs.results.replaceChildren();
    }

    if (refs.pagination) {

      refs.pagination.replaceChildren();

    if (!refs.status) return;

    refs.status.className =
      "ai-prompt-library-state is-error";

    if (refs.statusTitle) {
      refs.statusTitle.textContent =
        "Prompt Library unavailable";

  function setEmptyState() {
    if (!refs.status) return;

    refs.status.hidden = false;
    refs.status.className =
      "ai-prompt-library-state is-empty";

    if (refs.retry) {
      refs.retry.hidden = true;

    let title = "No prompts found";
    let message =
      "No prompts match the current view.";
    let action = "";
    let actionLabel = "";

    const rawQuery = refs.search
      ? refs.search.value.trim()
      : "";

    if (state.activeView === "bookmarks" && !state.prompts.some(function(p){return p.status === "Active" && p.bookmarkedByMe;})) {
      title = "No saved prompts yet";
      message = "Explore published prompts and use the bookmark icon to save your favorites.";
      action = "browse";
      actionLabel = "Explore prompts";
    } else if (state.activeView === "my-prompts" && !state.myPrompts.some(function(p){return p.status === "Active";})) {
      title = "No published prompts yet";
      message = "Use + Create a Prompt to publish your first contribution. Draft management is currently on hold.";
    } else if (state.query) {
      title = rawQuery
        ? 'No prompts match "' + rawQuery + '"'
        : "No prompts match your search";
      message =
        "Try another keyword or clear your search.";
      action = "search";
      actionLabel = "Clear search";
    } else if (hasActiveFilters_()) {
      title =
        "No prompts match these filters";
      message =
        "Try removing one or more filters to broaden the results.";
      action = "filters";
      actionLabel = "Clear filters";
    } else if (state.category !== "all") {
      title =
        "No prompts in " + state.category;
      message =
        "This category does not currently contain prompts visible in this view.";
      action = "category";
      actionLabel = "All categories";
    } else if (!state.prompts.length) {
      title = "No prompts available yet";
      message =
        "The Prompt Library does not have any prompts available in this view.";
    }

    if (refs.statusTitle) {
      refs.statusTitle.textContent = title;
    }

    if (refs.statusText) {
      refs.statusText.textContent = message;
    }

    if (refs.stateAction) {
      refs.stateAction.hidden = !action;

      if (action) {
        refs.stateAction.textContent =
          actionLabel;
        refs.stateAction.dataset.aiPromptStateAction =
          action;
      } else {

  function getCategoryMonogram_(categoryName) {
    const words = String(categoryName || "")
      .trim()
      .split(/\s+/)
      .map(function (word) {
        return word.replace(/[^A-Za-z0-9]/g, "");
      })
      .filter(Boolean);

    if (!words.length) {
      return "NA";
    }

    if (words.length >= 2) {
      return (
        words[0].charAt(0) +
        words[1].charAt(0)
      ).toUpperCase();
    }

    const compact = words[0].toUpperCase();

    if (compact.length === 1) {
      return compact;
    }

    return compact.slice(0, 2);
  }


  function getCategoryAccentClass_(categoryName) {
    const value = String(categoryName || "");
    let hash = 0;

    for (let index = 0; index < value.length; index += 1) {
      hash = (
        (hash * 31) +
        value.charCodeAt(index)
      ) >>> 0;
    }

    return "is-accent-" + (hash % 6);
  }

      renderPhase2Moderation_();
      return;

    if (refs.count) {
      refs.count.textContent = state.activeView === "my-prompts"
        ? pluralizePrompt(state.myPrompts.filter(function(p) {return p.status === "Active";}).length)

  function getVisiblePrompts() {
    let prompts = state.activeView === "my-prompts"
      ? state.myPrompts.filter(function(p) {return p.status === "Active";})
      : state.activeView === "bookmarks"
        ? state.prompts.filter(function(p){return p.bookmarkedByMe && p.status === "Active";})
        : state.prompts.slice();

    if (["category", "search"].includes(state.activeView)) {
      prompts = prompts.filter(function (prompt) {return prompt.status === "Active";});
    }
    if (state.query) {
      prompts = prompts.filter(
        function (prompt) {
          return getSearchText(prompt).includes(
            state.query
          );
        }
      );
    }
    if (state.category !== "all") {
      prompts = prompts.filter(
        function (prompt) {
          return (
            prompt.category ===
            state.category
          );
        }
      );
    }

    if (state.filters.promptTypes.length) {
      prompts = prompts.filter(
        function (prompt) {
          return state.filters.promptTypes.includes(
            prompt.promptType
          );
        }
      );
    }

    if (state.filters.content === "has") {
      prompts = prompts.filter(
        hasPromptContent_
      );
    }

    if (state.filters.content === "missing") {
      prompts = prompts.filter(
        function (prompt) {
          return !hasPromptContent_(prompt);
        }
      );
    }

    if (
      getEffectiveRole() === "admin" &&
      state.filters.statuses.length
    ) {
      prompts = prompts.filter(
        function (prompt) {
          return state.filters.statuses.includes(
            prompt.status
          );
        }
      );
    }

    prompts.sort(function (a, b) {
      const votes = function (p) { return Math.max(0, Number(p.upvoteCount) || 0); };
      const copies = function (p) { return Math.max(0, Number(p.copyCount) || 0); };
      const name = function (x, y) { return String(x.promptName || "").localeCompare(String(y.promptName || ""), undefined, {sensitivity:"base"}); };
      let result = 0;
      if (state.sortMode === "most-copied") result = copies(b)-copies(a) || votes(b)-votes(a);
      else if (state.sortMode === "newest") {
        const ta = a.createdAt ? Date.parse(a.createdAt) || 0 : 0;
        const tb = b.createdAt ? Date.parse(b.createdAt) || 0 : 0;
        result = tb-ta;
      } else if (state.sortMode === "top-upvoted") result = votes(b)-votes(a) || copies(b)-copies(a);
      return result || name(a,b) || String(a.id||"").localeCompare(String(b.id||""));
    });

    return prompts;
  }


  function enablePromptTableHorizontalGestures_(shell) {
    if (!shell || shell.dataset.horizontalGestureReady === "true") {
      return;
    }

    shell.dataset.horizontalGestureReady = "true";

    const getMaxScroll = function () {
      return Math.max(
        0,
        shell.scrollWidth - shell.clientWidth
      );
    };

    const keepInsideScrollableRange = function () {
      const maxScroll = getMaxScroll();

      if (maxScroll <= 2) {
        return;
      }

      // Browser history gestures are commonly triggered when a horizontal
      // scroller is already at its absolute left/right boundary. Keeping a
      // 1px buffer is visually imperceptible but prevents the page from
      // "taking over" the trackpad gesture at the table edge.
      if (shell.scrollLeft <= 0) {
        shell.scrollLeft = 1;
      } else if (shell.scrollLeft >= maxScroll) {
        shell.scrollLeft = maxScroll - 1;
      }
    };

    const handleHorizontalWheel = function (event) {
      const absX = Math.abs(event.deltaX);
      const absY = Math.abs(event.deltaY);

      // Only intercept gestures that are clearly horizontal.
      // Mostly vertical/diagonal trackpad gestures continue bubbling so
      // the full page scrolls normally.
      const horizontalIntent =
        event.shiftKey ||
        (
          absX >= 6 &&
          absX > absY * 1.15
        );

      if (!horizontalIntent) {
        return;
      }

      let delta = event.deltaX;

      if (event.shiftKey && absX < 0.01) {
        delta = event.deltaY;
      }

      if (Math.abs(delta) < 0.01) {
        return;
      }

      const maxScroll = getMaxScroll();

      if (maxScroll <= 0) {
        return;
      }

      // Capture the gesture before the browser can interpret it as
      // back/forward history navigation.
      event.preventDefault();
      event.stopPropagation();
      if (typeof event.stopImmediatePropagation === "function") {
        event.stopImmediatePropagation();
      }

      keepInsideScrollableRange();

      const next = Math.max(
        1,
        Math.min(
          maxScroll - 1,
          shell.scrollLeft + delta
        )
      );

      shell.scrollLeft = next;
    };

    shell.addEventListener(
      "wheel",
      handleHorizontalWheel,
      {
        passive: false,
        capture: true
      }
    );

    shell.addEventListener(
      "mouseenter",
      keepInsideScrollableRange
    );

    shell.addEventListener(
      "pointerenter",
      keepInsideScrollableRange
    );

    shell.addEventListener(
      "scroll",
      function () {
        window.requestAnimationFrame(
          keepInsideScrollableRange
        );
      },
      { passive: true }
    );

    // Apply the 1px edge buffer after layout has calculated scrollWidth.
    window.requestAnimationFrame(
      keepInsideScrollableRange
    );
  }

  function appendHighlightedText_(
    element,
    text,
    query
  ) {
    if (!element) return;

    const value = String(text || "");
    const needle = String(query || "").trim();

    if (!needle) {
      element.textContent = value;
      return;
    }

    const lower = value.toLowerCase();
    const lowerNeedle = needle.toLowerCase();
    let cursor = 0;
    let matchIndex = lower.indexOf(
      lowerNeedle,
      cursor
    );

    while (matchIndex !== -1) {
      if (matchIndex > cursor) {
        element.appendChild(
          document.createTextNode(
            value.slice(cursor, matchIndex)
          )
        );
      }

      const mark = document.createElement("mark");
      mark.className =
        "ai-prompt-search-highlight";
      mark.textContent = value.slice(
        matchIndex,
        matchIndex + needle.length
      );
      element.appendChild(mark);

      cursor = matchIndex + needle.length;
      matchIndex = lower.indexOf(
        lowerNeedle,
        cursor
      );
    }

    if (cursor < value.length) {
      element.appendChild(
        document.createTextNode(
          value.slice(cursor)
        )
      );
    }
  }

  function renderPagination(
    totalItems,
    totalPages,
    startIndex,
    pageItemCount
  ) {
    if (!refs.pagination) return;

    refs.pagination.replaceChildren();

    if (totalPages <= 1) {
      refs.pagination.hidden = true;
      return;
    }

    refs.pagination.hidden = false;

    const summary = document.createElement("p");
    summary.className = "ai-prompt-pagination-summary";

    const first = startIndex + 1;
    const last = startIndex + pageItemCount;

    summary.textContent =
      "Showing " +
      first +
      "–" +
      last +
      " of " +
      totalItems +
      " prompts";

    const controls = document.createElement("div");
    controls.className = "ai-prompt-pagination-controls";

    controls.appendChild(
      createPageButton(
        "Previous",
        state.page - 1,
        state.page === 1,
        "previous"
      )
    );

    getPaginationPages(totalPages).forEach(
      function (page) {
        if (page === "ellipsis") {
          const ellipsis = document.createElement("span");
          ellipsis.className = "ai-prompt-pagination-ellipsis";
          ellipsis.textContent = "…";
          controls.appendChild(ellipsis);
          return;
        }

        const button = createPageButton(
          String(page),
          page,
          false,
          "page"
        );

        if (page === state.page) {
          button.classList.add("is-active");
          button.setAttribute("aria-current", "page");
        }

        controls.appendChild(button);
      }
    );

    controls.appendChild(
      createPageButton(
        "Next",
        state.page + 1,
        state.page === totalPages,
        "next"
      )
    );

    refs.pagination.append(summary, controls);

  function createPageButton(
    label,
    page,
    disabled,
    kind
  ) {
    const button = document.createElement("button");
    button.type = "button";
    button.className =
      "ai-prompt-pagination-button is-" +
      String(kind || "page");

    button.dataset.aiPromptPage = String(page);
    button.textContent = label;
    button.disabled = Boolean(disabled);

    return button;
  }


  function getPaginationPages(totalPages) {
    if (totalPages <= 7) {
      return Array.from(
        { length: totalPages },
        function (_, index) {
          return index + 1;
        }
      );
    }

    const pages = [1];
    const start = Math.max(2, state.page - 1);
    const end = Math.min(
      totalPages - 1,
      state.page + 1
    );

    if (start > 2) {
      pages.push("ellipsis");
    }

    for (let page = start; page <= end; page += 1) {
      pages.push(page);
    }

    if (end < totalPages - 1) {
      pages.push("ellipsis");
    }

    pages.push(totalPages);

    return pages;
  }

    return badge;

  // ============================================================
  // Prompt Hub hero lifecycle (embedded Google Sites safe)
  //
  // Unlike the previous implementation, this does NOT depend on
  // document.scrollingElement moving, and does NOT cancel/replay clicks.
  // A real CSS height transition collapses the hero while normal button,
  // link, input and route handlers run unchanged.  Manual scrolling inside
  // the web app also dismisses the hero. In Google Sites, scrolling the
  // OUTER parent page cannot always be observed from the embedded iframe.
  // ============================================================
  function promptHeroApp_() {
    return document.getElementById("nexus-app");
  }

  function stopPromptHeroAnimation_() {
    if (state.promptHeroAnimationFrame) cancelAnimationFrame(state.promptHeroAnimationFrame);
    state.promptHeroAnimationFrame = 0;
    if (state.promptHeroFinishTimer) clearTimeout(state.promptHeroFinishTimer);
    state.promptHeroFinishTimer = 0;
    state.promptHeroAnimating = false;
  }

  function resetPromptHeroStyles_() {
    if (!refs.hero) return;
    refs.hero.hidden = false;
    refs.hero.style.removeProperty("height");
    refs.hero.style.removeProperty("min-height");
    refs.hero.style.removeProperty("max-height");
    refs.hero.style.removeProperty("opacity");
    refs.hero.classList.remove("is-scroll-faded");
    ["--hero-scroll-opacity", "--hero-copy-opacity", "--hero-media-scale", "--hero-copy-offset"].forEach(function (key) {
      refs.hero.style.removeProperty(key);
    });
  }

  function enterPromptHeroVisit_() {
    if (state.promptHeroVisitActive) return;
    stopPromptHeroAnimation_();
    state.promptHeroVisitActive = true;
    state.promptHeroDismissed = false;
    state.promptHeroWasVisible = false;
    state.promptHeroScrollSuppressUntil = performance.now() + 35;
    if (state.root) {
      state.root.classList.remove("is-prompt-hero-dismissed", "is-prompt-hero-collapsing");
    }
    const app = promptHeroApp_();
    if (app) app.classList.remove("nexus-prompt-hero-gone");
    resetPromptHeroStyles_();
    // Do not force top-of-document scroll in an embedded Google Sites page:
    // the parent document may be the real scroll owner.
  }

  function exitPromptHeroVisit_() {
    if (!state.promptHeroVisitActive) return;
    stopPromptHeroAnimation_();
    state.promptHeroVisitActive = false;
    state.promptHeroDismissed = false;
    if (state.root) {
      state.root.classList.remove("is-prompt-hero-dismissed", "is-prompt-hero-collapsing");
    }
    const app = promptHeroApp_();
    if (app) app.classList.remove("nexus-prompt-hero-gone");
    resetPromptHeroStyles_();
  }

  function promptHeroModuleActive_() {
    const page = state.root && state.root.closest(".route-page");
    return !!(state.promptHeroVisitActive &&
      window.location.hash.slice(1).split("?")[0] === "ai-prompt-library" &&
      (!page || !page.hidden) && !state.isDetailRoute);
  }

  function completePromptHeroCollapse_() {
    if (!state.promptHeroVisitActive || !state.promptHeroDismissed) return;
    stopPromptHeroAnimation_();
    if (refs.hero) {
      refs.hero.hidden = true;
      refs.hero.style.removeProperty("height");
      refs.hero.style.removeProperty("min-height");
      refs.hero.style.removeProperty("max-height");
      refs.hero.style.removeProperty("opacity");
    }
    if (state.root) {
      state.root.classList.remove("is-prompt-hero-collapsing");
      state.root.classList.add("is-prompt-hero-dismissed");
    }
    const app = promptHeroApp_();
    if (app) app.classList.add("nexus-prompt-hero-gone");
  }

  function dismissPromptHero_(animate) {
    if (!state.promptHeroVisitActive || state.promptHeroDismissed || !refs.hero) return false;
    state.promptHeroDismissed = true; // Cannot reappear until next entry.
    const app = promptHeroApp_();
    if (app) app.classList.add("nexus-prompt-hero-gone");

    if (!animate || refs.hero.hidden || state.isDetailRoute ||
        (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches)) {
      completePromptHeroCollapse_();
      return true;
    }
    // Measure before changing min-height: the shared Nexus hero styles
    // impose their own responsive min-heights.
    const pixels = Math.max(0, refs.hero.getBoundingClientRect().height);
    if (pixels < 2) {
      completePromptHeroCollapse_();
      return true;
    }
    state.promptHeroAnimating = true;
    refs.hero.style.setProperty("height", pixels + "px", "important");
    refs.hero.style.setProperty("min-height", pixels + "px", "important");
    refs.hero.style.setProperty("max-height", pixels + "px", "important");
    // Force layout so the browser sees the start and end values separately.
    void refs.hero.offsetHeight;
    if (state.root) state.root.classList.add("is-prompt-hero-collapsing");
    state.promptHeroAnimationFrame = requestAnimationFrame(function () {
      if (!state.promptHeroVisitActive || !state.promptHeroDismissed || !refs.hero) return;
      refs.hero.style.setProperty("height", "0px", "important");
      refs.hero.style.setProperty("min-height", "0px", "important");
      refs.hero.style.setProperty("max-height", "0px", "important");
      refs.hero.style.setProperty("opacity", "0", "important");
    });
    state.promptHeroFinishTimer = setTimeout(completePromptHeroCollapse_, 540);
    return true;
  }

  function onPromptHeroManualScroll_() {
    if (!promptHeroModuleActive_() || state.promptHeroDismissed ||
        !refs.hero || refs.hero.hidden || performance.now() < state.promptHeroScrollSuppressUntil) return;
    const header = document.getElementById("nexus-nav-header");
    const headerBottom = header ? Math.max(0, header.getBoundingClientRect().bottom) : 0;
    const heroBottom = refs.hero.getBoundingClientRect().bottom;
    if (heroBottom <= headerBottom + 2 || refs.hero.classList.contains("is-scroll-faded")) {
      // Already scrolled out: hide immediately; no second layout animation.
      dismissPromptHero_(false);
    }
  }

  function bindPromptHeroInteractions_(root) {
    // Capture clicks but NEVER preventDefault, stop propagation or replay
    // event targets. That previously broke real interactions in the iframe.
    root.addEventListener("click", function (event) {
      if (!promptHeroModuleActive_() || state.promptHeroDismissed || !refs.hero || refs.hero.hidden) return;
      const target = event.target && event.target.closest ? event.target.closest(
        "button, a[href], input, select, textarea, [role='button'], [data-ai-prompt-open], [data-ai-prompt-category], .ai-prompt-feed-card, .ai-prompt-library-row"
      ) : null;
      if (!target || !root.contains(target) || target.disabled ||
          target.closest("dialog, [role='dialog'], .ai-prompt-phase1-detail-page")) return;
      if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
      dismissPromptHero_(true);
    }, true);

    window.addEventListener("scroll", onPromptHeroManualScroll_, { passive: true });
    const workspace = document.getElementById("nexus-workspace");
    if (workspace) workspace.addEventListener("scroll", onPromptHeroManualScroll_, { passive: true });
    // Catch nested app scroll containers without relying on a single scroll owner.
    root.addEventListener("scroll", onPromptHeroManualScroll_, { passive: true, capture: true });
    if (typeof IntersectionObserver === "function" && refs.hero) {
      const observer = new IntersectionObserver(function (entries) {
        if (!promptHeroModuleActive_() || state.promptHeroDismissed ||
            performance.now() < state.promptHeroScrollSuppressUntil) return;
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            state.promptHeroWasVisible = true;
          } else if (state.promptHeroWasVisible) {
            // May also detect a Google Sites embed clipped by its parent's
            // viewport (browser dependent; cross-origin scrolling is not
            // directly readable from the embedded web app).
            dismissPromptHero_(false);
          }
        });
      }, { threshold: [0] });
      observer.observe(refs.hero);
      state.promptHeroObserver = observer;
    }
  }

  // Phase 2 subrouter, sharing the existing Phase 1 prompt-detail screen.
  function parsePhase1Subroute_() {
    const hash = String(window.location.hash || "").replace(/^#/, "");
    const parts = hash.split("?");
    if (parts[0] !== "ai-prompt-library") return null;
    const params = new URLSearchParams(parts.slice(1).join("?"));
    const rawView = params.get("view") || "explore";
    const view = ["prompt", "new", "edit"].includes(rawView) || LISTING_VIEWS_.includes(rawView) ? rawView : "explore";
    const id = String(params.get("id") || "").trim();
    return {
      view: view, id: /^[a-zA-Z0-9_-]{1,80}$/.test(id) ? id : "",
      name: String(params.get("name") || "").trim().slice(0, 120),
      q: String(params.get("q") || "").trim().slice(0, 300),
      types: String(params.get("types") || "").split("|").filter(Boolean).slice(0, 12),
      content: ["all", "has", "missing"].includes(params.get("content")) ? params.get("content") : "all",
      statuses: String(params.get("statuses") || "").split("|").filter(Boolean).slice(0, 6),
      sort: ["top-upvoted", "most-copied", "newest", "name"].includes(params.get("sort")) ? params.get("sort") : "top-upvoted",
      page: Math.min(100000, Math.max(1, parseInt(params.get("page"), 10) || 1)),
      expanded: params.get("expanded") === "1"
    };
  }

  function applyListingRoute_(route) {

    if (state.libraryLoaded && ((privateView && !state.identityVerified) || (view === "bookmarks" && !state.phase2Installed) || (view === "moderation" && !admin))) {
      view = "explore";
      replaceListingHash_("#ai-prompt-library?view=explore");
    }
    state.activeView = view;
    state.category = ["category", "search"].includes(view) && route.name ? route.name : "all";
    state.query = ["search", "bookmarks", "my-prompts"].includes(view) ? route.q.toLowerCase() : "";
    if (refs.search) refs.search.value = ["search", "bookmarks", "my-prompts"].includes(view) ? route.q : "";
    state.sortMode = route.sort;
    state.filters = normalizeFilterState_({
      promptTypes: route.types, content: route.content,

  function showPhase1DetailState_(title, message, isLoading) {

    if (refs.detailState) {
      refs.detailState.hidden = false;
      // Only the in-flight request animates. Not-found and permission/error

  // Phase 3: dedicated routes, scoped to published-prompt authoring.
  function showPhase3EditorAccess_(title, message) {

    if (refs.editorAccessMessage) refs.editorAccessMessage.textContent = message;
    if (refs.editorAccess) refs.editorAccess.hidden = false;

    if (shell) shell.hidden = true;

  function setPhase3Layout_(editing) {
    const editorVisible = Boolean(editing);
    // Moving from Details to Edit invalidates cached detail reads. Otherwise
    // Save -> Prompt Details could reuse stale content for the same prompt ID.
    if (editorVisible && state.root && !state.root.classList.contains("is-phase3-editor-route")) {
      state.detailRequestId += 1;
      state.lastDetailId = "";
      state.activePromptId = "";

    if (state.root) state.root.classList.toggle("is-phase3-editor-route", editorVisible);
    if (refs.addButton) refs.addButton.classList.toggle("is-editor-active", editorVisible);
    if (refs.addDialog) refs.addDialog.hidden = !editorVisible;
    if (refs.hero) refs.hero.hidden = editorVisible || state.promptHeroDismissed;
    if (refs.listContent) refs.listContent.hidden = editorVisible;
    if (refs.detailPage) refs.detailPage.hidden = true;
    if (state.root) state.root.classList.remove("is-phase1-detail-route");

  function handlePhase3EditorRoute_(route) {
    const edit = route.view === "edit";
    setPhase3Layout_(true);
    dismissPromptHero_(false);
    const key = edit ? "edit:" + route.id : "new";
    // Keep partially completed form intact if the global shell rerenders.
    if (state.editorReady && state.editorRouteKey === key) return;
    if (!state.libraryLoaded) {
      showPhase3EditorAccess_("Loading editor…", "Checking your verified Workspace identity and publishing permissions.");
      return;
    }
    if (!canWriteCommunity_()) {
      showPhase3EditorAccess_("Publishing unavailable", "Your account must be verified and community contributions must be enabled.");
      return;
    }
    let prompt = null;
    if (edit) {
      prompt = state.myPrompts.find(function (item) {return item.id === route.id;});
      if (!prompt && state.adminView && getEffectiveRole() === "admin") {
        prompt = state.prompts.find(function (item) {return item.id === route.id;});
      }
      if (!prompt || !canEditCommunityPrompt_(prompt)) {
        showPhase3EditorAccess_("Prompt unavailable", "Only the verified creator or a real administrator may edit a published prompt.");
        return;

    state.editorRouteHash = window.location.hash;

  function handlePromptSubroute_() {
    if (!state.root) return;
    const route = parsePhase1Subroute_();
    const incomingKey = route && (route.view === "edit" ? "edit:" + route.id : route.view === "new" ? "new" : "");
    if (state.editorReady && state.editorRouteKey !== incomingKey && hasUnsavedEditorChanges_()) {
      if (!window.confirm("Discard your unsaved prompt changes?")) {
        replaceListingHash_(state.editorRouteHash);
        return;
      }
    }
    if (state.editorReady && state.editorRouteKey !== incomingKey) closeAddPromptDialog(true);
    if (!route) {
      exitPromptHeroVisit_();
      // Another global NEXUS page was selected; invalidate pending detail reads.
      if (state.isDetailRoute) {
        state.detailRequestId += 1;
        state.lastDetailId = "";
        state.activePromptId = "";
        setPhase1Layout_(false);
      }
      return;
    }
    enterPromptHeroVisit_();
    if (route.view === "new" || route.view === "edit") {
      handlePhase3EditorRoute_(route);
      return;
    }
    if (state.root) state.root.classList.remove("is-phase3-editor-route");
    if (refs.addButton) refs.addButton.classList.remove("is-editor-active");
    if (refs.addDialog) refs.addDialog.hidden = true;
    if (refs.listContent) refs.listContent.hidden = false;
    // Opening a prompt from a direct link is already a content-first entry.
    // Keep the hero out of subsequent listing navigation in this visit.
    if (route.view === "prompt" && !state.promptHeroDismissed) {
      dismissPromptHero_(false);
    }
    if (route.view !== "prompt") {
      const returnedFromDetail = state.isDetailRoute;
      if (returnedFromDetail) {
        state.detailRequestId += 1;
        state.lastDetailId = "";
        state.activePromptId = "";
        setPhase1Layout_(false);
      }
      const hash = window.location.hash;
      if (!returnedFromDetail && state.lastAppliedListingHash === hash) return;
      state.lastAppliedListingHash = hash;
      applyListingRoute_(route);
      if (returnedFromDetail && state.listingContext && state.listingContext.routeHash === hash) {
        const scroll = state.listingContext.scroll;
        requestAnimationFrame(function () {
          if (document.scrollingElement) document.scrollingElement.scrollTop = scroll;
        });
      }
      return;
    }
    const wasDetail = state.isDetailRoute;
    setPhase1Layout_(true);
    if (!wasDetail || state.lastDetailId !== route.id) {
      requestAnimationFrame(function () {
        if (state.isDetailRoute && document.scrollingElement) {

        }
      });

      state.detailRequestId += 1;
      state.lastDetailId = "";
      state.activePromptId = "";
      showPhase1DetailState_("Prompt unavailable", "This prompt link is invalid. Return to the library to browse published prompts.");
      return;
    }
    // Avoid repeated reads from global route re-renders or simultaneous hash/popstate.
    if (state.lastDetailId === route.id) return;
    state.lastDetailId = route.id;
    state.activePromptId = "";
    const request = ++state.detailRequestId;
    showPhase1DetailState_("Getting your prompt ready…", "Fetching the published prompt and checking your access.", true);
    if (!isAppsScriptAvailable()) {
      showPhase1DetailState_("Prompt unavailable", "Open the NEXUS web app to read this prompt.");
      return;
    }
    google.script.run.withSuccessHandler(function (response) {
      if (request !== state.detailRequestId || !state.isDetailRoute) return;
      if (!response || response.ok !== true || !response.prompt || response.prompt.status !== "Active") {
        showPhase1DetailState_("Prompt unavailable", "This prompt is not published, has been removed, or you do not have access.");
        return;
      }

    if (!button) return;

    const previousTitle =
      button.getAttribute("title") || "Copy prompt";

      button.getAttribute("aria-label") || "Copy prompt";

        '<path d="m5 12 4 4L19 6"></path>',
        '</svg>',
        '<span>Copied!</span>'
      ].join("");

    window.setTimeout(function () {
