      "sofa-pitchbook":

        "off-mcloud-eo",

      // ---------------------------------------------------------

      "msoc-pitchbook":

      "quote-staff-aug":
        "off-msa-gaq"
    });

  const OFFERINGS_CONFIG =
    Object.freeze({
      namespace: "offerings",
      pageLabel: "Offerings",
      actionAttribute:
        "data-offerings-action",
      links: OFFERINGS_LINKS
    });

  function syncRenderedLinks(pageRoot) {
    if (!pageRoot || !window.NexusManagedLinks) return;

    // Always provide the complete Offerings action map. Initializing the
    // shared runtime without this config can register an empty namespace,
    // leaving the matrix cards unable to open Coming Soon/admin dialogs.
    window.NexusManagedLinks.initialize(pageRoot, OFFERINGS_CONFIG);
  }

  function initialize(pageRoot) {
    if (!pageRoot) return;

    // Render dynamic matrix/product buttons before registering managed links.
    // The matrix calls syncRenderedLinks again after a filter/view rerender.
    if (window.NexusOfferingsMatrix) {
      window.NexusOfferingsMatrix.initialize(pageRoot);
    }
    syncRenderedLinks(pageRoot);
  }

  function refresh(pageRoot) {
    if (
      !pageRoot ||
      !window.NexusManagedLinks
    ) {
      return;
    }

    window.NexusManagedLinks
      .refresh(pageRoot);
  }

  function getConfiguredLinkKeys() {
    return Object.keys(
      OFFERINGS_LINKS
    ).map(function (action) {
      return OFFERINGS_LINKS[action];
    });
  }

  window.NexusOfferingsLinks =
    Object.freeze({
      initialize: initialize,
      syncRenderedLinks: syncRenderedLinks,
      refresh: refresh,
      getConfiguredLinkKeys:
        getConfiguredLinkKeys
    });
}());
</script>
