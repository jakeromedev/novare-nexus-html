<script>
(function () {
  "use strict";

  /*
   * ONESCA — H2 Offerings managed-link configuration
   *
   * The page markup already exposes readable data-offerings-action
   * identifiers. This module maps those actions to stable managed-link
   * keys in the existing 06_Assets registry.
   *
   * The shared Scripts_ManagedLinks.html runtime owns:
   * - getManagedLinks()
   * - URL validation
   * - ready / missing states
   * - loader behavior
   * - Coming Soon
   * - new-tab opening
   */

  const OFFERINGS_LINKS =
    Object.freeze({
      // ---------------------------------------------------------
      // CORE OFFERINGS — SOFA 2.0
      // ---------------------------------------------------------
      "sofa-pitchbook":
        "off-sofa2-pb",

      "sofa-discovery-guide":
        "off-sofa2-dg",

      "sofa-standard-proposal":
        "off-sofa2-sp",

      "explore-sofa":
        "off-sofa2-eo",

      // ---------------------------------------------------------
      // CORE OFFERINGS — RAFA
      // ---------------------------------------------------------
      "rafa-pitchbook":
        "off-rafa-pb",

      "rafa-discovery-guide":
        "off-rafa-dg",

      "rafa-standard-proposal":
        "off-rafa-sp",

      "explore-rafa":
        "off-rafa-eo",

      // ---------------------------------------------------------
      // CORE OFFERINGS — MCLOUD
      // ---------------------------------------------------------
      "mcloud-pitchbook":
        "off-mcloud-pb",

      "mcloud-discovery-guide":
        "off-mcloud-dg",

      "mcloud-standard-proposal":
        "off-mcloud-sp",

      "explore-mcloud":
        "off-mcloud-eo",

      // ---------------------------------------------------------
      // CORE OFFERINGS — MSOC
      // ---------------------------------------------------------
      "msoc-pitchbook":
        "off-msoc-pb",

      "msoc-discovery-guide":
        "off-msoc-dg",

      "msoc-standard-proposal":
        "off-msoc-sp",

      "explore-msoc":
        "off-msoc-eo",

      // ---------------------------------------------------------
      // CORE OFFERINGS — MS
      // ---------------------------------------------------------
      "ms-pitchbook":
        "off-ms-pb",

      "ms-discovery-guide":
        "off-ms-dg",

      "ms-standard-proposal":
        "off-ms-sp",

      "explore-ms":
        "off-ms-eo",

      // ---------------------------------------------------------
      // AI ACCELERATOR — AI EDUCATION
      // ---------------------------------------------------------
      "ai-education-pitchbook":
        "off-aie-pb",

      "ai-education-discovery-guide":
        "off-aie-dg",

      "ai-education-standard-proposal":
        "off-aie-sp",

      "explore-ai-education":
        "off-aie-eo",

      // ---------------------------------------------------------
      // AI ACCELERATOR — PERSONAL AI
      // ---------------------------------------------------------
      "personal-ai-pitchbook":
        "off-pai-pb",

      "personal-ai-discovery-guide":
        "off-pai-dg",

      "personal-ai-standard-proposal":
        "off-pai-sp",

      "explore-personal-ai":
        "off-pai-eo",

      // ---------------------------------------------------------
      // AI ACCELERATOR — SOVEREIGN AI
      // ---------------------------------------------------------
      "sovereign-ai-pitchbook":
        "off-sai-pb",

      "sovereign-ai-discovery-guide":
        "off-sai-dg",

      "sovereign-ai-standard-proposal":
        "off-sai-sp",

      "explore-sovereign-ai":
        "off-sai-eo",

      // ---------------------------------------------------------
      // QUOTE / DELIVERY LANES
      // ---------------------------------------------------------
      "quote-supply-deliver":
        "off-sd-gaq",

      "quote-staff-aug":
        "off-msa-gaq"
    });

  const OFFERINGS_CONFIG =
    Object.freeze({
      namespace: "offerings",
      pageLabel: "Offerings",
      actionAttribute:
        "data-offerings-action",
      links: OFFERINGS_LINKS
    });

  function initialize(pageRoot) {
    if (
      !pageRoot ||
      !window.NexusManagedLinks
    ) {
      return;
    }

    window.NexusManagedLinks
      .initialize(
        pageRoot,
        OFFERINGS_CONFIG
      );
  }

  function refresh(pageRoot) {
    if (
      !pageRoot ||
      !window.NexusManagedLinks
    ) {
      return;
    }

    window.NexusManagedLinks
      .refresh(pageRoot);
  }

  function getConfiguredLinkKeys() {
    return Object.keys(
      OFFERINGS_LINKS
    ).map(function (action) {
      return OFFERINGS_LINKS[action];
    });
  }

  window.NexusOfferingsLinks =
    Object.freeze({
      initialize: initialize,
      refresh: refresh,
      getConfiguredLinkKeys:
        getConfiguredLinkKeys
    });
}());
</script>
