<script>
(function () {
  "use strict";

  /*
   * H2 Offerings — visually aligned THINK / BUILD / RUN catalog.
   * Every offering / product uses the existing 06_Assets managed-link runtime.
   * The catalog is read-only; links are configured centrally rather than here.
   */
  const categories = [
    { id: "ai", label: "AI", icon: "brain", color: "#435af5" },
    { id: "software", label: "SOFTWARE", icon: "software", color: "#237cf2" },
    { id: "data", label: "DATA", icon: "database", color: "#179fba" },
    { id: "cloud", label: "CLOUD", icon: "cloud", color: "#3493dd" },
    { id: "netsec", label: "NETSEC", icon: "shield", color: "#ed335b" },
    { id: "salesforce", label: "SALESFORCE", icon: "zap", color: "#f18d19" },
    { id: "managed", label: "MANAGED SERVICES", icon: "activity", color: "#209c79" }
  ];
  const stages = [
    { id: "think", label: "THINK", sub: "Assess | Plan | Design", icon: "brain" },
    { id: "build", label: "BUILD", sub: "Develop | Integrate | Modernize", icon: "layers" },
    { id: "run", label: "RUN", sub: "Operate | Manage | Optimize", icon: "activity" }
  ];
  const initialOfferings = [
    ["ai", "think", "AI Readiness Assessment", "", false, "brain"],
    ["ai", "build", "Agentic FDE", "", false, "brain"],
    ["ai", "run", "AI Ops", "", true, "brain"],
    ["software", "think", "Application Modernization", "", false, "software"],
    ["software", "build", "AI-Native Software Development", "", false, "software"],
    ["software", "run", "Application Managed Services", "(AMS)", true, "software"],
    ["data", "think", "Data Posture", "", false, "database"],
    ["data", "build", "Data Platform & Transformation", "", false, "database"],
    ["data", "run", "Managed Data Ops", "", true, "database"],
    ["cloud", "think", "Cloud Strategy", "", false, "cloud"],
    ["cloud", "build", "Cloud Engineering", "", false, "cloud"],
    ["cloud", "build", "Sovereign AI & Compute", "(KUBESHIFT – AI, DATA, CLOUD)", false, "box"],
    ["cloud", "run", "Managed Cloud Ops", "", true, "cloud"],
    ["netsec", "think", "Security Assessment", "(Post-Quantum Cryptography & VAPT)", false, "shield"],
    ["netsec", "build", "Security", "(Install & Config)", false, "shield"],
    ["netsec", "run", "Novare Vantage SOC", "", true, "shield"],
    ["salesforce", "think", "Salesforce/CRM Approach", "", false, "zap"],
    ["salesforce", "build", "Salesforce/CRM", "", false, "zap"],
    ["salesforce", "run", "Salesforce/CRM AMS", "", false, "zap"],
    ["managed", "run", "Managed Service Desk", "", false, "activity"]
  ].map(function (item, index) {
    return { id: "matrix-" + (index + 1), coe: item[0], stage: item[1], name: item[2],
      subtitle: item[3], marked: item[4], icon: item[5] };
  });
  const initialProducts = [
    { id: "product-pulse", name: "Novare Pulse" },
    { id: "product-regrep", name: "Novare RegRep" }
  ];
  const instances = new WeakMap();

  const glyphs = {
    brain: '<path d="M12 6a3.2 3.2 0 0 0-5.8-1.9 3.8 3.8 0 0 0-3 5.6 4 4 0 0 0 1 6.9A3.4 3.4 0 0 0 10 19V8.8M12 6a3.2 3.2 0 0 1 5.8-1.9 3.8 3.8 0 0 1 3 5.6 4 4 0 0 1-1 6.9A3.4 3.4 0 0 1 14 19V8.8M10 13h4"/>',
    software: '<path d="m12 2 4.5 2.6v5.1L12 12.3 7.5 9.7V4.6L12 2ZM7.5 10.5l4.5 2.6v5.1l-4.5 2.6L3 18.2v-5.1l4.5-2.6ZM16.5 10.5l4.5 2.6v5.1l-4.5 2.6-4.5-2.6v-5.1l4.5-2.6Z"/>',
    database: '<ellipse cx="12" cy="5" rx="8.2" ry="3"/><path d="M3.8 5v14c0 1.7 3.7 3 8.2 3s8.2-1.3 8.2-3V5M3.8 12c0 1.6 3.7 3 8.2 3s8.2-1.4 8.2-3"/>',
    cloud: '<path d="M7.2 19H18a4.4 4.4 0 0 0 .1-8.8 6.5 6.5 0 0 0-12.7 1.5A3.7 3.7 0 0 0 7.2 19Z"/>',
    shield: '<path d="M12 2.5 20 6v5.8c0 5-3.3 8.1-8 10.1-4.7-2-8-5.1-8-10.1V6l8-3.5Z"/>',
    zap: '<path d="m13 2-9 11h7l-1 9 10-12h-7l.0-8Z"/>',
    activity: '<path d="M2 12h4l3.2-7 5.1 14L17 12h5"/>',
    layers: '<path d="m12 2 9 5-9 5-9-5 9-5ZM3 12l9 5 9-5M3 17l9 5 9-5"/>',
    box: '<path d="m12 2 9 5v10l-9 5-9-5V7l9-5ZM3 7l9 5 9-5M12 12v10"/>',
    briefcase: '<rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V4h8v3M3 13h18"/>'
  };

  function icon(name, cls) {
    return '<svg class="' + (cls || '') + '" viewBox="0 0 24 24" aria-hidden="true" ' +
      'fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
      (glyphs[name] || glyphs.layers) + '</svg>';
  }
  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function getFiltered(state) {
    const coe = state.root.querySelector('#offerings-matrix-coe').value;
    const mark = state.root.querySelector('#offerings-matrix-status').value;
    const query = state.root.querySelector('#offerings-matrix-search').value.trim().toLocaleLowerCase();
    return state.offerings.filter(function (item) {
      if (coe !== 'all' && item.coe !== coe) return false;
      if (mark !== 'all' && (mark === 'marked') !== Boolean(item.marked)) return false;
      const category = categories.find(function (cat) { return cat.id === item.coe; });
      return !query || [item.name, item.subtitle, item.stage, category ? category.label : '']
        .join(' ').toLocaleLowerCase().includes(query);
    });
  }
  function renderOffering(item) {
    return '<button type="button" class="offerings-matrix-item" data-stage="' + item.stage + '" ' +
      'data-offerings-action="' + esc(item.id) + '" aria-label="Open ' + esc(item.name) + '">' +
      icon(item.icon, 'offerings-matrix-offering-icon') +
      '<span class="offerings-matrix-item-label"><span class="offerings-matrix-item-name">' + esc(item.name) +
      (item.marked ? '<span class="offerings-matrix-star">*</span>' : '') + '</span>' +
      (item.subtitle ? '<small>' + esc(item.subtitle) + '</small>' : '') + '</span></button>';
  }
  function renderCell(list, stage) {
    if (!list.length) return '<div class="offerings-matrix-cell offerings-matrix-cell--' + stage + '"><div class="offerings-matrix-placeholder" aria-label="No offering in this stage">—</div></div>';
    return '<div class="offerings-matrix-cell offerings-matrix-cell--' + stage + '">' + list.map(renderOffering).join('') + '</div>';
  }
  function arrowMarkup(haveFrom, haveTo, branch, purple) {
    if (!haveFrom || !haveTo) return '<div class="offerings-matrix-connector is-empty"><span>—</span></div>';
    let viewBox = '0 0 36 28';
    let path = '<path d="M3 14h24m-5-4 5 4-5 4"/>';
    if (branch === 'split') {
      viewBox = '0 0 40 64';
      path = [
        '<path d="M3 32h8c10 0 11-18 21-18h2"/>',
        '<path d="M3 32h8c10 0 11 18 21 18h2"/>',
        '<path d="m31 10 5 4-5 4"/>',
        '<path d="m31 46 5 4-5 4"/>'
      ].join('');
    }
    if (branch === 'merge') {
      viewBox = '0 0 40 64';
      path = [
        '<path d="M3 14h2c10 0 11 18 21 18h8"/>',
        '<path d="M3 50h2c10 0 11-18 21-18h8"/>',
        '<path d="m31 28 5 4-5 4"/>'
      ].join('');
    }
    return '<div class="offerings-matrix-connector' + (purple ? ' is-purple' : '') + '"><svg viewBox="' + viewBox + '" preserveAspectRatio="none" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">' + path + '</svg></div>';
  }
  function getColCounts(items) {
    return stages.map(function (stage) { return items.filter(function (i) { return i.stage === stage.id; }).length; });
  }
  function renderMatrix(state, items) {
    const counts = getColCounts(items);
    const header = '<div class="offerings-matrix-grid-header">' +
      '<div class="offerings-matrix-head-coe">' + icon('layers') + '<span>COE</span></div>' +
      stageHeading(stages[0], counts[0]) + '<div class="offerings-matrix-head-arrow">→</div>' +
      stageHeading(stages[1], counts[1]) + '<div class="offerings-matrix-head-arrow">→</div>' +
      stageHeading(stages[2], counts[2]) + '</div>';
    const rows = categories.map(function (cat) {
      const grouped = {};
      stages.forEach(function (stage) { grouped[stage.id] = items.filter(function (i) { return i.coe === cat.id && i.stage === stage.id; }); });
      const number = Object.keys(grouped).reduce(function (n, key) { return n + grouped[key].length; }, 0);
      if (!number) return '';
      const branch = grouped.build.length > 1 ? 'split' : '';
      const merge = grouped.build.length > 1 ? 'merge' : '';
      return '<div class="offerings-matrix-grid-row' + (branch ? ' has-multiple-build' : '') + '" style="--matrix-coe-color:' + cat.color + '">' +
        '<div class="offerings-matrix-coe-cell"><span class="offerings-matrix-coe-badge">' + icon(cat.icon) + '</span><span class="offerings-matrix-coe-meta"><strong>' + esc(cat.label) + '</strong><small><b>•</b> ' + number + ' offering' + (number === 1 ? '' : 's') + '</small></span></div>' +
        renderCell(grouped.think, 'think') + arrowMarkup(grouped.think.length, grouped.build.length, branch, false) +
        renderCell(grouped.build, 'build') + arrowMarkup(grouped.build.length, grouped.run.length, merge, true) +
        renderCell(grouped.run, 'run') + '</div>';
    }).join('');
    return '<div class="offerings-matrix-grid" role="region" aria-label="Think build run offerings matrix">' + header + rows + '</div>';
  }
  function stageHeading(stage, count) {
    return '<div class="offerings-matrix-stage-head is-' + stage.id + '">' + icon(stage.icon) +
      '<span class="offerings-matrix-stage-copy"><strong>' + stage.label + '</strong><small>' + stage.sub + '</small></span>' +
      '<span class="offerings-matrix-stage-count">' + count + '</span></div>';
  }
  function renderTable(items) {
    return '<div class="offerings-matrix-table-scroll"><table class="offerings-matrix-table"><caption class="offerings-sr-only">Offering catalog</caption>' +
      '<thead><tr><th>COE</th><th>STAGE</th><th>OFFERING</th><th>REFERENCE</th></tr></thead><tbody>' +
      items.map(function (item) {
        const cat = categories.find(function (c) { return c.id === item.coe; });
        return '<tr><td><span class="offerings-matrix-table-coe">' + icon(cat ? cat.icon : 'layers') + esc(cat ? cat.label : '') + '</span></td>' +
          '<td><span class="offerings-matrix-table-stage is-' + item.stage + '">' + item.stage.toUpperCase() + '</span></td>' +
          '<td><button type="button" class="offerings-matrix-table-title" data-offerings-action="' + esc(item.id) + '" aria-label="Open ' + esc(item.name) + '">' + esc(item.name) +
          (item.marked ? '*' : '') + '</button>' + (item.subtitle ? '<small>' + esc(item.subtitle) + '</small>' : '') + '</td>' +
          '<td>' + (item.marked ? 'Marked *' : 'Unmarked') + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }
  function renderProducts(state) {
    const node = state.root.querySelector('#offerings-products-grid');
    if (!node) return;
    node.innerHTML = state.products.map(function (product) {
      return '<button type="button" class="offerings-product-item" data-offerings-action="' + esc(product.id) + '" aria-label="Open ' + esc(product.name) + '">' +
        '<span class="offerings-product-icon">' + icon('briefcase') + '</span>' +
        '<span class="offerings-product-name">' + esc(product.name) + '</span></button>';
    }).join('');
  }
  function syncManagedLinks(state) {
    // Filter and view changes replace DOM buttons. Reattach the stable
    // Offerings registry keys (and resolved state) to the new controls.
    // Never call NexusManagedLinks.initialize without its page config.
    if (window.NexusOfferingsLinks && typeof window.NexusOfferingsLinks.syncRenderedLinks === 'function') {
      window.NexusOfferingsLinks.syncRenderedLinks(state.hostRoot);
    }
  }
  function render(state) {
    const items = getFiltered(state);
    const board = state.root.querySelector('#offerings-matrix-board');
    const empty = state.root.querySelector('#offerings-matrix-empty');
    const isMatrix = state.view === 'matrix';
    state.root.querySelectorAll('[data-matrix-view]').forEach(function (button) {
      const pressed = button.dataset.matrixView === state.view;
      button.classList.toggle('is-active', pressed);
      button.setAttribute('aria-pressed', String(pressed));
    });
    board.innerHTML = items.length ? (isMatrix ? renderMatrix(state, items) : renderTable(items)) : '';
    empty.hidden = items.length > 0;
    renderProducts(state);
    syncManagedLinks(state);
  }
  function initialize(hostRoot) {
    // The SPA passes its route wrapper, not the nested .offerings-page node.
    if (!hostRoot) return;
    const pageRoot = hostRoot.classList.contains('offerings-page--matrix')
      ? hostRoot : hostRoot.querySelector('.offerings-page--matrix');
    if (!pageRoot) return;
    if (instances.has(pageRoot)) { render(instances.get(pageRoot)); return; }
    const state = {
      root: pageRoot,
      hostRoot: hostRoot,
      offerings: initialOfferings,
      products: initialProducts,
      view: 'matrix'
    };
    instances.set(pageRoot, state);
    pageRoot.querySelector('#offerings-matrix-coe').addEventListener('change', function () { render(state); });
    pageRoot.querySelector('#offerings-matrix-status').addEventListener('change', function () { render(state); });
    pageRoot.querySelector('#offerings-matrix-search').addEventListener('input', function () { render(state); });
    pageRoot.addEventListener('click', function (event) {
      const button = event.target.closest('[data-matrix-view]');
      if (!button || !pageRoot.contains(button)) return;
      state.view = button.dataset.matrixView;
      render(state);
    });
    render(state);
  }
  window.NexusOfferingsMatrix = Object.freeze({ initialize: initialize });
}());
</script>
