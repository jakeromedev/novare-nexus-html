<script>
(function () {
  "use strict";

  const VALID_FILTERS = Object.freeze([
    "all",
    "pages",
    "drive",
    "folders",
    "docs",
    "sheets",
    "slides",
    "pdf"
  ]);

  const HEADER_FILTERS = Object.freeze([
    "all",
    "drive",
    "docs",
    "sheets",
    "slides"
  ]);

  const MAX_SITE_RESULTS = 18;
  const MAX_TOP_MATCHES = 6;
  const MAX_GROUP_RESULTS = 40;
  const RESULT_PAGE_SIZE = 5;

  let requestSequence = 0;

  const paginationState = {
    site: {
      items: [],
      page: 1
    },
    drive: {
      items: [],
      page: 1
    }
  };

  function normalizeFilter(value) {
    const normalized = String(value || "").trim().toLowerCase();
    return VALID_FILTERS.indexOf(normalized) !== -1
      ? normalized
      : "all";
  }

  function normalizeQuery(value) {
    return String(value || "")
      .replace(/\s+/g, " ")
      .trim()
      .slice(0, 300);
  }

  function normalizeSearchText(value) {
    return String(value || "")
      .toLowerCase()
      .replace(/[_/\\|()[\]{}:,;!?\"'`~*=<>]/g, " ")
      .replace(/[^a-z0-9+#&.\-\s]/g, " ")
      .replace(/\s+/g, " ")
      .trim();
  }

  function getRouteState() {
    const raw = String(window.location.hash || "").replace(/^#/, "");
    const questionIndex = raw.indexOf("?");
    const route =
      questionIndex === -1
        ? raw
        : raw.slice(0, questionIndex);

    const params = new URLSearchParams(
      questionIndex === -1
        ? ""
        : raw.slice(questionIndex + 1)
    );

    return {
      route: route || "",
      query: normalizeQuery(params.get("q") || ""),
      filter: normalizeFilter(params.get("type") || "all"),
      section: String(params.get("section") || "").trim()
    };
  }

  function buildSearchHash(query, filter) {
    const normalizedQuery = normalizeQuery(query);
    const normalizedFilter = normalizeFilter(filter);
    const params = new URLSearchParams();

    if (normalizedQuery) {
      params.set("q", normalizedQuery);
    }

    if (normalizedFilter !== "all") {
      params.set("type", normalizedFilter);
    }

    const queryString = params.toString();

    return "#search" + (queryString ? "?" + queryString : "");
  }

  function buildSiteTargetHash(route, anchor) {
    const safeRoute =
      String(route || "home").trim() || "home";

    const safeAnchor =
      String(anchor || "").trim();

    const params = new URLSearchParams();

    if (safeAnchor) {
      params.set("section", safeAnchor);
    }

    const queryString = params.toString();

    return (
      "#" +
      safeRoute +
      (queryString ? "?" + queryString : "")
    );
  }

  function navigate(query, filter) {
    const nextHash =
      buildSearchHash(query, filter);

    if (window.location.hash === nextHash) {
      window.dispatchEvent(
        new Event("nexus-search-route-refresh")
      );
      return;
    }

    window.location.hash = nextHash;
  }

  function navigateToSiteResult(route, anchor) {
    window.location.hash =
      buildSiteTargetHash(route, anchor);
  }

  function getPageDom(pageRoot) {
    return {
      form:
        pageRoot.querySelector("#search-page-form"),
      input:
        pageRoot.querySelector("#search-page-input"),
      filters:
        Array.from(
          pageRoot.querySelectorAll(
            "[data-search-page-filter]"
          )
        ),
      summary:
        pageRoot.querySelector("#search-results-summary"),
      loading:
        pageRoot.querySelector("#search-results-loading"),
      empty:
        pageRoot.querySelector("#search-results-empty"),
      emptyTitle:
        pageRoot.querySelector("#search-empty-title"),
      emptyCopy:
        pageRoot.querySelector("#search-empty-copy"),
      error:
        pageRoot.querySelector("#search-results-error"),
      list:
        pageRoot.querySelector("#search-results-list"),
      srStatus:
        pageRoot.querySelector("#search-results-sr-status"),

      topSection:
        pageRoot.querySelector("#search-top-matches-section"),
      topContainer:
        pageRoot.querySelector("#search-top-matches"),
      topCount:
        pageRoot.querySelector("#search-top-matches-count"),
      topCopy:
        pageRoot.querySelector("#search-top-matches-copy"),

      siteSection:
        pageRoot.querySelector("#search-site-section"),
      siteContainer:
        pageRoot.querySelector("#search-site-results"),
      siteCount:
        pageRoot.querySelector("#search-site-count"),

      driveSection:
        pageRoot.querySelector("#search-drive-section"),
      driveContainer:
        pageRoot.querySelector("#search-drive-results"),
      driveCount:
        pageRoot.querySelector("#search-drive-count")
    };
  }


  function setFilterButtons(buttons, activeFilter) {
    (buttons || []).forEach(function (button) {
      const isActive =
        button.dataset.searchPageFilter === activeFilter;

      button.setAttribute(
        "aria-pressed",
        String(isActive)
      );

      if (isActive) {
        button.setAttribute("aria-current", "true");
      } else {
        button.removeAttribute("aria-current");
      }
    });
  }

  function initialize(pageRoot) {
    if (
      !pageRoot ||
      pageRoot.dataset.searchPageInitialized === "true"
    ) {
      syncFromLocation(pageRoot);
      return;
    }

    const dom = getPageDom(pageRoot);

    if (dom.form) {
      dom.form.addEventListener(
        "submit",
        function (event) {
          event.preventDefault();

          const current = getRouteState();

          navigate(
            dom.input
              ? dom.input.value
              : current.query,
            current.filter
          );
        }
      );
    }

    dom.filters.forEach(function (button) {
      button.addEventListener(
        "click",
        function () {
          const current = getRouteState();

          navigate(
            dom.input
              ? dom.input.value
              : current.query,
            button.dataset.searchPageFilter
          );
        }
      );
    });

    window.addEventListener(
      "nexus-search-route-refresh",
      function () {
        syncFromLocation(pageRoot);
      }
    );

    pageRoot.dataset.searchPageInitialized = "true";
    syncFromLocation(pageRoot);
  }

  function syncFromLocation(pageRoot) {
    if (!pageRoot) return;

    const routeState = getRouteState();
    const dom = getPageDom(pageRoot);

    if (
      dom.input &&
      dom.input.value !== routeState.query
    ) {
      dom.input.value = routeState.query;
    }

    setFilterButtons(
      dom.filters,
      routeState.filter
    );

    syncHeaderFromRoute(routeState);

    if (!routeState.query) {
      requestSequence += 1;
      showInitialState(dom);
      return;
    }

    runSearch(
      pageRoot,
      routeState
    );
  }

  function syncHeaderFromRoute(routeState) {
    const headerInput =
      document.getElementById("global-search");

    if (
      headerInput &&
      headerInput.value !== routeState.query
    ) {
      headerInput.value = routeState.query;
    }

    const headerFilter =
      getHeaderFilterForRoute(routeState.filter);

    const filterItems =
      Array.from(
        document.querySelectorAll("[data-filter]")
      );

    filterItems.forEach(function (item) {
      item.setAttribute(
        "aria-pressed",
        String(item.dataset.filter === headerFilter)
      );
    });
  }

  function runSearch(pageRoot, routeState) {
    const dom = getPageDom(pageRoot);
    const requestId = ++requestSequence;
    const siteResults =
      searchSiteIndex(routeState.query);

    console.log(
      "[NEXUS SEARCH DEBUG] runSearch",
      {
        requestId: requestId,
        query: routeState.query,
        filter: routeState.filter,
        siteResultCount: siteResults.length,
        hasGoogleRuntime: Boolean(
          window.google &&
          google.script &&
          google.script.run
        )
      }
    );

    clearResults(dom);
    showLoading(dom, routeState);

    if (routeState.filter === "pages") {
      window.setTimeout(function () {
        if (requestId !== requestSequence) return;

        handlePagesOnlySuccess(
          dom,
          routeState,
          siteResults
        );
      }, 0);

      return;
    }

    if (
      !window.google ||
      !google.script ||
      !google.script.run
    ) {
      if (
        routeState.filter === "all" &&
        siteResults.length
      ) {
        renderAllResults(
          dom,
          routeState,
          siteResults,
          [],
          true
        );
        return;
      }

      showError(dom);
      return;
    }

    google.script.run
      .withSuccessHandler(function (response) {
        if (requestId !== requestSequence) {
          return;
        }

        console.log(
          "[NEXUS SEARCH DEBUG] searchNexus success",
          {
            requestId: requestId,
            ok: Boolean(response && response.ok),
            query: response && response.query,
            filter: response && response.filter,
            totalMatches: response && response.totalMatches,
            returned: response && response.returned,
            counts: response && response.counts,
            elapsedMs: response && response.elapsedMs,
            sample: response && Array.isArray(response.results)
              ? response.results.slice(0, 3)
              : []
          }
        );

        handleDriveSearchSuccess(
          dom,
          routeState,
          siteResults,
          response
        );
      })
      .withFailureHandler(function (error) {
        if (requestId !== requestSequence) {
          return;
        }

        console.error(
          "[NEXUS SEARCH DEBUG] searchNexus failure",
          {
            requestId: requestId,
            query: routeState.query,
            filter: routeState.filter,
            error: error,
            message: error && error.message
              ? error.message
              : String(error || "Unknown error")
          }
        );

        if (
          routeState.filter === "all" &&
          siteResults.length
        ) {
          renderAllResults(
            dom,
            routeState,
            siteResults,
            [],
            true
          );
          return;
        }

        showError(dom);
      })
      .searchNexus({
        query: routeState.query,
        filter: routeState.filter
      });
  }

  function handlePagesOnlySuccess(
    dom,
    routeState,
    siteResults
  ) {
    hideLoading(dom);

    const count = siteResults.length;

    setSummary(
      dom,
      count +
        (count === 1
          ? " page result"
          : " page results") +
        ' for “' +
        routeState.query +
        '”'
    );

    if (!count) {
      showEmpty(
        dom,
        'No page results found for “' +
          routeState.query +
          '”',
        "Try a page name, section name, offering, process, tool, or governance topic."
      );
      return;
    }

    hideEmptyAndError(dom);

    const topMatches =
      siteResults.slice(
        0,
        MAX_TOP_MATCHES
      );

    const topKeys = {};
    topMatches.forEach(function (result) {
      topKeys[
        getResultUniqueKey(result)
      ] = true;
    });

    const remainingSite =
      siteResults
        .filter(function (result) {
          return !topKeys[
            getResultUniqueKey(result)
          ];
        })
        .slice(
          0,
          MAX_GROUP_RESULTS
        );

    renderSearchPresentation(
      dom,
      {
        query: routeState.query,
        topMatches: topMatches,
        siteResults: remainingSite,
        driveResults: [],
        siteCount: count,
        driveCount: 0
      }
    );
  }


  function handleDriveSearchSuccess(
    dom,
    routeState,
    siteResults,
    response
  ) {
    const data =
      response && typeof response === "object"
        ? response
        : {};

    const driveResults =
      Array.isArray(data.results)
        ? data.results
        : [];

    hideLoading(dom);

    if (routeState.filter === "all") {
      renderAllResults(
        dom,
        routeState,
        siteResults,
        driveResults,
        false
      );
      return;
    }

    const count =
      Number(
        data.totalMatches ||
        driveResults.length ||
        0
      );

    setSummary(
      dom,
      count +
        (count === 1
          ? " result"
          : " results") +
        ' for “' +
        routeState.query +
        '”'
    );

    if (!driveResults.length) {
      showEmpty(
        dom,
        'No results found for “' +
          routeState.query +
          '”',
        getEmptyHelpText(
          routeState.filter
        )
      );
      return;
    }

    hideEmptyAndError(dom);

    const topMatches =
      driveResults.slice(
        0,
        MAX_TOP_MATCHES
      );

    const topKeys = {};
    topMatches.forEach(function (result) {
      topKeys[
        getResultUniqueKey(result)
      ] = true;
    });

    const remainingDrive =
      driveResults
        .filter(function (result) {
          return !topKeys[
            getResultUniqueKey(result)
          ];
        })
        .slice(
          0,
          MAX_GROUP_RESULTS
        );

    renderSearchPresentation(
      dom,
      {
        query: routeState.query,
        topMatches: topMatches,
        siteResults: [],
        driveResults: remainingDrive,
        siteCount: 0,
        driveCount: count
      }
    );
  }


  function renderAllResults(
    dom,
    routeState,
    siteResults,
    driveResults,
    driveUnavailable
  ) {
    hideLoading(dom);

    const total =
      siteResults.length +
      driveResults.length;

    let summary =
      total +
      (total === 1
        ? " result"
        : " results") +
      ' for “' +
      routeState.query +
      '”';

    if (driveUnavailable) {
      summary +=
        " · Some results may be unavailable";
    }

    setSummary(dom, summary);

    if (!total) {
      showEmpty(
        dom,
        'No results found for “' +
          routeState.query +
          '”',
        "Try checking the spelling, using fewer words, or searching by a page, client, project, or resource name."
      );
      return;
    }

    hideEmptyAndError(dom);

    const topMatches =
      buildTopMatches(
        siteResults,
        driveResults
      );

    const topKeys = {};
    topMatches.forEach(function (result) {
      topKeys[
        getResultUniqueKey(result)
      ] = true;
    });

    const remainingSite =
      siteResults
        .filter(function (result) {
          return !topKeys[
            getResultUniqueKey(result)
          ];
        })
        .slice(
          0,
          MAX_GROUP_RESULTS
        );

    const remainingDrive =
      driveResults
        .filter(function (result) {
          return !topKeys[
            getResultUniqueKey(result)
          ];
        })
        .slice(
          0,
          MAX_GROUP_RESULTS
        );

    renderSearchPresentation(
      dom,
      {
        query: routeState.query,
        topMatches: topMatches,
        siteResults: remainingSite,
        driveResults: remainingDrive,
        siteCount: siteResults.length,
        driveCount: driveResults.length
      }
    );
  }


  function buildTopMatches(
    siteResults,
    driveResults
  ) {
    const combined = [];

    (siteResults || []).forEach(function (result) {
      combined.push({
        source: "site",
        result: result,
        relevance:
          Number(result.relevanceScore || 0)
      });
    });

    (driveResults || []).forEach(function (result) {
      combined.push({
        source: "drive",
        result: result,
        relevance:
          Number(result.relevanceScore || 0)
      });
    });

    combined.sort(function (a, b) {
      if (b.relevance !== a.relevance) {
        return b.relevance - a.relevance;
      }

      // When scores tie, show an ONESCA navigation result before a Drive
      // result so users can discover relevant workspace sections easily.
      if (a.source !== b.source) {
        return a.source === "site" ? -1 : 1;
      }

      return 0;
    });

    const selected = [];
    let siteCount = 0;
    let driveCount = 0;

    combined.forEach(function (entry) {
      if (selected.length >= MAX_TOP_MATCHES) {
        return;
      }

      // Keep top matches useful across both sources where both exist.
      if (
        entry.source === "site" &&
        siteCount >= 3 &&
        driveResults.length
      ) {
        return;
      }

      if (
        entry.source === "drive" &&
        driveCount >= 4 &&
        siteResults.length
      ) {
        return;
      }

      const result =
        Object.assign(
          {},
          entry.result,
          {
            resultKind:
              entry.source === "site"
                ? "site"
                : "drive"
          }
        );

      selected.push(result);

      if (entry.source === "site") {
        siteCount += 1;
      } else {
        driveCount += 1;
      }
    });

    return selected;
  }

  function getResultUniqueKey(result) {
    if (
      String(result.resultKind || "") === "site"
    ) {
      return (
        "site:" +
        String(result.route || "") +
        ":" +
        String(result.anchor || "")
      );
    }

    return (
      "drive:" +
      String(result.id || result.driveUrl || result.name || "")
    );
  }

  function searchSiteIndex(queryValue) {
    const registry =
      Array.isArray(window.NexusSiteSearchIndex)
        ? window.NexusSiteSearchIndex
        : [];

    const query =
      buildSiteSearchQuery(queryValue);

    if (!query.terms.length) {
      return [];
    }

    const candidates =
      registry
        .map(function (record, index) {
          return scoreSiteRecord(
            record,
            query,
            index
          );
        })
        .filter(function (candidate) {
          return (
            candidate.score > 0 &&
            candidate.coveragePass
          );
        })
        .sort(function (a, b) {
          if (b.score !== a.score) {
            return b.score - a.score;
          }

          if (b.coverage !== a.coverage) {
            return b.coverage - a.coverage;
          }

          return a.index - b.index;
        });

    const maxScore =
      candidates.length
        ? Math.max(
            Number(candidates[0].score || 0),
            1
          )
        : 1;

    return candidates
      .slice(0, MAX_SITE_RESULTS)
      .map(function (candidate) {
        const normalizedScore =
          Math.max(
            Math.min(
              Number(candidate.score || 0) /
                maxScore,
              1
            ),
            0
          );

        const coverage =
          Math.max(
            Math.min(
              Number(candidate.coverage || 0),
              1
            ),
            0
          );

        const relevanceScore =
          Math.round(
            (
              normalizedScore * 0.72 +
              coverage * 0.28
            ) * 100
          );

        return {
          resultKind: "site",
          route:
            candidate.record.route,
          pageTitle:
            candidate.record.pageTitle,
          sectionTitle:
            candidate.record.sectionTitle,
          anchor:
            candidate.record.anchor,
          description:
            candidate.record.description,
          relevanceScore:
            relevanceScore,
          score:
            candidate.score,
          coverage:
            candidate.coverage,
          matchedTerms:
            candidate.matchedTerms
        };
      });
  }

  function buildSiteSearchQuery(value) {
    const normalized =
      normalizeSearchText(value);

    const stopWords = {
      a: true,
      an: true,
      and: true,
      are: true,
      for: true,
      from: true,
      give: true,
      i: true,
      in: true,
      is: true,
      me: true,
      of: true,
      on: true,
      or: true,
      show: true,
      the: true,
      to: true,
      want: true,
      where: true,
      with: true
    };

    const terms =
      normalized
        .split(" ")
        .filter(function (term) {
          return (
            term &&
            !stopWords[term] &&
            term.length >= 2
          );
        });

    return {
      normalized: normalized,
      terms:
        terms.filter(
          function (
            term,
            index,
            array
          ) {
            return array.indexOf(term) === index;
          }
        )
    };
  }

  function scoreSiteRecord(
    record,
    query,
    index
  ) {
    const page =
      normalizeSearchText(
        record.pageTitle
      );

    const section =
      normalizeSearchText(
        record.sectionTitle
      );

    const description =
      normalizeSearchText(
        record.description
      );

    const keywords =
      normalizeSearchText(
        Array.isArray(record.keywords)
          ? record.keywords.join(" ")
          : record.keywords
      );

    let score = 0;
    const matchedTerms = [];

    if (section === query.normalized) {
      score += 80;
    } else if (
      query.normalized &&
      section.indexOf(
        query.normalized
      ) !== -1
    ) {
      score += 42;
    }

    if (page === query.normalized) {
      score += 64;
    } else if (
      query.normalized &&
      page.indexOf(
        query.normalized
      ) !== -1
    ) {
      score += 30;
    }

    query.terms.forEach(function (term) {
      let matched = false;

      if (
        containsSearchTerm(
          section,
          term
        )
      ) {
        score += 20;
        matched = true;
      }

      if (
        containsSearchTerm(
          page,
          term
        )
      ) {
        score += 16;
        matched = true;
      }

      if (
        containsSearchTerm(
          keywords,
          term
        )
      ) {
        score += 11;
        matched = true;
      }

      if (
        containsSearchTerm(
          description,
          term
        )
      ) {
        score += 6;
        matched = true;
      }

      if (matched) {
        matchedTerms.push(term);
      }
    });

    const uniqueMatched =
      matchedTerms.filter(
        function (
          term,
          termIndex,
          array
        ) {
          return (
            array.indexOf(term) ===
            termIndex
          );
        }
      );

    const coverage =
      query.terms.length
        ? uniqueMatched.length /
          query.terms.length
        : 0;

    score +=
      Math.max(
        0,
        uniqueMatched.length - 1
      ) * 5;

    const minimumMatched =
      query.terms.length <= 1
        ? 1
        : Math.max(
            1,
            Math.ceil(
              query.terms.length * 0.5
            )
          );

    return {
      record: record,
      index: index,
      score: score,
      coverage:
        Number(
          coverage.toFixed(3)
        ),
      coveragePass:
        uniqueMatched.length >=
        minimumMatched,
      matchedTerms:
        uniqueMatched
    };
  }

  function containsSearchTerm(
    text,
    term
  ) {
    const value =
      String(text || "").trim();

    const needle =
      String(term || "").trim();

    if (!value || !needle) {
      return false;
    }

    return (
      (
        " " +
        value +
        " "
      ).indexOf(
        " " +
        needle +
        " "
      ) !== -1 ||
      value.indexOf(needle) !== -1
    );
  }

  function renderGroupedResults(
    container,
    groups
  ) {
    if (!container) return;

    container.replaceChildren();

    groups.forEach(function (group) {
      if (
        !group.results ||
        !group.results.length
      ) {
        return;
      }

      const section =
        document.createElement("section");

      section.className =
        "global-search-result-group " +
        "global-search-result-group--" +
        String(
          group.kind || "results"
        );

      const heading =
        document.createElement("div");

      heading.className =
        "global-search-result-group-heading";

      const title =
        document.createElement("h3");

      title.textContent =
        group.title;

      const count =
        document.createElement("span");

      count.textContent =
        String(
          group.count ||
          group.results.length
        );

      heading.appendChild(title);
      heading.appendChild(count);
      section.appendChild(heading);

      const items =
        document.createElement("div");

      items.className =
        "global-search-result-group-items";

      group.results.forEach(
        function (result) {
          const kind =
            String(
              result.resultKind ||
              group.kind ||
              ""
            );

          items.appendChild(
            kind === "site"
              ? createSiteResultCard(result)
              : createDriveResultCard(result)
          );
        }
      );

      section.appendChild(items);
      container.appendChild(section);
    });
  }


  function renderSearchPresentation(
    dom,
    presentation
  ) {
    resetResultZones(dom);

    const topMatches =
      Array.isArray(
        presentation.topMatches
      )
        ? presentation.topMatches
        : [];

    const siteResults =
      Array.isArray(
        presentation.siteResults
      )
        ? presentation.siteResults
        : [];

    const driveResults =
      Array.isArray(
        presentation.driveResults
      )
        ? presentation.driveResults
        : [];

    paginationState.site.items =
      siteResults.slice();

    paginationState.site.page = 1;

    paginationState.drive.items =
      driveResults.slice();

    paginationState.drive.page = 1;

    if (
      dom.topCopy &&
      presentation.query
    ) {
      dom.topCopy.textContent =
        'The most relevant results for “' +
        presentation.query +
        '”.';
    }

    if (
      topMatches.length &&
      dom.topSection &&
      dom.topContainer
    ) {
      dom.topSection.hidden = false;

      if (dom.topCount) {
        dom.topCount.textContent =
          String(topMatches.length);
      }

      topMatches.forEach(
        function (result) {
          dom.topContainer.appendChild(
            createTopMatchCard(result)
          );
        }
      );
    }

    if (
      siteResults.length &&
      dom.siteSection &&
      dom.siteContainer
    ) {
      dom.siteSection.hidden = false;

      if (dom.siteCount) {
        dom.siteCount.textContent =
          String(
            presentation.siteCount ||
            siteResults.length
          );
      }

      renderPagedResultZone(
        dom,
        "site"
      );
    }

    if (
      driveResults.length &&
      dom.driveSection &&
      dom.driveContainer
    ) {
      dom.driveSection.hidden = false;

      if (dom.driveCount) {
        dom.driveCount.textContent =
          String(
            presentation.driveCount ||
            driveResults.length
          );
      }

      renderPagedResultZone(
        dom,
        "drive"
      );
    }
  }


  function resetResultZones(dom) {
    paginationState.site.items = [];
    paginationState.site.page = 1;
    paginationState.drive.items = [];
    paginationState.drive.page = 1;

    if (dom.topContainer) {
      dom.topContainer.replaceChildren();
    }

    if (dom.siteContainer) {
      dom.siteContainer.replaceChildren();
    }

    if (dom.driveContainer) {
      dom.driveContainer.replaceChildren();
    }

    removeSearchPagination_(
      dom.siteContainer
    );

    removeSearchPagination_(
      dom.driveContainer
    );

    if (dom.topSection) {
      dom.topSection.hidden = true;
    }

    if (dom.siteSection) {
      dom.siteSection.hidden = true;
    }

    if (dom.driveSection) {
      dom.driveSection.hidden = true;
    }

    if (dom.topCount) {
      dom.topCount.textContent = "0";
    }

    if (dom.siteCount) {
      dom.siteCount.textContent = "0";
    }

    if (dom.driveCount) {
      dom.driveCount.textContent = "0";
    }
  }



  function renderPagedResultZone(
    dom,
    zone
  ) {
    const isSite =
      zone === "site";

    const state =
      paginationState[zone];

    const container =
      isSite
        ? dom.siteContainer
        : dom.driveContainer;

    const section =
      isSite
        ? dom.siteSection
        : dom.driveSection;

    if (
      !state ||
      !container ||
      !section
    ) {
      return;
    }

    const items =
      Array.isArray(state.items)
        ? state.items
        : [];

    const totalPages =
      Math.max(
        1,
        Math.ceil(
          items.length /
          RESULT_PAGE_SIZE
        )
      );

    state.page =
      Math.min(
        Math.max(
          Number(state.page || 1),
          1
        ),
        totalPages
      );

    const start =
      (state.page - 1) *
      RESULT_PAGE_SIZE;

    const end =
      Math.min(
        start +
        RESULT_PAGE_SIZE,
        items.length
      );

    container.replaceChildren();

    items
      .slice(
        start,
        end
      )
      .forEach(
        function (result) {
          container.appendChild(
            isSite
              ? createSiteResultCard(
                  result
                )
              : createDriveResultCard(
                  result
                )
          );
        }
      );

    renderSearchPagination_(
      section,
      zone,
      state.page,
      totalPages,
      start,
      end,
      items.length,
      dom
    );
  }

  function renderSearchPagination_(
    section,
    zone,
    currentPage,
    totalPages,
    start,
    end,
    totalItems,
    dom
  ) {
    if (!section) {
      return;
    }

    const existing =
      section.querySelector(
        '[data-search-pagination="' +
        zone +
        '"]'
      );

    if (existing) {
      existing.remove();
    }

    if (
      totalItems <=
      RESULT_PAGE_SIZE
    ) {
      return;
    }

    const nav =
      document.createElement("nav");

    nav.className =
      "search-pagination";

    nav.dataset.searchPagination =
      zone;

    nav.setAttribute(
      "aria-label",
      (
        zone === "site"
          ? "ONESCA Pages and Sections"
          : "Drive Results"
      ) +
      " pagination"
    );

    const info =
      document.createElement("span");

    info.className =
      "search-pagination-info";

    info.textContent =
      String(start + 1) +
      "–" +
      String(end) +
      " of " +
      String(totalItems);

    const controls =
      document.createElement("div");

    controls.className =
      "search-pagination-controls";

    controls.appendChild(
      createPaginationButton_(
        "Previous",
        currentPage - 1,
        currentPage <= 1,
        "prev",
        zone,
        dom
      )
    );

    for (
      let page = 1;
      page <= totalPages;
      page += 1
    ) {
      controls.appendChild(
        createPaginationButton_(
          String(page),
          page,
          false,
          "page",
          zone,
          dom,
          page === currentPage
        )
      );
    }

    controls.appendChild(
      createPaginationButton_(
        "Next",
        currentPage + 1,
        currentPage >= totalPages,
        "next",
        zone,
        dom
      )
    );

    nav.appendChild(info);
    nav.appendChild(controls);

    section.appendChild(nav);
  }

  function createPaginationButton_(
    label,
    targetPage,
    disabled,
    kind,
    zone,
    dom,
    isCurrent
  ) {
    const button =
      document.createElement("button");

    button.type = "button";

    button.className =
      "search-pagination-button " +
      "search-pagination-button--" +
      kind;

    button.disabled =
      Boolean(disabled);

    button.setAttribute(
      "aria-label",
      kind === "page"
        ? "Page " + label
        : label + " page"
    );

    if (isCurrent) {
      button.classList.add(
        "is-current"
      );

      button.setAttribute(
        "aria-current",
        "page"
      );
    }

    if (kind === "prev") {
      button.innerHTML =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '<path d="m15 18-6-6 6-6"></path>' +
        '</svg>' +
        '<span>Prev</span>';
    } else if (
      kind === "next"
    ) {
      button.innerHTML =
        '<span>Next</span>' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '<path d="m9 18 6-6-6-6"></path>' +
        '</svg>';
    } else {
      button.textContent = label;
    }

    button.addEventListener(
      "click",
      function () {
        if (
          button.disabled ||
          !paginationState[zone]
        ) {
          return;
        }

        paginationState[zone].page =
          targetPage;

        renderPagedResultZone(
          dom,
          zone
        );

        const section =
          zone === "site"
            ? dom.siteSection
            : dom.driveSection;

        if (section) {
          section.scrollIntoView({
            behavior:
              prefersReducedMotion()
                ? "auto"
                : "smooth",
            block: "start"
          });
        }
      }
    );

    return button;
  }

  function removeSearchPagination_(
    container
  ) {
    if (
      !container ||
      !container.parentElement
    ) {
      return;
    }

    const pagination =
      container.parentElement.querySelector(
        "[data-search-pagination]"
      );

    if (pagination) {
      pagination.remove();
    }
  }

  function createTopMatchCard(result) {
    const isSite =
      String(
        result.resultKind || ""
      ) === "site";

    const url =
      isSite
        ? ""
        : getSafeHttpUrl(
            result.driveUrl
          );

    const card =
      isSite
        ? document.createElement("button")
        : (
            url
              ? document.createElement("a")
              : document.createElement("article")
          );

    if (isSite) {
      card.type = "button";

      card.addEventListener(
        "click",
        function () {
          navigateToSiteResult(
            result.route,
            result.anchor
          );
        }
      );
    } else if (url) {
      card.href = url;
      card.target = "_blank";
      card.rel =
        "noopener noreferrer";
    }

    const theme =
      getResultTheme(result);

    card.className =
      "search-top-card " +
      "search-top-card--" +
      theme;

    card.setAttribute(
      "aria-label",
      isSite
        ? (
            "Open " +
            String(
              result.sectionTitle ||
              result.pageTitle ||
              "ONESCA page"
            )
          )
        : (
            "Open " +
            String(
              result.name ||
              "Drive item"
            )
          )
    );

    const media =
      document.createElement("span");

    media.className =
      "search-top-card-media";

    const icon =
      document.createElement("span");

    icon.className =
      "search-top-card-icon";

    icon.setAttribute(
      "aria-hidden",
      "true"
    );

    icon.innerHTML =
      isSite
        ? getSiteResultIconSvg()
        : getDriveResultIconSvg(
            result
          );

    const glow =
      document.createElement("span");

    glow.className =
      "search-top-card-glow";

    glow.setAttribute(
      "aria-hidden",
      "true"
    );

    media.appendChild(glow);
    media.appendChild(icon);

    const badge =
      document.createElement("span");

    badge.className =
      "search-top-card-badge";

    badge.textContent =
      isSite
        ? "ONESCA PAGE"
        : getShortDriveType(result);

    const title =
      document.createElement("strong");

    title.className =
      "search-top-card-title";

    title.textContent =
      isSite
        ? String(
            result.sectionTitle ||
            result.pageTitle ||
            "ONESCA"
          )
        : String(
            result.name ||
            "Untitled"
          );

    const path =
      document.createElement("span");

    path.className =
      "search-top-card-path";

    path.textContent =
      isSite
        ? String(
            result.pageTitle ||
            "ONESCA"
          )
        : (
            getDriveResultContext(
              result
            ) ||
            getDriveResultMeta(
              result
            )
          );

    const description =
      document.createElement("span");

    description.className =
      "search-top-card-description";

    description.textContent =
      isSite
        ? String(
            result.description ||
            "Open this section in ONESCA."
          )
        : getTopDriveDescription(
            result
          );

    const arrow =
      document.createElement("span");

    arrow.className =
      "search-top-card-arrow";

    arrow.setAttribute(
      "aria-hidden",
      "true"
    );

    arrow.innerHTML =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M5 12h14M13 6l6 6-6 6"></path>' +
      '</svg>';

    card.appendChild(media);
    card.appendChild(badge);
    card.appendChild(title);
    card.appendChild(path);
    card.appendChild(description);
    card.appendChild(arrow);

    return card;
  }

  function getResultTheme(result) {
    if (
      String(
        result.resultKind || ""
      ) === "site"
    ) {
      return "page";
    }

    const itemType =
      String(
        result.itemType || ""
      ).toLowerCase();

    const documentType =
      String(
        result.documentType || ""
      ).toLowerCase();

    const format =
      String(
        result.fileFormat || ""
      ).toLowerCase();

    if (itemType === "folder") {
      return "folder";
    }

    if (
      documentType === "presentation" ||
      format.indexOf("slides") !== -1 ||
      format.indexOf("powerpoint") !== -1
    ) {
      return "slides";
    }

    if (
      documentType === "ee" ||
      documentType === "spreadsheet" ||
      format.indexOf("sheet") !== -1 ||
      format.indexOf("excel") !== -1 ||
      format.indexOf("csv") !== -1
    ) {
      return "sheet";
    }

    if (
      documentType === "pdf" ||
      format === "pdf"
    ) {
      return "pdf";
    }

    return "doc";
  }

  function getShortDriveType(result) {
    const theme =
      getResultTheme(result);

    if (theme === "folder") {
      return "FOLDER";
    }

    if (theme === "slides") {
      return "PRESENTATION";
    }

    if (theme === "sheet") {
      return (
        String(
          result.documentType ||
          ""
        ).toUpperCase() === "EE"
          ? "EE"
          : "SPREADSHEET"
      );
    }

    if (theme === "pdf") {
      return "PDF";
    }

    return String(
      result.documentType ||
      "DOCUMENT"
    ).toUpperCase();
  }

  function getTopDriveDescription(result) {
    const documentType =
      String(
        result.documentType || ""
      ).trim();

    const fileFormat =
      String(
        result.fileFormat || ""
      ).trim();

    if (
      documentType &&
      fileFormat
    ) {
      return (
        documentType +
        " · " +
        fileFormat
      );
    }

    return (
      documentType ||
      fileFormat ||
      "Open this item in Drive."
    );
  }

  function createSiteResultCard(result) {

    card.type = "button";
    card.className =

        )

          result.route,

        );
      }
    );

    const icon =
      document.createElement("span");

    icon.className =
      "search-result-row-icon";

    icon.setAttribute(
      "aria-hidden",
      "true"
    );

    icon.innerHTML =
      getSiteResultIconSvg();

    const body =
      document.createElement("span");

    body.className =
      "search-result-row-body";

    const titleLine =
      document.createElement("span");

    titleLine.className =
      "search-result-row-titleline";

    const title =
      document.createElement("strong");

    title.className =
      "search-result-row-title";

    title.textContent =
      String(
        result.sectionTitle ||
        result.pageTitle ||

      );

    const badge =
      document.createElement("span");

    badge.className =

    badge.textContent =

      );

    titleLine.appendChild(title);
    titleLine.appendChild(badge);

    const description =
      document.createElement("span");

    description.className =
      "search-result-row-description";

    description.textContent =
      String(
        result.description ||

      );

    body.appendChild(titleLine);
    body.appendChild(description);

    const arrow =
      document.createElement("span");

    arrow.className =

    arrow.setAttribute(
      "aria-hidden",
      "true"
    );

    arrow.innerHTML =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M5 12h14M13 6l6 6-6 6"></path>' +
      '</svg>';

    card.appendChild(icon);
    card.appendChild(body);
    card.appendChild(arrow);

    return card;
  }


  function createDriveResultCard(result) {
    const url =
      getSafeHttpUrl(
        result.driveUrl
      );

    const card = url
      ? document.createElement("a")
      : document.createElement("article");

    card.className =
      "search-result-row " +
      "search-result-row--drive";

    card.dataset.resultType =
      String(
        result.itemType ||
        result.documentType ||
        "file"
      ).toLowerCase();

    if (url) {
      card.href = url;
      card.target = "_blank";
      card.rel =
        "noopener noreferrer";

      card.setAttribute(
        "aria-label",
        "Open " +
          String(
            result.itemType ||
            "file"
          ).toLowerCase() +
          " " +
          String(
            result.name || ""
          )
      );
    }

    const icon =
      document.createElement("span");

    icon.className =
      "search-result-row-icon";

    icon.setAttribute(
      "aria-hidden",
      "true"
    );

    icon.innerHTML =
      getDriveResultIconSvg(result);

    const body =
      document.createElement("span");

    body.className =
      "search-result-row-body";

    const titleLine =
      document.createElement("span");

    titleLine.className =
      "search-result-row-titleline";

    const title =
      document.createElement("strong");

    title.className =
      "search-result-row-title";

    title.textContent =
      String(
        result.name ||
        "Untitled"
      );

    const badge =
      document.createElement("span");

    badge.className =
      "search-result-row-badge";

    badge.textContent =
      getDriveResultBadge(result);

    titleLine.appendChild(title);
    titleLine.appendChild(badge);

    const description =
      document.createElement("span");

    description.className =
      "search-result-row-description";

    description.textContent =
      getDriveResultContext(result) ||
      getDriveResultMeta(result);

    body.appendChild(titleLine);
    body.appendChild(description);

    const arrow =
      document.createElement("span");

    arrow.className =
      "search-result-row-arrow";

    arrow.setAttribute(
      "aria-hidden",
      "true"
    );

    arrow.innerHTML =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M5 12h14M13 6l6 6-6 6"></path>' +
      '</svg>';

    card.appendChild(icon);
    card.appendChild(body);
    card.appendChild(arrow);

    return card;
  }


  function getDriveResultBadge(result) {
    const itemType =
      String(
        result.itemType || ""
      ).trim();

    if (itemType === "Folder") {
      return "Folder";
    }

    const documentType =
      String(
        result.documentType || ""
      ).trim();

    const format =
      String(
        result.fileFormat || ""
      ).trim();

    if (
      documentType &&
      format &&
      documentType !== format
    ) {
      return (
        documentType +
        " · " +
        format
      );
    }

    return (
      documentType ||
      format ||
      "File"
    );
  }

  function getDriveResultContext(result) {
    const hierarchy =
      String(
        result.hierarchyContext || ""
      ).trim();

    return (
      hierarchy ||
      String(
        result.folderPath || ""
      ).trim()
    );
  }

  function getDriveResultMeta(result) {
    const itemType =
      String(
        result.itemType || ""
      ).trim();

    if (itemType === "Folder") {
      return "Open folder in Drive";
    }

    return (
      String(
        result.folderPath || ""
      ).trim() ||
      "Open file in Drive"
    );
  }

  function getSiteResultIconSvg() {
    return (
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
      '<rect x="3" y="4" width="18" height="16" rx="2"></rect>' +
      '<path d="M3 9h18M8 4v5"></path>' +
      '<path d="M8 14h8M8 17h5"></path>' +
      '</svg>'
    );
  }

  function getDriveResultIconSvg(result) {
    const itemType =
      String(
        result.itemType || ""
      ).toLowerCase();

    const documentType =
      String(
        result.documentType || ""
      ).toLowerCase();

    const format =
      String(
        result.fileFormat || ""
      ).toLowerCase();

    if (itemType === "folder") {
      return (
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M3 6.5h6l2 2h10v9.5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"></path>' +
        '<path d="M3 9h18"></path>' +
        '</svg>'
      );
    }

    if (
      documentType === "ee" ||
      documentType === "spreadsheet" ||
      format.indexOf("sheet") !== -1 ||
      format.indexOf("excel") !== -1 ||
      format.indexOf("csv") !== -1
    ) {
      return (
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
        '<rect x="4" y="3" width="16" height="18" rx="2"></rect>' +
        '<path d="M4 9h16M9 9v12M14.5 9v12M4 15h16"></path>' +
        '</svg>'
      );
    }

    if (
      documentType === "presentation" ||
      format.indexOf("slides") !== -1 ||
      format.indexOf("powerpoint") !== -1
    ) {
      return (
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
        '<rect x="3" y="4" width="18" height="13" rx="2"></rect>' +
        '<path d="M8 21l4-4 4 4M8 9h8M8 13h5"></path>' +
        '</svg>'
      );
    }

    if (
      documentType === "proposal" ||
      documentType === "document" ||
      format.indexOf("doc") !== -1 ||
      format.indexOf("word") !== -1
    ) {
      return (
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M6 3h9l4 4v14H6z"></path>' +
        '<path d="M14 3v5h5M9 12h6M9 16h6"></path>' +
        '</svg>'
      );
    }

    if (
      documentType === "pdf" ||
      format === "pdf"
    ) {
      return (
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M6 3h9l4 4v14H6z"></path>' +
        '<path d="M14 3v5h5"></path>' +
        '<path d="M8 15h8"></path>' +
        '</svg>'
      );
    }

    return (
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M6 3h9l4 4v14H6z"></path>' +
      '<path d="M14 3v5h5M9 13h6M9 17h6"></path>' +
      '</svg>'
    );
  }

  function getSafeHttpUrl(value) {
    const raw =
      String(value || "").trim();

    if (!/^https?:\/\//i.test(raw)) {
      return "";
    }

    try {
      const parsed = new URL(raw);

      if (
        parsed.protocol !== "https:" &&
        parsed.protocol !== "http:"
      ) {
        return "";
      }

      return parsed.href;
    } catch (error) {
      return "";
    }
  }

  function applyPendingSectionTarget(
    pageRoot,
    route
  ) {
    const routeState =
      getRouteState();

    if (
      !pageRoot ||
      routeState.route !== route ||
      !routeState.section
    ) {
      return;
    }

    const target =
      pageRoot.querySelector(
        "#" +
        cssEscape(
          routeState.section
        )
      );

    if (!target) {
      console.warn(
        "[ONESCA Search] Section target not found:",
        routeState.section
      );
      return;
    }

    window.setTimeout(
      function () {
        target.scrollIntoView({
          behavior:
            prefersReducedMotion()
              ? "auto"
              : "smooth",
          block: "start"
        });

        target.classList.remove(
          "search-target-highlight"
        );

        void target.offsetWidth;

        target.classList.add(
          "search-target-highlight"
        );

        const hadTabIndex =
          target.hasAttribute(
            "tabindex"
          );

        const previousTabIndex =
          target.getAttribute(
            "tabindex"
          );

        if (!hadTabIndex) {
          target.setAttribute(
            "tabindex",
            "-1"
          );
        }

        try {
          target.focus({
            preventScroll: true
          });
        } catch (error) {
          target.focus();
        }

        window.setTimeout(
          function () {
            target.classList.remove(
              "search-target-highlight"
            );

            if (!hadTabIndex) {
              target.removeAttribute(
                "tabindex"
              );
            } else if (
              previousTabIndex !== null
            ) {
              target.setAttribute(
                "tabindex",
                previousTabIndex
              );
            }
          },
          1800
        );
      },
      80
    );
  }

  function cssEscape(value) {
    if (
      window.CSS &&
      typeof window.CSS.escape ===
        "function"
    ) {
      return window.CSS.escape(
        String(value || "")
      );
    }

    return String(value || "")
      .replace(
        /[^a-zA-Z0-9_-]/g,
        function (character) {
          return (
            "\\" +
            character
          );
        }
      );
  }

  function prefersReducedMotion() {
    return Boolean(
      window.matchMedia &&
      window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      ).matches
    );
  }

  function setSummary(
    dom,
    message
  ) {
    if (dom.summary) {
      dom.summary.textContent =
        message;
    }

    if (dom.srStatus) {
      dom.srStatus.textContent =
        message;
    }
  }

  function showInitialState(dom) {
    clearResults(dom);
    hideLoading(dom);

    setSummary(
      dom,
      "Enter a search to get started."
    );

    showEmpty(
      dom,
      "Search across ONESCA",
      "Find ONESCA pages and sections alongside Drive folders and files."
    );
  }

  function showLoading(
    dom,
    routeState
  ) {
    if (dom.error) {
      dom.error.hidden = true;
    }

    if (dom.empty) {
      dom.empty.hidden = true;
    }

    if (dom.loading) {
      dom.loading.hidden = false;
    }

    setSummary(
      dom,
      'Finding matches for “' +
        routeState.query +
        '”…'
    );
  }

  function hideLoading(dom) {
    if (dom.loading) {
      dom.loading.hidden = true;
    }
  }

  function hideEmptyAndError(dom) {
    if (dom.empty) {
      dom.empty.hidden = true;
    }

    if (dom.error) {
      dom.error.hidden = true;
    }
  }

  function showEmpty(
    dom,
    title,
    copy
  ) {
    hideLoading(dom);
    resetResultZones(dom);

    if (dom.error) {
      dom.error.hidden = true;
    }

    if (dom.empty) {
      dom.empty.hidden = false;
    }

    if (dom.emptyTitle) {
      dom.emptyTitle.textContent =
        title;
    }

    if (dom.emptyCopy) {
      dom.emptyCopy.textContent =
        copy;
    }
  }


  function showError(dom) {
    hideLoading(dom);
    resetResultZones(dom);

    if (dom.empty) {
      dom.empty.hidden = true;
    }

    if (dom.error) {
      dom.error.hidden = false;
    }

    setSummary(
      dom,
      "Search isn’t available right now."
    );
  }


  function clearResults(dom) {
    resetResultZones(dom);

    if (dom.error) {
      dom.error.hidden = true;
    }
  }


  function getEmptyHelpText(filter) {
    if (filter === "folders") {
      return "Try a client, project, opportunity, or folder name.";
    }

    if (filter === "docs") {
      return "Try a broader client or project name, or switch to All.";
    }

    if (filter === "sheets") {
      return "Try a client or project name, or search for EE, estimate, or workbook terms.";
    }

    if (filter === "slides") {
      return "Try a client, project, deck, presentation, or roadmap term.";
    }

    if (filter === "pdf") {
      return "Try a broader client, project, or document name.";
    }

    return "Try checking the spelling, using fewer words, or searching by client or project name.";
  }

  function getHeaderFilterForRoute(filter) {
    const normalized =
      normalizeFilter(filter);

    return (
      HEADER_FILTERS.indexOf(
        normalized
      ) !== -1
        ? normalized
        : "all"
    );
  }

  window.NexusSearch =
    Object.freeze({
      navigate: navigate,
      navigateToSiteResult:
        navigateToSiteResult,
      getRouteState:
        getRouteState,
      buildSearchHash:
        buildSearchHash,
      initialize:
        initialize,
      syncFromLocation:
        syncFromLocation,
      applyPendingSectionTarget:
        applyPendingSectionTarget,
      getHeaderFilterForRoute:
        getHeaderFilterForRoute,
      normalizeFilter:
        normalizeFilter,
      normalizeQuery:
        normalizeQuery,
      searchSiteIndex:
        searchSiteIndex
    });
}());
</script>
