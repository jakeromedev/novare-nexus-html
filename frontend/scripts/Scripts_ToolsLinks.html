<script>
(function () {
  "use strict";

  /*
   * ONESCA — Tools & Templates managed-link configuration
   *
   * The page already exposes readable data-tools-action values.
   * External/resource actions are mapped to the existing tt-* Asset IDs in the
   * existing 06_Assets registry.
   *
   * Internal same-page actions are intentionally excluded:
   * - view-all-templates
   * - browse-all-tools
   */

  const TOOLS_LINKS =
    Object.freeze({
      // ---------------------------------------------------------
      // SOLUTIONING TOOLKIT
      // ---------------------------------------------------------
      "discovery-template":
        "tt-dt",

      "conceptual-strategy-template":
        "tt-cst",

      "solution-blueprint-template":
        "tt-sbt",

      "bom-estimation-template":
        "tt-bet",

      "proposal-template":
        "tt-pt",

      "sow-template":
        "tt-sowt",

      "poc-pov-template":
        "tt-poc-pov-t",

      "technical-handover-checklist":
        "tt-thc",

      // ---------------------------------------------------------
      // CONNECTED DIGITAL STACK
      // ---------------------------------------------------------
      "deal-management":
        "tt-dm-open",

      "google-workspace":
        "tt-gw-open",

      "other-tools":
        "tt-ot-open"
    });

  const TOOLS_CONFIG =
    Object.freeze({
      namespace: "tools",
      pageLabel: "Tools & Templates",
      actionAttribute:
        "data-tools-action",
      links: TOOLS_LINKS
    });

  function initialize(pageRoot) {
    if (
      !pageRoot ||
      !window.NexusManagedLinks
    ) {
      return;
    }

    window.NexusManagedLinks
      .initialize(
        pageRoot,
        TOOLS_CONFIG
      );
  }

  function refresh(pageRoot) {
    if (
      !pageRoot ||
      !window.NexusManagedLinks
    ) {
      return;
    }

    window.NexusManagedLinks
      .refresh(pageRoot);
  }

  function getConfiguredLinkKeys() {
    return Object.keys(
      TOOLS_LINKS
    ).map(function (action) {
      return TOOLS_LINKS[action];
    });
  }

  window.NexusToolsLinks =
    Object.freeze({
      initialize: initialize,
      refresh: refresh,
      getConfiguredLinkKeys:
        getConfiguredLinkKeys
    });
}());
</script>
