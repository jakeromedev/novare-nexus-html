      <header id="nexus-nav-header" class="nexus-nav-header shadow-sm" data-global-nav-header>
        <button id="sidebar-toggle" class="icon-button sidebar-toggle" type="button" aria-label="Open navigation" aria-controls="nexus-sidebar" aria-expanded="false">
          <svg class="sidebar-toggle-mobile-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          <svg class="sidebar-toggle-desktop-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.35" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>

        <div class="user-profile user-profile--header-left is-loading" data-user-profile aria-label="Loading current user" aria-busy="true">
          <div id="user-avatar" class="image-placeholder avatar-placeholder" data-image-key="user-avatar" role="img" aria-label="User avatar">U</div>

          <div class="user-details">
            <span id="user-name" class="user-name">Loading...</span>
            <span id="user-email" class="user-department">Loading email...</span>
          </div>

          <button id="user-view-toggle" class="user-view-toggle" type="button" aria-label="Open View As options" aria-haspopup="menu" aria-expanded="false" aria-controls="admin-view-menu" hidden>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </button>

          <div id="admin-view-menu" class="admin-view-menu" role="menu" aria-label="View As options" hidden>
            <div class="admin-view-menu__heading">
              <div class="admin-view-menu__label">VIEW AS</div>
              <div class="admin-view-menu__hint">Preview how Nexus behaves for each role</div>
            </div>

            <button class="admin-view-option" type="button" role="menuitemradio" data-admin-view-mode="admin" aria-checked="true">
              <span class="admin-view-option__icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 19 6v5c0 5-3 8-7 10-4-2-7-5-7-10V6l7-3Z"/><path d="m9 12 2 2 4-4"/></svg>
              </span>
              <span class="admin-view-option__copy">
                <strong>Admin</strong>
                <span>Manage Nexus resources</span>
              </span>
              <span class="admin-view-option__check" aria-hidden="true">✓</span>
            </button>

            <button class="admin-view-option" type="button" role="menuitemradio" data-admin-view-mode="user" aria-checked="false">
              <span class="admin-view-option__icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="8" r="4"/></svg>
              </span>
              <span class="admin-view-option__copy">
                <strong>User</strong>
                <span>Preview the standard user experience</span>
              </span>
              <span class="admin-view-option__check" aria-hidden="true">✓</span>
            </button>
          </div>
        </div>

        <form id="global-search-form" class="global-search" role="search" novalidate>
          <svg class="global-search-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>

          <input id="global-search" type="search" aria-keyshortcuts="Control+k Meta+k" aria-label="Search ONESCA" placeholder="Search knowledge, templates, playbooks, tools..." autocomplete="off">

          <kbd class="search-keycap" aria-hidden="true">Ctrl K</kbd>

          <div id="search-filters" class="search-filters">
            <button id="mobile-filter-trigger" class="mobile-filter-trigger" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="search-filter-options" aria-label="Choose search source">
              <span id="mobile-filter-label" class="mobile-filter-label">All</span>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
            </button>

            <div id="search-filter-options" class="search-filter-options" role="group" aria-label="Search filters">
              <button class="pill filter-chip" type="button" data-filter="all" aria-pressed="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.2 4.8L19 10l-4.8 2.2L12 17l-2.2-4.8L5 10l4.8-2.2L12 3Z"/></svg>All</button>
              <button class="pill filter-chip" type="button" data-filter="drive" aria-pressed="false"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#16365B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 3 6 0 7 12-3 5H5l-3-5Zm0 0L2 15h20M15 3 8 15l3 5"/></svg>Drive</button>
              <button class="pill filter-chip" type="button" data-filter="docs" aria-pressed="false"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#168BFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h10l4 4v14H5ZM14 3v5h5M8 12h8M8 16h8"/></svg>Docs</button>
              <button class="pill filter-chip" type="button" data-filter="sheets" aria-pressed="false"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#13A765" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h10l4 4v14H5ZM14 3v5h5M8 11h8v7H8Zm4 0v7M8 14h8"/></svg>Sheets</button>
              <button class="pill filter-chip" type="button" data-filter="slides" aria-pressed="false"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FF9A14" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h10l4 4v14H5ZM14 3v5h5M8 11h8v6H8Z"/></svg>Slides</button>
            </div>
          </div>
        </form>

        <div class="notification-control">
          <button id="notification-trigger" class="notification-trigger" type="button" aria-label="Open notifications" aria-haspopup="dialog" aria-expanded="false" aria-controls="notification-panel">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>
          </button>

          <section id="notification-panel" class="notification-panel notification-panel--empty" role="dialog" aria-label="Notifications" hidden>
            <div class="notification-panel__header">
              <div>
                <span class="notification-panel__eyebrow">NEXUS</span>
                <h2>Notifications</h2>
              </div>
            </div>

            <div id="notification-list" class="notification-list" aria-live="polite">
              <div class="notification-empty-state">No notifications yet.</div>
            </div>
          </section>
        </div>

        <div id="viewing-as-chip" class="viewing-as-chip" hidden>
          <span class="viewing-as-chip__icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="3"/></svg>
          </span>
          <span class="viewing-as-chip__label">Viewing as User</span>
          <span class="viewing-as-chip__divider" aria-hidden="true"></span>
          <button id="exit-user-preview" class="viewing-as-chip__exit" type="button">Exit</button>
        </div>
      </header>
