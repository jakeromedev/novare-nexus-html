<style>
/* Styles Governance — modularized from the former monolithic Styles.html. */
    /* =========================================================
       H6 GOVERNANCE — PHASE 1
       Hero + Governance Frameworks & Guidelines
    ========================================================== */

    .governance-page {
      --gov-navy: #081A5A;
      --gov-blue: #175CEF;
      --gov-bright-blue: #286DFF;
      --gov-cyan: #11C8D6;
      --gov-teal: #08AFA7;
      --gov-purple: #7736EC;
      --gov-orange: #FF541E;
      --gov-border: #D6E7F5;
      --gov-muted: #3B5FA5;

      position: relative;
      min-width: 0;
      overflow-x: clip;
      color: var(--gov-navy);
      background:
        radial-gradient(circle at 28% 0%, rgb(34 118 255 / 5%), transparent 28%),
        #F8FCFF;
    }

    /* ---------- HERO ---------- */

    .governance-hero.page-hero[data-page-hero] {
      position: relative;
      min-height: 282px;
      overflow: hidden;
      padding: calc(var(--topbar-height) + 20px) 42px 18px;
      background: #E7F3FF;
    }

    .governance-hero.page-hero[data-page-hero]::after {
      content: none;
    }

    .governance-hero-media,
    .governance-hero-image,
    .governance-hero-fallback,
    .governance-hero-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .governance-hero-media {
      z-index: 0;
      overflow: hidden;
    }

    .governance-hero-image {
      z-index: 0;
      display: block;
      object-fit: cover;
      object-position: center 49%;
    }

    .governance-hero-fallback {
      z-index: 0;
      border: 0;
      border-radius: 0;
      color: #0D4399;
      background:
        linear-gradient(110deg, #F8FCFF 0%, #EAF6FF 38%, #BCDFFF 68%, #113A83 100%);
    }

    .governance-hero-overlay {
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(
          90deg,
          rgb(249 252 255 / 99%) 0%,
          rgb(249 252 255 / 98%) 24%,
          rgb(249 252 255 / 76%) 38%,
          rgb(244 250 255 / 15%) 56%,
          rgb(9 45 105 / 8%) 70%,
          rgb(4 27 75 / 78%) 100%
        );
    }

    .governance-hero-content {
      position: relative;
      z-index: 2;
      min-height: 230px;
    }

    .governance-hero-copy {
      width: min(43%, 615px);
      min-width: 535px;
      padding-top: 2px;
    }

    .governance-eyebrow {
      margin: 0 0 7px;
      color: #2359D9;
      font-size: .91rem;
      font-weight: 810;
      line-height: 1;
      letter-spacing: .23em;
    }

    .governance-hero-copy h1 {
      margin: 0;
      color: #091D68;
      font-size: clamp(2.45rem, 3.15vw, 3.52rem);
      font-weight: 900;
      line-height: .94;
      letter-spacing: -.044em;
    }

    .governance-hero-copy h1 > span {
      display: block;
    }

    .governance-hero-copy h1 strong {
      color: #2162F4;
      font-weight: 900;
    }

    .governance-hero-kicker {
      margin: 8px 0 0;
      color: #2052BC;
      font-size: .79rem;
      font-weight: 820;
      line-height: 1.1;
    }

    .governance-hero-description {
      max-width: 595px;
      margin: 5px 0 0;
      color: #33599E;
      font-size: .74rem;
      font-weight: 600;
      line-height: 1.26;
    }

    .governance-hero-tagline {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      color: #1B58D9;
      font-size: .67rem;
      font-weight: 820;
    }

    .governance-hero-tagline-rule {
      width: 57px;
      height: 4px;
      flex: 0 0 auto;
      border-radius: 999px;
      background: linear-gradient(
        90deg,
        #225FFF 0 25%,
        #16CBD7 26% 51%,
        #65E0A3 52% 70%,
        #FFB629 71% 100%
      );
    }

    .governance-hero-message {
      position: absolute;
      top: 6px;
      right: 0;
      display: grid;
      grid-template-columns: 5px 108px 1fr;
      column-gap: 12px;
      align-items: start;
      width: 275px;
      color: #FFFFFF;
      text-shadow: 0 2px 12px rgb(0 22 65 / 62%);
    }

    .governance-hero-message-line {
      width: 4px;
      height: 122px;
      margin-top: 2px;
      border-radius: 999px;
      background: linear-gradient(180deg, #15E1E7, #2A78FF);
      box-shadow: 0 0 9px rgb(29 216 234 / 45%);
    }

    .governance-hero-message-primary {
      display: grid;
      gap: 4px;
      padding-top: 1px;
      font-size: .68rem;
      font-weight: 790;
      line-height: 1.05;
      letter-spacing: .11em;
    }

    .governance-hero-message-script {
      display: grid;
      gap: 0;
      margin-top: 15px;
      transform: rotate(-8deg);
      font-family: "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
      font-size: .82rem;
      font-weight: 500;
      line-height: 1.08;
      color: #F4FAFF;
    }

    .governance-hero-message-script span:last-child {
      margin-top: 2px;
      color: #12D9E4;
      font-size: 1.02em;
    }

    /* ---------- FRAMEWORKS SECTION ---------- */

    .governance-frameworks-section {
      padding: 9px 20px 16px;
      background:
        linear-gradient(180deg, #FBFEFF 0%, #F8FCFF 100%);
    }

    .governance-frameworks-header {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 36px;
      padding: 0 3px 7px;
    }

    .governance-frameworks-header h2 {
      margin: 0;
      flex: 0 0 auto;
      color: #0B2C86;
      font-size: .91rem;
      font-weight: 900;
      line-height: 1;
      letter-spacing: .018em;
    }

    .governance-frameworks-rule {
      width: 45px;
      height: 4px;
      flex: 0 0 auto;
      border-radius: 999px;
      background: linear-gradient(90deg, #1767F5, #12D2DA);
    }

    .governance-frameworks-header p {
      min-width: 0;
      margin: 0;
      color: #4265A6;
      font-size: .62rem;
      font-weight: 580;
      line-height: 1.15;
    }

    .governance-frameworks-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 10px;
      align-items: stretch;
    }

    /* ---------- GOVERNANCE CARDS ---------- */

    .governance-framework-card {
      --gov-card-accent: #1A65F2;
      --gov-card-deep: #0E42BD;
      --gov-card-soft: #EAF4FF;
      --gov-card-glow: rgb(26 101 242 / 16%);

      position: relative;
      display: grid;
      grid-template-rows: 126px minmax(0, 1fr);
      min-width: 0;
      min-height: 435px;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--gov-card-accent) 22%, #D9E7F4);
      border-radius: 12px;
      background:
        linear-gradient(155deg, color-mix(in srgb, var(--gov-card-accent) 5%, white) 0%, #FFFFFF 54%, #FBFDFF 100%);
      box-shadow:
        0 5px 14px rgb(0 47 115 / 5%),
        inset 0 1px 0 rgb(255 255 255 / 84%);
    }

    .governance-framework-card.is-teal {
      --gov-card-accent: #0BB7A9;
      --gov-card-deep: #087F81;
      --gov-card-soft: #E5FAF7;
    }

    .governance-framework-card.is-blue {
      --gov-card-accent: #1766F4;
      --gov-card-deep: #0F49CC;
      --gov-card-soft: #EAF3FF;
    }

    .governance-framework-card.is-purple {
      --gov-card-accent: #7836EC;
      --gov-card-deep: #5C22CF;
      --gov-card-soft: #F1EAFF;
    }

    .governance-framework-card.is-orange {
      --gov-card-accent: #FF571F;
      --gov-card-deep: #E93C13;
      --gov-card-soft: #FFF0E8;
    }

    .governance-framework-card.is-cyan {
      --gov-card-accent: #09AFC4;
      --gov-card-deep: #07839E;
      --gov-card-soft: #E6F9FC;
    }

    .governance-card-number {
      position: absolute;
      top: 11px;
      left: 12px;
      z-index: 3;
      color: var(--gov-card-deep);
      font-size: 1.05rem;
      font-weight: 900;
      line-height: 1;
      text-shadow: 0 1px 2px rgb(255 255 255 / 90%);
    }

    .governance-card-visual {
      position: relative;
      min-width: 0;
      overflow: hidden;
      background: var(--gov-card-soft);
    }

    .governance-card-visual::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgb(255 255 255 / 0%) 50%, rgb(255 255 255 / 80%) 100%);
    }

    .governance-card-visual img,
    .governance-card-fallback {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .governance-card-visual img {
      display: block;
      object-fit: cover;
      object-position: center;
    }

    .governance-card-fallback {
      border: 0;
      border-radius: 0;
      color: var(--gov-card-deep);
      background: var(--gov-card-soft);
      font-size: .60rem;
      font-weight: 820;
    }

    .governance-card-body {
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      min-width: 0;
      padding: 10px 10px 9px;
    }

    .governance-card-body h3 {
      margin: 0;
      color: var(--gov-card-deep);
      font-size: .79rem;
      font-weight: 920;
      line-height: 1.03;
      letter-spacing: -.018em;
    }

    .governance-card-description {
      margin: 8px 0 0;
      color: #4263A0;
      font-size: .57rem;
      font-weight: 570;
      line-height: 1.18;
    }

    .governance-resource-list {
      display: grid;
      align-content: start;
      gap: 5px;
      margin: 9px 0 10px;
      padding: 0;
      list-style: none;
    }

    .governance-resource-list li {
      position: relative;
      min-width: 0;
      padding-left: 19px;
      color: #2855B1;
      font-size: .54rem;
      font-weight: 650;
      line-height: 1.1;
      overflow-wrap: anywhere;
    }

    .governance-resource-list li::before {
      content: "";
      position: absolute;
      top: .02rem;
      left: 0;
      width: 13px;
      height: 15px;
      border-radius: 2px;
      background:
        linear-gradient(145deg, var(--gov-card-accent), var(--gov-card-deep));
      box-shadow: 0 2px 4px var(--gov-card-glow);
    }

    .governance-resource-list li::after {
      content: "";
      position: absolute;
      top: 4px;
      left: 4px;
      width: 5px;
      height: 5px;
      border-left: 1.4px solid #FFFFFF;
      border-bottom: 1.4px solid #FFFFFF;
      transform: rotate(-90deg);
      opacity: .95;
    }

    .governance-card-cta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 39px;
      padding: 7px 8px;
      border: 0;
      border-radius: 8px;
      color: #FFFFFF;
      background:
        linear-gradient(135deg, var(--gov-card-accent), var(--gov-card-deep));
      box-shadow:
        0 5px 12px color-mix(in srgb, var(--gov-card-accent) 22%, transparent),
        inset 0 1px 0 rgb(255 255 255 / 18%);
      font: inherit;
      font-size: .60rem;
      font-weight: 830;
      cursor: pointer;
      transition: transform .14s ease, filter .14s ease, box-shadow .14s ease;
    }

    .governance-card-cta:hover {
      transform: translateY(-1px);
      filter: brightness(1.015);
      box-shadow:
        0 7px 15px color-mix(in srgb, var(--gov-card-accent) 27%, transparent),
        inset 0 1px 0 rgb(255 255 255 / 18%);
    }

    /* ---------- STATUS ---------- */

    .governance-status {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 96;
      max-width: min(440px, calc(100vw - 44px));
      margin: 0;
      padding: 10px 14px;
      border: 1px solid #CFE5F5;
      border-radius: 12px;
      color: #0A327F;
      background: rgb(255 255 255 / 96%);
      box-shadow: 0 12px 28px rgb(0 43 110 / 16%);
      font-size: .75rem;
      font-weight: 650;
      line-height: 1.35;
      opacity: 0;
      visibility: hidden;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease, visibility .18s ease;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .governance-status.is-visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .governance-page button:focus-visible,
    .governance-page [data-page-title]:focus-visible {
      outline: 3px solid rgb(0 121 255 / 44%);
      outline-offset: 3px;
    }

    /* ---------- RESPONSIVE ---------- */

    @media (max-width: 1450px) {
      .governance-frameworks-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .governance-framework-card {
        min-height: 420px;
      }
    }

    @media (max-width: 1320px) {
      .governance-hero.page-hero[data-page-hero] {
        min-height: 315px;
        padding-inline: 28px;
      }

      .governance-hero-copy {
        width: min(48%, 605px);
        min-width: 470px;
      }

      .governance-hero-message {
        width: 245px;
      }
    }

    @media (max-width: 1020px) {
      .governance-hero.page-hero[data-page-hero] {
        min-height: 362px;
        padding: calc(var(--topbar-height) + 22px) 22px 20px;
      }

      .governance-hero-image {
        object-position: 60% center;
      }

      .governance-hero-overlay {
        background:
          linear-gradient(
            90deg,
            rgb(249 252 255 / 99%) 0%,
            rgb(249 252 255 / 97%) 39%,
            rgb(249 252 255 / 45%) 63%,
            rgb(4 27 75 / 60%) 100%
          );
      }

      .governance-hero-copy {
        width: min(61%, 590px);
        min-width: 410px;
      }

      .governance-hero-message {
        width: 225px;
      }

      .governance-frameworks-header {
        flex-wrap: wrap;
        row-gap: 5px;
      }

      .governance-frameworks-header p {
        flex-basis: 100%;
      }

      .governance-frameworks-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 767px) {
      .governance-page {
        overflow-x: hidden;
      }

      .governance-hero.page-hero[data-page-hero] {
        min-height: 500px;
        padding: 26px 16px 18px;
      }

      .governance-hero-image {
        object-position: 69% center;
      }

      .governance-hero-overlay {
        background:
          linear-gradient(
            180deg,
            rgb(249 252 255 / 99%) 0%,
            rgb(249 252 255 / 95%) 43%,
            rgb(249 252 255 / 53%) 70%,
            rgb(4 27 75 / 34%) 100%
          );
      }

      .governance-hero-content {
        min-height: 450px;
      }

      .governance-hero-copy {
        width: 100%;
        min-width: 0;
      }

      .governance-eyebrow {
        font-size: .76rem;
      }

      .governance-hero-copy h1 {
        font-size: clamp(2.04rem, 10.5vw, 2.72rem);
      }

      .governance-hero-kicker {
        font-size: .74rem;
      }

      .governance-hero-description {
        max-width: 95%;
        font-size: .71rem;
      }

      .governance-hero-tagline {
        font-size: .62rem;
      }

      .governance-hero-message {
        display: none;
      }

      .governance-frameworks-section {
        padding: 11px 14px 18px;
      }

      .governance-frameworks-header {
        display: grid;
        grid-template-columns: auto 38px;
        gap: 6px 9px;
      }

      .governance-frameworks-header h2 {
        font-size: .80rem;
        line-height: 1.1;
      }

      .governance-frameworks-rule {
        align-self: center;
        width: 38px;
      }

      .governance-frameworks-header p {
        grid-column: 1 / -1;
        font-size: .59rem;
      }

      .governance-frameworks-grid {
        grid-template-columns: minmax(0, 1fr);
      }

      .governance-framework-card {
        grid-template-columns: minmax(120px, 34%) minmax(0, 1fr);
        grid-template-rows: minmax(250px, auto);
        min-height: 0;
      }

      .governance-card-visual {
        min-height: 250px;
      }

      .governance-card-number {
        top: 10px;
        left: 10px;
      }

      .governance-card-body {
        padding: 14px 12px 11px;
      }

      .governance-card-body h3 {
        font-size: .86rem;
      }

      .governance-card-description {
        font-size: .61rem;
      }

      .governance-resource-list li {
        font-size: .58rem;
      }

      .governance-card-cta {
        min-height: 44px;
        font-size: .64rem;
      }

      .governance-status {
        right: 12px;
        bottom: 12px;
        max-width: calc(100vw - 24px);
      }
    }

    @media (max-width: 500px) {
      .governance-framework-card {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: 175px auto;
      }

      .governance-card-visual {
        min-height: 175px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .governance-page *,
      .governance-page *::before,
      .governance-page *::after {
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }


    /* =========================================================
       H6 GOVERNANCE — PHASE 2
       Quick Access + Final Architecture Hardening
    ========================================================== */

    .governance-panel {
      position: relative;
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--gov-border);
      border-radius: 11px;
      background: rgb(255 255 255 / 97%);
      box-shadow:
        0 5px 14px rgb(0 47 115 / 4%),
        inset 0 1px 0 rgb(255 255 255 / 82%);
    }

    /* ---------- QUICK ACCESS ---------- */

    .governance-quick-access {
      margin: 0 20px 16px;
      padding: 7px 10px 9px;
    }

    .governance-quick-access-header {
      margin-bottom: 6px;
    }

    .governance-quick-access-title-group {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .governance-quick-bolt {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      flex: 0 0 auto;
      color: #1765ED;
      font-size: 1.34rem;
      font-weight: 900;
      line-height: .8;
      transform: skew(-8deg);
    }

    .governance-quick-access-title-group h2 {
      margin: 0;
      color: #0D3BB7;
      font-size: .90rem;
      font-weight: 900;
      line-height: 1;
      letter-spacing: .015em;
    }

    .governance-quick-access-title-group p {
      margin: 1px 0 0 1px;
      color: #486CA7;
      font-size: .57rem;
      font-weight: 580;
      line-height: 1.1;
    }

    .governance-quick-access-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 8px;
    }

    .governance-quick-card {
      --quick-accent: #1D6CF3;
      --quick-deep: #1551C7;
      --quick-tint: #EDF5FF;

      display: grid;
      grid-template-columns: 38px minmax(0, 1fr) 20px;
      align-items: center;
      gap: 7px;
      min-width: 0;
      min-height: 49px;
      padding: 5px 8px;
      border: 1px solid color-mix(in srgb, var(--quick-accent) 17%, #D9E8F5);
      border-radius: 10px;
      color: #0E3BB4;
      background:
        linear-gradient(
          110deg,
          color-mix(in srgb, var(--quick-accent) 4%, white),
          #FFFFFF 72%
        );
      text-align: left;
      font: inherit;
      font-size: .57rem;
      font-weight: 820;
      line-height: 1.1;
      cursor: pointer;
      box-shadow:
        0 3px 9px rgb(0 47 115 / 3%),
        inset 0 1px 0 rgb(255 255 255 / 80%);
      transition:
        transform .14s ease,
        border-color .14s ease,
        box-shadow .14s ease;
    }

    .governance-quick-card:hover {
      transform: translateY(-1px);
      border-color: color-mix(in srgb, var(--quick-accent) 38%, #D9E8F5);
      box-shadow: 0 6px 13px rgb(0 47 115 / 6%);
    }

    .governance-quick-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 35px;
      height: 35px;
      border-radius: 7px;
      color: var(--quick-deep);
      background: var(--quick-tint);
      box-shadow: inset 0 0 0 1px rgb(255 255 255 / 82%);
    }

    .governance-quick-card > span:nth-child(2) {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .governance-quick-arrow {
      justify-self: end;
      color: var(--quick-accent);
      font-size: 1.14rem;
      font-weight: 800;
      line-height: 1;
      transition: transform .14s ease;
    }

    .governance-quick-card:hover .governance-quick-arrow {
      transform: translateX(2px);
    }

    /* ---------- FINAL HARDENING ---------- */

    #governance-frameworks-title,
    #governance-quick-access-title {
      scroll-margin-top: 118px;
    }

    .governance-page button {
      -webkit-tap-highlight-color: transparent;
    }

    .governance-page button:focus-visible,
    .governance-page [tabindex="-1"]:focus-visible {
      outline: 3px solid rgb(0 121 255 / 45%);
      outline-offset: 3px;
    }

    .governance-framework-card,
    .governance-card-body,
    .governance-card-description,
    .governance-resource-list li,
    .governance-quick-card {
      min-width: 0;
    }

    .governance-card-body h3,
    .governance-card-description,
    .governance-resource-list li,
    .governance-quick-card > span:nth-child(2) {
      overflow-wrap: anywhere;
    }

    .governance-frameworks-section,
    .governance-quick-access {
      content-visibility: auto;
      contain-intrinsic-size: 1px 420px;
    }

    @media (max-width: 1220px) {
      .governance-quick-access-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

   The image extends beneath the copy instead of beginning at a hard edge.
